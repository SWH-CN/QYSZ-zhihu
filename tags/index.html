024-09-13-知拍任君斗-传武的陪形训练要点\",\"year\":\"2024\",\"title\":\"知拍任君斗---传武的陪形训练要点！\",\"date\":\"2024-09-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"常春藤冠军班其中一项训练模式（第三项训练）：就是【陪行知拍---无接触模拟格斗训练】。这种陪形知拍的实战模拟格斗训练方式，我没有在国内专业武校的训练中看到过。这个训练模式的来源，就是古代武当剑派的训练模式。彼忙我靜待，知拍任君鬥」训练要点一：双方进行模拟实战，但不接触，双方必须控制距离，避免受伤。训练要点二：本训练也是我们的“体能和耐力训练”。训练要点三：不求一下击中，关注二次攻击！\",\"url\":\"\"},{\"slug\":\"2024-09-12-女子醉酒情绪低落求安慰被男友拒绝后坠楼身\",\"year\":\"2024\",\"title\":\"女子醉酒情绪低落求安慰被男友拒绝后坠楼身亡，男友被判赔 17 万余元，男友需承担照看义务吗？有何启示？\",\"date\":\"2024-09-12\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"法院的判决挺有意思的：不说这里谁对谁错，反正法院判断的结果，意思就是每个人并不需要为自己负责，但都需要为别人负责。犯神经病的人不需要为自己的神经行为负责，但身边的人应该为她的神经行为负责！但男人也不是啥好东西，不懂得关心伴侣，很冷漠。还有：如果有这样的判决案例在先，会不会一些人，会故意的强烈的情绪不稳定。动不动就用要死要活的，来威胁自己的身边人？越不稳定就越有机会迫使对方迁就自己的一切行为？\",\"url\":\"\"},{\"slug\":\"2024-09-11-与美国教育硬刚-今日示范班VS美国百强高\",\"year\":\"2024\",\"title\":\"与美国教育硬刚：今日示范班VS美国百强高中 SAT成绩对照！\",\"date\":\"2024-09-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"四年前，今日学堂启动示范班教育，把我们【三年学完12年】的教学创举过程，一点一滴的搬到网上，公开分享出来给国人，让中国教育有机会引领世界教育的潮流。今日塾的学生，今年以11个考生超过1500分的高分（这是美国1%考生才能达到的优秀成绩）。今日示范班18个学生，总平均成绩是1458分。与美国百强高中的成绩对照（来源新东方网站）说明-----2023榜单只有学校排名。\",\"url\":\"\"},{\"slug\":\"2024-09-08-清一大学首届-太极国术专业班-教学和训练\",\"year\":\"2024\",\"title\":\"清一大学首届【太极国术专业班】教学和训练大纲!\",\"date\":\"2024-09-08\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一大学首届太极国术专业班（内部称为常春藤班，冠军班），于2024年9月9日开班。其他清一大学普通专业的学生，入学要求只是SAT1400分。这个专业未来三到四年的教学规划，就是全面充实国学和国术教育（太极格斗，冲刺全国格斗锦标赛的前三名。但清一大学可以把普通人都培养成全国冠亚军，这才是高度教学水平和拥有真正的专业技术的表现。清一大学已经成为国内的各类专业武术运动院校“更实战格斗化”的教学单位！\",\"url\":\"\"},{\"slug\":\"2024-09-07-看匡菲对KUN-KHMER的比赛-陆鸽明\",\"year\":\"2024\",\"title\":\"观匡菲战KUN KHMER：陆鸽明日柬埔寨将与之交手\",\"date\":\"2024-09-07\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我正在看🇨🇳KUANGWEI(CHINA)与KUNKHMER的比赛。红方是中国的匡菲，上过武林风，在2023年点数胜过耿春蕾。这场U2上，她出国比赛的视频中，最终输给了这个叫KUNKHMER的人。我看这场比赛的原因，是因为陆鸽今天已经到了柬埔寨，明天就要跟这个KUNKHMER交手了！我们在搜索对手视频的时候，无意中发现了她与中国拳手打过！这个中国拳手匡菲，在国内的比赛中赢了耿春蕾。\",\"url\":\"\"},{\"slug\":\"2024-09-06-好久没动股票了-8.81元卖出20多万股\",\"year\":\"2024\",\"title\":\"8.81元卖珠江回补20万股燕京：做小T，股份不减反增\",\"date\":\"2024-09-06\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天，今天就操作了一下玩儿。昨天挂单8.81元，卖出了20多万股珠江啤酒，没多想补入的事情，只是想有机会切换一下其他股票。没想到今天啤酒就普跌，当然跌得也不多，就正好做一点小T，重新买入了20万股整数的燕京啤酒！因为手上的这些珠江，本来就是原来的燕京上涨的时候换来的。两股差价不到7毛钱了，我觉得还挺划算的！昨天和今天的涨跌幅，这一笔做T的收益，不算换股的收益，至少也锁定了4000元的收益。\",\"url\":\"\"},{\"slug\":\"2024-09-05-东北发展印象-最卷-也可能最休闲的城市\",\"year\":\"2024\",\"title\":\"东北发展印象：最卷，也可能最休闲的城市！\",\"date\":\"2024-09-05\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"由于我认为东北是对中国近代史上影响很大（甚至最大）的地区，也是我党崛起和发源发展的核心地区！首先我对东北“卷死人”的竞争和生存力印象非常深-----这里的自助快餐，居然才15元一份。可是---别忘了这是东北地区----这里的人都太能吃了。一份饭的米饭，居然只有一点----ella说，东北人来泰国，恐怕要吃这样的定食八份才能够----反正ella昨天都吃了两份）。他们可能中午和早餐会吃大量的主食。\",\"url\":\"\"},{\"slug\":\"2024-08-29-2024全国自由搏击锦标赛今日在长春闭幕\",\"year\":\"2024\",\"title\":\"2024全国自由搏击锦标赛今日在长春闭幕！\",\"date\":\"2024-08-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本次自由搏击全国锦标赛，清一战队的30名队员，与本次来自全国省队，专业队，专业俱乐部的共744名专业运动员同台竞技，最终一共拿到了两块金牌，六块银牌，15块铜牌！不过相比实力比她更强的同伴，居然在预赛第一关就把四个夺金热门队员给判负出局，连铜牌的边都没摸到！当然--回国这种比赛，在重重护具之下，要Ko对手，也比在泰国要难多了！成为首个清一木兰“双冠王”（自由搏击和泰拳双全国冠军）！\",\"url\":\"\"},{\"slug\":\"2024-08-28-北京上半年规上餐饮利润同比下降88.8\",\"year\":\"2024\",\"title\":\"北京餐饮利润骤降88.8%而旅游火爆：百姓有钱还是没钱？\",\"date\":\"2024-08-28\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"北京统计局数据，2024年上半年，北京规模以上餐饮业利润总额1.8亿元，同比下降88.8%，利润率低至0.37%。但另一方面，今年旅游业却非常火爆，2024年上半年，国内出游人次27.25亿人次，同比增长14.3%，出游总花费2.73万亿，同比增长19%。这个数字，挺古怪的----老百姓到底有钱还是没钱？但老百姓的自我娱乐，里子消费，还是有的！大商人和打工仔，估计没啥事！\",\"url\":\"\"},{\"slug\":\"2024-08-27-K1大战四名夺金队员被判负-佳彦三局压着\",\"year\":\"2024\",\"title\":\"K1四夺金主力被判负：佳彦三局压打却判负，观众错愕\",\"date\":\"2024-08-27\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天开启的K1大战，我方四个夺金队员，居然在场面明显占优的情况下被判负！特别是佳彦一场对手，三局都是压着对方打的。我们以为铁定赢了---但结果却是判对方吉林队赢了，拳场观众都愣了。另外一场，霍公主场上打得很猛，多次正蹬击中对手，还直接蹬倒对方两次倒地。我们也以为这场稳赢了，结果又是判我们负！而且---我们遇到的所有的对手，都明显比我们重得多，甚至有目测重十公斤的人！\",\"url\":\"\"},{\"slug\":\"2024-08-27-青少年自由搏击全国锦标赛-公主们一金一银\",\"year\":\"2024\",\"title\":\"全国青少年搏击赛：公主们一金一银数铜，佳彦胜前冠军张扬\",\"date\":\"2024-08-27\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨天开始的青少年自由搏击全国锦标赛，公主们参加的三个级别比赛，斩获一金一银数铜（我没数出来具体的铜数量）。金牌是佳彦击败链接中看到的青少队的前冠军张扬得到的，压倒性优势取胜。另外一个公主在决战中负于对手惋惜失败只拿到银牌。双方打得很胶着，打了加时赛，差点就拿到金牌决战机会。遗憾的是不熟悉赛制，导致失败，只拿到铜牌。希望未来的三天，公主们面对数量更多的青少年对手，也能创造更好的成绩！\",\"url\":\"\"},{\"slug\":\"2024-08-26-2024全国自由搏击锦标赛第四日报道\",\"year\":\"2024\",\"title\":\"2024全国自由搏击锦标赛第四日报道！\",\"date\":\"2024-08-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨天成人自由搏击全国锦标赛已经结束。这成绩真的不算啥---不过比去年塔沟武校的参赛成绩还是要好一点。从今天开始的青少年全国锦标赛，才是我们的夺奖重心，今天就会决出全部轻接触的奖牌。公主们今天参加了三个级别九个人参赛，看他们能取得几个奖牌了！江苏队的总教练昨晚一直在抱怨：他本来是想让队员来吉林好好的秀秀本事给他的老兄弟们看看的，因为他判断今年的自由搏击国家队应该是在吉林集训！\",\"url\":\"\"},{\"slug\":\"2024-08-25-48公斤决赛明晓全面压制对手拿金牌-对手\",\"year\":\"2024\",\"title\":\"明晓48公斤决赛夺金：全面压制职业自由搏击对手\",\"date\":\"2024-08-25\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天上午48公斤的决赛，明晓全面压制对手，拿到了金牌！有清友现场看了比赛，说这个对手没有半决赛的对手厉害。她是专门打自由搏击的职业拳手，盛世人和的专业拳手。明晓说场上感觉这个对手的拳虽然频率不如吉林队的快，但重量明显比散打的吉林的队更重。是看起来猛，其实落上去力量不如职业拳手。她半决赛的对手，就是练散打出身的，虽然出拳的频率似乎比她更高，但被她抓到的有效攻击更多，所以被她打得没脾气，输掉了半决赛。\",\"url\":\"\"},{\"slug\":\"2024-08-24-全国自由搏击锦标赛第三日播报\",\"year\":\"2024\",\"title\":\"全国自由搏击锦标赛第三日播报！\",\"date\":\"2024-08-24\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本次成人组自由搏击锦标赛，清一战队拿到9块奖牌！今天48公斤级的明晓不负众望，击败了东道主---吉林省队的队员，拿到了决赛权！第三场比赛，是52公斤级的谭木兰对阵何天晴，争夺半决赛权，我们【自相残杀】。看我们明天是否能够虎口抢食成功了）另外：本次自由搏击全国锦标赛，总共报名的人数是744人（加上青少年组），为历年来最多的一届。清一大学武医学院：2024全国自由搏击锦标赛-Day1……\",\"url\":\"\"},{\"slug\":\"2024-08-23-今日系比赛全线败北-两个种子选手佳慧和许\",\"year\":\"2024\",\"title\":\"今日系K1首轮惨败：两种子佳慧许骥首战即出局，仅陆鸽晋级\",\"date\":\"2024-08-23\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天比赛爆冷门了：今日系今天的比赛全线败北，除了陆鸽拿到了半决赛的资格外，其他参赛人员，都在第一轮K1比赛中就被淘汰了。特别是我们的两个种子选手---久经战阵的佳慧和许骥，居然在K1第一战就华丽的败了。56公斤的佳慧，败给了上海体院李建文的女弟子。但更意外的是拳手许骥，打一个昨天他已经轻松战胜的拳手，我们以为今天全接触比赛。但遗憾的是：她们两人会在半决赛中相遇，只有一个人有机会去参加决赛！\",\"url\":\"\"},{\"slug\":\"2024-08-23-原来一天真不用吃太多-机场米线52一碗到\",\"year\":\"2024\",\"title\":\"机场米线52到68一碗：带公主们亲历物价，方知一日无需多食\",\"date\":\"2024-08-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"昨天上午从版纳出发飞长春，上午10点过，和六个小公主们一起吃了一碗米线。中午11点30去机场，赶飞机飞武汉，中间停留一小时，转机飞长春。在机场还笑话----机场的米钱居然是52一碗，还没8元的丰富。让公主们意识到------即使对米线来说，身处的平台也很重要。在菜场成本只能卖一两元钱的米线，因为不同的平台，价格差距很大。想想前一天，原来总共就吃了一碗米线----所以----证明人需要真不多！\",\"url\":\"\"},{\"slug\":\"2024-08-23-泰国坠机事件-5-名中国乘客遗体找到-挖\",\"year\":\"2024\",\"title\":\"泰国坠机事件 5 名中国乘客遗体找到，挖机挖了两三米发现遗体，坠机原因是什么？飞机所属酒店有哪些责任？\",\"date\":\"2024-08-23\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这就是有钱人的游戏----不惜以生命为代价！我在清迈的时候，经常看见有小型飞机，直升机在上空飞来飞去的。我说他们是有钱人，喜欢坐飞机享受这种高人一等的感觉！就订了一个直升机带他们全家去看自己拥有的葡萄园。我说：我们普通人坐的普通客机，由于营运商知道：一旦出事，别人不敢坐自己公司的飞机，他们就要破产，原来的马航就是这样：连续两次飞机失事，客人就不敢坐了。不是他们没有飞机了，两家飞机也不是啥事。\",\"url\":\"\"},{\"slug\":\"2024-08-23-第一次来东北到长春-醒来以为是清迈7点\",\"year\":\"2024\",\"title\":\"首抵长春：窗外似清迈七点，实则清晨五点，拳手六点称体重\",\"date\":\"2024-08-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"昨晚我到长春已经9点了。我是第一次来东北，长春只在书上看过，醒来看到窗外就像是清迈的7点过的样子，以为要开始工作日了。昨晚公主们就约好了要我早上8点钟给他们说说技术。今天我们有大概五场k1规则的比赛，也许我们不会这么不适应了！因为领队应老师跟我交流了一下，约好早上餐厅与队员们见面。按道理----今天是我们的优势区域----连续攻击。昨天的轻接触比赛，实在是别扭，刚开打就被叫停了。\",\"url\":\"\"},{\"slug\":\"2024-08-22-全国自由搏击锦标赛今天在长春开战-预期今\",\"year\":\"2024\",\"title\":\"全国自由搏击锦标赛今天在长春开战  预期今日到手一枚金牌\",\"date\":\"2024-08-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"全国自由搏击锦标赛今天在长春开战预期今日到手一枚金牌昨天拿到了比赛程序册。谭木兰上次只拿到了去年泰拳锦标赛的铜牌，是老木兰们的最差战绩。我们预期谭木兰将要遇到的决赛对手，是去年的自由搏击锦标赛冠军耿春蕾。（本届比赛各级别的冠亚军，可以入选中国的国家自由搏击队，去参加亚洲锦标赛。据说----国内的散打高手，想要进入职业拳赛，打昆仑决啥的，必须先拿到自由搏击锦标赛的前三名才有机会。\",\"url\":\"\"},{\"slug\":\"2024-08-22-比赛结果汇报-赛前判断一金一银一铜-实际\",\"year\":\"2024\",\"title\":\"赛事复盘：预判一金一银一铜，实得两银三铜，金牌疑遭黑哨\",\"date\":\"2024-08-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天的比赛结果汇报：赛前我判断是一金一银一铜。银牌的得主是许骥和ELLA两人，其他四个木兰，只拿到三块铜牌！因为她首轮抽签就遇到陆鸽，就主动让了比赛！但只要我们在决赛，半决赛中，就会遇到吉林省队的队员。别人是主队，而且赛前专门针对规则训练过、特别是陆鸽的一场比赛，对方实际上被打的很惨，但居然敢判陆鸽负。比去年惠州的比赛----潜规则明显多了。如果是正常的打下来，恐怕两块金牌都到手了！\",\"url\":\"\"},{\"slug\":\"2024-08-19-惠泉9.52元30多万股那笔买单是我干的\",\"year\":\"2024\",\"title\":\"惠泉9.52元30万股买单是我扫的：趁珠江上涨完成换股对冲\",\"date\":\"2024-08-19\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"必须承认：今天惠泉啤酒9.52元30多万股的这一笔买单，是我干的！当时看到有大笔的股票在压盘，正好珠江今天上涨了，两股的差价才7毛多不到0.8元了。于是果然挂单一扫掉惠泉盘面上的大单压盘，另外在8.74-8.75元卖出珠江平仓对冲风险。后来惠泉就见不到大单了，连一万股的单子都很少。申明：这不是买入惠泉，这只是做跨品种T入惠泉。如果我不是珠江啤酒涨了有换股需求，否则根本不会理会盘面的！\",\"url\":\"\"},{\"slug\":\"2024-08-16-l老子股道经第45-46章解读-磨丁周\",\"year\":\"2024\",\"title\":\"l老子股道经第45-46章解读 &磨丁周末国学讲堂第47-48章8月17日预读\",\"date\":\"2024-08-16\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"老子股道经----用道的智慧，来理解股票和金融市场，取得常胜久安的结果。有道，就能赚钱。失道---自然亏钱！请各位好好体会老子股道经以下是8月17日，周末讲堂的内容。请各位先解读为股道经！10（通行本47）不出于户，以知天下；是以圣人不行而知，不见而名，弗为而成。11（通行本48）为学者日益，闻道者日损。损之又损，以至于无为，无为而无不（以）为。及其有事也，不足以取天下。\",\"url\":\"\"},{\"slug\":\"2024-08-15-泽连司机正在成为北约的背锅侠-乌克兰进攻\",\"year\":\"2024\",\"title\":\"泽连斯基成北约替罪羊：乌克兰反攻已彻底失败，内部开始互咬\",\"date\":\"2024-08-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我很奇怪地看到：现在网上出现了非常不利于泽连司机的信息，他似乎正在成为北约集团的背锅侠。这是不是证明：乌克兰进攻俄罗斯的行动已经被认为是完全失败？乌克兰最后的努力，如同二战时候的巴登战役一样，是德国最后的垂死挣扎？挺遗憾的，多打几年，我们也多有几年的备战时间。现在乌克兰被放弃丢给俄罗斯，停战后北约目标会转向东方吗？万一北约把乌克兰作为礼物，换取俄罗斯的支持和联盟。联俄抗中，是美国最聪明的一步棋子！\",\"url\":\"\"},{\"slug\":\"2024-08-14-庄子说“道在屎溺”-是说错了还是尴尬的气\",\"year\":\"2024\",\"title\":\"庄子说“道在屎溺”，是说错了还是尴尬的气话？或者他表达的真正含义不是字面意思？\",\"date\":\"2024-08-14\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"道无处不在，我们都生活在道中，只是多数人日用而不知。既然如此，“道在屎溺”有啥奇怪的？ 你让死人拉屎试试看？没有【生命之道】，你拉得出来吗？\",\"url\":\"\"},{\"slug\":\"2024-08-14-清一战队首次出战-全国自由搏击锦标赛\",\"year\":\"2024\",\"title\":\"清一战队首次出战 全国自由搏击锦标赛！\",\"date\":\"2024-08-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"8月22日-8月29日，2024年自由搏击全国锦标赛在长春举行（含青少年组）。我们派出30个队员，绝对算是一个大队伍了！获得本次比赛前三名的拳手，可以入选中国自由搏击国家队集训。过去已经举办多届全国自由搏击锦标赛，2018年塔沟队是大赢家，共获取了四个冠军金牌。2024年的自由搏击全国锦标赛，清一战队是首次出战。能够取得这个成绩，是因为与去年年底参加泰拳全国锦标赛相比，公主战队已经培养出来了。\",\"url\":\"\"},{\"slug\":\"2024-08-14-第九讲-读心术示范-李录的思想和学员\",\"year\":\"2024\",\"title\":\"第九讲：读心术示范---李录的思想和学员心智模式解析\",\"date\":\"2024-08-14\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"十二、叶萌（已提交）今天上午的课程是继续讲李录的三十条投资建议。“生命最有价值的投资方向就是学习和提升，而且还要有行动”。学习为我们提供了知识和智慧，让我们能够更好地理解世界，并做出明智的决策。关系型人格的人以人际关系为核心，在情感上需要他人的理解和支持。山长的提问也能引导患者表达内心的真实的想法和感受并引起思考和反省。我也知道想要提升是一个长期的过程，需要不断的学习、实践、反思和积累。\",\"url\":\"\"},{\"slug\":\"2024-08-13-1984年洛杉矶奥运会-103名运动员愿\",\"year\":\"2024\",\"title\":\"1984奥运真人实验：103名运动员愿服致死药换5年无敌，荣誉高于生死\",\"date\":\"2024-08-13\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"1984年，洛杉矶奥运会，有人问当时全世界198名运动员：如果我有一种神奇的药物，能让你5年内在赛场上战无不胜，但是5年后你会死去，你愿意吃吗？运动员真的是为了荣誉而不顾生死，用生命来付出给自己最热爱的事情---超越他人。靠药物---是科学家厉害，不是自己厉害，所以是作弊。2024年全国自由搏击锦标赛即将开打，清一战队派出20多人参赛，我内定的目标----就是要求木兰们取回6块全国冠军的金牌！\",\"url\":\"\"},{\"slug\":\"2024-08-11-在磨丁讲金融高级心理行为学-分享的是思维\",\"year\":\"2024\",\"title\":\"磨丁开讲金融心理行为学：只授思维逻辑，不荐标的\",\"date\":\"2024-08-11\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"这段时间，我在磨丁特区，上【金融高级心理行为学课程】。这个课程，主要是教学员财富思维，财富心理。但目的绝对不是分享标的，而是分享我持仓的思维和逻辑，以及行业的深度背景，我认为这些才是很重要的内容。但普通人不懂啥财富思维，只关心标的和价格涨跌。此人来参加最近一周开设的【金融心理行为课程】，居然无视禁令，每天都把我讲的内容，断章取意公开发在自己的私人小群上。甚至听说还有人跳楼死亡的（不确切消息）。\",\"url\":\"\"},{\"slug\":\"2024-08-09-8.81卖珠江9.63换惠泉-差价8毛多\",\"year\":\"2024\",\"title\":\"8.81卖珠江9.63换惠泉：差价8毛低吸，余仓换低估消费股\",\"date\":\"2024-08-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天下午，8.81卖出了一些珠江啤酒，9.63换入了一些惠泉，差价8毛多钱！不过惠泉成交量太少了，所以不足的头寸，我换了其他一些我认为低估的消费股！还有高息！我认为是划算的。起码珠江7元左右的时候，我今天换入的股票，比现在价格还高两元多！一涨一跌，我应该赚了！\",\"url\":\"\"},{\"slug\":\"2024-08-08-老子股道经-第43-44章解读及45章\",\"year\":\"2024\",\"title\":\"【老子股道经】第43-44章解读及45章作业！ 8月10日\",\"date\":\"2024-08-08\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"第45章老子股道经---将在8月10日磨丁蕙兰酒店开讲！请来客继续思考，研习。提前做好【股道经】，【教育经】，【生活经】的解读！大成若缺，其用不弊。大直若屈③，大巧若拙，大辩若讷④。帛书版：大成若缺，其用不敝；大直如诎，大巧如拙，大赢如（肭），躁胜寒，靓胜炅（静胜热），请靓（清静）可以为天下正。9（通行本45）天下有道，却走马以粪；罪莫大于可欲，祸莫大于不知足，咎莫于欲得。\",\"url\":\"\"},{\"slug\":\"2024-08-06-高级财富课-金融心理行为学课程第一讲-学\",\"year\":\"2024\",\"title\":\"高级财富课：金融心理行为学课程第一讲（学员日记）\",\"date\":\"2024-08-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"昨天开启了21天的高级财富课程：金融心理行为学。因此---本期磨丁特区财富课程，就是专门给想要学习高级金融思维信念的学员开设的【金融特别课程】。以下是学员的课后总结日记，大家参考看看。这次来参加高级金钱心理行为课，是抱着蹭课和好奇心来的。想起来巴菲特说过的投资三原则：第一条保住本金；期待已久的高级金钱心理行为课终于开课了，恰好跟程校同组。十、罗小宇一、我来上高级金钱心理行为课的目标是什么？\",\"url\":\"\"},{\"slug\":\"2024-08-05-亚太股市全线暴跌-但斌发文「历史证明-恐\",\"year\":\"2024\",\"title\":\"亚太股市全线暴跌，但斌发文「历史证明，恐慌的时候买入，都没错」，你赞成这一说法吗？投资者到底该怎么做？\",\"date\":\"2024-08-05\",\"type\":\"回答\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"号称价值投资者的但斌，号称巴菲特的信徒。但在巴菲特自己都大量卖出股票，持仓多年的苹果也大量抛出，持有的现金市值差不多3000亿美金，证明巴菲特都不看好的情况下，但斌既然出来叫“抄底”？巴菲特的投资精髓思想，就是以打折的价格买入有价值的股票，然后持有。但只要价格明显超过价值，巴菲特会毫不犹疑的卖掉，甚至他还清过仓。因为他发现市场由于市场的上涨，他买不到符合他标准的股票了(以打折价格出售的好股票）。\",\"url\":\"\"},{\"slug\":\"2024-08-05-清迈公主庄园-武士荣耀夏令营-结营视频\",\"year\":\"2024\",\"title\":\"清迈公主庄园【武士荣耀夏令营】结营视频！\",\"date\":\"2024-08-05\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这个【公主班】，是12岁就专门选拔出来，为新教育定向培养的【未来师资班】，现在她们已经16-18岁了。与公主班齐名的新教育班级是【今日示范班】，这个班是超级学霸班，学习目标是进入常春藤大学（见B站的学习视频）。小公主们分别在清迈开设了【武士荣耀体验夏令营】，以及【新生招生夏令营】。2024清迈公主庄园夏令营由于今年报名参加公主夏令营的学生太多，因此今年清迈的夏令营分为两个庄园举行。\",\"url\":\"https://www.zhihu.com/video/1803710491710869504\"},{\"slug\":\"2024-08-04-国家队训练好无语-怪不得中国格斗运动员打\",\"year\":\"2024\",\"title\":\"国家队训练好无语：怪不得中国格斗运动员打三回合比赛体能都撑不住！\",\"date\":\"2024-08-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"国家体育总局，已经通知了我们的队员入选通知，准备10月份前后，回国集训两个月。因为几个月前，为了备战泰拳世锦赛，他们回国备战了一个多月（后来中国国家体育总局因为准备不足，放弃了参加今年的泰拳世界锦标赛——）。虽然我们的队员体能表现很优秀，女队员都不输给男队员，比其他队伍的女队员强太多了。我看了这个散打的体能训练，完全就是瞎搞----根本就不符合格斗的需要！怪不得中国的运动员会在比赛的赛场上猝死！\",\"url\":\"\"},{\"slug\":\"2024-08-04-郑钦文首闯奥运决赛-培养费超2000万靠\",\"year\":\"2024\",\"title\":\"郑钦文奥运决赛：2000万培养费卖房强撑，职业化含金量高于举国体制\",\"date\":\"2024-08-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"首次参加奥运会就闯入决赛，郑钦文这一路经历了什么，如何评价她的实力？为了培养她要付超2000万得培养费，靠卖房强撑才度过难关，父亲郑建坪也是运动员出身，算是为了自己的女儿豪赌了一把。首次参加奥运会就闯入决赛，郑钦文这一路经...羽毛球的职业含金量很高，氪金的程度不是举国体制能够比的。每年几十万元的训练费，真的父亲到极致了！中国的奥运举国堆钱体制，似乎对这种真正职业化的运动项目无解！\",\"url\":\"\"},{\"slug\":\"2024-08-03-老子道德经第44章-武功版本的解读\",\"year\":\"2024\",\"title\":\"老子道德经第44章：武功版本的解读！\",\"date\":\"2024-08-03\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"道德经，用于任何领域，都能让我们获取无穷的智慧，这里仅仅示范一种解读方式：用来理解中华武术和武功！以下就是8月3日磨丁周末国学讲堂的PPT。供大家一览！（其他内容还有金融版，教育版，生活版等等，就不一一放上来了。大家当玩笑看看就行了。没必要较真！\",\"url\":\"\"},{\"slug\":\"2024-08-02-奥运女拳手疑被“跨性别对手”-46-秒打\",\"year\":\"2024\",\"title\":\"奥运女拳手疑被“跨性别对手” 46 秒打退赛，奥委会「选手合规，性别以护照为依据」，这合理吗？\",\"date\":\"2024-08-02\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这个男人去打女子比赛，不说别的理由，只是从荣誉来讲，奥运会是一个争取荣誉的运动会，不是为了赚钱去的。这些男人，假装女人去参加奥运比赛，这种金牌，就算拿到手了，又有多大的荣誉呢？打赢了没脸---被别人笑话，投机取巧，甚至要换性别去打比赛。我们的女拳手到时候就可以击败男子同级别的冠军了！对于木兰拳手来说，难度不是男生造成的，而是现在的格斗法规，不允许男拳手和女拳手格斗。\",\"url\":\"\"},{\"slug\":\"2024-08-02-首次换入华润啤酒24.05元-当年16元\",\"year\":\"2024\",\"title\":\"24.05元首换华润啤酒：悔16元未买龙头，后涨至78元方知错\",\"date\":\"2024-08-02\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"今日首次换入一点华润啤酒：入手价格24.05元。当年华润16元多，我居然没有买入低价的华润长期持有，一直怪我笨蛋思维，没有买龙头。后来看他一路居然涨到78元，目瞪口呆，居然就涨了五倍多。现在华润高位跌落，连续跌了几年，我就首次开始买入一丢丢---几万股，象征意义。中国的几大啤酒公司，都持有一点，当做可口可乐一样长期放起来，也许就像巴菲特一样持有可乐30多年，传为佳话呢？\",\"url\":\"\"},{\"slug\":\"2024-08-01-磨丁蕙兰-周末国学讲堂道德经43-44讲\",\"year\":\"2024\",\"title\":\"磨丁蕙兰：周末国学讲堂道德经43-44讲  8月3日\",\"date\":\"2024-08-01\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"磨丁蕙兰：周末国学讲堂道德经43-44讲8月3日帛书版6（通行本43）无为天下之至柔，驰骋于天下之致坚；帛书版7（通行本44）得失名与身孰亲？作业一：43章【无为】，并不是无所作为。无为是天下之大道，看起来简单，但本质上是极其难达到的水平。请用简单的语言来翻译此章，并把此章的内容，解读成【老子股经】和【老子教育经】。我们都是在日常生活中必须拥有的价值判断！\",\"url\":\"\"},{\"slug\":\"2024-07-30-今日系新教育的特征-融合式教育以人为本\",\"year\":\"2024\",\"title\":\"清一融合式教育：以人为本重信念，博士十年难毕业但成通才\",\"date\":\"2024-07-30\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"今日系新教育的特征，是融合式的教育，强调以人为本的多学科合一的教育。只是---这种东方式教育，培养周期很长，强调信念和行为的培养，而不仅仅是知识系统。清一大学的博士学生，可能十年也无法【毕业】。但一旦培养出来，肯定是一个真正的跨学科通才，比五个西方大学专业的学生更加融通和全面。欧洲人不指望出来一个辛弃疾似的人，会写诗、会书法、会打仗、会发明、有道德、有情操的人，这一般人做不到。\",\"url\":\"\"},{\"slug\":\"2024-07-27-道德经-第42章-道生一-的清一版翻译和\",\"year\":\"2024\",\"title\":\"道德经：第42章【道生一】的清一版翻译和解释！\",\"date\":\"2024-07-27\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"是“吾道甚易知，甚易行”的，如果有人把道德经解释得神神秘秘，神神叨叨，恍恍惚惚的，不管说得有多高大上，你都可以马上肯定：这种所谓的专家，要么是骗子，要么是傻瓜。因此，如果你看的道德经的版本，居然让你看不懂，你就要毫无犹豫的打开它，远离骗子和傻瓜！只有让你一看就开悟：喔，老子原来是这个意思，真的太有道理了！以下是道德经42章---【生命版】的解说：道生一：（一，是代指世界上【任何具体事物】的代称。\",\"url\":\"\"},{\"slug\":\"2024-07-26-海归女硕士杀害的父亲的背后透露了哪些信息\",\"year\":\"2024\",\"title\":\"海归女硕士杀害的父亲的背后透露了哪些信息?\",\"date\":\"2024-07-26\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一个保安家庭，居然花几百万供养女儿去留学海外？两个教训：一个教训是，教育，绝对不是投入越多，回报越大的。第二个教训就是：对子女付出爱，不是把全部的生命和财富都付出了，就能得到爱。爱，责任和荣誉，理想和目标，这些内容，是传统学校不教的。上等的学校，教的是【信念教育】。看上去没啥内容，但这些内容是一生的支撑！这种学校是【无人地带】---从小到大，学校都不教做人的基本道理，不教信念，不教行为举止。\",\"url\":\"\"},{\"slug\":\"2024-07-25-买入10万股天山铝业6.57元-8.7元\",\"year\":\"2024\",\"title\":\"6.57元回补10万股天山铝业：用8.7元上方利润锁定部分筹码\",\"date\":\"2024-07-25\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"刚刚买入了10万股天山铝业，6.57元买入的。前段时间8.7元上方抛掉了大批的天山（m级别），没想到多赚了两百多万，现在良心不安，起码用利润补回来一点筹码。其实---当时卖出，也不是不看好天山后续了---就是觉得涨多了，就卖掉一些肯定没错的。反正市场还有一些没涨的股，我可以去慢慢买。没想到天山居然逃了一个顶，啤酒抄了一个底。燕京也是一样的，我在9.7元卖掉了几十万股。\",\"url\":\"\"},{\"slug\":\"2024-07-25-磨丁蕙兰-周末国学讲堂-道德经第42章\",\"year\":\"2024\",\"title\":\"磨丁蕙兰：周末国学讲堂 道德经第42章 （7月27日）\",\"date\":\"2024-07-25\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"帛书版老子4（通行本42）道生一，一生二，二生三，三生万物。作业一：这一段，是讲天道在人世间的实际表现情况。翻译范例模式-----神秘的道，生了某某这个【一】，而【一】产生了【##」和【##】这两种东西，这两种东西在一起就产生了第三种东西【##】。作业二：请把本章（42章）的全部内容，都解说成【老子股经】。本周周末讲堂，将会现场抽取学员上去解说自己的版本，请参与者提前做好心理准备！\",\"url\":\"\"},{\"slug\":\"2024-07-21-求问篇｜关于-道德经-的诸多疑惑-希望得\",\"year\":\"2024\",\"title\":\"求问篇｜关于《道德经》的诸多疑惑，希望得到指点？\",\"date\":\"2024-07-21\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"关于道德经的读法：如果第一句读不懂，理解不了，后面的就不要读了。这个回答里面“专家”很多，弄出很多玄怪的说法，似乎不把道德经弄得奇奇怪怪的，就不配当专家一样。实际上，道德经不是文人拿来玩文字的东西，而是用在我们日常生活实践中的人间指南！道德经如果你都读不出简单易懂，“原来如此”的惊喜，你就没读懂道德经！用自己的思维和局限来看道德经，就是【天下莫能知，莫能行】了。非要弄得奇奇怪怪的去理解道德经吗？\",\"url\":\"\"},{\"slug\":\"2024-07-19-磨丁蕙兰周末国学讲堂-老子第40-41章\",\"year\":\"2024\",\"title\":\"磨丁蕙兰周末国学讲堂【老子第40-41章】7月20日\",\"date\":\"2024-07-19\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"世传本：第40章王弼《道德经注》反者道之动，高以下为基，贵以贱为本，有以无为用，此其反也。作业一：你怎样在生活实践中，运用【反者道之动】的原则，来帮助实现你的人生目标？（如果你的目标是赚大钱，获得爱与自由，获得尊重和地位？）作业二：如何用【弱者道之用】的法则，来决定你的人际交往法则？在【鱿鱼游戏】这个电视剧中，谁的行为举止，体现出了【弱者道之用】的最大特点？\",\"url\":\"\"},{\"slug\":\"2024-07-18-本科老师师母去世-我回复老师-师母灵魂不\",\"year\":\"2024\",\"title\":\"慰唁本科恩师：师母灵魂不灭，来世缘分未尽终将重逢\",\"date\":\"2024-07-18\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"原来本科专业的老师，师母去世了，老同学告诉我消息。我回复给老师的信息是：【老师：师母的灵魂是不死的。老师可以学庄子一样，祝福师母从病体中解脱[抱拳]。现在不需要多想过去，可以活在当下---为你们的未来重逢做准备。另外---老师有空就多看看【与神回归]，这部书籍讲的死亡的秘密，与我们的一些实证检验案例是一致的，不是虚妄的故事。】这是我现在唯一能够送给老师的礼物了---他现在特别需要的礼物。\",\"url\":\"\"},{\"slug\":\"2024-07-16-8.35-8.36卖珠江-9.24-9\",\"year\":\"2024\",\"title\":\"珠江换惠泉：两股差价仅0.9元低吸，超1.2元即止盈换股\",\"date\":\"2024-07-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今日操作：8.35-8.36元卖出珠江啤酒，9.24-9.25元买入等股份的惠泉啤酒。理由:两股差价目前仅仅0.9元，很值得换！上期两股差价达到0.9元-1.15元时候用的珠江换燕京，目前两股差价已经1.4元了。差价超过1.2元就停止换股。差价多过2.0-3.0元就反向换股！不断赚这种小小钱，集小胜为大胜！大涨大卖，小涨小卖，不涨不卖！随便玩一把差价，就赚了工人几年的工资。\",\"url\":\"\"},{\"slug\":\"2024-07-12-心理行为课程第一讲-找到支撑你一生行为的\",\"year\":\"2024\",\"title\":\"心理行为课程第一讲：找到支撑你一生行为的信念！\",\"date\":\"2024-07-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"2024年新版：体验试课程，帮助学员修改自己的信念系统。而不是上课，记笔记，学一大堆自己也不懂的概念！心理行为课程，第一讲支撑你生命的核心信念系统是什么？也许你一生也无法实现你的理想，但人就是在“痛”中前进的，在失败和失望中，最终走完一生。现在刘老师开始转移信念——把自我成就放在自己的生命追求榜单上，她开始成为完全不同的人。改变了一个这样的核心支撑信念，就改变了一个人的命运！\",\"url\":\"\"},{\"slug\":\"2024-07-11-低端人群太卷因为机器在代替他们-武汉自动\",\"year\":\"2024\",\"title\":\"低端人群内卷因机器替代：武汉自动驾驶试运行，司机饭碗不保\",\"date\":\"2024-07-11\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"低端人群太卷了，因为机器正在代替他们！武汉自助驾驶车已经开始试运行。以后司机没饭吃了------这是早在8年前就已经预判了的事实，可是中国这些行业相关人士就是不相信，不改变，非要死在这里才行。未来体制教育一定遇到巨大的困境----因为教出来的人找不到工作！看到武汉出租车公司要求政府限制无人驾驶汽车的公开信。低端人群真可怜----人工智能正在快速取代这些不会动脑子的低级人员！\",\"url\":\"\"},{\"slug\":\"2024-07-11-珠江涨停市值浮盈创记录-珠江与燕京惠泉差\",\"year\":\"2024\",\"title\":\"珠江涨停浮盈创新高：与燕京惠泉差价不足9毛，趁机换股\",\"date\":\"2024-07-11\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"本来不想动的，但看到珠江与燕京和惠泉的差价，居然9毛钱不到了，这种价格，干嘛不换呀？虽然珠江不到8元，价格不算高，我也没赚到啥大钱？接下来----我看珠江的涨停版居然给破了----好吧，我承认是我干的，很抱歉。燕京又重新回到持仓量第一位了，惠泉大约又挤进去十大了。闭市后，看了一下原因：大概是珠江盈喜带来的涨停。如果珠江利润大涨，别的处在上升期的啤酒也会涨的--比如燕京----所以我应该换对了。\",\"url\":\"\"},{\"slug\":\"2024-07-11-金龙鱼市值1440.4亿-从40元涨到1\",\"year\":\"2024\",\"title\":\"金龙鱼复盘：从40元炒到144元超万亿市值，实无技术含量不碰\",\"date\":\"2024-07-11\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"总市值1440.4亿（这个市值很有意思）。几年前，金龙鱼上市，居然从40元一路涨到144元，最高市值超过万亿。它做的东西谁都会做，不明白这个高的市值有啥意义。炒金龙鱼---你家请客会用一箱金龙油来款待客人吗？所以----没有技术，没有市场，但国人居然捧的高高的，一路往上走。每天大量的成交量，让我觉得中国的钱就是不值钱！才让我注意到早已忘记的金龙鱼----这几年一路下降。\",\"url\":\"\"},{\"slug\":\"2024-07-10-养老账户用珠江换燕京-两股差价跌到1.1\",\"year\":\"2024\",\"title\":\"养老账户珠江换回燕京：两股差价收窄至1.15元，燕京利润领跑\",\"date\":\"2024-07-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天我操作了一下养老账户上，原来用燕京换了很多珠江，燕京减仓很多。账面利润喜人，是该账户最高盈利的股票。但珠江的总利润要差很多，因为总在高价买入，低价卖出（换股）。昨天我就用比前段时间卖进来更低的价格，卖出了几十万股珠江啤酒，换了几十万股燕京回来。这种情况下，我认为持有燕京才是正确的选择。1030看了一下，燕京居然就涨起来了，每股赚了3毛钱？可惜与珠江的差距已经大于1.2元，不符合换股条件了。\",\"url\":\"\"},{\"slug\":\"2024-07-10-磨丁国学讲堂-道德经讲记第38讲-上德不\",\"year\":\"2024\",\"title\":\"磨丁国学讲堂：道德经讲记第38讲 上德不德  （记录者---何天晴）\",\"date\":\"2024-07-10\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"磨丁国学讲堂：道德经讲记第38讲上德不德（记录者---何天晴）自山长上一次讲道德经起，已经过了十几年了。现在，在摩丁的清粉社区，山长又重新开始了讲解道德经的国学讲堂！本来，山长的培训课都是不对外开放的，特别是讲道德经的这种高级课程，连内部的学生都没怎么听过。道经讲的是道家做事的基本原则，德经则讲的是如何实操。带着这个思路，道德经可以运用到生活的任何地方，比如用到教育上，就是“上教不教”；……\",\"url\":\"https://zhuanlan.zhihu.com/p/707141919\"},{\"slug\":\"2024-07-10-磨丁蕙兰周末国学讲堂-道德经第39章-得\",\"year\":\"2024\",\"title\":\"磨丁蕙兰周末国学讲堂：道德经第39章：得一篇（2024年7月13日下午开讲）\",\"date\":\"2024-07-10\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"我认为：听懂了道德经，价值远远高于你的付出，价值百万千万不为过。我希望来参与道德经讲堂的人，都事先做做功课。去弄懂老子的思想，磨丁讲堂的特点，是特别强调“学以致用”。以下是本讲座的作业：作业一：请你把道德经39章，翻译成现代汉语（可理解的简单语言）。案例示范我的翻译示范，道德经38讲的翻译实例：（有兴趣者去对比看看各种“文化大师们”此章的翻译讲解，绝对比我翻译要复杂，各位可能看了也看不懂。\",\"url\":\"\"},{\"slug\":\"2024-07-05-磨丁特区-国学讲堂老子38章-苏辙-老子\",\"year\":\"2024\",\"title\":\"磨丁特区：国学讲堂老子38章   苏辙《老子解》参考\",\"date\":\"2024-07-05\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"磨丁特区：国学讲堂老子38章苏辙《老子解》参考请本周磨丁来参加国学讲堂的人，提前自我修学古人的老子解读。并拿出你自己的思考和你如何用老子思想，指导你在现实生活中更有智慧的生活！为了帮助大家理解，我特别提供了宋朝三大才子之一的苏辙的解读，各位也可以自己找合适的版本学习，但当代人的解读就算了。但它不是真正的文化和思想，哲学的学派】苏辙《老子解》上德不德，是以有德；……\",\"url\":\"\"},{\"slug\":\"2024-07-03-120年的灯泡与太阳神联盟-质量太好导致\",\"year\":\"2024\",\"title\":\"亮了120年的灯泡：质量太好逼死厂商，太阳神联盟限寿1000小时\",\"date\":\"2024-07-03\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"美国加州福利摩尔有一个消防局，里面有一个灯泡，这个灯泡从1901年一直亮着，亮了120年，生产这个灯泡的谢尔比公司，就是因为他们生产的灯泡质量太好，所以在1925年倒闭了，在此之后美国五大灯泡厂商组成了一个价格联盟，叫做太阳神，其中最重要的一条规定就是所有场上的灯泡寿命军不能超过1000小时。消费者就不得不每隔一段时间换一个灯泡，那么五大厂商就可以有源源不断地钱赚了。\",\"url\":\"\"},{\"slug\":\"2024-06-30-美国全胜战绩的顶尖踢拳手-惨败给泰拳扫腿\",\"year\":\"2024\",\"title\":\"美国全胜战绩的顶尖踢拳手，惨败给泰拳扫腿的历史记录！\",\"date\":\"2024-06-30\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"美方是28战全胜的美国踢拳界最顶尖的高手。刚开始的确泰拳手很吃亏，连连中招，还被击倒读秒，看起来完全不是美国踢拳手的对手。但泰拳手吃亏后，很快就发现了美国拳手的弱点：不会防泰扫。美国踢拳手使用的腿法，源头来自于日本的空手道腿法。这种腿法技术，与中国的传武的腿法也差不多。但泰拳手使用胫骨扫踢后，低扫攻击大腿的技术就不断给美国拳手积累伤害。没想到一个简单的泰式扫腿，就克制了美国顶尖高手的全部格斗技术！\",\"url\":\"\"},{\"slug\":\"2024-06-27-泰国的婚礼实况\",\"year\":\"2024\",\"title\":\"泰国的婚礼实况\",\"date\":\"2024-06-27\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"我们在泰国有两家公司，也有一群专属的建筑工人，长期为我们工作。并说泰国结婚有三天时间，但他只请假一天，其他两天还是来工地干活。我就跟管理这些泰国人的助理宋老师说：你告诉他可以休息三天。结果宋老师去后，完全出乎我们的想象：她们的婚礼，就是亲人祝福一下。以下是我的泰国事务助理宋老师去参加婚礼后的回报伙伴们好，昨天去参加了工头儿子WEN的婚礼，公主班推选田雨菲和陈子璇与我同去。\",\"url\":\"\"},{\"slug\":\"2024-06-26-老挝磨丁重开清一国学讲坛-每周六下午讲老\",\"year\":\"2024\",\"title\":\"老挝磨丁重开国学讲坛：首讲《道德经》下半部「德经」\",\"date\":\"2024-06-26\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"在国内被各种原因中止的【清一国学讲坛】重新开张了。计划以后每周六下午的三点到五点（老挝时间），在磨丁的蕙兰酒店，开讲【老子道德经】。各位原来看到我的【道德经讲记】，都是我在十几年前讲过的上半部。我原来从来没有公开讲过下半部，上半部的【道经】，是道家做事的基本原则部分。下半部是【德经】，是道家的实操部分，内容非常的厉害---连南老都不敢讲。所以，懂得道德经的人，不敢轻易讲下半部的。\",\"url\":\"\"},{\"slug\":\"2024-06-23-日本2033年每年接纳50万留学生-现在\",\"year\":\"2024\",\"title\":\"日本2033年欲年纳50万留学生：与其卷985，不如读东大\",\"date\":\"2024-06-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"2023年9月日本政府制定了一个新目标：到2033年，每年接纳50万留学生，并将留学生毕业后的就业率提高到60%结论---在日本找工作肯定比中国容易。因为日本缺年轻人才。中国急速降低的制造业份额。造成了这近几年年轻人难找工作。结论：现在拼命去考985，211，真心不如去读东大，QS100，基本能够保证工作。工资还不低。只是----学好日语是基础！\",\"url\":\"\"},{\"slug\":\"2024-06-22-如何塑造一份完美履历-普通人逆袭哈佛耶鲁\",\"year\":\"2024\",\"title\":\"如何塑造一份完美履历？普通人逆袭哈佛耶鲁的道路！\",\"date\":\"2024-06-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"富豪们如果想要为自己的孩子，打开一条进入哈佛耶鲁的道路，需要捐款数千万甚至上亿美金！如【哈佛女孩】的家长，为了要实现帮助孩子打通哈佛耶鲁的道路，从幼儿园开始就严格训练女儿，一直坚持到她18岁！这样一步都不能踏错，才可以进入哈佛耶鲁！各位想要给孩子安排一条通向哈佛耶鲁的道路，光靠跟随和模仿是不行的。我希望去走一条从来没有学霸走过的道路，去创造一个过去上百年的哈佛耶鲁学生，都没有创造出来的世界纪录。\",\"url\":\"\"},{\"slug\":\"2024-06-20-买回燕京30万股9.06元-9.92元卖\",\"year\":\"2024\",\"title\":\"首次买回燕京30万股（9.06元）：9.92卖出后的低位回补\",\"date\":\"2024-06-20\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天买回燕京30万股，每股买入价格9.06元。这是前段时间9.92元卖出的，首次开始买回行为。也就是赚点小钱罢了---我不明白为啥破反弹前的前低了。我看主力现在也不想涨的样子。没指望他很快反转。我反正没事干，就买回来算了。涨了再卖就是了！时不时进进出出的玩一下，每次都不亏就好！耐心一点，筹码一旦丢了就认输。不去扳回来！心态好就无敌！\",\"url\":\"\"},{\"slug\":\"2024-06-20-怎样才能简单高效地考上哈佛耶鲁藤校\",\"year\":\"2024\",\"title\":\"怎样才能简单高效地考上哈佛耶鲁藤校？\",\"date\":\"2024-06-20\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"想要上中国的顶尖名校，其实很简单：拼命去考出一个超过别人的高分来就行了！中国顶尖高校，也只是把高考的分数，作为几乎唯一的取舍条件！但要考上世界顶尖名校，比如哈佛耶鲁藤校。只有具备良好的综合能力和素质，才有培养的价值！世界顶尖名校也重视高考的成绩，但不是唯成绩论！毕竟---中国没有多少人有能力捐款上亿美金给哈佛耶鲁，为自己的孩子买一个入学学位的！以下是为我们为【哈佛耶鲁冠军班】学生打造的圆梦计划！\",\"url\":\"\"},{\"slug\":\"2024-06-20-新教育天书-饮食起居篇-第9问-为啥说不\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第9问：为啥说不良饮食习惯导致糖尿病？\",\"date\":\"2024-06-20\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我查了一下资料：中国总共有1.4亿糖尿病患者。如果算起来的话，一个人一生中患糖尿病的概率，应该超过20%。统计上：全球65岁以上的人得糖尿病的比率，的确超过了20%，而且这个数字还在继续上升中！这些地区的65岁以上得糖尿病的概率，应该超过30%了！不过可笑的是：每年这些巨额的医疗和药物开销，实际上根本就无法治疗糖尿病。因此---中国东北地区这些习惯超大份饮食的省份，三高，糖尿病患者就更多！\",\"url\":\"\"},{\"slug\":\"2024-06-19-新教育天书-饮食起居篇-第8问-为什么牛\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第8问：为什么牛奶会导致骨质疏松？\",\"date\":\"2024-06-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"牛奶不是西方最重要的蛋白质和营养物质吗？拳手低扫致自己的小腿骨折_哔哩哔哩_bilibili这种案例很多----看起来肌肉男拳手，很结实，似乎力大如牛，居然一脚就把自己的小腿踢断了。最核心，最关键，但是常常被人忽略的真正原因，是这些拳手的体质问题，是他们的骨质疏松！有些拳手习惯用手来接对方的扫腿，结果因为手臂的骨质疏松，导致很多拳手的小臂骨折。这样的饮食方式，身体不出各种问题，骨质不疏松才怪呢！\",\"url\":\"\"},{\"slug\":\"2024-06-19-新教育天书之-饮食起居篇-第7问-一天吃\",\"year\":\"2024\",\"title\":\"新教育天书之【饮食起居篇】第7问：一天吃几顿才健康？吃早餐真的有益健康吗？\",\"date\":\"2024-06-19\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这篇BBC的文章，专门研究了一天到底应该吃几餐！第一次流行是在17世纪，早餐在当时是那些买得起食物和有时间在早上悠闲吃一顿饭的人的奢侈品。显然不懂健康饮食中国人的一日三餐，一般来是是要求如下的：早餐一定要吃好，肉蛋奶最好都有，因为要供应一天的能量需求，一定要吃优质食物。马云的早餐，看起来丰盛多彩，其实真不如老百姓的稀饭馒头更有利身体，提供了大量对身体无益有害的东西！\",\"url\":\"https://www.bbc.com/future/article/20220412-should-we-be-eating-three-meals-a-day\"},{\"slug\":\"2024-06-18-新教育天书-饮食起居篇-第6问-多吃对身\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第6问：多吃对身体有何危害？\",\"date\":\"2024-06-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"因为自然界，长期没东西吃是常态，偶尔才能拥有充足的食物。天天饱餐，身体一定出问题！相反---每天按时按顿吃饭，是人类稳定定居，且物质发达时代，工业化时代之后，才有可能出现的情况，相对自然界的生物演化来说，是非常短暂的。有一天---我突然想到---是不是鱼吃太多了？但我发现这些鱼，居然都活得好好的，甚至最不可思议的---是他们的体型与能够在正常鱼池里吃到食物的小鱼，大小也差不多，就是瘦一点。\",\"url\":\"https://www.youtube.com/watch?v=66z2GJiuHOE\"},{\"slug\":\"2024-06-16-新教育天书-饮食起居篇-第5问-为什么说\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第5问：为什么说素食有可能给身体造成更严重问题？\",\"date\":\"2024-06-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"上篇文章：肉食是激素造就的，容易导致各种疾病。有人就会想---不吃肉，我就多吃菜，做个素食者，不就身体健康了吗？实际上：很多素食者的身体，甚至比肉食者更差！想要身体健康的话，不推荐毒素多多的肉食。这种饮食方式，可能导致更严重的身体健康问题！不吃肉觉得有点吃亏，但如果孩子不吃蔬菜---国人认为对身体会非常不好！如果你以为的“吃素”，就是吃青菜豆腐之类的话，我认为还不如吃肉，可能对你的身体更健康。\",\"url\":\"\"},{\"slug\":\"2024-06-15-三个月备考SAT-示范班首次官考成绩昨晚\",\"year\":\"2024\",\"title\":\"三个月备考SAT  示范班首次官考成绩昨晚出笼！\",\"date\":\"2024-06-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"三个月备考SAT示范班首次官考成绩昨晚出笼！今年是该示范班第四年学业完成，学生15岁已经达到“今日高考”年龄。在最近一年的强化阅读提高和扩展学习任务完成后，两个多月前开始复习备考美国高考SAT。6月初，学生们集体报名参加SAT官考，昨晚成绩单正式出笼！而我们本次参加考试的36个学生，首考就有12个学生达到了这种百里挑一的一流水准成绩，正好是三分之一的比率，远远超过正常的分布比例。\",\"url\":\"\"},{\"slug\":\"2024-06-14-从泰国电视转播看比赛-明晓第一局KO对手\",\"year\":\"2024\",\"title\":\"泰国转播看战：明晓首局KO、谭木兰连拳制胜，发力训练见效\",\"date\":\"2024-06-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天是从泰国的电视转播上看的比赛，效果很好，角度也很漂亮，比现场观看更清晰。明晓第一局就用拳KO了对手，场上还两次击倒对手，发力训练见效了。因为我们的拳法明显优胜，对方很难有效击中我们，对手失去拳套的保护，会造成更大的伤害。明晓的比赛就是这样，一出手就是三拳，拳拳打在对方脸上，很快脸就被打红了。对方眼睛下面打出血，第一局打完后，就放弃了比赛。谭木兰第二局就用连续拳攻击，最终ko了对手。\",\"url\":\"\"},{\"slug\":\"2024-06-12-新教育天书-饮食起居篇-第4问-为什么说\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第4问：为什么说肉蛋奶会导致性早熟，内脏受损？\",\"date\":\"2024-06-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"结果医生检查结论是：小女孩胸部已经开始发育了----性早熟！但是：家长们根本不知道是何种原因导致的性早熟，而且----媒体也不去提。上面的案例，就是孩子吸收了大量性激素导致的结果。简单地说：就是家长从小喂养给孩子大量含有性激素的食物，孩子被动成为激素动物了。具体是什么食物，需要去看她的饮食习惯，一般来说就是肉蛋奶。小孩子就是贪吃超巨量的激素食物，吸收了大量的生物激素，才会导致7岁就提前发育。\",\"url\":\"\"},{\"slug\":\"2024-06-11-卖出60万股燕京9.90-9.92-买入\",\"year\":\"2024\",\"title\":\"燕京换珠江跨股T+0：每股多赚8毛，60万股锁定利润超50万\",\"date\":\"2024-06-11\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今日操作记录：今天卖出了60万股燕京啤酒，卖出价9.90-9.92元。买入了珠江啤酒，买入价7.95-7.98元。当时是卖出8.28元的珠江，买入9.36-9.38元的燕京。现在燕京涨了5毛多钱，珠江跌了3毛多钱，加在一起，这笔跨股的T+0交易，每股多赚了8毛多钱。据说这笔钱，已经超过现在很多银行的支行长的年薪了。上次这比燕京的买入记录在这里：今天在某账户买入了60多万股燕京啤酒，价...……\",\"url\":\"\"},{\"slug\":\"2024-06-08-儿子被大学退学-呆在家里啥也不干-我们该\",\"year\":\"2024\",\"title\":\"儿子被大学退学，呆在家里啥也不干，我们该怎么办？\",\"date\":\"2024-06-08\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"各位问过：孩子为什么要上大学，为什么要去工作吗？问过人生到底要去做什么吗？他得明白自己为啥要学习，为啥要读书，才会积极的去求学！如果---他有一天突然发现---他其实不用上大学，不用找工作，不用挣工资，只要赖在家长身上，也能这样过日子的。从小没有教责任和荣誉的孩子，怎么可能长大了，就自动学会责任和荣誉了？所以---对于现在的家长，仅仅要求孩子的学业，仅仅要求成绩，说“好好读书，好好考大学。\",\"url\":\"\"},{\"slug\":\"2024-06-07-人分三种-人生出路有九九八十一种-您属于\",\"year\":\"2024\",\"title\":\"人分三种，人生出路有九九八十一种！您属于哪一种？\",\"date\":\"2024-06-07\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"中国家长很少去思考：你们的孩子的人生道路，并不是只有华山一条路。因为你不是他们这种类型的人，他们不愿意走你认为良好的人生道路。其实事不过三：孩子的内心愿望和追求，一般来说也只有三种大分类。第一种就是“事业型”的孩子：愿意为了他们追求的事业无条件付出的人！这种人，就可以考学清一大学的【管理学专业】，走三加一的道路。这种感情型，恋家类型的人，也可以继续细分，也分三种情况，有三种不同的出路！\",\"url\":\"\"},{\"slug\":\"2024-06-05-新教育为什么要学西语-墨西哥超中国成为美\",\"year\":\"2024\",\"title\":\"新教育为何学西语：墨西哥超中国成美第二大进口国，机会在南美\",\"date\":\"2024-06-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"新教育为什么要学西语----墨西哥去年就超过中国，成为美国的第二大进口国。今年中国排名继续靠后，滑倒第四名了。原来的中国，长期是美国第一大进口国。过几年，就是工作岗位的降级，下岗潮-----过几年，你大学毕业拼命找工作，都找不到的。现在你们还不赶快学新教育，学西语，完善三语能力，去南美发展吗？未来，墨西哥和南美洲，将爆发过去40年在中国爆发的“经济奇迹”。中国已成美国第4大进口国，前3名都有谁？\",\"url\":\"\"},{\"slug\":\"2024-06-04-学霸陪读陪考的培训魔法-助力高效突破美国\",\"year\":\"2024\",\"title\":\"学霸陪读陪考的培训魔法：助力高效突破美国GED证书考试！\",\"date\":\"2024-06-04\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"担心失去“学习和考试资格”的国人，居然不敢去尝试这种先进的另类学习法！只要你通过了这份考试，美国以及世界范围的很多国家大学，就承认你拥有正规的高中毕业资格。你可以用这个证书在美国找工作，也可以你的文凭和高中学历使用（高中文凭几乎没啥求职价值吧？因此---美国政府特别为这些希望自己来完成高中学业任务的学生，通过这项考试来获取宝贵的高中毕业文凭。这种奇特的【自考高中毕业证书】，因此国人非常的不熟悉。\",\"url\":\"\"},{\"slug\":\"2024-06-03-2026-清一新教育学生全奖入读常春藤盟\",\"year\":\"2024\",\"title\":\"2026：清一新教育学生全奖入读常春藤盟校路线图！\",\"date\":\"2024-06-03\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"您很难相信：潘石屹们需要花上亿美金捐款，才能得到的宝贵的名校入学机会，居然在清一新教育这里，会变得轻而易举！本届新教育的示范班同届学生，目前已经有三个学生拿到了超过1550的分数。这不---一直抹黑说我们的学生考不上世界名校，今年马上就有批量的学生申请入读世界名校。三加一计划，本来是增加光彩的计划，但清黑们抹黑说新教育考不上名校。除非----学生们能够拿到全奖入读哈佛耶鲁的机会？\",\"url\":\"\"},{\"slug\":\"2024-06-02-2024-史上最轻松也是最激烈的高考\",\"year\":\"2024\",\"title\":\"2024：史上最轻松也是最激烈的高考！\",\"date\":\"2024-06-02\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"据说：今年参加高考的人数，是历年来最多的。走体制教育的学生，今年无疑是最难的一年！最难的是四年后的大学毕业：国内大量工作岗位的消失，也许四年后的媒体标题，可能就是【地狱级的毕业求职难度】了。不过---对新教育的学生来说，高考却是轻松愉快的旅行。大家觉得：高考的难度不高，考完后都很轻松。如果能够通过GED考试，就可以轻松拿到美国高中毕业证书，实现高中毕业文凭的需求，你们干嘛老老实实的从幼儿园起。\",\"url\":\"\"},{\"slug\":\"2024-05-31-买入60多万股燕京-9.36-9.38元\",\"year\":\"2024\",\"title\":\"买回60万股燕京（9.36–9.38元）：清偿融资后低位补回筹码\",\"date\":\"2024-05-31\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天在某账户买入了60多万股燕京啤酒，价格最低9.36，最高9.38元。因为前段时间该账户在10.20元左右，我主动卖掉了50万股左右的燕京（尺寸总量的一点点而已）。当时是认为燕京股价超过10元，就不应该持有融资头寸了。结果就卖掉一些头寸，清除了燕京的融资合约，把融资额度都空出来了。由于今天买进的头寸多于上次卖掉的头寸，为了平衡账户，还卖掉了一部分珠江，价格是8.28元。\",\"url\":\"\"},{\"slug\":\"2024-05-29-中国中冶筹码分析-A股流动筹码只有20\",\"year\":\"2024\",\"title\":\"中国中冶筹码分析：流动筹码仅两成，国家队成本成安全垫\",\"date\":\"2024-05-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"中国中冶的筹码分析：我判断A股的流动筹码大约只有20%多。十大股东中，外资股以外的筹码也是基本不动的！十大股东一起，持有的股票就超过75%了。十大股东的持仓成本，可以作为一个安全垫子来看。在2015年救市的时候，买了大把的中国中冶，当时的救市买入成本大致上在5.5-6元的样子。我认为：可以说国家认为中国中冶的股票值6元。实际上中国中冶的净资产港股标志是8.1港币(比A股的高）。\",\"url\":\"\"},{\"slug\":\"2024-05-29-减仓天山铝业8.70元-用涨到7元的中建\",\"year\":\"2024\",\"title\":\"减仓天山铝业8.70元：中建换天山印证划算，差价已拉大至3元\",\"date\":\"2024-05-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天减仓了一批天山铝业，卖出价格是8.70元前后。这批货是中国建筑上次冲高7元区间减掉几百万股的中建仓位后换入的。我认为两者同价，显然是天山相对更低估，所以用中建换天山。后期我也一直在补入天山铝业，也有5元多买入的，因此持仓的成本是6.36元！现在我在8.7元卖出天山，同时中国建筑才5.7元价位。那么--今天我应该重新换入中国建筑才对。所以---我拿天山铝业换所有优质铜矿股的中冶，肯定不吃亏。\",\"url\":\"\"},{\"slug\":\"2024-05-24-征婚条件-你理想中的TA应该是怎样的人\",\"year\":\"2024\",\"title\":\"征婚条件：你理想中的TA应该是怎样的人？\",\"date\":\"2024-05-24\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"如果你看到了上面列出的案例中的男女征婚条件，都只关心物质条件，外在条件。你如果觉得这种征婚条件不太满意，不值得成为他人的参考。请你列出你认为理想中的TA，应该具备的五个最重要的条件是什么？那么----至少----你在婚姻上，这个非常的“私密”的个人问题上，你有自己的标准吗？自己出的题目，自己答：我认为：相伴一生的人生伴侣，应该具备以下五个精神上的特质：一：热爱阅读，有求知欲！\",\"url\":\"\"},{\"slug\":\"2024-05-23-亿万富翁的烦恼-金钱其实很危险\",\"year\":\"2024\",\"title\":\"亿万富翁的烦恼：金钱其实很危险！\",\"date\":\"2024-05-23\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"但你能当老板，证明他们其实培养得很不错，他们至少培养出了一个成功的，有教养好脾气的商人！我说：只要你们有心，小孩子其实很好教的。金融行业，进入的门槛很低，但拥有钱生钱能力的人其实很少，要比实业赚钱要难得多。如果想要成为其中的佼佼者，比如想要到巴菲特这个级别的人，能够做到长期的每年钱生钱20%左右的复合成长率，这种人，大约只有亿万分之一吧？一般人的花钱，就是花钱吃喝玩乐了，其实是对金钱的浪费！\",\"url\":\"\"},{\"slug\":\"2024-05-17-教育部禁止令-严禁义务教育阶段学校组织选\",\"year\":\"2024\",\"title\":\"教育部禁义务教育选拔考试：公立求公平，私立失优势\",\"date\":\"2024-05-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"教育部禁止令：【6.严禁义务教育阶段学校组织选拔性考试：严禁义务教育阶段学校组织以选拔生源为目的的各类考试，或采用各类竞赛证书、社会培训成绩、考级证明等作为招生依据】。可私立学校，自己和家长拿钱来做的教育，却不让学校去择优，自由选择学生和教学方式，这就直接把私立教育的优势完全丢了。这种优选机制，是我们不断走向卓越的推力器。可是---在国内----就是教育部禁止的做法。\",\"url\":\"\"},{\"slug\":\"2024-05-15-华人世界名校正在快速成形中-今日国礼\",\"year\":\"2024\",\"title\":\"华人世界名校正在快速成形中---今日国礼计划开启！\",\"date\":\"2024-05-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"我认为：现在，至少有一所华人来创建的世界名校，已经走在路上。我认为：10年后，现在世界名校最多的国家---美国，优秀的学生都会来申请这所华人学校求学。因为：这所学校对标的美国教育标准考试，但这所中华学校的教学成绩和人才，教育水平都全面碾压美国名校！今年就已经开启“夺取全国和世界冠军称号”，创立世界名校之路！快速成名的原因在于：我们得到了华夏老祖宗的加持，让我们规划中的世界名校计划，大大的提速了！\",\"url\":\"\"},{\"slug\":\"2024-05-14-关于举办-中日格斗国手总决战擂台赛事-的\",\"year\":\"2024\",\"title\":\"关于举办【中日格斗国手总决战擂台赛事】的规划设想\",\"date\":\"2024-05-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"中日擂台格斗赛事成功之后，将来还可以举办【八国联军冠军对战】系列赛事，今后注定将成为一个系列赛事，吸引全世界的眼球！我们要举办真正的赛事，就必须找日本的真正的冠军级拳手出来打，必须有日本的真实比赛的记录，是日本真正的职业拳手，武道高手，有全国比赛的赛事记录的人出来打！为了办出特色来，计划采用当年风靡全国的【中日围棋擂台赛】的赛事格局设计。这种模式，就是中国古代的擂台赛，一个人要面对多人的车轮战！\",\"url\":\"\"},{\"slug\":\"2024-05-12-见世界-餐饮业从业者的内幕记录\",\"year\":\"2024\",\"title\":\"见世界：餐饮业从业者的内幕记录:\",\"date\":\"2024-05-12\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"最近开写的饮食起居文章，基本观点国人很多是不认同的。但你们想要质疑我，起码要有比我更高的对食品，健康和餐饮行业的了解吧？从转发下文中我们看出来：即使是承包学校的餐饮公司，吃食堂也不靠谱，简单饮食，才是最靠谱的生活方式！九、不购买切好出售的拼盘水果或者单一水果;作者：达摩君子厦门商报日前报导了一名15岁步入餐饮行业，辗转六年后，最后放弃厨师工作，也同时良心发现，自己曝出了餐饮业行内的惊人内幕。\",\"url\":\"\"},{\"slug\":\"2024-05-10-新教育天书-饮食起居篇-第3问-职业拳手\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第3问：职业拳手的饮食与普通人有何差别？\",\"date\":\"2024-05-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"职业拳手面对的是最激烈的对抗，是对身体要求最高的运动项目。因此：格斗手的饮食，也应该是最讲究的，不能讲口味，必须符合身体要求才行！导致我国拳手的体能和素质，职业寿命，普遍要比国际水平低。就算是一些世界知名的拳手，如张伟丽，她的饮食上也是完全错误的！如果格斗手能够保持良好的饮食习惯，也可以拥有很长的运动生涯。所以看看国家队安排的特别饮食方式，就代表了中国武术界认为职业拳手应该怎样吃了。\",\"url\":\"\"},{\"slug\":\"2024-05-10-用中国宏桥换百万股中国建材-两天后就大涨\",\"year\":\"2024\",\"title\":\"宏桥换中国建材两天即大涨：还没买够，以后买完再分享\",\"date\":\"2024-05-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"前几天刚分享用中国宏桥11.40元卖出后换入百万股中国建材的想法，两天后就大涨了。今天居然是自选股涨幅第二名，一股差不多涨了快5毛了。可是我还没有买够建材呢？算了，吸取教训吧：以后我自己还没有买完之前，就不能公开分享操作了。现在需要另外找换股的标的了，真够麻烦的！昨天换股，已经吸纳了另外某百万股级别的某高息中企股纳入囊中。看淡价格的涨跌，利用市场的波动来配置更多的中国优质股权！\",\"url\":\"\"},{\"slug\":\"2024-05-09-新教育天书-饮食起居篇-第1问-贪吃会影\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第1问：贪吃会影响学习成绩吗？\",\"date\":\"2024-05-09\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"中国人，可能是全世界最会吃，也最贪吃的国民！如果说中国人也有信仰，我认为我们信的是拜吃教！在微信上，天天出来秀得最多的就是自己正在吃什么？我猜：没有家长会认为，生活上吃好喝好，与孩子的学习成绩会有啥深度的关联，认为就是两回事！吃喝玩乐，与孩子长大后学习成绩的好坏，关联度真的很大。家长可以用各种好吃的东西来奖励孩子学习，孩子也会努力去拿个好一点的成绩来哄哄家长，换取自己的食欲满足机会！\",\"url\":\"\"},{\"slug\":\"2024-05-09-新教育天书-饮食起居篇-第2问-为什么吃\",\"year\":\"2024\",\"title\":\"新教育天书【饮食起居篇】第2问：为什么吃菜并非身体的需要？\",\"date\":\"2024-05-09\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"更多的人，去吃席的时候，是绝对不吃主食的，怕自己吃亏了，都是要多吃各种菜。有这么有可能：在食物上，我们身体真正需要的东西，就是最简单，甚至是最廉价的食品---只需主食，会不会就够了？现在这些贵重的菜肴，会不会是我们的身体根本不需要的东西呢？但诚实一点，承认自己贪吃就行了，但真别说：你是为了身体的健康需要而不得不吃的！有一个基本上不为人所知的饮食常识，就是国人们每天吃饭，都要操心吃什么菜？\",\"url\":\"\"},{\"slug\":\"2024-05-07-三大啤酒公司之间做价差-燕京账面利润恢复\",\"year\":\"2024\",\"title\":\"三大啤酒轮动价差：燕京利润恢复至去年高点，总账户逆市创新高\",\"date\":\"2024-05-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这段时间，三大啤酒公司之间，利用价差做了一点小小的操作。由于燕京的上涨，燕京的账面利润，已经完全恢复到了去年3月份，燕京冲到14元区域的水准。珠江，惠泉利润和持股数均创新高（初始投资总额应该没有变化）。因此目前的总账户，已经创新高了。通过正确的高卖低买行为，已经脱离了股指涨跌对账户的影响，换股策略，使得账户不断增长！昨天上午，卖了一点燕京，10.21元卖出，换入了9.77元的惠泉。\",\"url\":\"\"},{\"slug\":\"2024-05-03-世卫组织说法-狗产生病毒到死去不超过14\",\"year\":\"2024\",\"title\":\"世卫：狗咬人14天未死即无传染，盲目打狂犬疫苗多是交智商税\",\"date\":\"2024-05-03\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"世界卫生组织网站关于狂犬病毒，有一种说法。一条狗从他唾液开始产生病毒，到死去，不会超过十四天。说明它咬人的时候体内没有病毒（至少唾液没有病毒，不具备传染性），也就无需接种疫苗。这是世界卫生组织网站的内容，意思是这个意思正常的狗体内都有狂犬病毒吗？简单地说：被狗咬，就要去打狂犬病疫苗的人，基本上是就是交智商税的。首先---概率上，基本上不存在啥正好带有狂犬病毒的狗咬你（有的话。\",\"url\":\"\"},{\"slug\":\"2024-05-03-有没有结婚当天新郎或者新娘反悔的\",\"year\":\"2024\",\"title\":\"有没有结婚当天新郎或者新娘反悔的？\",\"date\":\"2024-05-03\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"看过在这个问题下的一些故事，都很有趣，很狗血。所有的故事，都是因为国人不懂尊重带来的结果！可在国人这里，结婚，是向对方展示自己威力的工具，是通过婚姻来展示控制权，获取利益。国人的主奴思维，控制与反控制行为和心理，就在婚姻，婚庆这里展现无疑！这些故事中，我们看到---很多令人恶心的事情，都是新娘的家人亲戚做的。去年弟弟妹妹的孩子结婚，我也以人在国外，没有回去现场参加婚礼。\",\"url\":\"\"},{\"slug\":\"2024-05-01-家族升级之道-中国富人为何坚持用养宠物的\",\"year\":\"2024\",\"title\":\"家族升级之道：中国富人为何坚持用养宠物的方式来培养后代？\",\"date\":\"2024-05-01\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"第三代就要赢天下，靠文化：获取财富，坐稳天下之后，富人们的第三代，就可以去从事各种文化艺术创造事业了，提升后代的素质，获得社会的尊重和喜欢。这就是有钱之后，富人应该要做的事情------对教育不惜代价的投入，用于提升后代的品味，地位和影响力。但：我发现中国的家长，基本上不懂家族升级的含义！一个没有文化追求的富裕家庭，只会用养宠物的方式来“培养孩子”。而不是有钱之后，设法用钱来实现真正的家族升级！\",\"url\":\"\"},{\"slug\":\"2024-04-29-新教育天书第15问-如何展现一份靓丽的求\",\"year\":\"2024\",\"title\":\"新教育天书第15问：如何展现一份靓丽的求学简历获取职场优势？\",\"date\":\"2024-04-29\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"设想一下：假如你现在22岁，你在面试官面前，怎样拿出一份【独一无二】的学生阶段履历，凸显你独特的人生价值，在你的职场一开始，就获得明显的比较优势呢？甚至很可能寒窗20载苦读，换回一个无人问津的结果！要想到将来，当你面对企业的面试官时候，你要如何才能拿出一份堪称惊艳的求学履历，让你鹤立鸡群。与众多毫无特点，像是一个模子里面倒出来的体制学校求职者，彻底地区分开来，轻松获取职场的成功！\",\"url\":\"\"},{\"slug\":\"2024-04-29-清一大学与海外名校合作举办首届-三语管理\",\"year\":\"2024\",\"title\":\"清一大学与海外名校合作举办首届【三语管理学专业】\",\"date\":\"2024-04-29\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"2024年4月27日，我校一行七人，与清迈大学人文科学院的副院长和相关专业的教授和招生人员，进行了两校合作的首次面对面交流探讨。不过，清迈大学这个双学位项目，是为学泰语的公主班学生，开辟的特别通道，也就是说，这是为我们的【三语教育学专业】——未来师资班服务的校际合作项目。计划2024年9月份开启的【清一大学三语管理学专业班】。我相信这个专业，必定会成为比海外名校理工科毕业更受欢迎的热门专业。\",\"url\":\"\"},{\"slug\":\"2024-04-24-惠泉一季报成了二老板-3月底冲高13元\",\"year\":\"2024\",\"title\":\"惠泉一季报再现：冲高13元后跌破10元，7–8元大量买回再成二股东\",\"date\":\"2024-04-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"惠泉公布一季报了，居然成了二老板。有意思的是：惠泉3月底冲高13元。开始进进出出换股，3季报依然持有不少，股价维持在11元左右。4季报我就彻底消失了，其实都换了跌破10元的燕京。之后惠泉跌破10元，最低跌到7元多。我又再度进来，大量7-8元买入的股份，再次成为老二。但惊讶的是：刚看到一季报的十大，大半部分成为了自然人，显然机构已经走了。目前的惠泉，不就是群龙无首了吗？昨日惠泉却有了冲高的迹象。\",\"url\":\"\"},{\"slug\":\"2024-04-23-新教育天书第14问-有比名校理工科发展空\",\"year\":\"2024\",\"title\":\"新教育天书第14问：有比名校理工科发展空间更大的大学文科专业吗？\",\"date\":\"2024-04-23\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"如果上大学是为了求职----当然选择就读理工科专业，是更靠谱的！正常情况下，文科专业是虚学科，不太可能超越工业化社会对理工科毕业生的需要量。所以上大学本科，基本上不值得押宝文科专业误终身！如果选对了市场的需求，选择合适的专业，不仅仅文科学生可以读书更轻松快乐，还可以获得比理工科毕业当工程师们，啃数据玩代码条件好得多的工作岗位。远远比你一个名校的理工科专业人才更受欢迎。\",\"url\":\"\"},{\"slug\":\"2024-04-21-生活里80的痛苦来自上班-放下欲得之心\",\"year\":\"2024\",\"title\":\"生活的苦多源于上班与欲得：放下得失心，安住创造与成长\",\"date\":\"2024-04-21\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"生活里80％的痛苦都来自于上班，但如果不上班，就会有100％的痛苦来自于没钱。——帕特里克·莫迪亚诺 生活中90%的痛苦，都来自于欲得。当你放下欲得之心，只是安住于创造和成长的时候，你就获得了90%的人都不能得到的快乐生活！----清一！\",\"url\":\"\"},{\"slug\":\"2024-04-19-8.19-8.20卖掉珠江买入8.95\",\"year\":\"2024\",\"title\":\"8.19–8.20 卖珠江换惠泉：平均每股差价 0.76 元，权当游戏\",\"date\":\"2024-04-19\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"燕京今天停在三天前换股的价位上，珠江涨了4毛钱多一点，所以，今天8.19-8.20左右卖掉珠江，买入8.95-9.97元的惠泉，平均差价0.76元。由于惠泉成交量很少，所以只能换20万股左右。就当玩游戏吧！如果以后差价变两元了，这笔交换，就相当于赚了一个普通工人一年的工资了！\",\"url\":\"\"},{\"slug\":\"2024-04-18-燕京涨超4换入没涨的珠江-筹码多出30\",\"year\":\"2024\",\"title\":\"燕京涨超4%换滞涨珠江：筹码多30%，浮盈增近一成\",\"date\":\"2024-04-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天燕京涨了超过4%多。就开始换入没涨的珠江（还停留在三天前的价格上）。今天珠江就涨超过4%了。燕京勉强涨了1%。所以--这次换股。比三天前的账目上，多了30%以上的筹码（珠江每股价格低于燕京20%）。看来，不要钱，只要股的策略是对的，实际上---钱和股全都增加了！浮盈也增加了8-9%。感谢市场先生的慷慨赠送，为勇士们出征雅典颁发路费和奖金！\",\"url\":\"\"},{\"slug\":\"2024-04-17-养老账户操作-9.68-9.71元卖燕京\",\"year\":\"2024\",\"title\":\"养老账户调仓：9.7元卖燕京换7.8元珠江，锁定利润\",\"date\":\"2024-04-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今日老人养老账户的操作：9.68-9.71元卖出燕京，同步换入珠江啤酒。这个账户，去年持仓的几乎全是燕京和中建，中建冲7元全走了，只剩下利润。燕京冲高13-14元期间，已经全部卖光，陆续换入低价的珠江，当时两票差价在4-5元，也因此锁定了燕京的利润。两票的价格差减少之后，差价在1.2元以内，就卖掉全部的珠江，换入了燕京。但现在重新换入珠江的时候，燕京的账户上已经额外增加了300多万利润。\",\"url\":\"\"},{\"slug\":\"2024-04-17-新教育天书第13问-人生必读大学和必修专\",\"year\":\"2024\",\"title\":\"新教育天书第13问：人生必读大学和必修专业是什么？\",\"date\":\"2024-04-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"家长和学生都应该知道：人生一辈子，值得追求的并不仅仅是名牌大学和专业。有很多知识和内容，比世界名校和专业更重要，需要你一生去学习和掌握！如果你不学习这种专业技能，你去学其他任何最牛的专业，人生也未必成功，还会混得很艰难！这种案例，是不是说明了：这个世界上，还有比名牌大学教的专业更重要的知识和内容？到底什么才是人生最重要的，必修必备的知识和技能呢？人生也有一个不得不学的专业---就是人学。\",\"url\":\"\"},{\"slug\":\"2024-04-12-小女的竞争对手实在太强-班稳定前三的小公\",\"year\":\"2024\",\"title\":\"小女对手太强：前三同学去见世面，她埋头赶功课\",\"date\":\"2024-04-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"如果15岁的我，来面对这群学霸我也头大呢。节后去武汉，北京---我也想带她去，她也说很想去，但是怕去了跟伙伴们拉开距离。于是---就带了“不怕被小伙伴拉开距离”----其实是她们班稳定排名前三的小公主去长见识了。我们的电影课，都必须认真看，认真去写观后作业。看了下面的作业，我理解小女的心情了：压力的确山大。这都是她的同学，甚至是她从小一起长大的同学，现在写一份作业，居然写的洋洋万言。\",\"url\":\"\"},{\"slug\":\"2024-04-12-少年军校今日起开始学日语-征日计划提\",\"year\":\"2024\",\"title\":\"少年军校今日起开始学日语---征日计划提前启动！\",\"date\":\"2024-04-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我在校区，经常听到不足十岁的孩子们用英语沟通交流。显然他们很习惯---其实强化英语学习时间。这是今日三校体系内，唯一一个不以考大学，拿文凭为目标的班级。现在少年军校的【征日计划】，由小公主天晴来带领。因为比别的公主年龄大一些，已经年满18岁了，就被我提前带过来，做【征日计划】的小助教了！下周，我让带班教师，录下这个星期的学习视频来，让你们可以多观察少年军校的孩子们这一周开启新语言的学习情况。\",\"url\":\"\"},{\"slug\":\"2024-04-12-正通汽车去年营收241.32亿-是不是好\",\"year\":\"2024\",\"title\":\"正通汽车年营收241亿：是好公司吗，你愿当它老板吗\",\"date\":\"2024-04-12\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"您愿意持有这家公司，做这家公司的老板吗？文章【在汽车行业竞争日益激烈的当下，正通汽车有限公司(以下简称“正通汽车”)以其卓越的市场表现和稳健的经营策略。根据最新公布报告，正通汽车去年的营业收入达到了241.32亿元，同比增长7%，这一成绩不仅展现了公司的强大市场竞争力，也预示着其在未来可持续发展的广阔前景。正通汽车表示主要是年内新车销售上升所致。商业转载请联系作者获得授权，非商业转载请注明出处。\",\"url\":\"\"},{\"slug\":\"2024-04-12-清一战队泰国六场实战-明祺第三回合KO日\",\"year\":\"2024\",\"title\":\"清一战队泰国六战：明祺三回合KO日本拳手，三新人登场\",\"date\":\"2024-04-12\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今晚清一战队在泰国有六场实战比赛。第三回合就KO了日本拳手，让一贯认为自己是格斗大国、尊重泰国人却瞧不起中国拳手的日本拳手，今天吃了一点不小的亏。他肯定没有想到他会面对打法完全不一样的中国拳手。今年，清一武道馆，会有一批新拳手新登场。今天，泰国人给新木兰小公主陈子璇安排的对手，居然是金腰带拳手（木兰们查的网上FC的资料）。不过---我们也知道，跟泰国人打，首战就是决战。\",\"url\":\"\"},{\"slug\":\"2024-04-09-文科生可以入读世界名校理工科吗\",\"year\":\"2024\",\"title\":\"文科生可以入读世界名校理工科吗？\",\"date\":\"2024-04-09\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"说实话---如果仅仅限制在本科专业阶段，我们完全可以开设任何专业，水平不会亚于世界名牌大学。转内部文：一位高中纯文科生，居然考入世界名校的计算机系，成为一名货真价的理科生，而且适应良好，在班级中排名中。请看《从高中文科生到世界名校的理科生，我如何跨越文理“鸿沟”？当然学生可以偏科学习，但中学是没有开设理工科的要求，也没有这个必要。你们完全可以去上世界前100大学的理工科专业，入读前50名也不难。\",\"url\":\"\"},{\"slug\":\"2024-04-05-新教育天书第12问-中美博弈有无两头获益\",\"year\":\"2024\",\"title\":\"新教育天书第12问：中美博弈有无两头获益的大学之路？\",\"date\":\"2024-04-05\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"从2019年开启的中美对抗和博弈，正在深刻地改变这个世界。未来的就业，肯定就和原来中美合作共赢时代不一样了---必须考虑怎样在两大阵营的对抗和脱钩运行的情况下，找到对我们孩子未来的职场和就业最有帮助的教育路线和对策！中国也取得了难得的发展机会。因此美国不仅仅封锁高科技的产品和教育渠道，欧美国家的高科技大学敏感专业，都不让中国学生去留学了！有没有在未来的中美对抗局面下，能够两头获利的好思路呢？\",\"url\":\"\"},{\"slug\":\"2024-04-05-转-王芗斋-民国时期太极拳真髓就已失传\",\"year\":\"2024\",\"title\":\"转：王芗斋   民国时期太极拳真髓就已失传\",\"date\":\"2024-04-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"转：王芗斋民国时期太极拳真髓就已失传中国人太喜欢玩假的了。五月份，清一太极的五个拳手（四女一男），将参加今年世界泰拳锦标赛的国家队集训。转发：民国武林真相之：王芗斋先生为何否定传统武术，尤其贬低太极拳？薛圣东中国传统武术到了民国时期，终于迎来了一次属于它的春天。王芗斋先生对中国传统武术技艺所给出的评价结论是：“我国拳术杂乱无章，有令人无所适从之叹，一言以蔽之—遗弃精髓，仅守糟粕而已。\",\"url\":\"\"},{\"slug\":\"2024-04-04-新教育天书11问-大学是抑郁症重灾区-怎\",\"year\":\"2024\",\"title\":\"新教育天书11问：大学是抑郁症重灾区，怎样才能防止这种情况出现？\",\"date\":\"2024-04-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"错误的教育模式，必然会导致出现这种情况！现在很多中学生，就已经出现很严重的抑郁症了！而且越是名校，越是成绩优秀的学生，越有可能出现心理的问题！记得有一个北大演讲：题目就是【压抑的胜利】，认为我们现在的高考制度，就是一批愿意压抑自己的人才能成为“成功者”，其中越能压抑自己的人，就更容易考上名校。山长清一：新教育天书11问：大学是抑郁症重灾区，怎样才能防止这种情况出现？\",\"url\":\"\"},{\"slug\":\"2024-04-03-清空洛阳钼业几十万股-8.72-8.73\",\"year\":\"2024\",\"title\":\"清仓洛阳钼业：8.7元落袋，曾5元被套跌至4.61\",\"date\":\"2024-04-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天清空了A股持有的几十万股洛阳钼业，价格在8.72-8.73元。这些股票，是半年多前，跌破五元的时候买的，当时觉得太便宜，跌回了很久以前的原价（两三年前第一次买洛阳钼业，就是5元买入，然后涨到8元多就全卖掉。结果这次5元补入，依然被套了，最低居然跌到了4.61元。为了避免踏空，今天也补充了一些金属行业的股票进来，就买了当年跟洛阳钼业一起，躺在五元价位互相安慰的华菱钢铁。\",\"url\":\"\"},{\"slug\":\"2024-03-31-升级版的清一太极正在狂虐职业泰拳手\",\"year\":\"2024\",\"title\":\"升级版的清一太极正在狂虐职业泰拳手\",\"date\":\"2024-03-31\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一战队最近已经获得了中国国家泰拳队主教练的邀请，5月份将参加在雅典举行的【世界泰拳锦标赛】中国国家队的选拔赛。由于2023年年底举办的全国锦标赛，清一战队获得了三块金牌，五块银牌，四块铜牌。我们认为目前这几个人的实力还不够成熟，现在去参与世界大赛，拿金牌把握不太大，今年就放弃了参选国家队的机会，等明年进一步强化提高了技术再说。计划用职业泰拳手作为对手，来练习我们木兰的拳击技术。\",\"url\":\"\"},{\"slug\":\"2024-03-27-女性意识觉醒-传统婚姻面临解体\",\"year\":\"2024\",\"title\":\"女性意识觉醒，传统婚姻面临解体\",\"date\":\"2024-03-27\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"我培养的女学生，有一点不好，就是对婚姻的要求太高，不愿意随便嫁人。由此我们培养出来的女孩们，也不愿意嫁给新教育系统外价值观差异较大的男生。新教育的男生，国内如果找不到特别合适的好对象，解决方式很简单---出国在东南亚找个儒教传统女生，比国内的傲娇女生更实惠。中国约1.16亿女光棍，大龄剩女道出心声，很真实因此：我给公主班唠叨最多的，就是让她们改变传统的婚姻价值观。\",\"url\":\"\"},{\"slug\":\"2024-03-26-回到清迈-ELLA觉得回来的感觉真好-国\",\"year\":\"2024\",\"title\":\"回到清迈：ELLA感慨国内控制感强，泰国更自在亲和\",\"date\":\"2024-03-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"说这次她在国内停留的时候很长，感受更强烈。国内的人，控制意识特别的强，脾气也比较急躁。就算是一些人很友好（比如昨天接待小公主开户的银行支行行长等人）对小公主们非常的友好和客气，她也感到有点不自在。陌生人之间感觉更是严重的缺乏信任感，公职人员对人很不礼貌（如机场的国内海关人员等）。感觉泰国人有天然的亲近和友好，不求回报的这种对人的友好。所以很喜欢回来泰国----虽然经济条件清迈显然不如国内。\",\"url\":\"\"},{\"slug\":\"2024-03-22-离开北京做了两个咨询单-梳理价值观-很快\",\"year\":\"2024\",\"title\":\"离京做两单咨询：梳理价值观，速解家庭与子女规划\",\"date\":\"2024-03-22\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"圆满解决两个家庭的困难----家庭关系和经济设置。第一个案子，是案主想要解决家庭和孩子发展的规划问题，夫妻关系处理的问题。自己想了很久不得其法，通过梳理价值观，很快就解决了问题，开开心心的去实现自己的心意了。很多人觉得自己解决不了的问题，找我指点一下很容易就解决。上一次，一个家庭非要定两个小时的咨询时间。今天第二位找我的家庭就更有意思---咨询完后，我多问了一下，才知道两人都是正宗上海市本邦人。\",\"url\":\"\"},{\"slug\":\"2024-03-21-在京厅官老同学请客-顶级佛跳墙和两种鲍鱼\",\"year\":\"2024\",\"title\":\"京中老同学设宴：顶级佛跳墙双鲍鱼，小公主只扒米饭\",\"date\":\"2024-03-21\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"因为在京的厅官老同学，坚持邀请我们几个人去一个福建泉州人开的高档私家会所。上菜发现是各种海鲜，还是顶级的佛跳墙，一些单位菜等。我基于入乡随俗，就每种菜都尝了一下，算是体验生活。但两个小公主就只是简单的吃点米饭加点菜。这种再高档的菜馆，似乎与她们无缘，她们对各种美味完全无感，平静的吃饭看场。在座的老板们都很奇怪----吃得这么清淡。由于昨晚在座的全都是重要人物，会所是禁止拍照的。\",\"url\":\"\"},{\"slug\":\"2024-03-11-带木兰拜见92岁的太老师\",\"year\":\"2024\",\"title\":\"带木兰拜见92岁的太老师\",\"date\":\"2024-03-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"多年没有回武汉，这次回来，肯定要去看看曾老师的。昨日下午就在小光同学的带领下，两个小木兰和我一起去看望了曾老师！我们在约好的时间到达养老院的时候，看到曾老师居然坐在路边等我们。92岁的老人，能够和自己的夫人一起共度晚年，这是一种非常圆满，非常浪漫的事情。ELLA两木兰一直跟奶奶聊天，老人很开心。两个老同学和更老的老老师一起聊天，交流信息。曾老师有点感伤地说---这里应该是自己的最后一站了。\",\"url\":\"\"},{\"slug\":\"2024-03-10-今晚打世界冠军甜水和仑披尼拳手-明晓第五\",\"year\":\"2024\",\"title\":\"今夜泰国实战：明晓战仑披尼拳手，谭琛怡再战甜水\",\"date\":\"2024-03-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今晚打世界冠军甜水和仑披尼拳手。今晚清莱府的泰国节庆比赛地点。比赛时间晚上九点开始。我们有两场比赛，分别是：今晚明晓对伦披尼拳手第五场谭琛怡对世界冠军甜水第七场我们会提前一场，在当天比赛第四场的时候开启直播。链接如下：谭木兰甜水二番战链接……\",\"url\":\"\"},{\"slug\":\"2024-03-10-离汉多年之后首次重回-共同规划未来发展方\",\"year\":\"2024\",\"title\":\"离汉多年之后首次重回，共同规划未来发展方向！\",\"date\":\"2024-03-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我马来西亚考察完毕后，到磨丁特区见过了家长和特区主席等。这几天首次回到了武汉，小光同学随后也飞到武汉，邀请我跟他一起北上，去见见一堆京官老同学。我们班六分之一的同学居然都在京城当官，最低也是厅级了。都在想“发挥余热”的事情、对文化事业都很有热情！首站是武汉体院，体院已经被国家体委定位为国家泰拳队的集训单位。预期在备战一月后，从中选出每个级别的第一名，代表中国队出战雅典！\",\"url\":\"\"},{\"slug\":\"2024-03-05-给公主班家长的留言-ELLA们都不想去考\",\"year\":\"2024\",\"title\":\"给公主班家长：ELLA们不愿考GED/SAT，只想去清一大学\",\"date\":\"2024-03-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我对公主班的家长留言：这两天跟公主们聊了一下，ELLA和其他公主，都不想去参与三加一项目，找种种理由。比如要参赛啥的，就是不想去考一考GED和SAT。我的清一大学虽然自己觉得不错，但外面别人不认的！】梦溪家长说【公主班的志向是今日的师资力量和未来的文化大使，这跟体制文凭没啥关系，实在非要文凭的话，还是清一大学的。有家长更干脆【我们家庭有清一大学文凭就足够了】公主班的家长，的确是最淡定的家长。\",\"url\":\"\"},{\"slug\":\"2024-03-03-普通孩子上国际高中怎么样\",\"year\":\"2024\",\"title\":\"普通孩子上国际高中怎么样？\",\"date\":\"2024-03-03\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"但新教育把高中入读国际学校的费用降到零（我个人私人捐助，提供学生全奖入读三语高中的机会）。还推荐这些家庭，入读top100大学的小语种国家大学，学费一年只有几万元。这样，让普通人家也能享受国际教育的好处，这就是新教育对中国普通家庭最大的贡献！不然，国际高中每年30万元的开支，美国大学80-90万的开支，英国大学本科70万的支出。--------转发【普通孩子上国际高中怎么样？\",\"url\":\"\"},{\"slug\":\"2024-03-01-16岁入读世界前100名牌大学-新\",\"year\":\"2024\",\"title\":\"16岁入读世界前100名牌大学----新教育学生的广阔出路！\",\"date\":\"2024-03-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"由于已经打通了【美国高中毕业资格证书考试】，新教育学生可以轻松入读世界知名大学。不一定需要学生提供SAT成绩（当然，想要入读优质大学，一般还是要求提供SAT成绩的）】今年9月，大批16岁的新教育学生就将入读世界名校。新教育学生的高考和就业的出路，明显要比普通的体制学生宽广得多。新教育学生的高考出路----首选路径一今年9月份，清一新教育将送出一大批学生，16岁就直接入读世界前100名大学！\",\"url\":\"\"},{\"slug\":\"2024-03-01-华莱士说教育是学思维方式-中国体制教育和\",\"year\":\"2024\",\"title\":\"华莱士：教育贵在学思维，高考体制不配称教育系统\",\"date\":\"2024-03-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"华莱士在演讲中说到的：教育的目的不是学会知识，而是学习一种思维方式——根据这种说法，中国的体制教育和高考，就根本不配称为“教育系统”，甚至是反教育系统，因为这种教育破坏了思维体系。保护和培养孩子的思维能力，就是父母对孩子最大的宠爱。他这个思路，与今日新教育从11岁的学生中开始选出学生来入读今日三校，用另外一套学习方式来接轨体制教育，系统培养完整的文化思维模式，几乎是一样的！\",\"url\":\"\"},{\"slug\":\"2024-03-01-新教育颠覆学籍文凭-家长不用操心学位学区\",\"year\":\"2024\",\"title\":\"新教育颠覆学籍文凭：家长只管孩子乐学，不卷学区\",\"date\":\"2024-03-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"学籍和文凭。被新教育彻底颠覆。家长们再也不需要为孩子的学籍操心了。更不用担心学位和学区了。你唯一需要操心的，就是如何让孩子乐学，好学。选择什么级别。什么地区和国家的大学去上！16岁入读世界前100名牌大学----新...16岁入读世界前100名牌大学----新教育颠覆学籍管理的创新教育体系..……\",\"url\":\"\"},{\"slug\":\"2024-02-25-世界大学含金量鉴别-QS榜单辨正\",\"year\":\"2024\",\"title\":\"世界大学含金量鉴别：QS榜单辨正！\",\"date\":\"2024-02-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"因此：职场人士，往往会简单地采用泰晤士世界大学排行榜，或者QS世界大学排行榜来评估你上的大学档次。我们可以简单地用QS世界大学的榜单排名，对你的人生品质做一个说明：世界级第一等人才：如果你本科就读的是QS世界大学top100大学。比如中国的211大学，大多数连QS世界大学榜单前1000名都进不去。简单一点说：中国普通的学生，去考学QS世界大学榜上的英美国家大学，本质上是智商税。\",\"url\":\"\"},{\"slug\":\"2024-02-23-东马诗巫见闻-满街华人店铺中文沟通无碍\",\"year\":\"2024\",\"title\":\"东马诗巫见闻：满街华人店铺，俨然小中国城\",\"date\":\"2024-02-23\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"一路上风光无限，广阔的婆罗洲大平原，原始森林。一路上见到的都是华人店铺，到处都是中文。说话也一样，用中文沟通无障碍。基本上就是一个小中国城。泰国的华人村，都完全没有这种感觉。资料：1900年4月，闽清县举人黄乃裳在大清参与戊戌维新失败，因叛乱国家只好外逃，带着亲人到砂拉越王国。黄乃裳经过古晋华人甲必丹王长水的介绍，与砂拉越王国君主布鲁克二世订立合约在诗巫建立福州人的殖民据点。\",\"url\":\"\"},{\"slug\":\"2024-02-22-16岁读大学-20岁拿三所世界知名大学文\",\"year\":\"2024\",\"title\":\"16岁读大学，20岁拿三所世界知名大学文凭！\",\"date\":\"2024-02-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"而且四年后，我们的学生就可以拿到三所大学的正式毕业证和学位证。20岁的黄金年龄，在其他的选择了中国高考道路的学霸，辛苦了12年，勉强考上大学后，还在传统的体制大学读大二的时候，清一新教育的学生，却连玩带学的拿到了三所世界知名大学的毕业文凭，这种人，当然就是妥妥的“人生赢家”！当然---第三所“世界知名大学”的毕业文凭，也将在学生拿到两所QS大学的学位证之后，有我个人来颁发我们的【清一大学】毕业证。\",\"url\":\"\"},{\"slug\":\"2024-02-22-来到东马沙捞越古国-西马的人来东马也要查\",\"year\":\"2024\",\"title\":\"东马沙捞越见闻：西马人入境也查护照，似港陆关系\",\"date\":\"2024-02-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"旁边还有沙巴古国-------这两个地方真有趣---西马的人来了，也要检查护照办入境手续。因为这个国家是加入的马联邦，自己拥有很多独立的权利，教育上也相比西马更加独立。据说---东马的人，可以随便去西马旅行和工作。地产上还拥有“半个新加坡这么大的西马产业”，他们家族与总理都是好朋友，很多大型项目还在和中国公司合作在当地开发，与马云，中国的海外大国企有非常密切的合作关系。\",\"url\":\"\"},{\"slug\":\"2024-02-20-60岁第一次错过飞机-槟城到吉隆坡一路堵\",\"year\":\"2024\",\"title\":\"60岁首遇误机：槟城赴吉隆坡堵车，三张机票作废\",\"date\":\"2024-02-20\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"昨天我们错过了班机，这是我60岁的人生，经历第一次错过飞机的体验。我们今天从槟城来吉隆坡，早上8:30就出发了。因为规划到了吉隆坡，还要去市区逛一圈再去机场，路上查看需要4个多小时。没想到堵了一路，一开始车就不断推迟取消班车，到了高速上，居然还堵车，像是在市区一样慢吞吞的走。其实我知道槟城可以直飞古晋的，但我想顺便看看一路上的马来情况，所以一早从槟城坐大巴来吉隆坡，以为这样最节约了解马来的时间。\",\"url\":\"\"},{\"slug\":\"2024-02-20-节后总结-珠江从7.81涨到8.15-节\",\"year\":\"2024\",\"title\":\"节后总结：珠江7.81涨至8.15，节前低位判断应验\",\"date\":\"2024-02-20\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"年前最后一天，我在忙着把9.25元的燕京卖掉，买入8.38元的惠泉啤酒。晚上才来看盘，总结发现：珠江今天居然大涨了一波，从7.81涨到了8.15元。说明我节前预判珠江处于随时可以涨起来的低位是正确的判断。只是没想到普涨的大A，燕京居然还跌了---从8.87元，跌到了8.75元，与珠江差价只有6毛钱了，似乎用来换燕京和惠泉，正是好时候。惠泉如果再涨一两元，用来换燕京，又是一笔好生意！\",\"url\":\"\"},{\"slug\":\"2024-02-19-小女私家课-个人价值如何创造-真实身份和\",\"year\":\"2024\",\"title\":\"小女私家课：个人价值如何创造？真实身份和虚假身份？\",\"date\":\"2024-02-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"首先，我就与小女说到了“真实身份”问题：告诉她：大多数人都不明白自己的身份。以为别人“给的身份”，虚假的身份认定，别人特别给的面子，就是自己的“真实身份”。把这些虚假的身份当真的，结果一辈子干傻事！全世界，如果通过她的行为来观察价值和身份的话，总共只有两种人：第一种人是：价值创造者。他们也想获得尊重，但由于没有创造价值，因此他们的真实身份是“无能”的。我说：小孩子大多数不能创造真实的物质价值。\",\"url\":\"\"},{\"slug\":\"2024-02-18-南洋华人-也许是全世界唯一不鄙视华人身份\",\"year\":\"2024\",\"title\":\"南洋华人：也许是全世界唯一不鄙视华人身份的华族！\",\"date\":\"2024-02-18\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"但基于对师父的尊重，我还是决定亲自来槟城查看，结果真有一些不一样的发现！也许除了大陆华人外，其他的全世界华人，都不同程度地鄙视自己的华人身份！----有可能，全世界华人地位最高的地方，认为“华人才是宇宙第一强人”的地方，大概就只能在网上，在知乎上吧？但新加坡居然有两所大学排名差不多世界第10名左右，经济收入也是发达国家行列，因此也算是华人【改换思想基因】，跟随英美化成功的案例！\",\"url\":\"\"},{\"slug\":\"2024-02-10-新教育天书第10问-应该读好大学的普通专\",\"year\":\"2024\",\"title\":\"新教育天书第10问：应该读好大学的普通专业？还是读普通大学的好专业？\",\"date\":\"2024-02-10\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"以下是今天的正文题目：新教育天书第10问：应该读好大学的普通专业？比如：公主班的学生，由于已经解决了就业问题（从事新教育职业），将来18岁送去上大学，核心的目的，就是建立人脉，解决自己的恋爱和婚姻问题等等。因此：谋取职业，到底应该去上好大学还是普通大学的好专业？山长清一：新教育天书第10问：应该读好大学的普通专业？山长清一：新教育天书第4问：大学专业应该选文科还是理工科呢？\",\"url\":\"\"},{\"slug\":\"2024-02-08-节前最后交易日-燕京9.24元卖出-惠泉\",\"year\":\"2024\",\"title\":\"节前最后交易日：9.24卖燕京换8.38惠泉，每股赚0.87\",\"date\":\"2024-02-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天节前最后的交易日，留一个操作纪念：今天上午燕京快速上涨（难得的机会），就卖了一些出去换惠泉。查看最高居然卖了9.25元的价格，多数是9.24元卖的。而今天最高价也才9.26元。今天买进的惠泉，平均价格8.38元，换股的差价已经每股有0.87元了。后来燕京就一直跌，收盘跌到8.87元。每股今天就收获了价差0.54元，算是赚到的吧？这几天我的账上总资产起伏很大，我都算市场先生的疯狂，不予置理。\",\"url\":\"\"},{\"slug\":\"2024-02-07-兰州黄河三天跌20-前几年做惠泉珠江时\",\"year\":\"2024\",\"title\":\"兰州黄河三日跌20%：典型庄股，观其做盘手法\",\"date\":\"2024-02-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这两天啤酒喝大盘的上涨，这伙计居然没有跟涨，相反三天跌了20%。前几年，我还在做惠泉和珠江的时候，这伙计跌宕起伏，比惠泉珠江更凶。但我一次也不敢买，只敢买珠江和惠泉做这种大T。但会通过观察兰州黄河走势来看庄家做盘的手段技巧，这是一个非常明显的庄股。珠江惠泉，当年我记得一年就T两三次进出，收益颇丰，现在持有惠泉居然是负成本当十大。但兰州黄河持股体验会很好的，常常大涨大跌的，似乎每年可以玩4-6次。\",\"url\":\"\"},{\"slug\":\"2024-02-07-卖涨5的珠江换没涨的惠泉-卖7.6买8\",\"year\":\"2024\",\"title\":\"卖涨5%的珠江换滞涨惠泉：万股换9400，无脑轮动\",\"date\":\"2024-02-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我正好手上持仓多，就没有继续卖燕京来换惠泉了。而是卖今天涨了5%以上的珠江，来换今天还没有来得及涨的还是绿色得惠泉，大批是8.13元买的。珠江卖到了7.6左右，每股差价是0.5-0.6元左右。大概是卖掉一万股珠江，可以换9400股惠泉。不过用珠江也划不来，珠江的筹码锁定良好。珠江主要是性价比----该公司虽然利润比燕京高，但销量连燕京的一半都到不了。因此---理论上，燕京至少应该比珠江市值高一倍。\",\"url\":\"\"},{\"slug\":\"2024-02-07-新教育天书第9问-海外留学选择去什么国家\",\"year\":\"2024\",\"title\":\"新教育天书第9问：海外留学选择去什么国家更好？\",\"date\":\"2024-02-07\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"很多人都会误传（当然，恐怕是有一些居心不良的人故意这样传播的）：新教育的学生，是因为考不上英美国家的一流大学，只能去不入流的小语种国家留学，档次太低了！因此，我的女儿当然会选择学习掌握“不入流”的泰语，将来也会选择去上一个泰国的大学。首先：如果你喜欢城市生活，喜欢西方发达国家的生活方式，就尽量选择去英美的发达国家留学，争取留下来工作，这也是一种不错的选择！因此20年内肯定是这个国家的经济发展最好。\",\"url\":\"\"},{\"slug\":\"2024-02-06-埋头换股-卖出燕京70万股均价8.247\",\"year\":\"2024\",\"title\":\"燕京换惠泉：70万股对等互换，三啤酒轮动不止\",\"date\":\"2024-02-06\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天一直在埋头换股：现在已经停手了，因为惠泉突然上涨，导致价差变小了，我就先歇会。记录历史：今天卖出燕京不到70万股，燕京卖出的平均价是8.2473元。买入惠泉啤酒超过70万股，买入的平均价格是7.7791元（最低7.61元买入的）。当然，不排除3月份惠泉涨幅超过燕京，也许我又卖掉惠泉回燕京了。惠泉，珠江，燕京三个股，谁便宜我就买谁！问我A股要崩了，美股新高，中国是不是不行了？\",\"url\":\"\"},{\"slug\":\"2024-02-06-如何高质量地走完大学四年\",\"year\":\"2024\",\"title\":\"如何高质量地走完大学四年？\",\"date\":\"2024-02-06\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"山长清一：新教育天书第8问：男生上大学的主要目的是什么？另外的相关问题---公主班和高中部的学生，正在学习相关的新教育理念问题。学习方式就是“改写我的文章”，比如要根据我的文章的内容和核心思想，再自己写一个自己的文章出来。今天发布的这个主题文章，就是高中文科班的何天晴同学写的，大家参考一下，看对你有启发没有？排名前三的大学，招生人数是同年龄段总人数的1%，但是却占据了80%-90%的高管职位。\",\"url\":\"\"},{\"slug\":\"2024-02-06-新教育天书第8问之附录-男生上大学的主要\",\"year\":\"2024\",\"title\":\"新教育天书第8问之附录  男生上大学的主要目的是什么？\",\"date\":\"2024-02-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"新教育天书第8问之附录男生上大学的主要目的是什么？公主班和高中部的学生，正在学习相关的新教育理念问题。今天发布的这个主题文章，就是高中文科班的何天晴同学写的，大家参考一下，看对你有启发没有？而上大学的一切目的，就是辅助他达成这一点。上大学的第一个优势，是帮助你在18岁进入职场之前，获得一个终身有效的身份证：证明你在18岁的时候就超越了大多数的同龄人，是一流的人才。\",\"url\":\"\"},{\"slug\":\"2024-02-06-最悲惨记录的背后-是历史最大的财富机遇\",\"year\":\"2024\",\"title\":\"最悲惨记录的背后，是历史最大的财富机遇\",\"date\":\"2024-02-06\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"给人一种美国最强，而“中国要垮”了的感觉。也许目前就是我们历史上最大的财富机会，现在正在给我们最好的投资中国龙头企业的机会！特别中国最近一两年，在高科技上取得重大的突破，在新能源汽车上，造船业等等上，突破非常的亮眼。两个差不多的巨人，站在两台不同的称上，显示出来的数据却是十倍差距。突然发现今天是我有史以来记忆中账户资值增加最多的一天。那么昨天黑色星期一，有可能就是我账户缩水最多的一天。\",\"url\":\"\"},{\"slug\":\"2024-02-05-转网文-美国与得州军事对峙会不会是双簧\",\"year\":\"2024\",\"title\":\"转：美得军事对峙或为双簧，意在逃天量美债\",\"date\":\"2024-02-05\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"转网文：美国与得州居然在进行军事对峙，总觉得有点不可思议，会不会演双簧，目的是逃掉天量美债！特朗普今天在竞选集会公开指出，美国911事件是当时的政府自导自演，没有任何国家和组织介入，不管他说的是真是假。至少有一点是真的，那就是没有什么事是美国做不出来的，只有你想不到，没有他干不出的事。说明：一直有信息，说911事件是美国政府自导自演的事件。还有一批犹太人之前就大量做空航空公司的股票。\",\"url\":\"\"},{\"slug\":\"2024-02-04-新教育天书第8问-男生上大学的主要目的是\",\"year\":\"2024\",\"title\":\"新教育天书第8问：男生上大学的主要目的是什么？\",\"date\":\"2024-02-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"在泰国这种情况很多---女人又要干活养家，又要养儒家文化教育出来的--自大，还无能的，死也不干家务的老公！这种男人，基本上只能躲在家里啃老，被所有人---特别是女生看不起。男人一生事业成功的第一步，就是必须在18岁的时候，获取人生第一个【终生成就标志】：用你考上的大学档次来证明自己价值！男生进入大学的第二个要点，就是确认自己的职业方向！男生进入大学的第三个目标，就是获取未来一生成长需要的人脉！\",\"url\":\"\"},{\"slug\":\"2024-02-03-春节中国人干啥-大吃大喝对身体真的有益吗\",\"year\":\"2024\",\"title\":\"春节中国人干啥？大吃大喝对身体真的有益吗？\",\"date\":\"2024-02-03\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我一直认为：中国人对于吃，有一种神圣的仪式感。无论我们做啥事情，核心的内容一定是“吃”。每天最重要的享受，就是要好好的吃一顿，还要专人烧饭吃。来了泰国，突然发现：这个国家的人，对吃是非常的不在意。回想中国的餐馆，往往都特别的醒目，不少大餐馆，就像是一个高级会堂一样华美，真的是饮食文化的差距巨大！泰国在村头街尾，都是有各种固定的饮食摊位，做好各种正餐食物提供泰人采购。\",\"url\":\"\"},{\"slug\":\"2024-02-02-新教育天书第7问-女生上大学目的和男生有\",\"year\":\"2024\",\"title\":\"新教育天书第7问：女生上大学目的和男生有何差别？\",\"date\":\"2024-02-02\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"如果女生上大学的目的，仅仅是想要取得事业上，职场上的成功。那么女生上大学的目的，与男生其实是差不多的。核心区别在于，女人并不是以事业为人生核心目标的，所以，必须尊重女子的核心价值观追求：女生即使在学业成绩上，以及工作能力上，与男生的实力差不多。第二个要点就是差异化竞争：为了避免跟男生去硬碰硬的卷职场，女性可以选择一些“天生更女性化”的大学专业和职业，就更容易就业了。\",\"url\":\"\"},{\"slug\":\"2024-02-02-重新买回惠泉啤酒-按去年三季度标准又重回\",\"year\":\"2024\",\"title\":\"惠泉暴跌25%重回十大：8.01元再度建仓\",\"date\":\"2024-02-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天重新开始买回惠泉啤酒。看样子，我今天不小心又买惠泉十大了，按照去年三季度的十大标准来看的话，已经重回十大。上周惠泉还玩涨停，气势足足的，我就没想过可能有机会重新买回来的事情，只知道一路卖卖卖。哪里想到，这一周惠泉就开始狂跌模式，大跌超过25%。今天惠泉居然短暂出现了7字头的价格，可惜我没有买到！决定买回来的原因，是惠泉这一轮意外降价。我在燕京和惠泉同价的时候，肯定是卖掉燕京换惠泉的。\",\"url\":\"\"},{\"slug\":\"2024-02-01-顺鑫农业现在还能买吗\",\"year\":\"2024\",\"title\":\"顺鑫农业现在还能买吗？\",\"date\":\"2024-02-01\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我在16-17年买入顺鑫农业的，算是相对大仓了，当时的买入成本是19元左右。其实它现在比我19元买的时候，基本面还更好一些。我当年19元买顺鑫农业的时候（差不多就是与唐建华开始买燕京进入十大同时），股东人数才3万多人。看到这里，你就知道文章题目的答案了：现在顺鑫农业的价格的确很有吸引力，但是确定性远远不如燕京靠得住。这样一对比，大家就知道了：顺鑫农业虽然现在的价格很低，看起来很吸引人。\",\"url\":\"\"},{\"slug\":\"2024-01-31-6个月达到外国语大学专业学习四年的成果\",\"year\":\"2024\",\"title\":\"6个月达到外国语大学专业学习四年的成果\",\"date\":\"2024-01-31\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"从零开始学法语，6个月后顺利拿到B2证书！6个月，我们学会了一门语言_哔哩哔哩_bilibili目前今日三校的【无名塾】创造的这个记录，是远远超过原来今日突破班宣传的【半年学会一门语言】传统标准的。没有要求学生能够达到【听说读写译】同步发展到相当于大学外语专业毕业的程度。我们原来大约从零开始，需要大约13个月的时间，才能达到这种水准。因此无名法语班的这一次尝试、算是对新教育外语学习的再一次提速。\",\"url\":\"\"},{\"slug\":\"2024-01-30-道指创新高-A股跌惨-账面损失大但持股增\",\"year\":\"2024\",\"title\":\"道指新高A股跌惨：账面亏损但加仓，7.63元补燕京\",\"date\":\"2024-01-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"偶然看了一下道指，居然创新高了：38333.45。只是---手头持有的股票已经增加了不少。股指如果回到原位的话，我的市值就会创新高了。很高兴我上周还买到了7.63元的燕京，低位的时候没有恐惧。今天还卖了一些看样子是有资金护盘的中国建筑：5.24元卖出，反手就买入了8.33元的燕京。有机会我就一直加仓，看燕京有无跌破5元的本事。美国股指现在根本就没有上涨的理由，国内都闹成啥样子了。\",\"url\":\"\"},{\"slug\":\"2024-01-29-拿世界冠军-不等于是文化上层\",\"year\":\"2024\",\"title\":\"拿世界冠军，不等于是文化上层!\",\"date\":\"2024-01-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我一开口黑，就把他们全弄傻了：你们清一说，拿到太极世界冠军，就可以成为文化上层。文化上层和世界冠军，根本就没啥本质联系。我才解释道：以为你们代表中国，使用太极技术，去拿了世界冠军就是文化上层，这种思想肯定是错了。而不是有几个人，去世界擂台上拿了几个世界冠军，别人就会送一个“文化上层”的头衔给你。因此，想要用太极格斗拿到世界冠军，以为就能够成为文化上层了，肯定是无稽之谈！\",\"url\":\"\"},{\"slug\":\"2024-01-28-躺平也能上985的时代来了吗-人生是用来\",\"year\":\"2024\",\"title\":\"躺平也能上985？人生是创造精彩还是只为谋职\",\"date\":\"2024-01-28\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"躺平也能上985大学的时代终于到来了吗？全网最淡定老爸撩儿子：即使你初三辍学，在...当所有考大学的努力，目标都只是为了谋职的时候，卷也卷死了。只是----这样的人生有啥意义呢？本文老爸精明过人，纵容孩子也纵容得无奈。但---这是人生的出路吗？人生是用来创造精彩的，还是只是为了“活下去”？大学是为了探索世界的真相？还是为了求取一份卑微的职业呢？你想为了什么去上大学呢？\",\"url\":\"\"},{\"slug\":\"2024-01-27-才华与国运的思考-中华文化上层的路径设计\",\"year\":\"2024\",\"title\":\"才华与国运的思考：中华文化上层的路径设计！\",\"date\":\"2024-01-27\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"给曾老师的第三封信：涉及我对个人命运，国家命运的思考。以及我把对未来【创造中华文化上层】的设计思路的想法汇报给了曾老师。后来顺利考上了武汉大学，当年上大学是有理想和追求的，能够感受到“为了中华之崛起而读书”，“为国争光”的理想和情怀。过去40多年的经济大爆发，也让中国的经济上层结构基本固化。未来必然需要与之相配套的“中华文化崛起”！同时英美白人绝对不会允许我们中国人文化上顺利崛起的，一定会捣乱的。\",\"url\":\"\"},{\"slug\":\"2024-01-27-有人说「这一代家长不管怎么鸡娃-孩子成年\",\"year\":\"2024\",\"title\":\"有人说「这一代家长不管怎么鸡娃，孩子成年后大概率只能做一个普通人」，你如何看待这个观点？\",\"date\":\"2024-01-27\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"因此，大家就不要把过去的期待，加给孩子了。过去40多年，中国人获得了几百年难遇的历史大发展机会，您一定会抓住这一波的大机会，去创造出自己更满意的人生成就，成为一个新时代的传奇人物。今天的我，大概率也就只是千千万万个普通人之一吧？更悲哀一点：未来，恐怕武汉大学也难以继续出现小光，小江这样的情况，以普通家庭孩子的身份，却能够走进中国政治权力的中心，成为政府的高端决策人物！\",\"url\":\"\"},{\"slug\":\"2024-01-26-2023全国泰拳锦标赛清一战队视频辑录\",\"year\":\"2024\",\"title\":\"2023全国泰拳赛清一战队辑录：三金四银两铜，获国字号资格\",\"date\":\"2024-01-26\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"2023全国泰拳锦标赛 清一战队视频辑录链接 参赛，取得 三金四银两铜成绩，已获得入选参加国家泰拳队资格，代表中国参加世界泰拳锦标赛……\",\"url\":\"\"},{\"slug\":\"2024-01-26-股市大跌啤酒股不可思议-卖掉中国建筑-换\",\"year\":\"2024\",\"title\":\"股市大跌啤酒股白菜价：清仓中建换入7元燕京\",\"date\":\"2024-01-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这两天意外看到股市大跌。特别是啤酒股跌倒了不可思议的价位：燕京居然到了7元多？正好中国建筑大概率是国家队护盘资金涌入？中国建筑本来账上还有300万股的，今天都全卖光了，售出价格是5.18元。原来该账户的燕京啤酒是全部卖光了，换了珠江的。现在珠江卖光了，中国建筑元卖光了，都换入了燕京啤酒，今天买入价格是8.20元，记录一下。不过----考虑到我公布账户资产的时候，燕京是10元以上的价位。\",\"url\":\"\"},{\"slug\":\"2024-01-23-原来曾老师是红二代-伯父曾一凡从四川带到\",\"year\":\"2024\",\"title\":\"曾老师实为红二代：伯父曾一凡带大，文革受牵连转治学\",\"date\":\"2024-01-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"他是从小被伯父曾一凡，从老家四川眉山带到武汉来学习成长，后来就一辈子留在了武汉。才华横溢的曾老师，文革的时候，也因为伯父“站错队”而被迫害（他是刘邓工运派出身的人），曾老师就失去了政治发展空间，专心读书，研究学术。后来一直就留在武汉大学，教书育人到退休，这一生没有进入政界。但他的学生，我当年的同学们，进入核心高级层次的人却不少，厅局级一大堆，甚至还有一个同学已经做到了正部级。\",\"url\":\"\"},{\"slug\":\"2024-01-22-转米脂看守所狱警见闻-砍学生的凶手枪毙时\",\"year\":\"2024\",\"title\":\"转：米脂砍学生凶手枪毙瘫软，村民联名不许埋村\",\"date\":\"2024-01-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"但是遇到自己要被法律处罚了，却是一副脓包样。--------上面的故事，由村里的人反应也看得出来，连埋在村里的资格都没有，算是死无葬身之地了吧？看得出来，谁敢于针对学校和学生下手，是我们的社会，所有的族群，都最不能原谅的事情。别说村民了，连自己的亲人都不能接受的，都已跟这种人划清界限的。但民众依然不能接受这些事情，是看不起的。但是民众最不能接受的，就是恶毒伤害学生的恶人了。\",\"url\":\"\"},{\"slug\":\"2024-01-20-前方熊出没-妖怪七伤拳威猛出招\",\"year\":\"2024\",\"title\":\"前方熊出没：妖怪七伤拳威猛出招！\",\"date\":\"2024-01-20\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"官方接到举报后，非常的重视，已经正式立案，启动调查。说目前这种情况下，不适合与我们谈合作，等以后差查清楚了之后再说。妖怪们早就算计好了，要从现在国内政治局势最敏感的地方下手，来一把搞死我们。我们现在正在努力去争取当地政府方面的理解，表示我们绝对没有任何的宗教背景，我和刘老师只是学校的出资人，并不负责具体管理。官方也不能完全相信妖怪的举报，说我们是宗教意识形态有问题，也需要对方提供证据。\",\"url\":\"\"},{\"slug\":\"2024-01-20-澳洲国际学生反常回流中国学校\",\"year\":\"2024\",\"title\":\"澳洲国际学生反常回流中国学校！\",\"date\":\"2024-01-20\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"相当多的华人移民澳洲，是为了给孩子找个更好的学校和学习环境。几乎所有移民，都认为澳洲的教育水平要远远超过国内的学校。所以，下文的作者，早已经移民澳洲的李女士，居然反其道而行之。在澳洲的朋友圈中，她成为了“怪物”，各种不理解，各种议论和反对！现在是澳洲的圣诞长假，我对9个澳洲本土6年级以上的学生做了一次剑桥B1的真题测试，刚好跟我孩子所在今日三校班级的前几名学生进行了相同考试的对比。\",\"url\":\"\"},{\"slug\":\"2024-01-17-妖怪再度作妖-我不想再忍了\",\"year\":\"2024\",\"title\":\"妖怪再度作妖，我不想再忍了！\",\"date\":\"2024-01-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"我好言安抚后好了一点，离开没多久，忍不住又来找我吐槽。他们告诉我，妖怪找了黑帮分子，想要趁我放松警惕回国的时候，找机会绑架我，强制抢钱后就玩消失，去海外当富豪去！我们团队成员认为：这件事情是教育平台的事情，跟我个人其实没有啥本质的关系，我也没有什么见不得人的东西需要跟妖怪私了。所以我想，以后也不要再当什么十大股东了。但两妖怪回避付总交流，也没有依约定见磨丁主席，莫名取消原来不断催促我要去的商谈了。\",\"url\":\"\"},{\"slug\":\"2024-01-16-新教育天书第6问-理工读不了-文科又不能\",\"year\":\"2024\",\"title\":\"新教育天书第6问：理工读不了，文科又不能读。18岁该怎么办？\",\"date\":\"2024-01-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"看了前面的几篇文章，有家长开始着急了：我的孩子，理工科大学是真心读不了，根本就没有这个思维能力。现在说普通文科大学也不能读，那我们该咋办？网络上这两篇文章，基本上与我的文章内容一致。要让她们老老实实的学理工科，将来去做工程，做项目打工，也很不现实。对这一部分就是学不进理工科，或者根本就不想学理工科的学生，该咋办才能更好的就业呢？如果你的孩子18岁了，理工科学不了，当不了产品制造者，就去做销售者吧。\",\"url\":\"\"},{\"slug\":\"2024-01-15-新教育天书第5问-既然文科无用-为啥清一\",\"year\":\"2024\",\"title\":\"新教育天书第5问：既然文科无用，为啥清一大学只设文科课程呢？\",\"date\":\"2024-01-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"当然，我也想反问一下：我们这个社会这么多的大学，或者真心，或是假意，都表示要帮你谋取一个好工作。为啥你们就不允许：世界上至少有一所大学，不以求职谋利为目标，安排自己独特的教学和课程呢？学今日学堂教的真文科，难道就好找到工作了吗？可是你学懂了，也不会有人因为你懂真文科给你一个工作！你设想一下：假如你上清一大学，学一个【人生健康和幸福】专业，上很多有真价值，有真内涵的课程。\",\"url\":\"\"},{\"slug\":\"2024-01-14-我被北京某退休领导推荐到南部战区为国效力\",\"year\":\"2024\",\"title\":\"我被北京某退休领导推荐到南部战区为国效力？\",\"date\":\"2024-01-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这位退休领导同学，这次去了惠州，看到了我们拳手的表现异常优秀。他后来也了解到，这些“全国冠军拳手”，如果来跟我对战的话，只需几秒钟就会被我制服，就更为惊讶，觉得是神话一样的故事。但他居然没告诉我，就把我推荐给了南部战区的高级指挥官了。他说这个#师傅，基本上打不到身上就被KO了。我的想法：您可否报告战区，委托云南方面代表战区，先悄悄约见这个昆明#师傅，恳请希望他“出山”为国效力，训练些优异战士。\",\"url\":\"\"},{\"slug\":\"2024-01-14-新教育天书第4问-大学专业应该选文科还是\",\"year\":\"2024\",\"title\":\"新教育天书第4问：大学专业应该选文科还是理工科呢？\",\"date\":\"2024-01-14\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"而且我们教师，都一直要求学生，将来就读海外大学，要优先选择读理工科，没必要浪费学费去读文科。首先，我大学本科是学理工科专业（电力），研究生是文科（哲学）。如果各位读大学的目的，是想要去找到一个好工作，拿到一份好薪水的话，我不支持去读任何中国大学的文科专业，也不支持去读海外大学的文科专业。我在武汉大学教哲学公选课的时候，我教的本科学生，刚毕业工资就比我这个教师，还是研究生毕业的学长要高五倍！\",\"url\":\"\"},{\"slug\":\"2024-01-13-新教育天书第2问-18岁应该直读大学吗\",\"year\":\"2024\",\"title\":\"新教育天书第2问：18岁应该直读大学吗？还是先体验社会？\",\"date\":\"2024-01-13\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"要回答这个问题，就要先回答：你上大学的目的是什么？如果你上大学的目的，是为了更好的适应社会，做好进入职场的准备，那么：起码先了解社会和职场之后，再去有目的的上大学，才更符合人生的最佳设计模式！只要孩子愿意读书上学，家长会一直供到博士毕业。似乎孩子爱读书就一切都自动会好了，虽然结果并不是这样的！家长会问---如果孩子18岁以后，没父母帮助，就是找不到工作，也挣不到钱，先去读大学不行吗？\",\"url\":\"\"},{\"slug\":\"2024-01-13-新教育天书第三问-为什么新教育学生考国际\",\"year\":\"2024\",\"title\":\"新教育天书第三问：为什么新教育学生考国际高考，而不是参加中国高考呢？\",\"date\":\"2024-01-13\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"当我们的学生，18岁选择不去上大学，直接工作的时候，有人跳出来说：你们新教育的学生，连大学都考不上。又有人跳出来说：为什么你们不敢去考中国高考？但是，从“学生的时间和精力投入”上来说，参加中国的高考，想要进入顶尖的大学，无疑是一次极为艰难的战争，而且对手不仅仅众多，而且很顽强，获胜的难度超级高！作为家长，我认为让我的孩子去参加中国高考，是对她年轻生命的残酷折磨（如果我不用体育特长生申请的话）。\",\"url\":\"\"},{\"slug\":\"2024-01-10-新教育天书-第一篇第1问-学生18岁\",\"year\":\"2024\",\"title\":\"新教育天书---第一篇第1问：学生18岁应该是什么样子？\",\"date\":\"2024-01-10\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这是【新教育天书---0-18岁成长指南】的一部分内容：【18岁+：职场和大学学业的起点】。像是一部【教育的十万个为什么】，设法帮助解决家长关注的孩子教育问题。第一问：新教育毕业的学生，18岁应该是什么样子？新教育学生18岁的最低要求，就是“能自立”。新教育最理想的教育成果，自然就是成才---活成“别人家孩子”的样子。新教育天书第二问：山长清一：新教育天书第2问：18岁应该直读大学吗？\",\"url\":\"\"},{\"slug\":\"2024-01-06-未来的全国冠军集体照\",\"year\":\"2024\",\"title\":\"未来的全国冠军集体照\",\"date\":\"2024-01-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"本次赛事，新教育的很多家长和学生都到场观看比赛。共同见证了新教育的奇迹----学霸是怎样变成全国泰拳格斗冠军的！我有一个预测：5年以后（2028年年底），我们至少会培养出来40-50个全国冠军甚至可能是世界冠军。广东地区的新教育学生与冠军团队合影下面是家长刘方贵赛后发布的赛事记录信息，供大家参考。刘方贵的两个女儿，本次比赛也上擂台实战，两姐妹同台竞争，分别拿到全国泰拳亚军和季军的奖牌。\",\"url\":\"\"},{\"slug\":\"2024-01-04-全国泰拳赛收官-清一武道馆三金四银三铜\",\"year\":\"2024\",\"title\":\"全国泰拳收官：清一武道馆三金四银三铜，男63公斤金牌遭港方黑手\",\"date\":\"2024-01-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本次全国泰拳赛，清一武道馆首次出山，取得的最终成绩是----三金，四银，三铜。只实现了“保三”金牌的目标，没有争取到更多的金牌，本来今天的男子63公斤的金牌，也应该是我们的。【裁判讲规则的时候说过，踢裆第三次之后才会扣一分，他们就利用这个规则，踢两次不会有问题】，但拳手在第一局被踢中之后，选手的体能动作都会受到很大的影响。根据比赛规则，拳手被读秒的话，如果这一局他没有KO对手，就会判输掉。\",\"url\":\"\"},{\"slug\":\"2024-01-04-清一太极归国第一战-拿到三个全国冠军\",\"year\":\"2024\",\"title\":\"清一太极归国第一战：拿到三个全国冠军\",\"date\":\"2024-01-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"武道馆全员出击，每个拳手都拿到了一块奖牌。同台的新人ELLA，还站到比她更高的位置---全国泰拳亚军。虽然香港拳手也是拿了东亚泰拳比赛冠军的香港拳手！朱是香港泰拳王，东亚泰拳王，WBC的拳王，今年28岁，老资格拳手，拥有多个泰拳冠军的称号，去仑披尼打过比赛。赛后，我说这个结局蛮好的，明祺只拿到亚军，让他明白了江湖险恶！本次全国泰拳赛，清一武道馆首次出山，取得的最终成绩是----三金，五银，三铜。\",\"url\":\"\"},{\"slug\":\"2024-01-04-许骥决赛惜败香港泰拳王-经验不足拿银牌\",\"year\":\"2024\",\"title\":\"许骥决赛惜败香港泰拳王：经验不足摘银，功底源自邹家拳\",\"date\":\"2024-01-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"许骥（武士明骐）今天与香港泰拳王，多个拳赛获得很多金腰带的拳手，昨天半决赛击败了武汉体院队员的香港拳手角逐全国泰拳冠军，因经验不足而惜败，只拿到了银牌。许骥的学拳历史回顾，在2019年以前，他曾经跟云南的许师傅学过一点邹家拳。还跟昆明一位孙志刚传武老师，学过一点传统拳。2019年之后，他就专心跟清一老师学太极格斗，打泰征泰，就没有经历其他老师了。今后如有机缘，他还会跟其他高明的传武老师学习提高！\",\"url\":\"\"},{\"slug\":\"2024-01-03-明骐半决赛重创对手-用担架抬出赛场\",\"year\":\"2024\",\"title\":\"明骐半决赛重创对手，用担架抬出赛场\",\"date\":\"2024-01-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"许骥（明骐）今天KO的对手，是用担架抬出场的，膝盖严重受伤,应该是明祺的太极旋身劲导致的。内围战中，对手试图用膝顶击明祺腹部的时候，明祺旋身躲闪的同时，也在破坏对手的重心。对手站不住就硬顶，但他的身体僵硬，硬顶也顶不住这么强大的身体旋转的力量，身形被破坏，导致膝盖严重扭伤。这个拳手挺惨的，这拳手至少3个月到半年才能恢复。但这对手的反应速度慢，跟不上明祺的变化，左腿支撑一直没有改变。\",\"url\":\"https://www.zhihu.com/video/1726025890268626944\"},{\"slug\":\"2024-01-03-泰拳赛半决赛-女拳手10人锁定三金三银三\",\"year\":\"2024\",\"title\":\"泰拳半决赛：女队10人揽三金三银三铜，ELLA进决赛\",\"date\":\"2024-01-03\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们的女拳手，只是派出10个队员，今天就已经锁定了三枚金牌，三枚银牌，三枚铜牌。我们女拳手参加的这三个级别，全部奖牌都被我们囊括了。我们女拳手中，唯一一个被淘汰的就是蔡楷棋，还是被佳慧淘汰的。新拳手ELLA，今天也击败了强大的香港泰拳队的女拳手，晋升决赛。可惜我们没有这个级别的女拳手，不然跟她打一场看谁强。他将与香港泰拳老油条，曾经多次获得各种泰拳金腰带头衔的香港冠军，争夺本次赛事的全国冠军资格。\",\"url\":\"\"},{\"slug\":\"2024-01-01-全国泰拳锦标赛明日开赛\",\"year\":\"2024\",\"title\":\"全国泰拳锦标赛明日开赛\",\"date\":\"2024-01-01\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们的木兰和武士拳手，参加了5个级别的比赛，今天已经完成抽签了，明天就正式开赛。对他们参赛，主要就是让他们去锻炼一下，没有指望他们拿牌的，而且国内的男拳手实力，总体来说还是不错的。武汉体院是国家泰拳队的集训队，实力超强，历年来，都是全国泰拳比赛的NO1。我们所有的男拳手，都要与武汉体院队，以及一个全国知名的泰拳队硬碰硬。所以---真正的实力展现，应该在男拳手这里！泰拳的重心低，移动不灵活。\",\"url\":\"\"},{\"slug\":\"2023-12-31-省级名校眼中的“教育神话-称领先体制\",\"year\":\"2023\",\"title\":\"省级名校眼中的“教育神话\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"---称领先体制几十年！\",\"date\":\"2023-12-31\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"今日学堂正在“反向影响”和领导传统体制学校的教育改革方向！其中，包括体制内实力强劲、成绩显著的几位省特级教师，他们曾带出过多位省高考状元和一批考上清华北大等名校的学生。几年前，该学校总校长从我们学堂一位家长那里听说了今日学堂“四个半月突破一门外语”的神奇教学纪录，就专程来学堂参访过，眼见为实，大为赞叹。其中一位分校长非常感慨地说：“中华文化五千年并不缺少神话，但是现在中国却缺少了一部教育的神话。\",\"url\":\"http://zhuanlan.zhihu.com/p/675458077\"},{\"slug\":\"2023-12-31-磨丁特区主席-表示非常关心我们今日国际学\",\"year\":\"2023\",\"title\":\"磨丁特区主席出面协调今日国际学校风波\",\"date\":\"2023-12-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"他认为这个事情，涉及老挝特别是磨丁特区的声誉，也涉及今日国际学校的声誉和办学的担忧。不要让一些不良的势力和因素，影响磨丁特区的繁荣和安定。我们完全有相同的愿景，共同建设磨丁特区！周主席表示：原话【元旦这几天我都在，有必要的话，我们双方坐下来，同时的话，那个副校长。如果能保障自己和学校的安全，正常的运行情况下，我也不愿意揪住过去不放！所以，我刚才已经回复法律助手：非常感谢周主席关注关心的厚意。\",\"url\":\"https://www.zhihu.com/pins/1724875919762886656\"},{\"slug\":\"2023-12-30-我在泰国被-电诈-清一的-与妖对话\",\"year\":\"2023\",\"title\":\"我在泰国被【电诈】！ 清一的【与妖对话】\",\"date\":\"2023-12-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"都知道东南亚诈骗横行，我在泰国几年了，没发现有啥危险。山长清一：清一名号的由来，20年的反思我还以为我远离尘世，在泰国修仙，修道，练武玩，不去惹世间的烦恼，就一切OK了。我怀疑：我的真朋友，应该已经被妖怪吃掉了。（申明，下面的【与妖对话】，是我虚构的文字和情节。但发现此人说话不正常，总是疯疯癫癫的，一下清醒，一下糊涂，总在说各种疯话，说谁谁谁都对不起她，她要干一个惊天的伟业，怪我也没帮她等等。\",\"url\":\"http://zhuanlan.zhihu.com/p/675163439\"},{\"slug\":\"2023-12-29-今天是2023年A股交易的最后一天\",\"year\":\"2023\",\"title\":\"2023收官：燕京闪崩我抄底两百万股，重回十大\",\"date\":\"2023-12-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我只好尽量的拿钱出来买买买，总共买了两百多万股。所以，我为拯救燕京今天的崩盘，做出了重大的贡献（但也可能会有人认为我在别人砸盘制造恐慌的行动的时候捞筹码，坏了江湖规矩？无论如何，今年的交易终于结束了，明年继续苦哈哈的守燕京吧。但我比老唐已经好很多了，他守了五年的燕京，几乎重回原地了（今天差点破8回7了）。由于今天辛苦救市，也把我的钱全都用光了。等于今年年底，我退掉了两个十大，增加了一个十大。\",\"url\":\"https://www.zhihu.com/pins/1724099763698528256\"},{\"slug\":\"2023-12-29-传统婚姻正在解体吗\",\"year\":\"2023\",\"title\":\"传统婚姻正在解体吗？\",\"date\":\"2023-12-29\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"近期发布的《中国人口和就业统计年鉴2023》抽样调查数据显示，中国年轻人未婚率逐渐上升，其中30岁人群未婚率超过25%，25岁人群更是有七成尚未步入婚姻殿堂。根据我的了解，现在年轻人的“恐婚”情况已经非常严重。就算勉强结婚，之后的离婚率也超高。看到这种情况，你让现在的年轻人，怎敢轻易进入婚姻呢？特别是：现在这些年轻人的父母，有没有示范一个理想的，让他们觉得值得模仿的家庭榜样，跟父母一样进入婚姻呢？\",\"url\":\"http://zhuanlan.zhihu.com/p/675136742\"},{\"slug\":\"2023-12-29-婚姻的本质是什么呢\",\"year\":\"2023\",\"title\":\"婚姻的本质是什么呢？\",\"date\":\"2023-12-29\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"近期发布的《中国人口和就业统计年鉴2023》抽样调查数据显示，中国年轻人未婚率逐渐上升，其中30岁人群未婚率超过25%，25岁人群更是有七成尚未步入婚姻殿堂。据说：40岁的年龄层，基本上离婚率已经超过了100%。现在是一个性泛滥的时代，也是一个婚姻饥渴的时代。但是：性并不能解决婚姻中双方需要的感情饥渴。）女人如果没有素质教育，只有工具教育的话，要么婚姻就是男女双方互助合作的工作组。\",\"url\":\"https://www.zhihu.com/question/438830032/answer/3342673962\"},{\"slug\":\"2023-12-29-婚姻的真相和本质是什么\",\"year\":\"2023\",\"title\":\"婚姻的真相和本质是什么？\",\"date\":\"2023-12-29\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"近期发布的《中国人口和就业统计年鉴2023》抽样调查数据显示，中国年轻人未婚率逐渐上升，其中30岁人群未婚率超过25%，25岁人群更是有七成尚未步入婚姻殿堂。现在是一个性泛滥的时代，也是一个婚姻饥渴的时代。但是：性并不能解决婚姻中双方需要的感情饥渴。）女人如果没有素质教育，只有工具教育的话，要么婚姻就是男女双方互助合作的工作组。所以---工具化的婚姻，男人真的是不需要的！\",\"url\":\"https://www.zhihu.com/question/366234434/answer/3342673152\"},{\"slug\":\"2023-12-28-清一战队已到达赛场-要拿几个全国冠军\",\"year\":\"2023\",\"title\":\"清一战队已到达赛场：要拿几个全国冠军？\",\"date\":\"2023-12-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"全国泰拳锦标赛于本月31日报到，1月1日称重仪式。猜猜看，本次赛事我们清一战队能够拿到多少块奖牌？另外----半年后参加【全国青少年自由搏击锦标赛】的【清一公主战队】已经组队完成，集体亮相了，欢迎各位看看后面的照片！将来，学霸们去打实战比赛，去拿到全国冠亚军，可能证明是最轻松获取世界名校资格的入门证的最佳手段！这是拳手们回国后，在机场的集体合照，山长清一：清一战队已到达赛场：要拿几个全国冠军？\",\"url\":\"http://zhuanlan.zhihu.com/p/674956300\"},{\"slug\":\"2023-12-26-92岁老师对60岁老学生的关心和指导\",\"year\":\"2023\",\"title\":\"92岁老师对60岁老学生的关心和指导\",\"date\":\"2023-12-26\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"是当年我上大学时代的老师，系总支书记曾老师写的，现年已经92岁了。当时的老一代教师，是真心关心学生的成长，而不是关注自己的功名利禄，职称地位。而我的老师，几十年过去，依然觉得我是一个愿意教诲的人，是一个有点傻气，但不乏优点，只是需要用更丰富的人生经历来关心爱护，善意提醒的奇怪学生。如下:曾老师您好：谢谢您的来信和指导。过去时代的老师，对学生的关心是发自内心的，无欲无求的。\",\"url\":\"http://zhuanlan.zhihu.com/p/673924452\"},{\"slug\":\"2023-12-24-清一名号的由来-20年的反思\",\"year\":\"2023\",\"title\":\"清一名号的由来，20年的反思\",\"date\":\"2023-12-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"很多年的时间，我一直在赔钱办学，反正我也有钱用来补贴学校。一些问题孩子，家长送来发现教不了，退学回家就使劲的黑我们！甚至当年，还有官府为了驱逐我们，叫了黑帮人员来我们的校园，威胁学生，要把我们逼走！师父当年，及时出来指点我：说我存心正念，坚持办学做的是好事。师父还给我赐了名号（道号）----“清一”，意思就是“清净纯一”，要求我专心一念，不要被周围的各种污染源搅动，带偏了。\",\"url\":\"http://zhuanlan.zhihu.com/p/673860797\"},{\"slug\":\"2023-12-23-清一实战太极首次集体回国参加全国泰拳锦标\",\"year\":\"2023\",\"title\":\"清一实战太极首次集体回国参加全国泰拳锦标赛\",\"date\":\"2023-12-23\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们已经完成了报名程序：清一太极本期派出14名拳手，参加今年举行的【全国泰拳锦标赛】。这一次，你们在太极征泰视频上，看到的所有木兰和武士，均将回国参加这次比赛。ELLA小公主作为刚刚走上赛场的新拳手，也积极地参加本次锦标赛。她希望自己有机会能够冲入前三名，说不定---还可以入选泰拳国家队呢(内部消息，是本次锦标赛的前三名，都可以进入国家队集训。内部再选出第一名，代表中国参加世界泰拳锦标赛）。\",\"url\":\"http://zhuanlan.zhihu.com/p/673819040\"},{\"slug\":\"2023-12-21-国学和练武-是克制青春期病的最佳应对方式\",\"year\":\"2023\",\"title\":\"国学和练武，是克制青春期病的最佳应对方式\",\"date\":\"2023-12-21\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"只要是家中有青春期孩子的家长，和中学教师，都知道“中二症”的厉害：【中二，是一个网络流行语，多指初二年级青少年的某些病态自我意识。解决方式有两个：一个就是从小树立远大志向，比如新教育的志向：做最好的中国人。但是----真正的有志青年，其实太少了！因此，我根据目前的情况，制定了2024年的清迈高中生文科班的培养计划：就是以国学文化和武术格斗为基础，必须全员练武，提升学生的精气神。\",\"url\":\"http://zhuanlan.zhihu.com/p/673476190\"},{\"slug\":\"2023-12-18-今日学堂15年后重启-少年论语课程\",\"year\":\"2023\",\"title\":\"今日学堂15年后重启【少年论语课程】\",\"date\":\"2023-12-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"为了我的孩子的基本利益，创立了今日学堂。【附录，20年后的今天，5岁的孩子今天25岁了，这个设计证明是成功的。因此，我成立的今日学堂，走向了完全相反的道路。当年的今日学堂，非常注重传统文化课程的教育，要把学生培养成【最好的中国人】。当年她们在11-12岁左右，我就开始教她们庄子课，论语课程了（现在网上，还有我当年课程的【论语讲记】）。这个学期，是15年后今日学堂再一次重启【论语课程】。\",\"url\":\"http://zhuanlan.zhihu.com/p/672814668\"},{\"slug\":\"2023-12-17-现在找工作有多难\",\"year\":\"2023\",\"title\":\"现在找工作有多难：拼爹拼关系，普通家庭出路在哪\",\"date\":\"2023-12-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【据说：某省纪委副书记的儿子，本硕都是双一流，深漂了快一年还没找到工作。某基金一换老大，新老大马上把几个厅级干部的孩子踢走了，原因是他自己手头还有一堆人要安排】。我都替你们着急-----我让家长们学西语，一带一路很好找工作，但家长嫌弃说西语档次低，要去五眼国家，要去体制大学。但你们不知道：今年墨西哥的经济发展是全世界最好的吗？中国正在失去制造业岗位----将来真没啥普通职位了。\",\"url\":\"https://www.zhihu.com/pins/1719758401679020032\"},{\"slug\":\"2023-12-17-职场精英与职业规划课程\",\"year\":\"2023\",\"title\":\"职场精英与职业规划课程\",\"date\":\"2023-12-17\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"这次课程已经完成了：内容在这个链接里面。后因为男友在瑞士，从摩根大通辞职到瑞士一家公司做一个小主管，最后又辞职做起来金融网红自媒体。这样一个精英卷王的故事，我们在做的学生有多少能做到？那么我们如何在将来的职场上，怎样卷过这些人？接着，山长带我们分析认识到她为什么拼命学习？这个精英卷王最后学金融，她学金融才能拿到大钱。而最后她设想通过自媒体来打出名气和销售金融课程的计划，其实最终她也不太可能成功。\",\"url\":\"http://zhuanlan.zhihu.com/p/672683513\"},{\"slug\":\"2023-12-15-香港外资高管-花6000万培养失败的儿女\",\"year\":\"2023\",\"title\":\"香港外资高管：花6000万培养失败的儿女反思\",\"date\":\"2023-12-15\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"这种国际学校的目标，根本就不是培养人才，而是让傻瓜们交智商税！转：楼主的同事认识一个香港朋友，曾是驻上海的外资行高管，家里很有钱。养了三个小孩，从托班到大学一路国际路线，人均花费2000万。30多年了，这个外资高管的大傻瓜，花了6000万，得到这个结果，很不甘心。这个人当年投资给孩子的资产，比我投资给股市的资产高得多。如果你培养失败了，成为了废物，你们就把孩子带回家，乖乖的养起来，不给社会添乱！\",\"url\":\"http://zhuanlan.zhihu.com/p/671770765\"},{\"slug\":\"2023-12-11-金融理财-干嘛非要把简单的事情做复杂呢\",\"year\":\"2023\",\"title\":\"金融理财？干嘛非要把简单的事情做复杂呢？\",\"date\":\"2023-12-11\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"据说：金融行业的主要存在价值，金融从业人员的主要目标，并不是帮客户赚钱，而是如何人=让有钱人手里的钱，拿到自己口袋里面来。金融就是让中产和富裕阶层的财富重新分配。其实我当年根本不知道清粉去买基金的事情。就根本就不理我“花钱买中国龙头企业的高分红股票，然后拿着死也不放，持股分红拿股息”的“傻瓜炒股法”，非要去追求百亿，千亿，万亿的财富。真正用心坚持10年的话，一般可以本金要赚十倍。\",\"url\":\"http://zhuanlan.zhihu.com/p/671666130\"},{\"slug\":\"2023-12-07-职场案例课-中国卷王的成功故事\",\"year\":\"2023\",\"title\":\"职场案例课：中国卷王的成功故事\",\"date\":\"2023-12-07\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"我们学生的高中阶段，其实上的是大学级别的课程，都是成人思维课程。可惜---连中国的大学，都没有来上类似的课程。如果在青年时代，就得到这种人生规划课程，是人生的大幸运。下面是我刚刚布置给高中部学生们（15-16岁）的职场研究学习案例课程作业。由于我们是进行班级作业排名的，学生们做得太卷了。一些外围考入三语高中的学生，虽然SAT成绩过关了（1400分）。）一：中国有大量的人，正在做这个卷王做的事情。\",\"url\":\"http://zhuanlan.zhihu.com/p/670836538\"},{\"slug\":\"2023-12-05-今日惠泉啤酒异动-在大势不好的局面下-居\",\"year\":\"2023\",\"title\":\"惠泉异动冲高：半仓止盈退出十大，疑似主力吸筹中计\",\"date\":\"2023-12-05\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我顺势出货一半左右，退出了十大股东行列，最高的几笔，还卖到了12.24元的价格。不过，晚上复盘看看---发现今天可能犯错误了，可能手上的筹码被骗走了。此股10月25日冲涨停，成交1.56亿。看得出是典型的平台整理趋势，高位收集筹码的样子。所以---我今天卖出半仓的行为，应该是恰好“中计”了。这些惠泉，都是在燕京上涨的时候，股价超过惠泉，我高价卖出燕京，换回来的惠泉，负成本持有的。\",\"url\":\"https://www.zhihu.com/pins/1715446529324875776\"},{\"slug\":\"2023-12-05-重庆啤酒的主力拉升分析-事后诸葛解析\",\"year\":\"2023\",\"title\":\"重庆啤酒的主力拉升分析（事后诸葛解析）\",\"date\":\"2023-12-05\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"重庆啤酒跌的很惨：从209.99的高价，跌到现在只有69元了，三折的股价。如果他当年买的是重庆啤酒，而不是燕京的话，就又成为股神了。我也一样眼拙，没看出重庆啤酒的巨大潜力。再回来说重庆啤酒：它应该是2017年年底，老主力最近一轮的基本仓的建仓工作---打压建仓这个过程完成。显然---此时主力是相当于2018年的重庆，属于拉升建仓阶段。---重庆啤酒的主力，后来就开始打折优惠了。\",\"url\":\"http://zhuanlan.zhihu.com/p/670465267\"},{\"slug\":\"2023-12-01-这几天-中国建筑居然跌破5元了-这可是难\",\"year\":\"2023\",\"title\":\"中国建筑跌破5元：大蓝筹被错杀，低位为国接盘\",\"date\":\"2023-12-01\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"后来去看看美股的走势，差不多快创新高了。我总算找到答案了---美股在无理性的涨，中国国家队当然就要跌了。但美股现在已经涨到天上了，难道它还能再涨到月球上吗？等美股跌的时候，其他的杂股一定会跟着跳水的，国家队就要拉上来护盘了。昨天我用7.13港元，买了100万股中远海控，第一次买入这个股票。原因是发现她的竞争力和成本控制，应该都是世界第一了（至少是中国第一）。买进就不想卖出---除非你给个高价（😁）\",\"url\":\"https://www.zhihu.com/pins/1713875460327546880\"},{\"slug\":\"2023-11-29-今日芒格离世-特转发语录纪念这位智慧老人\",\"year\":\"2023\",\"title\":\"今日芒格离世，特转发语录纪念这位智慧老人！\",\"date\":\"2023-11-29\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\"
