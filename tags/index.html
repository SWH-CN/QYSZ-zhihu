\",\"title\":\"世界亚军首轮即被无名小卒淘汰：她满脸不服也不明白为何输\",\"date\":\"2025-08-11\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"她肯定不明白自己今天场上表现为何这么失常，赛后教练肯定指责她没有认真打比赛，没有把平时练的技术打出来！这个根本没有世界排名，靠外卡才进入世运会，不知从哪里冒出来的小年轻，才练了四年多。其他两个老牌的经验老到的世界冠军，应付明晓显然更吃力，更狼狈！因为后来半决赛和决赛，跟明晓打的两个世界冠军居然一分未得，还被KO了一个人！就是她的运气太差了，首轮就对上命中注定的世界冠军了。\",\"url\":\"https://www.zhihu.com/pins/1938171834257351837\"},{\"slug\":\"2025-08-11-链接“在国外打拳-观众不站在我这一边\",\"year\":\"2025\",\"title\":\"在国外打拳观众不站你这边：逆风中养成明晓最高KO率\",\"date\":\"2025-08-11\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"对手即便虚晃一下，观众也叫好。我习惯在逆风环境中打拳。”的确：中国人在国外打拳，要习惯外国人对中国人的歧视，还要习惯泰国裁判的歪判，对本国拳手的偏袒。只要不KO对谁，泰国裁判就会判你输掉，也养成了明晓出手不留情，每场比赛都想把对手KO掉豪气，让明晓成为KO率最高，也让泰国拳手最怕的对手。\",\"url\":\"https://www.zhihu.com/pins/1938329221970764419\"},{\"slug\":\"2025-08-10-Ella击败天心的文章-知乎孙掌门好\",\"year\":\"2025\",\"title\":\"孙掌门培养不出徒弟只能自己上：拳怕少壮，他迟早输给你\",\"date\":\"2025-08-10\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"他就不知道拳怕少壮吗？他迟早会输给你的！我都怕你们这批少壮。但我先说好：将来他打输了，拜你为师我没意见。但我真心不想见这个疯子，我不会认这个徒孙的。我觉得他太丢人了。你不能拿他来我这里恶心人！所以，ELLA你收徒后，不许带他来见我。我眼不见，心不烦！\",\"url\":\"https://www.zhihu.com/pins/1937943276838719812\"},{\"slug\":\"2025-08-10-中央电视台报道明晓挺近决赛-上传的视频被\",\"year\":\"2025\",\"title\":\"央视报道明晓挺进决赛：创中国女子泰拳新纪录，泰拳教父要见她\",\"date\":\"2025-08-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明晓创造了中国女子泰拳的新纪录，是女子泰拳第一人，已经成为了国礼。中国散打和泰拳教父李老师，昨晚得知明晓获得决赛权后非常高兴，专门联系了我，还特别让我今年的12月份，要我带明晓去武汉见见泰拳教父。估计他要帮明晓规划为国争光的道路。他是一个心心念念想让中国泰拳超越泰国的爱国武术家，虽然已经退休，但人老心不老，依然在关心和帮助下一代健康成长，希望今天明晓再上一层楼。\",\"url\":\"https://www.zhihu.com/pins/1937806990316376620\"},{\"slug\":\"2025-08-10-今天世运会泰拳冠亚军决战-刷新中泰女子\",\"year\":\"2025\",\"title\":\"世运会泰拳冠亚军决战：中泰大战，明晓的对手分析\",\"date\":\"2025-08-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天世运会泰拳冠亚军决战--刷新中泰女子顶尖赛事记录的一天决赛日的中泰大战，对于明晓来说，是相对比较有利的一天，我对明晓的战略和战术指导，对手分析如下：第一：泰拳手是非常正宗的泰拳风格。因此她虽然是世界冠军的身份，排名更高，其实也并不比昨天的对手更难打，最多相当于第一天的世界第二名的样子。因此，今天明晓决赛，依然采用正蹬开路，接拳的技术路线，加上“同归法”的时机掌握，会有发挥攻击的空间！\",\"url\":\"https://www.zhihu.com/pins/1937754822481802841\"},{\"slug\":\"2025-08-10-张清一-明晓刷新中泰女子顶尖赛事记录-今\",\"year\":\"2025\",\"title\":\"张清一：明晓刷新中泰女子顶尖赛事记录  今晚世运会泰拳冠亚军决战，\",\"date\":\"2025-08-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"8月10日：应该是世界顶尖赛事中，中泰女子拳手的第一次巅峰对决！向来看不起中国拳手，特别是看不起中国女拳手的泰国人，将是历史上第一次在顶尖赛事冠亚军擂台上，面对中国女子的挑战！新华社报道今天的世运会泰拳半决赛相比之下，中国木兰是以第二局KO的战绩，提前锁定胜局。而泰国拳手是打满三局获胜的！今天是世界运动会唯一进入决赛的泰国种子选手。反正中国的女子拳手，从来没有在顶尖赛事中，赢过泰国拳手！\",\"url\":\"http://zhuanlan.zhihu.com/p/1937667479456417098\"},{\"slug\":\"2025-08-10-张清一-职业泰拳和IFMA泰拳-业余泰拳\",\"year\":\"2025\",\"title\":\"张清一：职业泰拳和IFMA泰拳（业余泰拳）的本质差异？\",\"date\":\"2025-08-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"刚才，又看了一遍明晓今晚决赛对手的视频，想总结一下IFMA的泰拳比赛，和泰国的职业比赛的差异！技术上，职业泰拳和业余泰拳，两者的要求是差不多的。比如今天的明晓对手，是非常典型的泰拳职业拳手。她的技术，完全是按照职业泰拳的打法来塑造的。她在场上精准的中低扫腿，把摩洛哥拳手扫倒在地下，就是泰拳职业的杀招！泰扫之所以被迷恋推崇畏惧，就是泰扫的本质，并不是想要一招制敌。当然，高扫上头，是可以一招制敌的。\",\"url\":\"http://zhuanlan.zhihu.com/p/1937899613626564755\"},{\"slug\":\"2025-08-10-谭木兰报道-今晚决赛六点开始-先是铜牌争\",\"year\":\"2025\",\"title\":\"谭木兰报道决赛：对手鼻梁骨折退赛，有人算卦让明晓别穿蓝衣\",\"date\":\"2025-08-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"不过第一场的菲律宾人因为昨天被明晓打的鼻子骨折，已经飞回国治疗了，摩洛哥人自动获得铜牌。昨天有个故事，有个人算卦，在我的评论里面留言，说明晓明天不能穿蓝色衣服上场。因为算卦说：明天她穿蓝方就会输掉比赛。结果今天清粉提起来，刚一看赛程表，明晓今天原来换红方了。看样子老天昨天就知道，今天蓝方上场，打48公斤级别的比赛会输掉。老天就是要让红方当冠军，明晓运气好正好穿红衣。\",\"url\":\"https://www.zhihu.com/pins/1937878114672817260\"},{\"slug\":\"2025-08-09-开启了中国女子泰拳的历史新记录今天明晓完\",\"year\":\"2025\",\"title\":\"明晓完美执行指导：开创中国女子泰拳历史新记录\",\"date\":\"2025-08-09\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我公布了对今天明晓上场对战的打法之后，大家可以参看下面的内容。很多人说：我不能把指导明晓场上的秘密说出来，其实没事的，对手知道了也没法应付的！张清一原创：木兰明晓世运会打入半决赛当然，还有一些更细节的指导，我没有公布的。昨天刚开始，知道要面对这个菲律宾拳手的时候，明晓还没信心。我帮她分析了菲律宾拳手的优势和弱点，指出内围战应该是她的弱点。开启了中国女子泰拳的历史记录，是百年未有的创造！\",\"url\":\"https://www.zhihu.com/pins/1937593804065600631\"},{\"slug\":\"2025-08-09-拳场-曾是女人的禁地泰拳锦标赛主办方来访\",\"year\":\"2025\",\"title\":\"拳场曾是女人禁地：仑披尼拳场禁女入，十年前才开禁\",\"date\":\"2025-08-09\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"仑披尼拳场，原来是禁止女人进入的，现在开禁。即使是现在，拳台进入的时候，男子是带着蒙空，从围栏的上方跨越进去的。而女拳手，必须取掉蒙空，只能从围栏下面钻进去。今天，我们的公主和木兰们，能够公平地站上擂台，是时代的红利。是我们这个社会文明化的表现，女孩们珍惜机会。【摔跤吧爸爸】里面，婚礼的场面，让女孩醒悟过来：爸爸不是简单的把她嫁出去，捞一笔彩礼，相反，愿意费尽心血的来教她。\",\"url\":\"https://www.zhihu.com/pins/1937559158443471394\"},{\"slug\":\"2025-08-09-明晓是第一场比赛\",\"year\":\"2025\",\"title\":\"明晓首场即决赛：对手强但她已找回发力自信\",\"date\":\"2025-08-09\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这是非常重要的一场比赛，胜利者进入冠亚军决赛。谭木兰给我的内部汇报：好的，可能是上次世锦赛的失利之后，她就有点自我怀疑，加上后续练的时间太短，所以她对自己的发力一直不太自信。另外关于今天的对手有个信息是，据说她看到另外半区的对手时直接跟对方打招呼说：我们决赛见！明晓一开始就打世界冠军，心理上就不够强。今晚半决赛的另外一场比赛，双方都有世界冠亚军的头衔，双方的实力很强，比赛会相当精彩的。\",\"url\":\"https://www.zhihu.com/pins/1937472063624450910\"},{\"slug\":\"2025-08-09-这就是共业-一个人的无良-影响一大堆的无\",\"year\":\"2025\",\"title\":\"一人无良殃及无辜：武大风波让女大学生求职更难\",\"date\":\"2025-08-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一个女人的疯狂，不仅仅影响了一大批她的母校，还影响了更多的女人。很多单位，因此更有理由不要女生入职。在这目前供过于求的用人环境之下，女大学生的毕业出路，就更加的艰难了！王大聪明的学堂，居然表里不一，欺骗家长，不仅仅导致家长们纷纷离开她的学堂。但她的这些不良言行，带来的更是所有的外围学堂，都被家长们怀疑。但外围学堂，这些不吭声的人，家长们不会认为你家里一定没事，说不定认为你们就是和王大聪明一样的。\",\"url\":\"https://www.zhihu.com/pins/1937485372008408963\"},{\"slug\":\"2025-08-08-今天双喜临门-明晓打进世界运动会半决赛\",\"year\":\"2025\",\"title\":\"双喜临门：明晓进世运半决赛，账户再创新高\",\"date\":\"2025-08-08\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"为了庆祝，我就继续卖了差不多一百万股燕京股票出去，最高价格13.17元卖出。另外同步买入了100万股珠江，珠江好不容易再次突破千万级持仓。还有一桩喜悦的事情是：早上我刚买了20万股冠农，7.93元买的，下午一看：就涨了快4个点了，一天赚了搞几天的全账户利息钱。超过八，我总有买入的心理障碍。跌破8元，如果有钱，就总想买一点！今天是个好日子：卖出的日子。什么时候跌了，也是好日子，净买入的日子！\",\"url\":\"https://www.zhihu.com/pins/1937169911957938864\"},{\"slug\":\"2025-08-08-对手是2023年的世界锦标赛亚军-也不过\",\"year\":\"2025\",\"title\":\"世锦赛亚军也不过如此：明晓三局直连闯进决赛\",\"date\":\"2025-08-08\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明晓今天三局直连，打得很勇猛，打乱了对手的节奏，赢得了最终的胜利。第三局双方的体能都不行了，明晓打得有一点保守。估计是场上的教练教她保守的，因为前面已经连续胜了两局。第三局保守一点，只要不被ko，就是她赢下比赛！第三局对手体能也很差了，想要赢下来的心态很重，就会蛮干，抓紧机会迎击对手，就会赢得比赛！明天的半决赛对手，是菲律宾拳手，她今天击败了乌克兰拳手，给对手脸上挂花了！\",\"url\":\"https://www.zhihu.com/pins/1937149194595968370\"},{\"slug\":\"2025-08-08-张清一原创-木兰明晓世运会打入半决赛\",\"year\":\"2025\",\"title\":\"张清一原创：木兰明晓世运会打入半决赛\",\"date\":\"2025-08-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"她前两局被打的完全没有章法，只好跟随明晓木兰乱打一气！第三局明晓体力严重下降，又被乱指挥不让她打，她有些糊涂了，才扳回一局。清一新教育|明晓闯入世运会半决赛，创造中国泰拳队史上最佳战绩【完整比赛视频发布】虽然说胜利者不接受指责但我今天还是批评了谭木兰和明晓，没有把我的战略指导真正的用出来。看了一遍视频，明晓有很多次，跟原来的打法一样，是主动出击的。明晓今天的攻击非常急躁，不是我教的意图！\",\"url\":\"http://zhuanlan.zhihu.com/p/1937283697968677597\"},{\"slug\":\"2025-08-08-谁想抢聪颖学社的老鼠大餐\",\"year\":\"2025\",\"title\":\"谁想抢聪颖学社的「老鼠大餐」：庄子寓言成真\",\"date\":\"2025-08-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"她看到凤凰飞过，就爪子紧紧的抓住老鼠不放，仰起头来恶狠狠的说“吓”。当年庄子讲这个故事，是讽刺惠施老同学，当了梁国的宰相。庄子连国家的官位都看不上，有人却以为：庄子要抢猫头鹰的老鼠，回家去做烧烤，啃老鼠脚吃。大概是宋老师说他，如果WC不再继续造谣诬陷宋老师的话，他就罢手，不去宣布更多的聪颖学社的内幕了！2：你聪颖学社，如果真，如果好，如果家长真欢迎，真喜欢，怎么可能倒闭？\",\"url\":\"https://www.zhihu.com/pins/1937133010093843140\"},{\"slug\":\"2025-08-07-1、离火大运未来这几年-一定要抓紧时间修\",\"year\":\"2025\",\"title\":\"离火大运将至：抓紧修德，否则沦为空心人\",\"date\":\"2025-08-07\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"有福报之人和无福报之人的差别会越来越大，没有福报将会寸步难行，痛苦太多。真正懂得这个秘密的人，都在抓紧时间，停止一切玩乐，停止一切轮回，以突破被设计好的命运，要跟上并超越，才有希望！福报不够，善缘不够，想做事情，心有余而力不足。大德做事情，或者度众生，只要振臂一挥，大家都跟上来了。作者：郑一个懿链接：离火大运：今后三年的建议和忠告，有缘人收来源：知乎著作权归作者所有。\",\"url\":\"https://www.zhihu.com/pins/1936904957052815235\"},{\"slug\":\"2025-08-07-今天卖了120万股燕京-价格是12.91\",\"year\":\"2025\",\"title\":\"卖120万燕京换120万珠江：价差拉大，巩固十大\",\"date\":\"2025-08-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"买了120万股珠江，价格是10.43-10.45元。两者价差，差不多是2.5元弱一点的样子。相当于几年前，用7.5元的燕京换了5元的珠江？因为燕京至少应该比珠江贵一倍才对。但我原来本来就是用0.6-1.2差价的珠江，换的惠泉啤酒和燕京。而两年前，我又是卖出了13-14元的燕京，换了9元以下的珠江。燕京也是在中午1点过一点，两分钟之类，拉涨了30个价位，成交了三百多万股，有点像是换庄的样子？\",\"url\":\"https://www.zhihu.com/pins/1936844925917439458\"},{\"slug\":\"2025-08-07-张清一-本次世界运动会国家泰拳队比赛结果\",\"year\":\"2025\",\"title\":\"张清一：本次世界运动会国家泰拳队比赛结果预测\",\"date\":\"2025-08-07\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明天：8月8日，就开打本次世界运动会的泰拳比赛了。这个世运会，与世界锦标赛不一样，相当于奥运会级别。而泰拳世界锦标赛，每个国家都能派人参加，体重级别也更多，至少有12个以上。从实际水平上说：中国队原来参加世界锦标赛，面对对手还不如世界运动会的拳手，都是在第一轮就全部淘汰了。她可能会带来中国泰拳队突破世界格斗的一点希望和惊喜，有可能冲过第一天全军覆没的结果，拿到进入半决赛的机会！\",\"url\":\"http://zhuanlan.zhihu.com/p/1936562383117059245\"},{\"slug\":\"2025-08-07-捍卫我的教育理想-从迷惑到开始觉醒满足一\",\"year\":\"2025\",\"title\":\"捍卫教育理想：满足欲望易，断除欲望难——清黑清粉思维之差\",\"date\":\"2025-08-07\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我们看到了就是清黑，清粉的核心思维本质的差异，导致的行为和结果的最大差异：让我想到了【色戒】当中师父的教导：让达世去想，断除一个欲望，和满足一个欲望，谁更容易？人们会很容易认同WC的下述论点，实际上，大多数家长，就是这样教孩子的！聪颖的理念：1.人不要总和自己的短板过不去，绕开它，只做自己擅长的事情。我估计，所有人的擅长都一样，就是父母给我们的身体，食物和色情的本能追求。\",\"url\":\"https://www.zhihu.com/pins/1936882452632147363\"},{\"slug\":\"2025-08-07-明德女塾的校训-需要改改了-原来是爲父母\",\"year\":\"2025\",\"title\":\"明德女塾校训该改了：从乖巧女儿到培养「哪吒儿女」\",\"date\":\"2025-08-07\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"爲丈夫培養貞静賢淑的温柔妻子！爲孩子培養慈愛慧智的明達母親！爲中國培養诚敬柔韧的偉大女性！爲世界培養優雅靈秀的東方淑女！我们要与时俱进，改成下面这样的新版培养目的才行，才能满足中国家长对于养出哪吒儿女的强烈需求。这是158个亿带来的教育价值重塑：为父母培養能吃会玩的可爱女儿！爲丈夫培養脑满肠肥的圆润妻子！爲孩子培養放纵宽容的太乙母親！这样就符合现状了#清黑是失败者##清一山长！\",\"url\":\"https://www.zhihu.com/pins/1936712816133404609\"},{\"slug\":\"2025-08-07-清一新教育清一木兰将代表国家队出战——世\",\"year\":\"2025\",\"title\":\"清一木兰出战世运会倒计时：明晓首战对新加坡亚锦赛银牌\",\"date\":\"2025-08-07\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明晓是轻量级，48公斤，应该是第一批开打的人，四场比赛，8名拳手中决出前四名出来！她能够打到亚锦赛，世界锦标赛的冠亚军决赛，虽然最终没有拿到金牌，但绝非平庸之人，实力一定有过人之处。她是一个反架拳手，跟我们很相似。看她风格，是硬派拳手，像个坦克手一样推进。所以，我判断一般人啃不动她，肯定很耐得住打击，然后用重手打防守反击，对手交换打击就会输给。所以她能一路冲到最后的冠亚军决赛，一路击败其他对手。\",\"url\":\"https://www.zhihu.com/pins/1936809571587973313\"},{\"slug\":\"2025-08-06-清黑是人生失败者真实不虚这几张的照片\",\"year\":\"2025\",\"title\":\"清黑是人生失败者：25岁的谭木兰与WC，同样年纪天上地下\",\"date\":\"2025-08-06\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"同样是年轻人，24的谭木兰和25岁的WC。一个正在赛场为国争光，另一个与海外势力勾结，攻击中国对学生帮助最大的教育系统。一个过着有节制的生活，自律自强。一个过着放纵欲望，吃喝玩乐的日子！身体比50岁的大妈更臃肿。两人不同选择的结果，才25岁体型就已经是天上地下未来的她们，更是天堂与地狱的差别。#清黑是人生失败者##清一新教育##今日学堂#……\",\"url\":\"https://www.zhihu.com/pins/1936335447002427812\"},{\"slug\":\"2025-08-06-今天上午挺好笑的-午市结束之前-我卖了3\",\"year\":\"2025\",\"title\":\"午市前卖30万燕京换30万珠江：做啤酒股差价\",\"date\":\"2025-08-06\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"但我还不想下车啤酒股，就买了30万股珠江，价格10.38元。各位应该记得：我在珠江燕京差距0.80-1.20的时候，是拼命卖掉珠江，买燕京，买惠泉的。所以我珠江的份额最近一段时间一直在减少。燕京惠泉一直增加（两年前上一轮燕京冲14，其实我走掉了70%）。今天已经有2.50元了。所以我开始反向操作，卖出燕京，买入珠江。所以我现在很自觉地卖，今天卖了30万股，主账户首次跌破千万股。\",\"url\":\"https://www.zhihu.com/pins/1936446119082202607\"},{\"slug\":\"2025-08-06-川普没爱上保洁-但中国短剧的模版公式真出\",\"year\":\"2025\",\"title\":\"中国短剧出海碾压老外：当年才女如今文章却语无伦次\",\"date\":\"2025-08-06\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"川普没爱上保洁，但中国短剧的模版公式真出海碾压老外了…当年18岁，就写出【清姑娘一生故事】的YZL小才女，为啥现在写出来的东西就像小学生一样语无伦次，逻辑混乱？除了一堆情绪之外，都不知道她为何激动生气成这个样子。WCY的文章，特别是她的第一篇攻击卖惨的万言书，看看水平与雨纯写的文章，完全是天差地远。当年16的时候，两人体型都比雨纯好多了。身体变这样的原因找到了，就是一箱一箱的吃武汉精武鸭脖。\",\"url\":\"https://www.zhihu.com/pins/1936353029302497684\"},{\"slug\":\"2025-08-06-张清一-离开生地-即入死地-道德经智慧理\",\"year\":\"2025\",\"title\":\"张清一：离开生地，即入死地！道德经智慧理解明一班学生现状。\",\"date\":\"2025-08-06\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"借用明一班，王大葱等人真人出演的真实案例，给大家讲讲老子的人生和社会智慧吧！实际上，老子的智慧局限不限制事业，而是根据我们思考和理解的对象不同，想解决的问题目标不一样，你也可以翻译，带入成为别的目标！“死”理解为“生活失败”，也一样符合这个天道！这一段：我的翻译如下：离开了生（成功）的道路，就进入了死（失败）的道路。（所以要随时让自己留在“生”道上，不能进入“死”道去求生。\",\"url\":\"http://zhuanlan.zhihu.com/p/1935303798148006245\"},{\"slug\":\"2025-08-06-我有点好奇-孙大师一堆群黑出来捧他臭脚\",\"year\":\"2025\",\"title\":\"孙大师被黑子捧臭脚，却没人真去学功夫扫平武道馆\",\"date\":\"2025-08-06\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"毕竟，我都承认他功夫比我高，我打不赢他。他不是也一直说，愿意免费来教徒弟，只要目标是击败清一吗？真看不起今日，看不起清一，这里不有个现成的清黑武术大师可以去拜师吗？另外一个好奇之处：王聪颖闹这么大的动静，一堆人“拥护支持”，她的文章评论有700多条。我想知道：有没有她学堂的家长，公开出来站位她的？我看她有个表弟，有个助教出来帮她说话，真话假话不论，毕竟利益相关人员，说话不靠谱的。\",\"url\":\"https://www.zhihu.com/pins/1936495524225187850\"},{\"slug\":\"2025-08-06-清黑没题材炒-没黑材料了\",\"year\":\"2025\",\"title\":\"清黑没黑料了：拿三年前指导照片暗示我害死学生\",\"date\":\"2025-08-06\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"就别出心裁，拿我调整黄小燕的儿子王明宇的指导，用来暗示我指使熊杰老婆，把LC的女儿搞死了。【这篇是我三年前发表的文章，就是当年她在庄园里面调整孩子的照片，三个清黑孩子都在。睁着眼瞎说话，#清黑是人生失败者#下面截图里面，我对话的对象是黄小燕。当时黄某在国内的基金会人设垮台后，跑来清迈我身边说要“好好跟随学习”（现在回头估计是想当马夫人）。当时我与刘老师关系有点问题，不知道是不是她的巫术起作用了。\",\"url\":\"https://www.zhihu.com/pins/1936347105288524818\"},{\"slug\":\"2025-08-05-今天的央视体育台新闻播报-中国泰拳队正火\",\"year\":\"2025\",\"title\":\"央视报道中国泰拳队备战世运会：明晓封闭训练，我教她「同归于尽」打法\",\"date\":\"2025-08-05\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我教她最新的，也是最后的格斗技术：同归于尽格斗技术。明晓上场的原则，就是教谭木兰去香港打东亚赛的比赛：每一次都竭尽全力，当做最后一场比赛来打。不要想下一场，更不要想拿冠军不拿冠军的，只想上场后，就不要留任何的遗憾，打好当下的比赛！另外：尽量接近对手再出击，不要怕，抱“同归与尽”的态度去打（就是你打我一扫腿，我还你一正蹬），不要想占便宜，想玩投机，玩无损作战，别想打了就跑。\",\"url\":\"https://www.zhihu.com/pins/1936202715240849594\"},{\"slug\":\"2025-08-05-如何看待武大求职者因母校风评差被拒面\",\"year\":\"2025\",\"title\":\"如何看待武大求职者因母校风评差被拒面?\",\"date\":\"2025-08-05\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这就是武大当初不认真，不公平处理此事，带来的极度负面的后果！作为武大的校友，我无话可说！同时，也发现了：假如我三月份不去与王聪颖划清界限。别人会不会认为：今日学堂就是她聪颖学社的样子？清一新教育就会垮在一个不负责任的胖妇人身上！外围办学的信誉，不可避免的受到严重的冲击和影响！抱有怀疑的家长们，敢还去上外面这些不知根底的学堂？一条自毁毁人的道路，跟这个武大的杨某人一样混蛋！\",\"url\":\"https://www.zhihu.com/question/1934380134187663608/answer/1936138817032656635\"},{\"slug\":\"2025-08-05-张清一原创文章-新教育的新纪元\",\"year\":\"2025\",\"title\":\"新教育的新纪元：2025清黑事件是境外势力操弄的一盘棋\",\"date\":\"2025-08-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"真爱与真自由2025的清黑事件，是得到了境外势力支持下的一次系统的攻击。WC不过是这些破坏势力操纵下的一个棋子而已。新加坡特别西化的华人国家，特别崇拜西方，甚至以说华语为耻，和马来西亚完全相反！新加坡人认为说华语的中国人就是低等人，高华要说英语。当年的中国的确贫穷落后，他们出去后，就自己认为高人一等，是高级华人。教育上，也很崇拜西方的“爱与自由”。就因为美国的这种教育实在是太烂了，水平实在太差了。\",\"url\":\"https://www.zhihu.com/pins/1936013788101998312\"},{\"slug\":\"2025-08-05-张清一原创文章-新教育的新纪元-真爱与真\",\"year\":\"2025\",\"title\":\"新教育的新纪元：2025清黑事件是境外势力操弄的一盘棋真爱与真自由\",\"date\":\"2025-08-05\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"2025的清黑事件，是得到了境外势力支持下的一次系统的攻击。WC不过是这些境外势力操纵下的一个棋子而已。这就是美国爱与自由的结果，美国本质上是靠外国精英移民来维持竞争力的。有一个通灵的高人对清黑们说：她们是新教育的新纪元开创者！现在他们的认知，被忽悠出来的概念，就是以为必须灭掉我们清一新教育，他们才能出头成为新教育的“新纪元”。作为回馈，可以让你跟随学习正宗版本的“真爱与真自由”的清一新教育。\",\"url\":\"http://zhuanlan.zhihu.com/p/1936001459759068150\"},{\"slug\":\"2025-08-05-清一新教育-爱与自由VS爱与严格-我们究\",\"year\":\"2025\",\"title\":\"爱与自由VS爱与严格：孩子爱学堂，父母却怒称洗脑\",\"date\":\"2025-08-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"她女儿其实很爱今日，说她的理想是要做今日的老师。觉得我们洗脑了，让她女儿背叛了父母，她白白养了女儿！他们的父母太自大，一直想要“超越今日”，心大了。堂主居然也很懒，不教学，真的跟WC一样搞笑！但现在清一新教育挡路了，所以要清除掉我们！前途迷茫，体制进不去，新教育圈也是边缘人！因此，这群人就在这种（大，老）心机婊的鼓动下，开启了这一场有计划，有目的的清黑大战，目标就是开启新教育的“新纪元”！\",\"url\":\"https://www.zhihu.com/pins/1935858270649689180\"},{\"slug\":\"2025-08-04-30多年前-中国女排崛起-成为世界冠军\",\"year\":\"2025\",\"title\":\"30多年前中国女排崛起：一代人的激情与热爱\",\"date\":\"2025-08-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"想起这些人，我们这带人，心中是涌动的激情和爱。当时大学生们挤在一起看简陋的电视机里面的比赛实况，激情涌动的学生时代。这些排球女将，也获得了更大的人生自由空间。明晓第二天，就要出发去成都之前，她胡思乱想的，在想她打拳有没有意义？我当时是大骂了她一顿，把她骂哭了，骂得很厉害。骂她没脑子，还喜欢装哲学家，不听师父的安排，挺有自己想法的。中国女排当年崛起的标志，是依靠一个叫做“魔鬼大松”的日本教练起来的。\",\"url\":\"https://www.zhihu.com/pins/1935841783000040915\"},{\"slug\":\"2025-08-04-因为欠款8个亿还不上\",\"year\":\"2025\",\"title\":\"欠款8亿还不上？清黑编这种假消息也太假了\",\"date\":\"2025-08-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"因为上周不是大家都账户新高了吗？我肯定是范进中举一样：喜上心头，高兴过头死了。清黑们应该找个千股跌停，股市熔断的时刻，一批人纷纷跳楼的消息传出来，就像是2015年8月份一样，此时宣布这个好消息！算出了黑魔法昨天发动，今天你们故意用一个跳楼的消息来掩盖？#清黑是人生失败者##王聪颖教学事故##清一新教育#我再给清黑出个好主意：这样讲故事，可能更像是真的！因为年纪太大了，就不幸死于孙大S的掌下。\",\"url\":\"https://www.zhihu.com/pins/1935761948240217682\"},{\"slug\":\"2025-08-04-清黑没本事上国家的擂台-但有本事躲在下面\",\"year\":\"2025\",\"title\":\"清黑上不了擂台却玩绝户黑手：孙掌门扬言五秒绝户ELLA\",\"date\":\"2025-08-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"怕我们不知道是啥意思，还特别说了就是“绝户手”。他要打得男人绝户，要让年轻女人不能生孩子！他想让我无法生育，反正我也老了，无所谓了。ELLA不就是下了战书：让他培养个男徒弟来跟她打比赛吗？就是绝了弟子传承，晚上睡不着怕祖宗怪罪，也不是啥问题，吃个安眠药。你孙大S，至于要恶毒到对下战书的小女孩玩绝育手术吗？但孙的心思，一开口，就是要“绝户”的心思，就是他很想要人“断子绝孙”的心思。\",\"url\":\"https://www.zhihu.com/pins/1935684556138214125\"},{\"slug\":\"2025-08-03-12年前-我的武功是啥水平\",\"year\":\"2025\",\"title\":\"12年前，我的武功是啥水平？\",\"date\":\"2025-08-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"文章后面是一个视频，我2013年教静慧，聪颖和卓蓝三人的视频，当时没有想留影的。2013年云南会泽清一教学员练武明一班代表人出场到现在，我还是这样打人的，只要一出手对方就莫名其妙的中招，就得倒下。12年前，我的速度还不如现在，力量也不如现在。非要说我们木兰的擂台拿冠军的功夫，是他教的。现在我就解析一下：为啥这些自己有功夫的传武拳师，就是教不出能够去上擂台实战的学生弟子？\",\"url\":\"http://zhuanlan.zhihu.com/p/1935362905517322634\"},{\"slug\":\"2025-08-03-Q真学社原来是这个样子的\",\"year\":\"2025\",\"title\":\"Q真学社真相：收数百万学费却管理失控，与公主塾天差地别\",\"date\":\"2025-08-03\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"宋文硕：《“求假学社”管理失控实录》钱老师最新的文章，正好报道了公主塾的现场情况。与Q真学社相比，完全是天下地下！这个26岁的明一班的明星学生，在今日带班，还勉勉强强像个样子。但比17岁的公主塾学生，差距已经是很大了！但你自己出去办学，收数百万学费，却办成这个烂样子，我真的吃惊了！是不是明一班自己离开，被开除的几个学生，你们全都WC这德行？原来你求真，你呼唤教育的初心，初心是这样的？\",\"url\":\"https://www.zhihu.com/pins/1935295531246158488\"},{\"slug\":\"2025-08-03-如何看待人民日报官方微信公众号转载的文章\",\"year\":\"2025\",\"title\":\"如何看待人民日报官方微信公众号转载的文章《孩子，我宁愿欠你一个快乐的少年，也不愿看到你卑微的成年》？\",\"date\":\"2025-08-03\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"如果家长能够为孩子提供人生全程的尊贵保护，我认为也没必要去体验啥卑微的少年！快乐童年，快乐少年，快乐中年，快乐老年，快乐死（不对，安乐死）。比如你们这些家长，有金三代的实力，当然有权力安排，让自己的孩子拥有尊贵的金色四代的人生！但我和你们这些自恋的家长不一样：第一：我认为世界上根本就没有“快乐”这回事。我看所有人全都不快乐了。快乐就是一种感觉，去追求这种感觉，你一生就找不到方向的。\",\"url\":\"https://www.zhihu.com/question/50197441/answer/1935452677497660010\"},{\"slug\":\"2025-08-03-张清一-反省我过去犯下的严重错误-完整补\",\"year\":\"2025\",\"title\":\"张清一：反省我过去犯下的严重错误（完整补充版）\",\"date\":\"2025-08-03\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"反正肯定不像我下面这张照片，就是某人在离开学堂的前两年，当小道姑生活在苦难黑暗中的历史照片。在学堂苦恼得要自杀的WC，正是这两张照片的对比，让我发现了我的罪过。我罪大恶极：居然把想要过上面这个胖妇人幸福生活的WC，培养成了下面这个小道姑。怪不得导致这两口子过上“娘娘”的幸福日子之后，都要来反攻倒算，要来黑我们一家了！下面的达世，经过三年的闭关考验，成为备受尊重的顶尖圣人。\",\"url\":\"http://zhuanlan.zhihu.com/p/1935323636593582215\"},{\"slug\":\"2025-08-03-张清一-给国家体育总局武术管理中心的一封\",\"year\":\"2025\",\"title\":\"张清一：给国家体育总局武术管理中心的一封信\",\"date\":\"2025-08-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"清一武道馆派出了总共16人的战队前往参赛。因为清一武道馆诞生的目标，就是击败世界各国的冠军拳手，为国争光，不是在国内争名夺利。为了让相关方面了解我们的情况，本次赛事前，我写了一封说明信，给国家体总武管中心的领导，说明和介绍了我们的情况。在赛事第一天，就交给了国家体育总局的领导们，裁判们。一些人凭猜测，会胡乱想象我们的突然出现，会有很多想象的故事，也许会影响到武管中心的领导对我们的判断。\",\"url\":\"http://zhuanlan.zhihu.com/p/1931446590079469359\"},{\"slug\":\"2025-08-03-老子作-道德经-的目的是什么\",\"year\":\"2025\",\"title\":\"老子作《道德经》的目的是什么？\",\"date\":\"2025-08-03\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"道德经是海关关长尹喜，发现老子是难得的高人，就借口老子没有出关许可，要过关就要潜规则他，拿钱还不行，强迫他留下来，写一部【人生指南书】。因此，是尹喜有留下道德经的目的，老子自己是没有的，书是被动写的。如果老子当初直接出关了，我们现在啥都不知道，不了解历史上，我们有个这么伟大的思想家，人生指南大师！当年老子的思想，已经远远超过时代的理解，大家都在争名夺利的。是中国“多灾多难”时代的开端，战国时代！\",\"url\":\"https://www.zhihu.com/question/1918646651263882123/answer/1935343761933731074\"},{\"slug\":\"2025-08-02-根据权利人投诉-您发布的文章「张清一-反\",\"year\":\"2025\",\"title\":\"知乎因投诉删除《反省我过去犯下的严重错误》：维权通知转送\",\"date\":\"2025-08-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"当事人的投诉详情如下：投诉内容：如图投诉说明：本人实名王聪颖，该文章未经我允许随意使用我的照片，并大肆进行抹黑攻击。攻击我为胖妇人等侮辱性词汇，要求下架（投诉内容和投诉说明非知乎官方提供，由投诉方填写。英子同学说：要是我，我就留着气自己，每天看一次，然后去运动！老实承认：当年俺也是胖过的，谁还没吃过好东西？我可是先富起来的第一代创业者，当老板的时候，我体重最高达78公斤。\",\"url\":\"https://www.zhihu.com/pins/1935124731935295381\"},{\"slug\":\"2025-08-02-清一新教育｜新一代公主塾到底在示范什么样\",\"year\":\"2025\",\"title\":\"新一代公主塾示范什么教育：清迈创新、磨丁量产，SAT降100分申全奖\",\"date\":\"2025-08-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"谢谢钱校长的用心记录和观察，揭示了“未来版今日新教育”的创造。因为清迈就是我的教学创新基地，磨丁是定型后的“量产基地”。【公主塾对于英文学习的要求则会相应降低，学生们可以降100分也就是SAT1400分申请全奖的冠军班。】如果家长都想要公主塾这个优惠条件的话，我觉得：是不是9月份开始，我们今日这边，也就改改原来执行了很久的考试目标，现在的低年级班，就开始降低SAT的入学分数线？\",\"url\":\"https://www.zhihu.com/pins/1935018760890197755\"},{\"slug\":\"2025-08-02-清醒or清黑-一场猎巫行动引发的事故曾经\",\"year\":\"2025\",\"title\":\"清醒or清黑：明一班成猎巫事故，同学摧毁自己的水源\",\"date\":\"2025-08-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"清醒or清黑：一场猎巫行动引发的事故曾经的明一班，一群被仰望的教育班级，一群前途无量的女孩，在欲望的控制下成为了达世---不。雨纯在孤独地捍卫明一班的荣誉。正在试图摧毁明一班的人，正好是她的同学！前段时间要求她不要发文章了，打乱了她们的计划！催毁自己的水源，难道能够让自己喝到更好的，更多的水吗?施某，不是明一班的，是明三班的，掉了好几个级。她们肯定是犯了学堂不能原谅的错误，才会被开除的。\",\"url\":\"https://www.zhihu.com/pins/1935042723892667686\"},{\"slug\":\"2025-08-02-清黑是人生失败者-ZL-你是怎么把自己活\",\"year\":\"2025\",\"title\":\"ZL你怎么活成自己讨厌的人：前公主十年内莫看平台，免心理崩塌\",\"date\":\"2025-08-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"清黑是人生失败者|ZL，你是怎么把自己活成了你曾经讨厌的那种人呢回复该文的评论：【看到今天ZL的讨伐，我才算真正理解为什么山长会告诫离开的前公主们十年们内不要关注平台的发展，强大的心理落差很容易摧毁她们的优雅和自信，还不如让她们在自己的小天地里发展出新的自信心呢。因为失败的人生要找替罪羊，我们就是最容易找的这一只。我让她们10年都不要关注平台，是怕她们毁了自己的人生。\",\"url\":\"https://www.zhihu.com/pins/1934983691295265067\"},{\"slug\":\"2025-08-01-Ella这战书-又没有骂人-有啥好投诉的\",\"year\":\"2025\",\"title\":\"ELLA战书没骂人为何被投诉：清黑不服来战\",\"date\":\"2025-08-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"我是Ella：我向杨ZL，王CY，施C发战书。清黑就是人生失败者，不服来战！有自信，想证明你们优秀，就自己来打！有自知之明，打不过，你就请外援。你们一群黑子，不是瞧不起我们的公主吗？你们不是就崇拜“体制的专业格斗手”吗？让你们自己去请来收拾公主，干吗不敢去？连请人帮忙都不会，只会在网上叫，你们这人生够失败了吧?活成这样子，有啥好意思的？当年的ELLA，是你们的小迷妹。\",\"url\":\"https://www.zhihu.com/pins/1934708270540498439\"},{\"slug\":\"2025-08-01-今天是全国锦标赛的最后一天-都打完了\",\"year\":\"2025\",\"title\":\"全国锦标赛收官：3金6银6铜，10月重庆自由搏击再战\",\"date\":\"2025-08-01\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"10月份我们公主班，冠军班将全员出动，再打一次试试看（自由搏击全国锦标赛，重庆再见）。我是Ella：我向杨ZL，王CY，施C发战书。清黑就是人生失败者，不服来战！另外：冠军班王诗宜，虽然创造了冠军班的历史记录，拿到了一块银牌，但她今天决赛中被TKO了。但作为对比，公主班的女生，无一人被TKO。反而是KO对手的高手，甚至打到对方受伤退赛！练了三年的公主班，不说无敌，起码自保有余！\",\"url\":\"https://www.zhihu.com/pins/1934714673539847587\"},{\"slug\":\"2025-08-01-判决书刚生效-杨景媛聊天记录炸裂-后悔没\",\"year\":\"2025\",\"title\":\"杨景媛案：冤枉男生致其家破人亡，武大认错后她反要告武大\",\"date\":\"2025-08-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"她把别人男生冤枉控告，都弄到退学回家，弄到家庭死人。武大当年相信她的鬼话，帮她判了男生有罪，害死别人一家。武大今天认错说：当年的判决男生没有性骚扰缺乏事实证据。杨某人居然因此，也要起诉武大：认为当年的追责错误，武大也要承担法律责任！当年我被母校冤枉，哲学学院还公开发文，说本院查无此人。很多人开始吵闹---我是学历造假的骗子！只能说明我在武大任教20年，官方有人都没能发现我的学历造假。\",\"url\":\"https://www.zhihu.com/pins/1934619202871890946\"},{\"slug\":\"2025-08-01-清一新教育-清黑-是人生失败者\",\"year\":\"2025\",\"title\":\"清黑是人生失败者：胜利者顺应历史，失败者抱怨火车不等你\",\"date\":\"2025-08-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"1949年毛泽东访问苏联，斯大林说：“胜利者是不受指责的，这是一般公理。”胜利者不受指责，不是因为“运气”好，而是因为胜利者顺应了历史潮流，代表了历史趋势，响应了人民期待。一群被主动或者被动地甩下前进的火车后，抱怨火车没有停下来等你们的人，有啥可以尊重的地方？一群人生的失败者，不是去反思自己失败的原因，重新出发去自我拯救。相反是一群失败者，穷极无聊聚在一起，去攻击去每年都在创造新的辉煌的平台。\",\"url\":\"https://www.zhihu.com/pins/1934589718667982129\"},{\"slug\":\"2025-08-01-现在的主力-似乎都不贪心-拉个30就O\",\"year\":\"2025\",\"title\":\"主力拉30%就收手：我13.08卖出，两天后跌到12.49\",\"date\":\"2025-08-01\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"但快两百万股加在一起，就是市场快送了我一百万了！不对---如果从我9.81元买入的价格算上去的话，我\\\"抢了四百多万\\\"！第二天才是天量天价，主力高开高走，第二天放量。但我不贪心，祝福抢了我筹码的主力。因为我看盘面上，是第二天，派给了跟风的右侧投机客！但我承认9.81等价格买入的时候，是抢了散户的筹码。因为我是一万股，一万股买入的，买得很辛苦。前几天冲高，大家都账户新高的时候，我其实除了几百万股的货。\",\"url\":\"https://www.zhihu.com/pins/1934642805650718755\"},{\"slug\":\"2025-08-01-美国高华二代坦言-看到现在中国发展这么好\",\"year\":\"2025\",\"title\":\"美国高华二代破防：父辈像被塑料果吸引的傻鸟，错过自家甜果\",\"date\":\"2025-08-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"美国高华二代坦言，看到现在中国发展这么好，父辈移民破大防了“父辈们就像一群贪吃的小傻鸟，被美国那看起来诱人，实则是塑料做的‘果子’吸引，扑腾着翅膀飞过去，结果飞走了才发现，自家院子里的果树结满了又大又甜，能砸晕人的果子，现在只能眼巴巴地看着，干着急，连口水都流干了。”我怎么觉得：WC，ZL们，好像这个文章里面的高华。出国去后使劲贬低自己的国家，假装自己活得很好。否定中国的一切发展。\",\"url\":\"https://www.zhihu.com/pins/1934418858556491244\"},{\"slug\":\"2025-07-31-中国正在进入超单身时代-单身人口将突破3\",\"year\":\"2025\",\"title\":\"中国正在进入超单身时代 单身人口将突破3亿，你怎么看？\",\"date\":\"2025-07-31\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这是一个很有意思的问题：现在的孩子，初中就开始谈恋爱。高中阶段，大量的男女，主要是女生，就因为情爱启动而成绩下滑。新教育也一样，15岁开始，大量的青春期问题出现，性萌动。18岁以上，上大学，是开放时代。这时候的男人，已经开始厌倦女人，认为女人就是麻烦之源！女人也开始厌倦男人，认为男人也找不到个靠谱的，想象的白马王子身边就是见不到。30岁之后，女人开始恐慌，身边有价值的男人，都已经名花有主。\",\"url\":\"https://www.zhihu.com/question/11370333631/answer/1934180320854381388\"},{\"slug\":\"2025-07-31-今天清一战队的KO率很高-证明公主们的实\",\"year\":\"2025\",\"title\":\"清一战队KO率飙升：公主们TKO频频，比去年进步巨大\",\"date\":\"2025-07-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"王艺珊公主TKO胜取得决赛权霍昊琪TKO胜取得决赛权刘瑾怡TKO胜取得决赛权。其他周柏清等三人点数胜对手，取得决赛权。钟的体型瘦小，是45公斤级的，但她的对手是50公斤的，比她重很多。场上还一直纠缠双方打内围战，她肯定很费劲。刘瑾怡公主的对手，是广西泰一格斗的专业拳手。目测我们现在，已经锁定了8-9块金银牌，就看明天最后能够到手多少金牌了。小公主们这一次，都17岁了，是最后一次打青少年嗮。\",\"url\":\"https://www.zhihu.com/pins/1934330608970109207\"},{\"slug\":\"2025-07-31-张清一身份识别课-新教育学生本质上是“精\",\"year\":\"2025\",\"title\":\"身份识别课：新教育学生是精英还是废材？别急着给自己贴标签\",\"date\":\"2025-07-31\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"说明：管理班现在刚刚解散不久，很多同学还正在寻找自己的道路，还没有变黑。有些人还在帮助我们，实名出来澄清黑子的谣言！我写的上文，只是提醒他们，不要把自己当成精英，好好去奋斗去。现在的年轻黑子们，主体并不是管理班的学生，更多来源于更早毕业的高中班级。这些人总体来说底子更差，离开学校更久，已经失去了美好的梦想，失去了追求和目标，感受到了人生失败和迷茫的人，是看不到前途的人更喜欢出来黑。\",\"url\":\"https://www.zhihu.com/pins/1934272329715810634\"},{\"slug\":\"2025-07-31-武术就是一横一竖\",\"year\":\"2025\",\"title\":\"武术一横一竖：黑子称泰拳小众，殊不知世锦赛数千人参赛\",\"date\":\"2025-07-31\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天安排了40场比赛，清一武道拳手有12人参赛。黑子们站出来谆谆教导我们说：泰拳是小众运动，没有价值！你们一群黑子，跑出来说这是“小众运动”！你们倒是去拿个【大众运动】的金牌之后，再来给我们推广你们的理念呀？或者你们去拿一个乒乓球的世锦赛金牌，再来教导我们呀？你们自己啥屁本事都没有，就一群躺平族，一群失败者，一群键盘侠。却跳出来对金牌获得者指手画脚的，真以为你是谁呀？\",\"url\":\"https://www.zhihu.com/pins/1934150660527485640\"},{\"slug\":\"2025-07-31-清一新教育｜今日学堂十次搬家历史记录我们\",\"year\":\"2025\",\"title\":\"今日学堂十次搬家史：搬了10次，建了13个家\",\"date\":\"2025-07-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"恒大的清一书院，以及泰国的公主基地，以及梅州基地，每个基地都花了几千万，投资巨大。她是我创业【今日电器公司】时代的员工和助理。还是唯二获得新马泰国外旅游奖励的员工，我留下来守店，她和另外一个销冠去海外旅游，她是我们中第一个来泰国的人。但由于我的本事越学越多，她就一直没走，现在她已经快50了，正在清迈帮我们建设校园。目前的公主基地，就是她在带领泰国建筑工程队再建设的！\",\"url\":\"https://www.zhihu.com/pins/1934191599610476453\"},{\"slug\":\"2025-07-31-近期粉黑大战汇总-对新教育的四大疑问\",\"year\":\"2025\",\"title\":\"粉黑大战四大疑问：清粉澄清如粪坑取样，比清黑胡说难十倍\",\"date\":\"2025-07-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"感谢李海澄清事实的努力：要在清黑的污水中找到证据，也挺不容易的。就像科学家要去粪坑里面拿样本，也够恶心人了！清粉们认真，踏实，细心，负责的工作态度，比清黑们张嘴就来的胡说八道要难多了！被澄清后就装傻，假装什么事情都没发生的鬼样子，要比我们说真话，做真事的投入大得多，十倍，百倍的投入。因此，抹黑的代价很小，收益很大。因此:我建议各位，为了让你的大脑不要被垃圾信息占用第一：不是实名的文章不读。\",\"url\":\"https://www.zhihu.com/pins/1934338407754077582\"},{\"slug\":\"2025-07-31-这个文章写得很好\",\"year\":\"2025\",\"title\":\"这文章写得好：满足欲望易，战胜欲望难，身边「达世」正走向世俗\",\"date\":\"2025-07-31\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"我们身边就有不少“达世”，正在走向自己的世俗之路。将来有一天回头来看的话，会不会像现在的ZL和WC一样失意？昨天小女来我这里跟我玩了一会，提到她身边离开的伙伴离开，她哭了。她不明白，为啥外面的世界这么糟糕，她们还要去拥抱世界？因此她们需要去追求自己的爱，体验自己的人生和世界。但小女知道她们是“达世”，他们也会遇到达世的烦恼。会知道自己失去了“人上人”的机会，难道不会遗憾吗？\",\"url\":\"https://www.zhihu.com/pins/1934162116752962975\"},{\"slug\":\"2025-07-30-可能吗-也许是真的\",\"year\":\"2025\",\"title\":\"有钱人怎么吃才正常：总统套房不住成本也不变\",\"date\":\"2025-07-30\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"张清一：有钱人怎么吃才是正常的？再说一个故事：慧兰酒店的总统套房，我去住，要花多少钱成本？答案是：住不住，成本都不增加，也不减少！平时就是空置的。因为维持形象需要。老挝的主席，总理来磨丁，需要有总统套房配备！我不去住，是省钱吗？当然不是，而是我不需要。我住过毛主席在西湖住过的总统套房，西湖一号。一万多一天的，别人帮我定了一周的套房。真没觉得总统套房有啥好的，睡着了都一样。\",\"url\":\"https://www.zhihu.com/pins/1933816620993746265\"},{\"slug\":\"2025-07-30-如何看待纽约时报质疑给医生宣布死亡的权限\",\"year\":\"2025\",\"title\":\"如何看待纽约时报质疑给医生宣布死亡的权限太大，可能造成有患者没有彻底死亡时候就被移植？\",\"date\":\"2025-07-30\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"只要有需求，就有供应。穷人就是他们盯上的资源！想彻底解决，唯一的办法，就是：切除这种服务，不允许器官移植！这对穷人有利，因为穷人也换不起器官！但：似乎穷人也没有权利去决定取消这种服务。因此是无解的，好办法就是：尽量别去医院，别去自己不熟悉的地方！\",\"url\":\"https://www.zhihu.com/question/1931072762459432159/answer/1933785368735490914\"},{\"slug\":\"2025-07-30-张清一身份识别课-新教育学生本质上是“精\",\"year\":\"2025\",\"title\":\"身份识别课：新教育学生是精英还是废材？别急着给自己贴标签\",\"date\":\"2025-07-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"世界上，1%的顶尖人才，就是这个世界上真正的精英。社会还有一套筛选机制，来鉴别谁才是真正的精英---从一生的生活和事业来考验！我居然发现了教育的奥秘，今日学堂，等于在帮这群本质上根本就不是精英的臭孩子作弊，让她们装成了1%的精英，可以去外面骗人。本质上，新教育的家长们，他们的孩子是什么等级的人呢？很多把孩子送来度新教育的人，本质上是怕孩子受体制的苦，不想去体制死卷，也不想好好努力学习去当工人。\",\"url\":\"http://zhuanlan.zhihu.com/p/1933864350365507820\"},{\"slug\":\"2025-07-30-张清一-有钱人怎么吃才是正常的\",\"year\":\"2025\",\"title\":\"张清一：有钱人怎么吃才是正常的？\",\"date\":\"2025-07-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"如果你很有钱，你还拥有专门的私人大厨，无尽的选择可能。有人感动刘老师在自己酒店里面吃饭很简朴的样子。清一新教育带给我的思考慧兰酒店的大厨师，是刘老师专门请的，原来国内某地很有点名气的湘菜饭店的大厨，给他的工资是很高的。如果我们要吃什么，点餐大厨，做啥都一样，无论是什么标价，对我们来说，就是食材的价格。因为我们家，至少要有一个人，要保持“正常饮食”，我不想别人认为“我有宗教倾向”。\",\"url\":\"http://zhuanlan.zhihu.com/p/1933811144700719707\"},{\"slug\":\"2025-07-29-中国传统武术在现代搏击面前真的不堪一击吗\",\"year\":\"2025\",\"title\":\"中国传统武术在现代搏击面前真的不堪一击吗？\",\"date\":\"2025-07-29\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"这个【秋暮之巨龙】的回答，我认为是很有道理的，的确是练家子，有实证经验的人-知乎中国传统武术在现代搏击面前真的不堪一击吗？但我认为：原来用传武得招式，去尝试打现代格斗的观念错了。原来这批人，是用传武招式动作去“模仿”现代格斗的技能，当然最终不会成功了，就是一个四不像。最终一定全面倒向现代格斗，放弃传武。泰国就是接轨西方格斗思维，特别是拳击思维的，因此，现在的泰拳，与古代的泰拳已经不一样了。\",\"url\":\"https://www.zhihu.com/question/35410205/answer/1933492549525439222\"},{\"slug\":\"2025-07-29-今日2025全国泰拳青少年锦标赛首战收官\",\"year\":\"2025\",\"title\":\"2025全国泰拳青锦赛首战：公主班8人全进半决赛锁定15奖牌\",\"date\":\"2025-07-29\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一战队冠军班有一人遭淘汰，其余晋级半决赛，公主班8名队员全员进入半决赛，今天已经锁定15枚奖牌。我们的优势，应该是成年组，因为发力训练我们比较滞后。公主班比较厉害的几个拳手，都进入成年组了。12月成年组将出战。ELLA要去争取自己的第一块金牌了！明天我们的比赛项目较少，只有几对。半决赛安排在第三天，第四天是总决赛。\",\"url\":\"https://www.zhihu.com/pins/1933622843893081448\"},{\"slug\":\"2025-07-29-从电影到人生-今日学堂无名塾如何塑造孩子\",\"year\":\"2025\",\"title\":\"从电影到人生：发大愿才能超越困境，无名塾塑造灵魂\",\"date\":\"2025-07-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我留在文章后面的评论这电影我没看过，看样子有机会可以去看看。【对我的启示：发大愿，才能超越困境】真的是这样的，我们这个世界，太容易堕落了。只有真正的发大愿，才能让自己从沉沦的苦海中解脱出来！绝大多数人，追求的是“过上好的生活”，这些人，基本上会沦为在生活的苦难中挣扎的普通人。少数人会追求“创造更美好的世界”。这些人会遭遇种种的困难，但最终无论成败，他们多多少少，在改变世界的同时，也改变了自己！\",\"url\":\"https://www.zhihu.com/pins/1933431810970345866\"},{\"slug\":\"2025-07-29-宋文硕的想法-知乎我有证据和证人-论\",\"year\":\"2025\",\"title\":\"宋文硕亮证据证人：王聪颖闹夏令营搞垮今日\",\"date\":\"2025-07-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"王聪颖，果然“聪颖”。她憋了这么久，憋出了这个大招她这招，是不是有效？就不知道了。我们的夏令营，被她这一闹，少了一半学生。更别提外围学堂跑掉的学生了。不知道这些人，是不是都跑去王聪颖的“真学社”了？王聪颖这一闹，天混地暗的。她多了多少学生呢？毕竟：她的目标是搞垮今日，自己吃饱！打倒“假教育”，让她“真学社”真发财！让太乙真女成大名。不知道她实现了这个目的没有……\",\"url\":\"https://www.zhihu.com/pins/1933469034629805525\"},{\"slug\":\"2025-07-29-山长-清一的回答-知乎中国传统武术在\",\"year\":\"2025\",\"title\":\"传统武术不堪一击？公主班未成年拳手出战全国泰拳锦标赛\",\"date\":\"2025-07-29\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"公主班8人未满18岁的拳手，正在贵州参加2025年泰拳全国锦标赛（青少年组），同时也是2025巴林亚青会的预选赛，公主们训练了两年半多一点。其他冠军班的同学，将在11月参加自由搏击的全国锦标赛，届时我们会派出超过40人的拳手队伍。我看名单上，中国第一武术学校，少林塔沟武校，这次派出了大量的拳手参赛。这是中国顶尖的专业武校，现在的武术界，很多人都是塔沟出来的，他们有两万多武术学生！\",\"url\":\"https://www.zhihu.com/pins/1933525315696723719\"},{\"slug\":\"2025-07-29-成都集训日记5-中国代表团成立-虽然\",\"year\":\"2025\",\"title\":\"成都集训日记：国家不抱希望的项目，我们有望两三年改写\",\"date\":\"2025-07-29\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"成都集训日记#5（中国代表团成立）【虽然国家对于泰拳这个项目不抱什么期待，给泰拳队的目标也只是打出顽强拼搏的精神就好了，不像散打、套路队有明确保金或夺金的要求。】我的评论显然中国官方，对泰拳，自由搏击夺金，根本就不抱希望这一块，现代格斗项目，我们与世界的水平差距很大。国家都找不到突破的方向。但我们有希望，在两三年内帮助中国改变这个局面！但明年，我们就会成为有实力夺金的世界级主力格斗战队！\",\"url\":\"https://www.zhihu.com/pins/1933655471832691129\"},{\"slug\":\"2025-07-29-雨纯的文章-知乎我有一些话-不知当讲\",\"year\":\"2025\",\"title\":\"雨纯：9年前的真相，对精心编制的谎言最具杀伤力\",\"date\":\"2025-07-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【昨天在某个黑子的评论区，看到有几个号在讨论，说我的文章每次都能破坏他们的“大业”，打乱了他们的计划，好讨厌。我怎么不知道，一些十几年前的往事，会这么有杀伤力呀！】真相，无论是多久以前的真相，对精心编制的谎言，都具有最大的杀伤力！ZL9年前自己写的文章，9年前在陈家沟全国精英赛标赛后，家长回忆的真相。拿出来看，要比WC们多少篇精心编造的万字长文，都更有杀伤力！真相就像老酒，越老越香，越让人怀念。\",\"url\":\"https://www.zhihu.com/pins/1933473742593438385\"},{\"slug\":\"2025-07-28-9年前的历史记忆-郭晶晶第二的国礼被谁当\",\"year\":\"2025\",\"title\":\"9年前的历史记忆：\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"郭晶晶第二\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"的国礼被谁当垃圾丢弃？\",\"date\":\"2025-07-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"全世界，敢说要培养“太极杨无敌第二”的人，估计只有我一个。因为武无第二：阿里的老师，也培养不出来第二个阿里！工人家庭的郭晶晶“下嫁”香港四大家族我还说：我要培养郭晶晶第二，培养国礼！而且：大多数中国的冠军们，出身都相对贫寒，郭晶晶就是工人家庭。9年之后，回头再看这份历史的记忆，到底是谁丑陋？没想到，当事人就是没事找事，不得不把这些历史的记忆翻出来、对对账，到底是谁对不起谁？\",\"url\":\"http://zhuanlan.zhihu.com/p/1933128756534416073\"},{\"slug\":\"2025-07-28-我看到这里的几个清黑在吵吵\",\"year\":\"2025\",\"title\":\"清黑吵「某人嫁不出去」：1.6亿男人娶不到，女人只愁嫁不了想嫁的\",\"date\":\"2025-07-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"我相信：未来ELLA的身价会越来越高的。这就是我当她的“娘家人”，清一平台给她们的上流“背书”，让她们拥有的“上嫁”的选择权。而不是ELLA天生自带来的优越条件，她当“武汉小家秀女”，她只是在武汉上体制的话，哪有这个资源去接触全国，甚至的世界的男性优质家族的孩子。因此对比下来，我最多只会感叹：当年个人条件甚至比ELLA更优秀的ZL，现在已经得不到跟ELLA一样的上嫁机会，我会替她很遗憾罢了。\",\"url\":\"https://www.zhihu.com/pins/1933127407117772399\"},{\"slug\":\"2025-07-28-泪崩-13岁女孩跳楼身亡-留言字字扎心\",\"year\":\"2025\",\"title\":\"13岁女孩跳楼留遗言：妈妈你赢了，我把命还给你\",\"date\":\"2025-07-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"你们去拯救一下这些少年少女吧？就是不知道你们要去黑体制学校呢？还是要去黑这个狠心的妈妈？还是要去网暴这不懂事的孩子？新教育，真的比他们好很多，很多了。。。。\",\"url\":\"https://www.zhihu.com/pins/1933270591038817181\"},{\"slug\":\"2025-07-28-英子同学的想法-知乎安旭昌的爽快-说\",\"year\":\"2025\",\"title\":\"安旭昌的爽快说到心坎：家长看不起今日明珠班\",\"date\":\"2025-07-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"但不少家长不愿意要今日的明珠班，WC的妹妹给她机会免费入学也不来，他们看不起。他们更喜欢去从小学很多知识的，比较丰富多彩的课程的，比较体制化的外围学堂去上小学。我带明慧的几年，国内的公主班学的知识体系更完善一些，常常有更新的内容发出来，刘老师都着急，说小明慧跟我天天玩。现在回过头来看，明慧和ell跟我一起傻傻的玩了几年，没落下功课！他们都用体制的思维来看今日，模仿今日的外形。\",\"url\":\"https://www.zhihu.com/pins/1933110459264931159\"},{\"slug\":\"2025-07-27-9年前明一班写的未来故事-主角还在继续演-2\",\"year\":\"2025\",\"title\":\"9年前明一班写的未来故事：世界三种人，多数终为奴隶\",\"date\":\"2025-07-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"来到这个世界上，本质上只有三种人：第一种人是消费者，他们追求要过“更好的生活”。本质上终其一生，他们都是利益集团的奴隶，是被物质操纵的仆人！各自用不同的方法，去创造他们认为更美好的世界！比如清一新教育，就是想要创造更好的教育的世界！两种人，都有成功版，都有平庸版，该文章中清姑娘的道路，就是成功者，精英的道路。就算是没有成功，也可以做精英的伙伴和朋友。第三种人的存在，应该是为了给上面的游戏增加难度。\",\"url\":\"https://www.zhihu.com/pins/1932873990780741455\"},{\"slug\":\"2025-07-27-9年前明一班写的未来故事-主角还在继续演\",\"year\":\"2025\",\"title\":\"9年前明一班写的未来故事：世界三种人，多数终为奴隶\",\"date\":\"2025-07-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"也说明这9年来，中式快餐文化的思想哺育，情爱电视剧和吃喝玩乐的环境，可以怎样把一个前途无量的才女，变成平庸无奇的怨妇。当年我带班，辅导明一班的孩子，给她们的课题，让她们去学会：用思维的跨度去规划自己的未来，消费者和经营者，去选择自己认为最有价值的人生道路！果子还没熟，刚冒一点头出来，就想提前吃。云姑娘也在路上（公主班离开的孩子，想走的是云姑娘的道路）但WC和ZL，已经提前交出了她们的人生答案。\",\"url\":\"http://zhuanlan.zhihu.com/p/1932841989478523721\"},{\"slug\":\"2025-07-27-人民日报微信公众号-孩子-我宁愿欠你一个\",\"year\":\"2025\",\"title\":\"人民日报VS中国家长：快乐放纵的少年与卑微的成年\",\"date\":\"2025-07-27\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"人民日报微信公众号《孩子，我宁愿欠你一个快乐的少年，也不愿看到你卑微的成年》VS中国家长：【我尽一切力量给你一个快乐放纵的少年。也接受你拥有一个卑微的成年】我家故事：刘老师看我明慧小时候被我严厉管教，怕长大后会出现心理压力等问题。转念又想：反正我是心理师，等她大了在帮她释放心理问题！真大了一看：好像不需要，她蛮正常的！\",\"url\":\"https://www.zhihu.com/pins/1932690744461750808\"},{\"slug\":\"2025-07-27-清一新教育缘起娜姑8-娜姑保卫战雨纯-每\",\"year\":\"2025\",\"title\":\"缘起娜姑8：十余年投入终见现金流回正，狼群又至\",\"date\":\"2025-07-27\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"眼看着一个个校区被建设完善了，多少人力、物力、财力投进去，可用不了几年，又眼睁睁的看着这一切都白费了。】懂的都懂----10多年来，一直在不断投入。从武汉到云南，再到泰国，大约中国找不到人会这样不断持续投入的，还大量的浪费！在中国做教育，我看就是找抽的：这么多钱投入股市的话，多了几个十大吧？但这么多钱投入教育20多年，多了一堆黑子这个世界真荒诞，如果只是赚钱，就简单多了……\",\"url\":\"https://www.zhihu.com/pins/1932772708837492309\"},{\"slug\":\"2025-07-27-豪门梦断-怪谁-当云姑娘也需要打拼的\",\"year\":\"2025\",\"title\":\"豪门梦断，怪谁？当云姑娘也需要打拼的\",\"date\":\"2025-07-27\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"真的知道我们在走这条路的话，无论是她们想当清姑娘，还是想当云姑娘，她们都会努力去拼出成绩来。想当云姑娘，就要借助平台助力，去拼出耀眼的成绩来，去获取巨大的荣誉，再带着我们赋予你的荣誉去嫁人，去过你选择的“美好生活之路”。高配版的云姑娘，需要勤奋努力之外，还加上一些女性的天赋，不是努力就能做成的！可以让男人来做就好了，男人也需要聪明可爱档次高的女人来支持帮助他们，你们做好云姑娘，大家都好，各安其分！\",\"url\":\"http://zhuanlan.zhihu.com/p/1932897416878752526\"},{\"slug\":\"2025-07-27-转-大女主生存指南-破除婚恋幻想、掌握命-2\",\"year\":\"2025\",\"title\":\"大女主生存指南：先让自己好，无价值者拉黑\",\"date\":\"2025-07-27\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"我们活着，一定是优先让自己好，心有余力之后，再去对他人好。只有这样，你的生活、事业、婚姻才会蒸蒸日上。而不是你什么都没有，还要想着对这个好、对那个好。但凡来占用你时间且不能带来价值的，立马给他拉黑。不要让太多苍蝇围绕在你身边，要把那些会打断你、骚扰你的人和事清除干净。因为我认为他们就是一群苍蝇，他们不能给我带来价值，只会骚扰和打断我做事！我猜：如果清黑认为我们是苍蝇的话，也应该把我们全都拉黑吧？\",\"url\":\"https://www.zhihu.com/pins/1932770372920533964\"},{\"slug\":\"2025-07-27-转-大女主生存指南-破除婚恋幻想、掌握命\",\"year\":\"2025\",\"title\":\"转《大女主生存指南：破除婚恋幻想、掌握命运与杀伐果断》\",\"date\":\"2025-07-27\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"显然，下图意味着，如果你的孩子，是在未来的18年毕业的大学生（差不多现在4岁以上的孩子），你将面对中国原来越卷的高考，以及更加卷死人的就业竞争！因为由于女生的天然局限性，用人企业显然会优先考虑男性。大量的女生，只能被迫依附男人为生，或者被迫边缘化！我依旧善意地提醒，对于婚姻和未来不要抱有玛丽苏般的幻想，因为都无需去看以后，只要看一下双方原生家庭生活的状态，就可以判断你们婚后的生活是否如意了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1932696434441970090\"},{\"slug\":\"2025-07-26-施某-丢尽我们女生的脸施某的攻击点有两个\",\"year\":\"2025\",\"title\":\"施某丢尽女生脸：攻击点实为WC挑拨\",\"date\":\"2025-07-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"第一个，就是静慧对别的女生男生，背后说她的坏话，比如说她是心机婊等等。我相信她是听到了某个“关心她”的人告诉她的内幕秘闻，她完全相信这个人告诉她的是“真话”。她善于去制造伙伴们之间的不和，曾经被我公开严厉批评过的。因此，别的女生，也不至于要来关注她啥的，更别提去贬低她了（也许我不了解情况，你们男生有她的暗恋者可以反驳我）。施小姐的第二个攻击点，就是冠军班考不上常春藤，机会为零！\",\"url\":\"https://www.zhihu.com/pins/1932448574794371352\"},{\"slug\":\"2025-07-26-水就是水-让水回归纯净\",\"year\":\"2025\",\"title\":\"水就是水，让水回归纯净！\",\"date\":\"2025-07-26\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"宗馥莉这广告，做得真好！要吃【娃哈哈】老板的情人瓜你们热心去算算：情人有几个？正室，正宫，私生子的秘闻，还有宫斗大戏的瓜。宗大小姐出来，提醒各位：你们没事干吗？娃哈哈，就是个卖水的，你们喝水就行了。别的牌子多的是，你自由选择！营业额她接手之后，上升了40%，这就是实力！还发广告，让消费者只管喝水。早就说过了----今日的规则，就是家长和学生，不喜欢任何教师，只要提出来就可以换人，罢免！\",\"url\":\"http://zhuanlan.zhihu.com/p/1932462946585404229\"},{\"slug\":\"2025-07-26-清一新教育-我是英子-一个圈外人为何入局\",\"year\":\"2025\",\"title\":\"英子：圈外人为何入局，只因路见不平\",\"date\":\"2025-07-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"善良，也许是天生的，是一种教不出来的秉性！好吧，就让你们都一起，作为清一新教育的反面教材，永远记录进入新教育的历史吧！我党不就是一大开始，一直在不断的清理内部的垃圾，才走到今天的吗？强大的中国，不会因为一路都有黑子的攻击，而停下前进的脚步！而且对方的布局非常的严密，一层一层的攻击波，还早就做好的圈套等人去钻！我还一直为她辩护说，她和WC还是不一样，因为她妈是大学教师，跟出身市井人家的WC不一样。\",\"url\":\"https://www.zhihu.com/pins/1932536711696614827\"},{\"slug\":\"2025-07-25-如何鉴别“真假美猴王”-爱运动VS爱玩乐\",\"year\":\"2025\",\"title\":\"如何鉴别“真假美猴王”？爱运动VS爱玩乐\",\"date\":\"2025-07-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章原文清一山长：如何鉴别谁才是真正的新教育师生？不是顶着党员的名字，就真的是“为人民服务”的共产主义战士！谁是假冒伪劣的人，顶着新教育的名字来骗钱，来玩敲诈，搞破坏的人？也必须鉴别混进来的骗子，败坏新教育名誉的混蛋！因此：是否愿意认真锻炼身体，做好体育运动。同时：凡是不爱运动，不肯每天坚持运动锻炼的新教育教师，也是假货！那么：运动就是检验真假新教育的唯一标准！\",\"url\":\"http://zhuanlan.zhihu.com/p/1932029691985925567\"},{\"slug\":\"2025-07-25-昨天金钼股份涨停\",\"year\":\"2025\",\"title\":\"昨天金钼涨停我全出了：17亿天量，主力控盘散户接盘\",\"date\":\"2025-07-25\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天9个多亿的成交量今天收盘涨了一个多点。加上主力拉升之前，肯定已经买得差不多了，控盘是必然的。我认为：今天，跟进的右侧投资者，抢筹码的进来了，不然不可能有这么大的量。---更重要的是，主力筹码松动了，大量的筹码派出来了，起码主力把昨天买的高价筹码卖掉了，减轻了拉升的负担！因为主力处在非常有利的位置，涨跌控制都很好！似乎外围的金属都在涨，往下砸的话，将来怎么拿筹码回来？\",\"url\":\"https://www.zhihu.com/pins/1932194810325866430\"},{\"slug\":\"2025-07-25-第一-金钼股份今天继续涨-我昨天13.0\",\"year\":\"2025\",\"title\":\"金钼我13.08全卖后继续涨：天量天价，看谁脸疼\",\"date\":\"2025-07-25\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"现在价格13.35元。我为昨天买了我股票的人感到开心！第二：清黑们也小心，你们别兴奋太早了。刚刚我看成交额放大，半小时就已经10个亿了，与昨天的全天成交额差不多了。但涨幅却不大，只有两个点。老股民都知道一句老话：天量天价！我等著，看我的脸疼，还是黑子的脸更疼（笑笑）。其实我不疼，我昨天买入的股，今天也涨了。涨了就卖点股票出去，不然跌了我就没钱买了，所以这是我的惯性！\",\"url\":\"https://www.zhihu.com/pins/1932022869216432536\"},{\"slug\":\"2025-07-25-经济越下行-女生越会被挤出就业市场-是真\",\"year\":\"2025\",\"title\":\"经济下行女生最先被挤出就业：卷时代女性最惨\",\"date\":\"2025-07-25\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"主要原因是哪些？会导致什么后果？期待上大学改变命运的女生，我看以后越来越难了！特别在现在这个卷时代。女性是最惨的一批，最先被职场排斥的一批人。换了我做企业，我也一样！转消息：别的行业不知道，坐标北京某央企，好歹也是世界500强，前两天开会的时候就差明说了“为了节约公司成本，降低运营风险，各部门内推的时候不许推女生”……\",\"url\":\"https://www.zhihu.com/pins/1932227774229250197\"},{\"slug\":\"2025-07-25-给施畅的公开信-求锤吗\",\"year\":\"2025\",\"title\":\"给施畅公开信：国礼计划名利双收，求锤吗\",\"date\":\"2025-07-25\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我还是给你一点良心的建议吧！我最近，一直很纳闷的想：国礼计划正在顺利推进中。我们将成为各国的座上宾，首当其冲的，就是中国的贵宾。因为中国上百年，从来没有在世界格斗赛事上有过信心。而这时候，却有这么多人来黑我们，有些人，是来自于无法想象的地方，一些年轻的学生也加入了！这些人，自己做不成国礼，难道连国礼的朋友也不做吗？去年的19块金牌，不是黑子们看不到，是他们不能接受---国礼计划真的在开展中！\",\"url\":\"https://www.zhihu.com/pins/1932185158389306622\"},{\"slug\":\"2025-07-25-给施畅的公开信-求锤吗-我还是给你一点良\",\"year\":\"2025\",\"title\":\"给施畅公开信：国礼计划名利双收，求锤吗我还是给你一点良心的建议吧！\",\"date\":\"2025-07-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"她不敢正面回应我们的事实和质疑，只是偷偷的去投诉，想要撤掉公开她不良行为的文章。你比她可强多了---至少这个时候，你还站出来实名公开的挺她，你真的敢于“直面惨淡的人生”。我是教师，我更想给你，以及你有一样有求锤想法的前学生们，现任的黑子们，一点对你们人生发展，前途，更有帮助的良心建议。二：我想说，我们一直认为你是很优秀的学生。我想建议你，跟我一样，也只关心你的美好目标好吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/1932065150124423076\"},{\"slug\":\"2025-07-24-刚刚送刘老师去机场\",\"year\":\"2025\",\"title\":\"送刘老师去机场，回来金钼涨停连涨四天全清仓\",\"date\":\"2025-07-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"小女儿中午去食堂打好饭了，我不想吃就放着了，吃了个水果就去休息了！上一轮，我就是13元多卖光了，后来跌到10元多一点，我又捡回来的，心想拿股息也成，今天涨停？算了，你们都想要，我就给你们吧，今天就全清仓了，不过手上持仓也不多，也就一百多万股，我两笔就全卖完了。我看了，两笔下去，对价格一点影响也没有。看样子还会涨，未来的远大钱程，就都送你们了，我不抠门，该大方的就大方。\",\"url\":\"https://www.zhihu.com/pins/1931717575680700541\"},{\"slug\":\"2025-07-23-情人消费-豪车-豪包-豪手机消费本质是啥-2\",\"year\":\"2025\",\"title\":\"一年账户从20万增值到400万：这20倍本事我再没复现\",\"date\":\"2025-07-23\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"网友问：2006年A股市场虽然是大牛市，但一年不到的时间，股票账户从20万增值到400万，涨幅20倍，也是超级股神一样的存在！期待山长能回忆分享一下当年股票账户如何一年增值20倍的鬼谷子金融市场练金术！张清一回复：你没发现，在这之后，连我自己都再也没有实现过这个记录吗？所以你就算去学来这本事，也没有用处了，连我自己都不会用了。现在的我，水平就更差了，越来越没本事了。\",\"url\":\"https://www.zhihu.com/pins/1931408753950951007\"},{\"slug\":\"2025-07-23-情人消费-豪车-豪包-豪手机消费本质是啥\",\"year\":\"2025\",\"title\":\"一年账户从20万增值到400万：这20倍本事我再没复现\",\"date\":\"2025-07-23\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章我昨天换了一台新手机--8年来我的消费“降级”了10倍还是2018年，刘老师买了一个新手机送我。中间好几次，刘老师都说我该换手机了，结果我说还能用，换啥？原来的手机里面，还有银行账户，炒股账户啥的，现在我都不用了。因为我的车，是丰田的汉兰达，我以为很豪华了。还以为啥本田丰田就是豪车了，居然开个30万的车，就敢来同学会显摆，真是欺负天下人都是农民，啥都不懂。\",\"url\":\"http://zhuanlan.zhihu.com/p/1929949210259743433\"},{\"slug\":\"2025-07-22-人在做-天在看\",\"year\":\"2025\",\"title\":\"人在做天在看：办学者功过交给家长评，不学某人自夸\",\"date\":\"2025-07-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"对做教育的人，你们家长就是天！该黑，该粉，你们去评价！我当年，到底对明一班做了什么？静慧对天二班，对无名塾。你们家长去评价，她也不想为自己多辩护！功与过，都交给家长们去议论，她不想多说！静慧的述职报告我们都不是WC，都没她脸皮厚。什么好的，有面子的，都要自己说，生怕别人不知道！坏处还不许别人说，说了一句都是pua。我们过去做的一切，做得好？嘴巴长在你脸上，我们管不着。\",\"url\":\"https://www.zhihu.com/pins/1930953237311254973\"},{\"slug\":\"2025-07-22-今天卖了10万股燕京出去-最后的五万股\",\"year\":\"2025\",\"title\":\"燕京13.20清掉十万：先还融资，便宜股越来越难找\",\"date\":\"2025-07-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"因为今天最高价也才13.21元呢。我的洛阳钼业涨得也很好！就是想找便宜股。越来越难了。先还了融资，再说吧。都是我低价买的股票，现在这个价格，我来用融资持有，就太贪心了。\",\"url\":\"https://www.zhihu.com/pins/1931008477691613912\"},{\"slug\":\"2025-07-22-比亚迪赞助中国足协中国之队5年7500万\",\"year\":\"2025\",\"title\":\"比亚迪赞助中国足协中国之队5年7500万，你怎么看？\",\"date\":\"2025-07-22\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"他们是用了几十年来扶，都一直付不起的阿斗！如果想为国争光，不如用来赞助能让中国武术登顶世界之巅的核心团队！清一战队，是开创“文人格斗”的，全面创新和领先世界武术格斗的中华传武实战格斗队。具体要求是：15岁的学霸，学业成绩达到世界1%顶尖水平的学生，才有资格来清一武道馆练武。我认为：这是中国在体育和文化界，最值得投资的对象！今年11月，清一武道馆将有40多名拳手参加全国锦标赛。\",\"url\":\"https://www.zhihu.com/question/1929855935758726882/answer/1930795204929098390\"},{\"slug\":\"2025-07-22-现在这世界-搞教育的不像搞教育的-像是在\",\"year\":\"2025\",\"title\":\"搞教育像传销、练武像写论文：连和尚都变质了\",\"date\":\"2025-07-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"评价学校也不用成绩成果，而是用“真假教育讨论和初心信仰”。搞武术的，不是去老老实实的练武，教弟子。而是在网上写论文，吹大牛，争地位，争名分！现在，居然连当和尚，都完全的变质了：变成了下面这样？转：我闺蜜说，她这辈子最羡慕的婚姻，就是她的堂妹，嫁了个峨眉山的和尚！房是和尚买的，两套都写堂妹一个人名字，娃生了两个，堂妹带着，还给堂妹开了个服装店，也不图挣钱，就是找个事情做打发时间。\",\"url\":\"https://www.zhihu.com/pins/1930785559338546159\"},{\"slug\":\"2025-07-22-经典电影-闻香识女人-里中校有句话说得极\",\"year\":\"2025\",\"title\":\"闻香识女人：明知正确选择却不选，因为太苦\",\"date\":\"2025-07-22\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"可是我从来不选那条正确的……因为太他妈苦了！我们是傻子。\",\"url\":\"https://www.zhihu.com/pins/1931065441033393492\"},{\"slug\":\"2025-07-22-阿诺德·施瓦辛格最励志的故事-就是怎样从\",\"year\":\"2025\",\"title\":\"施瓦辛格：从州长跌回底层，想当国礼就别放纵\",\"date\":\"2025-07-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"阿诺德·施瓦辛格最励志的故事，就是怎样从一个想当总统的普通平民，经过认真的设计，一步一步的到达了州长的位置，但因为和仆人的一次不良性关心，从顶峰跌落！重新回到底层！阿诺德·施瓦辛格的一时冲动…想当名人，想当国礼，就不要去享受俗人的放纵！一时冲动，带来的是终身的遗憾！\",\"url\":\"https://www.zhihu.com/pins/1931070786006943497\"},{\"slug\":\"2025-07-21-谈武术高低正误-大家去擂台上比就行了\",\"year\":\"2025\",\"title\":\"武术高低擂台见：网上吵正宗不如看办学质量\",\"date\":\"2025-07-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"静慧，用心做教育的老师，说说你眼中的她！你要真的关心教育，你要谈学校行不行，教师好不好？去关注家长的满意度，学生的教学质量，学生的成绩好坏！王聪颖自从宋文硕公布了她学堂的内幕之后，居然一直不出来正面回复她自己学堂的教学品质问题，不公布自己学生和家长的满意度问题。且不说这种玩弄“虚晃一枪，转移视线”的手法有多无耻！我们只要去想一想正常人的思维：你真的关心教学，你就去看看家长和学生的教学评价就行了！\",\"url\":\"https://www.zhihu.com/pins/1930435020172031947\"},{\"slug\":\"2025-07-20-蔡凯琪说说-你在清一新教育或者是今日学堂\",\"year\":\"2025\",\"title\":\"蔡凯琪：无科班背景靠爱心带班，武道馆像她的家\",\"date\":\"2025-07-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这才是真正的陪伴教育。没有上过今日，没有去过明一班，清一武道馆背景出来的凯琪，去今日带班，靠的是对孩子的关心和爱心来带班。今年秋天，她也获得了家长和学生以及教师团队一直认同的结果，继续带新班。她每年放假，最喜欢就是回到清迈的武道馆跟老朋友们一起度过假期。这里就像是她的家一样！\",\"url\":\"https://www.zhihu.com/pins/1930404443150587689\"},{\"slug\":\"2025-07-20-转ELLA给孙掌门的战书——别只打嘴炮了\",\"year\":\"2025\",\"title\":\"转ELLA战书：别打嘴炮用结果说话，16年轻人擂台见\",\"date\":\"2025-07-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"一群练武的武人，不言武，不练武，来网上玩文吵架。我这学文的文人，不去谈文，居然来玩武，这也是中国的大笑话。这肯定不是我个人的笑话！这是今年的第一次全国格斗锦标赛，看她们今年取得的成绩，能否超过去年了（去年我们一共拿到16块全国锦标赛金牌）。在中国，清一战队已经是“第一强队”了，也注定是今年中国夺取最多奖牌的冠军格斗队。说起来真惭愧，我都奇怪---中国的武术界，培养的格斗拳手到哪里去了？\",\"url\":\"https://www.zhihu.com/pins/1930410783558308575\"},{\"slug\":\"2025-07-19-ELLA的战书\",\"year\":\"2025\",\"title\":\"ELLA给孙掌门的战书：下架两次重发，问他敢接否\",\"date\":\"2025-07-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"给五华山LS派孙掌门的战书：ELLA现在重新发上来。开放了自由转载，你们都去看看热闹吧，能转的就转一下！大家看了ELLA的战书，如果想看这场男女大战的话，你们也可以去轮流问候一下孙掌门，问他敢不敢接这个战书？他要不敢接ELLA战书，就问他还是不是男人？如果孙掌门还是个男人，真的敢接战书，就问他：什么时候安排赛事：一年，两年，三年？这可是一个曲线加入新教育核心圈的好机会喔？\",\"url\":\"https://www.zhihu.com/pins/1929997359569437949\"},{\"slug\":\"2025-07-18-一群黑子-拿吃饭来攻击人\",\"year\":\"2025\",\"title\":\"黑子拿吃饭攻击人：食堂按国际标准做、不包餐\",\"date\":\"2025-07-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"这种很清晰的，很容易查实的故事，都内幕人物，出来实名编，还有啥不能编的？山长清一的回答-知乎如何看待「放下个人素质，享受缺德人生」这句话？这是一种人间清醒，还是自我麻痹的伪命题？其他的菜饭等等，自己想怎么吃就怎么吃，吃多少都自己定。唯一按照我们的养生健康标准来做饭的，就是清迈冠军家园了。没办法，拿“吃”来攻击人，最能赢得家长的共振了！一：清黑说清一山长啃猪蹄，满柜子都是各种酒！\",\"url\":\"https://www.zhihu.com/pins/1929475146718114086\"},{\"slug\":\"2025-07-18-今天一天没看股票-刚刚看了一下-气死我了\",\"year\":\"2025\",\"title\":\"没看股票一天，回来气死：偷偷买的股快涨停才买几十万\",\"date\":\"2025-07-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我正在偷偷买入的一个股票，居然马上就要涨停了！我才买到几十万股呢？原想买入后，就躺平不玩了，十年都不动。现在这么快就涨了！我该怎么办？我还要很多资金躺着账上备战，等待派遣出发呢！让我再找一个地板上躺着的，好难喔。（别问我名字了，清黑都说，要去证监会告我操纵股票，我哪敢说名字？\",\"url\":\"https://www.zhihu.com/pins/1929548570182293384\"},{\"slug\":\"2025-07-18-今日学堂是什么水平-AI-相当于​​伊\",\"year\":\"2025\",\"title\":\"今日学堂是什么水平？AI--相当于​​伊顿公学​​、​​威斯敏斯特公学​​的学术水平\",\"date\":\"2025-07-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章小蔡同学的尝试：今天我把我们今日老师之前好玩问deepseek的问题又问了一遍：第一问，这个学校的教学属于什么水平？第二问，放眼全球，这个数据是什么水平呢？已深度思考(用时15秒)嗯，用户让我分析这个“战狼今日塾”的教学水平，基于他们上传的SAT成绩单图片。1500分在SAT考试里是什么概念呢？最核心的是缺少对比数据——比如生源入口水平，其他学校成绩等。\",\"url\":\"http://zhuanlan.zhihu.com/p/1929663427623760847\"},{\"slug\":\"2025-07-18-如何看待「放下个人素质-享受缺德人生」这\",\"year\":\"2025\",\"title\":\"如何看待「放下个人素质，享受缺德人生」这句话？这是一种人间清醒，还是自我麻痹的伪命题？\",\"date\":\"2025-07-18\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"「放下个人素质，享受缺德人生」这句话，有意思！可是，这些更需要拯救的人，他们看不见：下面的体制学校的学生，更可怜，更值得去挽救。清黑们如果真的是好人，她们干嘛不去拯救这些可怜人?这群黑子们，为何要在这里天天浪费自己的时间和精力，去“拯救”这些正在高高兴兴的考常春藤？一：清黑说清一山长啃猪蹄，满柜子都是各种酒！1：你如果也想让你孩子啃猪蹄的话，你自己买猪蹄给你孩子去啃，你看会被清一抢走吗？\",\"url\":\"https://www.zhihu.com/question/1927692253587019206/answer/1929469339309946859\"},{\"slug\":\"2025-07-18-就算清黑爆料是真的-你怎样做才是正常人\",\"year\":\"2025\",\"title\":\"就算清黑爆料是真的，你怎样做才是正常人?\",\"date\":\"2025-07-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"你要关心的话，正常人就应该这样想：1：你如果也想让你孩子啃猪蹄的话，你自己买猪蹄给你孩子去啃，你看会被清一抢走吗？清黑说的这种情况，如果是真的，说明清一的20元比你的更值钱，可能是金元。二：清黑说，清一教育不是真教育，她才是！1：就算清黑说的真的，你真的想让你孩子15岁之前学理工科吗？七：熊黄清黑们举报我们的学校是【有境外宗教人员出资和操纵控制的道学性质的宗教学校】就算是真的。\",\"url\":\"http://zhuanlan.zhihu.com/p/1929218441648256457\"},{\"slug\":\"2025-07-18-网友-今天这么大的成交额-希望下一个交易\",\"year\":\"2025\",\"title\":\"盼跌的股民会赔钱：匮乏之心发的订单总是亏损\",\"date\":\"2025-07-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"3小时前·湖北​我的回复惨了——秘密法则判断---你炒股会赔钱!因为你给宇宙发的订单，是你---喜欢下跌，期待下跌！所以老天总给我低位买股的机会，买了之后还下跌，所以我常常被“套牢”。最近买的冠农和中粮，上周我的账户全是绿的。两个股票，上周突然上涨了，账户红了，我赚钱了，我就不开心，我停手不买了，再去找别的低位股去！最终赚钱了，大涨了，红的太多了，我就更不开心了，我就“恐慌”了，要走掉。\",\"url\":\"https://www.zhihu.com/pins/1929616074808226848\"},{\"slug\":\"2025-07-18-请问现在的男性不结婚真的是因为穷-结不起\",\"year\":\"2025\",\"title\":\"男性不结婚只因穷？女人控制欲强、贪官找情人才更可怕\",\"date\":\"2025-07-18\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"女人疯起来，是男人完全无法理解的！这种对儿子造成巨大伤害的事情也敢做。控制欲强烈的女性，真是祸害家庭，祸害人间。男人，怎么能不怕女人呢？贪官们居然到处找情人。胆子真大！\",\"url\":\"https://www.zhihu.com/pins/1929333776380597663\"},{\"slug\":\"2025-07-17-如何向宇宙发订单\",\"year\":\"2025\",\"title\":\"如何向宇宙发订单：ELLA瞄准2029击败那须川天心\",\"date\":\"2025-07-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"走向卓越之路ELLA要公示她的目标：2029年击败世界最强格斗手：那须川天心！我也继续吹个大牛：2027年，冠军班的正式生（1500分以上者），将全部考上常春藤名校。甚至旁听生，都有人能拿到常春藤大学的入学通知！哈佛和耶鲁--这个就不敢吹了，争取有一两个学生，能实现这个目标吧！让你们现在可以嘲笑我了。你可以先骂我两年，然后再跪我（大笑）真的？不用急，等两年就行了！\",\"url\":\"https://www.zhihu.com/pins/1929147085946609684\"},{\"slug\":\"2025-07-17-如何向宇宙发订单-走向卓越之路\",\"year\":\"2025\",\"title\":\"如何向宇宙发订单：ELLA瞄准2029击败那须川天心走向卓越之路\",\"date\":\"2025-07-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章刚才去指点公主们练武，见到ELLA，就教她把自己知乎账号和名字。下面的自我介绍，改成【2028拿下世界冠军，2029拿下那须川天心】。一贯谦虚低调的ELLA说：这样会不会有点狂妄？向公众展示自己的未来目标，能够帮助自己更快地实现目标。不是拍拍脑袋，乱说一个目标，公布出来，宇宙就能帮助我实现的！找到了路径，走上来了道路，才敢公开说出来这种目标！\",\"url\":\"http://zhuanlan.zhihu.com/p/1929118182225981722\"},{\"slug\":\"2025-07-17-钟熙媛Althia的回答-知乎说说\",\"year\":\"2025\",\"title\":\"钟熙媛：在今日看到「想学啥都能轻松学会」的精神\",\"date\":\"2025-07-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"今日现在对外只招11岁以上的学生，钟同学的8岁今日就“绝版”了。是小钟同学在2018年，和明慧，ELLA一起参加厦门国际武术比赛的照片。在小钟同学身上，我们看到了“我想学啥，都能轻松学会”的今日新教育精神。只要拥有这个学习的态度，真的一生无忧！小钟的优点，就是“专注”认真，与明慧和ELLA这一点都相似。小钟同学马上要去参加贵阳的亚青会选拔赛了，希望学霸再来创造武霸的成绩！\",\"url\":\"https://www.zhihu.com/pins/1929243003169514171\"},{\"slug\":\"2025-07-16-黄小燕-这是你的1.5亿你不是就想要钱吗\",\"year\":\"2025\",\"title\":\"黄小燕，这是你的1.5亿：想要钱就来拿，律师帮你维权\",\"date\":\"2025-07-16\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"这里就有，你来拿吧。律师团队会帮你的。你不去，我外包给他们去为你维权。你来我就等你！\",\"url\":\"https://www.zhihu.com/pins/1928802714839651961\"},{\"slug\":\"2025-07-15-你们要明白-全世界-不把女人当玩物-当男\",\"year\":\"2025\",\"title\":\"不把女人当玩物的男人极少：更鲜少把女孩培养成自尊自立\",\"date\":\"2025-07-15\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"有修养的男人，会给女性一点面子，这也是表面的，骨子里面是不尊重女性的！全世界凡是拥有权利，拥有地位的男人，身边有大把的女性资源，却不去潜规则女孩子的男人，也极其的稀有。特别在中国，这是一个有权威的男人，把拥有的女性多少，当成自己荣耀的地方和时代。全世界看过去，更没有把女孩子，好好培养成自尊自强的独立女人的学校。我想说：清一愿意不收钱，送你们的女儿去当国礼，这是全世界女性能够到的，唯一的便宜事！\",\"url\":\"https://www.zhihu.com/pins/1928400570999370400\"},{\"slug\":\"2025-07-15-如何理解「女性困境」\",\"year\":\"2025\",\"title\":\"如何理解「女性困境」？\",\"date\":\"2025-07-15\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"女性的困境就是：男性基本上不把女性当人看，只把女性当成男人的附庸，是男人的工具---生活工具，娱乐工具，繁殖的工具！女性的困境还是：女性自己，也不把自己当人看，只把自己当做男人的生活的工具，娱乐的工具，繁殖的工具！同时，男人也把女人当人看，支持和鼓励女人自尊自信自强的生活在这个世界上！很难找到独立自强，不依附男人，只关注自己成长和成功的女性！只看到不断在男人的各种关系中，不断沉浮的女性！\",\"url\":\"https://www.zhihu.com/question/657682232/answer/1928444818025054997\"},{\"slug\":\"2025-07-14-想做心机婊\",\"year\":\"2025\",\"title\":\"想做心机婊绿茶？97%女人做不到：公主该选何种身份\",\"date\":\"2025-07-14\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"是让她们去看ELLA昨天新发的文章，去学会如何选择自己的人生道路和身份：如何在自己的未来人生中，去选择自己想要的一个身份，并坚持去呈现这种身份，直到实现为止！女人一生的失败和平庸，核心原因，就是没有从小学会去选择身份，而是随波逐流，身份混乱。她们也不需要费心费力，只要本色出演自己就好！我笑死了：告诉她们，如果你们做不了第三种女人，她们就只能做第一种女人，真做不了第二种的。\",\"url\":\"https://www.zhihu.com/pins/1928031538534126465\"},{\"slug\":\"2025-07-14-物质富足的时代-为什么要教孩子吃苦耐劳\",\"year\":\"2025\",\"title\":\"物质富足时代为何要教孩子吃苦：徒步爬山，练轻功八步赶蝉\",\"date\":\"2025-07-14\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"钱校长的孩子也在徒步，很好的方式！读太多书，读成书呆子了！这样的假期很有意义，原来我带明一班，钟瑞静慧，常常带她们去爬山。一爬一天，效果也很好。给你们一点建议---可以教孩子们轻功---练习“八步赶蝉”的走路方式，会更有趣。而且对将来练武的帮助很大。你们可以网上搜一下。就是蹦蹦跳跳的走，非常快速，而且训练效果很好！\",\"url\":\"https://www.zhihu.com/pins/1928241982519616773\"},{\"slug\":\"2025-07-13-李静盈我为什么放弃澳洲优质的教育-把两个\",\"year\":\"2025\",\"title\":\"李静盈放弃澳洲教育送娃来今日：望女儿成澳洲「国礼」\",\"date\":\"2025-07-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"第一次知道你女儿的排名这么高，我真不了解你们家的当地上层社会的资源这么好，你的孩子也是澳籍华人！所以，让女儿好好上冠军班。将来，就成为澳洲的“国礼”吧。代表澳洲去打败全世界冠军，击败外家拳高手。不过，我想提个要求：如果世界锦标赛上，遇到了我们中国的“国礼姐妹\\\"同台竞争的话，就委屈你女儿让一让赛，好吧？因为我们的第一身份，是中华民族的后人，所以【中国第一】，好不好？\",\"url\":\"https://www.zhihu.com/pins/1927768232913265641\"},{\"slug\":\"2025-07-13-缘起娜姑6-我们的节日\",\"year\":\"2025\",\"title\":\"缘起娜姑6：黄小燕拿一顿过桥米线说成一周伙食\",\"date\":\"2025-07-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"回复雨纯：我当年还请你们去会泽吃过桥米线。[感谢]，我记得是会泽唯一的一家过桥米线店。老板的质量很好，好像还有砂锅饭（隔壁），是我和刘老师会去吃中餐的地点！黄小燕居然实名跑出来说：我给现在的学堂的学生，规定的伙食标准，是一个星期20元人民币。（我记得是当时会泽的过桥米线，是13元一份吧？所以，按照黄小燕的算法：当年我为你们规定的伙食标准，根据我当年的贫穷程度，肯定不是20元，可能是2元一个星期！\",\"url\":\"https://www.zhihu.com/pins/1927657436539512731\"},{\"slug\":\"2025-07-12-我和今日作为新教育的领头羊-被黑是完全可\",\"year\":\"2025\",\"title\":\"新教育被黑因世人爱挑战强者：弱小比亚迪也曾想干掉丰田\",\"date\":\"2025-07-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"但走到这一天，比亚迪付出了30年的不懈努力。而有些人，WC，黄小鸟等人，她们干掉强者的方式，就是去泼污水！比亚迪如果去泼污水给丰田，只会迎来法庭的痛击。而比亚迪强大自己，目前在泰国已经订货量已经超过丰田。现在的比亚迪，也成为了污名化的对象。有大厂的人，出来攻击比亚迪是第二个恒大。他们打不赢比亚迪，就希望比亚迪自动垮掉。但：这种人，不把时间功夫，用在自己提升产品竞争力上，只是去打口水战。\",\"url\":\"https://www.zhihu.com/pins/1927305998261032646\"},{\"slug\":\"2025-07-12-最近认识到了-世界上有的人说谎可以说得义\",\"year\":\"2025\",\"title\":\"有人说谎义正词严、恶人拿法律吓人却不敢法庭对峙\",\"date\":\"2025-07-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"信口开河胡编乱造的故事竟然可以娓娓道来。真违法的一方竟然能拿着法律的令箭来大张旗鼓的吓唬别人，关键时刻在法庭外却不敢面对法律的对峙。不过似乎这种风气已基本成了现在所有攻击新教育的人的共同特点。山长教过，不要听一个人说了什么，而要看一个人做了什么！为何某些说自己“为了学生，为了家长”“声张正义”的人却在忙着散播负面情绪，制造恐慌？这些人又为哪些学生，提供了什么样的教学服务呢？\",\"url\":\"https://www.zhihu.com/pins/1927449901048009779\"},{\"slug\":\"2025-07-12-英子-黄小鸟-属于你的灵魂8问\",\"year\":\"2025\",\"title\":\"黄小鸟的灵魂8问：13年「铁粉」只学了个表面\",\"date\":\"2025-07-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"当时，她一脸的崇拜，告诉我，她是如何如饥似渴地学习我博文的（新浪时代）。她读这个多年的博文的“铁粉”，谈到教育问题，就完全的白痴！我真的很想问HXY：你在今日7年，认识我之后的13年，为啥现在，都不懂教育？你何必要去敲诈他人上亿，然后躲起来享受，一辈子见不得人呢（请参看英子提供的，黄与我进行敲诈对话的截图---拿了钱就要消失）。难道，你真的像是英子的8问一样：你的心思根本就不是新教育。\",\"url\":\"https://www.zhihu.com/pins/1927471057180276354\"},{\"slug\":\"2025-07-12-链接我帮熊某人-黄小鸟们宣传一下他们的理\",\"year\":\"2025\",\"title\":\"帮熊黄宣传「理想学校」合明：他们认为清一该毁掉\",\"date\":\"2025-07-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"这个【合明国际学校】的宣传广告，我转给大家看看！这是年赚千万的合一学堂的伟大堂主熊某，还有原明一学堂的堂主L，再加上“把今日学堂从几十人扩展到几百人”的伟大校长黄某人，一起联合创办的“强强联合”学校。黄某人，去年一直在用电话，等，耐心地给清粉们，我们学校的家长们，一对一沟通，介绍，推荐他们的伟大学校。我建议：一：各位清粉们，为了照顾熊黄的教育理想，你们是不是也送自己的孩子去上学？\",\"url\":\"https://www.zhihu.com/pins/1927320781781734983\"},{\"slug\":\"2025-07-11-一份吓得熊杰不敢露面的法律文件\",\"year\":\"2025\",\"title\":\"一份吓得熊杰不敢露面的法律文件！\",\"date\":\"2025-07-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章5月份，熊黄二人，得意洋洋的。熊杰一直在找老挝的下级官员们，布局法律战，关系战。同时，熊杰把网上的黑文，一篇一篇的发给老挝和海城的“关系”，造成网上我们被家长广泛攻击质疑的假象，影响老挝和磨丁官方的判决。6月7日，磨丁西彭主席找我们，说熊杰已经到了磨丁，让我们的人，一起去管委会处理争议的问题。这份吓得熊杰连夜逃走的文件，这就是下面这个，大家长长见识吧！\",\"url\":\"http://zhuanlan.zhihu.com/p/1926941287925407988\"},{\"slug\":\"2025-07-11-安旭昌-安自在的想法-知乎黄-最毒负\",\"year\":\"2025\",\"title\":\"黄氏最毒负人心：2.2亿流水虚做成利润、税率蹊跷\",\"date\":\"2025-07-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"你我都会上当，现在外面一堆的家长。被她骗，也不奇怪吧？WC跟她比？完全不是一个档次的。你奇怪，她35%的税率怎么来的？不知道？黄氏家法？2.2亿的流动，进出一次就算成资产总额（钱这么容易赚的？一进一出就翻一倍利润，纯赚了？）再把这个呓想的总额，算成企业的纯利润！再把利润算成最高的税率然后她代表国家收税收到她的个人账户上然后等改朝换代！等我死。这啥玩意？是蠢，真不懂算账？\",\"url\":\"https://www.zhihu.com/pins/1926995019937584610\"},{\"slug\":\"2025-07-11-我怎样才能成为第二个黄小鸟\",\"year\":\"2025\",\"title\":\"怎样成为第二个黄小鸟：把谎言说得如同天使正义\",\"date\":\"2025-07-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"有人评论说【我无法想象黄小鸟做坏事都能这么理直气壮】我也无法想象，一个人可以把谎言可以说的如此真情。[捂脸][捂脸][捂脸]我就是被她骗得最惨的一个：我居然相信她会说真话，居然相信她会有正常人的真情和实意！她从来不关心\\\"真相\\\"是什么，她只关心--怎样用谎言毁掉别人，然后让她站起来！[捂脸][捂脸]她甚至不关心---毁掉别人，会不会毁掉自己（我很意外）所以，我说她是一个炸弹。\",\"url\":\"https://www.zhihu.com/pins/1926923350929813761\"},{\"slug\":\"2025-07-10-冠农其实我不太懂\",\"year\":\"2025\",\"title\":\"冠农我不太懂：股息骤降、库存跌价，只敢小买\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"冠农的股息去年挺高的，是4.6元（10股），今年就突然崩溃大跌，只有0.8元了。年初有消息出来：冠农业绩大降，惨淡至极。俗称\\\"我的存货肯定赔钱，提前算赔钱的账\\\"这个坏消息出来，自然股价就跌了。我看到坏消息出来，没发现本质上公司有啥变化。我认为：光靠罗钾的分红收入，冠农就值现在的市值。万一她别的有好消息，水电，以及糖，棉花，番茄等有业绩，我不就白赚了吗？但我不拉，吃完就不动了，不能影响主力的计划！\",\"url\":\"https://www.zhihu.com/pins/1926689326672123663\"},{\"slug\":\"2025-07-10-德隆系-是20多年前的大庄家-风云人物\",\"year\":\"2025\",\"title\":\"德隆系：当年低价卖出的钾盐公司，如今年分红数亿\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"最终德隆崩盘了，手上的优质资产，只能骨折价卖出来，抵债。20年前，德隆以几千万低价卖掉的一家公司，中国唯一（唯二）的钾盐公司。现在这家公司的估值，应该涨了几百倍，甚至一千倍？如果德隆不去操纵股票，只是稳稳的持有资产。现在的资产增值是几百倍，一千倍，比他操纵股票强多了！2002年，德隆系成立罗布泊钾盐公司，但因资金链断裂，2004年以8700万元将资产割让给冠农股份。\",\"url\":\"https://www.zhihu.com/pins/1926653270895597490\"},{\"slug\":\"2025-07-10-泰国拜县拳赛实录——木兰初出茅庐竟遇上抖\",\"year\":\"2025\",\"title\":\"拜县拳赛：练了一年多的公主击败泰国百战老拳手\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"公主们的技术，要比木兰们更纯一些。因为是在木兰们的基础上改进的结果！她们练习更多，实战更少。但只练了一年多的两战公主，居然能够面对泰国从小打比赛的百战老拳手，而且还赢了比赛！两个公主的后腿攻击技术，已经超过木兰了！都在对手刚刚出扫腿的一刻出腿，正好击倒了对手！木兰们的后腿攻击技术一直是弱项，需要补上！旋转身法的拳腿技术，需要更加的强化！一旦旋身拳腿练出来了，这外家拳手，就更不是对手了！\",\"url\":\"https://www.zhihu.com/pins/1926765185852506408\"},{\"slug\":\"2025-07-10-消息-日本-一个普通大学的毕业生-面试\",\"year\":\"2025\",\"title\":\"日本企业跪求毕业生：不加班还送百万，但我孩子不去打工\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"消息：日本，一个普通大学的毕业生，面试的时候，企业直接承诺绝不加班，一年假期不低于129天，而且只要入职立马就赠送100万日元的现金奖励，更夸张的是，为了增强自己的竞争力，有的企业HR跪着宣读自己的企业福利，什么住房补贴、交通补贴、企业年金、全球旅行这些东西，只要大学生愿意，他们全都会一一兑现。我的判断，是大约20年后，中国就是日本现在这个样子了，企业会求着你去上班的！\",\"url\":\"https://www.zhihu.com/pins/1926633110776296863\"},{\"slug\":\"2025-07-10-网友-山长-您推荐的冠农今天涨了7了我\",\"year\":\"2025\",\"title\":\"别瞎说我没推荐股票：今天我自购20万股冠农\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我买了冠农，是真的。但我从来不推荐别人跟我买。你们买了，是你们的福气。我买了是我的运气，我只想拿股息，没想快速赚钱。今天上午我还下了单，买入20万股冠农，价格是7.65元。因为账上有些闲钱不想空置。我不知道涨了，刚去看，成交了188900股。算是老天送的吧，谢谢老天的奖励。估计是看我总受气，老天给我一点红包安慰一下！\",\"url\":\"https://www.zhihu.com/pins/1926645339865187796\"},{\"slug\":\"2025-07-10-链接7月4日下午-“文上藤校-武夺冠军”\",\"year\":\"2025\",\"title\":\"浙江永康教育交流会：文上藤校武夺冠军，山长连线答疑\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这次的分享嘉宾阵容空前，不仅有共8个公主班和冠军班的同学们出席分享，与大家深入交流，还有三校总督学钱莉校长以江浙地区的企业家精神为基，对家族传承企二代计划进行深度解析，更有重磅的山长现场连线答疑！此次会议，内容品质之高，在永康是前所未有的，参会超过半数的家长刚接触新教育，也是前所未有，对推动江浙地区新教育的传播发展意义很大。以下是本次盛会的精彩记录。\",\"url\":\"https://www.zhihu.com/pins/1926597387390018131\"},{\"slug\":\"2025-07-10-黄红珍事实是这样的\",\"year\":\"2025\",\"title\":\"三语弟弟工资翻十倍，斯坦福表弟只英语十年不涨\",\"date\":\"2025-07-10\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我亲弟弟本科学历进入社会工作后，自学了3门小语种后，几个小语种国家工作，十年工资翻了10倍。亲表弟斯坦福大学毕业回国工作，只会英语，工资10年没有涨过，工资只有会三语亲弟弟的十分之一的工资收入。我一直就是这样认为的，英语优势不是就业的优势，小语种才是，去美国，五眼国家留学，都是交智商税。现在我想开了，想交智商税，自己交去，我不管了！最变态的，就是还有学成三语后，要回去考体制大学的，在国内就业！\",\"url\":\"https://www.zhihu.com/pins/1926568553223546574\"},{\"slug\":\"2025-07-09-2025.7.9-浙江分享会结记印象很深\",\"year\":\"2025\",\"title\":\"浙江分享会：三语过关被企业全收，何必还去考大学\",\"date\":\"2025-07-09\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"和我们交流的时候叔叔说，在我们学校中只要是三语过关，只要不是躺平摆烂的，就算是最后10%的学生他们公司都可以全收了，不管有没有文凭都没关系。因为现在很需要这种三种语言都可以熟练运用的人，对于在小语种国家发展的中国企业很有帮助。令人叹息的是：三语高中的学生，居然有人还要去考大学，读大学！如果考大学，是为了去找工作。干嘛不直接去工作呢？工资比国内翻倍，还有啥不满意的？管理阶层很快就上去了？\",\"url\":\"https://www.zhihu.com/pins/1926386114341634933\"},{\"slug\":\"2025-07-09-Ella的想法-知乎您的子弹-是专门\",\"year\":\"2025\",\"title\":\"ELLA遭清黑造黄谣，马大雁事件后他们还问她是否争当第二\",\"date\":\"2025-07-09\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"捍卫“正义和理想”的清黑们，居然去网上对一个极为年轻的小女孩造黄谣，说她要当小三，要谋取正室（她有截图）现在马大雁的事情出来之后，惊掉了所有人下巴。可是，这些无耻的黑们，又在@ELLA和明仪两人，问她们两，是不是要【争当马大雁第二】？我让她必须学会“直面惨淡的人生”！要当国礼，要当名人，就要承担强大的社会压力！因此，她正在梳理自己的思路，她必须与清黑们一战！我很抱歉，我无法给她们一个温室保护起来。\",\"url\":\"https://www.zhihu.com/pins/1926407043645936413\"},{\"slug\":\"2025-07-09-当金庸武侠体遇到教父2-用金庸体改写-西\",\"year\":\"2025\",\"title\":\"金庸体改写《西西里人》：这样的文学课谁不爱\",\"date\":\"2025-07-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这种上课的方式，当然让你们人人都能写出万字长文了。甚至有人现在，都可以我教出来的本事，写文字长文专门黑我了（哭笑）。我亲自从小带过的班，就是你们明一班，还有现在的公主班！现在公主班如果看到当年你们是这样上文学课的？我说：等以后，我带【清一大学文学专业】的学生的时候，再用这种方式，来带你们上文学课。对15岁的小女孩上文学课，也许你们就是绝版了！上过这种文学课的你们，哪里还愿意去中国的大学。\",\"url\":\"https://www.zhihu.com/pins/1926307613081051508\"},{\"slug\":\"2025-07-09-网友问-一个乐水的账户-玩奇门八卦-玩命\",\"year\":\"2025\",\"title\":\"玩命理的人不敢诅咒他人：马大雁却诅咒别人进监狱、自己进地狱\",\"date\":\"2025-07-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"我回答:如果是真的玩命理的人，都知道一点宇宙法则。当然，有人装神弄鬼，用这些东西来吓人，倒是可以理解，其实她们自己也不信的这个马大雁，一直在诅咒别人进监狱。倒像是一个反目成仇的恶妇人，满身的怨恨和仇恨。两般皆是可，最毒妇人心”这个马大雁，真的可怕，惊着了我！马大雁依仗这个政法情人的背景，就肆无忌惮的，见到任何人都威胁，动不动就说要抓人去进监狱，好像公安局就是她家开的一样。\",\"url\":\"https://www.zhihu.com/pins/1926241822730098667\"},{\"slug\":\"2025-07-09-致敬马大雁玉溪政法系小情人-你不是大雁第\",\"year\":\"2025\",\"title\":\"马大雁的情人不止一个：熊老板拉她站台另有图谋\",\"date\":\"2025-07-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"知道熊jie为什么聪明的不上法庭，要拉上马大雁一起吗？原来，我一直以为熊才是主谋，他老谋深算的，我都斗不过。以为这个大雁年纪轻轻，她太傻，被老江湖的巧言如簧，骗得为熊出来站台的。马夫人，想让熊老板出头露面，帮她去拿到她自己没有出一分钱，只是名义上占有的股份。但，熊这么多年创江湖了，肯定是不是傻瓜。熊只是想借用马大雁的野心，来为自己捞取更多的利益。所以：熊一直躲在后面，马夫人不上，他也不上！\",\"url\":\"https://www.zhihu.com/pins/1926270650550587670\"},{\"slug\":\"2025-07-08-7月7日-燕京啤酒发布-2025年半年度\",\"year\":\"2025\",\"title\":\"燕京半年净利预增40%-50%：7年10倍，我赌中困境反转\",\"date\":\"2025-07-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"7月7日，燕京啤酒发布《2025年半年度业绩预告》，显示：2025年上半年，燕京啤酒在首季“开门红”的基础上，继续保持高效能、高质量发展态势，预计实现归属于上市公司股东的净利润为106,150万元至113,732万元，比上年同期增长40%至50%各位知道：我刚开始投资啤酒，最初买入燕京的2017年，燕京利润是多少吗？我关注和买入燕京，就是我赌她“困境反转”。非常符合索罗斯的【反身性原理】。\",\"url\":\"https://www.zhihu.com/pins/1925937040266105271\"},{\"slug\":\"2025-07-08-思考-你想毁掉新教育-是因为新教育太邪恶\",\"year\":\"2025\",\"title\":\"想毁掉新教育，是因为它太坏还是你得不到？\",\"date\":\"2025-07-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"你想毁掉清一，还想让我进监狱。你想让刘老师进地狱，是因为刘老师太恶毒，还是因为你恨屋及乌？是不是所有的好东西，只要你得不到，你就要毁掉？但你们为啥去了老挝，对外都宣扬你们两人，才是磨丁最大的投资人？但磨丁管理方，法院，要求你们出示你们的资产证明，投资文件，为啥你们不提供，还躲起来不见人？你们口口声声维护正义，为啥到了法院就见不到你们？转发作者：英子同学黄熊二人想拖垮磨丁教育建设，没那么容易！\",\"url\":\"https://www.zhihu.com/pins/1925813625257453085\"},{\"slug\":\"2025-07-08-清一怎样洗钱和偷税漏税的\",\"year\":\"2025\",\"title\":\"黄小燕指控清一洗钱偷税：家长带现金交学费就是洗钱？\",\"date\":\"2025-07-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"|正义的黄小燕，网上指控清一洗钱，偷税漏税？黄小燕指控说我洗钱：因为我让家长，把给我的培训费和学费，用现金带到泰国来交给我，所以我就是洗钱了。家长怎么赚的钱，我应该去管吗？实话实说，我每年交给国家的税，大概是几百万元。我的钱，怎么用的，你自己就是因为原来以弟子的身份，负责管理这些资产的，你难道不知道吗？你在网上，以你的大号和小号大声的以公正，法律的理由，要求我承担洗钱，偷税，要进监狱的鬼话。\",\"url\":\"https://www.zhihu.com/pins/1925869309785268310\"},{\"slug\":\"2025-07-08-这个顾某人-难道是马大雁的小号吗\",\"year\":\"2025\",\"title\":\"顾某疑似马大雁小号：爱威胁报警，还私拿学校执照\",\"date\":\"2025-07-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"这篇帖子的回复文字和风格，特别像马大雁。她一向就特别喜欢威胁人，动不动说“我让公安来抓你”，好像她家是开公安局的。在磨丁，熊某人把我们我今日国际学校的执照，直接私自给了她。但她还不满足，她要去拿今日国际学校的公章。但公章的保管人，是基金会的潘女士，心语的妈妈。好像公安就是她家仆人一样，随时听她指挥。两年前，她对我也是的一样：让我乖乖的把钱给她。当时马大雁说话的口气，就特别像这个帖子的表达方式。\",\"url\":\"https://www.zhihu.com/pins/1925997857783157608\"},{\"slug\":\"2025-07-07-2016年-我53岁-还未认识S某的时候\",\"year\":\"2025\",\"title\":\"2016年我53岁悬赏千万寻敌：九年后连败我弟子的人都难寻\",\"date\":\"2025-07-07\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我还瞎吹牛，说能够教出学生击败我的人，给1000万奖金来试试。上面就是我当年的文章，以及内部群上的发言记录，这是一份活生生的新教育历史，记录了传武大师们的无耻，以及无语。黄武士，我只带了他一年学武，他去年刚满18岁，第一次参加全国泰拳锦标赛，就击败了香港的三冠王，东亚冠军，全港两届冠军，夺取了全国泰拳冠军的荣誉。就是：想要一年就想打败我的弟子，拿到10万奖金？我看难度比9年前高了很多。\",\"url\":\"https://www.zhihu.com/pins/1925589328786089421\"},{\"slug\":\"2025-07-06-回复五湖散人谢谢您指导-有关清净派和欲\",\"year\":\"2025\",\"title\":\"回复五湖散人：清黑主动污蔑，你却只劝我们别对立\",\"date\":\"2025-07-06\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"您认为清黑清粉，本自一家，本无分别。难道您看不出，明明是清黑们在毫无根据的主动的出来，污蔑陷害，甚至流氓手段都用来对付小姑凉了，一堆的匿名号到处乱说。您这么有正义感，就没见你说说一下清黑的无德。您反而来我们这里，说我们不应该把清黑泼上我们身体的污水抹干净因为你说污水，清水都是一样的？我挺同意您的观点，的确，圆满的世界里面，没有对立。您既然学得这么好，这么高的境界，我当然要向你好好学习和请教才是！\",\"url\":\"https://www.zhihu.com/pins/1925258052602409858\"},{\"slug\":\"2025-07-05-武林旧事5-武行的规矩和传承\",\"year\":\"2025\",\"title\":\"武林旧事5：武行的规矩和传承\",\"date\":\"2025-07-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"他带出去有真功夫的徒弟，打了津门8家武馆，留下自己的传承人，然后去过日子的故事。天津武术的泰斗郑山傲，一心想要传武能为国为民服务，希望武林教真功夫的故事。徐浩东说：他写的不是武侠的故事，而是武行的故事，啥意思?我就给学生们介绍了中国传武的老规矩：学生是学生，弟子是弟子，两者不一样。中国的武林，现在完全就是乱七八糟的，真没有啥规矩。泰国的格斗市场发育良好，就和这些武林规矩的执行很有序有关系。\",\"url\":\"http://zhuanlan.zhihu.com/p/1924855497732888222\"},{\"slug\":\"2025-07-05-网友留言-德行差的-武力值最多中品吧-封\",\"year\":\"2025\",\"title\":\"德行差武力封顶中品：修上品需修心，太极快刀一秒封喉\",\"date\":\"2025-07-05\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"网友留言：德行差的，武力值最多中品吧(封顶了)，只能说在传武即将失传时代算绝顶高手吧，感觉山长再过5-10年上品，不知能控中品吗？5-10年之后，我肯定连自己的徒弟都打不过了。今天上课，跟全国成人泰拳冠军，黄武士试了一下太极快刀技术：吓死现场的众人了。一秒钟刀就架上脖子了，他怎么防也防不住，连试两次都不行。我从小没练功夫，身上的功力差，拼实力比不过从小练武的练家子。\",\"url\":\"https://www.zhihu.com/pins/1924827484114907565\"},{\"slug\":\"2025-07-05-转-有一次在美股群闲聊-我说了一句“美国\",\"year\":\"2025\",\"title\":\"美股群说「美国钢产量不如中国」被留学生骂一天：去美国上大学是智商税\",\"date\":\"2025-07-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"转：有一次在美股群闲聊，我说了一句“美国钢产量不如中国”，结果被几个在美国的留学生骂了一天一夜，是真的一天一夜，因为第二天我打开群，发现凌晨4点他们还在疯狂安特我。这么明显的事实，还会被人喷？自己去查一下产量数据不就完了？喷啥呢？今日好不好，去查一下成绩不就行了？怪不得我说去美国上大学，是智商税。不如去日本等国上大学更划算。会被喷的很厉害了。认知差，是没法讲道理的。\",\"url\":\"https://www.zhihu.com/pins/1924926732928000170\"},{\"slug\":\"2025-07-04-孙某人居然跑到我的文章下面-一通胡言乱语\",\"year\":\"2025\",\"title\":\"孙某到我文章下胡言，我拉黑了他：武林旧事4传武绝招上场无用\",\"date\":\"2025-07-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"还有一堆可笑的语言，怕我要面子，会删除他的言论，还说我拉黑他，就是我认输了等等。他还去找明仪攀亲，但明仪不认，坚持说他是个老流氓，让他道歉。以下是我对孙某人的回复（原文截图在后面），然后我拉黑了他，再也不见。我一个书生，武功比不过你这武师，有啥丢脸的？我就怕我的德行，修养还不如你，这就真的太丢人了！再说一遍：1：我从来都承认，我打不赢您。哪有高明的师傅，到处去求着找人认徒弟，认徒孙的？\",\"url\":\"https://www.zhihu.com/pins/1924613287225583397\"},{\"slug\":\"2025-07-04-教你看这个视频-这样去看里面我跟佳慧打擂\",\"year\":\"2025\",\"title\":\"教你看木兰佳慧打擂视频：那是武舞战舞，不是真打架\",\"date\":\"2025-07-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"【英子：我看完了，我觉得你老人家在跳老年disiko，哪里是打架】我说：【连老拳师都看不懂。】【你看视频的时候，去找到这样的镜头----如果我要扭断她的脖子，我有多少次机会，这样做？你这样去看，就知道这个武功的吓人之处了】这个是武舞，是战舞。这个就不是一般的跳舞，有很奇特的旋律配合的。泰国，我们的云南边疆等地，现在还有这种战舞的格斗模式，训练模式，不是中国的军阵的格斗模式（如英雄电影里面一样）。\",\"url\":\"https://www.zhihu.com/pins/1924268040620582269\"},{\"slug\":\"2025-07-03-唉-孙就是这毛病\",\"year\":\"2025\",\"title\":\"孙这毛病又犯：敢惹女人，还练「蛆虫拱大粪」的功夫\",\"date\":\"2025-07-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"这一回，他居然敢公开去惹女人。连孔子都不敢去惹女人的，他去撩火，这可咋收场？我建议孙还是尊重女性，离女性远一点。记得我给孙的信提到：【第一次见面，你就说你的功夫没啥神奇的，就是练的【蛆虫拱大粪】的功夫。你还说，练功你要练【把鸡儿甩到肩膀上】的功夫。】“鸡儿”就是云南土话的男性生殖器，外省人可能不知道。他几乎天天这样说他的武功秘籍，我耳朵都听腻了。后来才悟到，这就是练腰挎抖发之力，老祖宗早说了。\",\"url\":\"https://www.zhihu.com/pins/1924075670289483207\"},{\"slug\":\"2025-07-03-明晓世锦赛战六冠王刚才重新看了一遍明晓\",\"year\":\"2025\",\"title\":\"明晓世锦赛首战遇六冠王：无教练陪伴仍打出气势\",\"date\":\"2025-07-03\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明晓挺可惜的，她第一场比赛，就遇到了世界冠军。如果换了其他的对手，她是可以轻松战胜的！打世界冠军这一场比赛，她也打得很不错，打的对方找教练求救。可明晓没有教练陪伴，我没有资格去参赛，去的官员们，没人能帮她！这个打其他拳手都轻松KO的六次洲际和世界冠军，本次赛事，遇到的最大敌手就是明晓。其实是四个（佳慧和谭木兰，本次被剥夺了参赛的资格，她们如果参赛，战绩不会比明晓陆鸽差）。\",\"url\":\"https://www.zhihu.com/pins/1924141963797562872\"},{\"slug\":\"2025-07-03-木兰明晓确定参选2025成都世界运动会相\",\"year\":\"2025\",\"title\":\"明晓确定出战2025成都世运会：自律不需陪练，远胜体制包办\",\"date\":\"2025-07-03\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"李景亮更惨：出国比赛，他连一个伙伴都没有，打ufc，就一个人去。核心是因为运动员，不是因为喜欢而来的，而是“不得不练”，所以，自觉性不够！几天后正式开始训练，国家队的教练们，肯定就会开始“自以为是”的胡折腾了，会要求明晓按照他们的训练模式来做。在我看就是乱搞，跟格斗一点关系都没有，但他们还不许我们\\\"单练\\\".因为“国家队是一个集体”。这才是国内的常态，我只能让他们学会服从体制。\",\"url\":\"https://www.zhihu.com/pins/1924128391549936408\"},{\"slug\":\"2025-07-03-武林旧事4-传武绝招为啥上场不能打\",\"year\":\"2025\",\"title\":\"武林旧事4：传武绝招为啥上场不能打？\",\"date\":\"2025-07-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"因为你比许骥晚学，跟我一起学的话，不太可能超过他。因为我底子很差，跟林妹妹一样弱，不经打。结果，我也不在意羞辱啥的，就公开开价：只要能教出打赢我的学生，重赏！这点自信，我还是有的，我认为专业的武者我大概打不过。虽然我跟这个传武拳师过个招的，我完全不是他对手。后来一个最强的孩子，别人问她是不是跟我打没有尽全力，她委屈死了，把手臂拿出来给她们看，说手臂上到处打得都青紫了，你们还认为她没有尽力！\",\"url\":\"http://zhuanlan.zhihu.com/p/1924046413257486807\"},{\"slug\":\"2025-07-02-孙师傅啊-你真的那么恨老张吗\",\"year\":\"2025\",\"title\":\"孙师傅去英子家「表演拉屎」：我只写你「屎」他就炸了\",\"date\":\"2025-07-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"武侠大师，要去英子姑娘的家里是“表演拉屎”。还有点害羞】我真的以为，你文章中，把孙大师写成“孙大屎”了，才惹他生气。估计谁也不会认真去再看看你的文章里，你是怎么用这词汇的。你可能真的以为你用了这个字眼，毕竟---看他信誓旦旦的（这是你自己写的文字里说的？接下来你的回复，几乎等于是承认他可能是真的见到了这个字眼，于是坐实了你用词不谨慎导致孙大师不满，生气，不理你，骂你的原因，都怪你乱说话！\",\"url\":\"https://www.zhihu.com/pins/1923659303396578200\"},{\"slug\":\"2025-07-02-武林旧事3-我20年前的太极老师\",\"year\":\"2025\",\"title\":\"武林旧事3：我20年前的太极老师\",\"date\":\"2025-07-02\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章我今生，唯一拜过的一个武术师父，就是20年前认识的赵堡太极刘火森老师。五岁的小明慧，为拿护照回河南老家办证的机场照片原来我和夫人在武汉生活的时候，一两年就去河南看看老师。就是网友的这一问，我就想起我的太极老师来了！但我留在北京的几天，都不肯再去见这些传武太极大师。当年，我带了几个武大的学生，开车去赵堡镇，住在镇上的学校旁边，问当地人有没有赵堡太极的老拳师。\",\"url\":\"http://zhuanlan.zhihu.com/p/1923674361732261481\"},{\"slug\":\"2025-07-01-我回复英子文章的评论-孙师傅啊-你真的那\",\"year\":\"2025\",\"title\":\"回复英子：孙师傅真那么恨老张？我带小公主们当未来国礼\",\"date\":\"2025-07-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"今天刚刚陪三个小公主玩了一整天回家，我当公主们的司机和陪聊。也去梅州大学教她们一些不是打比赛的功夫，她们玩得蛮开心的。我说：她们是未来的国礼，我的好好跟她们拉拉关系。原来每周，我都要带明慧ELLA出去去玩的，是陪她们的固定节目，现在已经几个月没有陪小公主们去玩了，太忙。昨天ELLA要我出任务，就安排今天上午9点一起出去，晚上10点才回来。带了两百多斤芒果，牛油果等水果，让她们回去后带给公主们吃。\",\"url\":\"https://www.zhihu.com/pins/1923526170005201330\"},{\"slug\":\"2025-07-01-浊而静之徐清-安以动之徐生\",\"year\":\"2025\",\"title\":\"浊而静之徐清，安以动之徐生\",\"date\":\"2025-07-01\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"清净的能量，和欲望的能量，会产生严重的撕裂。只有能够守住自己内心清净的人，才会安然度过。如果他懂得【静之徐清】的道理，万事不管，啥事都不去关心，更不跟清黑们去应和。在十年后，中华武术在世界上崛起之时，他就可以安然地出来，做自己的一代宗师，留下自己的名望和武功传承，光荣地走完自己的人生路。去看了清黑的东西，就一念糊涂，心生疑惧。现在这些跳出来骂人散布黑暗的清黑学生，很可能走上这一条路！\",\"url\":\"http://zhuanlan.zhihu.com/p/1923290291747688975\"},{\"slug\":\"2025-07-01-爱出着爱返-恭喜你账户回归\",\"year\":\"2025\",\"title\":\"爱出爱返：清黑因亏损攻击我，我不动如山，他们未能让我归零\",\"date\":\"2025-07-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"2016年的其他清黑，就是脑子被巨额的亏损弄宕机了。就妄想通过攻击贬低我，让我的事业失败，账户亏损（当年如果我生气愤怒，想要证明自己，可能就会乱操作，但我就是不动如山，不去理他们）。因此，他们其实并不能让我的账户归零（除非我跟负能量去接轨）。反而更有可能让他们自己的账户归零你的运气转过来，是懊悔之下，马上去学习跟随我的正面能量，转了过来。结果可想而知，距离爆仓仅一步之遥，账户也大幅缩水。\",\"url\":\"https://www.zhihu.com/pins/1923318018198439385\"},{\"slug\":\"2025-06-30-一个女人-她哪怕长得再好看-再惊心动魄\",\"year\":\"2025\",\"title\":\"女人话多掉价、倾诉欲强是内心不够强大：高手话少而稳\",\"date\":\"2025-06-30\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"一个女人，她哪怕长得再好看，再惊心动魄，一旦她开始变得话多，唠唠叨叨，她整个人就开始掉价，很多女人就是死在了话太多，还有就是那种倾诉欲特别强的女人，倾诉欲太强的女人也很难得到别人的尊重，因为本质上是你内心不够强大，缺少爱，缺少认同那种表现，你越是想得到别人的理解和认同，别人越不会给到你，甚至呢，还会看不起你。作者：隐逸之学链接：。商业转载请联系作者获得授权，非商业转载请注明出处。\",\"url\":\"https://www.zhihu.com/pins/1923043822478300544\"},{\"slug\":\"2025-06-30-一代宗师-该怎样走上去-该怎样走下来\",\"year\":\"2025\",\"title\":\"一代宗师：该怎样走上去，该怎样走下来！\",\"date\":\"2025-06-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我看【一代宗师】的电影，宫宝森去佛山，就是要教自己的女儿宫二。他愿意用自己的名气，来抬举叶问，让叶问“走上去”！未来，清一武道馆要去击败世界各国的冠军，孩子们的拼搏努力，很可能会让我成为【一代宗师】的。中华武林一代宗师这个巨大的名誉，不能让我一个人来顶着！未来中华武术的一代宗师，整个的【走上去，退下来】的方案！要坚持把自己老祖宗好不容易留下来的一点东西，都带到棺材里面去！\",\"url\":\"http://zhuanlan.zhihu.com/p/1923113824573190312\"},{\"slug\":\"2025-06-30-有人说-铁证如山跟前-你还这样坚持-我\",\"year\":\"2025\",\"title\":\"面对酸话回敬：我也有傲气，赔钱养弟子但绝不跪着\",\"date\":\"2025-06-30\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"】我的回复：我最佩服的，就是您S老师的骨气和傲气。既然您有骨气，也能理解我也有一点小小的傲气吧？虽然我是商人，有点俗气，是您瞧不起的土豪。但我也练了一点武，也有一点小小的武人的脾气。我愿意赔钱来养弟子，还愿意免费送弟子给别人，我也不求回报。但，如果有人就是要我跪着，把我辛苦多年培养的礼物送出去。所以，为了成全您的骨气和傲气，我肯定不敢送弟子去羞辱您！也为了成全我的傲气，您肯定也不能要我的弟子。\",\"url\":\"https://www.zhihu.com/pins/1923113446867735184\"},{\"slug\":\"2025-06-30-江湖水深-人外有人-山外还有山\",\"year\":\"2025\",\"title\":\"江湖水深：人外有人，山外还有山\",\"date\":\"2025-06-30\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"武林旧事：中华末代武人的残响余光我的回复：她只有手机，不过，某些人的眼里，手机也可以用来当间谍的“设备”。这种距离，拍人像的话，恐怕都看不清人脸，看不出谁是谁。就在发生此事的前几天，孙老师跟我和明慧私人见面（就是我说的送一万元给他这次），孙师傅当时，还是高高兴兴的过招，跟我们演示他的绝活，也指导了明慧几招功夫。孙师傅肯定是个粗人，他恐怕自己都没有想过，他自己胡乱想出来的偷拍故事，是这么的不靠谱。\",\"url\":\"http://zhuanlan.zhihu.com/p/1923007650876101354\"},{\"slug\":\"2025-06-29-我写的这篇文章-回复网友-站在孙师傅背后\",\"year\":\"2025\",\"title\":\"回复网友：孙师傅背后之人，文章被封阅读骤停\",\"date\":\"2025-06-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"我没骂人，只是分析了一些事情。不过，可能触及了某些人的痛处，阅读量600多就停止了。后来刘老师告诉我，我的文章打不开链接。但我自己看，一切正常。也没有通知我有啥不合适的词汇犯规了。看样子，是被人关起来了。我就把内容发给了群内的朋友，他们认为有价值，就发到自己的主页上，我也不要版权。也许下面这个链接暂时有效，你们看看吧。正义理性的表达不应被封杀，孙的背后黑手是谁？\",\"url\":\"https://www.zhihu.com/pins/1922747741697705470\"},{\"slug\":\"2025-06-29-武林旧事2-传武人的残响余光啥意思\",\"year\":\"2025\",\"title\":\"武林旧事2：传武人的残响余光啥意思？\",\"date\":\"2025-06-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"清一新教育今日学堂清一武道张清一原创文章中国的武术格斗项目，特别是传武部分，已经后继无人。老传武人，现在最年轻的一批，也是50多，60多了。所以，上一篇文章，我说现在是传武人的“残响余光”。20年之后，中华旧式的传武人，就彻底退出历史舞台了。武林旧事：中华末代武人的残响余光这些老传武人，20年后，就算还勉强活著，也跟死了差不多，老头们都是等死苟活的状态了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1922607260498125098\"},{\"slug\":\"2025-06-29-每年一千多万的大学毕业生-现在上普通大学\",\"year\":\"2025\",\"title\":\"每年一千多万的大学毕业生，现在上普通大学还真的有用吗？\",\"date\":\"2025-06-29\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"如果有用，是指“找工作有用”的话，这取决于中国的白领岗位，能够提供多少给年轻大学生。如果能够提供1000万，自然就全都有用。因此，不是大学有用没用的问题，而是岗位需求足不足够的问题！上大学的岗位可能不够，但不上大学的岗位应该管够。现在的老人越来越多，养老，服务业，这些不上大学的人也可以去做，岗位需求会越来越多的！将来服务员的工资超过大学生，应该没问题！大学生不值钱，但有点技术的蓝领工人更值钱。\",\"url\":\"https://www.zhihu.com/question/1917938705378809178/answer/1922605162830225967\"},{\"slug\":\"2025-06-29-转-我曾看过一个韩国教授的演讲-他说这个\",\"year\":\"2025\",\"title\":\"朝鲜瞧不起美国、韩国瞧不起中国：我们像双相情感障碍的同事\",\"date\":\"2025-06-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"转：我曾看过一个韩国教授的演讲，他说这个世界上唯一敢瞧不起美国的国家是朝鲜，世界上唯一瞧不起中国的国家是韩国，我们是唯一瞧不起世界TOP1和TOP2的民族。两个国家就像是你身边那个自卑到极要反而变得自负的，患有双相情感障碍的同事，你不管说什么，他们都会应激，你说他好，他认为你在阴阳他，你说他不好，他会跳起来和你拼命，你不理他，他说你瞧不起他，你对他态度好，他反而会看不起你。\",\"url\":\"https://www.zhihu.com/pins/1922750852118077613\"},{\"slug\":\"2025-06-28-武林旧事-中华末代武人的残响余光\",\"year\":\"2025\",\"title\":\"武林旧事：中华末代武人的残响余光\",\"date\":\"2025-06-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"中国传武人，一直没有和真正的世界冠军交手。传说中的传武大师，击败洋人，击败俄国大力士等等故事，我们都觉得了不起了。这只是验证了中华传武后继无人的局面，诺大国家，居然没有一个人出来教训这种狂徒。我实在不甘心被日本人抢走我们的中华传武。然后他们帮助这些快要失传的，没有弟子传人的传武老拳师，把老祖宗的绝学传下去，让中华传武重新振兴。只能是极少数除了练武，啥都不想要的人，才能留下来传承中华武术！\",\"url\":\"http://zhuanlan.zhihu.com/p/1922042659834425849\"},{\"slug\":\"2025-06-28-武林旧事-中华末代武人的残响余光武林旧事\",\"year\":\"2025\",\"title\":\"武林旧事：中华末代武人残响将逝，清一武道接棒\",\"date\":\"2025-06-28\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"武林旧事：中华末代武人的残响余光武林旧事：中华末代武人的残响余光文章选择了这个题目，是因为：在我的视角下，过去的中华传武人，最后的残响余光正在消失中。等现在这批传武老人们慢慢枯萎之后，过去的传武活体代表人，将来就不再存在了。但清一武道代表的，年轻的新一代中华武术的【文武双全】为代表的传武文化，会快速的崛起，成为未来世界格斗界一只崭新的力量。它将与现代格斗强调野蛮和粗野的文化风格，形成阴阳的两极。\",\"url\":\"https://www.zhihu.com/pins/1922401447074598991\"},{\"slug\":\"2025-06-28-看了今晚的直播-李想公主今天打的很\",\"year\":\"2025\",\"title\":\"李想公主直播战悍将：仑披尼选秀赛激烈超常\",\"date\":\"2025-06-28\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"估计是因为仑披尼要来选拳手的关系，比赛非常的激烈，远远超过正常的清迈地区赛事。我看赛场人数也很多，而且今天早上7:00就要去称重（正常的比赛不称重），所以，今天比赛显得正式的多，拳手一直在积极的拼抢进攻。泰拳手被李想正蹬击倒后，就站起来往前冲，属于勇猛进攻型的拳手。李想公主的素食优势，明显优于泰国拳手的体能。可是泰拳手第三局之前，还可以拼死决战，第四局就明显体能没有及时的恢复过来，明显处于被动了。\",\"url\":\"https://www.zhihu.com/pins/1922423138517488688\"},{\"slug\":\"2025-06-26-“此事若成-足以在中国科技史上留下名字\",\"year\":\"2025\",\"title\":\"芯片点亮中国工程师泪崩：足以留名科技史\",\"date\":\"2025-06-26\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"很棒[赞]这颗芯片点亮那一晚，中国工程师集体泪崩！清迈麦当庄园的学生们：如果你们有希望在中国科技史上留下名字。但你们要做世界上的【文武双全】的人才，在世界教育史上留下自己的名字，似乎就简单容易多了！特别是公主班的女生们：我猜你们没有一个人，有希望在中国科技史上留下名字。但你们很可能会在世界教育史上，或者世界武术史上，留下自己的名字。就像是足球的贝利，拳击的阿里等人一样，成为闪亮的明星。\",\"url\":\"https://www.zhihu.com/pins/1921715976065483243\"},{\"slug\":\"2025-06-26-与神对话-尽管去做你真正热爱的事情\",\"year\":\"2025\",\"title\":\"与神对话：去做真热爱的事，勿以所恶谋生\",\"date\":\"2025-06-26\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"你怎么会想到要浪费时间做某些你不喜欢的事情来谋生呢？】我想：这就是神，想要对我们社会上的“牛马社畜”们说的话吧？你们的生活必定是悲惨的，除非你们不再这么热爱。等你们进化到一定程度，你们将不再热爱这戏剧人生，不再热爱你们一直在经历的“故事”​。到时你们就会决定——主动地选择——去改变它。要改变你的现实，只要停止那么想就可以了。呵呵黑子们喜欢黑，热爱悲惨，喜欢到处去宣扬悲惨，不惨也非要说惨。\",\"url\":\"https://www.zhihu.com/pins/1921527155617142085\"},{\"slug\":\"2025-06-26-传武真的不能打吗\",\"year\":\"2025\",\"title\":\"传武真的不能打吗？\",\"date\":\"2025-06-26\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"这个传武的训练方式，与现代格斗是完全不同的。所以练了现代格斗的人来练传武，根本没法练。同时练了正宗传武的人，去练现代格斗，也特别的别扭。一个是我们国家长期不重视传武，只重视套路，以为江湖卖艺人的武术套路表演，就是传武。其实真传武的家规，比如我们的太极门，师门规矩是严禁“跑马卖艺”，也严禁“看家护院”的。这肯定不是啥真正的传武，而是打传武名的中国式体操和中国艺术表演活动！\",\"url\":\"https://www.zhihu.com/question/1920899529517012197/answer/1921499512721085401\"},{\"slug\":\"2025-06-26-我常常叫小公主们-小猫们\",\"year\":\"2025\",\"title\":\"称小公主为小猫：陆韵如求教旧师反被晾\",\"date\":\"2025-06-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"因为她们都挺可爱的！不过，这只猫，被塞进WC的马桶里面了，被困住了。你们是不是去拯救她出来？陆韵如小公主，已经成年了（超过18岁），正在清迈公主班当拳手。她以曾经WC的学生身份，虚心请教她原来的老师一些问题。你们能帮助她解决这些疑难不？聪颖老师，曾经的学生来求教，还请点拨在下一二！\",\"url\":\"https://www.zhihu.com/pins/1921691668442219584\"},{\"slug\":\"2025-06-26-比亚迪会倒闭吗\",\"year\":\"2025\",\"title\":\"比亚迪会倒闭吗？\",\"date\":\"2025-06-26\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"这些到处说比亚迪要倒闭的人，大概是担心，万一比亚迪不倒闭的话，自己就要倒闭吧？当然，还有一个可能性：就是有些人相信，只要比亚迪倒下了，这些人就可以起来当老大了！造谣比亚迪，就是因为比亚迪太强了，他们干不过。就只能网上制造舆论，让比亚迪网上先倒下。起码让一些脑子不好的人，看了这些言论，就不敢去买比亚迪了。但如果我要买车，很可能下一辆车是比亚迪！我认为：比亚迪眼中的对手，根本就不是国内这些厂商。\",\"url\":\"https://www.zhihu.com/question/10783732020/answer/1921613721240867284\"},{\"slug\":\"2025-06-26-清一武道馆靠谱吗-听说要培养内家拳高手\",\"year\":\"2025\",\"title\":\"清一武道馆靠谱吗？听说要培养内家拳高手，挑战现代搏击，夺取博击世界冠军?\",\"date\":\"2025-06-26\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"目前，清一武道馆孩子们，已经有15个人拿到泰拳，自由搏击的全国锦标赛冠军。两人代表国家队去参加土耳其世界锦标赛，与拿过10个IFMA的世界冠军交手。这个世界冠军KO了她遇到的所有对手，除了我们的木兰打满三局判负！8月份，她就要与世界各国格斗冠军交手，争取为中国拿到一块奖牌！泰国的青年世界冠军帕卡，在清迈职业拳场，多次与我们不同的拳手交手，从木兰到小公主，但每次都被我们的拳手KO。\",\"url\":\"https://www.zhihu.com/question/450729255/answer/1921568775955776809\"},{\"slug\":\"2025-06-25-2025大湾区新教育峰会-参会者分享\",\"year\":\"2025\",\"title\":\"2025大湾区新教育峰会（参会者分享）\",\"date\":\"2025-06-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清一新教育今日学堂清一武道张清一原创文章6月22日在广州召开的新教育分享会，现场500人参与！一场颠覆认知的家族传承课——2025大湾区·新教育峰会第一天播报在中国，基本上，已经没人知道“家族传承”是啥意思了！其实，我说的3.0，是指将来要带外国学生的新教育教师。家长陈苗芬：家族传承，清风徐来周末在广州增城的新教育分享会已经过去两天，但心头的惊叹仍清晰可辨。\",\"url\":\"http://zhuanlan.zhihu.com/p/1921336249509217424\"},{\"slug\":\"2025-06-25-水木然经常说-当你不再渴望得到-只是去爱\",\"year\":\"2025\",\"title\":\"水木然：不再渴望得到只是去爱，人生才刚开始\",\"date\":\"2025-06-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"水木然经常说：当你不再渴望得到，只是去爱；当你不再期待成功，只是去做；当你不再追求财富，只是去创造；当你不再执着一切，又热爱一切；真正的人生，才刚刚开始。\",\"url\":\"https://www.zhihu.com/pins/1921345009854191143\"},{\"slug\":\"2025-06-24-两个富裕家庭的三年果报-从逆境中出来的一\",\"year\":\"2025\",\"title\":\"两个富裕家庭的三年果报：从逆境中出来的一喜一悲！\",\"date\":\"2025-06-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清一新教育今日学堂清一武道张清一原创文章最近，两个过去家长的事情，两三年前的不同选择。这两个家庭的经济条件都非常好，算是中上层家庭了！虽然这两个家庭，都得到了来到今日的机会，也受到了相反力量的干扰。这个家庭的孩子，今年15岁首次参加SAT考试，就考出了1510分的高分！【唯一不幸运的是外公，他跑来举报我们之后，两年内就突然死去了，我也没有想到】第二个家长，结果就悲惨了！\",\"url\":\"http://zhuanlan.zhihu.com/p/1920790445782434037\"},{\"slug\":\"2025-06-23-的确-贬低巴菲特-并不能让自己赚钱\",\"year\":\"2025\",\"title\":\"贬低巴菲特赚不到钱：上台战胜对手才是冠军\",\"date\":\"2025-06-23\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"干掉巴菲特，也得不到他的财富！质疑，攻击和谩骂高手，并不能让自己成为世界冠军！只有走上擂台，并战胜对手的人，才能成为真正的冠军！最近20年，我的金融资产已经增长了几十倍。但我从来就不敢说：自己超过了巴菲特！我只是特别的感谢中国市场的疯狂，让我用巴菲特加上索罗斯的方法，收获多多！现在和将来，会更多使用巴菲特和芒格的方法！据说：巴菲特的财富，97%都是他60岁以后创造的！\",\"url\":\"https://www.zhihu.com/pins/1920410295349785428\"},{\"slug\":\"2025-06-22-思维和知识有啥不一样-体制的优劣得失\",\"year\":\"2025\",\"title\":\"思维和知识有啥不一样？体制的优劣得失\",\"date\":\"2025-06-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂清一武道张清一原创文章有个武大的校友，在感叹自己：比不过十几岁的小公主！因为我是用思维来教练英语的，我能看透英语的本质。你们从来没有学过思维，当然跟她们比思维，自然就比不赢了！学习了思维，再来学知识，就会非常的容易。最大的局限，是不但没有学思维，反而破坏了正常的思维。十几岁的小孩，思维没有被破坏，所以他们天生比你们快掌握我讲的东西，很容易抓住本质，而体制内的学霸就不行！\",\"url\":\"http://zhuanlan.zhihu.com/p/1920239849165783400\"},{\"slug\":\"2025-06-22-我很傻-很天真\",\"year\":\"2025\",\"title\":\"ELLA天真发问清黑难答：仁者无敌见真章\",\"date\":\"2025-06-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"善良友好亲切的ELLA，就这样柔柔的提出问题，真诚地请教清黑大哥大姐。如果换了我是清黑，我还真不知道该怎样回答ELLA提出的这些问题呢。我现在特别盼望大聪明WC，出来认真的回答和帮助，点醒这个糊涂和年轻的小学妹！因为从6月3日期，WC就已经不欠我的，就跟师门没有一毛钱关系了】WC不是“优秀到无愧任何供养”吗？你就来帮助一下这个不够优秀，有愧供养的，没信心，没头脑的，傻傻的天真小学妹吧！\",\"url\":\"https://www.zhihu.com/pins/1920201903935055378\"},{\"slug\":\"2025-06-22-身份识别课程2-交友之道-找到伙伴和远离\",\"year\":\"2025\",\"title\":\"身份识别课程2：交友之道！找到伙伴和远离小人\",\"date\":\"2025-06-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"因此，对于他来说，肯定非常在意，去
