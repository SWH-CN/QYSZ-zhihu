识别身边什么人，才是可以合作的，什么人是需要远离的！我们都知道要远离小人，但如何鉴别小人呢？我们就需要去识别身边的人，发现什么人才能成为伙伴，什么人会帮助我们。因此，今天我给公主班，冠军班布置的新作业，就是身份识别课程2：通过某些人的言行，去发现好伙伴，和发现小人，远离小人！根据TA表现出来的言行，判断TA的身份，到底是属于什么级别的人。\",\"url\":\"http://zhuanlan.zhihu.com/p/1920041793426273991\"},{\"slug\":\"2025-06-21-小学三年级学生的作业-以及未来的三种可能\",\"year\":\"2025\",\"title\":\"小学三年级学生的作业，以及未来的三种可能！\",\"date\":\"2025-06-21\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂清一武道张清一原创文章家长贴了一张小学三年级学生的家长对话，以及吐槽对现在教育的不满！现在很多体制毕业的学生，就这种状态，新教育的一些非常好的东西。但有可能，完全没有正常人的生活和自理的能力！下面这个，就是配合成功的顶级结果的案例了【我身边就有这样一位闺蜜，清华毕业，年薪50万，但直到30岁才学会煮面。小学三年级不会的，会服从老师，服从家长！\",\"url\":\"http://zhuanlan.zhihu.com/p/1919741462406476600\"},{\"slug\":\"2025-06-21-真成绩-假成功-昨日今日塾无名塾本届SA\",\"year\":\"2025\",\"title\":\"真成绩，假成功！昨日今日塾无名塾本届SAT首考成绩创造新纪录！\",\"date\":\"2025-06-21\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂清一武道张清一原创文章昨晚，今日塾赵刚校长内部家长群公布的本届SAT首考成绩消息！为击败今日塾而生的对手无名塾，他们的校长刘静慧，对今日塾取得的成绩表示祝贺！她们的首届学生今年也毕业了，也创造了自己的无名塾记录！给大家汇报一个好消息：今日塾今年的SAT成绩再创新高！对比去年创造惊人记录的示范班，今年今日塾的成绩再创新高。无名塾的首届学生，今年取得的成绩也出来了！\",\"url\":\"http://zhuanlan.zhihu.com/p/1919689610826616922\"},{\"slug\":\"2025-06-20-今天上午送机去了\",\"year\":\"2025\",\"title\":\"送机归来近收市：11.40托单卖珠江、吃惠泉12.02压盘\",\"date\":\"2025-06-20\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"下午回来，已经快收市了！看到珠江今天居然冲11.80了！不过我看的时候，股价在11.41-42波动，但11.40有较大的托盘。我就挂单10万股卖出珠江！同时，惠泉的12.02和03有压盘。我就一口气挂单11万股，全部吃掉了这两个价位的压盘！收盘惠泉就快速冲去12.09元了！这次操作，到了收盘的时候，一跌一涨，小赚一万元？反正我就是认死理：两者差价6毛钱的话，惠泉更值得拥有！\",\"url\":\"https://www.zhihu.com/pins/1919414020487746355\"},{\"slug\":\"2025-06-20-今日学堂赵刚-全体成员-大家好\",\"year\":\"2025\",\"title\":\"今日塾SAT再创新高：12人1500+、19人1450+\",\"date\":\"2025-06-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"给大家汇报一个好消息：今日塾今年的SAT成绩再创新高！目前今日塾已经有12个学生拿到了1500+的超高分，19个学生拿到了1450+的高分。加上本届去年仅用三年就已经提前考出了2个1500+（已提前去冠军班就读）。所以，我们2022级挑战班这一届，到6月份就已经有14个1500+的超高分成绩了（达到美国哈佛耶鲁等常春藤名校的录取成绩区间）。对比去年创造惊人记录的示范班，今年今日塾的成绩再创新高。\",\"url\":\"https://www.zhihu.com/pins/1919525070184898808\"},{\"slug\":\"2025-06-20-小道童下山-今天送明慧回国参加分享会\",\"year\":\"2025\",\"title\":\"小道童下山！今天送明慧回国参加分享会\",\"date\":\"2025-06-20\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章我在8-9年前，带9岁的明慧来到泰国生活！小明慧在3岁半的时候上明珠班，现在唯一跟下来的同学是明晓。明慧9岁的时候来泰国，上我的“家庭学校”，才开始学中文。2018年的文弱小公主[10岁明慧，13岁明晓和12岁ELLA】今天都是全国格斗冠亚军了今天一早，钱校长带小明慧一起去广州参加新教育分享会！所以此时小女首度回国，参与广州教育分享会的事情，对外一直保密！\",\"url\":\"http://zhuanlan.zhihu.com/p/1919428393889399980\"},{\"slug\":\"2025-06-20-申请海外大学这个很简单的事情-我总听说各\",\"year\":\"2025\",\"title\":\"申海外大学本简单：中介吓你难，我已拿香港永居\",\"date\":\"2025-06-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"个人怎么弄，你成绩再好都不行，都必须听从她的建议，否则就是不行！不过呢，我也没有申请过海外大学，我说不算！我们还有超长的时间没有去香港，每次延签的时候才去的，‘甚至疫情中间，延期了很久才去！如果我不是已经拿到了身份，只是刚开始，看了下面的这个中介：我会不会很抓狂？一句话，不要相信自己，只想相信她中介就行了！所以：明年，为了避免被骗上当，我们海外留学回来的老师，亲自下场帮助学生们申请海外大学！\",\"url\":\"https://www.zhihu.com/pins/1919481093335278341\"},{\"slug\":\"2025-06-20-这样的儿媳妇谁要反正我不想要\",\"year\":\"2025\",\"title\":\"宁要老挝儿媳不要这种女儿：不会煮面恐被骗卖\",\"date\":\"2025-06-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"那么：这样的女儿谁要？如果面都不会煮的话-----会不会骗子也认不出来？所以：我家小女就不上清华了！不知道给谁的---为某个机器集团培养未来的工程师？我身边就有这样一位闺蜜，清华毕业，年薪50万，但直到30岁才学会煮面。“我以前觉得，只要学习好就够了，”她说，“直到去相亲，对方家长问我会不会做饭……”我反怼：“点外卖不就行了？商业转载请联系作者获得授权，非商业转载请注明出处。\",\"url\":\"https://www.zhihu.com/pins/1919503206662251407\"},{\"slug\":\"2025-06-19-回复英子同学-谢谢你的善良\",\"year\":\"2025\",\"title\":\"回复英子同学：谢你善良，9年前负气离国今已释怀\",\"date\":\"2025-06-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"9年前，我的确是抱有一股不平之气，而离开中国的！泰国的佛系，也慢慢融化了我，不再有不平之气，而是接受自己的因缘果报。我坏了利益集团的好事，当然欲望派的人，要出来拼命的诋毁我，甚至想杀死我都不奇怪！因为我太“坏”了---站在对面的立场上看的确如此！只要我的女儿需要我，我的弟子需要我，我的学生需要我，我就有继续去做教育的动力！好消息是：她在3年后，就可以击败同级别的男子世界冠军了！\",\"url\":\"https://www.zhihu.com/pins/1919172246108354450\"},{\"slug\":\"2025-06-19-网上的清黑攻击有两个特点-第一就是匿名\",\"year\":\"2025\",\"title\":\"清黑攻击两特征：匿名躲骂、编造离谱故事惑众\",\"date\":\"2025-06-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"会拿出各种稀奇古怪的故事，离谱的信息，来惑乱众生！比如说编造今日三校的英语教学问题很严重？我们的官方考试成绩在这里，抹黑英语教学？抹黑我们的武术：国家体育总局，都要为我们的队员“量身定制”裁判。她们只能编这种弱智的故事，说明一：清黑们已经丧心病狂！比如下面这位：她用自己“亲身经历”来造谣，弄得像是真的一样！2016年之后都是2.0教师（自己培养出来的学生）带突破班，根本就没有外聘外来教师！\",\"url\":\"https://www.zhihu.com/pins/1918949345341978263\"},{\"slug\":\"2025-06-19-这个民族会怎样对待自己的功臣\",\"year\":\"2025\",\"title\":\"这个民族会怎样对待自己的功臣？\",\"date\":\"2025-06-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"那么，从现在开始，再过九年：清黑又会帮助我们，创造出什么样的结果出来呢？发表时间:2016-11-2719：09：51文章类别:解读精英教育系列原文地址：我自认为我对中华民族是有很大功劳的。我会陈述我的所作所为，你们自己来评价一下，我做的这件事情，是不是利国利民的大功劳？某些道貌岸然，自以为真理在握的人，还跳出来对我求全责备，要求我为什么不这，为什么么哪，我为什么不更完美？\",\"url\":\"http://zhuanlan.zhihu.com/p/1919099567015716390\"},{\"slug\":\"2025-06-18-好久没有看啤酒了\",\"year\":\"2025\",\"title\":\"啤酒股大跌破位：燕京近破12元平台，惠泉放量大跌\",\"date\":\"2025-06-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"四五天前，燕京等啤酒股大跌，击破了燕京花费几个月时间走出来的上升通道。这段时间，啤酒主要的股票都在跌，我的账户市值损失也很大（假损失，不卖就没有亏）。惠泉也跌疯了，从14元多，跌到了11元多。因为现在这样子出货，主力没赚啥钱（当然，也不能这样说，情况跟现在类似的两年前，主力就是真的出货了。（燕京接近14元的时候，珠江接近12元的时候，我都出掉了一些货色，没有补回来的。\",\"url\":\"https://www.zhihu.com/pins/1918694818793621470\"},{\"slug\":\"2025-06-18-盗也有道-这篇文章很有意思-供大\",\"year\":\"2025\",\"title\":\"盗亦有道：日本红灯区老板绝不染指自家女孩\",\"date\":\"2025-06-18\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这个日本的妓院老板，绝不染指自家店的女孩？这就是绝对的理性和真正的善良，两者的做法是一样的。日本最大红灯区“飞田新地”的行规真相老板绝不染指自家店的女孩？日本最大红灯区“飞田新地”的行规真相中国的很多老板就是太蠢了，想要女人，外面找一个省心省事。把身边的下属女人弄过来上床，就会惹下无穷的麻烦。除非老板们太蠢了，就是要跟自己的事业过不去才会干这种蠢事。很多贪官，不就是被这些身边的情妇弄到倒下的吗？\",\"url\":\"https://www.zhihu.com/pins/1918624296890238002\"},{\"slug\":\"2025-06-18-阴阳对照-两对家长的不同命运\",\"year\":\"2025\",\"title\":\"阴阳对照：两对家长的不同命运\",\"date\":\"2025-06-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清一新教育今日学堂张清一原创文章刚刚才完成了一单家长的咨询！我算算：这家人，与昨天发文的|202305武##深圳家长，好像他们的两孩子是同学。今天咨询的家长，是原来突破班考不上挑战班的差生！两对家长，其实都一样的望子成龙！但他们的处理方式不同，因此孩子就有了不同的命运，一个用的是善良的方式，另一个用的是恶意和贬低的方式！基本上不花啥钱，也不需要家长很聪明，只要相信我给的方法，照章执行。\",\"url\":\"http://zhuanlan.zhihu.com/p/1918648665272223496\"},{\"slug\":\"2025-06-17-Ella公主和谭木兰零出场费倾情参与石家\",\"year\":\"2025\",\"title\":\"Ella公主和谭木兰零出场费倾情参与石家庄新教育分享会！\",\"date\":\"2025-06-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一新教育今日学堂张清一原创文章现场报道：【文上藤校，武夺冠军】石家庄分享会圆满闭幕！感恩山长和新教育基金会的大力支持，感恩清粉们的积极参与，感恩所有参与本次分享会的所有义工老师们的付出！不过我答应了国内的新教育家长们，团长们，如果他们举办活动，我会派公主们友情参与！已经举办的两次活动，就是派出了ELLA公主和谭木兰两人，在刚刚结束成都世运会选拔赛之后，就去参与的现场分享活动！\",\"url\":\"http://zhuanlan.zhihu.com/p/1918320032028530046\"},{\"slug\":\"2025-06-17-清黑以WC为例质疑新教育：要求晒成绩公开检验\",\"year\":\"2025\",\"title\":\"清黑以WC为例质疑新教育：要求晒成绩公开检验\",\"date\":\"2025-06-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"新教育一二十年了，走这个路线的孩子都有哪些成绩？这才是家长最关心的是的，如果追踪报道几个新教育毕业的孩子，做出了哪些社会成就就更好了@202305武防震深圳原来您是为守一学堂站队的呀？我们没意见的，您想站就站吧，你喜欢就好！2：声誉上，她一个人就站出来，面对成千上万人的质疑，都要挑战新教育的最高权威，在网络上掀起了一大波浪潮、引起了数万人的关注。我给你的这个新教育优秀学生的案例，你满意吗？\",\"url\":\"https://www.zhihu.com/pins/1918301585504723430\"},{\"slug\":\"2025-06-16-因为该事件已经涉及了冠军班和公主班-我让\",\"year\":\"2025\",\"title\":\"冠军班公主班事件：让学生思考如何高明过好人生\",\"date\":\"2025-06-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"这个思考题目，发给大家也思考一下，我建议你们也做做题目，不是站队谁，只是提高自己。做敌人，也要做让敌人尊重的对手，而不是只会恶心人的小流氓。以下是我给清迈基地的学生学习的课题任务布置：小人害人的五种手段：洞察小人的心机!我们不做小人，但必须了解小人。你们今天的学习任务，就是好好的阅读这篇文章，以及上一篇清黑的前世今生的文章，认真吸取教训。也许你们是清净派的人，你就应该对这些破坏者坚决地说不。\",\"url\":\"https://www.zhihu.com/pins/1917925255596467615\"},{\"slug\":\"2025-06-15-2025年-是一道分水岭……物质时代结束\",\"year\":\"2025\",\"title\":\"2025分水岭：物质时代落幕，精神时代来临，内外加速分裂\",\"date\":\"2025-06-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"以一种夸张和不可思议的速度和方式分裂，分裂的方式还毫无回旋余地。我也感觉我们内部的分裂，其实让我们团队更加和谐了。马上就要到18岁，就要决定未来人生发展方向的公主班，也在分裂中。专注精神的人，未必会缺乏物质，只是她们根本不关注物质，物质会自动的吸引过来。比如WC抛弃了精神追求和道德，追求物质。结果就是原来的500万一年，从此成为她的天花板。因此，未来就是追求精神者，物质也不会匮乏。\",\"url\":\"https://www.zhihu.com/pins/1917518324968985223\"},{\"slug\":\"2025-06-15-负能量败坏好运气\",\"year\":\"2025\",\"title\":\"负能量败坏好运：低能量者易与负信息共振\",\"date\":\"2025-06-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"玄学提醒：让运气不断好转的秘诀（非常灵验）玄学提醒：让运气不断好转的秘诀（非常灵验）我发现有些家长，喜欢到处去找新教育的信息，只要是什么消息，都要去看。殊不知---正能量的信息你们往往看不懂，负能量的信息，可能你一看就共振上了。因为你们的能量级别，本来就比较低，最容易和负能量共振。你成天去跟这些负能量共振，你说你还有啥希望？但他们得到的结果，会不是是失去了好运气呢？\",\"url\":\"https://www.zhihu.com/pins/1917515703604446637\"},{\"slug\":\"2025-06-14-转文-今年3月份的时候表哥打电话咨询我\",\"year\":\"2025\",\"title\":\"侄女厌学确诊中度抑郁：表哥求助，教育需先疗心\",\"date\":\"2025-06-14\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"最开始觉得是不是学习压力太大了，给她请了一周的假也没见好转，感觉侄女对什么事都提不起兴趣，每天就是坐在床边发呆。这可给表哥吓坏了，因此来联系我想看看有没有好的治疗方法。作者：装睡的我】这些家长真好，都不去黑体制教育怎么把人抑郁了。说实话，应试教育让我女儿去读书，还不要读到高中。Ella送她去读高中上学，严格要求她上课写作业，大概半年也要抑郁了，一定会跟上面的这孩子表现一样。\",\"url\":\"https://www.zhihu.com/pins/1917234249989333986\"},{\"slug\":\"2025-06-14-陆鸽-真搞不懂他们-几只鸟-是怎么觉得泰\",\"year\":\"2025\",\"title\":\"陆鸽吐槽：泰拳受众小？看拳击世锦赛参赛规模\",\"date\":\"2025-06-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这是拳击世锦赛的参赛人数：拳击世锦赛的参赛人数取决于国际拳击协会（IBA，原AIBA）的规则和具体赛事安排，不同级别和性别的选手数量会有所变化。每级别人数：约30-50名选手（通过洲际资格赛或直接邀请）。总参赛人数：约400-650人（男子）。女子拳击世锦赛体重级别：通常12个级别（如48kg、50kg、54kg、57kg、60kg等）。总参赛人数：约250-450人（女子）。\",\"url\":\"https://www.zhihu.com/pins/1917185569588503559\"},{\"slug\":\"2025-06-12-我在此重申-你们星球需要的是大规模的意\",\"year\":\"2025\",\"title\":\"与神对话启示：无力改变世界，只助愿转变者觉醒\",\"date\":\"2025-06-12\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"你们要重新唤起对所有生命的尊重，更深入地去了解所有事物的内在联系。】---与神对话我们没有能力做这种事情（去大规模的让别人意识转变），我们只能让小部分愿意转变自己的人，去意识到“事务的内在联系。她们做的事情这么丑陋，我们还要尊重她们吗？我说：如果我们想要成为光，但我们不知道光是什么。她们愿意牺牲自己去成为黑暗，让我们能够呈现光明，而她们还为此抛弃了名和利，以及你们认为光明的未来！\",\"url\":\"https://www.zhihu.com/pins/1916426301486630445\"},{\"slug\":\"2025-06-12-新教育各阶层五种不同等级学生的出路\",\"year\":\"2025\",\"title\":\"新教育各阶层五种不同等级学生的出路：\",\"date\":\"2025-06-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一个人，连自己的出路都没有安排好的人，出来说新教育的学生没有出路。下面我就用一个一个的事实，来让大家知道：新教育已经从顶级最优秀的学生，到最差的，就不会读书的学生，都安排了最好的出路！您如果对我们现在这样的新教育梯次层次的安排，还是感到不满意，当然没有问题。（6月4日）】正文：新教育学生的出路和安排！所以，攻击已经拿到这种档次成绩的学生，说以后没出路，我看就是睁眼说瞎话！\",\"url\":\"http://zhuanlan.zhihu.com/p/1916461540099491753\"},{\"slug\":\"2025-06-11-原明一班学生分享的-她喜欢的今日和不喜欢\",\"year\":\"2025\",\"title\":\"原明一班学生分享的：她喜欢的今日和不喜欢的今日！\",\"date\":\"2025-06-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"她不带功利的目的，分享了她喜欢的今日，也有她不喜欢的今日！雨纯：你当像鸟飞往你的山：我与新教育的15年我在雨纯文章后的评论中，也留言解释说明了原因：为何她原来喜欢的今日，会成为现在这样，她“不喜欢的今日”。我回复雨纯的信件：你分享了你喜欢的今日，也分享了你不喜欢的今日。（自由人）实在地说：我也不喜欢现在今日的突破班模式，我知道学生也不喜欢。跟你一样，我喜欢的今日，就是原来带你们明一班的今日。\",\"url\":\"http://zhuanlan.zhihu.com/p/1916055308234620971\"},{\"slug\":\"2025-06-10-你当像鸟飞往你的山-我与新教育的15年雨\",\"year\":\"2025\",\"title\":\"雨纯《与新教育15年》：真实记录明一班，无求无悔\",\"date\":\"2025-06-10\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"雨纯展示了一段真实，作者完全无所求的故事。不知道现在的家长们，是否还希望自己的孩子12岁左右就学【资治通鉴】？如果不是我还在，某人出来作恶，剩下的这些原来的伙伴们，大概谁都挡不住这种人的一击！当然-----对于雨纯来说，这些课程变成了她宝贵的回忆。所以我的课程是“有毒”的，骨子里面是“反体制”的教育。所以---现在我只好等冠军班的学生，攻克体制高考之后，再来学高级一点的东西了。\",\"url\":\"https://www.zhihu.com/pins/1915873010218403104\"},{\"slug\":\"2025-06-10-有人问-为啥总有人要黑你\",\"year\":\"2025\",\"title\":\"为何总有人黑我：九紫离火运社会剧变使然\",\"date\":\"2025-06-10\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"看到下面这个消息觉得有点意思：从2024年开始，我们就踏入了为期20年的九紫离火运。回顾历史发现，当九紫星掌权时（也就是九紫离火运期间），天下局势往往比较动荡，不只是国与国之间，还包括人与人、人与物质、人与自己的斗争。能量不同的人，就要分开，各自走自己的道路。实际上，我们吸引了各种想要获得成功的人涌来新教育。其中一种人，会想通过模仿我们的行为，来获取成功！很多人进入新教育，是因为看到了我们的成功。\",\"url\":\"https://www.zhihu.com/pins/1915757745409357074\"},{\"slug\":\"2025-06-09-今天离开贵州-我要回清迈了\",\"year\":\"2025\",\"title\":\"今天离开贵州，我要回清迈了\",\"date\":\"2025-06-09\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"在做完贵州助学的事情后，我和刘老师今天就离开贵州了。来之前，刘老师对这个地方的古老历史传说，充满了好奇和期待。我也需要回去，带公主和冠军班的学生们继续前进了，我们就不在国内晃悠了！毕竟---努力上进的学生们，才是我们真正需要关心帮助的对象，外面的风雨，风云，就仍由飘摇好了。我们不在意同时，ELLA公主和谭木兰去广西新教育分享会，今天也结束了。ELLA小公主也急于回到清迈去充电补电。\",\"url\":\"http://zhuanlan.zhihu.com/p/1915359697562764498\"},{\"slug\":\"2025-06-08-英子同学ε-´ο｀-唉\",\"year\":\"2025\",\"title\":\"劝英子别理某人：狗咬人无需讲理，只作案例提醒\",\"date\":\"2025-06-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"我如果文章会写到她，只是拿她做案例，提醒我们的清粉！孩子们调查了，发现她居然拥有100多个水军的小号。我看你文章中，这人还天天讲【真实】，似乎她是捍卫真理的化身一样！如果仅仅看你转发的这些文字，我对她依然有好感！你对她的评价真的很准：【你弱的时候，卑微胆小无法选择，就像匍匐在地上的蚂蚁一样无助。你强的时候，撑破了整个行业，就想火山喷发一样火热和炸裂。她一个人这样玩，我都担心她身体支撑得住不？\",\"url\":\"https://www.zhihu.com/pins/1915178942245078761\"},{\"slug\":\"2025-06-08-我在贵州农村-与一群军训的孩子打架\",\"year\":\"2025\",\"title\":\"我在贵州农村，与一群军训的孩子打架\",\"date\":\"2025-06-08\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我们这次，一起去了贵州的一个小村庄，是一个具有很长历史的文化遗迹景点。据说是一些有心人，专门成立一个少年军校，来照顾留守孩子的，有一个四合院可以接待客人，于是：我们就住在这里了！如果这里有想要当冠军，去为国争光的孩子，可以选一个人，让家长捐助去国外上国际学校，以后去打冠军，18-19岁去上国外排名顶尖100的大学！推荐优秀学生去打冠军的推荐人，基金会还有一万元的推荐费，我愿意把推荐权转让给他。\",\"url\":\"http://zhuanlan.zhihu.com/p/1915076868647938041\"},{\"slug\":\"2025-06-08-这些孩子-据说是几百年前一个历史名人的后\",\"year\":\"2025\",\"title\":\"滇黔古村寻访：历史名人之后隐居边地，传承犹存\",\"date\":\"2025-06-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"因此我和刘老师都想来看看----几百年下来，这个家族的”传承”特点。据说还有一只李姓王室的成员避乱来生活的一个村，跟贵州这个村有相似之处。我去过哀牢山的这个村，也和贵州这个村一样--这些皇室贵族之后，与普通人差不多。我也没听说这里几百年来，出了啥有出息的人。但我相信：如果几百年前，这里他们的老祖宗设立的是一个顶尖的教育平台，我相信：这个地方，今天就是中国的哈佛耶鲁。\",\"url\":\"https://www.zhihu.com/pins/1915139762802627853\"},{\"slug\":\"2025-06-07-家长安然-感谢静慧学校的大爱\",\"year\":\"2025\",\"title\":\"家长安然致谢静慧学校：叛逆孩子被爱唤醒立目标\",\"date\":\"2025-06-07\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我的孩子曾经是一个大家眼里很叛逆的孩子，喜欢用情绪、赌气惩罚自己和身边人。虽然在参加突破班选拔营的时候落选了，静慧校长却没有放弃我的孩子，在孩子离开前专门安排了跟落选的孩子沟通，鼓励孩子努力考挑战班。孩子被静慧校长的爱深深打动了，从此有了的榜样，有了目标，有了动力。回家后告诉我他一定一定要考无名塾的挑战班。我们家庭由衷的感谢静慧校长，如果不是您的大爱，孩子的人生轨迹就不会是现在这样。\",\"url\":\"https://www.zhihu.com/pins/1914707024526177619\"},{\"slug\":\"2025-06-06-明晓-红方-在成都世运会预选赛上的比赛\",\"year\":\"2025\",\"title\":\"明晓世运会预选赛红方出战：我宁选其实力为国而战\",\"date\":\"2025-06-06\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明晓（红方）在成都世运会预选赛上的比赛（...今天的最后一轮比赛结果出来了------。如果是让我来选拔应战世界各国冠军，为国而战的人，我肯定要选红方。但红方昨天已经被判输了，不再可能入选世运赛。蓝方昨天居然还战胜了谭木兰（水平与明晓相当），在我们看来，她根本就不是一个合格的拳手，就不应该走上这个为国选材的拳台。耿春蕾还有点样子，虽然明显比明晓差。这场比赛，无论胜负，两人都进不了世运会的正选。\",\"url\":\"https://www.zhihu.com/pins/1914295124436979845\"},{\"slug\":\"2025-06-05-今天上午-我和刘老师去看中国国家自由搏击\",\"year\":\"2025\",\"title\":\"观国家队自由搏击选拔赛：ELLA全场零分我大笑\",\"date\":\"2025-06-05\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"特别在ELLA打比赛的时候，我都大声笑出声来了。我让木兰们尽快把ELLA这场比赛放到武道馆的视频上，让我们都可以看看木兰们是怎么输的！3：为啥我好几次明明用腿击中她的头部，应该是得两分的，裁判像是没有看到一样？我在场上看比赛的时候，使劲的笑，不是因为生气（刘老师有点生气），我真的忍不住笑。今天上午的第一轮比赛，我们全体队员已经“全军覆没”，但我一点也没有怪木兰们，她们的确不完善，但她们已经尽力了。\",\"url\":\"https://www.zhihu.com/pins/1913966516346545621\"},{\"slug\":\"2025-06-05-惠泉走势分析-今天惠泉把昨天的涨幅全部跌\",\"year\":\"2025\",\"title\":\"惠泉回吐昨日涨幅：出货成功，主力资金充裕待战\",\"date\":\"2025-06-05\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天是单边上涨走势，没有出货的痕迹，今日是出货走势，应该是把昨天的拉升筹码，今天都全卖出去了！主力现在的手中资金充裕，随时会发动下一轮战役！我原来最擅长跟随主力而动，这样能够获取大量的利润，但现在我没啥精力去跟庄了，所以---可能会便涨边卖了。因为现在这个样子，显然进入了投机区域，不再是投资了，不是主力长期持有的逻辑了，因此：见利就走吧，关键就是你的“利”的标准有多高了。\",\"url\":\"https://www.zhihu.com/pins/1914039009207908349\"},{\"slug\":\"2025-06-05-成都世运会自由搏击选拔赛-Ella-v\",\"year\":\"2025\",\"title\":\"ELLA世运会选拔战败北视频：规则临时改动压制其优势\",\"date\":\"2025-06-05\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"她今天晚上再次打了一场比赛，针对ELLA的优势（连续攻击），临时裁判又换了规则，就是双方碰一下就强制分开，不让Ella的优势发挥。孩子们还反应：有一个边裁相对公正一点，每次ELLA击中，都会示意主裁判，ELLA得分，但主裁判完全无视。我只是为国家着急操心----你们选出来ELLA的对手这种水平。另外孩子们还提供一个让我很生气的消息：自由搏击的世界赛，身体是不带护具的，昨天一直都说不带护具。\",\"url\":\"https://www.zhihu.com/pins/1914104606998368569\"},{\"slug\":\"2025-06-04-1640Q冯敬东石家庄-山长\",\"year\":\"2025\",\"title\":\"惠泉连涨近14元：陪木兰训练未看盘，从容应对\",\"date\":\"2025-06-04\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天下午陪木兰们训练去了，她们明天打预选赛。刚才看你的信息，去看惠泉走势，居然就快14元了。我一直在用接近14元的燕京换，用差价只有六毛钱的珠江换12元前后的惠泉，都换历史新高仓位了。正在想自己是不是有点蠢，已经第二大股东了，还在不断加仓，会不会加仓到要公示。今天居然涨了最高9%，收盘也在7%以上。显然，我的账户又创新高了（还没去看——）！如果我现在卖掉----半年班就看不见我的。\",\"url\":\"https://www.zhihu.com/pins/1913711280667222650\"},{\"slug\":\"2025-06-04-成都HCK-刚刚看了聪颖发的文章-升学途\",\"year\":\"2025\",\"title\":\"成都HCK荐聪颖文：自顾不暇者难为他人安排人生\",\"date\":\"2025-06-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"成都HCK:刚刚看了聪颖发的文章，升学途径和英语教学确实是有很多可以参考的地方，山长可以看一下我@1125HCK成都如果一个人，对自己的大婚，事业，对自己生活道路的安排，都是如此的混乱不堪。她的确想要成功，结果却是毁天灭地毁自己，救都没法救！这种人，你居然相信她可以为您的孩子安排一条更好的人生道路吗？您居然还想让我去跟她去“学习”，怎样才能为学生安排更好的生涯职业路径吗？\",\"url\":\"https://www.zhihu.com/pins/1913554243681485999\"},{\"slug\":\"2025-06-04-英子同学留言-除了她说新教育的什么带班和\",\"year\":\"2025\",\"title\":\"回应英子同学：老张是新教育罪人之说系情绪化控诉\",\"date\":\"2025-06-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"这个要有专门的老师进行整理出来和说明教学结果。但是她的这次立意更大了：上一篇是今日和老张是她人生里的绊脚石和罪人。我对英子同学的回复：她对自己感情历程的总结：上一句话，是我逼她谈恋爱！但可以更简单进行一个对比，就是第一篇：老张创立的新教育是人类的毒瘤！这一篇是：老张背叛了新教育，她才代表新教育的“初心”和本真。两篇最后的结论都是：来我聪颖求真社吧，这里才是新教育的天堂！\",\"url\":\"https://www.zhihu.com/pins/1913619007937950282\"},{\"slug\":\"2025-06-03-感谢身边的精彩和善良-也感谢所有的黑-并\",\"year\":\"2025\",\"title\":\"感谢身边的精彩和善良，也感谢所有的黑，并衷心祝福王丁之合百年到老，吉祥如意！\",\"date\":\"2025-06-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天，两个木兰刚从土耳其回国到了成都，与ELLA公主汇合。她们首次参加世界锦标赛，就和世界冠军交手，虽然败了，也是她们的光荣！这个冠军非常的强悍，在明晓之前和明晓之后的比赛，她全都KO了对手。我在训练基地给ELLA示范如何才能有效攻击明晓明晓已经稳获世界运动会资格，她来帮ELLA陪练拿到新的入场券明天谭木兰才能来参加选拔赛，她的主要对手是耿春蕾。失去了泰拳入选资格的谭木兰，应该也不会服输的。\",\"url\":\"http://zhuanlan.zhihu.com/p/1913337090525108156\"},{\"slug\":\"2025-06-02-刚刚和刘老师去早市上转了一下-觉得四川不\",\"year\":\"2025\",\"title\":\"成都早市：车厘子10元/斤比百元货甜，ELLA接武管中心通知\",\"date\":\"2025-06-02\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"满街的车厘子（大樱桃），才10块钱一斤。黄黄的琵琶果，更是价格低到不可思议：才一两元一斤。ELLA也接到国家武管中心的通知，来成都参选了。不过如果打得赢的话，去代表国家作战也行！她是她不着急参赛，她知道自己还有很多需要完善的地方，来陪跑师姐很荣幸！过几天她还要去某分享会，把自己作为礼物送出去！感恩自己的一切遇见，赞赏一切遇见，并随时为他人的需要服务！甚至感恩别人参与让自己有机会付出的活动。\",\"url\":\"https://www.zhihu.com/pins/1912811839844254129\"},{\"slug\":\"2025-06-02-挺奇怪的-已经停战了\",\"year\":\"2025\",\"title\":\"停战疑云：攻击能量骤停，下午又起波澜\",\"date\":\"2025-06-02\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"敌方的攻击能量，原来这段时间一直激动不己，喧嚣沸腾的战场上，攻击波几乎就是突然之间全都停下来了。就在今天下午，我刚刚发完处理小钟瑞当年情事的历史回忆录之后，我和刘老师就出去吃中饭了（不好意思，我们不按点吃饭的）。但突然感到一股巨大的攻击能量，有很强的愤怒，向刘老师扑来。晚上我就发现，战场上的敌方人员，居然完全的撤退消失了。不就是我写了一个小女孩的爱情故事发出来了吗?……\",\"url\":\"https://www.zhihu.com/pins/1912991513702539292\"},{\"slug\":\"2025-06-02-清一学员群郑阁东莞-今天看到丁和王已经在\",\"year\":\"2025\",\"title\":\"学员群热议：丁王奖学金源于自身优秀，与山长无关\",\"date\":\"2025-06-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"（以下学员表达的气愤和骂人之词略去，我们是好人，我们不骂人！）@202305郑阁东莞她们这话都能说的出来？她们的确很优秀，当年（2010年的黑茶王，就是夏令营的第一名，她原来在体制内就是优等生，各种表现都很突出--除了身体弱，不爱运动，人懒以外。比当初的我自己的创业办今日学堂更成功，一年就赚500万，比清一办学10年的收入，证明“江汉做题家”的优秀卓越，真不是吹的！\",\"url\":\"https://www.zhihu.com/pins/1912839523169178494\"},{\"slug\":\"2025-06-01-ella李华丽-流出决定流入-是宇宙的\",\"year\":\"2025\",\"title\":\"托利语录：流出决定流入，丰盛意识吸引丰盛\",\"date\":\"2025-06-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"如果你从内在的丰盛意识出发行动，生命会以同样的方式回应你。这不是道德说教，而是能量层面的共振。之所以能这样源源不断地向外流出丰盛，正是因为山长刘老师内心的丰盛和富足；同时，丰盛的流出，必将还以山长丰盛的流入。如果她是这样的可怕流入，那她必定不为人知地对这个世界做出了可怕的流出。流出决定了流入，根据这个行为的恶劣性，我们可以很确定地知道，她最终的结果呈现，一定和这个流出的恶劣性相当。\",\"url\":\"https://www.zhihu.com/pins/1912547341950486086\"},{\"slug\":\"2025-06-01-妙方关注我的人你眼中的别人正好就是自己…\",\"year\":\"2025\",\"title\":\"你眼中的别人正是自己：黑茶自曝其短证其失败\",\"date\":\"2025-06-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"她说山长谋取利益其实就是在证明自己有在谋取利益的不归路上……稍有头脑的家长思考一下，山长在财富上还需要谋取利益办教育吗？当你母亲告诉我你要来上课，我心里只有一句话：你儿子来上课，管我什么事啊？这也是这一家人送给我们所有家人的珍贵礼物🎁，感恩她们，好之为之……\",\"url\":\"https://www.zhihu.com/pins/1912554192033264186\"},{\"slug\":\"2025-06-01-端午节昨天过了-但我们一家都没有去过节\",\"year\":\"2025\",\"title\":\"端午一家四口分处三国：宾馆吃30元饭，老妈笑不如民工\",\"date\":\"2025-06-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"我和小刘在中国，因为我们已经提前陪老妈和弟妹一家过节吃粽子，今天她们一家去农家乐游玩一天。我们没时间去陪一家子人玩，就在宾馆里面处理公务，我们两人一天总共消费了30元在吃饭上，老妈听说了就嚷，说你们两个，过得连民工都不如！在老挝磨丁的大女，正在忙于带班准备SAT。无论什么节日，对我们来说只是普通的一天！今天，我已经飞到了成都，在体育大学住宿下来，陪同木兰们参加体育总局组织的”世界运动会“预选赛了。\",\"url\":\"https://www.zhihu.com/pins/1912658501311923987\"},{\"slug\":\"2025-05-30-在鲁健访谈中-福耀科技大学校长王树国表示\",\"year\":\"2025\",\"title\":\"王树国反对批量生产学生：与新教育理念不谋而合\",\"date\":\"2025-05-30\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"在鲁健访谈中，福耀科技大学校长王树国表示，他反对把学生当成产品，按照一个模式批量生产，“用一个模式考核培养学生的时代过去了。他常对老师讲要尊重学生，“我们更多是一个协助者，是一个教练，是一个助理，我们和孩子们一起来探索未来。希望王校长能够给中国大学带来一股新风，我唯一有点遗憾的，就是太花钱了---50个学生，每年要花8亿元。我清迈的一百来个学生，每年我只要投入几百万运行费用就够了。\",\"url\":\"https://www.zhihu.com/pins/1911708361914835769\"},{\"slug\":\"2025-05-30-张清一-断子绝孙的结果-哪些人是有罪的\",\"year\":\"2025\",\"title\":\"张清一：断子绝孙的结果，《哪些人是有罪的》？\",\"date\":\"2025-05-30\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"可是，我有幸接触到中国先富裕起来的一群人，说实话，我看他们还不如泰国的小百姓更快乐自在！我们这一辈人，有四分之三的概率，死后想转世只能去做畜生了，哪里还能做人！但将来，显然只有四分之一的人，才有子孙后代了。剩下的四分之三的人，你们不就是断子绝孙了吗？对古人来说，断子绝孙，是对一个人最恶毒的诅咒，现在这个恶咒，就正好应在我们这一代人的身上！莫言在东亚文学论坛上的演讲，演讲题目：《哪些人是有罪的》。\",\"url\":\"http://zhuanlan.zhihu.com/p/1911531057561474558\"},{\"slug\":\"2025-05-30-莫言在日本的发言-一百多年前-中国的先\",\"year\":\"2025\",\"title\":\"莫言：科技与贪欲结合是人类最大危险\",\"date\":\"2025-05-30\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"但时至今日，我感到人类面临着的最大危险，就是日益先进的科技与日益膨胀的人类贪欲的结合。在人类贪婪欲望的刺激下，科技的发展已经背离了为人的健康需求服务的正常轨道，而是在利润的驱动下疯狂发展以满足人类的——其实是少数富贵者的病态需求】。莫言最后的观点是【我们的文学真能使人类的贪欲，尤其是国家的贪欲有所收敛吗？因为，这不仅仅是救他人，同时也是救自己。最近20年我搞教育，曾经以为教育能够改变人！\",\"url\":\"https://www.zhihu.com/pins/1911700164709687851\"},{\"slug\":\"2025-05-29-燕京啤酒昨天创历史新高\",\"year\":\"2025\",\"title\":\"燕京创历史新高：14.34卖出部分，后市可期\",\"date\":\"2025-05-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我昨天就卖了一部分燕京出去，价格是14.34-14.35元左右，珠江也卖了一点出去，卖出价格是11.80以上，我对此价格非常的满意。虽然从盘面上看，燕京珠江都没有主力出货的痕迹，说明后市可期，新高之后，还会新高的，应该继续持仓待涨。后来居然打到了7元多的价格，回到七年前的价位。因此现在虽然价格重回昨日，但我的啤酒持仓却多了很多。啤酒虽然我知道会涨，但昨天卖出后，我还是没有买回来。\",\"url\":\"https://www.zhihu.com/pins/1911542771782755500\"},{\"slug\":\"2025-05-28-我之前一直认为成王败寇-历史是由胜利者\",\"year\":\"2025\",\"title\":\"输家比赢家更会说话：莫迪式嘴炮难掩教育无果\",\"date\":\"2025-05-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"做教育的人，就拿教学结果来说话不就行了？可看了印度的操作才知道，输家比赢家更会说话。把时间花在打嘴巴架上，不就是莫迪老仙正在玩的架势吧？居然可以把家长的钱拿了，但活自己还不用亲自去干，学生都见不到她。自己用个名字来忽悠家长就收钱，学堂找几个甚至根本没有上过正规新教育的小帮工来带班就成。特别是通情达理的家长，居然也不验证教学结果。不像我们大傻子一个，去搞SAT和冠军赛，都得打出来成绩。\",\"url\":\"https://www.zhihu.com/pins/1911189409367322944\"},{\"slug\":\"2025-05-28-昨天晚上陆鸽与排名世界第一的土耳其拳手比\",\"year\":\"2025\",\"title\":\"陆鸽点数负世界第一土耳其拳手止步八强：主场再战\",\"date\":\"2025-05-28\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"打满后点数负，止步八强。我看场面上是陆鸽一直在追着对手打，不过被打的人最终裁判判决点数赢了。陆鸽赛后总结说自己没有打好，自己还有很多需要提高的地方。我说：你们两人，在8月份世界运动会应该还会再打一次的。今天晚上，明晓就要应战连续两届的世界冠军拳手了。我对孩子们说的就是---最终的结果不重要。上场后的表现，让自己赛后不留遗憾就行了！（拿不拿奖牌不重要，打不打得出训练的水平才重要）……\",\"url\":\"https://www.zhihu.com/pins/1910963090071200833\"},{\"slug\":\"2025-05-26-陆鸽今晚16晋8的比赛首战获胜-第一回合\",\"year\":\"2025\",\"title\":\"陆鸽16晋8首战KO对手：晋级八强，耿春蕾止步16强\",\"date\":\"2025-05-26\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"陆鸽今晚16晋8的比赛首战获胜，第一回合就用连续拳腿攻击KO了对手，对手完全无法适应陆鸽的攻击，第一局快结束的时候被重击腹部无力再战而结束比赛！陆鸽成功晋级八强，两天后打争夺半决赛的比赛！耿春蕾今晚首战就输了，很遗憾止步16强比赛，她到国外就没有她在国内比赛的狠劲了。今天最暴冷门的就是陆鸽最担心的三届IFMA泰拳世界冠军，居然被芬兰拳手第一局就三次读秒TKO结束四冠的历程。\",\"url\":\"https://www.zhihu.com/pins/1910479094140866741\"},{\"slug\":\"2025-05-25-2017年-我首次买入6元多7元的燕京时\",\"year\":\"2025\",\"title\":\"2017买燕京6-7元时万科20元：今燕京近14万科跌至6元\",\"date\":\"2025-05-25\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天，燕京快14元了，万科呢：跌到六元多了。当年姚正华20元以上买入万科，花了几百亿成为第二大股东，结果被王石等人骂成是“野蛮人”，认为他不配拥有万科。后来逼他退股走掉了，深铁花了几百亿接下了他的股份。我猜：假如我拿一两百亿资金去买入燕京，肯定会被骂成野蛮人的吧？万科兢兢业业的做了几十年，为百万计的家庭满足了住房的需求。万科把几十年赚的钱全部亏光了，就是因为借了钱。\",\"url\":\"https://www.zhihu.com/pins/1910109602927875162\"},{\"slug\":\"2025-05-25-新教育电影体验课结束-部分学员分享心得\",\"year\":\"2025\",\"title\":\"新教育电影体验课结束--部分学员分享心得：\",\"date\":\"2025-05-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"4.深刻感受到新教育的价值，将一个普通的小女孩培养成为身价一个亿的女孩。从昨天小明慧的引导课和今天下午无名孰校长的讲课深感新教育的力量，认识到选对教育的重要性，选对明师的重要性。现在可算明白了，为啥新教育的孩子小小年纪就能看透人心，他们天天拿电影当人体解剖图看，能不成精吗？行知团杨##心得体悟：大家好，感谢山长，感谢新教育给机会参加这次电影课，我是行知的家长，也很幸运，作为候补生被录取了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1908564220477436209\"},{\"slug\":\"2025-05-24-今天土耳其世界锦标赛首日开战\",\"year\":\"2025\",\"title\":\"土耳其世锦赛首日：陆鸽明晓抽签轮空，直入16/8强\",\"date\":\"2025-05-24\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"不过我们两位木兰今天的运气很好，抽签全轮空了。两天后首战，只要能够击败对手，就进入半决赛了！这样，明晓世界锦标赛的第一战，居然是直接与连续两届的世界冠军对战，有点意思！木兰们在香港东亚锦标赛已经与台北队交过锋了，结果是完胜，这一次应该不会有意外，首战胜利闯关，进入8强应该没问题，就看她第二战要打谁了。所以---两个木兰虽然是首次参赛，但夺冠之路都必须踏着连续几届的前任世界冠军，才有可能前进！\",\"url\":\"https://www.zhihu.com/pins/1909738966309122821\"},{\"slug\":\"2025-05-23-两名中华传武太极的传人-清一木兰今年代表\",\"year\":\"2025\",\"title\":\"清一木兰首代表国家出战泰拳世锦赛：对决71国冠军\",\"date\":\"2025-05-23\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"其中54公斤级的对手，已知是连续三届的泰拳世界锦标赛冠军，注定是强者与强者的对抗。五月22日-31日，连续八天的比赛，近千拳手的盛会。如果木兰们能够打到最后，将打破中国格斗历史上一直没有女子泰拳世界锦标赛冠军的遗憾记录。2025土耳其泰拳世锦赛预告2025土耳其泰拳世锦赛预告……\",\"url\":\"https://www.zhihu.com/pins/1909194427769021156\"},{\"slug\":\"2025-05-23-美国政府禁止哈佛大学招收国际学生-留学生\",\"year\":\"2025\",\"title\":\"美国政府禁止哈佛大学招收国际学生，留学生对美国经济贡献大么？特朗普想要让教育行业普遍“关税化”吗？\",\"date\":\"2025-05-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"万万没有想到：特朗普真的特别不靠谱，居然干出这种事情来。哈佛大学国际学生和学者来自140多个国家，为哈佛大学乃至整个国家带来了巨大的财富。哈佛大学回应称：“这一报复性行动可能对哈佛社区和我们的国家造成严重损害，并损害哈佛的学术和研究使命。”根据哈佛大学的数据，截至2023年秋季学期，国际学生占哈佛学生总数的27%以上。而且----特朗普的禁令，不是不让招生，而是让现有的学生统统赶走。\",\"url\":\"https://www.zhihu.com/question/1909157748622464095/answer/1909207327279681583\"},{\"slug\":\"2025-05-22-一个纪录片-抢矿-来了一百二十多号黑社会\",\"year\":\"2025\",\"title\":\"抢矿纪录片：一狠人以炸药步枪追杀120黑帮，9死48伤\",\"date\":\"2025-05-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这大哥，用开矿的炸药做诡雷，外加一把栓动步枪，连炸带打，追着一百二十多个黑社会杀。金融市场上，多的是矿，甚至价格还低的离谱。你要有眼光，自己买下来，长期持有就行了。多年前我就买了煤矿，十几元买的中国神华，年年高分红。现在我也在买矿呢，我总觉得美国不靠谱，美元崩溃后，矿价格不飞天才怪。所以---看到便宜的矿，就买一点存起来，不跟人抢的。所以我总是教孩子：要么你们好好学习，读书，练脑子。\",\"url\":\"https://www.zhihu.com/pins/1908958100997769074\"},{\"slug\":\"2025-05-22-陆鸽明晓经过两天的飞行转机-今天已经从北\",\"year\":\"2025\",\"title\":\"陆鸽明晓抵土耳其安塔利亚：出战泰拳世锦赛，官方无教练随行\",\"date\":\"2025-05-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"佳慧和谭木兰一天后也从广州出发到达了土耳其。我也给她们发路费，去做拳场助理。因为官方就只派了三名官员做领队，连真正的教练都没有随行。懂行的人一个都没有，孩子们一切都得靠自己！选手们的安排，是22日报道，23日称重，后天（24日）正式开打，因为人数多，会有三个不同的赛场同时开打，每天都不停。陆鸽已经查到了对手的名单，其中之一是泰国54公斤的迦南隆拳场老拳手，已经获得过三次IFMA世界冠军。\",\"url\":\"https://www.zhihu.com/pins/1908807763489986067\"},{\"slug\":\"2025-05-21-中国家族企业已经发展了快40年了-都已经\",\"year\":\"2025\",\"title\":\"中国家族企业已经发展了快40年了，都已经到了传承的节点了，欢迎讨论-企业怎么选好接班人？\",\"date\":\"2025-05-21\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"前几天，浙江一位拥有1400名员工的企业家夫妻，两人一起来找我咨询，希望我帮助解决两大问题：第一个就是自己的家族传承问题。因此，他创业几十年的企业，很想知道怎样传承下去。第二个就是企业的人才培养问题，他的企业一路走来很不容易，目前产品已经大量出口国外。如果自己的孩子并不热爱企业，家长把企业将来交给孩子，无论对企业还是对孩子，都是不公平的，已经出现过很多老板退休，把企业交给孩子，结果孩子败家。\",\"url\":\"https://www.zhihu.com/question/278903073/answer/1908458989752149161\"},{\"slug\":\"2025-05-21-厂二代福音-中小企业家族传承和企业管理\",\"year\":\"2025\",\"title\":\"厂二代福音：【中小企业家族传承和企业管理委培班】首次开设\",\"date\":\"2025-05-21\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"前几天，浙江一位拥有1400名员工的企业家夫妻，两人一起来找我咨询，希望我帮助解决两大问题：第一个就是自己的家族传承问题。但中小企业想要吸引年轻一代的顶尖人才加盟企业，难度也不小。我说：其实这两个问题，可以放在一起来解决：第一就是家族传承：企业家如果有自己的企业，家族传承就不仅仅是血缘的传承，也是事业的传承。所以：我们决定今年9月份，就额外地增加一个“中小企业家族传承和企业管理专班”。\",\"url\":\"http://zhuanlan.zhihu.com/p/1908181997760803890\"},{\"slug\":\"2025-05-21-日本就业现状-知道为啥我让学生\",\"year\":\"2025\",\"title\":\"日本招工荒：企业天天去大学挖人，家长还死卷高考\",\"date\":\"2025-05-21\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"还在中国死卷高考。【现在日本的很多公司全都招不满人，大量的岗位空缺，甚至就连某些核心高薪岗位也没人愿意干，为了解决这个问题，老板和HR急得团团转，每天醒来的第一件事就是赶紧去大学里面挖人，这就是如今日本就业市场的现状，企业和求职者的地位完全反转，老板必须捧着年轻人上班，否则别人第二天分分钟就提桶走人。】照片：日本负责招聘的人跪求人才入职。甚至只要懂日语，外籍人都可以当公务员。\",\"url\":\"https://www.zhihu.com/pins/1908620969326671666\"},{\"slug\":\"2025-05-19-公主塾为什么第三语言学日语\",\"year\":\"2025\",\"title\":\"公主塾为何第三语言学日语：赴日就业缺口大，别死卷高考\",\"date\":\"2025-05-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"简单说，就是为了就业----日本产业流出后，“就业冰河期”持续了十余年，后来日本的劳动力逐渐短缺，甚至去年开始还出现了所谓毕业生供不应求的新闻。而中国正好相反----产业流出带来的严重就业困难，将在未来的十几年内影响青年一代的就业。中国家长们醒醒吧，别在国内死卷了。换个方向就海阔天空。选择善于第三语言教学的新教育来说，就业道路比国内卷轻松得多！\",\"url\":\"https://www.zhihu.com/pins/1907844928412844141\"},{\"slug\":\"2025-05-19-央视主持人儿子常春藤毕业梦断的教训\",\"year\":\"2025\",\"title\":\"央视主持人儿子常春藤毕业梦断的教训！\",\"date\":\"2025-05-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"中国的家长热衷于【考常春藤】，以为考上常春藤就一切ok。如果一个著名央视主持人，社会资源应该相当的丰富。他都不能帮自己常春藤毕业的儿子找到工作，你们这些普通老百姓。花大钱去鸡娃，以为考上常春藤就走上了人生坦途大道，会不会太天真了？2013年，郎永淳决定送14岁的儿子郎俣，前往美国高中“深造”2019年，儿子成功考上了美国著名院校哥伦比亚大学入读本科，这是常春藤盟校之一！\",\"url\":\"http://zhuanlan.zhihu.com/p/1907846474584295035\"},{\"slug\":\"2025-05-18-富二代孩子如果有赌性-多少钱都不够赌的\",\"year\":\"2025\",\"title\":\"富二代有赌性多少钱不够败：曹达华一夜输光3亿街产\",\"date\":\"2025-05-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"感觉型孩子败家无底线：案例---多年前，澳门输的最多的那个应该是曹探长曹达华，好像是一晚上还是几个晚上加起来输光了家产，包括在香港的一整条街的所有资产，当时总值3个亿，放在现在值1500亿，何赌王当场给他发了张终身免费吃喝拉撒卡……\",\"url\":\"https://www.zhihu.com/pins/1907505027112764957\"},{\"slug\":\"2025-05-17-当代孔乙己众生相-一文钱吃茴香豆再现\",\"year\":\"2025\",\"title\":\"当代孔乙己众生相：一文钱吃茴香豆再现\",\"date\":\"2025-05-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"当年是高二最后一年才分班，班上成绩差的学生，平时班级排名靠后的一批差生，老师估计考不上大学，就要求转去文科班上学。相反，班上语文成绩最好的一批学生，都是全科学霸，谁都没去读文科。后面我工作后再度备考，把大量时间用来学英文，终于第二次考研，以五个单项成绩第一的高分，考研成功，进入了武汉大学读哲学专业研究生！下面是一些体制内文科生毕业后卖惨的生活图景，让我想到了孔乙己吃茴香豆！\",\"url\":\"http://zhuanlan.zhihu.com/p/1907115026562676170\"},{\"slug\":\"2025-05-17-新闻-基金调仓\",\"year\":\"2025\",\"title\":\"张坤三年亏12%跑输基准：待降薪名单一人拖累全司\",\"date\":\"2025-05-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"易方达也很务实，直接把张坤副总位子拿掉了，美其名曰专心管理基金，潜台词就是你再不能把收益做上来，下一步就彻底滚蛋吧。所以，最近公募新规引发调仓的传闻不仅真实可信，影响甚至可能远超人们预估】看样子，我去年总收益45%的业绩，算是很亮眼的成绩了！说到基金调仓，我看了一些资料，知名基金如淡水泉等等大幅调仓。我看后是一头雾水的---我买的股票，都没有进入这些基金调仓热门股榜单。\",\"url\":\"https://www.zhihu.com/pins/1907127934759727722\"},{\"slug\":\"2025-05-16-转-一曾经的朋友父母找到我爸-想让我劝劝\",\"year\":\"2025\",\"title\":\"劝赌反被骂：演示出千原理后朋友赢三十万，全家怪我堵财路\",\"date\":\"2025-05-16\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我给他演示了一些出千原理，告诉他不可能赢的收手吧。朋友听了，表示再也不赌了。朋友一家都很感激我。直到半个月后，朋友再次手痒难耐去赌场又开了几把。这次他运气很好赢了三十多万。然后，朋友一家都骂我丧良心堵了他家财路。朋友父母骂得尤其大声和难听。很多国人大致上就这思维和毛病的。吃了亏就凄凄惨惨的装可怜。占了便宜就神气十足的装大爷，谁都瞧不上。这种人就是毫无理性之人，你怎么帮呢？\",\"url\":\"https://www.zhihu.com/pins/1906846463654343410\"},{\"slug\":\"2025-05-15-一个家长-如果只会赚钱给孩子用-但如果不\",\"year\":\"2025\",\"title\":\"不合格家长：只给钱不开辟上升通道，孩子不接力阶级也该弃\",\"date\":\"2025-05-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一个孩子，他如果只会花钱，却不去努力跟随父母的阶级，努力保证自己的阶级不至于降低，更不去努力借助家族资源，设法尽力提升自己的层次地位，不去帮助家族提升阶级地位，这孩子也是不合格的！应该丢掉不要！\",\"url\":\"https://www.zhihu.com/pins/1906375138322145383\"},{\"slug\":\"2025-05-15-今日操作-午后卖出了38万股燕京-大多数\",\"year\":\"2025\",\"title\":\"卖燕京38万@12.95换惠泉41万@11.55：价格倒挂即换\",\"date\":\"2025-05-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"换入惠泉41万多股，大多数的买入价格是11.55-11.56元。换股理由：燕京比惠泉高不太正常，应该倒过来才对。正常的燕京，应该低于惠泉价格2元左右。燕京在今天操作账户中，已经跌出了长期占领的总持仓第一位置，目前持仓第二位。惠泉的持仓总量，在该账户仅占第五名，已经是十大股东。本账户的第一持仓股，预计半年报后会进入十大！属于燕京大涨后，想要换进来的，计划长期持仓（10年）的股。\",\"url\":\"https://www.zhihu.com/pins/1906366833432442626\"},{\"slug\":\"2025-05-13-如果人生总得奋斗一次-你希望是少年发奋\",\"year\":\"2025\",\"title\":\"如果人生总得奋斗一次，你希望是少年发奋，还是老骥伏枥？\",\"date\":\"2025-05-13\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"如果人生注定要吃苦，你希望是青少年时代来吃苦好呢？如果人生总得奋斗一次，你希望是少年去发奋呢？如果人生总要挨抽的话，您希望自己青少年先挨抽呢？如果孩子一生注定要挨耳光，你希望是小时候父母打他的耳光。如果让溥仪来重新组合选择他的人生道路，你认为他更希望选择的是“标准答案版”---【少年当皇帝，中年无业流浪，老年当花匠谋生】？溥仪的一生，少年得志，可以说是最惨淡，最失败的人生！\",\"url\":\"http://zhuanlan.zhihu.com/p/1905571464247219068\"},{\"slug\":\"2025-05-13-此前中原地产的香港房价指数显示-自202\",\"year\":\"2025\",\"title\":\"香港房价较峰值跌29%：负资产家庭创2003新高\",\"date\":\"2025-05-13\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"截至3月底，香港负资产家庭数量达到2003年以来最高水平。都是被利益集团忽悠疯了的傻瓜-----拿自己一生来换一套房子……\",\"url\":\"https://www.zhihu.com/pins/1905751597264409505\"},{\"slug\":\"2025-05-12-冠军与妓女-区别新教育四等人的信念差异\",\"year\":\"2025\",\"title\":\"冠军与妓女，区别新教育四等人的信念差异！\",\"date\":\"2025-05-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"你会相信富裕人家的儿女，真实的身份可能连妓女都不如吗？完成了上一轮新教育理念培训之后，前天晚上，我带几个公主助教一起吃晚餐。我说----本质上，打拳比赛给人看，和妓女们的工作一样，都是服务业，娱乐业。在磨丁这个特区，当妓女是“合法”的，也没有人嘲笑他们，警察还保护她们不受嫖客的欺负。新教育到底要为我们的社会，培养什么样的人才呢？如果一定要分级的话，可以把新教育的培养目标分为四等不同的人！\",\"url\":\"http://zhuanlan.zhihu.com/p/1905264253679691696\"},{\"slug\":\"2025-05-12-笨蛋没活路-2080规则被中国颠覆了\",\"year\":\"2025\",\"title\":\"笨蛋没活路：20:80规则被中国颠覆了！\",\"date\":\"2025-05-12\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"这几天，公布了2024年A股上市公司5392家的年报总结。我看到总利润是5.22万亿元！我很想知道：扣除10%的顶部企业之后（大约五百多家），剩下的企业到底赚了多少钱？用DEEP搜索一下结果之后，得到的结论，让“深度思考”都思考不下去了，不知道哪里出了问题！2024年，中国上市公司百强排行榜显示，500家上榜企业利润总额为63,765.59亿元。因此---中国这个地方，实在是卷得太厉害了！\",\"url\":\"http://zhuanlan.zhihu.com/p/1905326552524255767\"},{\"slug\":\"2025-05-07-今日操作-早盘卖出14万股珠江啤酒-10\",\"year\":\"2025\",\"title\":\"卖珠江14万@10.82换惠泉11.32：差价0.5低吸\",\"date\":\"2025-05-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"买入14万股惠泉啤酒，最低价11.32元买入。我认为惠泉肯定是相对低估，此价格买入不亏！两股差价我认为应该至少在2-3元才合理！大家同步看股东进出的话，会发现去年这个时候我的惠泉是减仓的，而珠江是增仓的！另外：查看股东人数，去年冲13元的时候惠泉是1.7万人。后面就直接派货，股东人数大涨30%以上。后来的股东人数也一直在降，现在已经降低到了去年13元高峰的时候，但我还没发现主力派发迹象。\",\"url\":\"https://www.zhihu.com/pins/1903491907478324720\"},{\"slug\":\"2025-05-05-如何看待特朗普宣布对美国进口的电影征收1\",\"year\":\"2025\",\"title\":\"如何看待特朗普宣布对美国进口的电影征收100%关税？\",\"date\":\"2025-05-05\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"只有对自己完全没有优势的行业，如制造业，执行高关税，才有可能带来正向的收益（还不一定）。显然美国目前为止，在电影输出方面是拥有绝对优势的国家。凡是有出口能力的国家，都会以跟美国搞【对等关税】的名义，也对美国电影玩这一套。几乎就等于美国基本葬送自己在世界电影行业的出口机会了。这样特朗普无差别的打击其他国家（中国电影肯定不是出口美国电影的大国强国），肯定会让其他国家反击美国，最终美国只能闭关锁国了。\",\"url\":\"https://www.zhihu.com/question/1902722778181928661/answer/1902756789910496948\"},{\"slug\":\"2025-05-04-现在比亚迪只有一个比不过特斯拉-就是市值\",\"year\":\"2025\",\"title\":\"比亚迪Q1营收利润全面超特斯拉：仅市值落后\",\"date\":\"2025-05-04\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"现在比亚迪只有一个比不过特斯拉，就是市值比亚迪一季度营收1703.6亿，利润91.55亿，特斯拉一季度193.35亿美元，利润4.09亿。各方面的表现，特斯拉明显不如比亚迪很多，但市值却高于比亚迪六倍多。因此未来只有两种可能性----特斯拉跌下来。跌掉80%的价格，要不比亚迪涨上去，涨六倍，这样才是合理的。在比亚迪和特斯拉做一个对冲，才是聪明人的做法，我猜---华尔街肯定有人做这个！\",\"url\":\"https://www.zhihu.com/pins/1902459661652821694\"},{\"slug\":\"2025-05-03-刚看到一份公告-2025年度全国武术散打\",\"year\":\"2025\",\"title\":\"全国散打注册仅14912人：武林高手都去哪了？\",\"date\":\"2025-05-03\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"这么一个大国，有这个人数也正常。这些都是中国的专业武术格斗人才了。我就是想：中国有这么多人练武，怎么想要选出参加世界格斗锦标赛的队员，就找不到啥厉害的人呢？对外作战怎么就不行了？中国的武林高手们，都躲在哪里去了？VS【清一武道馆，首批仅仅培养了个位数的小队伍，就已经为世锦赛提供了两个队员，还因为我们只能派出两个量级的拳手，这两个量级全部都拿到了第一名，获取了出场资格】。\",\"url\":\"https://www.zhihu.com/pins/1902149334658687021\"},{\"slug\":\"2025-05-03-历史首次开设全系列清一电影课\",\"year\":\"2025\",\"title\":\"历史首次开设[全系列清一电影课】！\",\"date\":\"2025-05-03\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"清一山长电影课系列——体验课程公告01课程内容简介七天分享七部电影的系列课程！第一部：青春期和两性关系。（某奥斯卡获奖影片）第二部：家族传承和职业规划电影课。（某奥斯卡获奖影片）第三部：心理行为电影课（目标型和感觉型人格分析）。第四部：心理学理论与实践深度解析电影课！（某奥斯卡获奖影片）第五部：江湖课与社会潜规则。（某现象级打榜电影）第七部：穷人的生存空间与阶层跨越的难度。\",\"url\":\"http://zhuanlan.zhihu.com/p/1902036838601955218\"},{\"slug\":\"2025-05-02-2025年度今日三校入读申请说明\",\"year\":\"2025\",\"title\":\"2025年度今日三校入读申请说明：\",\"date\":\"2025-05-02\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"01申请入学推荐人制度说明无论放在全世界任何地方，今日三语这种级别的学校都是极其稀缺的教育资源，不是单纯依靠金钱或关系就能轻易获得的。为了保证今日三语学校教育资源的合理使用，从今年开始，我们只接受清一新教育分团长的入学申请推荐。分团长由持有学位证的家长担任，具备推荐学生申请入读今日三语学校的资格。说明：以上试读营的名额限制措施措施，对今年申请今日三校的入学家长完全没有影响。\",\"url\":\"http://zhuanlan.zhihu.com/p/1901629894137475121\"},{\"slug\":\"2025-05-01-转-段永平2023-2024雪球分享\",\"year\":\"2025\",\"title\":\"转：段永平2023-2024雪球分享\",\"date\":\"2025-05-01\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"如果理解不对，我就批他们一顿，帮助他们提高理解老段的能力。不过，要想成为段永平这样的金融高手，是学校培养不出来的。为了帮助读者学习段永平的思想精华，《砺石商业评论》专门对段永平2023-2024年这两年在雪球的分享进行了筛选与汇总，累计400条。这400条基本上涵盖了段永平的所有核心思想，以飨读者。段永平的400条分享（2023-2024年）：1.刚开始投资投的就是美股，钱多人傻快来指的是美股。\",\"url\":\"http://zhuanlan.zhihu.com/p/1901341762162755024\"},{\"slug\":\"2025-04-30-今天看了洋河股价跌的很惨-60多元了\",\"year\":\"2025\",\"title\":\"洋河跌至60多元：股东人数低位，技术或可买\",\"date\":\"2025-04-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"发现在2017--2019年，洋河的股价在70-90元之间波动了三年，但股东人数基本上都是两万多人！现在的价格，回到了2017-2019年的价格带的底部位置了。目前的燕京，珠江等等，股东人数基本上都是历史最少的时候，也许这就是像洋河的2017-2019？洋河————-我看很多价投在讲基本面多好多好，股息率多高，企业分红都超过100%了。其他的白酒股我没有一一去看，但我相信跟洋河的差不多。\",\"url\":\"https://www.zhihu.com/pins/1901050404130752084\"},{\"slug\":\"2025-04-30-昨天卖了几十万股燕京-价格是13.38\",\"year\":\"2025\",\"title\":\"燕京13.38卖做T：买回惠泉11.22大单30余万\",\"date\":\"2025-04-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天看啤酒跌了，就又买回来了，相当于做T了。但我认为买回燕京有点划不来，只有三毛多的差价。正好11.22元有接近20万股的大单压盘，于是就一单下了20万股，全买了回来。今天总计买入了30多万股惠泉，继续“巩固”了第二大股东的地位。等下继续观望，有机会就买回昨天卖掉的50万股，没机会就算了！超过昨天卖出部分的头寸，我就放空不买了！惠泉销量大概是燕京的16分之一，市值---大约是14分之一！\",\"url\":\"https://www.zhihu.com/pins/1900918146803696002\"},{\"slug\":\"2025-04-29-坐庄幻想-20亿家产荡尽换来的教训两年后\",\"year\":\"2025\",\"title\":\"燕京重回13元回看旧文：两年前已识换庄手法\",\"date\":\"2025-04-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"坐庄幻想：20亿家产荡尽换来的教训两年后燕京重回13元，今日再看此文，发现自己“料事如神”----两年前燕京冲到13元多的，我就已经“看到”了燕京换庄的手法，而且还公告大家了。当年就是因为高位出现了明显的出货迹象，我判断是换庄，因为燕京是好股，这个价格不可能出清的。上次燕京涨到接近13元，我又卖出燕京换珠江。现在燕京两年后再度回到13元区域，还会再次重演一样的故事吗？\",\"url\":\"https://www.zhihu.com/pins/1900608197062033746\"},{\"slug\":\"2025-04-29-真正的美式教育是放养99的学生\",\"year\":\"2025\",\"title\":\"真正的美式教育是放养99%的学生！\",\"date\":\"2025-04-29\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"说白了就是放养90%的学生，只重点培养10%的对汲取知识真的感兴趣的学生（其实从我的观察来看，真正对汲取知识感兴趣的学生连1%都没有，所以我说放养90%的学生已经是保守了，实际上真正的美式教育是放养99%的学生）。而美国的教育思想过于放纵，不去教管学生，导致的结果也实在惨不忍睹！因此全世界的教育界，除了中国以外，基本上就是美国这种模式----只有1%的优等生才能学出来，成为真正的顶尖人才。\",\"url\":\"http://zhuanlan.zhihu.com/p/1900450656101308346\"},{\"slug\":\"2025-04-29-重庆啤酒和燕京啤酒两家公司的比较很有意思\",\"year\":\"2025\",\"title\":\"重庆燕京对比：销量利润相近，市值曾差四倍\",\"date\":\"2025-04-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"2021年6月30日，重庆啤酒的收盘价是177元，市值接近800亿！当时的燕京啤酒市值是200亿，股价是7.06元！燕京啤酒的股价是13.27元，市值是374亿，居然被燕京反超了100多亿！从投资者的角度来看，这四年投资重庆啤酒和燕京的差距，是6倍！意思就是：如果当年买了燕京而不是重庆啤酒的话，现在换重庆可以得到六倍之多的筹码。是什么决定了四年前的重庆啤酒，就比燕京值钱四倍？\",\"url\":\"https://www.zhihu.com/pins/1900508322924311740\"},{\"slug\":\"2025-04-26-珠江啤酒解盘-昨天珠江啤酒和惠泉啤酒均突\",\"year\":\"2025\",\"title\":\"珠江惠泉突破性上涨：主力控盘完毕拉升在即\",\"date\":\"2025-04-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"珠江是多年来第一次如此大幅的上涨，但我丝毫也不惊讶，因为我一直在等待这一天的到来。我是能够看懂盘面的人，我知道市场上的浮动筹码，都已经被收罗差不多了，主力已经控盘了。想怎么涨已经随意了，这段时间已经出现越来越明显的拉升迹象，果然昨天就大涨了！明眼人一看，就知道我是用燕京换了珠江和惠泉，因此账户上的总啤酒持仓，并没有实质性的下降。昨天下午一开盘，燕京和珠江正好在高位的时候，我就卖掉了30多万股。\",\"url\":\"https://www.zhihu.com/pins/1899388461179449793\"},{\"slug\":\"2025-04-25-好消息-明晓和陆鸽已经正式入选5月21日\",\"year\":\"2025\",\"title\":\"明晓陆鸽入选土耳其泰拳世锦赛国家队\",\"date\":\"2025-04-25\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"同时----两天内，国家体育总局还要举办新一轮的【世运会资格选拔赛】。应该是这一轮的落选者（我们有佳慧（让赛陆鸽）和谭木兰（输给耿），以及一批新来的国内顶尖拳手，要来参加淘汰赛，争取获得候补队员资格去参赛！我对陆鸽和明晓的嘱托：比赛赛程一共是11天。泰拳世界锦标赛一般都有数千人参加，你们想要拿到冠军，正常要打十轮的淘汰赛，每一天都必须竭尽全力！不然前面几轮冲不过去，后面保留体能也是白搭的。\",\"url\":\"https://www.zhihu.com/pins/1899168260538205494\"},{\"slug\":\"2025-04-21-中美脱钩-我最担心的就是美国依靠自己的强\",\"year\":\"2025\",\"title\":\"中美脱钩之忧：美拉盟友围堵，内循环恐重蹈苏联\",\"date\":\"2025-04-21\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"中国除了俄罗斯伊朗北朝鲜之外，没有人合作。虽然不会死，但长期玩下去，最终一定成为苏联一样的结果----最终跟不上世界发展而崩溃！这就是美国期待的局面---新冷战击败中国！中国如果得到最好的局面，就是美国为了自救，就疯狂的与全世界为敌。让其他国家承担美国的债务，对全世界乱提要求。这样美国由于自己的制造业空虚，无法生产和满足国民的要求，就会自己把自己玩崩溃掉！中国最大的敌人就此瓦解，成为未来唯一的。\",\"url\":\"https://www.zhihu.com/pins/1897588741364762438\"},{\"slug\":\"2025-04-19-什么都没教-却让家长很感恩的方法\",\"year\":\"2025\",\"title\":\"什么都没教，却让家长很感恩的方法！\",\"date\":\"2025-04-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"泰国校长终于把孩子接回去了，还很感恩我们，说孩子两月来进步很大，收获很多，非常感恩等等（其实我认为没啥进步，反而越来越放纵和堕落了。泰国家长就喜欢说好话，对自己孩子的教学也是要求极低。带班老师很负责，问我该咋办的时候，我教老师的处理方法，就是完全不同于对待中国家长的处理方式，让天晴老师对泰国家长光说好话，光说自己理解和宽容孩子的一切。孩子教不出来也没关系，我们尽量让家长把孩子接回家就行了！\",\"url\":\"http://zhuanlan.zhihu.com/p/1896834612132569855\"},{\"slug\":\"2025-04-18-在武汉体院与中国散打-泰拳教父深度交流\",\"year\":\"2025\",\"title\":\"在武汉体院与中国散打-泰拳教父深度交流！\",\"date\":\"2025-04-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"中国散打教父李建平去香港办事之后，我们一家回了一趟武汉，因为要处理一些重要的事情。我们一家逗留武汉期间，住在武体附近的红房子宾馆。没想到有机会见到了大名鼎鼎的李建平教授。他是中国格斗--散打的开创人，也是20年前引导泰拳进入中国，并开创中泰擂台赛的元老，号称散打教父和泰拳教父！散打教父称中泰对抗是编故事转攻泰拳五年匹敌泰国体院练传武的贾教练是我的老朋友，他是个武痴，为了武术事业居然终身不婚！\",\"url\":\"http://zhuanlan.zhihu.com/p/1896473378770093751\"},{\"slug\":\"2025-04-18-清一大学武道学院-本硕博连读培养计划-公\",\"year\":\"2025\",\"title\":\"清一大学武道学院【本硕博连读培养计划】公示！\",\"date\":\"2025-04-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一大学是一所个人大学，不同于目前全世界所有的国有大学和私立大学，民营大学。目前，清一大学本科生阶段只开设一个专业，就是太极武道专业。实行宽进严出制度，每年均淘汰不认真学习的学生，三年内，全国格斗锦标赛前三名学生发给清一大学武道专业本科毕业文凭！入读申请资格：年满22岁以前，已经获得世界格斗锦标赛三大赛事（拳击，自由搏击，泰拳世界锦标赛）成年组的冠军，才有申请入读清一大学武道学院博士研究生的资格！\",\"url\":\"http://zhuanlan.zhihu.com/p/1896605261638123840\"},{\"slug\":\"2025-04-09-昨天大跌-我看到有人爆仓了\",\"year\":\"2025\",\"title\":\"坚守五年价值投资爆仓亏78%：万华化学杠杆悲剧\",\"date\":\"2025-04-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"【坚守五年“价值投资”，结果爆仓结束，净值亏损78%】。我看了一下，这个人买的是万华化学等。这个股，我35元买，在100元以上卖掉清仓。这人居然是在我卖出的这一年（2021年）1:1融资杠杆买进去了。昨天的千股跌停，导致他最终爆仓。也许：他不会怪自己没脑子，不懂投资，更不懂投机！他只会怪别人宣传的“价值投资害死人”，绩优股也套死人！结局---2025年4月7日爆仓归零。\",\"url\":\"https://www.zhihu.com/pins/1893091659169911390\"},{\"slug\":\"2025-04-08-今天上完课回来看看股票-我昨天损失的金钱\",\"year\":\"2025\",\"title\":\"昨日亏损今日回三分之一：换股买入市值0.8倍利润4倍股\",\"date\":\"2025-04-08\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"剩下的，总有一天会回家的。今天我换股买入了60万股“其他”---昨天该股跌停，今天跌了9%我买入的。其实原来我是持有该股的，只是前段时间涨了，比现价高35%--40%的时候，我就卖光了。我前面一段时间，一直在悄悄大买特买的股票是冠农股份！我看昨天今天的走势，主力已经完成建仓了，现在是利用昨天的坏消息，快速的下探震荡，今天就拉升脱离底部，主力也不再掩藏吸货做东的手法，所以我就自己说出来了。\",\"url\":\"https://www.zhihu.com/pins/1892963145154269573\"},{\"slug\":\"2025-04-07-今天上完课后-查看了一下我的账户-收获了\",\"year\":\"2025\",\"title\":\"账户多年最大跌幅：燕京反涨13元卖60万股\",\"date\":\"2025-04-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"难得你们有这种看我股票一天就亏惨了的消息，特别报道一下知会大家！虽然账上的钱少了这么多，但账上的股票一股未少。特别是我看到燕京今天居然还涨了，于是我就13元左右卖掉了60多万股！账上的现金躺着一堆，也许明天我会补一点进来，换换股，增加一点高息股的股份！反正燕京的持仓我有很多的，换一点其他跌的惨的进来，我也算增加了更多的股份，就算是今天惨跌日，送给我的额外礼物了！因为A股一直趴在地下很多年了。\",\"url\":\"https://www.zhihu.com/pins/1892609726707127640\"},{\"slug\":\"2025-04-07-只用千分之一的成本-能否办成世界顶尖大学\",\"year\":\"2025\",\"title\":\"只用千分之一的成本，能否办成世界顶尖大学？\",\"date\":\"2025-04-07\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"我看网上，到处有人在嘲笑曹德旺想要花100亿办世界顶尖大学的“梦想”。一百亿看起来很多，但中国的其他“非世界顶尖大学”，都是每年数百亿投入的！所谓的世界级顶尖大学，就是能够吸引世界最顶尖的人才来学习的大学！比如你只接受top1%的全世界的优秀学生申请入学，你才是世界顶尖大学。如果用这个标准来看的话，中国目前还没有世界级顶尖大学。世界1%的顶尖优秀学生，根本就不来中国上大学！\",\"url\":\"http://zhuanlan.zhihu.com/p/1892425707843482021\"},{\"slug\":\"2025-04-07-是我太笨了-搞不懂特朗普的思路-还是特朗\",\"year\":\"2025\",\"title\":\"特朗普的贸易逆差逻辑：印钞换实物，谁更笨？\",\"date\":\"2025-04-07\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"假如我是“美国”，我之外的所有国家用一个人来代表，比如你叫“非美国”。就可以换回“非美国”给我1.2万亿的实在的东西，我用一点纸换这么多东西，我肯定喜死了。每年我多印一点就行了，只要“非美国”愿意，我就一直玩下去。我居然要立法来阻止“非美国”送东西给我？我如果没东西卖给你，将来贬值，赖账，亏的是现在先拿东西给我消费的“非美国”，我替他们操心这？你们说：我这样想，是不是我“脑子不正常”？\",\"url\":\"https://www.zhihu.com/pins/1892704312779596906\"},{\"slug\":\"2025-04-05-如何安排孩子的一生\",\"year\":\"2025\",\"title\":\"如何安排孩子的一生？\",\"date\":\"2025-04-05\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"基本上，大概就是下面这张照片的样子吧？算起来，过去40年，我们身边的成功者，到了退休的时候，就是给孩子留下了几张房产证！我遇到一个深圳的家长，说他们家，给自己的孩子留下了三套深圳的房子。说他不卖房子，家里正好有三个孩子，一个人一套！对于很多深圳的年轻打工人来说，奋斗一辈子的梦想，就是挣到一套深圳的房子！而这家长的孩子，十几岁就拥有了别人的“一生”，那么---她会用家长帮她赚到的这一生来做什么呢？\",\"url\":\"http://zhuanlan.zhihu.com/p/1891874272852566783\"},{\"slug\":\"2025-04-03-转-纯素食体能更强的三个现实案例证明\",\"year\":\"2025\",\"title\":\"转：纯素食体能更强的三个现实案例证明！\",\"date\":\"2025-04-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"最近两场比赛，可以看到木兰们的技术和体能提升都很强。纯素食的拳手，打满五局还一直充沛体能，很难得。泰拳手现在都选择避战我方拳手，或者用级别更高，体重更大的拳手来打。是一场体重级差异巨大的比赛：真实体重45公斤级别的明晓，与比赛体重60公斤级的香港三冠王拳手对战！下面这个农村兵天生不吃肉食的体能表现，我相信从另外一个角度，展现了纯素食者可能拥有的体能优势。不过，特别强调：上面这个素食者身体会很瘦弱。\",\"url\":\"http://zhuanlan.zhihu.com/p/1890912321272006447\"},{\"slug\":\"2025-04-01-今日又买了一百万股中国建筑-5.25元\",\"year\":\"2025\",\"title\":\"再买中建百万股@5.25：原卖无数次今买回\",\"date\":\"2025-04-01\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1890414995956798201\"},{\"slug\":\"2025-03-31-上周五美股大跌-今天港股-A股跟跌\",\"year\":\"2025\",\"title\":\"美股跌A股跟跌：融资买回中建，跌惨就接\",\"date\":\"2025-03-31\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我认为美股跌应该A股涨的。所以---今天就用融资买了一百多万股中国建筑进来，再跌再买。反正就算买入一千万，成本成本也是零。谁让我原来把多年来卖了她无数次呢？现在就没别的想法，就是感觉原来涨了就卖出它，有点不仗义。说起来，跌破5元才买的规矩，已经是好几年前的老价格了。这家公司，每年都赚一元多，凭啥我就死守5元不放呢？我用国家银行给我的钱赚利息，算是空手套白狼---白赚吧？\",\"url\":\"https://www.zhihu.com/pins/1890050743655958409\"},{\"slug\":\"2025-03-28-未来世界冠军的摇篮-清一木兰冠军家园\",\"year\":\"2025\",\"title\":\"未来世界冠军的摇篮：清一木兰冠军家园\",\"date\":\"2025-03-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"冠军姐姐教你当冠军由清一太极木兰组建的公众号已经开启：目前是给真正想要当一代宗师的传武迷少年们一个成就梦想的机会---不知道现在还有没有这种小孩！【少年冠军班】由清一教育基金会资助运行的项目。我们认为你就并不想真的成为冠军，你只是一时兴起来蹭热点的。你能够坚持练习一年后，符合集训的要求，经过考核过关之后，我们就会邀请你来清迈，正式参与我们的冠军公主的亲自面授训练了！\",\"url\":\"http://zhuanlan.zhihu.com/p/1889015701429274167\"},{\"slug\":\"2025-03-25-祸莫大于无敌-失去对手的美国以飞快的速度\",\"year\":\"2025\",\"title\":\"祸莫大于无敌：失去对手的美国以飞快的速度堕落！\",\"date\":\"2025-03-25\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"苏联卫星率先上天，美国大力反省自己的问题，大力整顿教育体系，强化数学和科学的教育，培养了大批的工程师。这也成就了90年代以前【美国制造世界第一】的辉煌。1989年，苏联国力无法和美国匹配，在超级大国争霸赛中垮掉了。但美国拥有的巨大发展惯性并没有消失，反而越来越强。世界上有64项关键技术，每一个都是举足轻重的存在，甚至可以决定一个国家的未来发展，中国和美国在这些技术的第一争夺上也是持续了多年之久。\",\"url\":\"http://zhuanlan.zhihu.com/p/32444361505\"},{\"slug\":\"2025-03-24-今日操作-卖出珠江啤酒一百多万股-刚开始\",\"year\":\"2025\",\"title\":\"卖珠江百万股@10.33-10.39：养老账清零仅留百股纪念\",\"date\":\"2025-03-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"不知道谁一直在10.39元收货，我一挂出来就很快被买走了，我就再挂，每单10万，连续挂了八单。最终把我养老账上的珠江都全部卖空了，与燕京一样，养老账上就只剩了100股纪念仓位了！原来账上的珠江头次，本来就是用燕京和惠泉换的。今日的换入情况：新买入了30多万股惠泉补上珠江的啤酒空仓，分小笔买入的，买入的价格11.02-03元。好像惠泉也一直有人在11.02元抛货一样，我就一万一万的一直买！\",\"url\":\"https://www.zhihu.com/pins/1887525630582686852\"},{\"slug\":\"2025-03-23-家长教育培训吗-其实是拯救你家庭命运和未\",\"year\":\"2025\",\"title\":\"家长教育培训吗？其实是拯救你家庭命运和未来！\",\"date\":\"2025-03-23\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"下周末，我就开启本年度新开发的【家长新教育基本理念培训】了。今年如果无法通过这个教育理念考核的家庭，是没有资格申请奖学金的！而不是把资源拿给完全不值得付出的愚蠢家庭了！如果你聪明能干，善于学习和思考，不来参加培训也照样通过考试，我还认为你高明。前提----家长当然必须教育理念考核通过且必须是优良水平。二：你认为，这个孩子7岁之前的教育，家长有哪些不当之处，现在你是否也有类似的问题？\",\"url\":\"http://zhuanlan.zhihu.com/p/32178665730\"},{\"slug\":\"2025-03-23-花费千万培养出留学垃圾-怎样避免\",\"year\":\"2025\",\"title\":\"花费千万培养出留学垃圾！怎样避免？\",\"date\":\"2025-03-23\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"而且肯定没有好好学，否则15-16岁怎么可能到处晃悠？家长也不肯按照不好好学，就丢出去自生自灭的真正新教育理念来教训。比如这位花费千万把孩子培养成废物的家长：大学毕业从英国回来后---【儿子一躺就是两年，老蔡好几次都想冲到儿子家，拿着大棒子把他赶出门去。拒绝孩子回国躺平,一批中产父母送娃当厂妹、外卖员…上面这个千万鸡娃的家长，真应该反思的应该是：自己怎么会花大钱去培养出这种白眼狼来的？\",\"url\":\"http://zhuanlan.zhihu.com/p/32138307883\"},{\"slug\":\"2025-03-22-昨晚有三场比赛-居然清迈还有人要挑战明晓\",\"year\":\"2025\",\"title\":\"清迈拳手约战明晓：裁判小姐姐亲自下场试探\",\"date\":\"2025-03-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"另外一场比赛，是谭木兰对阵一个出拳很凶狠的男性化女拳手（同之“男角”）。还有第三场比赛是公主班的新公主首战泰国职业拳手。我让两个木兰们试着用用新招（三拳一腿）。第二场比赛，明晓第二回合也KO了对手，两人都干净利落地提前结束战斗。我猜：清迈此后更没有泰国人，想要出来战我们的木兰了。至于第三场，新公主的首战，也打满了五回合，最终获得判定赢得比赛，昨晚三场比赛全胜（无可置疑的明显优势获胜）。\",\"url\":\"https://www.zhihu.com/pins/1886791772388169557\"},{\"slug\":\"2025-03-19-如何比较教育系统的优劣-看底线和差生\",\"year\":\"2025\",\"title\":\"如何比较教育系统的优劣---看底线和差生的出路！\",\"date\":\"2025-03-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"如果你只是简单地看该行业的“顶尖人群”结果和待遇，可能很容易误导你，让你跳入人生的陷阱！比如：体育特别是格斗行业，就是看起来光鲜，其实底层很悲催的一个行业。教育系统也一样，你投入一个教育系统，不是要去看顶尖的学生活得怎样。下面的视频，就是今日塾赵刚校长的演讲：专门介绍今日新教育系统的“差生”的出路和未来！你看看与应试教育的差生，失败学生相比，我们提供的底线，是不是足够托住你的孩子的未来！\",\"url\":\"http://zhuanlan.zhihu.com/p/31395297374\"},{\"slug\":\"2025-03-17-英国教育开始向中国学习了\",\"year\":\"2025\",\"title\":\"英国教育开始向中国学习了？\",\"date\":\"2025-03-17\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"报道：英国教材与师资的\\\"上海化\\\"改造计划核心是教材与教师体系的全面升级。柯林斯出版社引进36类上海数学教材，英国版《一课一练》删除插画与故事，仅保留密集习题。更颠覆性的是师资培训：每校选派两名教师接受特训，学习\\\"确保全班同步\\\"的教学法，140名先锋教师已完成改造。我看英国人现在真急了：中国大幅超前发展，英国人再混下去，已经不行了。不过，真要学数学，而且在英国日薪200镑的英国教师还很缺乏。\",\"url\":\"http://zhuanlan.zhihu.com/p/30844381796\"},{\"slug\":\"2025-03-17-超越奥运冠军的机会已经到来-2025木兰\",\"year\":\"2025\",\"title\":\"超越奥运冠军的机会已经到来！2025木兰公主爆发年！\",\"date\":\"2025-03-17\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"原来我计划中的，让中华武术赢得世界名声的方式，是让木兰去参加奥运会拳击比赛，夺取奥运金牌！特别是中国原来没有奥运女子金牌，如果拿到就创造了新纪录（2024中国女拳手首次夺金，该意义已经大减）。而机会，就是这次陆鸽参加MAS格斗比赛，才突然给我发现的启示：我们可以轻松地走一条超越奥运格斗的道路！假如2025年，一众木兰和公主，都在不断地击败各种级别的男拳手，这不比拿到奥运冠军，更让全世界惊叹吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/30659581360\"},{\"slug\":\"2025-03-16-木兰MAS无回合首战重10公斤对手平局收\",\"year\":\"2025\",\"title\":\"木兰MAS无回合首战重10公斤对手平局收官！\",\"date\":\"2025-03-16\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"现场人气挺好的，似乎柬埔寨的拳风还很浓厚，民众的参与度挺高的！前三场MAS比赛都没有KO，均以平局收官。据说是只要没有KO局，奖金就继续滚下去。这种比赛的确很残酷，双方都很强，而且选手一定很拼，竭尽全力要KO对手。场面上看，陆鸽的优势很明显，因为对手其实是63公斤的,比陆鸽重10公斤。体重超过陆鸽10公斤的对手陆鸽能够和这种老资格的顶尖拳手打成这样结果，也算很不错了。\",\"url\":\"http://zhuanlan.zhihu.com/p/30618816499\"},{\"slug\":\"2025-03-15-福耀科技大学校长说本硕博-8-年制大学让\",\"year\":\"2025\",\"title\":\"福耀科技大学校长说本硕博 8 年制大学让学生不用内卷，如何评价此模式？本科毕业后你想工作还是继续上学？\",\"date\":\"2025-03-15\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【福耀科技大学近日获批设立，校长王树国说：“我们是本硕博八年制培养，打通了本科、硕士和博士之间的壁垒，然后一条大道摆在孩子们面前，他不会再一个阶段一个阶段地去焦虑，去内卷。如果王校长强化技术转化的教学方向，我认为恰是中国工程大学教育之短板。福耀工业企业出身背景，走产业化技术教育之路，走出自己的特色，也是一名校风范！但看着这校长，居然玩啥“本硕博8年连读“来作为“办校特色”吸引学生？\",\"url\":\"https://www.zhihu.com/question/14831511510/answer/125235496388\"},{\"slug\":\"2025-03-14-刚刚看到股票普涨-心想有点不正常呀\",\"year\":\"2025\",\"title\":\"美股连跌4000点：A股长牛需美长熊，金融战逻辑\",\"date\":\"2025-03-14\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"就看了一下美股-------原来美股这几天都在跌，还说股神但斌高位买多，现在亏惨了，美股跌了4000多点了。A股长牛的基础，建立在美国长熊的基础上。所以美国这几年拼命维护美股，一直高高在上的，现在撑不住了。不过-----美股是否还会继续跌就不知道，是否会反弹？感谢燕京主力拉到14元之后的大幅打压，给了我地位重新介入的机会，不然就踏空了！珠江惠泉，持仓也是历史高位，会在上涨中减下来的。\",\"url\":\"https://www.zhihu.com/pins/1883879524237832741\"},{\"slug\":\"2025-03-14-清一拳手参加MAS国际无裁决极限站立格斗\",\"year\":\"2025\",\"title\":\"清一拳手参加MAS国际无裁决极限站立格斗！\",\"date\":\"2025-03-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"很多中国人，都因为泰拳过于血腥，而不愿意参加泰拳比赛。MAS这种极限规则：只打一局，9分钟，可以踢打摔拿肘膝，只要是站立格斗技巧都可以使用，不设场下裁判，不打分。据说MAS是由昆仑决参与创投的极限搏击，吸引了包括播求，雅桑克莱，张伟丽，疯马等世界名将的参与。我看本期的赛事安排，中国队有三个拳手参加，看样子有点像是中柬对抗赛，国内的拳手很多人不愿意参加这个极限格斗赛。\",\"url\":\"http://zhuanlan.zhihu.com/p/30298217237\"},{\"slug\":\"2025-03-13-Ella和冠军姐姐带班-我出资-帮你成为\",\"year\":\"2025\",\"title\":\"Ella和冠军姐姐带班！我出资！帮你成为世界冠军和一代宗师！\",\"date\":\"2025-03-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一武道馆，去年一年就为中国贡献了15名全国格斗锦标赛冠军！真心爱武，终身从事中华传统武道的学习和钻研，成为一个类似电影上人物叶问一样的【一代宗师】。然后专心研习武道，目标就是成为一代宗师----把中国很多的传武拳种，一个人就负责弄清一个拳种，成为这一拳种的代表人，掌门人，这样中华武术就不会失传了！因此中华武术，就成为了一个玩套路的国际笑话，根本无法赢得世界武术界的尊重。\",\"url\":\"http://zhuanlan.zhihu.com/p/29499393425\"},{\"slug\":\"2025-03-12-中国建筑抛掉换啤酒很久了\",\"year\":\"2025\",\"title\":\"中建早换啤酒：现入关注区，东方资产29.9亿港元入股\",\"date\":\"2025-03-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"现在它的价格已经进入“关注”区间，是不是该抛一点啤酒，换回中国建筑呢？原来的中国建筑，从我原来的单股盈利第一的位置，已经降位让给几只啤酒了。再看看港股建筑国际，从2020年的3元多连续涨了五年，涨到现在的12元多，市值已经是中国建筑的三分之一，总盈利大概是四分之一！从这个资产标的来看的话，显然把中国建筑列为“危险资产”是不对的。中国房地产出现调整，也不会说将来就不盖房子了，不需要建筑公司了。\",\"url\":\"https://www.zhihu.com/pins/1883108172471968249\"},{\"slug\":\"2025-03-11-从11岁到15岁-从示范班到冠军班\",\"year\":\"2025\",\"title\":\"从11岁到15岁--从示范班到冠军班--从擂台到常春藤\",\"date\":\"2025-03-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"玩一样用四年时间，拿到SAT超过1500分的成绩，以求符合常春藤大学的学业成绩标准。然后您再继续像玩一样，去拿到几个全国锦标赛，甚至世界锦标赛的格斗金牌，以符合常春藤变态的体育和素质教育要求。然后---你就成为了常春藤大学最欢迎的六边形人才！一般人把这个班叫做【冠军班】，或者【常春藤班】。因为我们班的正式生SAT官考成绩都在1500分以上，均已达到常春藤大学，美国前10名大学的入学成绩要求。\",\"url\":\"http://zhuanlan.zhihu.com/p/29416505897\"},{\"slug\":\"2025-03-11-道姑下山-冠军小公主离开平台去闯江湖10\",\"year\":\"2025\",\"title\":\"道姑下山：离开平台去闯江湖，说好10年后拿成绩相见\",\"date\":\"2025-03-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"她们没有忠诚于自己的理想，自己的目标（起码入选的时候知道公主班是师资班的），也没有孝顺自己的家庭和父母（家长知道孩子要离开自己去闯天下，简直都要气死了）。但是，当年12岁就逆反离开学堂的小公主，现在的状态就完全是天上地下了。----结果孩子选择去“旅游”今天ELLA问我：我给了冠军班的学生，10年之后回归平台的机会，能不能也给这些出去闯天下的公主，10年后回归平台的机会呢？\",\"url\":\"http://zhuanlan.zhihu.com/p/28034298159\"},{\"slug\":\"2025-03-10-今天看到我持仓的一只港股涨幅挺大的-就卖\",\"year\":\"2025\",\"title\":\"港股换股：卖大涨买同性质滞涨股，躲过回撤\",\"date\":\"2025-03-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"虽然换掉了一些牛股，但总体持仓表现还是不错的。今天正好看到正通汽车，我账面上躺着600多万人民币的利润（港股通），当年（2017）赚了超过700万港币呢。今天去看看，居然才9分钱了----我当年最高是9元多跑掉的。现在最富有幻想的大脑，都不敢想回到9元了吧？当年我是2.55元左右买进的，最低2.36元还补过仓，买了大概两百万股。如果该股我一直看好，坚持持有到现在一直不放的话，就也只剩3%的本金了！\",\"url\":\"https://www.zhihu.com/pins/1882473437592798263\"},{\"slug\":\"2025-03-10-血染的风采-太极征泰355战林佳慧TKO\",\"year\":\"2025\",\"title\":\"血染的风采：太极征泰355战林佳慧TKO美国白人拳手\",\"date\":\"2025-03-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这个美国白人拳手已经击败了很多泰拳手，所以泰国拳场这次安排佳慧来跟她打。刚到拳场就有很多泰国朋友来递招：说此美国白女最近一年从无败绩，风格极为强悍，让林佳慧小心应对。泰国拳场安排很久没有上场的佳慧（泰国人传说中最厉害的木兰拳手之一。也有让中国人替泰国人报仇的意思！不过---美国人也一样，非常的自负，她抱一定要Ko佳慧的目的上场。这是第一次木兰比赛出现如此血淋淋的局面，佳慧也是第一次给别人开口子。\",\"url\":\"http://zhuanlan.zhihu.com/p/29055343336\"},{\"slug\":\"2025-03-03-2月18日燕京跌破11元-我当日买入60\",\"year\":\"2025\",\"title\":\"2.18燕京破11元当日买60万股：疑主力洗盘仍减仓\",\"date\":\"2025-03-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"心想跌了就拿着算了，因为我在11.8元以上刚减的仓，别人不要我就买回来得了。这笔教交易还在想法里面标注了。毕竟我说了，给个块儿八毛的我就走（这批新买的），今天就11.78元卖了9万股，补入了惠泉啤酒。最低价格是10.65元补充进来的，每股1.13元的差价，我很满足。但这次的很多燕京股票，还是9元多买入的！但我不贪心，会选择时机，把我的满仓减少一些的，起码目标是不要拿融资持有11元以上的燕京】。\",\"url\":\"https://www.zhihu.com/pins/1879910773649818157\"},{\"slug\":\"2025-03-03-世界名校正在浮出水面把钻石送给猴子会是\",\"year\":\"2025\",\"title\":\"世界名校正在浮出水面&把钻石送给猴子会是啥结果？\",\"date\":\"2025-03-03\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"所谓的文化上层，就是在文化上，居于世界顶峰位置的文化产品。现在的饺子动画哪吒，算是电影文化的【世界级创造】了。创建世界文化上层，绝大多数国家都没有资格和能力去做，只能跟随，目前中国也只是文化跟随者，但经济正在领先世界！现在，全世界最优秀的学生，都以考入美国名校为荣。等我们每年都批量培养出2位数的世界格斗冠军时候，就会向全世界传递一个概念：中国格斗技术和教育的水平全世界领先。\",\"url\":\"http://zhuanlan.zhihu.com/p/27700654632\"},{\"slug\":\"2025-03-01-捞女与慧芳谁更有福-宇宙真是公平的吗\",\"year\":\"2025\",\"title\":\"捞女与慧芳谁更有福？宇宙真是公平的吗？\",\"date\":\"2025-03-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"慧芳是很多年前，一个很有名的电视剧里面贤惠的女子形象，对周围的人一直是不计回报的付出。捞女，是现在我们这个社会上典型的精明女子的形象，中国似乎比较盛产捞女！这些家长们，培养出捞女的妈妈，教孩子的全是与“慧芳”的妈妈教的相反，是让她们学会心机，利用他人，学会各种手段技巧，不择手段的捞取好处。宇宙会非常公平的把你该得的一点不少的送给你！因为他们都相信：宇宙是公平的，宇宙会自动给你的付出以足够的回报！\",\"url\":\"http://zhuanlan.zhihu.com/p/27197245622\"},{\"slug\":\"2025-02-27-昨天我重仓的华菱钢铁涨停-加上珠江啤酒等\",\"year\":\"2025\",\"title\":\"华菱钢铁涨停：账户斩获2025年度最大账面收益\",\"date\":\"2025-02-27\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"华菱这几个月一直在跌，前段时间还意外跌破4元，我诧异之余，依然继续补仓，买了几十万股。钢铁行业也差不了，肯定是世界级别的企业。钢铁行业的老大，就是宝钢了，还兼并了我2004-2005年重仓的武钢股份。所以---钢铁行业，我认为最值得投资的就是华菱这个“老二”。因此我不担心她将来会垮掉，所以股价不会归零，当她跌到三块多，我账面上惨绿一片，成了我持仓最大亏损股的时候，我也丝毫不惧。\",\"url\":\"https://www.zhihu.com/pins/1878490099714617720\"},{\"slug\":\"2025-02-27-理想不会自动实现-茶也是新教育的一页历史\",\"year\":\"2025\",\"title\":\"理想不会自动实现，茶也是新教育的一页历史！\",\"date\":\"2025-02-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"往往很急于表现自己，属于急功近利之徒，不是深谋远虑之辈，总有一天会让自己处于不利地位的。万一做的不好，就说山长当年就是这样教的，所以装无辜，说自己继续努力学习改进，家长估计也没脾气。去故意和清一新教育唱对台戏，彰显自己的卓越之处，这真的是太高看自己的实力了！当年记得对明一班，对公主班，我都说过，新教育未来会改变世界，大家都会成为历史人物，会被记录进历史书籍的。下面这些记录，也是历史的一页。\",\"url\":\"http://zhuanlan.zhihu.com/p/26836470372\"},{\"slug\":\"2025-02-25-不学英语已经两年-如何用两周时间就拿到雅\",\"year\":\"2025\",\"title\":\"不学英语已经两年，如何用两周时间就拿到雅思7.5高分？\",\"date\":\"2025-02-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"她们更关心如何拿到锦标赛冠军，最近两年都在专心练武，所以---也没有拿出捍卫我说法的成绩来。虽然符合我的常识（我当年就是平时不好好听课，不学课本，而是读杂书，做杂事，最终高考取得优秀考试成绩，就是靠短期内，一个月就快速提升很多的案例）。那么：小钟公主用两周时间来备考，会拿到什么级别的成绩呢？完全不考虑她们已经有两年时间，没有去系统学习英语课程了。能够像是玩一样，仅仅用两周时间就拿到雅思7.5。\",\"url\":\"http://zhuanlan.zhihu.com/p/26207031398\"},{\"slug\":\"2025-02-22-新教育学生的专业选择和职业出路\",\"year\":\"2025\",\"title\":\"新教育学生的专业选择和职业出路！\",\"date\":\"2025-02-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"外围的清黑，一直黑今日的一种方式，就是到处说：新教育的学生都没有啥出路，毕业后只能去当新教育教师！的确今日的第一批学生（明一班），大多数（并非全部）毕业后选择了做新教育教师。所以，现在的新生家长，把孩子今日三校作为未来的职业“教育目标”，要么就是糊涂，要么就是说假话，站立场哄人的！为了实现这个目标，我认为新教育的学生，18岁之后的道路，最好是去读一个理工科的专业，千万不要读文科！\",\"url\":\"http://zhuanlan.zhihu.com/p/25502900263\"},{\"slug\":\"2025-02-20-抛弃成功拥抱失败-家长干嘛要前赴后继的奔\",\"year\":\"2025\",\"title\":\"抛弃成功拥抱失败？家长干嘛要前赴后继的奔向炼狱？\",\"date\":\"2025-02-20\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"1：学术成绩上，可以让50-60%的学生，SAT（美国高考）取得超过1500分的成绩，这在世界范围内只有1%的优等生才能实现这档成绩，已是常春藤的入学成绩要求。我们认为---智商不是学习成功的最重要因素。相反---拥有愿意努力学习的决心和毅力的学生，再加上良好的教育方法，才是取得优秀成绩的核心要素！主要是因为她入读今日之前，就用我们的方法在家长的辅导下学习了外语，而她的同学入学的时候没有学外语。\",\"url\":\"http://zhuanlan.zhihu.com/p/24959920852\"},{\"slug\":\"2025-02-18-今天一早-看到燕京开盘不久就跌破了11元\",\"year\":\"2025\",\"title\":\"燕京破11元我发楞：昨日打光子弹多买60万股\",\"date\":\"2025-02-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"分别是11.03买了20万股，11.05又是20万股，11.07再加20万股。现在居然直接破11？玩的有点大了。正在想哪里去弄点钱来再买一点。还没等我弄到钱，现在就涨了------涨了就不买了。但我也不卖。现在刚买入的这60万股，我也没想多赚钱。只要市场先生给个一块八毛的，我就走。剩下的陪着主力慢慢熬。\",\"url\":\"https://www.zhihu.com/pins/1875176886625263616\"},{\"slug\":\"2025-02-16-2025清一高考来了-孩子别慌-其\",\"year\":\"2025\",\"title\":\"2025清一高考来了----孩子别慌，其实是考你家长的！\",\"date\":\"2025-02-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"请注意：家长现在都知道了，只要你的孩子能够11岁进入今日三校，TA四年后考出SAT1500分的比例，是正常平均数的50-60倍，轻松获取藤校资格成绩！所以，为了提高我们的学生的成绩，我们就只收能够理解我们新教育理念的家庭，不收跟我们搞矛盾和内耗的家庭的孩子，免得白白浪费我们本来就很少的教育资源！凡是教育理念不通过的家长，根本就不给申请入学的资格，你的孩子再优秀，你留着自己用好了，我们不沾你的光！\",\"url\":\"http://zhuanlan.zhihu.com/p/24018298738\"},{\"slug\":\"2025-02-15-13日刚发文-感叹燕京居然这么快就涨了\",\"year\":\"2025\",\"title\":\"2.13卖燕京28万股@11.49：两天赚差十几万落袋\",\"date\":\"2025-02-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"最高价卖出是11.49元。相对于两天前的买入价11.03元，赚了0.46元。28万股，差价就有十几万元了，算是市场白送的礼物。本来这个价格买入也挺好的，但我看中了价格更低的惠泉，所以昨天我就不断的买入惠泉啤酒，最终以最低价1039元，均价10.41元，买入了28万股惠泉。算起来---这次燕京换惠泉，有一元以上的差价，我觉得值了！燕京跌了，惠泉跌幅未必超过燕京，因此无论涨跌，这样换股都不亏。\",\"url\":\"https://www.zhihu.com/pins/1874025798559723520\"},{\"slug\":\"2025-02-15-中国艺术界世界纪录-居然是一个学医的票友\",\"year\":\"2025\",\"title\":\"中国艺术界世界纪录，居然是一个学医的票友搞出来的！\",\"date\":\"2025-02-15\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"当年明朝的时候---打仗居然要靠一个书生王阳明自学成才，来支撑明朝的天下。清朝的时候，一个乡村出身的教书先生曾国藩，又是靠自己“自学成才”，学会带兵，从太平天国手上，挽救了大清的天下！今天，我们看到一个学医的书生，也是用自己的业余爱好，自学成才，自己来玩艺术，玩动画，玩中华文化输出。大大方方地在世界电影历史上创造了崭新的中国记录，让中国文化符号成为今年最响亮的明星！\",\"url\":\"http://zhuanlan.zhihu.com/p/23970853959\"},{\"slug\":\"2025-02-13-2月11日-看着燕京快跌破11元了-就挂\",\"year\":\"2025\",\"title\":\"2.11燕京近破11元挂单11.03买20万股，两日后换珠江\",\"date\":\"2025-02-13\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天2月13日，下午就冲高11.50元了，就挂单11.49元，就挂单卖出，换入等同数量的珠江。跌是幻像，不要被他迷惑，不要纠结账面利润的下降，该买就买。涨也是幻像，不要被账面的利润迷惑5，该出就出！目前账户已经是大资金，能够获得年收益率超过50%，靠的就是不贪心。否则周围人这几年都在叫苦，凭啥该我赚呢？低位的时候不买，去年10月听消息才冲进来的人，正好套在了高位上！\",\"url\":\"https://www.zhihu.com/pins/1873373388644433922\"},{\"slug\":\"2025-02-08-公主班备战2025全国自由搏击锦标赛-训\",\"year\":\"2025\",\"title\":\"公主班备战2025全国自由搏击锦标赛 训练要点！\",\"date\":\"2025-02-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"预计在2025年8月举办的全国自由搏击锦标赛，是公主班今年要“卷土重来”的重要比赛项目。由于2024首次参加自由搏击锦标赛，清一战队对比赛规则和对手都非常的不熟悉，总共只拿到2块金牌。相反经过这场不成功的比赛后，在泰拳的全国锦标赛时，清一战队提高了战斗力，拿到了11块金牌。因此，公主战队有必要在2025年自由搏击锦标赛的时候，重新来证明自己的格斗实力。连续腿法攻击，拒止对方的攻击，是很有必要的！\",\"url\":\"http://zhuanlan.zhihu.com/p/22261030449\"},{\"slug\":\"2025-02-07-挺好的-泰国对电诈动手了\",\"year\":\"2025\",\"title\":\"泰国对电诈动手：妙瓦底釜底抽薪，诈骗难久\",\"date\":\"2025-02-07\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"当年的磨丁也是一个境外的赌博窝点，黑幕也蛮多的。2012年中方断电，这群骗子就呆不住了，离开去了其他地方。现在泰国对妙瓦底地釜底抽薪，我看这群诈骗分子也做不久了。断电直接影响当地人生活，恐怕他们就成为不受欢迎的人了。不过我有点担心：万一这群人将来都用太阳能来发电咋办？消息：自5日上午9时起，泰国正式切断泰国与缅甸边境的五个对缅供电点供电，以配合政府打击跨境电信诈骗的决策。\",\"url\":\"https://www.zhihu.com/pins/1870985683730059264\"},{\"slug\":\"2025-02-06-清一大学太极书院-冠军班-2025招生说\",\"year\":\"2025\",\"title\":\"清一大学太极书院（冠军班）2025招生说明\",\"date\":\"2025-02-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"有三个班的学生要参加美国大学入学标准考试。目前清一大学少年班专注于太极书院（国学国术专业）为核心的文文武合一的准成年教育。因此即使进入太极书院冠军班，学生的主要去向，依然是继续去海外顶尖大学深造，选择自己想要学习的任何专业！关于清一大学2025招收情况的说明如下：一：清一大学太极书院的教育目标！二：冠军班招生年龄要求:太极书院冠军班的学生，主要是接纳15岁就已经达到大学入学标准的少年班学生。\",\"url\":\"http://zhuanlan.zhihu.com/p/21258499473\"},{\"slug\":\"2025-02-03-如何看待2月1日的-华尔街日报-社论炮轰\",\"year\":\"2025\",\"title\":\"如何看待2月1日的《华尔街日报》社论炮轰特朗普：开启了史上最愚蠢的贸易战？\",\"date\":\"2025-02-03\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"在他们的眼光里面，特朗普就是一个脑子混乱的疯子，专门做一些莫名其妙的事情。新闻报道：当地时间1月29日，马斯克在特斯拉的财报会议上说：“在特斯拉，显然我们认为制造业很酷。那么看了上面的报道，你认为川普很傻可以，因为你不懂政治。只是他们关心的地方，与特朗普不一样罢了。由于特朗普的政策，会短期内让华尔街遭到巨大损失。因此这些政客，会假装不知道特朗普的方针，是长期有利于美国的，他们跑出来炮轰特朗普。\",\"url\":\"https://www.zhihu.com/question/11153083561/answer/92194028226\"},{\"slug\":\"2025-02-02-感情为啥靠不住-因为只有事业才能给你回报\",\"year\":\"2025\",\"title\":\"感情为啥靠不住？因为只有事业才能给你回报。\",\"date\":\"2025-02-02\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"女人如果不能成为男人事业上的伙伴和助力，注定会被冷落和抛弃的。男人们在事业追求面前，女人卿卿我我的感情世界，其实对男人根本就没有吸引力。本质上，男人对女人的追求，只是一种征服欲望的体现，并不带太多的感情。只有最傻的男人，才会屈服在女人的感情世界中！因为男人知道：只要自己有成功的事业，女人就不会缺少。但因为邓自己也有自己的事业，当然，她也有自己的傲气，因此两人当然只能分手，各自过自己的。\",\"url\":\"http://zhuanlan.zhihu.com/p/21004686550\"},{\"slug\":\"2025-01-30-清一战队过春节的方法与众不同\",\"year\":\"2025\",\"title\":\"清一战队过春节的方法与众不同！\",\"date\":\"2025-01-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"2024年，我们圆满结束了这一年的挑战。文科成绩上，我们的学生50%达到了超过SAT1500分的优等成绩（常春藤入学标准）。最近一期的学生SAT考试成绩这批文武学霸，在接下来的寒假和春节，他们会如何度过呢？我相信这种经历，比简单的回家过春节，大吃大喝，对自己的提升更大。当全国人民正在吃吃喝喝玩玩的时候，清一战队们正在用自己默默无闻的努力，一点一滴地捍卫自己的理想。\",\"url\":\"http://zhuanlan.zhihu.com/p/20749624868\"},{\"slug\":\"2025-01-23-钟睒睒首谈办大学-建一所国内没有的新型大\",\"year\":\"2025\",\"title\":\"钟睒睒拟捐400亿办新型大学：花钱能否造名校存疑\",\"date\":\"2025-01-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"中国肯定有这种新型大学的人才，但中国有没有容纳“另类大学”的心态就难说了！另外：400亿建大学。如果世界级大学，是用钱就能堆得起来的，那么世界名牌大学绝对能够被中国拿走。花钱能否造名校---真的不知道。我甚至猜想--也许钱给的越多，效果就越差。因为---金钱吸引来的就是逐利之人！\",\"url\":\"https://www.zhihu.com/pins/1865843615995150336\"},{\"slug\":\"2025-01-22-今天首次买入重庆啤酒一万股-买入价格-5\",\"year\":\"2025\",\"title\":\"首买重庆啤酒1万股@53.89元：源于卖燕京，错失17年低价\",\"date\":\"2025-01-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"很遗憾2017年十几块没有买她，错过一波好大的行情。买入资金，来源于三天前卖出24万股燕京。当时只是简单地想：虽然趋势看涨，但涨高了就卖一点出去，大家都高兴。真没想到这两天居然连续，跌了就再度买入呗。所以今天还买入了10万股珠江，算是补回来燕京三天前的卖出头寸。珠江跌破9元，今天挂单8.94元买入。昨天拒绝了亲朋的宴席邀请，出去自己买饭吃。一份饭加上一个红豆汤，番茄鸡蛋，总共花了14元饭钱。\",\"url\":\"https://www.zhihu.com/pins/1865411211698499586\"},{\"slug\":\"2025-01-17-燕京啤酒股东数4.5万人-已经创1999\",\"year\":\"2025\",\"title\":\"燕京股东数降至4.5万：创1999年来新低，散户出局\",\"date\":\"2025-01-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"从五六年前的十几万股东数，洗到现在只有4.5万。而且最近一个月从6万左右快速滑落到现在的4.5万。说明大多数散户都出局了。那么：被什么人拿走了筹码呢？这些筹码会在什么价位，派发给跟风的人呢？\",\"url\":\"https://www.zhihu.com/pins/1863597641276989440\"},{\"slug\":\"2025-01-13-富人VS穷人无知者都会被抢走一切\",\"year\":\"2025\",\"title\":\"富人VS穷人:无知者都会被抢走一切！\",\"date\":\"2025-01-13\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"抛掉租车，用车充电的成本，以及每天的饭钱，一天能够落到手不到一百元，一个月大概会有三千元左右的收入！我们在昆明的市区中心，会去一些饭店，吃做得很好的自助餐，营养味道都很好。但刚刚看到一个消息，才明白----一些大明星，大富豪的生活，看起来光鲜亮丽，其实本质上与升斗小民也差不多，甚至可能会比我们小民更凄惨！你没钱了，她们的笑脸就会给下一个有钱的人送去，你到时候这些行长们，经理们，你连见都见不到的！\",\"url\":\"http://zhuanlan.zhihu.com/p/17975939931\"},{\"slug\":\"2025-01-08-王星只需96小时就光速获救\",\"year\":\"2025\",\"title\":\"王星96小时光速获救：影响力关键时刻能救命\",\"date\":\"2025-01-08\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"这种对照，就说明了----你和你朋友，如果拥有足够的影响力，关键时刻可以救你一命。这就是我对小女的教育----你可以当不上冠军，但你一定要做冠军的朋友。从小让她和周围的同学搞好关系，成为真正的互相帮助，互相关心的朋友。所以----拥有影响力，就拥有财富，就是生命，就是健康和幸福的保证。转：网络消息：王星这件事随着她女友的网络求助、数位顶流明星的转发，热度飙升，举国皆知。\",\"url\":\"https://www.zhihu.com/pins/1860249956901863424\"},{\"slug\":\"2025-01-03-2024全国泰拳锦标赛-清一战队赛事后记\",\"year\":\"2025\",\"title\":\"2024全国泰拳锦标赛：清一战队赛事后记\",\"date\":\"2025-01-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这注定是一个历史的突破---一群三语学霸，业余拳手，居然敢于参加专业运动员的全国锦标赛，居然还击败了专业拳手，成为获取奖牌最多的参赛团队。本次赛事，我队取得的金牌数量创历史记录！清一战队第一次参加东亚泰拳锦标赛是2024年。香港队本次赛事，勉强以五块金牌的总数维持了东亚泰拳锦标赛第一名的面子。叠加现在的公主战队进一步提高技术的空间，三四年后，清一战队将有100多人会活跃在全国格斗锦标赛的赛场上。\",\"url\":\"http://zhuanlan.zhihu.com/p/16114027982\"},{\"slug\":\"2025-01-03-清一新教育启动-长腿爸爸-计划\",\"year\":\"2025\",\"title\":\"清一新教育启动【长腿爸爸】计划！\",\"date\":\"2025-01-03\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"因为刘老师发现，很多家长非常好心，积极参加一些不明本心之人组织的类似活动，但让这些家长回家后，更加不能适应世俗生活，这样的禅修，其实完全违背了先圣的本意！原计划是刘老师自己拿钱出来全额供养大家的。其实我们夫妻一直在做好事，每年都要花费数百万，上千万来支持新教育和学生的正常发展。大家一起努力教育，一起做好事，做经营者，才能让新教育更加的深入人心，更能帮助我们无法两人再努力，也无法照顾到的一些人！\",\"url\":\"http://zhuanlan.zhihu.com/p/16134499933\"},{\"slug\":\"2025-01-01-2024-中泰冠军擂台赛-残酷而激烈的职\",\"year\":\"2025\",\"title\":\"2024 中泰冠军擂台赛：残酷而激烈的职业赛！\",\"date\":\"2025-01-01\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"现在就向大家汇报一下本次【中泰冠军擂台赛】的情况！也通过向泰国拳界学习，培养出了中国第一批泰拳高手，并在泰拳世界锦标赛上培养出了中国的泰拳世界冠军！中国队派出参加世界泰拳锦标赛的队员，常常第一轮就被淘汰，已经有很多年没有出现过新的世界冠军了！因此，我们决定为国分忧，个人出资来举办高水平的中泰冠军擂台对抗赛，每年举办一次，设法提高中国拳手的赛事水平，为国家培养出优秀的人才！\",\"url\":\"http://zhuanlan.zhihu.com/p/15374272957\"},{\"slug\":\"2024-10-23-在去马来西亚的路上-出钱出人支持马来华人\",\"year\":\"2024\",\"title\":\"赴马来途中：出钱出人助当地华人弘扬中华文化\",\"date\":\"2024-10-23\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我们每天想的，是怎样通过我们的努力，我们出钱，还出人，来支持马来华人对中国传统文化强烈的感情，情节，来弘扬中华文化。有人脉的海外华人，结为有共同目标的战略同盟，未来发展中互助的人脉。在马华就不一样，我们要去见的马来华人是广西帮，是当年马共的后人，是陈平总书记的战友们的后代。马华与我们大陆的人，都有更加亲密的关系，他们也有很多在我国高层最核心圈的朋友。过几天，我们就要与马来西亚的一个大学校长见面。\",\"url\":\"\"},{\"slug\":\"2024-10-23-用珠江燕京换了一些中糖-啤酒涨了就卖一点\",\"year\":\"2024\",\"title\":\"珠江燕京换中糖：啤酒涨卖一点，接跌惨中糖\",\"date\":\"2024-10-23\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天用珠江，燕京，换了一些中糖进来。好像今天公布季报，业绩下降了，股民不喜欢，所以今天就抛售，一天跌了超7%了。但我这个人有点傻，我喜欢下跌，讨厌上涨。因为上涨后，我就只能减仓，股票会越来越少。今天，以基本上相同的价位，就是每股9.9元左右，卖掉珠江，换入中糖，我觉得我肯定是赚了，无论珠江将来怎么涨，我都会高兴的！今天，我用11元的燕京换9.9元的中糖，我也认为我赚了。\",\"url\":\"\"},{\"slug\":\"2024-10-22-清一木兰取得仑披尼首胜-佳慧打满五局判胜\",\"year\":\"2024\",\"title\":\"清一木兰仑披尼首胜：佳慧五局判胜，首局三度击倒对手\",\"date\":\"2024-10-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"佳慧打满五局判胜，今晚ELLA在我身边当翻译，等待宣布结果的时候，她还是有点担忧，认为有可能又判佳慧负了，因为还是没有KO对手。但最终的结果很好，裁判还是把胜利给了佳慧。毕竟------第一局就连续打倒了对手三次，解说员都说怎么泰国拳手老是倒下？这个泰拳拳手的优势是拳，但没想到跟中国拳手打拳也没有机会，拼拳也拼不过中国拳手。谭木兰打满五局判负，仑披尼今天取得一胜一负结果！\",\"url\":\"\"},{\"slug\":\"2024-10-21-为什么穷人无法攀登珠峰-兼谈传武的现代出\",\"year\":\"2024\",\"title\":\"为什么穷人无法攀登珠峰？兼谈传武的现代出路！\",\"date\":\"2024-10-21\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"为什么这么多人愿意花大钱去攀登珠峰？当然---这个视频中，说穷人无法攀登珠峰，也是夸张了。夏尔巴人一直都在爬珠峰，只不过---富人爬山，依赖的是很多昂贵的先进设备，以及穷人的向导指引和帮助。穷人爬珠峰，拼的是脑子和体能，两者实力高下力判！而相反--穷人爬珠峰，是一份生活和工作的机会。我看视频中，真没想到现在有这么多人去爬珠峰，登顶都要排队上去了！为珠峰氪金的登山人，一次花50万我想：传武的复兴。\",\"url\":\"\"},{\"slug\":\"2024-10-20-某名人70多岁刚生了小孩-把孩子发布到微\",\"year\":\"2024\",\"title\":\"70多岁名人得子发微博引骂声：可怜的是孩子\",\"date\":\"2024-10-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"今天听夫人说：来过我们庄园访问的某名人，现在已经70多了，刚生了一个小孩。我大吃一惊----倒没觉得这名人生孩子有啥奇怪的，只是觉得这孩子好可怜。不过：我听说该名人已经把消息发布到微薄上了。我在泰国见过一个泰国人，是英国人的后代，他父亲大概是60多岁娶的泰国年轻女人生的他，泰国普遍的老夫少妻模式。现在这孩子40多岁了，父亲已经死去多年，母亲年轻，也早就跑了，没人管他。\",\"url\":\"\"},{\"slug\":\"2024-10-16-上海3套房卖3000万存银行年息百万天天\",\"year\":\"2024\",\"title\":\"卖3套沪房存3000万年息百万打游戏：是幸福还是不幸？\",\"date\":\"2024-10-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"转：我认识一个坑爹货，毕业后从来没上班过，自己捣鼓的小生意不算，反正他爸前几年去世了，他把上海3套房子卖了，3000W存银行，谈了3.5%的利息，一年也有个一百来万的利息，现在天天打游戏开心的一笔！他说他这辈子就没上过班，也不可能去上班~思考：不知道这人是幸福还是不幸？在我看来，他简单太不幸了！\",\"url\":\"\"},{\"slug\":\"2024-10-16-古泰拳表演-三个木兰本月要去曼谷仑披尼打\",\"year\":\"2024\",\"title\":\"古泰拳表演：三木兰本月赴曼谷仑披尼参赛\",\"date\":\"2024-10-16\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"古泰拳表演链接本月三个木兰都要去曼谷，仑披尼打比赛了。最近安排的在清迈的几场比赛，好几个去仑披尼打比赛的泰拳手，都被我们木兰ko了。所以，仑披尼似乎开始认同我们木兰的实力超群。但要求上场比赛一定要用一点扫腿的技术，否则太不像泰拳了。说是表演-----但功夫真的有，发力抗击打都是真东西，对比中国的古泰拳---昂拳表演，就真的是纯表演了。但招式是对的，招式可以实战链接，人不是。\",\"url\":\"\"},{\"slug\":\"2024-10-16-哈佛取消至少30多门秋季课程-重灾区是人\",\"year\":\"2024\",\"title\":\"哈佛取消30余门秋季课：人文学科重灾，因教师离职\",\"date\":\"2024-10-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"1、10月14日，美国媒体报道，哈佛大学校报近日发布了一则消息：哈佛取消了至少30多门秋季课程，涉及20个系。据了解，被取消课程的重灾区是人文学科，如取消课程最多的是历史和文学系，而艺术与建筑史系、宗教研究委员会也各取消了3门课程。取消原因据称是“教师离开哈佛”，虽然没有透露教师为什么离职，不过近年“人文教师被优化”的趋势愈演愈烈。2022年，哈佛大学只有7%新生计划主修人文学科。\",\"url\":\"\"},{\"slug\":\"2024-10-14-世界上最好的工作陪老岗位-月薪过万只要会\",\"year\":\"2024\",\"title\":\"月薪过万陪老岗：会笑撒娇即可，缺点是雇主死便失业\",\"date\":\"2024-10-14\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"陪老岗位-----月薪过万，轻松愉快，其乐融融，只要会笑，会撒娇就行了。缺点：有保质期，雇主死了就没工作了。”点评：新教育的家长，如果也这样温柔，有爱，无限温情。你说这种家庭的孩子，还有啥奋斗和工作的理由？----我担心的就是：这群老人死了，这孩子怎么办？不如眼巴巴的盼望老人早死，早点把遗产，房子等等给自己吧？平时过小日子，月薪过万也够了----如果这就是家长想要的人生，真没必要送来新教育受罪。\",\"url\":\"\"},{\"slug\":\"2024-10-14-高考完是高光时刻-也是至暗时刻\",\"year\":\"2024\",\"title\":\"高考完是高光时刻，也是至暗时刻！\",\"date\":\"2024-10-14\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"比首届武道馆的特训人员进步速度更快，可能是有前面的五个冠军和公主班的同学做榜样的原因，练武的方向很明确，结果也很令人信服。同时，冠军班的学生，学文上也取得了良好的进步！这些孩子，脑子都很聪明，学习成绩也好，也正因为如此，从小就是身体享乐惯了，舍不得让身体吃苦，一生的懒病难除。因为他们现在试训期间的表现是没有信用的。但我们的学生，由于学习效率超高，15岁就考完了海外高考，此时学生正值最危险的青春期。\",\"url\":\"\"},{\"slug\":\"2024-10-11-天风证券封死跌停一字板4.30元-一上午\",\"year\":\"2024\",\"title\":\"天风证券一字跌停4.30元：上午成交1366亿尽是小单接盘\",\"date\":\"2024-10-11\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"果然如我所料：今天天风证券封死跌停，一字板，今天的最高价，最低价，开盘价，上午的收盘价，都是一样的：4.30元。但我没有料到的地方，就是今天还有很多散户在积极的买进。我猜这些积极抢进来的散户，心中想的就是：妖股明天就会涨停，主力肯定要拉升的。但我认为：昨天的量太大了，主力肯定逃走了。就是成功的时候，忘记了风险，以为什么股都可以操纵，结果-----反而被散户，市场葬送了。\",\"url\":\"\"},{\"slug\":\"2024-10-10-10.80-10.82卖燕京-等量换10\",\"year\":\"2024\",\"title\":\"10.80卖燕京换10.13惠泉：价格倒挂即换，多年套利套路\",\"date\":\"2024-10-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天没做什么操作，就是10.80-10.82元之间，卖掉一些燕京，等量的换入10.13-10.14元的惠泉啤酒。价格倒挂我就换惠泉，正过来我换燕京！下午2点以后，惠泉就涨了一角钱，燕京还跌了一角钱，我就停手了。其实，两只股今天的买卖都不旺，我只能一万股一万股的换股，避免换多了踏空！我这就是不做空单，也不做多单，只是换股吃差价！多的是手中持有的股数，如果价格都回到9月30日的档位，我肯定又赚了！\",\"url\":\"\"},{\"slug\":\"2024-10-10-伊力特14元买入19元卖掉-今天发现集团\",\"year\":\"2024\",\"title\":\"伊力特14买19卖：后发现集团增持630万股\",\"date\":\"2024-10-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天发现伊力特总公司的增持公告，却很意外的发现：集团公司增持了630万股！】我好奇他是多少钱的成本-----就认真算了一下：伊力特集团公司的增持价格是每股20.63元！可是，10月8日涨停也就是20.99元。价格太接近涨停价了，这也是这个股今年4月份以来的最高价区间了。我其实挺怀疑：这是不是给被套的主力解套的机会。不过，话又说回来：起码该集团公司，认为伊力特20.99元是不贵的。\",\"url\":\"\"},{\"slug\":\"2024-10-10-庄股走势分析-一天成交194亿的小股票\",\"year\":\"2024\",\"title\":\"庄股走势分析：一天成交194亿的小股票！\",\"date\":\"2024-10-10\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天突然发现：天风证券开盘一分钟成交了53个亿，全天成交194个亿，什么概念？开盘一分钟的53个亿是全天成交194个亿的27%了！问题是：九月初，这个股票的总市值，也不过就200亿。可是，这样的股，一天的成交居然就是差不多两百亿。开盘一分钟的成交，就是中国建筑这样的大盘股今天冲涨停的全日成交价。看到这个昨天大盘跌这么惨，都坚决涨停的股票，今天就吸引来了大量的投机买入盘，开盘一分钟，就成交了53亿！\",\"url\":\"\"},{\"slug\":\"2024-10-09-对今天走势判断错误-本可以让我一天爆仓\",\"year\":\"2024\",\"title\":\"对今天走势判断错误，本可以让我一天爆仓！\",\"date\":\"2024-10-09\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"因为我判断今天开盘就会涨停，然后---可能就维持涨停收盘了！不过，我犯的错误，没有让我遭到太大损失。所以---今天对我来说，似乎这只是有些颠簸，但也算精彩好玩的一天，账面表现相对也很平淡。我绝对没有想到：今天这样走势的一天，已经有刚入市的新股民爆仓了！国庆节期间，我就卖房筹集来本金500万，并聪明地找到十倍杠杆的资方，借来5000万的资金，今天一早集合竞价，我就全部压上去买入了！\",\"url\":\"\"},{\"slug\":\"2024-10-08-10月8日盘后分析燕京-天量天价见顶模式\",\"year\":\"2024\",\"title\":\"10.8燕京盘后：天量天价见顶信号，成交额9.7亿\",\"date\":\"2024-10-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"仅仅从技术和图形上看，燕京今天是天量天价的“见顶”模式，今天成交额9.7亿。2023年4月14日，燕京冲高过14元，量也才6个多亿。也正因为当天没有放量，所以我以为还不是顶。但我没有在最高价这一天走，就是没有判断出这一天是顶来。比23年4月14日冲高回落的大阴线还难看，天量天价，似乎已经成为了压制后市的一个压力位。不过：我并不太担心燕京后市不良，目前这个价格，能跌到哪里去？\",\"url\":\"\"},{\"slug\":\"2024-10-08-上午抓到几条大鱼-10.80元买回五位数\",\"year\":\"2024\",\"title\":\"10.80元接回五位数燕京：上周11.25元抛的做T回补\",\"date\":\"2024-10-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"上午真的还找到鱼了，抓了好几条大鱼呢，起码几万元一条是要的。其中一条居然是燕京大鱼----我居然以10.80元的价格，买回来了五位数仓位的燕京（上周尾盘抛掉五位数的燕京。根本没指望买回来的，没想到今天还给了买回做T的机会！怎么也没有想到今天的燕京还会跌呀？还买了一些惠泉，补充燕京丢掉的仓位，还有其他某个股。如果手上有股票的人，今天上午开盘就放空，然后跌破昨日价格买进来，就赚了超过10%了，好生意。\",\"url\":\"\"},{\"slug\":\"2024-10-08-今天港股大跌打破一致预期太好了-筹码充分\",\"year\":\"2024\",\"title\":\"港股大跌破一致预期：筹码充分换手，走势更稳\",\"date\":\"2024-10-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天走势的确很意外：港股大幅下跌，让一致预期上涨的A股控盘后逐级下调，其实这是一个非常好的开盘，我最怕开盘后就涨停了，然后就只能干瞪眼。如果筹码不充分换手的话，未来急剧上涨必然带来狂跌。不如今天就下调一些，让前期的获利盘离开，走势就更安全了。今天用港股的大跌来打破股民的一致预期太好了，但这样走势，反而说明了未来必然上涨。9月30日，我用燕京换进来一百多万股的中糖，今天果然开盘就涨停。\",\"url\":\"\"},{\"slug\":\"2024-10-08-看盘经验-冲涨停后回调不多的股票-要么极\",\"year\":\"2024\",\"title\":\"看盘经验：冲板少回撤者，要么极低估要么主力出货\",\"date\":\"2024-10-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"分享看盘经验：今天看盘就冲涨停，后期回调也不多的股票，要么就是实在太低估了，主力完全就打压不住的股票。这种老庄股，如果你手上有的话，最好就放掉，换一些今天盘面看死气沉沉的，没啥希望的，最近几年没有走出啥大行情的新庄股。因为主力控盘不错，不想大涨，参与者也不多，所以今天走势反而看起来有点弱！还要你根据平常的基本功，对企业的基本面，博弈双方的势力强弱进行认真的分析才行。\",\"url\":\"\"},{\"slug\":\"2024-10-07-A股明天大概率开盘就是收盘-港股几天连涨\",\"year\":\"2024\",\"title\":\"A股明日或开盘即收盘：港股连涨，中铁底部反弹近60%\",\"date\":\"2024-10-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"明天A股，大概率很多股票都是开盘就是收盘吧？今天几大建的涨幅都超过10%，中铁从底部已经上涨快60%了。我原来买入的人保，居然都创新高了，不可思议。这种外围强势买单的示范之下，明天多数股票应该都是涨停开盘直到收盘，大幅跳空上涨成为必然。A股的子弹，让它多飞一会---我还是计划把港股通里面一些涨幅较大的股票卖掉部分，或者换换股，把质地不够好，涨幅也过大的股票，也拿来换一些市场不看好的股吧。\",\"url\":\"\"},{\"slug\":\"2024-10-06-女儿第62战视频-明晓两天前打完的曼谷热\",\"year\":\"2024\",\"title\":\"明晓曼谷热身赛（第62战）：技术代差多次重击对手\",\"date\":\"2024-10-06\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"女儿第62战视频20241004这是明晓两天前刚打完的一场比赛。是一个没有打过的新对手，泰方主动安排的比赛。主办方已经说明晓很厉害，她也要来试一试的，场上的确很勇猛，只是由于技术代差，她没法面对明晓的这种猛烈的攻击，多次被重重的击中。但脸上一点都看不出来痛苦，与明晓对练过的人就知道明晓的攻击有多重了！一年多前外府与一个双冠军拳手打比赛，对手还没有被击中这么多腿，场上就被KO了。\",\"url\":\"\"},{\"slug\":\"2024-10-04-怎样才能创建一所世界顶尖的大学\",\"year\":\"2024\",\"title\":\"怎样才能创建一所世界顶尖的大学？\",\"date\":\"2024-10-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"这是我回答想要一百亿创办中国人自己顶尖的大学，超越斯坦福的理想，创办福耀科技大学遇阻的曹总的回答。而哈佛耶鲁都不懂真文科，所以我认为：我能办超过哈佛耶鲁的世界级顶尖文科大学---或者说---文武合一的大学！不过，如果他的目标，仅仅是办一所世界顶尖大学，要求只是办出水平来。比如标准一：如果你能让成绩排名世界前1%的学生，愿意申请入读你的大学，你毫无疑问就是顶尖大学，起码这些学生是认账你的档次的！\",\"url\":\"\"},{\"slug\":\"2024-10-04-福耀科技大学能办下去吗\",\"year\":\"2024\",\"title\":\"福耀科技大学能办下去吗？\",\"date\":\"2024-10-04\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"曹老爷子花一百亿办大学，还说要超过斯坦福。不过，如果他的目标，仅仅是办一所世界顶尖大学，要求只是办出水平来。实际上，真正的顶尖大学，从来就不是靠政府的支持办下来的。办学者除了去寻求政府部门的官员正式批准你成立以外，其实，比较一个大学的级别档次，还有很多的标准，可以确认大学的档次和级别！如果福耀大学也用这个招生标准来审核入学，而不是用中国高考的标准来招生，你不就是妥妥的世界顶尖一流大学吗？\",\"url\":\"\"},{\"slug\":\"2024-10-03-港股昨天大幅上涨抢筹-万科涨60以上\",\"year\":\"2024\",\"title\":\"港股抢筹万科涨60%：次日过山车最高跌997点\",\"date\":\"2024-10-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"有些股票，如券商，居然涨了200%以上。我的自选股上面，不少涨幅超过50%的股票，实在是吓人。万科企业居然涨了60%以上，A股万科开盘后要跟上港股万科，不得连续涨停一个星期吗？简单地说：这是牛市上涨中的“日内调整”现象，昨天大幅上涨的获利盘，今天居然只用半天的时间，就消化完了。当时我的华菱账上也很难看，居然创造了我持股亏损的最大记录---超过千万了，主要怪我买多了。\",\"url\":\"\"},{\"slug\":\"2024-10-01-仓位管理的奥秘-燕京浮盈已回到2023年\",\"year\":\"2024\",\"title\":\"仓位管理的奥秘：燕京浮盈已回到2023年3月高峰！\",\"date\":\"2024-10-01\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"无意中看到我在一年半以前，燕京创造历史最高股价时刻的发言。写在燕京创历史新高之际现在，我主账户燕京的浮盈，已经恢复到了当年冲高14元时候的峰值。小账户的燕京持仓股数，与2023年一样多，但燕京持仓市值，低于2023年3月，但该股的盈利多了一倍还多。而仓位管理的核心，就是不看价格，不看盈利，不关心市值。我认为珠江太过低估了，所以---各位看到后来公告上，23年3月份后，我已经退出了燕京的十大。\",\"url\":\"\"},{\"slug\":\"2024-10-01-企业股票回购专项债利率仅1.75-对红\",\"year\":\"2024\",\"title\":\"回购专项债利率仅1.75%：红利板块大资金无风险套利\",\"date\":\"2024-10-01\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"企业股票回购专项债的利率，仅仅只有1.75%，那么大概率这个中国版TSLF的资金成本大致不会超过2%。而现在沪深300的加权股息率在3%，而总体红利板块的股息率接近5%。所以这个工具对于大资金而言，短期就是一个无风险套利。当然随着股价的上涨，这个套利的空间会快速收窄，早上车的早好，所以你知道为什么外资这两天像疯了一样。\",\"url\":\"\"},{\"slug\":\"2024-09-30-股市太疯狂个人账户市值新高-把德隆系的大\",\"year\":\"2024\",\"title\":\"账户市值新高：抢筹行情中砸千万买入德隆系旧部大牛股\",\"date\":\"2024-09-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天股市太疯狂了，我的个人账户市值新高，单日浮盈也创造了新记录。害得我都不淡定了，上午赶快下手，把一只心仪已久的，曾经的德隆系控制的大牛股，买了一百多万股进来，砸了一千多万进去。原来该股8元多的时候，我就开始买了，计划慢慢买成十大的。上午10：30以后，我看中粮糖业9元多，有冲过10元的迹象，但有一些千手压盘压着买货。我是不追高的，如果我想要的股涨了，我往往就放弃买入！\",\"url\":\"\"},{\"slug\":\"2024-09-29-牛市情绪正旺中信期货空单亏损66亿-27\",\"year\":\"2024\",\"title\":\"牛市中信期货空单亏66亿：2700点做空无异于找死\",\"date\":\"2024-09-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"看到消息：【现在牛市情绪正旺，中信期货空单刚传出66亿元亏损】----刷新了我的三观---2700多点居然还有人敢大肆做空？不是找死吗？怪不得当时会出现我想象不到的低价破位。估计现在投机客都在做多了？是非成败转头空？马上就转变立场？我肯定不做空，我是死多头。但假如短期上涨很厉害的话，我不排除卖出一些头寸冲掉多头融资。我坚持只做多，不做空！涨了我也只平多仓，不增空仓！\",\"url\":\"\"},{\"slug\":\"2024-09-27-云南一高校-3-硕士被聘为宿管-回应争议\",\"year\":\"2024\",\"title\":\"云南一高校 3 硕士被聘为宿管，回应争议「面试表现好」，聘用高学历人才是否「大材小用」？如何评价此事？\",\"date\":\"2024-09-27\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"原来家长以为上大学，读研究生，就可以找到一份好工作，当个管理人才？大量的毕业生找不到工作是正常，找到工作是偶然，除了顶尖名校，核心大学，普通大学生没有杀就业机会的！清迈大学是泰国的排名前三，北部地区第一的知名大学。但他的毕业生，去当小贩，干杂活的人不少。泰国本身制造业就不发达，大多数人只能做服务业。中国人要学会适应这种社会现实，老老实实当宿管，有份稳定的工作，有份收入，现在已经很不错了。\",\"url\":\"\"},{\"slug\":\"2024-09-26-股票大涨燕京差点涨停-今天一天浮盈超过1\",\"year\":\"2024\",\"title\":\"燕京差点涨停：单日浮盈超十年前账户总市值\",\"date\":\"2024-09-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天股票大涨，燕京差点涨停，我的几个账户，只好跟随创新高了。连创造了我单股亏损最高记录的华菱钢铁，今天都快涨停了---就算涨停我的账面还是亏的。不过已经大幅减少了亏损，总体账户市值是新高了----今天一天带来的市值浮盈，超过10年前的此刻，我投资账户的总市值了。由于今天的燕京没有达到涨停，所以我只卖了几十万股出去。另外，收市后看了一下我打理的老人养老账户状况，其中持仓最大的股票就是燕京。\",\"url\":\"\"},{\"slug\":\"2024-09-26-青岛啤酒涨停-涨停板只有20万股买单-筹\",\"year\":\"2024\",\"title\":\"青岛啤酒涨停封单仅20万股：筹码锁定良好无卖压\",\"date\":\"2024-09-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"但有意思的是------似乎没有啥卖盘压制。燕京也一样---其实没多少封单，很容易一下子就封涨停的。主力故意不封涨停的，但是路上都在积极的吃进筹码。我查看了一下：燕京从去年10月就一直下跌。去年10月之前持有的人，这一年都很煎熬。所以---股市上，99%的时间都是垃圾时间。但如果你错过了，想等光彩的时刻才来参与，你就根本没机会。只要耐心坚持低位持有的人，才有最后的收益。\",\"url\":\"\"},{\"slug\":\"2024-09-25-意外上涨中建涨幅居前-4.77元买入的一\",\"year\":\"2024\",\"title\":\"中建意外领涨：4.77元百万股落袋，不贪不恋\",\"date\":\"2024-09-25\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天我的股票意外上涨，特别是中建涨幅居前。好像中建现在没有上涨的理由，相反还有跌（压制上涨）的理由。正好我前段时间刚刚买入了一百万股中建，看看均价是4.77元买入的股票。所以---我今天转手就卖掉了，不贪心，不去想他要涨到10元的事情了。我只想：我才没多少天，每股就赚了7毛多钱，比分红高多了。何况----这是用融资买入的股票，我卖掉后还好了。如果明天继续上涨，就算我帮助接盘的人赚钱了。\",\"url\":\"\"},{\"slug\":\"2024-09-25-新版-2024版-清一新教育的示范班公众\",\"year\":\"2024\",\"title\":\"新版（2024版）清一新教育的示范班公众号上线了！\",\"date\":\"2024-09-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"上届的示范班，经过四年的实验教育，面对媒体的公开检验，已经完成了任务。当年11岁的小孩子，今年成为了冠军班的主力。与此同时：新一代的“示范班”----11岁入学的公主学堂（明德女塾）的首届学生，今年也入学了。与四年前示范班用四年时间主攻英语不一样了，新一代的示范班，是【三加一学习模式】。这是他们班的公众号链接---你可以把他看成是新一代的示范班-----经过四年沉淀之后，进行了改进教育的试验班。\",\"url\":\"\"},{\"slug\":\"2024-09-25-清一新教育的两种不同模式-你喜欢哪一种\",\"year\":\"2024\",\"title\":\"清一新教育的两种不同模式。你喜欢哪一种？\",\"date\":\"2024-09-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"示范班和公主班，是清一新教育的两种不同的教学模式。2016年之前，以明一班为代表的新教育教学模式，是全素质教育。这时候----我才发现---家长们跟我不一样，我是很简单的人，我要新教育，就抛弃应试教育。所以，就选择了一批与小女同龄的小伙伴，让她们从12岁开始，就实行不以考SAT，不以上大学为目标的，更加传统的新教育模式。两种新教育体制内，完全不同的教育模式，带来了什么样的结果和区别呢？\",\"url\":\"\"},{\"slug\":\"2024-09-22-有江湖高人出马来“教育”清一武术的严重问\",\"year\":\"2024\",\"title\":\"有江湖高人出马来“教育”清一武术的严重问题了！\",\"date\":\"2024-09-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"我建议大家好好看看一个国家地理的纪录片功夫，有三集，第一集最好，开门八极，看到一家人，三代都在认真守护着他们的传统武术，令人尊重。主持人其实也就是一个拍武术电影的，虽然练过武术，但真实的战力也有限。不过，大师认为认为这次摔跤太不漂亮了，不够有说服力，但也不敢继续再来一次，知道纪录片的主持人有点真功夫。下一个点评，大师就更有水平了：直接点评我们2019年开启的武道馆训练模式，有严重问题！\",\"url\":\"\"},{\"slug\":\"2024-09-22-炒股和赌博的区别在哪里\",\"year\":\"2024\",\"title\":\"炒股和赌博的区别在哪里？\",\"date\":\"2024-09-22\",\"type\":\"回答\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"我认为：是不是赌博的区别，不是这个行业是不是赌博。而是你对待这个行业的理解程度和掌握的程度！如果你不理解这个行当，就算是最正宗的生意，你也是赌博！赌场里面，99.99%的人，都是来赌博的，这些人是赌徒。但他们的名字很特别，居然叫做“职业赌徒”---其实他们是把赌博，当成一个真正的生意来研究，破解，并投入的！我觉得，研究清楚赌场的规则和漏洞，实在是太难了，佩服这种人是天才。\",\"url\":\"\"},{\"slug\":\"2024-09-19-2027-批量生产全国冠军和学霸的方法\",\"year\":\"2024\",\"title\":\"2027--批量生产全国冠军和学霸的方法：无为之教！\",\"date\":\"2024-09-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"预期，从2027年开始：武状元将批量诞生：今日学堂（清一太极书院）这一年开始，将为中国人培养出最多的国家级格斗冠军。这是国家体育总局一直期待，但一直没有真正实现的目标---因为，在全世界范围内，从来就没有一所学校，能够做到批量培养格斗冠军。谁都没有找到能够批量地，稳定地培养出冠军拳手的路径和方法！一旦谁找到了源源不绝批量培养出冠军的方法，这机构可能早就垄断了格斗界，堂主早就发大财了。\",\"url\":\"\"},{\"slug\":\"2024-09-19-珠江与惠泉产量差5.85倍市值差8.08\",\"year\":\"2024\",\"title\":\"珠江惠泉产量差5.85倍市值差8.08倍：惠泉明显低估换之更划算\",\"date\":\"2024-09-19\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"珠江啤酒上半年卖了69.85万吨，惠泉11.92万顿，产量相差5.85倍。珠江市值185亿，惠泉市值22.88亿，市值相差8.08倍，惠泉低估，换惠泉更划算。燕京啤酒上半年销售230万吨，比珠江多3.29倍。市值261.84亿元，比珠江多1.41倍----理论上，燕京的市值，应该比珠江高3倍才合理，因此现价如果珠江是合理的，燕京就明显低估了，股价要翻倍才能匹配珠江。\",\"url\":\"\"},{\"slug\":\"2024-09-18-挂单换燕京8.96元买入-用8.20元卖\",\"year\":\"2024\",\"title\":\"8.96元挂单换燕京：8.20元卖珠江回补，股份不减反增\",\"date\":\"2024-09-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天挂单换了一些燕京啤酒，是8.96元买入的。用的资金是卖出珠江换的，卖出均价8.20元！8.80元的惠泉也换了一点！ 股市不景气，跌了不少。不过我的股份一股没少，还多了一点。所以没啥好担忧的！\",\"url\":\"\"},{\"slug\":\"2024-09-16-美国考不上大学也可以当公务员是好事吗\",\"year\":\"2024\",\"title\":\"美国考不上大学也可以当公务员是好事吗？\",\"date\":\"2024-09-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"新教育最差的学生，都可以轻松超越这个美国的大学基准分。甚至美国的一些低端一点的大学，不到这个大学基准分的学生，都可以通过绕一圈，先去读一个社区大学，再去申请上州立大学。【当然，国内即使是国际学校，都不会教外语，包括美国的学校，所以----只要学好英语就耨个考高分，就是新教育最大的魅力】。这么低的门槛，如果美国人还有人，居然上不了大学，实在是一个超级大学渣，完全是一个没脑子，没思考力的废物笨蛋。\",\"url\":\"\"},{\"slug\":\"2
