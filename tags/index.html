新的赛事消息来了----泰拳女子50公斤级世界冠军，也找上了佳慧，要跟她打一场比赛。她手上的两个奖杯，一个是兰纳地区（泰北地区）的泰拳冠军奖杯，另外一个是IPCC的泰拳年度世界冠军奖杯。输了---输给泰拳世界冠军，木兰也不丢人。我想知道：你们认为10月8日，木兰佳慧远道去应战这位甜水，泰拳世界冠军，会输掉比赛吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/565352055\"},{\"slug\":\"2022-09-16-太极征泰第18战-明晓对帕开二番战-KO\",\"year\":\"2022\",\"title\":\"太极征泰第18战  明晓对帕开二番战  KO胜\",\"date\":\"2022-09-16\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"(二维码自动识别)昨晚的比赛，是明晓与泰国国家青年队冠军帕开的二番战。帕开明显做了准备，扫腿攻击比较频繁，可惜对于太极实战拳手来说，泰国的扫腿攻击，几乎不起作用。而帕开在内围战中的缺点，依然非常的明显。到现在为止，已经用腿击，拳击，膝击，肘击等手段KO了泰拳手，证明了太极实战。木兰们开始赢得外国粉丝泰国粉丝找木兰合影由于佳慧正在准备23日与金腰带的二番战，远在530公里以外的另外一个城市。\",\"url\":\"http://zhuanlan.zhihu.com/p/564907889\"},{\"slug\":\"2022-09-13-为什么要上大学-读大学的意义呢\",\"year\":\"2022\",\"title\":\"为什么要上大学？读大学的意义呢？\",\"date\":\"2022-09-13\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"中国，每年大约有上亿人，正在为“考大学”的目标而努力。但这么多人要考大学，你们问过自己：为什么要上大学吗？因为他们没有发现去读体制内中外大学，对他们有啥实在的意义。我就没觉得，我上的大学课程，到底给了我什么有价值的东西。但上大学的过程，的确给了我很有价值的东西：让我见识到一群来自全国的优秀朋友，他们在想什么？事实上，在世界范围内：为什么要上大学，是一个非常简单的道理：我们这个社会，是分阶层的。\",\"url\":\"https://www.zhihu.com/question/533913747/answer/2672120383\"},{\"slug\":\"2022-09-13-为什么要上大学-带小女考察未来要上的大\",\"year\":\"2022\",\"title\":\"为什么要上大学？（带小女考察未来要上的大学）\",\"date\":\"2022-09-13\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"中国，每年大约有上亿人，正在为“考大学”的目标而努力。但这么多人要考大学，你们问过自己：为什么要上大学吗？所以，小明慧的哥哥姐姐，是没有大学文凭的：但她们是三语高中这一批批想要上名校学生们的带班教师。但上大学的过程，的确给了我很有价值的东西：让我见识到一群来自全国的优秀朋友，他们在想什么？事实上，在世界范围内：为什么要上大学，是一个非常简单的道理：我们这个社会，是分阶层的。\",\"url\":\"http://zhuanlan.zhihu.com/p/563981007\"},{\"slug\":\"2022-09-13-太极征泰第17战-佳慧第八战-首局用拳终\",\"year\":\"2022\",\"title\":\"太极征泰第17战：佳慧第八战  首局用拳终结对手\",\"date\":\"2022-09-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨天晚上，在塔佩拳馆举办的比赛，异常的残酷，六场比赛，全部以KO结束，其中五场都在首局和第二局KO对手。这一天，木兰佳慧也创造了自己的两项新记录----首局就KO对手的记录，以及用拳终结对手的记录。这个拳手是佳慧遇到的各方面技术最全面，战斗意识最强烈的职业拳手，用膝终结KO过很多优秀的拳手，包括前国家队队员帕开。这一场比赛，开赛后才46秒，泰拳手就被佳慧用拳KO了。\",\"url\":\"http://zhuanlan.zhihu.com/p/563767665\"},{\"slug\":\"2022-09-11-太极征泰-第16战现场照片和第17战海报\",\"year\":\"2022\",\"title\":\"太极征泰 第16战现场照片和第17战海报\",\"date\":\"2022-09-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"后面的照片，是宋老师现场追拍的，我看效果很好，不忍心放弃。此战明晓战满5回合点数胜。(二维码自动识别)以上是木兰明晓的第9战。场面上是占尽上风，但对手就是坚持五回合不倒。不知道是敌人太强悍，还是明晓的攻击太纤弱。征泰第17战将在明天举行，是木兰佳慧的第8战。今天他介绍下图中女孩(和佳惠上次（第15战）对手在同一拳馆，两人是朋友)和佳惠认识，并计划安排佳惠和这个女孩打一场。\",\"url\":\"http://zhuanlan.zhihu.com/p/563393147\"},{\"slug\":\"2022-09-10-小公主们送给国人的中秋礼物\",\"year\":\"2022\",\"title\":\"小公主们送给国人的中秋礼物\",\"date\":\"2022-09-10\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这几天，我和刘老师带着两个小公主，和家委会主席熊杰夫妻一行人，正在泰国的廊开府考察，为未来的新教育城谋划未来。估计开销就是中国人一个普通的月饼价格吧？今天是中秋节，按照我们清一教育圈的习惯，不是我们一群人乘机借节日，找个合理的理由去放飞自己，到处去找好吃的，好玩的，为自己找开心。宋老师的中秋现场播报：今天早上佳惠带着一帮孩子清理了锦鲤鱼池。我想：她也许希望在中秋夜，打出一个漂亮的拳赛来献给国人。\",\"url\":\"http://zhuanlan.zhihu.com/p/563238158\"},{\"slug\":\"2022-09-08-太极征泰第14-第15场比赛\",\"year\":\"2022\",\"title\":\"太极征泰第14，第15场比赛！\",\"date\":\"2022-09-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本周一晚上，在清迈打了太极征泰的第14场比赛。从这一场比赛开始，艾拉公主作为小记者，负责采访和播报前方战事。由于周三还有一场比赛，所以艾拉小公主必须现场参与采访。以下是小公主艾拉的点评版：清一木兰对战泰拳第14场讲解视频（明晓第8战）20220905_哔哩哔哩_bilibili今晚（9日7日）举行的是太极征泰的第15场比赛：木兰佳慧出战下面这位比较壮实的女孩。\",\"url\":\"http://zhuanlan.zhihu.com/p/562359802\"},{\"slug\":\"2022-09-05-当代传武人画像-传武毁于传武人“\",\"year\":\"2022\",\"title\":\"当代传武人画像！传武毁于\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"传武人“！\",\"date\":\"2022-09-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"中国的武术人，生活中，身价端得特别高，总是一副自己多了不起的霸气样子。虽然在世界拳坛上，中国武人多数是软弱无力的样子。我总在想:为啥我们国家的练武人，总喜欢摆出一副“粗豪”的样子？而国外的武术人，泰国，日本的拳手，总是亲切有加的样子？我总觉的：中国所谓的武术人，更像江湖黑道的大哥小弟们一样，“抖狠”已经成为中国武人骨子里面的坏习惯。视频中的传武人，明明一直被打得狼狈逃窜，一点还手能力都没有。\",\"url\":\"http://zhuanlan.zhihu.com/p/561047657\"},{\"slug\":\"2022-09-02-太极征泰第13场-佳慧第6战-KO胜-最\",\"year\":\"2022\",\"title\":\"太极征泰第13场：佳慧第6战  KO胜（最怪异的比赛）\",\"date\":\"2022-09-02\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本次比赛的海报：赛前，主办方给了我们与佳慧对战的拳手的名字。我们是压场的比赛我一看：认为这肯定是个坑。佳慧面对不知情的泰国拳手，必须采取最保守的战术，步步为营。泰方拳赛组织者，安排她来与佳慧对战，是当冤大头的，知道她就是菜鸡，专门来被佳慧狂揍一顿。不过-----怪异的事情，是裁判，解说员，看门守场子的人，面对这个结果，不像上次佳慧赢了一样，表现是很不开心的样子。\",\"url\":\"http://zhuanlan.zhihu.com/p/560524655\"},{\"slug\":\"2022-09-01-古泰拳才知道-最厉害的格斗技术是什么\",\"year\":\"2022\",\"title\":\"古泰拳才知道：最厉害的格斗技术是什么！\",\"date\":\"2022-09-01\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"仅用这一个技术，就足够让泰国的“拳腿肘膝八体技术”完全无效。等穿心腿入门之后，再去研究发展其他格斗技术。而且：木兰们的穿心腿，已经多次把对手KO，证明了上面的【古泰拳规则】说的----【所有的攻击技术，都会输给正蹬腿！这个技术，就是以正蹬腿为中心的打击技术。这么好的技术，我认为泰国人太笨了，居然不知道去使用。才发现我错了----泰国人很聪明，他们很早就知道正蹬腿的价值，是超越一切格斗技术之上的。\",\"url\":\"http://zhuanlan.zhihu.com/p/560019806\"},{\"slug\":\"2022-09-01-欧洲能源价格上涨10倍-推手是谁\",\"year\":\"2022\",\"title\":\"欧洲能源价格上涨10倍？推手是谁？\",\"date\":\"2022-09-01\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"据说：欧州天然气价格飙升至约合人民币27元每立方米，德国的电价则涨到约5.5元人民币每度，德国消费者信心指数暴跌。摩尔多瓦总统玛雅桑杜向欧盟呼救：“我们为天然气支付的费用是六个月前的十倍，摩尔多瓦是一个寒冷的穷国，天然气价格已经疯狂了，我的问题是：今年冬天我们要花多少钱？因为俄乌冲突，欧洲抵制俄罗斯导致能源价格大涨。所以----供应在没有减少，甚至增加的情况下，能源价格暴涨是谁干的？\",\"url\":\"http://zhuanlan.zhihu.com/p/560200963\"},{\"slug\":\"2022-08-30-太极征泰第13场-对手赛况赛前情报\",\"year\":\"2022\",\"title\":\"太极征泰第13场：对手赛况赛前情报\",\"date\":\"2022-08-30\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"木兰们对于泰国的对手，已经有了轻视之意。所以对于本周四晚上安排的比赛，居然没有去查对手资料。结果发现：的确泰方安排了比佳惠上次更强的对手来对战。不清楚具体的内涵，但据说选手必须是泰国第一流的拳手，才有资格去这个电视台参与比赛。她的对手是一个作风很顽强的美国拳手，最终这场比赛她输了。而且，上场前，泰国的冠军姐姐看到比赛的水单，还特别的关心：问佳慧：你知道你今天的对手是谁吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/559602226\"},{\"slug\":\"2022-08-28-对付泰拳-你先把威力泰扫对付了再说\",\"year\":\"2022\",\"title\":\"对付泰拳？你先把威力泰扫对付了再说！\",\"date\":\"2022-08-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"如果你能克制泰扫，那么几乎所有正规的泰拳手，都会手足无措，不知如何打你了。这么多年来，泰拳手们已经把泰扫发展到了极致。这样常年，日常每天的踢腿，几乎让泰拳手的扫腿成为习惯，一有机会就会提出来威猛无比的扫腿，只要被泰拳手踢上一个重腿，大多数人都会失去战斗力。你要练到能够对付视频中这种水平，又有力度，又要速度的攻击（连续保持每秒2下的扫腿速度），才有资格站在擂台上和泰拳高手决战呀。\",\"url\":\"http://zhuanlan.zhihu.com/p/558810415\"},{\"slug\":\"2022-08-28-木兰们要四个人车轮战打我25回合作为生日\",\"year\":\"2022\",\"title\":\"木兰们要四个人车轮战打我25回合作为生日礼物\",\"date\":\"2022-08-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"四个小公主，说为了庆祝我的生日，她们就放下职业拳手的架子，不要出场费，陪我这个业余爱好者，打一次【生日格斗比赛】。孩子们模仿拳馆，为比赛自己制作了海报，威风十足这场比赛，本质上是一场【年轻打年老，专业打业余，人多打人少，连续车轮战】，专门欺负老人的不公平擂台格斗。何况还要车轮战挨打，四人轮流拳脚交加的揍我，一点都不客气。木兰们各种花招，就是要打车轮战，耗尽我的体力。\",\"url\":\"http://zhuanlan.zhihu.com/p/558594808\"},{\"slug\":\"2022-08-25-太极征泰第11战-木兰佳惠第5战-KO胜\",\"year\":\"2022\",\"title\":\"太极征泰第11战：木兰佳惠第5战  KO胜\",\"date\":\"2022-08-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"木兰佳惠这次的对手，是扫腿很厉害，内围很厉害的拳手，属于泰拳的传统型，实力型的选手，敢打敢冲。吃了亏的泰拳手，会尽量的避免出招攻击，由于找不到有效的攻击方法，面对木兰的步步逼近，就会不断的退步，消极避战。这就是我安排的前两局，要求木兰只用拳法来打泰拳，不用太极三脚去打泰拳手的计划。第三回合开始，木兰突然风格大变，各种攻击技术，迎门三脚，太极连环拳法，肘法，膝法都全上。\",\"url\":\"http://zhuanlan.zhihu.com/p/557345876\"},{\"slug\":\"2022-08-25-太极征泰第12战-明晓第七战VS男职业拳\",\"year\":\"2022\",\"title\":\"太极征泰第12战：明晓第七战VS男职业拳手\",\"date\":\"2022-08-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"刚意外得到今晚的最新拳赛安排：明晓将首次与职业男拳手对战。身体是男生，但内心认为自己是女生的人，正常训练泰拳，打男子职业拳赛。还没有听说安排女拳手来打这种男生的。曾有过娘炮拳手打败全国的男职业拳手，拿到伦坡尼全国冠军的案例，说明这种人，也有实力雄厚的。主办方说明晓太厉害了，找了几个泰国北部很厉害的女拳手，都表示不愿意跟她打。会议第二个重要项目：根据男拳手的实战视频，我给明晓安排了今晚的作战方案。\",\"url\":\"http://zhuanlan.zhihu.com/p/557820557\"},{\"slug\":\"2022-08-23-太极征泰第10局与第11局泰方拳手的VS\",\"year\":\"2022\",\"title\":\"太极征泰第10局与第11局泰方拳手的VS 备战解析！\",\"date\":\"2022-08-23\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"小公主们找到了泰拳青年世界冠军帕开，和明天晚上佳惠要面对的拳手的两场视频。因为大家都在同一个技术体系统下面训练，同一阵营（比如第一梯队）的拳手，都是很刻苦努力的人，水平，天赋，训练基本上都在差不多的水平上。因为积极改革泰拳的制度，对收黑钱的裁判严格管理，影响了泰拳的利益集团。可能这些传武人，都不相信威风了几百年的泰拳，会这么轻易就败在一个文弱书生带领的私家太极小分队手上吧？\",\"url\":\"http://zhuanlan.zhihu.com/p/556855999\"},{\"slug\":\"2022-08-22-两木兰与泰国皇家军队拳击手比武过招-女打\",\"year\":\"2022\",\"title\":\"两木兰与泰国皇家军队拳击手比武过招，女打男！\",\"date\":\"2022-08-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们这群外国人，没有啥正当理由，居然就随随便便闯进泰国的军营，实在不可思议，我看标牌有【泰国皇家特种部队】的英文标志，但我真没看出啥精英部队的感觉。结果泰国男兵当场就蒙了：有一个小兵，赶快给长官打电话----我们这里来了几个中国的女生，还要跟我们比武打比赛。这两个国家，他们的军队都是“皇军”，你们看到泰国对手背心上的字了吗？木兰与泰国军人比武拳击赛这次比赛，我认为木兰们完胜。\",\"url\":\"http://zhuanlan.zhihu.com/p/556636685\"},{\"slug\":\"2022-08-22-太极与泰拳的核心差异-武术发力系统解析\",\"year\":\"2022\",\"title\":\"太极与泰拳的核心差异！武术发力系统解析\",\"date\":\"2022-08-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"要实现这一点，就需要有专门的发力的系统性训练。传武说的“练武不练功，到老一场空”，指的就是练武术，不去认真练发力系统的话（功力），只练了招式套路，练到老，也没有真功夫。很多传武门派，一是根本就没有留下“发力系统”的训练。说明了不懂，不练发力系统的所谓“武术门派”，练的时候花招百出。但面对有发力系统训练有素的真正武术，多么的像个笑话。大多数的武术系统，就是在力量和速度中，求取一个平衡点。\",\"url\":\"http://zhuanlan.zhihu.com/p/556424311\"},{\"slug\":\"2022-08-21-中国功夫-难道要靠外国人才能发扬光大吗\",\"year\":\"2022\",\"title\":\"中国功夫：难道要靠外国人才能发扬光大吗？\",\"date\":\"2022-08-21\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我一直认为：中国武术最擅长的功夫，就是一招：“捧着金饭碗要饭吃”。让大家不要自暴自弃，要知道：中国功夫是有价值的，很好用的。中国人的咏春，难道就只能在电影上“实战”，痛打日本人，以及拳王泰森吗？结果发现是一个跟电影片学招式的“功夫大师”，连拳经是啥，都不知道，也不敢兴趣。咏春拳在MMA中的运用第一集_哔哩哔哩_bilibili我在想：难道将来中国人要学真正的咏春拳，只能出国去学了？\",\"url\":\"http://zhuanlan.zhihu.com/p/556147732\"},{\"slug\":\"2022-08-21-太极征泰第11场-对手的赛前资料\",\"year\":\"2022\",\"title\":\"太极征泰第11场 对手的赛前资料：\",\"date\":\"2022-08-21\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"预计将于8月24日开战太极征泰第11场。孩子们设法查清了对手的全名：是phetnamsaengs.prongsakoron。我给艾拉小公主派的任务，是让她去查背景资料，让佳惠专心备战。看她的比赛，扫腿很厉害，速度快，力量大。她三四年前，有一次争夺冠军金腰带的冠亚军决战比赛。而且，泰拳比赛中，女拳手KO对手的案例不是太多。但最新的消息是：这个拳手和明晓打的泰拳世界青年冠军，打过两场比赛。\",\"url\":\"http://zhuanlan.zhihu.com/p/556151950\"},{\"slug\":\"2022-08-19-传统武术和拳击泰拳MMA相比-到底有什么\",\"year\":\"2022\",\"title\":\"传统武术和拳击泰拳MMA相比，到底有什么不同？\",\"date\":\"2022-08-19\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"核心不同，就是内家传武是单重，移动攻击。泰拳等外家拳，是双重，站稳攻击。所以实战中内家传武更快。但招式上没啥原则区别。\",\"url\":\"https://www.zhihu.com/question/278152789/answer/2633955552\"},{\"slug\":\"2022-08-19-太极征泰第10场比赛-木兰明晓-VS-帕\",\"year\":\"2022\",\"title\":\"太极征泰第10场比赛：木兰明晓 VS  帕卡（pancake）\",\"date\":\"2022-08-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这场比赛，是在清迈的塔佩国际泰拳馆举办的。THAPAESTADIUM这是木兰们第一场公开代表中国，用“中国功夫对战泰拳”的名义参战的比赛。每人各自打上五六场比赛后，如果木兰们的确表现良好，能够把外围地区的最优秀泰拳手都打赢了，以后就给孩子们安排曼谷仑披尼的比赛。比赛水单，给我们列了中国木兰拳馆的名字本次的对手是48公斤级的，明晓是41公斤。明晓的比赛，是最后一场，标注【国际比赛】。\",\"url\":\"http://zhuanlan.zhihu.com/p/555150182\"},{\"slug\":\"2022-08-19-泰拳世界冠军-青年组-奇袭木兰-铩羽而归\",\"year\":\"2022\",\"title\":\"泰拳世界冠军（青年组）奇袭木兰   铩羽而归！\",\"date\":\"2022-08-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨天晚上与木兰开打的泰国拳手，我们赛前，一直不知道底细。没想到----这一回，泰国居然把世界冠军都搬出来“奇袭”木兰，还是重量级超了7公斤的“不平等比赛”。泰国的冠军拳手也很低调，完全不拿架子（你们是否看出来了：为明晓认真进行场间按摩服务的泰国拳手，是现任的（今年）的泰拳国家队的成年组队员吗？但这种地方，居然会冒出一个泰拳世界冠军，出来跟你过招呢？是2019年48公斤级的泰拳女子青年组世界冠军。\",\"url\":\"http://zhuanlan.zhihu.com/p/555525429\"},{\"slug\":\"2022-08-17-薛颠论武-内家拳和外家拳的本质区别\",\"year\":\"2022\",\"title\":\"薛颠论武：内家拳和外家拳的本质区别\",\"date\":\"2022-08-17\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"双重拳可以看出薛颠是很懂拳的人，内外兼通之人。因为内家拳的练法，攻防用法，处处是针对外家的，专门用来克制外家拳的。如果你根本就不懂外家拳的拳理和练法，你如何去“练内家”？可惜----国内有几个人练内家拳的人，会认真研究内外两家的区别呢？很多传武师父，都是自高自大，自我吹嘘，瞧不起外家拳的人。别人是深入研究外家拳后，专门找到了外家拳的漏洞，来创立的太极拳，内家拳。内家拳和外家拳的核心区别是啥？\",\"url\":\"http://zhuanlan.zhihu.com/p/553800998\"},{\"slug\":\"2022-08-11-赵道新论中国武术4-中国武术将不复存在\",\"year\":\"2022\",\"title\":\"赵道新论中国武术4：  中国武术将不复存在？\",\"date\":\"2022-08-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"前三天的访谈，赵道新基本上是彻底批判了“中国武术”的价值，他认为中国传统武术的技术体系上，就没有啥有真正内容和价值的东西。对传武存在的问题方面：赵道新说有“三座大山”压制了中华武术的发展和繁荣。而赵道新似乎完全不知道中华武术的核心灵魂，关键因素，居然公开宣扬中国武术的“历史虚无论”，认为中华武术就是一个徒有其表的虚家伙。我相信的未来，绝对不是赵道新说的结果：【中国武术将不复存在】。\",\"url\":\"http://zhuanlan.zhihu.com/p/511279343\"},{\"slug\":\"2022-08-08-如何看待-罗振宇的骗局-大部分知识付费其\",\"year\":\"2022\",\"title\":\"如何看待《罗振宇的骗局，大部分知识付费其实都是大忽悠》一文？\",\"date\":\"2022-08-08\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"要我说：你如果把罗振宇的【知识付费分享】，作为一个骗局来看；知识系统在其中，只是相对最不重要的组成部分，虽然也“不可缺少”。如果一个人，只是杂乱无章地收集各种知识，却忘记了自己要如何去处理知识，安排知识，运用知识，让知识变得有序的话，他就是一个知识大垃圾场。因此：很多人跟着学习了很久的【罗辑思维】，发现自己依然是傻瓜，因为他本来就是傻瓜，现在无非是读过一些二手书的，有知识的傻瓜罢了。\",\"url\":\"https://www.zhihu.com/question/67168122/answer/2615876747\"},{\"slug\":\"2022-08-08-知识其实很无用-最有价值的是心智模式\",\"year\":\"2022\",\"title\":\"知识其实很无用。最有价值的是心智模式！\",\"date\":\"2022-08-08\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"比如：教学知识的学校，其实是最没用的教育。每天都有大量的知识正在过时，失效，被证明是错误。要我出主意，改变这批慵懒，有很好的的机会也不上进的学生心智模式。这种教育的价值超高，调整完孩子的学习心智模式之后，他们再去学习任何知识，都非常的容易。】以下，附录一篇文章，是我讲解人生成长三大要素的【愿景，心智模式，知识体系】。要“统御”知识，最核心的要素，“总统”，就是“人生目标系统---价值观系统”。\",\"url\":\"http://zhuanlan.zhihu.com/p/551378522\"},{\"slug\":\"2022-08-07-郭德纲对郭麒麟的打击式也适合用来教育普通\",\"year\":\"2022\",\"title\":\"郭德纲对郭麒麟的打击式也适合用来教育普通家庭的孩子吗？\",\"date\":\"2022-08-07\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这个问题的一堆答主，都很了不起，我看都在教郭德纲父子该怎么做人呢！要回答教育儿女的问题，起码你教育儿女比一般人成功，就算比不过郭德纲，也起码比大众成功，才好意思出来说几句吧？我是支持郭德纲的教育方法的。郭德纲有句话，说得好：与其将来让别人骂孩子，不如家长先自己骂。我有句话，算是郭德纲的补充：家长都想夸孩子，但不能自己夸。古人认为：自夸自秀孩子的家长，属于特别没教养，没文化的人，会被人笑话。\",\"url\":\"https://www.zhihu.com/question/413707618/answer/2613967352\"},{\"slug\":\"2022-08-01-孩子名校毕业开启家长灾难-生活教育才最重\",\"year\":\"2022\",\"title\":\"孩子名校毕业开启家长灾难？生活教育才最重要\",\"date\":\"2022-08-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"说明我不想重复这个家长的教育道路极为明智：花16年的时间。也许：只有家长自己早早死了，这孩子还有可能走出来，独自自强之路。这就是中国父母养出来的灾难！家长如果真的以为【考大学】就是自家孩子旅程的终点，出现这样的局面，也毫不为怪。也许，更多的家长，要吃了大亏之后，才知道悔改，才知道学习新教育，是拯救自己家庭的未来。当然——入校之后，我们会应家长的请求，开启家长来校跟踪孩子状况的【打屁股工程】。\",\"url\":\"http://zhuanlan.zhihu.com/p/548668004\"},{\"slug\":\"2022-07-30-教育奇迹背后是常识-您的孩子正在浪费生命\",\"year\":\"2022\",\"title\":\"教育奇迹背后是常识：您的孩子正在浪费生命！\",\"date\":\"2022-07-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清一新教育的学生和家长，都已经确认这是一个很正常的事实。常人看起来“不可能”的奇迹，正在他们的孩子身上，一点点兑现出来。各位有疑惑很正常，去求证就行了，如果是真的，也许就开拓了的教育视野。你这样就了解重点了：我们所谓的教育奇迹背后，只不过善用了体制学校被浪费的时间罢了。结果，他跟家长斗智斗勇两年左右（就是说浪费了快两年时间，没有读书学习），最终孩子看清了：家长真的不在乎他到底读不读书，考不考大学！\",\"url\":\"http://zhuanlan.zhihu.com/p/546761372\"},{\"slug\":\"2022-07-23-大家发现没有-学校里的英语教材根本就不适\",\"year\":\"2022\",\"title\":\"大家发现没有，学校里的英语教材根本就不适合让我们学好英语？\",\"date\":\"2022-07-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"事实上，如果你真的用英语教材，认认真真学习的话，基本上就没可能学好外语了。体制内一些外语好的学生，其实都不是只学教材的，而是靠家庭提供的大量课外学习机会和学习材料，而且特别的浪费时间精力。不过：我看到本问题的高赞回答，居然是：【我们的外语教材，绝对是良心教材。笔者作为一个1985年参加硕士研究生入学考试，因为英语不及格，而导致第一次考研失败的人，也许我现在是中国最有资格来指出外语教育问题的人。\",\"url\":\"https://www.zhihu.com/question/511386158/answer/2589181049\"},{\"slug\":\"2022-07-23-有没有一种让人很爽的英语学习方法\",\"year\":\"2022\",\"title\":\"有没有一种让人很爽的英语学习方法？\",\"date\":\"2022-07-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"还可以让你两年，就超过英语专业毕业的大学生，三年就学完12年的国外教材，是不是一种很爽的方法？用英语教材，认认真真学习的话，基本上就没可能学好外语了。中国学生学了十几年，到了研究生的考试英语依然惨败，平均只考40多分，真的很丢人---丢这个教育系统的人。笔者作为一个1985年参加硕士研究生入学考试，因为英语不及格，而导致第一次考研失败的人，也许我现在是中国最有资格来指出外语教育问题的人。\",\"url\":\"https://www.zhihu.com/question/312501550/answer/2589267794\"},{\"slug\":\"2022-07-21-清一木兰第九战-明晓越级挑战50公斤级对\",\"year\":\"2022\",\"title\":\"清一木兰第九战：明晓越级挑战50公斤级对手\",\"date\":\"2022-07-21\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"2022年7月20日的比赛，主办方给明晓安排的对手，是50公斤级的对手SOMTIYA。上次她打的第一场，对手是42公斤级的对手，相当于她自己体重级别的正常对手，该级别的金腰带泰拳手，结果被明晓轻易KO。她打的第二场，是另外一个48公斤级的对手，被裁判意外提前终止比赛，被判平局。昨天晚上我没去现场，明晓父母陪战，我们内部的沟通信息：山长清一21:17:19明晓打的对手是50公斤级。\",\"url\":\"http://zhuanlan.zhihu.com/p/544183017\"},{\"slug\":\"2022-07-19-中西格斗思维比较-后发先发\",\"year\":\"2022\",\"title\":\"中西格斗思维比较：后发先发\",\"date\":\"2022-07-19\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"现代格斗，双方比拼的是互相伤害的程度，谁能输出更大的伤害力，谁能耐受更大的打击，谁就赢。在苏联解体之后，这种格斗技术才传到社会上的。另外还有一种可能，就是这个外国拳手学会的西斯特玛水平已经比较高了，接泰拳手扫腿的时候，可以身体发出一个弹劲儿，造成对方的失衡倒下。（孩子们说打比赛比平时训练轻松多了）原因是中西格斗思维的不同。西方现代格斗，是典型的西方思维模式---很简单化的攻防明显分开的模式。\",\"url\":\"http://zhuanlan.zhihu.com/p/543402288\"},{\"slug\":\"2022-07-18-木兰的文学课程-课后总结\",\"year\":\"2022\",\"title\":\"木兰的文学课程：课后总结\",\"date\":\"2022-07-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"来武道馆训练，大家是集中住宿，文武兼修。既然要作文职人员，武道馆成员们学习文课是很必要的。下面就分享一个目前尚在国内武道馆木兰的课程日记，看看她们是如何文武兼修的。大家可以通过学习日记，看看她们的太极武道训练之外的日常课程，是怎样的内容？谭琛怡7月6日10:03文学课09课总无论这个社会如何变化，其本质都是农民社会，无论每个人的外表如何改变（穿得多时髦），骨子里都有农民属性。\",\"url\":\"http://zhuanlan.zhihu.com/p/543052956\"},{\"slug\":\"2022-07-16-中国已失传的民众教化之功-泰国节日观礼\",\"year\":\"2022\",\"title\":\"中国已失传的民众教化之功：泰国节日观礼\",\"date\":\"2022-07-16\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"宋老师昨日分享了与泰国人一起过节的观摩，的确与当代中国的过节完全不一样。比如：今天中国的所有节日，大众的基本观念就是“今天是我好好吃一回，好好玩乐一把的机会”，把“自我享乐”，看成是节日的主要功能。但泰国人把过节，却看做是一个有机会出来做好事，与朋友分享的重要机会。上次她去参加泰国人的家族节日聚会，是家族里面的每个人，给家族的老人请安，洗脚等礼仪。这一次是参加佛节，看到了泰国人的分析精神。\",\"url\":\"http://zhuanlan.zhihu.com/p/542479822\"},{\"slug\":\"2022-07-16-为啥示范班要学K12-公主班却不学\",\"year\":\"2022\",\"title\":\"为啥示范班要学K12，公主班却不学？\",\"date\":\"2022-07-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"今年6月份之前，公主班的学习内容，与示范班是完全一样的。大家从示范班第三，第四学期的公开视频中，可以看到我们到底学了一些什么样的内容。但是前两年，我们的示范班都没有学习什么教材，都是在打基础。下学期，示范班正式开始学美国的K12教材。看到这里，你们自然知道：为啥公主班，我就不安排不学K12了？所以，公主班当然不学K12，不学任何体制内的教材。你说：我偏心，为啥不让示范班和其他班级都学公主班一样？\",\"url\":\"http://zhuanlan.zhihu.com/p/542133007\"},{\"slug\":\"2022-07-15-有没有省心省力让孩子成为优秀人才的方法\",\"year\":\"2022\",\"title\":\"有没有省心省力让孩子成为优秀人才的方法？\",\"date\":\"2022-07-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"你只能跟随成功者示范的方法，只能选择少有人走的路，才会获得超级的成功。我家的三个孩子，都用了我的这种特别方法，我省心省力，太太也根本不操心孩子。其实这些家长天天最操心的内容，真心与孩子成才的关系不大，甚至只有负面的关系。另外部分“更精明”的家长，认为是“优质课程内容和教学方法”，就决定了自己的孩子是否成才。方法也是一样的：只要让孩子与比她优秀的伙伴在一起，只要时间泡长了，她不优秀就会显得很怪异。\",\"url\":\"http://zhuanlan.zhihu.com/p/539402259\"},{\"slug\":\"2022-07-12-泰拳和散打-究竟哪个厉害\",\"year\":\"2022\",\"title\":\"泰拳和散打，究竟哪个厉害？\",\"date\":\"2022-07-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"但也没有说，你去练泰拳，就一定能打过中国散打选手的。散打，泰拳，和踢拳，包括跆拳道，本质上技术都是一个层次的，就是格斗规则上有所不同，造成实战中的技术打法有一些区别。比如：采用泰拳规则跟泰拳打，泰拳普遍不是对手。中国原来自己的散打，由于格斗原则和发力方式等，本质上与泰拳，踢拳是一样的。反而散打因为常常输给泰拳以及踢拳的缘故，导致散打运动员其实都在偷偷学泰拳和踢拳。\",\"url\":\"https://www.zhihu.com/question/21311482/answer/2570686464\"},{\"slug\":\"2022-07-12-踢拳能打赢泰拳的秘密是什么-纯粹是因为练\",\"year\":\"2022\",\"title\":\"踢拳能打赢泰拳的秘密是什么？纯粹是因为练得好么，请问？？\",\"date\":\"2022-07-12\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"因为：泰拳，和踢拳，包括跆拳道，本质上技术都是一个层次的，就是格斗规则上有所不同，造成实战中的技术打法有一些区别。因此，正确的回答就是：这些拳种本质上是一样的。对方即使一拳一脚都未击中我们的拳手，我们打中对手很多次，但只要没有KO，居然也会判平局），但我们的赢率，KO率是超越常规的，已经让泰国人惊掉了下巴。因为人们（泰国拳手们，教练们也一样）会把原因归结为我们的拳手是“格斗天才”“天生神力”等。\",\"url\":\"https://www.zhihu.com/question/318969830/answer/2570583263\"},{\"slug\":\"2022-07-10-为什么中国能控制住新冠肺炎疫情-全球却至\",\"year\":\"2022\",\"title\":\"为什么中国能控制住新冠肺炎疫情，全球却至今未能控制？\",\"date\":\"2022-07-10\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"之前我们的工人，身边的邻居不断中招，我们自己的两拨人马中招，都在刘老师的中药保护下轻松过关。最近的这一次，应该是孩子们去拳场比赛的时候中招的。症状与前两次新冠中招的两个木兰和宋老师一模一样。泰国人现在也把新冠当做一个普通的疾病来看，基本上没啥防疫措施了。我们清迈有四个人是明确得了新冠的，其他人可能是阳性无症状就过去了。两个木兰都中招新冠，而且病情还比较严重。很多新冠病人，就是肺部积水被“淹死”的。\",\"url\":\"https://www.zhihu.com/question/385980697/answer/2567235986\"},{\"slug\":\"2022-07-10-我们遭遇了新冠第三次来袭\",\"year\":\"2022\",\"title\":\"我们遭遇了新冠第三次来袭\",\"date\":\"2022-07-10\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"最近，小公主们遭遇了新冠的第三次来袭。症状与前两次新冠中招的两个木兰和宋老师一模一样。刘老师根据症状的需要，换了两剂经方，今天早上锻炼的时候，我看艾拉已经跟其他小公主们在一起锻炼了。泰国人现在也把新冠当做一个普通的疾病来看，基本上没啥防疫措施了。我们清迈有四个人是明确得了新冠的，其他人可能是阳性无症状就过去了。不过：木兰们告诉我的消息，让我发现：新冠对于某些生活方式不良的人来说，恐怕后果也很严重。\",\"url\":\"http://zhuanlan.zhihu.com/p/539772376\"},{\"slug\":\"2022-07-06-传武格斗技术-化打合一-零距离发力与哼哈\",\"year\":\"2022\",\"title\":\"传武格斗技术：化打合一  零距离发力与哼哈二气\",\"date\":\"2022-07-06\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"本文为传武技术深度研究文章，不懂格斗的人，就不用看了。如果她们真的认真学了泰拳专业技术的话，会很厉害的，可以当格斗天才了。木兰们打一个直拳出去，居然不转身，不扭胯，不摆肩，就是简单的瞎挥一下打出去，特别没技术含量。会不会是木兰们拥有的特种的格斗专业技术，专门打破了泰拳技术的？所以，我必须用她们不懂的技术，和方法，就算是乱打一气，她们就会乱套，才有可能赢。的确，传武功夫差一点，就根本没有发挥的余地。\",\"url\":\"http://zhuanlan.zhihu.com/p/538199240\"},{\"slug\":\"2022-07-05-为什么传统武术作为国粹却鲜有参加格斗比赛\",\"year\":\"2022\",\"title\":\"为什么传统武术作为国粹却鲜有参加格斗比赛?\",\"date\":\"2022-07-05\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"的确很少，但不是没有。清一太极选手们正走在征泰的路上……\",\"url\":\"https://www.zhihu.com/question/305017210/answer/2559338219\"},{\"slug\":\"2022-07-05-太极征泰第6-7-8场战报-明晓一对二获\",\"year\":\"2022\",\"title\":\"太极征泰第6，7，8场战报：明晓一对二获胜\",\"date\":\"2022-07-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨晚的征泰比赛打了三场，一胜（KO获胜），一负（点数负），一平局。第六场比赛，是明晓上场，这是她的征泰第三场比赛。对手是13岁开打，已经收获了50战的老资格泰拳选手，结果是第二局就轻松地KO对手。因此，明晓面对顽强抵抗的泰拳手，不自主加大了攻击力，于是搞笑的局面就出现了：刚到第二局，明晓就KO了对手。她在场上的实战中，已经打出了太极野马分鬃的威力。太极征泰第七场比赛，是木兰佳惠的第四战。\",\"url\":\"http://zhuanlan.zhihu.com/p/537753601\"},{\"slug\":\"2022-07-03-如何看待美国一素食主义母亲长期喂婴儿果蔬\",\"year\":\"2022\",\"title\":\"如何看待美国一素食主义母亲长期喂婴儿果蔬致其饿死？长期吃素对身体有哪些影响？\",\"date\":\"2022-07-03\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我家一个亲戚的老人，传说是吃鸡骨头卡住喉咙死了。还有我一个练武朋友的师父，也是吃鸡，骨头卡住了喉咙，他运劲一吐气，骨头出来了，喉咙也大出血，也死了。我猜如果统计下来，吃鸡吃死的人，恐怕会很多。素食个别人吃错了，吃死了，就有人拿出来：说是素食全体都错了。网上一堆无脑喷子乱喷，素食肯定是没有问题的，本来吃肉也没有太多的问题---对某些群体而言。但你用先进昂贵的果蔬汁来喂养婴儿，不被你养死才怪。\",\"url\":\"https://www.zhihu.com/question/541176757/answer/2557019257\"},{\"slug\":\"2022-07-02-赵道新论中国武术-访谈第三天的商榷\",\"year\":\"2022\",\"title\":\"赵道新论中国武术（访谈第三天的商榷）\",\"date\":\"2022-07-02\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"中国武术理论和技术的破裂由此与日俱增了。赵：中国技击若想发展，现在试行的拳术分类法必须全部打破。清一点评：我完全不同意赵道新的这种说法。但对于外国人来说，这种被中国武术放弃了的动作，因为对普通人来说非常具有威胁力，反而成了泰拳标配。清一点评：黄显然不同意赵的观点，但他勉强说出来的刚柔区分，其实真的是中国武术最奇怪的一种方式。当然，赵道新说的中国武术人，喜欢一个人偷偷的练，没有伙伴，不愿意对练。\",\"url\":\"http://zhuanlan.zhihu.com/p/496771840\"},{\"slug\":\"2022-07-01-清一木兰第六第七战比赛海报\",\"year\":\"2022\",\"title\":\"清一木兰第六&第七战比赛海报\",\"date\":\"2022-07-01\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本场在美国国庆日举办的泰拳比赛，木兰们是唯一的“外国人”。民间身份的木兰们，将代表中国而出战，在海外孤独地守护着中华武士的尊严。征战的对象，是号称“世界最强站立格斗”的泰拳，木兰们要用中华武术打破“泰拳五百年不败”的传说。(二维码自动识别)这是木兰们的最新比赛安排，时间是7月4日，好像是美国国庆日？这一次，两个木兰都有比赛。只要木兰们小心一点，不要被泰国人KO就行了，也尽量不要受伤。\",\"url\":\"http://zhuanlan.zhihu.com/p/536492407\"},{\"slug\":\"2022-06-30-泰拳与踢拳有什么区别\",\"year\":\"2022\",\"title\":\"泰拳与踢拳有什么区别？\",\"date\":\"2022-06-30\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"日本踢拳冠军和泰拳冠军的网座争夺战。可以说明踢拳和泰拳的区别。这是日本的第一个女子获得了踢拳冠军，男子的第一个是播求。\",\"url\":\"https://www.zhihu.com/question/307586770/answer/2552190786\"},{\"slug\":\"2022-06-28-木兰佳惠被泰国拳馆教练用棍子打\",\"year\":\"2022\",\"title\":\"木兰佳惠被泰国拳馆教练用棍子打\",\"date\":\"2022-06-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨天，小木兰们周末赛事后，去泰拳馆“报到”。很多泰拳馆教练对拳手非常刻薄，一点钱都要抠光的。佳惠的另外一半出场费，就用来请馆里面的全体拳手们一起去外出吃饭。因为她“没有打出教练教给她的泰拳技术”来。但这一场比赛，佳惠的泰拳馆却十分不满意，集体开“佳惠练拳不用心批斗会”。她这样代表拳馆去打泰拳，会让人以为他们的拳馆，对训练拳手不认真，要求不高，胡乱教拳后就被没训练好的拳手送出来打比赛了。\",\"url\":\"http://zhuanlan.zhihu.com/p/534824116\"},{\"slug\":\"2022-06-27-木兰佳惠对手的实战视频\",\"year\":\"2022\",\"title\":\"木兰佳惠对手的实战视频\",\"date\":\"2022-06-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"上一文章中，提供了木兰佳惠的第三场实战视频。你们看到的泰拳对手，似乎是软弱不堪的，面对木兰，她根本就无法发出像样的攻击。小木兰们今天拿到了她两周前比赛的视频，她是比赛中的红方，本场比赛的赢家。跟她和佳惠打的时候相比，凶猛多了。所以，别以为小木兰的对手很羊，是她遇到了老虎，不得不“羊相十足”。因为太极格斗，将完全破坏对手的格斗思路，迫使对手在自己完全不熟悉的系统中作战，因此当然就失去了胜利的可能。\",\"url\":\"http://zhuanlan.zhihu.com/p/534429864\"},{\"slug\":\"2022-06-26-太极征泰第五战视频及点评-太极和泰拳的不\",\"year\":\"2022\",\"title\":\"太极征泰第五战视频及点评：太极和泰拳的不同\",\"date\":\"2022-06-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"比赛后木兰佳惠在拳场的留影昨晚在清迈塔佩门附近泰拳馆比赛现场，木兰佳惠轻松击败了泰国对手，取得了清一太极征泰第五场比赛的胜利。为了做一个对比，我把泰拳的纯泰比赛视频，也放了一个出来供你们比较。纯泰比赛：泰拳女子冠军争夺战这个视频中，蓝衣拳手是泰拳的国家队队员，前泰拳女子全国冠军，也是木兰们同拳馆的拳友，刚打完国际比赛回馆。对比太极对泰拳---木兰佳惠的第三场比赛，两者非常不一样。\",\"url\":\"http://zhuanlan.zhihu.com/p/533876532\"},{\"slug\":\"2022-06-24-一份价值3万元的咨询回答-拿走不谢\",\"year\":\"2022\",\"title\":\"一份价值3万元的咨询回答，拿走不谢\",\"date\":\"2022-06-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"上一周咨询的2020届突破班家长提的问题，家长捐款了3万元资助清一武道馆。不能让家长白花钱，所以我提供了教育咨询服务，解决家长的困扰。家长对本次咨询的反馈非常良好，说解决了他们关心的重要教育问题。这些问题也公开出来，有心人可以白赚绝不仅仅是3万元。比如：我们教孩子至上思维，精英意识，就是要让孩子拥有一种“自命不凡，不甘平庸”的思维和价值观，就像伊顿公学的孩子们一样。\",\"url\":\"http://zhuanlan.zhihu.com/p/530091945\"},{\"slug\":\"2022-06-22-中华真女-能打过泰国伪娘吗\",\"year\":\"2022\",\"title\":\"中华真女，能打过泰国伪娘吗?\",\"date\":\"2022-06-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"下图是本周末安排的泰拳赛的海报。比泰国的冠军女拳手，实力硬度都要差一些。当然了，每次去拳馆，都是跟泰拳的男冠军打模拟实战的小木兰，连女拳冠军都不当回事的人，要来打女生，当然觉得不过瘾了。不过，我认为泰国还没有能够打赢我们木兰的女生，因此我并不担心。我倒是有一个新的创意：要不这次去比赛的时候，我们就跟主办方说：下次可以安排我们的小木兰，与这个泰国伪娘打一场实战比赛，真女人打假女人，肯定会很卖座的。\",\"url\":\"http://zhuanlan.zhihu.com/p/532223831\"},{\"slug\":\"2022-06-21-拳击的前手拳-与太极格斗有何不同\",\"year\":\"2022\",\"title\":\"拳击的前手拳，与太极格斗有何不同？\",\"date\":\"2022-06-21\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"以拳击为代表的“现代格斗”，采用的是“弱侧置前”，把不太能够发出力量的手，一般是左手，作为“前手”，而把最重要的打击手，往往是右手，作为后备队，放在后面。从意图上来看，你就可以清晰地知道：前手拳，由于无法发出外家拳需要的力量，因此是不太重要的拳。这是用两个前后距离不同的圆圈，防止了对方对于头部的袭击，基本上不太可能漏手进来。因此是否练出了“身步合一”的前手拳，就是一个太极格斗手是否合格的标志。\",\"url\":\"http://zhuanlan.zhihu.com/p/531894405\"},{\"slug\":\"2022-06-20-中国传武需要博采众长完善自己吗\",\"year\":\"2022\",\"title\":\"中国传武需要博采众长?完善自己吗？\",\"date\":\"2022-06-20\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"武术能够真正的博采众长，完善自己，要跟现代搏击学习，采取别人行之有效的训练技术和方法，不要抱残守缺，坚持自己的传统不改变。只有中国武术比现代搏斗更成熟，更完善，中华武术才有必要“发扬光大”。但不需要认为：我们中国武术，还需要去学习现代格斗的技术来“完善自己”---除非你认为它比你高明。这些要求传武博采众长的人，往往是体制内的专家，大师。其实，中国能够流传下来的每一门派，都有自己独特的格斗哲学。\",\"url\":\"http://zhuanlan.zhihu.com/p/515948006\"},{\"slug\":\"2022-06-19-你知道中国武术里哪一招最厉害\",\"year\":\"2022\",\"title\":\"你知道中国武术里哪一招最厉害？\",\"date\":\"2022-06-19\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"而是你真正练出来的有效的这一招，才会厉害。如果让我说传武最厉害的招数：我说太极的云手最厉害！但绝大多数人不知道云手的实战厉害，不意味着没有人知道。但：泰拳手从此知道，用一般的泰拳攻击技术，对付小木兰是无效的。所以，我好心奉劝这些想练传武的武术爱好者：别去想象中国武术有啥奇怪的招数，你去学了一招，就天下无敌了。中国人被一些传武骗子忽悠很多年，看金庸的小说看多了，光知道招数的重要性。\",\"url\":\"https://www.zhihu.com/question/502557287/answer/2535686233\"},{\"slug\":\"2022-06-18-著名策划人叶茂中去世-年仅-54-岁-如\",\"year\":\"2022\",\"title\":\"著名策划人叶茂中去世，年仅 54 岁，如何评价他的广告作品和艺术思维？这为广告行业发展做出了哪些贡献？\",\"date\":\"2022-06-18\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"刚知道叶茂中去世，没想到这么年轻就去世了。第三还说明：别指望西医，他们治不了真病的。他是一个曾经很著名的广告策划人，我在武汉大学讲广告学的时候，他还是广告策划界的明星人物。其实---80年代这波的疯狂商业运动过去之后，他的策划套路，好像已经过时了。而是用这些钱来投资股票，从而获取了比他做广告时候更高的收入，他是不炒股的人，走的是长期投资的路线，看准了就长持，当然，这个资金量，也只能这样长持。\",\"url\":\"https://www.zhihu.com/question/511570918/answer/2534212811\"},{\"slug\":\"2022-06-17-还魂记-乌克兰新闻-；乌明确表\",\"year\":\"2022\",\"title\":\"还魂记｜2022-01-31：乌克兰违约明斯克协议，战争系乌方挑起\",\"date\":\"2022-06-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"1月份，【乌明确表示不会执行明斯克协议】，回过头来看，非常明显的，这场战争就是乌克兰挑起的。违背美国和西方来背书和签署的国际协议，其实是乌克兰，而不是俄罗斯。当年美国要防止俄罗斯扩大战争，现在又挑起战争。俄罗斯现在要的，绝对不再是【明斯克协议】了，这份协议，其实对乌克兰是一种很好的保证----如果她没有挑战大国的野心的话。现在泽连斯基回头看，会不会后悔当初的违约？乌明确表示不会执行明斯克协议；……\",\"url\":\"https://www.zhihu.com/pins/1521198597529534464\"},{\"slug\":\"2022-06-13-实战太极的拳法与现代格斗有何不同\",\"year\":\"2022\",\"title\":\"实战太极的拳法与现代格斗有何不同？\",\"date\":\"2022-06-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"所谓的现代格斗拳法，基本就是直拳，勾拳，摆拳的各种组合应用。不过：对于太极格斗手来说，拳击只是我们需要对付的一个对手，但不是我们学习的对象。其实，太极出拳，与现代格斗的重大区别，就是只有“圈手拳”，没有“直线拳”的。很多太极门人以为是一个防守格挡的动作，你这样想就完全不懂格斗了：现代格斗，等你看清对方招式，然后去格挡？另外，与现代格斗的“直勾摆”，都是用拳面打人不同。\",\"url\":\"http://zhuanlan.zhihu.com/p/528096047\"},{\"slug\":\"2022-06-11-太极女拳打泰国男拳-真有希望吗\",\"year\":\"2022\",\"title\":\"太极女拳打泰国男拳，真有希望吗？\",\"date\":\"2022-06-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"这是本周小木兰去泰拳馆跟泰拳手们练实战对练的视频记录，大家可以看看：太极女拳手，跟泰国男拳手的差距有多大？每天泰拳手们都要打多场训练赛，因此他们场上应对经验都很丰富，比中国拳手相对更成熟一些。也因为不适应太极的连发防守，所以有经验的泰拳老手，会上场后，发现不对劲，就立即转为“防守模式”，而且把防守距离拉得很开。她用太极神功，真把泰拳，日本拳都打翻了，还用的着打徒弟来证明自己吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/527377193\"},{\"slug\":\"2022-06-10-唐山某路烧烤店-男子骚扰女子未果挨骂-随\",\"year\":\"2022\",\"title\":\"唐山某路烧烤店，男子骚扰女子未果挨骂，随即动手打人，将受到哪些惩罚？出门在外如何保护好自身安全？\",\"date\":\"2022-06-10\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"都在说一些没啥价值的讨论，更像是吃瓜群众，无法联系到自己身上。比如这些高赞回答，重心都在：如何处理这群混混的焦点上。但对于我们的每个个体来说，如果避免这种小事情，发生在自己身上，才是最重要的。比如，我看到了这种事情，我就会设想：假如是我女儿，将来可能会遇到这种事情，我怎样教她？我女儿的朋友，将来外出，遇到这种事情，比如她身边几个正在打泰拳的小木兰，遇到这种流氓混混，该怎么办？\",\"url\":\"https://www.zhihu.com/question/537038241/answer/2523319604\"},{\"slug\":\"2022-06-02-中国官方散打征泰史-血泪斑斑的格斗之路\",\"year\":\"2022\",\"title\":\"中国官方散打征泰史：血泪斑斑的格斗之路\",\"date\":\"2022-06-02\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"官方的格斗手，比不过泰拳，我们民间的爱好者们，就掏钱自己训练，自己来泰国完成征泰比赛吧。如果中国的男拳手不行了，没人来KO泰国人，就让我们的小木兰们来KO泰国拳手好了。就像中国女足与中国男足一样，起码先为中国人争取一点面子，不是男女都不行。唯一败的一场比赛，还是泰国裁判帮忙泰国人赢的。打满五局，都是我们在追着泰国的金腰带狂打，但就是因为没有KO，裁判我们输了。场面比播求输给一龙的场面差距更大。\",\"url\":\"http://zhuanlan.zhihu.com/p/523475450\"},{\"slug\":\"2022-05-30-泰拳高手会如何应对实战太极“迎门三脚”\",\"year\":\"2022\",\"title\":\"泰拳高手会如何应对实战太极“迎门三脚”？\",\"date\":\"2022-05-30\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"感谢这些泰拳冠军拳手，让我们深入了解到泰拳手的实力深浅高低。如果仅仅要求是对付同样练了三五年的普通泰拳男拳手，小木兰们，目前已经没有啥困难了。泰国的女拳手，在对付木兰们的迎门三脚时，基本上是“没有办法”的。但资深的高手，还是能够找到机会。泰拳高手如何破迎门三脚，还有第二种方式，就是采用严密的“提膝防守”。第三种对付太极迎门三脚的手段，就是泰拳手们远距离没优势，身法步法也没优势，就只能打近战了。\",\"url\":\"http://zhuanlan.zhihu.com/p/521615639\"},{\"slug\":\"2022-05-27-总算找到中国功夫到处丢人现眼的原因了\",\"year\":\"2022\",\"title\":\"总算找到中国功夫到处丢人现眼的原因了\",\"date\":\"2022-05-27\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"比聪明，比技巧，中国功夫中很多拳种，都是超过泰拳的。因此，中国功夫是踏实，还加上了聪明，才能练出来的。但是，中国有这么好的功夫，老祖宗有这么好的技术储备，为啥现在几百年了，就是打不过日本人，打不过泰国人？我发现：中国人跟泰国人，日本人最大的不同，就是中国人实在太聪明了。现实中找不到的中国功夫，都会被他们在“实战中”想象出来。比如在中国自己拍的影视剧中，我们看到了“中国功夫天下第一”的表现。\",\"url\":\"http://zhuanlan.zhihu.com/p/520889130\"},{\"slug\":\"2022-05-27-长短结合-太极征泰三招\",\"year\":\"2022\",\"title\":\"长短结合，太极征泰三招！\",\"date\":\"2022-05-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"泰拳有几个优点和长处，如果你克制不了，就会输掉比赛。三：泰拳手体能超强体能不够，比赛坚持不下来，也输。因此，“太极征泰三招”之第一招，也是最重要的一招，就是：太极迎门三脚。如果这三腿，没有“太极发力技术”来配合的话，就只能是花拳绣腿。因此：太极格斗的征泰第二招，就是太极36杀招之“长拳滚砍”。对手的弱项，就是我们要主攻的项目，太极征泰第三招，就是“太极连环肘”，或者叫做“太极滚肘”。\",\"url\":\"http://zhuanlan.zhihu.com/p/515803033\"},{\"slug\":\"2022-05-26-转载-达里奥-目前最大的风险是货币价值的\",\"year\":\"2022\",\"title\":\"转载：达里奥  目前最大的风险是货币价值的风险。\",\"date\":\"2022-05-26\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"随着货币不断的泡沫化，最大的风险是货币价值的风险。货币是一种交易媒介，是一种财富的储存手段，所以货币就是债。如果把货币作为资产来持有，国家就可以给你很多纸币，而纸币是会贬值的。最为重要的是，在世界上最主要的储备货币方面，我们只有回到20世纪30年代，才会发现与当今类似的情况。观察这些现象促使我去理解过去500年里世界主要大国以及储备货币的兴衰，并促使我去研究自7世纪初的唐朝以来中国的各个朝代。\",\"url\":\"http://zhuanlan.zhihu.com/p/520167009\"},{\"slug\":\"2022-05-21-道新拳论-2-中国武术界的学院派和民间\",\"year\":\"2022\",\"title\":\"【道新拳论】2：中国武术界的学院派和民间派\",\"date\":\"2022-05-21\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"赵：这是实话，你不像其它拳师一边虚伪地把“打人”划为肤浅和罪孽，一边冠冕堂皇地谈什么武术技击，谈什么哲学大道。因为一百多年来，就没有发现中国武术有和世界格斗界能够接轨的“技击性”实战案例，我们只在电影中，传说中，知道中国人狂殴外国人的故事。即使是泰拳的“八体技”，虽然加上了肘膝技术，但他的发力技术跟不上要求，和中国传武的“三节要论，全身拳”相比不是一回事。当然，你可以说：这只是中国古书上的拳论。\",\"url\":\"http://zhuanlan.zhihu.com/p/496492578\"},{\"slug\":\"2022-05-16-吃肉才是科学-吃谷物就是不科学吗\",\"year\":\"2022\",\"title\":\"吃肉才是科学，吃谷物就是不科学吗？\",\"date\":\"2022-05-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"实际上，真正的科学就是：任何东西，吃到胃里面，都会被生物酶所分解，通过小肠，把其中的“营养”送到血液里面，把废物作为粪便排泄掉。这不是科学，这是科学教徒。就算你认为蛋白质真的有用（很多科学研究的结论，是不支持这个观点的），动物蛋白，和植物蛋白本质上也差不多。成天嚷嚷不吃肉就不行的人，根本不懂科学，你们只是模仿复制利益集团灌输的言论罢了。平时就是不吃猪肉，甚至不吃碳水（不吃谷物类食物）】。\",\"url\":\"http://zhuanlan.zhihu.com/p/514940531\"},{\"slug\":\"2022-05-14-从格斗的眼光看-跆拳道就是一个笑话\",\"year\":\"2022\",\"title\":\"从格斗的眼光看，跆拳道就是一个笑话！\",\"date\":\"2022-05-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"它只是一种体育比赛的技术，不是一种格斗技术。花拳绣腿跆拳道我看了跆拳道的专业比赛视频。以一个格斗手的眼光来看，我觉得：啥跆拳道？我估计，这和跆拳道的规则有关：只要碰到你有效部位就计得分。所以，看起来跆拳道的运动员，就是只会用腿了。这一点，站立格斗中，应该是泰拳手应对的最好。江畑秀范vs佐野勇海–日本跆拳道国手RIZIN踢拳首战_哔哩哔哩_bilibili再看一个跆拳道打泰拳的视频。\",\"url\":\"http://zhuanlan.zhihu.com/p/514133480\"},{\"slug\":\"2022-05-13-泰国人认怂-单方面取消一对二擂台比赛\",\"year\":\"2022\",\"title\":\"泰国人认怂：单方面取消一对二擂台比赛\",\"date\":\"2022-05-13\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"近几日：泰方的泰拳经纪人通知我，泰方主办者单方面取消了原定5月15日举行的【一对二比赛】。泰国人的出尔反尔，我们已经习惯了。上一次的比赛，打金腰带拳手，我方五局，都是不断追打对方的金腰带，结果泰方居然判我方失败。我只是问他：今天的比赛，你认为泰方拳手真的打赢了吗？拿来对付泰国人，一打二，一打三，我都完全有信心。正在我们准备怎样一对二，轻松击败泰拳手的时候，却得到消息：给我们安排的比赛，突然取消！\",\"url\":\"http://zhuanlan.zhihu.com/p/514002872\"},{\"slug\":\"2022-05-12-读文科的目的和意义是什么-真哲学是学啥的\",\"year\":\"2022\",\"title\":\"读文科的目的和意义是什么？真哲学是学啥的？\",\"date\":\"2022-05-12\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"如果你同意这一点，你读书的目的就是要获取一个好工作，你该读什么书？所以，可以说：现代的社会，读文科的目的，如果是谋取一个饭碗的话，你就算了，别自己骗自己。那么，大学的专业，除了极其有限的“职业价值”之外，文科难道就真的就没有任何存在的意义吗？如果你学文科，居然目标不是做圣人，也浪费了去做工具人的机会。就以我熟悉的大学哲学专业来说，我始终不知道设置这个专业的目的是什么。\",\"url\":\"http://zhuanlan.zhihu.com/p/513327786\"},{\"slug\":\"2022-05-11-千万不要读文科系列之-读文科的正确姿势\",\"year\":\"2022\",\"title\":\"千万不要读文科系列之：读文科的正确姿势\",\"date\":\"2022-05-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"但我接近20年前，写过一系列的文章：千万不要读文科系列。当然，并不是我的文科人生很失败，所以否定自己所学的专业。但我的大多数文科生同学，人生的确，就算不说失败，至少也很平庸，往往被社会边缘化，很难融入世界。据说：现在大学毕业之后，找不到工作，只能去送外卖的大学生，甚至研究生，绝大多数都是文科生。哪有过去学真文科的庄子，一样的气度：给个总理的位置和千万金子的年薪，都一副不理不睬的样子。\",\"url\":\"http://zhuanlan.zhihu.com/p/512976048\"},{\"slug\":\"2022-05-07-赵道新访谈录-1-中国武术没有技击性\",\"year\":\"2022\",\"title\":\"【赵道新访谈录】1  中国武术没有技击性？\",\"date\":\"2022-05-07\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"——————赵道新：“中国的武术中最大的骗局，我认为就是所谓的“有技击性”。黄：如果我设听错，您是在谈中国功夫根本没有技击性。我作为一个“武林之外”的闲人，跟“中国武术界”基本没有关系。赵道新先生访谈录----黄积涛整理第一天黄：(在简短的问候之后)现在，社会上的一些声音很刺武术家的耳朵。所以，只有用“格斗”来作为评价中国武术的标准，才能重新焕发中国武术的“技击性”。\",\"url\":\"http://zhuanlan.zhihu.com/p/496504901\"},{\"slug\":\"2022-05-07-十四-女-想学实用性比较强的武术-万一遇\",\"year\":\"2022\",\"title\":\"十四 女，想学实用性比较强的武术（万一遇到校园暴力？）有没有很快制敌大概四两拨千斤那种？\",\"date\":\"2022-05-07\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"有没有很快制敌大概四两拨千斤那种实用武术？制敌越轻松，越有效，就要求使用者的技术越高超，越难学。你想要得到“四两拨千斤”的这种武功，轻松战胜对手，大约就需要在你学会击败金腰带的泰拳手之后，还要继续努力学习提高十年左右，大约就能得到你想要的“快速，轻松，有效，不费力制敌”的高级武功了。我建议你练另外一种更实用，更有效的超级武功：绝对的轻松，有效，四两拨千斤，对于女孩子们来说，对付校园霸凌应该够用了。\",\"url\":\"https://www.zhihu.com/question/367842110/answer/2473921833\"},{\"slug\":\"2022-05-07-日本武士的传统食物是什么\",\"year\":\"2022\",\"title\":\"日本武士的传统食物是什么？\",\"date\":\"2022-05-07\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"作为一个格斗运动员，身体的健康是第一位的，所以：吃什么？练武，就是身体的健康第一，要做有限考虑体能第一，恢复力第一的情况下，来考虑吃什么食物。各位了解一下：日本过去的“中产阶级”---武士阶层的“传统食物”。日本人在食物上的节制，导致了这个国家是世界上最长寿的国家。观察日本武士的食物，比中国的绿林英雄们“大块吃肉，大碗喝酒”要科学得多。日本武士的食物，主要是晚餐依然有“丰富”的倾向。\",\"url\":\"http://zhuanlan.zhihu.com/p/510535004\"},{\"slug\":\"2022-05-05-三年拿世界冠军-是吹牛-还是科学的规划\",\"year\":\"2022\",\"title\":\"三年拿世界冠军是吹牛还是科学规划：2025年已经兑现还是科学的规划？\",\"date\":\"2022-05-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我在这次的深圳分享会上，公开宣布了我要培养学生学习太极实战格斗，最早三年，最晚五年内，就要拿到现代格斗的世界冠军。原话记录是这样的：【我今年吹嘘了一下，自己都觉得吹得太过分了一点。我说我们要培养中华武术的传人，用三年的时间，不超过五年，去取得现代格斗的世界冠军。所以，2019年，我就选了20多个年轻人出来，专攻实太极，专打世界格斗冠军。其实，当年说：三年拿到格斗世界冠军，并不是我拍脑袋乱说的数字。\",\"url\":\"http://zhuanlan.zhihu.com/p/509815502\"},{\"slug\":\"2022-05-02-武术“资格比较”的标准是什么\",\"year\":\"2022\",\"title\":\"武术“资格比较”的标准是什么？\",\"date\":\"2022-05-02\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"在中国，传武界的人，彼此在一起盘道，喜欢问的，说的往往就是：本人练了多少年拳了（比年资）。所以，如果一群“武林人士”聚会，在一起，就是讲讲各种武林的闲话，老故事，再一起练练拳，活动一下身子，一起喝酒吃肉，一生这样过来，似乎很自在。泰国拳手如果新认识的在一起，彼此会讲什么呢？你赢了现代格斗的高手，你说自己是太极，是“认祖归宗”，把荣誉献给太极。这个学员吹嘘的大师，一看就不是练武的样子，什么大师？\",\"url\":\"http://zhuanlan.zhihu.com/p/508477741\"},{\"slug\":\"2022-04-29-泰拳决战-一个木兰能打赢两个泰拳手吗\",\"year\":\"2022\",\"title\":\"泰拳决战，一个木兰能打赢两个泰拳手吗？\",\"date\":\"2022-04-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"而且，泰国拳手如果打赢了我们，我同意支付高额奖金给对方。当然，我认为他们万一打不赢，只要没有KO泰拳手，他们还照样可以用“潜规则”。这个技术，一旦小木兰们练出来了，男拳手都不是对手（我指的是男子泰拳金腰带，同重量级的，如果用滚肘，就不再有优势。由于下个月15日，很有可能会遇到两个比现在的金腰带更优秀的拳手，所以，为了不被对方KO，我们要有备而战，这一次必须拿出我们的【杀手锏】来了。\",\"url\":\"http://zhuanlan.zhihu.com/p/507167866\"},{\"slug\":\"2022-04-28-泰式正蹬-与清一木兰穿心腿-有何区别\",\"year\":\"2022\",\"title\":\"泰式正蹬，与清一木兰穿心腿，有何区别？\",\"date\":\"2022-04-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"虽然有一个号称【泰拳穿心腿沙玛】的高手，我找他的视频来看，没啥特别的。两个拳手都喜欢用正蹬腿互相攻击，你们看一下。木兰明晓的穿心腿，只要能有效击中三次以上，对手就面临被KO的命运了。但这个泰国拳赛中，红衣女被泰式正蹬腿击中后，退步多次，却基本上没有造成真正的伤害，关键是，居然一点实战能力都没有降低，甚至没有改变打法。第二局，她被正蹬有效击中两次，第一次也是被击退几步，第二次，居然被击倒了。\",\"url\":\"http://zhuanlan.zhihu.com/p/506728978\"},{\"slug\":\"2022-04-27-克制泰扫的方法-和格斗水平高低评价\",\"year\":\"2022\",\"title\":\"克制泰扫的方法，和格斗水平高低评价\",\"date\":\"2022-04-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"不过，如果各位用胜负的结果来评价水平高低，就是不懂拳了。一点也看不出冠军拳手，“金腰带”的格斗水平。其实，如果佳惠采用了明晓的格斗战法，这个看起来强悍的对手，也是一样的结果，打不出啥水平来了。最快的一场，才开始10秒钟，双方刚第一次交手，一个低扫，扫到对方的小腿处，就看对手就直接倒下，站不来了。泰拳手为了应对泰扫，也没啥有效的好办法，基本上，就是要用各种手段，来提高身体的硬度。\",\"url\":\"http://zhuanlan.zhihu.com/p/505836168\"},{\"slug\":\"2022-04-26-昨天决战结果-拿了一条金腰带；另一条泰国\",\"year\":\"2022\",\"title\":\"昨天决战结果：拿了一条金腰带；另一条泰国人死活不给\",\"date\":\"2022-04-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"也就是有金腰带两条，不过我们第一场，是木兰佳惠对从小学拳的泰拳馆长的冠军女儿。所以尽量不用我们的绝招，来快速的KO对手，结果，一路赢下来，最终泰国方判我们输了比赛。好吧，你们自己看实况录像，视频上来让你们看一个从第一局开始，就是每局都被追着打的泰国金腰带（蓝方），是如何最终赢的最终比赛的。起码泰国人，愿意让我们不知名的新拳手，上去跟他们的金腰带打，也算很给面子了。木兰明晓拿下了另一条金腰带。\",\"url\":\"http://zhuanlan.zhihu.com/p/505089200\"},{\"slug\":\"2022-04-25-传统武术是否真的像网上讲的那样是从兵器功\",\"year\":\"2022\",\"title\":\"传统武术是否真的像网上讲的那样是从兵器功夫上蜕变下来的，精髓在器而不在拳？\",\"date\":\"2022-04-25\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"传武的确不是兵家的战场武术，是中国古人斗殴，护身，保镖等的技术，是不可能不能实战的。第一：打不过现代格斗的传武，不是真传武。传武流传下来的一些实战流派，只要真的好好练了，击败现代格斗是毫无问题的。第二：传武不能打，不是传武的问题，而是传人的问题。这些都要根据比赛规则和要求来制定具体的战术。第三：只有以“打”来衡量传武的含金量，用打来证实自己的门派，才能成就中华武术的真实面貌。\",\"url\":\"https://www.zhihu.com/question/529813654/answer/2456035409\"},{\"slug\":\"2022-04-23-资讯-泰拳手是怎样备战的\",\"year\":\"2022\",\"title\":\"资讯：泰拳手是怎样备战的？\",\"date\":\"2022-04-23\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"问题提要：1：正宗的泰拳手在比赛之前，是怎样备战的？昨日，“消失多日”的小木兰们，终于去泰拳馆，与男拳手们一起做赛前的备战练习了。所以，特别给小木兰们，强调了泰拳手的“备战要求”。他认为：泰拳备战，最重要的事情，是每天的15公里跑步。泰拳备战的第二项最重要的事情，就是打人靶。这让我们的小拳手，要弄明白的一点就是：你站到擂台上，千万不要像靶师一样站着，等着被泰拳手来这样打。\",\"url\":\"http://zhuanlan.zhihu.com/p/503671836\"},{\"slug\":\"2022-04-22-实战太极的级别高低-是怎样划分的\",\"year\":\"2022\",\"title\":\"实战太极的级别高低，是怎样划分的？\",\"date\":\"2022-04-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"为何说能够实战，能打败现代格斗拳手，还只是真太极的入门级功夫？所以，如果我们的拳手，在实战中，能够击败泰拳金腰带拳手，能否证明她们就是新一代的太极高手？能打的太极，才可以自称“真太极”，实战太极。但也比“太极入门”高不了太多，所以依然算是“初级”的太极功夫。那么，更高级的太极实战功夫，是啥样的呢？第二级别，太极的更高级功夫，打法就是“放人难”的层次：放人，就是发放，可以把人打飞出去，却不伤人。\",\"url\":\"http://zhuanlan.zhihu.com/p/502857705\"},{\"slug\":\"2022-04-21-做到太极拳的“身步合一”有多难\",\"year\":\"2022\",\"title\":\"做到太极拳的“身步合一”有多难？\",\"date\":\"2022-04-21\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"上一次的实战，其实两孩子，还没有真正的做到“身步合一”。如果做到了，就不是上次第一局的局面了，双方看出来还“有攻有防”的局面了，泰方拳手和教练，既然还认为自己有机会拼一把，故一直在“死战”。这一次，一旦我们的小拳手一旦做到了“身步合一”，战场上，就是“一边倒”的局面，泰方选手将毫无进攻得手的机会，一进攻，就会被我们立即打回去。由于我方拳手，基本上已经练出了初级的“身步合一”攻防模式。\",\"url\":\"http://zhuanlan.zhihu.com/p/502429629\"},{\"slug\":\"2022-04-18-异种格斗-比UFC好看多了\",\"year\":\"2022\",\"title\":\"异种格斗：比UFC好看多了！\",\"date\":\"2022-04-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"现在日本兴起的一种格斗比赛，异种格斗，我认为可能代表未来的格斗趋势：练习各种格斗风格的人，都有机会来检验自己的实战能力。最后他又输给了巴西战舞卡波耶拉的选手岩流岛异种格斗大赛-OutEnemy2018_哔哩哔哩_bilibili，有点好玩。另外，这个异种格斗的比赛，更接近中国古代的擂台，而且如果三次被打下擂台，就判负。相比日本的异种格斗，谁的比赛设置，更有文化和文明呢?……\",\"url\":\"http://zhuanlan.zhihu.com/p/500367220\"},{\"slug\":\"2022-04-17-泰拳VS太极-力量和速度-变化的选择\",\"year\":\"2022\",\"title\":\"泰拳VS太极：力量和速度，变化的选择\",\"date\":\"2022-04-17\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"比如大象，强调了自己拥有“绝对力量”的优势，但你就别指望大象在速度上和变化上的优势了。这就是泰拳重视“打击力量”的特征。但是：泰拳为了重视力量的输出，而不得不牺牲了速度和变化，以及变化多端的攻击招式。这就是用灵巧的步法，身法，用太极的速度和变化，如水一样灵动，来取胜如山的泰拳。那么，特别强调“速度和变化”的太极，会不会牺牲攻击的力量呢？如果我说：太极在重视速度和变化的时候，力量输出，并不弱于泰拳。\",\"url\":\"http://zhuanlan.zhihu.com/p/500041957\"},{\"slug\":\"2022-04-16-视频-泰国金腰带拳手-打起来是啥样子\",\"year\":\"2022\",\"title\":\"视频：泰国金腰带拳手，打起来是啥样子？\",\"date\":\"2022-04-16\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们的小拳手，一周后要面对的泰国金腰带，大致上是什么水平的？我们的两个小拳手，身高体重，跟她们大致上是一个级别的，看样子年龄也差不多。我倒是期待我们的小拳手，有机会跟这个视频中的泰国女拳手碰一下，看谁更强。颁奖后，这个泰拳手身披泰国国旗拿奖杯，看起来还是很爱国的。从场上得到表现来看，泰拳手看上去和日本拳手就不是一个级别的，完全是压着打。看起来，还不如视频中这个据说只有17岁的泰国女拳手厉害。\",\"url\":\"http://zhuanlan.zhihu.com/p/499706508\"},{\"slug\":\"2022-04-14-如何看待大学生初学格斗被安排与「金腰带」\",\"year\":\"2022\",\"title\":\"如何看待大学生初学格斗被安排与「金腰带」拳手对打后去世？谁应该为事件担责？\",\"date\":\"2022-04-14\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"现在的媒体都在报道议论：初学拳的大学生，与金腰带在擂台实战中被打死，大家都议论纷纷。这次新安排的赛事，与上次我们小木兰去打的泰拳实战有关。我认为，我们可能需要用一年时间来打金腰带（我方训练的泰拳馆馆长也是这样做的，说是要明年，才有可能安排高级别的拳手来跟我们打冠军赛。不过，国内正在炒作【大学生被金腰带拳手36秒KO后去世】的热点，我们的初出门的小拳手就要与泰国金腰带对抗，是不是太不把生命当回事了？\",\"url\":\"https://www.zhihu.com/question/362089153/answer/2438596406\"},{\"slug\":\"2022-04-14-泰国金腰带拳手-指名挑战清一太极功夫\",\"year\":\"2022\",\"title\":\"泰国金腰带拳手：指名挑战清一太极功夫\",\"date\":\"2022-04-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"现在也才两个月，只是刚打过一场实战的初出门的小拳手，就接到了泰拳现任金腰带的挑战，要跟她们打残酷的泰拳擂台实战了。这次新安排的金腰带挑战新拳手的赛事，与上次我们小木兰去打的泰拳实战有关。山长清一：泰拳500年不败神话，正被清一太极终结但我们两场比赛，都毫无争议的优势赢了泰拳对手。所以肯定是这家拳馆，打败之后，去找来了拳馆里面最厉害的战友------泰拳的现任金腰带拳手，来挑战小木兰。\",\"url\":\"http://zhuanlan.zhihu.com/p/498069420\"},{\"slug\":\"2022-04-09-中华武林和泰拳交战的历史记录\",\"year\":\"2022\",\"title\":\"中华武林和泰拳交战的历史记录\",\"date\":\"2022-04-09\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"只有真正的中华武士，用拳头与现代搏击格斗，打出来的结果，才是真正的传武。我们要的是整体的，跨级别挑战的，甚至跨性别挑战的，无可非议的中国拳手，中国技术战胜泰拳的记录。就算我们没有成功，我们现在的中泰武术探索，也可以为其他的传武门派，积累一些与泰拳搏战的真实经验，开辟一个新的中泰武术文化交流的全新方式和记录。下面转发一篇记录中国武士与泰拳交战的记录，我们希望写下新的篇章！\",\"url\":\"http://zhuanlan.zhihu.com/p/495443356\"},{\"slug\":\"2022-04-09-泰拳-自由搏击-和中国功夫有什么区别和相\",\"year\":\"2022\",\"title\":\"泰拳 自由搏击  和中国功夫有什么区别和相似之处？\",\"date\":\"2022-04-09\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我们的目标，并不是击败个别的泰拳手，而是用泰拳规则，在泰国一直打下去，直到夺取泰拳冠军为止。如果我们成功了，可能就是创造了新的中国历史。即使我们没有成功，我们的探索，也可以为中国武术，开辟一个新的方式和记录。下面转发一篇记录中国武士与泰拳交战的记录，我们希望写下新的篇章！赛前泰国陆军署拳场展开盛大宣传，大赛命名“功夫拳复仇”，双方达成协议功夫拳手可赤手空拳打斗，自由发挥绝招（有的话）。\",\"url\":\"https://www.zhihu.com/question/26480179/answer/2430191339\"},{\"slug\":\"2022-04-08-泰拳研究-泰扫的技术特点\",\"year\":\"2022\",\"title\":\"泰拳研究，泰扫的技术特点\",\"date\":\"2022-04-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"文章写得不错，把泰扫的特点写得很清晰，应该是个练家子写的。泰拳手也是人，当他无法发挥自己特长技术的时候，跟普通人，也就没啥区别了。但对于每个研究泰拳的人，这篇文章还是很有价值的。泰扫，是所有的泰拳手最重视的技术。所以：一切传武技术，一旦不能抗衡泰扫的威力，你无法破掉泰扫的进攻，你说你的拳有多高明，就是吹牛的。实际这种打法并非硬抗，泰拳在防守上有着十分巧妙的技术，一点不比所谓“内家化劲”境界低。\",\"url\":\"http://zhuanlan.zhihu.com/p/495386955\"},{\"slug\":\"2022-04-05-当今社会-什么样的人能被称作知识分子\",\"year\":\"2022\",\"title\":\"当今社会，什么样的人能被称作知识分子？\",\"date\":\"2022-04-05\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"真正的知识分子（不是指拿了文凭的人），是社会的良心。所以，知识分子，也是文明社会的标志。一个不尊重知识分子的社会，是丛林社会，是没有资格称为文明社会的。人们总是会以一种异样的眼光，来看待这种不尊重知识分子的社会。理论上，知识分子，是具有独立人格的一个群体。而是知识分子，能不能拥有真正的独立人格和自由意志。就因为他是当年的“名士”，也就是说，他是当时知名的知识分子，杀他，就一定会影响他的人望和风评。\",\"url\":\"https://www.zhihu.com/question/43287315/answer/2423784611\"},{\"slug\":\"2022-04-05-知识分子-是文明社会的标志\",\"year\":\"2022\",\"title\":\"知识分子，是文明社会的标志\",\"date\":\"2022-04-05\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"真正的知识分子（不是指拿了文凭的人），是社会的良心。一个不尊重知识分子的社会，是丛林社会，是没有资格称为文明社会的。人们总是会以一种异样的眼光，来看待这种不尊重知识分子的社会。理论上，知识分子，是具有独立人格的一个群体。想想文革中，大批著名知识分子遭遇的命运和结果，就知道：文明社会，不是你装出来的歌舞升平的点缀。因为他要留下足够的文化符号和记录，证明自己是中国的杰出知识分子。\",\"url\":\"http://zhuanlan.zhihu.com/p/493193507\"},{\"slug\":\"2022-04-03-太极拳到底能不能出一个能打败散打的人\",\"year\":\"2022\",\"title\":\"太极拳到底能不能出一个能打败散打的人？\",\"date\":\"2022-04-03\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"原文：【要知道文无第一、武无第二，杨禄禅、杨班候能打遍京师无敌手，可说太极拳绝对能打。据说北京的杨氏太极拳和陈家沟太极拳不一样。杨禄禅在北京旗军教习时开始10套拳法都教了，可是练习要求严格，满清旗人不能艰苦学习，能练成的旗人只有几个人。这个观念，其实是很多太极人自动的思维模式：以为练的套路足够多，时间足够长，你就会用太极拳打人了。这是笑话来的：练了一辈子太极，根本不知太极拳理的人，太多了。\",\"url\":\"https://www.zhihu.com/question/305764478/answer/2421193854\"},{\"slug\":\"2022-04-03-太极拳现在为啥不能打人了-真太极该咋练\",\"year\":\"2022\",\"title\":\"太极拳现在为啥不能打人了？真太极该咋练？\",\"date\":\"2022-04-03\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"杨禄禅在北京旗军教习时开始10套拳法都教了，可是练习要求严格，满清旗人不能艰苦学习，能练成的旗人只有几个人。后来杨班候进京，他的思想与其父不同，不愿意把真功夫教给旗人，就收拳不要弟子练习10套拳法，只许练习太极拳大架。如果认同，你就必须承认：现在太极拳不能打，就是5套拳法，5套炮锤，现在没练全。这个观念，其实是很多太极人自动的思维模式：以为练的套路足够多，时间足够长，你就自动会用太极拳打人了。\",\"url\":\"http://zhuanlan.zhihu.com/p/492452787\"},{\"slug\":\"2022-04-01-传武一招野马分鬃-真能击败泰拳体系吗\",\"year\":\"2022\",\"title\":\"传武一招野马分鬃，真能击败泰拳体系吗？\",\"date\":\"2022-04-01\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"凭啥你一个中国人，就敢说:从古人传武系统中拿一招出来，就赢了五百年的泰拳？明明很多中国武术的招数，真的可破掉泰拳的，练好了就能轻松击败泰拳的。中国传武中，是没有扫腿这一招的，鞭腿，是散打模仿泰拳，踢拳创立的“新功夫”。但如果硬性要求“一招制胜”，要求只能用踢腿一招来赢，我们就只需不断踢出正蹬，连环的正踢腿，就真的足够战胜泰拳手了。中华武术宝库中，能够用一招，就击败泰拳的技术还有很多，不止这一招。\",\"url\":\"http://zhuanlan.zhihu.com/p/491330045\"},{\"slug\":\"2022-04-01-八极拳是否可以克制泰拳迅猛强大的攻击\",\"year\":\"2022\",\"title\":\"八极拳是否可以克制泰拳迅猛强大的攻击？\",\"date\":\"2022-04-01\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"传武真的练好了，用上一招，就可以赢泰拳，不仅仅八极，基本像样一样的传统拳，都有这种可以击败泰拳的招数。再说一句真正的实话，真心话：我也非常的不理解，明明很多中国武术的招数，都可破掉泰拳，击败泰拳的。由于我们这一招，泰拳手的王牌招数---强大的扫腿，就根本出不来了。会了，只要勉强能够应付泰拳的内围，也就可以过关了。拳法，其他的攻击手段，泰拳手其实不擅长，力量不大，所以不用担心。\",\"url\":\"https://www.zhihu.com/question/30733877/answer/2418207665\"},{\"slug\":\"2022-03-30-中国传武的希望在哪里\",\"year\":\"2022\",\"title\":\"中国传武的希望在哪里？\",\"date\":\"2022-03-30\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"我看到的中国武术门派，有不少技术，是能够战胜泰拳的。但泰国人不知道中国武术的技术特点，反而对我们是没办法的。不过，一旦真的练出来，传统武术的什么招，你都可以用来打人了。我以为:我现在第一个吃螃蟹，公开地示范了公认最没杀伤力的太极，在泰国的实战格斗中，居然真的打败了号称最凶狠的泰拳之后，会让中国一些传武人，生起信心来。学在民间，至少看来中华传武，是不能指望这批\\\"国家级人才”来指导的。\",\"url\":\"http://zhuanlan.zhihu.com/p/490376306\"},{\"slug\":\"2022-03-30-中国武术失传了吗\",\"year\":\"2022\",\"title\":\"中国武术失传了吗？\",\"date\":\"2022-03-30\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"中国武术现在还没失传，但已经快失传了。太极的格斗技术，拿一小部分来，得其一二，就可以胜泰拳了。我看到的中国武术，不少技术，都是能够胜泰拳的。我以为:我第一个来吃螃蟹，公开地示范了公认最没杀伤力的太极，在实战格斗居然打败了最凶狠的泰拳之后，中国一些传武人，会生起信心来。得其一二足以胜泰拳就行所以，你们就知道：这个国家队的散打总教练，对传武的理解力有多低了。而不是视频中的这个国家队前总教练的说法。\",\"url\":\"https://www.zhihu.com/question/318715457/answer/2415318212\"},{\"slug\":\"2022-03-29-中西格斗思维-分别解答“怎样才能击败世界\",\"year\":\"2022\",\"title\":\"中西格斗思维，分别解答“怎样才能击败世界冠军”这种问题？\",\"date\":\"2022-03-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天我看号称最精彩的UFC世界冠军挑战赛，张伟丽对乔安娜的视频，看完感慨万分。另外，这两个世界冠军，她们的移动方式和身法，步子比较僵硬，这种方式很累，体能消耗巨大。假如问一句话：你怎样才能拿到世界冠军，中西格斗思维，会怎样回答呢？其实西方格斗，泰拳，K1，散打，UFC等，都是完全一样的思维，回答就是三个词汇。如果是我，我才不用上面的西方格斗一元思维，来回答这个问题呢。\",\"url\":\"http://zhuanlan.zhihu.com/p/489809504\"},{\"slug\":\"2022-03-29-所谓厉害的辩手遇到提问时的思维模式与普通\",\"year\":\"2022\",\"title\":\"所谓厉害的辩手遇到提问时的思维模式与普通人之间差别在哪？\",\"date\":\"2022-03-29\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"好几个没想到：首先，就是我很惊讶地发现：——张伟丽的出腿速度，力量，都不咋的。只是场上都是高手，不太可能给她这种慢慢的转体大幅度玩摆腿的机会，所以她用腿法很少。几次内围中，她的动作比较笨拙，无法控住乔安娜，其实乔安娜也不是一个擅长内围战和地面战的选手，所以这场比赛，基本上就是跟踢拳，泰拳等站立格斗差不多。如果遇到步伐轻灵的选手，再把时间拖长，打个12局（拳击规则），我看她累都要累坏掉。\",\"url\":\"https://www.zhihu.com/question/309330630/answer/2413711259\"},{\"slug\":\"2022-03-27-到泰国学习泰拳是一种怎样的体验\",\"year\":\"2022\",\"title\":\"到泰国学习泰拳是一种怎样的体验？\",\"date\":\"2022-03-27\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"清一木兰的第一战视频，大家已经看到了山长清一：泰拳500年不败神话，正被清一太极终结这可不是什么友谊赛。我估计是泰国人，想拿我们的小拳手来烘托赛场气氛的，想展示让厉害的泰拳手的绝对武力，来降服外国人，炒作一下（我们是这一天唯一上场的外国人）。如果明天的视频，场上你看到的对方，是缩手缩脚的样子，有点放不开的样子，像是不会打的样子，忘记了泰拳技术的样子，并不是对手太差了，没练好泰拳就上场。\",\"url\":\"https://www.zhihu.com/question/55837013/answer/2409888015\"},{\"slug\":\"2022-03-27-泰拳和清一太极实战格斗-到底有何不同\",\"year\":\"2022\",\"title\":\"泰拳和清一太极实战格斗，到底有何不同？\",\"date\":\"2022-03-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"清一木兰的第一战视频，大家已经看到了山长清一：泰拳500年不败神话，正被清一太极终结这可不是什么友谊赛。而是我教的太极，对付泰拳的战术有用了，泰拳手由于从来没有遇到过这样的打法，会很不适应的。我看这次视频的评论中，居然有人说：吹什么太极实战格斗？现在的中国人，没有人真懂实战太极，更不懂怎样把太极用来与世界格斗对标。我们是用泰拳规则来实战的清一太极格斗，不是泰拳，也不是现代格斗。\",\"url\":\"http://zhuanlan.zhihu.com/p/488332403\"},{\"slug\":\"2022-03-26-泰拳500年不败神话-正被清一太极终结\",\"year\":\"2022\",\"title\":\"泰拳500年不败神话，正被清一太极终结\",\"date\":\"2022-03-26\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我相信未来，是【清一木兰】（女拳手）以及【清一武士】（男拳手）连胜泰拳手的时代。泰拳五百年不败的历史，正在被清一太极拳手们终结进行中。总有一天，要让泰国拳手，甚至全世界的拳手，听到自己的对手是“清一木兰”，心情都会陡然变差----这意味着他们几乎没有获胜的可能。现在两人是两年多前开始练拳，进入清一武道馆玩职业格斗。从今天实战看下来，泰国的正宗泰拳手，应该也不是她们的对手。\",\"url\":\"http://zhuanlan.zhihu.com/p/488027181\"},{\"slug\":\"2022-03-26-泰拳的杀伤力有多可怕\",\"year\":\"2022\",\"title\":\"泰拳的杀伤力有多可怕？\",\"date\":\"2022-03-26\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"如果我方拳手不是实力明显超越对手，有可能昨天到底昏迷的，就是我们的拳手了。的确是强手，应该是对方拳馆的主力女选手，明显比当天的其他泰国女拳手顽强得多。实际上我认为泰国女拳手这一局，她吃了大约5个正踢腿的有效攻击，以及多个膝击，应该比较惨。估计是看到明晓在上一局，面对泰拳手的缠抱，似乎没有啥特别的反应，以为我们的拳手不太会内围战（很多中国拳手怕泰拳的内围战，拳肘膝全上，不小心就被KO）。\",\"url\":\"https://www.zhihu.com/question/280541016/answer/2408896394\"},{\"slug\":\"2022-03-25-为什么中国100多种功夫流派-却搞不过泰\",\"year\":\"2022\",\"title\":\"为什么中国100多种功夫流派，却搞不过泰国的泰拳？\",\"date\":\"2022-03-25\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"因为几十年前，香港的太极拳师，就征战过泰拳，结果是大败。与其相信泰国人“很阴险”，不如相信“中国武术界的拳手，都有点无耻，很喜欢说谎”。为啥后来的香港拳手，再也不敢去泰国比赛了？可能只知道【这两孩子来学了一个多月的泰拳，原来学过中国功夫】，泰拳手是看不起“中国功夫”的，主要是因为一龙的表现，实在太恶心了。但泰拳手，却不知道我们清一武道馆，有20多个拳手，已经为这一天的比赛，积累了两三年了。\",\"url\":\"https://www.zhihu.com/question/378070378/answer/2406667796\"},{\"slug\":\"2022-03-25-清一太极今晚将首战泰拳\",\"year\":\"2022\",\"title\":\"清一太极今晚将首战泰拳！\",\"date\":\"2022-03-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一武道馆的明晓和佳惠两个小拳手，已经安排好了，今晚就要首战泰拳。这肯定不是中国太极派和泰拳的首战。因为几十年前，香港的太极拳师，就征战过泰拳，结果是大败。看看历史记载【当年（1958年）香港著名太极拳师胡胜、张耀强接受泰国侨团邀请，征战泰国。】今晚：中国太极再度与泰拳擂台交锋，又会是怎样的结果呢？难道泰国人今晚会给我们喝的水里下药，让我们的小选手“神志不清”，而导致太极拳手再次败给泰拳吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/487350587\"},{\"slug\":\"2022-03-14-为什么总有人认为民间野路子训练能赢过科学\",\"year\":\"2022\",\"title\":\"为什么总有人认为民间野路子训练能赢过科学系统的现代搏击？\",\"date\":\"2022-03-14\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"现代格斗也是在不断完善中的，一旦有新的格斗技术出来，相应的训练和打法就会变化。现在的泰拳，与60年代的泰拳就是不太一样的。民间练功方式，如果能够战胜现代格斗的话，干嘛不能去练呢？不算嘴上的民间武术，你真的要上现代格斗的擂台，自然是看谁的技术好，谁的技术更实用，当然就学的谁的。实际上，我认为现代格斗技术，有很多不够完善的地方。可以说，传武核心就是掌法打人，走的是弧线攻击，不是现代格斗的直线。\",\"url\":\"https://www.zhihu.com/question/403020863/answer/2387860818\"},{\"slug\":\"2022-03-14-太极的掌法-可以代替直拳来攻击对手吗\",\"year\":\"2022\",\"title\":\"太极的掌法，可以代替直拳来攻击对手吗？\",\"date\":\"2022-03-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"所以，太极，八卦，你们看到的都是各种转掌之法。可以说，传武核心就是掌法打人，走的是弧线攻击，不是现代格斗的直线。所以，现在格斗的这种打法，传武不可能直接搬用，不太适应现代擂台也很正常。目前我们的小拳手正在训练这种奇特的掌法，用来代替拳法，攻击对手头面部。原来我们想挑战的对象是拳击，但由于拳击是禁止用手背和手心来打人的，只能用拳的正面来打击，这种规则，其实巨大的限制了太极的技法。\",\"url\":\"http://zhuanlan.zhihu.com/p/480399742\"},{\"slug\":\"2022-03-12-在海外感染新冠是一种什么样的体验\",\"year\":\"2022\",\"title\":\"在海外感染新冠是一种什么样的体验？\",\"date\":\"2022-03-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"国内的朋友，很关心我们在海外的人，特别是一直在报道：海外疫情严重，都提醒我们当心等等。结果----在泰国这种疫情严重泛滥到都不再愿意报道感染人数的地方，我们中招新冠，就是毫无疑问的了。首先是我们的工地上的两个小公主，跟她们一起玩的几个大学生，说来跟孩子们一起学外语的人，其中一个去医院已经被查出有新冠，去治疗了。说老教练说你们两个这几天没来，肯定是得了新冠。两孩子不相信，说我们得的是感冒，不是新冠。\",\"url\":\"http://zhuanlan.zhihu.com/p/479907367\"},{\"slug\":\"2022-03-12-感染新冠肺炎是一种怎样的体验\",\"year\":\"2022\",\"title\":\"感染新冠肺炎是一种怎样的体验？\",\"date\":\"2022-03-12\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"结果----在泰国这种疫情严重泛滥到都不再愿意报道感染人数的地方，我们中招新冠，就是毫无疑问的了。首先是我们的工地上的两个小公主，跟她们一起玩的几个大学生，说来跟孩子们一起学外语的人，其中一个去医院已经被查出有新冠，去治疗了。两孩子不相信，说我们得的是感冒，不是新冠。如果是这样，结论就很简单了：我们肯定是“集体中招”了，而且包括我在内的所有成员，互相都没有隔离，一起生活，集体吃饭等等。\",\"url\":\"https://www.zhihu.com/question/376738227/answer/2386201086\"},{\"slug\":\"2022-03-07-太极格斗的提膝攻击和防守练习\",\"year\":\"2022\",\"title\":\"太极格斗的提膝攻击和防守练习\",\"date\":\"2022-03-07\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"泰拳的提膝攻击上的图片是泰拳的提膝动作，这一招应该主要是内围战中的提膝攻击的手法。我们的小拳手，提膝训练是每天的必修项目。我们拳派，是可以不练扫腿，但每天的提膝，是必须数百次，上千次的。首先是1：太极提膝，支撑腿的膝盖，是不能挺直的，必须弯着一点。4：太极膝法，练习的时候，膝盖冲击出来的力量，是不向前的。提膝攻击的力点和目标，是自己的两肩，要用力去击打肩膀位置。\",\"url\":\"http://zhuanlan.zhihu.com/p/477136419\"},{\"slug\":\"2022-03-07-散打拳击的时候后脚是踮着的-形意、太极等\",\"year\":\"2022\",\"title\":\"散打拳击的时候后脚是踮着的，形意、太极等武术是双脚踩实的，他们分别是处于什么样的考虑呢？\",\"date\":\"2022-03-07\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"泰拳的提膝攻击上的图片是泰拳的提膝动作，这一招应该主要是内围战中的提膝攻击的手法。我们的小拳手，提膝训练是每天的必修项目。我们拳派，是可以不练扫腿，但每天的提膝，是必须数百次，上千次的。首先是1：太极提膝，支撑腿的膝盖，是不能挺直的，必须弯着一点。3：图片中，泰拳手的脚跟是落地的，属于全脚掌支撑。4：太极膝法，练习的时候，膝盖冲击出来的力量，是不向前的。（打的时候随意，想攻哪儿都可以放开攻）。\",\"url\":\"https://www.zhihu.com/question/60167089/answer/2378486026\"},{\"slug\":\"2022-03-04-太极阴阳开合腿法-对战泰拳手的中国传武技\",\"year\":\"2022\",\"title\":\"太极阴阳开合腿法：对战泰拳手的中国传武技术\",\"date\":\"2022-03-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"女生练泰拳，比较适合阴柔的女孩练拳馆练练，改个性，变得阳刚一些。不过，比较外向的女生，去练实战太极，去玩击败泰拳的游戏，倒是一个最好的选项。最难对付的，其实主要是泰拳的主要打击手法：硬派扫腿，的确格斗中威胁很大。比传说中“肘过如刀”的肘膝攻击，更令我们担心太极拳手们难以应对。当然，针对泰拳的远距离打法，我们的对策就是特别训练可以克制泰扫的腿法技术。太极阴阳开合腿的使用，要求比内外摆莲更高。\",\"url\":\"http://zhuanlan.zhihu.com/p/475861728\"},{\"slug\":\"2022-03-04-女朋友是个萌妹子-但是突然想去学泰拳-我\",\"year\":\"2022\",\"title\":\"女朋友是个萌妹子，但是突然想去学泰拳，我该怎么劝？\",\"date\":\"2022-03-04\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"女生练泰拳，比较适合阴柔的女孩练拳馆练练，改个性，变得阳刚一些。如果本来个性就是比较阳刚的，再练至刚的泰拳，恐怕就“过于阳刚”了，也许会担心自己嫁不出去的。不过，比较外向的女生，去练实战太极，去玩击败泰拳的游戏，倒是一个最好的选项。现在已经有十来个专门练太极实战的女生，正在备战泰拳。当然，针对泰拳的远距离打法，我们的对策就是特别训练可以克制泰扫的腿法技术。传武武术基本功，我看也有“摆莲腿”的练习。\",\"url\":\"https://www.zhihu.com/question/65038986/answer/2374127673\"},{\"slug\":\"2022-02-22-拿泰拳金腰带的正确姿势是啥\",\"year\":\"2022\",\"title\":\"拿泰拳金腰带的正确姿势是啥？\",\"date\":\"2022-02-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"就涉及了价值观的冲突：问题1：如果我想要夺取泰拳冠军，拿到金腰带，我到底应该去一个泰拳冠军开的拳馆，而且已经培养出泰拳冠军的地方，去开始学习呢？还是去找一家新开的，据说是专门研究泰拳弱点，能够以柔克刚，更轻松地击败泰拳，但现在，还没有啥成功案例的太极实战拳馆呢？虽然中国已经有拳击的拳王，以及泰拳格斗，K1格斗，MMA格斗，甚至UFC格斗的金腰带出现，但这些拳手，并不是用中国的技术来获胜的。\",\"url\":\"http://zhuanlan.zhihu.com/p/469854071\"},{\"slug\":\"2022-02-22-泰拳为何五百年不败\",\"year\":\"2022\",\"title\":\"泰拳为何五百年不败？\",\"date\":\"2022-02-22\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"如果是现在定型的，大家都在学习的泰拳技术，招式，已经是几百年来积累的，擂台上取胜的最有效的招数和训练方法。至于另外一家，号称是可以击败泰拳的新拳馆，其实理论上分析，是不太可能成功的。你最多，就是成为播求一样的泰拳明星，在拳台上，有机会征战多年，让别人能够记住你10年，20年的。因为历史上，五百年不败的泰拳，已经出过无数的泰拳冠军。你用太极击败了五百年不败的泰拳，你当然就成了中国人心中的太极英雄。\",\"url\":\"https://www.zhihu.com/question/265930989/answer/2359249432\"},{\"slug\":\"2022-02-19-太极小拳手在泰拳馆的对抗练习视频\",\"year\":\"2022\",\"title\":\"太极小拳手在泰拳馆的对抗练习视频\",\"date\":\"2022-02-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"去拳馆半个多月了，两孩子都没拍对抗的视频。不过，正巧今早上，小拳手把一个别人拍的昨天晚上的对练视频发给我了。因为昨晚练习的时候（所以画面看起来不够清晰明亮），有一个外国拳手，应美国女拳手的要求，拍了她练习对抗的视频。我们的小拳手（红衣女孩），就在她身后，正在跟一个人高马大的外国男拳手练习对抗实战。我相信你们可以从实战练习中，清楚的看到了我方的小拳手，在进攻中是没有使用泰扫的。\",\"url\":\"http://zhuanlan.zhihu.com/p/469473307\"},{\"slug\":\"2022-02-19-空手道-柔道-泰拳-跆拳道-截拳道-散打\",\"year\":\"2022\",\"title\":\"空手道，柔道，泰拳，跆拳道，截拳道，散打，拳击那个实战性强？不受规则下？\",\"date\":\"2022-02-19\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"不会担心练习视频是摆拍的，像马保国一样，给钱给外国人来拍示范动作，然后号称自己实战中击败了外国拳手？我们的小拳手（红衣女孩），就在她身后，正在跟一个人高马大的外国男拳手练习对抗实战。甚至一些知名的中国拳手，就因为不服气泰拳，找泰拳师挑战，最终被直接打死在拳台上。香港也在70年代，派出香港实战能力最强，很善于摔跤的两个太极高手，去泰国跟泰拳手打。说日本武道家，组织了五个人去泰国打拳，打无限制的战斗。\",\"url\":\"https://www.zhihu.com/question/455945063/answer/2354904096\"},{\"slug\":\"2022-02-18-国家体委武术是传统武术吗\",\"year\":\"2022\",\"title\":\"国家体委武术是传统武术吗？\",\"date\":\"2022-02-18\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"传武国家集训队成立（2020年11月，南京）据说，中国国家体育总局，也在操心传武不能实战的问题，因为这“国粹”被打脸严重，实在撑不下去了。就专门成立了【传武国家集训队】，想要重振传武雄风。您认为：是国家集全国之力来创办的【正宗国字号传武集训队】会成功呢？我在网上搜索了一下这个“传武实战国家队\\\"的信息。而国家体育总局的这些官员们，第一时间就要求“设计出传武技术标准系统”来。\",\"url\":\"https://www.zhihu.com/question/335576776/answer/2353862048\"},{\"slug\":\"2022-02-18-国家武术总局-VS-一个人的武林\",\"year\":\"2022\",\"title\":\"国家武术总局 VS 一个人的武林\",\"date\":\"2022-02-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"还是我这一个从来没有上过擂台，没有系统练过武术，没有任何武林背景的文人，一直在教书的书生，自己凭一时的意气，来创办的一个私人小武馆，更有希望呢？作为清一大学武术和国学专业的【清一武道馆】，武馆的投资人，总教练，以及唯一的教练，都是我一个人。不过，当年中央国术馆没有办成的事情（弘扬国术），我就不相信现在交给【国家体育总局】，现在我国很有钱，就能办成这个事情了。挺像一百多年前，我们是世界第一富裕国家。\",\"url\":\"http://zhuanlan.zhihu.com/p/469119907\"},{\"slug\":\"2022-02-17-拳击散打等搏击训练有什么可以在拳馆训练之\",\"year\":\"2022\",\"title\":\"拳击散打等搏击训练有什么可以在拳馆训练之余，自己在家练习的东西？\",\"date\":\"2022-02-17\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"一般来说，都喜欢用慢跑来进行体能强化，泰拳手的常规训练，是早上跑10-15公里，下午跑6-8公里。我看国内的武术比赛，第一局我们的散打运动员还像模像样的，挺猛的。中国的传统武术的拳师，就更缺乏体能训练了。所以，中国武术无法实战的一大原因，大家都在找技术差距。其实真心不是技术问题，而是训练强度问题。下午的体能训练时间，由于是去泰拳馆参加适应性训练，就没有跳我们的武舞了，而是跟随泰拳馆的训练。\",\"url\":\"https://www.zhihu.com/question/35816228/answer/2352426366\"},{\"slug\":\"2022-02-17-格斗太极体能训练项目-清一拳舞游戏\",\"year\":\"2022\",\"title\":\"格斗太极体能训练项目：清一拳舞游戏\",\"date\":\"2022-02-17\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"一般来说，都喜欢用慢跑来进行体能强化，泰拳手的常规训练，是早上跑10-15公里，下午跑6-8公里。中国的传统武术的拳师，就更缺乏体能训练了。由于知道体能强化的重要性，国内的清一武道馆，采用的体能训练方式也是通行的慢跑，长跑。为了防止拳手偷懒划水，我就找了一种她们无法偷懒的方式来训练体能。下午的体能训练时间，由于是去泰拳馆参加适应性训练，就没有跳我们的武舞了，而是跟随泰拳馆的训练。\",\"url\":\"http://zhuanlan.zhihu.com/p/468143086\"},{\"slug\":\"2022-02-14-中国百年来“传武人”的丑陋暴露无遗\",\"year\":\"2022\",\"title\":\"中国百年来“传武人”的丑陋暴露无遗\",\"date\":\"2022-02-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"但凡是中国传统武术的视频，无论是太极也好，八极拳也好，咏春也好，为什么评论都是一堆喷子，一堆键盘侠?本文证实了百年来的中华武术，就是这样子不成器的。我们必修尊重传武，特别是太极拳，百年来沉沦的历史。中国武术败了100年，怎么就没人去做类似踢拳做的事情？武术界，无论是中国的官方和民间，没有来做中华武术的系统现代化工作。因为中国人心中的传武，就是电影传武中的样子，无敌神功。\",\"url\":\"http://zhuanlan.zhihu.com/p/467233067\"},{\"slug\":\"2022-02-14-如何强化应对泰拳扫腿的抗击打力\",\"year\":\"2022\",\"title\":\"如何强化应对泰拳扫腿的抗击打力？\",\"date\":\"2022-02-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"网上输入泰拳扫腿，各种踢断肋骨，甚至自己踢断自己小腿的报道都很多。想看看泰拳的扫腿功夫，可以看这个链接的视频。当场扫腿把对手打得站不起来，用担架抬下去的案例太多了。我们很好奇：泰拳的抗击打力是怎样练出来的？当他看到我们的小拳手用棒子敲打各位部位身体的时候，说：不需要这样“自虐”的，我们也趁机问：泰拳扫腿这么强大的威力，你们是怎样练出防守力来的？我们的拳手，也要强化练习腹部和肋部的抗击打力练习。\",\"url\":\"http://zhuanlan.zhihu.com/p/467015735\"},{\"slug\":\"2022-02-14-如何看待部分“传武人士”一面鼓吹古代武将\",\"year\":\"2022\",\"title\":\"如何看待部分“传武人士”一面鼓吹古代武将的技击水平，另一面又不愿按古兵书训练？\",\"date\":\"2022-02-14\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"但凡是中国传统武术的视频，无论是太极也好，八极拳也好，咏春也好，为什么评论都是一堆喷子，一堆键盘侠?虽然该文是黑传武的，但黑的很有水平，有证据，有案例，有事实。也许作者本人，也是一个曾经喜欢传武，但被事实教训了的前传武爱好者。要说中华武术的实战技能已经失传，大约也没啥好质疑的。这些材料，其实我早就看过，我一直在纳闷：一大批的武术专业人士，甚至连梅慧志这样的老武术家，都没有见过真正的传武实战。\",\"url\":\"https://www.zhihu.com/question/321150617/answer/2347600917\"},{\"slug\":\"2022-02-14-泰拳比赛经常有人被侧踢扫断手臂或小腿-遇\",\"year\":\"2022\",\"title\":\"泰拳比赛经常有人被侧踢扫断手臂或小腿，遇到这种攻击怎么抵挡？\",\"date\":\"2022-02-14\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"据说早期的日本和中国武术，跟泰拳比试的时候，常常被踢断肋骨而输掉比赛。网上输入泰拳扫腿，各种踢断肋骨，甚至自己踢断自己小腿的报道都很多。这种泰扫腿法有多凶猛，你们看这些报道就知道了。当他看到我们的小拳手用棒子敲打各位部位身体的时候，说：不需要这样“自虐”的，我们也趁机问：泰拳扫腿这么强大的威力，你们是怎样练出防守力来的？欧美选手不熟悉泰拳的这种扫腿威力，习惯用手臂去防守，经常导致手臂被打断的事故。\",\"url\":\"https://www.zhihu.com/question/34614197/answer/2346960319\"},{\"slug\":\"2022-02-12-太极怎样应对泰拳的膝击\",\"year\":\"2022\",\"title\":\"太极怎样应对泰拳的膝击？\",\"date\":\"2022-02-12\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"泰拳膝击的应对方式图片中，就是泰拳膝击的标准动作。一种是在遇到攻击，害怕和退后的时候，泰拳手会跳起来，用飞膝打击你。我的太极小拳手，在泰拳馆练习的时候，由于我教的膝击，脚背是平的。这个微小的细节差异，就说明太极拳手和泰拳的发力方式很不一样。不信你试试看，像泰拳一样绷紧脚尖顶膝，与像太极一样翘起脚指头顶膝，差别有多大？太极顶膝，全身是放松的，不会像泰拳手一样全身紧绷，所以不费力。\",\"url\":\"http://zhuanlan.zhihu.com/p/466543384\"},{\"slug\":\"2022-02-12-泰拳中的箍颈顶膝怎么破\",\"year\":\"2022\",\"title\":\"泰拳中的箍颈顶膝怎么破？\",\"date\":\"2022-02-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"泰拳膝击的应对方式图片中，就是泰拳膝击的标准动作。一种是抓住你的头部和脖子用劲拉，同时用膝盖顶击（所谓的锢颈顶膝）。一种是在遇到攻击，害怕和退后的时候，泰拳手会跳起来，用飞膝打击你。我的太极小拳手，在泰拳馆练习的时候，由于我教的膝击，脚背是平的。太极顶膝，全身是放松的，不会像泰拳手一样全身紧绷，所以不费力。我的小拳手表示：的确，她按照泰拳师的指点，这样顶膝的时候，速度慢了很多。\",\"url\":\"https://www.zhihu.com/question/372489041/answer/2345043874\"},{\"slug\":\"2022-02-11-哪家拳馆正在把太极拳应用于实战中\",\"year\":\"2022\",\"title\":\"哪家拳馆正在把太极拳应用于实战中？\",\"date\":\"2022-02-11\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"目标是用太极格斗，去与现代各种格斗擂台实战，验证太极的实战能力。由于国内没有多少实战机会，目前只能转战泰国来开打实战，泰国可能是全世界举办正规拳赛最多的国家来实战。实战分析文章内容：泰拳左架拳手，会用前手作为虚招，点晃，扰乱，或者用于伸直抵住对方，控制距离使用。如果实战太极，也用这种类似的对攻技术来打，就太low了。我们小拳手在泰拳馆的模拟实战中，已经应验了这个结论。\",\"url\":\"https://www.zhihu.com/question/66608749/answer/2344218618\"},{\"slug\":\"2022-02-11-如何用实战太极-应对泰拳的拳架\",\"year\":\"2022\",\"title\":\"如何用实战太极，应对泰拳的拳架？\",\"date\":\"2022-02-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"目标是用太极格斗，去与现代各种格斗擂台实战，验证太极的实战能力。以下是记录这次训练和比赛的正文记录文章之一：泰拳左架拳手，会用前手作为虚招，点晃，扰乱，或者用于伸直抵住对方，控制距离使用。如果实战太极，也用这种类似的对攻技术来打，就太low了。太极的前手，如果长长的伸手在前面，泰拳拳手也有这种动作，但这种动作是不能打人的，必须收回来才能打人。实战太极对付泰拳手的招数方法：只能以攻对攻！\",\"url\":\"http://zhuanlan.zhihu.com/p/466291446\"},{\"slug\":\"2022-02-09-实战太极如何应付泰拳的重炮轰击\",\"year\":\"2022\",\"title\":\"实战太极如何应付泰拳的重炮轰击？\",\"date\":\"2022-02-09\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"攻击的力量很强，所以他们认为还是泰拳更厉害。从这个案例就知道：中国的太极，要用泰拳的规则，来与泰拳选手一较高低，就必须训练抗击打能力。那么，一向软绵绵的太极，用来对战泰拳的重炮强力攻击，有用吗？想要对付泰拳的狂轰滥炸，太极拳有何办法？最终结论就很简单了：为了对付泰拳的“重炮攻击”，实战太极必须用贴身技术，进圈进行“内围战”，并用跟节发力技术，克制住泰拳的肘膝内围技术，这才是唯一的取胜之道。\",\"url\":\"http://zhuanlan.zhihu.com/p/464073261\"},{\"slug\":\"2022-02-09-泰拳是一种世界公认的强大搏击术-但是它的\",\"year\":\"2022\",\"title\":\"泰拳是一种世界公认的强大搏击术，但是它的各项能力都不突出。请问泰拳的优势何在？\",\"date\":\"2022-02-09\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"他们来学泰拳，虽然速度会慢一点，技术上也不是很高明，但很实在。攻击的力量很强，所以他们认为还是泰拳更厉害。不怪别人这样说，实话实说：站立格斗中，泰拳可能是最强的格斗技术了。并不是说：现代格斗的能力就更强了，而是他作为一个竞技系统，他的技术和要求，和传统的战场搏杀系统肯定是不一样的。但因为对手在前两局，双方互拼的时候，远距离用腿不断攻击她的大腿内外侧，结果这种积累下来的伤害，导致她的大腿都淤青了。\",\"url\":\"https://www.zhihu.com/question/34333243/answer/2341277637\"},{\"slug\":\"2022-02-04-太极拳怎样才能用于实战\",\"year\":\"2022\",\"title\":\"太极拳怎样才能用于实战？\",\"date\":\"2022-02-04\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"先下一个定论:对于练武术实战格斗，特别是练传武的人来说，本文价值万金。你们会认为拳手这样很危险，其实根本就没有危险。另外，攻击力较强的一方，如果找到良好的方式，主要是步法，快速切入对方的圈子，实施打击，就变成比格斗实战能力更强的技巧。所以，如果太极拳手要和现代格斗交手，就不能是跟他们一样，在圈子的边缘格斗。这就是用太极的全身发力技术进行的攻击，与泰拳用肩背转胯来发力是不一样的，发力的路线更短。\",\"url\":\"https://www.zhihu.com/question/385287560/answer/2334502939\"},{\"slug\":\"2022-02-04-实战太极与泰拳-核心技术心要-进圈与退\",\"year\":\"2022\",\"title\":\"实战太极与泰拳--核心技术心要：进圈与退圈\",\"date\":\"2022-02-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"先下一个定论:对于练武术实战格斗，特别是练传武，实战太极的人来说，本文价值万金。清一武道馆是如何抓住现代格斗的弱点，并加以利用，才会有信心说：我们要用传统武术，拿实战太极，去拿现代格斗冠军的。了解“斗圈”的技术，对于打实战的人来说很重要。所以，如果太极拳手要和现代格斗交手，就不能是跟他们一样，在圈子的边缘格斗。这就是用太极的全身发力技术进行的攻击，与泰拳用肩背转胯来发力是不一样的，发力的路线更短。\",\"url\":\"http://zhuanlan.zhihu.com/p/463585459\"},{\"slug\":\"2022-02-01-2022年春节-中国太极与泰拳的首次亲密\",\"year\":\"2022\",\"title\":\"2022年春节：中国太极与泰拳的首次亲密接触！\",\"date\":\"2022-02-01\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"另外两个女孩，是坚决不想上大学浪费时间和精力的学生，她们只想好好练实战太极，去拿世界冠军，捍卫中华武术的荣誉，所以进了【清一武道馆】当拳手了。但他却常常被女生击中（后来我会上传一个视频，女孩们第一次对战泰拳的比赛）。创办人是原来的泰拳冠军，今年已经58岁了。2006年，他接到国家体育总局武术中心的通知，跟中国武术打了一辈子交道的他，转而成为中国泰拳国家队的组建者和牵头人，成为国家泰拳队的总教练。\",\"url\":\"http://zhuanlan.zhihu.com/p/463449179\"},{\"slug\":\"2021-09-16-古传太极之-分心十字-实战用法\",\"year\":\"2021\",\"title\":\"古传太极之【分心十字】实战用法。\",\"date\":\"2021-09-16\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"，下面视频中没有用我说的【分心十字】技术，她们还正在练这一招，目前还没有到可以实战应用的地步，大约三个月之后可以用于实战）。现在大家都刚开始练第二招【分心十字】，三个月后将可以使用这招进行实战。未来的世界赛场上，我的选手，将用这一招古传太极，扫荡现代格斗拳手。但实战太极，还有更霸道的姿势，当然难度也更高的，是古传太极【分心十字打法】，属于“硬打硬进无遮拦”的威猛拳法。\",\"url\":\"http://zhuanlan.zhihu.com/p/411193879\"},{\"slug\":\"2021-09-04-面对挑战者的清一武道馆实战视频\",\"year\":\"2021\",\"title\":\"面对挑战者的清一武道馆实战视频!\",\"date\":\"2021-09-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"昨天和今天，清一武道馆跟外来挑战者进行了三轮，共14场比赛。比较有意思的，是原来我的训练视频上，一个男生，不敌太极派的女生。大家记得这个被人留言嘲笑，说他连清洁工都打不赢的男拳手吗？所以实战视频上看，显得他好像不会拳一样，处处被动挨打，到处被追击击打，一副没脾气的样子。比较：第二个视频，挑战对象依然是同一个。另一场比赛：输了就要离开武馆最终结果：80公斤的挑战者，以6：0输给了60公斤的守擂者。\",\"url\":\"http://zhuanlan.zhihu.com/p/406890191\"},{\"slug\":\"2021-07-12-太极实战与职业拳手的第一次实战对碰\",\"year\":\"2021\",\"title\":\"太极实战与职业拳手的第一次实战对碰\",\"date\":\"2021-07-12\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"以下视频，是我的弟子明琪在清一武道馆，经过两年的太极格斗训练后，首次出山，去职业拳馆，与职业拳手们首次实战交流的视频。由于我的弟子，也是第一次出战职业拳手，对自己也没啥信心，所以也比较紧张，就打出了你们看到的这种水平。为了让大家了解职业拳手之间的打法区别，我还传了另外一个职业拳手之间的实战视频上来供你们比较差异。要求我双臂要紧贴自己，前手也不要一直放的太开，出拳前后都要收回下巴。\",\"url\":\"http://zhuanlan.zhihu.com/p/389072935\"},{\"slug\":\"2021-04-27-请问一个武术高手和普通人对打-武术高手不\",\"year\":\"2021\",\"title\":\"请问一个武术高手和普通人对打，武术高手不用器械的情况下能把普通人打死吗？\",\"date\":\"2021-04-27\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"前提是----必须确定是真正的武术高手（不是假装练过武的大师级高手，如保国同志等），跟普通人对打，徒手打死人，真的很容易。真懂的武术高手，空手打死一个普通人，大约需要五秒钟就够了。一般人不懂武术的，会以为要用电影上叶问这种不断的打打打的功夫来杀人，这是笑话的。但用传武高手的方式打死人，真不是难事，而且是确定的。我的一个武林高手朋友，就是真的打死过人的，差点进了监狱。\",\"url\":\"https://www.zhihu.com/question/456535405/answer/1857213316\"},{\"slug\":\"2021-04-18-一个人的大学和一个人的武林\",\"year\":\"2021\",\"title\":\"一个人的大学和一个人的武林\",\"date\":\"2021-04-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"妄想我独立单挑世界教育体系，一个人就可以办一所能挑战世界名校的大学。我现在正在玩【一个人的武林】，妄想以我一个人的能力，回复中华武术的荣誉，把面临灭绝的中华传统武术，传承下来一把香火。这是近一百年来的中国武林界，众多武林英豪，都没有完成过的事情。我一个从小就没受过武术训练的书生，上大学才业余爱好，自己拿书跟着练一点，【自学武术】的人。害我一个业余的武术人，自己贴钱来玩专业的中华武术！\",\"url\":\"http://zhuanlan.zhihu.com/p/365730138\"},{\"slug\":\"2021-04-05-实战太极与现代格斗之谜1-发力技术\",\"year\":\"2021\",\"title\":\"实战太极与现代格斗之谜1：发力技术！\",\"date\":\"2021-04-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"凡是号称实战的武术，不跟你讲发力技术，只讲什么招式，动作的，就是在耍流氓！这是目前几乎所有现代格斗拳派的发力技术。传武要能够跟现代格斗进行一场真正的对决，就只有两个可能性必须满足：首先是发力技术必须跟上，或者超越他们。说到掌根发力，你就开始发现：太极发力技术，已经跟现代格斗术不一样了。因为：太极传武有别于外家拳，有别于少林，有别于现代格斗的地方，就是太极的发力技术已经完全改变了。\",\"url\":\"http://zhuanlan.zhihu.com/p/362455647\"},{\"slug\":\"2021-03-19-传统武术是否存在\",\"year\":\"2021\",\"title\":\"传统武术是否存在？\",\"date\":\"2021-03-19\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"但是要看怎样定义：如果定义玩套路，玩表演，玩门派的，就称为传统武术，自然存在。如果定义为：用传统武术的原理，技法来进行训练，以及用来实战和格斗的，成体系和有建制的，有传有承的，就基本上不存在了。但在日本还有中国的传统武术。我见到日本人的训练方式，就说：这种训练方式，是中国的武术传统。日本人眼睛一翻：啥，这是日本的传统武术，中国，根本没有。因为我在中国几乎没见过（见过几个师父是有传武功夫的。\",\"url\":\"https://www.zhihu.com/question/440324338/answer/1788918094\"},{\"slug\":\"2021-03-18-19岁女孩想学柔道防身-就是遇到危险时给\",\"year\":\"2021\",\"title\":\"19岁女孩想学柔道防身，就是遇到危险时给自己争取一点时间，可以去哪里学，大概要学多久，学起来困难吗？\",\"date\":\"2021-03-18\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"我认为：如果目标是防身，学会跑步，价值比学柔道更实用。而且更能锻炼身体。还有：小女生学会不去可能有危险的地方，学会聪明地与男人打交道，也比学柔道的价值更高。以上学的本事，都可以用到日常生活中。属于兼容性质。比单纯的练武防身有价值。当然，喜欢柔道，喜欢武道，那就另说了。\",\"url\":\"https://www.zhihu.com/question/444172905/answer/1787486201\"}]";
const baseUrl = "/QYSZ-zhihu";

    const posts = JSON.parse(postsJson);
    let activeYear = '';
    let activeType = '';

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function render() {
      let filtered = posts;
      if (activeYear) filtered = filtered.filter(p => p.year === activeYear);
      if (activeType) filtered = filtered.filter(p => p.type === activeType);

      document.getElementById('result-count').textContent = filtered.length + ' 篇';
      const list = document.getElementById('post-list');
      list.innerHTML = filtered.map(p => `
        <article class="post-card">
          <h3 class="post-title"><a href="${baseUrl}/posts/${p.year}/${p.slug}/">${escapeHtml(p.title)}</a></h3>
          <div class="post-meta">
            <time>${p.date}</time>
            <span class="post-type">${p.type}</span>
            <span class="post-cat">${p.L1} > ${p.L2}</span>
            ${p.url ? `<a href="${p.url}" target="_blank" rel="noopener" class="post-source">原文</a>` : ''}
          </div>
          ${p.summary ? `<p class="post-summary">${escapeHtml(p.summary)}</p>` : ''}
        </article>
      `).join('');
    }

    document.querySelectorAll('.filter-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        const value = btn.dataset.value;
        // 更新激活态
        document.querySelectorAll(`.filter-tag[data-filter="${filter}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (filter === 'year') activeYear = value;
        if (filter === 'type') activeType = value;
        render();
      });
    });

    render();
  })();</script></main><footer class="site-footer" data-astro-cid-hkbrpulz><p data-astro-cid-hkbrpulz>清一山长知乎文集 · 2021–2026 · 共 2057 篇</p><p class="footer-note" data-astro-cid-hkbrpulz>本站内容来源于知乎公开内容，仅供学习交流使用。</p></footer></body></html>
