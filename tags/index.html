title\":\"清一公社：思考【活著】VS【傲慢与偏见】家族传承的困惑\",\"date\":\"2025-10-20\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"鹰粉二期的课程，将使用电影【活著】与【傲慢与偏见】作为课程内容。请希望解决自己家族未来走向的人，认真思考下列传承的问题：活著的男主角徐福贵，是富三代。但还有收敛，起码维持一家的生活还是有余地的。你怎样才能让自己的儿孙不至于把你的家败光？问题三：与“富不过三代”相比，古人有“耕读传家”的优良传统，你认为“耕读传家”在现代社会应该如何去实践？【傲慢与偏见】中，为何班纳特家五个女儿无法继承父亲的庄园？\",\"url\":\"http://zhuanlan.zhihu.com/p/1939661646340548111\"},{\"slug\":\"2025-10-19-Ella击败天心的文章-知乎-傲慢与\",\"year\":\"2025\",\"title\":\"《傲慢与偏见》讨论课：ELLA看到自己像傻笑的老四，诚实有爱\",\"date\":\"2025-10-19\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"ella自己说话好有趣---【说实话看四妹这个傻笑的样子还确实和我之前还是蛮像的】哈哈哈，你才发现呀？挺不错的小丫头，不去想想自己是女主范儿，反而看到自己像傻丫头老四。你真是有爱和诚实的人，这种人应该生活在天堂​​[赞]​​。我希望能帮你找到你的宾利，一个跟你一样善良热情开朗的人。可惜明慧不是男生，不然你嫁给明慧，也是不错的喔。简嫁给伊丽莎白这样的男生也不错，两人也是好姐妹，沟通良好。\",\"url\":\"https://www.zhihu.com/pins/1963271559478253517\"},{\"slug\":\"2025-10-19-官方权威-太极拳发展概略——康戈武\",\"year\":\"2025\",\"title\":\"【官方权威】太极拳发展概略——康戈武\",\"date\":\"2025-10-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"太极拳发展概略——作者：康戈武(中国武术研究院研究员，北京体育大学武术专业博士导师，中国武术协会秘书长)谈太极拳的发展，涉及到三个要素。本文试以太极拳发展的无形时期、成形时期、成熟时期、繁衍时期、从规范化向多样化发展时期为序，简述太极拳发展的概貌。一、太极拳发展的无形时期太极拳是中国武术发展历程中诞生的一个拳种。因此，笔者把上述基因融合一体形成太极拳之前称为“太极拳发展的无形期”。\",\"url\":\"http://zhuanlan.zhihu.com/p/1963356774007572457\"},{\"slug\":\"2025-10-19-少康的回答-知乎你听过三观极歪的一句\",\"year\":\"2025\",\"title\":\"「只有赚钱才让人聪明」：在中国没赚到钱，多半是真不够聪明\",\"date\":\"2025-10-19\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【实际是检验真理的唯一标准，只有赚钱才会让一个人越来越聪明。】其实，这句话我是承认的：在崇尚金钱的中国，如果你没有赚到钱，大概率是你真的不够聪明。别用啥名牌来装点自己，不是你挣来的，你就是豢养的废物！因此要检验自己的做事能力，认真去赚钱，是个好事。比如：我儿子就跑到非洲去挣钱去了，倒不是他缺钱。其实，是因为他想证明自己还是很聪明的，不是只会被父母豢养的无能宠物，傻二代。\",\"url\":\"https://www.zhihu.com/pins/1963322008638063270\"},{\"slug\":\"2025-10-19-清一公社-运作公社资产的管理者-能否利用\",\"year\":\"2025\",\"title\":\"清一公社：运作公社资产的管理者，能否利用社员资金获取利益？\",\"date\":\"2025-10-19\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"他们只是为了管理自己的资产，同时也为了捍卫自己的利益而付出和工作，同时，这些管理人，是让你们无偿地享有了她们的劳动成果！比如，有人就以为：我出头来弄【清一公社，百年传承基金】的目的，就是想要利用大家的资金，来为自己更多赚钱！我就跟你讲个道理：我作为一个聪明人，而不是傻子，怎样才能借用别人的资金来为自己挣钱？清一公社承诺每年要分配给社员或者其指定受益人。我用不用这些资金来获利，我都必须支付高利息。\",\"url\":\"http://zhuanlan.zhihu.com/p/1963154898255341251\"},{\"slug\":\"2025-10-19-瑞学同心书院的回答-知乎大家如何看待\",\"year\":\"2025\",\"title\":\"史威登堡：天堂是生命状态，活在爱中即天堂——与我认知相同\",\"date\":\"2025-10-19\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"瑞登堡说，天堂不是一个遥远的地方，而是一种生命状态。凡是活在爱与智慧中的人，就是活在天堂里；凡是活在自私与虚假中的人，就是活在地狱里。这个概念，与我的认知是一样的。我之前不知道这人，现在发现了，觉得很有意思。他发表的这些神学思想，与传统基督教的教父的说法，是非常的不一样，但是和【与神对话】一书中的核心思想，是很一致的！他的故事很有趣，我觉得如果是真的，就是一个值得深思的事情！\",\"url\":\"https://www.zhihu.com/pins/1963201678653265615\"},{\"slug\":\"2025-10-18-清一公社-买房留给孩子可以有效保障她的未\",\"year\":\"2025\",\"title\":\"清一公社：买房留给孩子可以有效保障她的未来生活吗？\",\"date\":\"2025-10-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我听一个广州的清粉说：她原来给孩子买的学区房，市场价值是900万元。她原来希望这套房子，能够保证孩子一个美好的未来，这套房子大概就是130平方左右的房子。我相信很多家长都是这样想的，以为房子就是给孩子最大的保障。因此中国的家长都喜欢有钱后就去买房子，抵押上自己的一生去买房子。广州的房子，如果你用来买清一社区百年基金，你可以买9份，每个月的月红是24660元。这样想的话，您还想保留广州的房产吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/1962658135366926707\"},{\"slug\":\"2025-10-16-2015年6月-中国建筑141万股东\",\"year\":\"2025\",\"title\":\"中国建筑股东从141万降到34万：十年最低时恰恰是机会\",\"date\":\"2025-10-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"该季度的最高价5.97元，收盘价4.03元！当年（2014）中国建筑每股收益0.75元。每股净资产4.57元10年后：2015年6月：中国建筑只有34万股东，十年最低！这个季度的该季度最高价5.63元，收盘价5.51元。2024年中国建筑每股收益：1.11元。如果用当年的最高价买入，持有到现在还是亏的！以清一公社每年分掉3%的红利来算的话，这份公社基金，持有到现在是亏损的！\",\"url\":\"https://www.zhihu.com/pins/1962164572585713712\"},{\"slug\":\"2025-10-16-天-它-真是疯了\",\"year\":\"2025\",\"title\":\"账户绿惨但一股没少：首次卖出西部水泥，成本0.87已涨4倍\",\"date\":\"2025-10-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天我的账户跌了很多，绿的很惨！今天我首次卖出西部水泥，我的持仓成本才0.87元，现在涨了4倍还多。今天我就卖了30万股出去，表示对西部水泥管理层的感谢。同时我用卖出西部的这笔钱，全用来买了中国中冶，2.63元买入。以此实际行动，表示对中冶的主力很不满意。大家都是有色，你看白银就涨多好，你不跟着学一点？我只剩下不到4百万股白银了。但我想：必须和自己的本性作对，我特别想卖的时候，就是不能卖。\",\"url\":\"https://www.zhihu.com/pins/1962170785683740420\"},{\"slug\":\"2025-10-16-找死也不是这样找的吧\",\"year\":\"2025\",\"title\":\"特朗普500%关税：中国不会死，美国脱轨才真要命\",\"date\":\"2025-10-16\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"500%的关税，和100%的关税有啥差别？(2025.10.16)如何看待美国总统特朗普狂言将对华关税提升至500%？但美国如果真的完全跟中国脱轨，美国真会死的！打个比方：老百姓没有最新版的手机，其实不会有啥影响，心情不好罢了！反正下面的屁民其实不知道惹了中国最终会多倒霉。如果这样的话，那么这帮参议院，真的坏透了！拥护特朗普的人，就算知道是个坑，也不能表现出不支持总统的样子呀？\",\"url\":\"https://www.zhihu.com/pins/1962273189892716531\"},{\"slug\":\"2025-10-16-清一公社-为何绩优股10年不赚钱\",\"year\":\"2025\",\"title\":\"清一公社：为何绩优股10年不赚钱?\",\"date\":\"2025-10-16\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"清一公社的社员，每个月都享有相当于一个上海工人的基本月收入的分红。因为：这些人不知道这份社员资格，是一份久期100年的长期保证，是一个亿万资产买不来的机会。他们居然当做了清一公社基金，是一份“承诺高回报”的投资，而且，这些人比较的对象，是我的私人账户过去34年的增值空间！因此，一些公社的社员们，就认为：你们“入股公社”后，也取得这个业绩，现在就开始做梦怎样分这笔钱了！\",\"url\":\"http://zhuanlan.zhihu.com/p/1962164658757698857\"},{\"slug\":\"2025-10-16-清一公社-亿万富婆莎朗斯通的穷途末路\",\"year\":\"2025\",\"title\":\"清一公社：亿万富婆莎朗斯通的穷途末路\",\"date\":\"2025-10-16\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"我们都以为：年轻的时候努力工作，我们的晚年就可以安享生活，我们的子女就能得到照顾但事实上：利益集团有大量的手段，分别来收割穷人，富人。骨子里面我们就是羊的话，无论赚了多少钱，无论我们多努力。穷困潦倒，身无身文，走上了人生的穷途末路了！你看了这些案例，请找到有效的方案：一：学历似乎不能保证工作的稳定。您怎样才能让自己不被未来不断变化的劳动市场抛弃？三：你运气好，赚了大钱，就像沙朗斯通一样。\",\"url\":\"http://zhuanlan.zhihu.com/p/1962058902561588893\"},{\"slug\":\"2025-10-15-2025年全国青少年自由锦标赛随行记-下\",\"year\":\"2025\",\"title\":\"锦标赛场外：教练竟鼓励喝酒熬夜，泰国拳手多不喝酒，差距在此\",\"date\":\"2025-10-15\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"无语酒色伤人。特别是练武之人，是很忌讳酒色的，还有就是熬夜更忌讳！泰国的泰拳手，有不少是不喝酒的。中国的武人，不喝酒几乎就不算练武的！怪不得中国的格斗界出不了啥人才。人口大国，世界格斗选手的影响力，实力，连菲律宾这样的小国都不如，真有点丢人！让我们来慢慢恢复中国的格斗大国风采吧。文人格斗批量人才的出现，大约是2028年了。10个以上达到世界锦标赛标准的队员将出现。\",\"url\":\"https://www.zhihu.com/pins/1961774235459510814\"},{\"slug\":\"2025-10-15-今天上午关注有色-我以为今天我的账户肯定\",\"year\":\"2025\",\"title\":\"以为账户要跌惨，打开又创新高：燕京跌破12元我一直在买回来\",\"date\":\"2025-10-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"原来是燕京涨了---这股跌破12元，我就一直在买回来我原来13-14高位卖掉的持仓。有本事再涨我再抛，反正就是低价白白捡到的货！今天打开账户，是想买一个新股：我从来没有买过的股。平台公司，主要就是观察到这只股的股东人数一直在减少。正好把今天一天，股市送给我的涨幅吃掉了。这是一个我从来没有关注过的行业，我觉得我也该扩大一下自己的经验范围了。别老是买过去熟悉的公司，也要接触新事物。\",\"url\":\"https://www.zhihu.com/pins/1961799688266191074\"},{\"slug\":\"2025-10-15-我原来就卖飞了半天\",\"year\":\"2025\",\"title\":\"白银有色刚涨就被官方打压：可上半年净现金流52亿、存货152亿\",\"date\":\"2025-10-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"白银有色好像运气特别不好。刚一涨，就有官方出来打压。白银企业官方还专门出来说：白银企业效应不好，还亏损严重，都是负收益。而且大股东还质押98%（这都拿出来说了）。大股东都没钱，快破产了！可是：我注意到---上半年的净现金流量是52亿，投资流量是负数。还有：存货是152亿（现在有色都在涨，这存货---不更值钱了吗？我是是不是先把卖飞的部分接回来呀？就因为像，所以，也可能是主力故意让你知道！\",\"url\":\"https://www.zhihu.com/pins/1961792137696883302\"},{\"slug\":\"2025-10-15-逼得我们自助养老\",\"year\":\"2025\",\"title\":\"逼得自助养老：把养老交给系统，等于羊指望狼不吃你\",\"date\":\"2025-10-15\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"不就因为：我们的保障系统，实在是靠不住吗？1岁工作，22岁退休，领了69万养老金，演都不演了我们把自己交给“系统”去保证，就相当于棺材店老板，相信美国的社会，会自动的保护他这种“老实人”一样，实在是异想天开。只要你是羊，走遍天涯，你都是被狼吃的命！我们一群羊，自己来武装自己，自己来做自己的养老金，自己的家族传承，不再依赖各种利益集团的承诺，我们来自己建设自己的家族传承自助保证方案！\",\"url\":\"https://www.zhihu.com/pins/1961802933504050897\"},{\"slug\":\"2025-10-14-云南来的队都是垃圾队员\",\"year\":\"2025\",\"title\":\"「云南来的队都是垃圾」：彭默之夺冠打脸，公主班两日后登场\",\"date\":\"2025-10-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"怪不得另外一个云南队拼命跟你们撇清关系[飙泪笑]​[飙泪笑]​公主班的人两天后上去开打后，对手应该才知道“云南队”的厉害。如果是来我这里训练，会比你们任何一个人都更能训练出来，更容易拿冠军，他们都是敢拼敢打不畏死的个性。你们上场常常是怕怕的，优柔寡断的，挨打都反应不过来。体制拳手的因为心理，素质，运动能力都是一流的，只是他们很遗憾，得不到好老师来教。他们技术的天花板也就这样了，很难上去了。\",\"url\":\"https://www.zhihu.com/pins/1961349300031324546\"},{\"slug\":\"2025-10-14-今天早上去了贵州-中午坐火车回云南\",\"year\":\"2025\",\"title\":\"贵州转云南：白银涨停我出货，下午却翻绿，明日低位补回\",\"date\":\"2025-10-14\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"上午看白银又涨停了，忍不住上午又出了几十万股。真是想不到，早知道，上午出光掉多好，可惜我还是没摸透主力的心思，主力太厉害了，我不如也！正好其他有色都在跌，我明天补回仓位，等于白赚了一个涨停甚至还多。比如我补仓的如果本来就是低位，还跌了5%以上，我岂不是相当于多收入了15%以上的筹码？另外我观察到：有色涨的时候，酒类都在跌。难道真的有色，就是这帮“酒老板”做起来的行情？\",\"url\":\"https://www.zhihu.com/pins/1961547979472212698\"},{\"slug\":\"2025-10-13-2025全国格斗锦标赛-新的旅程\",\"year\":\"2025\",\"title\":\"2025全国格斗锦标赛：新的旅程\",\"date\":\"2025-10-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"至今清一战队已经打了500多场泰拳和自由搏击的职业和锦标赛的赛事，已经崛起为中国的一只不可忽略的格斗新星。练了三年实战格斗的公主班13个人，和练了1年的冠军班30个学生，今年一起参加了在重庆举行的自由搏击锦标赛（青少年组）。本次赛事全国共有602人参加，其中最大的团队，是河南登封塔沟武校的格斗拳手，有两万人在这里练武。（跟泰拳全国锦标赛相比，自由搏击锦标赛的中国裁判们，更像泰国人一样对待我们。\",\"url\":\"http://zhuanlan.zhihu.com/p/1960972806348075354\"},{\"slug\":\"2025-10-13-550亿财产被接管-能够填多少坑\",\"year\":\"2025\",\"title\":\"许家印550亿被接管：23亿美金海外信托也抵不过国家一纸法律\",\"date\":\"2025-10-13\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"许家印550亿被接管：23亿美金海外信托也抵不过国家一纸法律用尽心机，海外设立了23亿美金的信托，想要留给子孙。自己愿意死在牢房里面，都要尽力照顾妻女，可谓爱子，爱妻之心强烈！许家印太不读书了，不懂古圣人交的智慧我把自己赚到的钱，用来做清一公社，实行局部共产主义。我照顾了别人的子女，我自己的子女自然就照顾到了、如果我一心只想把我的钱只给自己的子女用，结果我看和许家印也差不多！最终还是什么都剩不下，不如我剩下一个清一公社吧！\",\"url\":\"https://www.zhihu.com/pins/1961202551602016284\"},{\"slug\":\"2025-10-13-今天-我终于开始卖出一点白银有色的股份了\",\"year\":\"2025\",\"title\":\"开始卖出白银有色：5.37出一部分，尾盘又涨停再卖百万股\",\"date\":\"2025-10-13\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"上午，我看连续涨停的白银，盘面上看有点涨不动了，就开始卖一部分出去。非常的强势，我一高兴，又卖了一点出去，总共卖了一百多万股白银。今天30亿的成交，背后操弄的人，绝非凡品！今天显然是洗盘，大量的爆量，就是让我这种“自以为聪明”的老股民，以为主力开始出货了，一看这种高位放量，涨停破板的主力出货图形，就会赶快的逃走！可惜我没有真的去执行---主要是手头的货已经不少了，关键是白银有色，我是第一次做。\",\"url\":\"https://www.zhihu.com/pins/1961154523834855678\"},{\"slug\":\"2025-10-13-十大中-新进入一个大户-一口就吃了两千多\",\"year\":\"2025\",\"title\":\"十大新进大户一口吃两千万股：我成本低不怕，输时间不输钱\",\"date\":\"2025-10-13\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"看样子，我马上就要被这些新人逐出十大了。这些新人才是牛人，他们出来开干，我们这种小散就该消失了。输时间不输钱、这些牛人刚赚万白酒的钱，就来玩有色，效率太高了，不得不佩服！螺母港股从3元多，慢慢涨，到现在17元了，我还持有不少。如果涨快了，像中糖一样，可能我赚了50%就跑了。另外比较以下市值：中金才220亿市值白银已经413亿市值了。这也是我重仓主要在中金，而非白银的核心原因！\",\"url\":\"https://www.zhihu.com/pins/1961165440949650683\"},{\"slug\":\"2025-10-11-30年前的普通五粮液对比现在的高端经典五\",\"year\":\"2025\",\"title\":\"品酒的本事难学：我用鼻子也尝不出差别，不如可乐好喝\",\"date\":\"2025-10-11\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我用不用鼻子去品酒，我都认为酒的味道都一样，都辣，都不好喝。想让我去辛苦学会这个高手的“品味”。我真学不会，我认为比太极征泰难多了！第二：就算我认真去学会这个本事，它能带给我什么？我的学生，学了太极征泰，可以去拿冠军，为家庭争光。就为了得到个自我感觉良好：我知道----啥是酒香，啥是陈香?当你学会用我这方式，去辨别清楚你付出的时间，金钱，你到底要什么？​​[飙泪笑]​​[飙泪笑]​​[飙泪笑]​​\",\"url\":\"https://www.zhihu.com/pins/1960382248512644970\"},{\"slug\":\"2025-10-11-清一公社-百年传承-共产公约-一-我们利\",\"year\":\"2025\",\"title\":\"清一公社共产公约：用金融工具实现百年传承与共同富裕\",\"date\":\"2025-10-11\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"帮助社员们摆脱资本家的奴役和剥削，我们用和资本家完全站在一起的方式去摆脱资本家的控制，最终实现清一公社的家族百年传承目标。三：社区的资管人员，在为自己的金融资产进行打理的时候，也同时帮助其他所有的社员，义务去打理社区的金融资产，让这些资产保值增值，传承百年。全体社员把古代圣贤的理想追求，把我们先辈的共产主义理想，在我们这个已经物质发展足够丰富的时代，去使用这些资产，去尽力创造一个富足和平等的社会。\",\"url\":\"https://www.zhihu.com/pins/1960476270308591592\"},{\"slug\":\"2025-10-11-用学生的业余爱好-去挑战职业格斗手饭碗的\",\"year\":\"2025\",\"title\":\"用业余爱好挑战职业拳手饭碗的学校：全世界只此一家\",\"date\":\"2025-10-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"在清迈，一所终结泰拳500年不败神话的中国奇迹学校学霸去拿格斗冠军的世界记录，清一大学取得零的突破！全世界还真没有一所能够培养格斗世界冠军的大学。因为世界冠军近乎于上天的宠儿，是天才，努力和运气缺一不可的集合。想要培养世界冠军的难度，要比培养出一个学霸要难得多。这是全世界唯一一所，旨在培养学霸去打格斗冠军，提倡文人格斗的，倡导学生成为文武双全的学校。这绝对是中国人的创造，中国自己的世界顶尖名校！\",\"url\":\"https://www.zhihu.com/pins/1960358191759077954\"},{\"slug\":\"2025-10-10-2025全国自由搏击锦标赛-青年组-落幕\",\"year\":\"2025\",\"title\":\"2025全国自由搏击锦标赛（青年组）落幕\",\"date\":\"2025-10-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"练了三年的公主班13个人，和练了1年的冠军班30多个学生，今年一起参加了在重庆举行的自由搏击锦标赛（青少年组）。公主们也洗刷了自己去年8月，首次参加2024全国自由搏击锦标赛零金牌的耻辱。（跟泰拳全国锦标赛相比，自由搏击锦标赛的中国裁判们，更像泰国人一样对待我们。因此公主们夺牌的难度比泰拳更大。公主班，冠军班参加2025年全国自由搏击锦标赛（青年组）合影我们队员，本次是代表【云南昭通队】参赛。\",\"url\":\"http://zhuanlan.zhihu.com/p/1959747016897861176\"},{\"slug\":\"2025-10-10-一直在想-我们有啥对不起清黑的\",\"year\":\"2025\",\"title\":\"我们有何对不起清黑：陀氏说打击人最狠的是让他自觉有罪\",\"date\":\"2025-10-10\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"清一新教育一再创造出教育，武术的世界奇迹。这些清黑，都是自己离开平台，自己放弃了最美好的未来，干嘛不去反省自己？”是的，我们现在活得很好，实际是我们活得太好了。相比这些清黑的生存现状，这群离开后只会去吃喝玩乐。放纵自己的清黑，我们的精进和努力，创造了一个又一个美好的记录！这些记录，大大的刺激了清黑，让他们失落的确怪我们太优秀，因此对清黑就“太残酷”了。#清黑是人生失败者##清一新教育##文人格斗#\",\"url\":\"https://www.zhihu.com/pins/1959905533222970566\"},{\"slug\":\"2025-10-10-人是如何废掉的\",\"year\":\"2025\",\"title\":\"人是如何废掉的？\",\"date\":\"2025-10-10\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"让子女废掉的三个原因，看看家长们有没有正在这样做？一是懒病：只要家长成天教孩子好吃懒做，不运动，不做事，缺乏责任感，长大后废掉的可能性很高。二是无志：家长每天只关心吃喝玩乐，还可以活下去。但还有爱孩子之心，为家人服务之心，还是可以活得心安理得的。因为上一代人，父母辈心中只有钱，一生就是为了钱而忙。都是帮孩子废掉的最好办法，国内高考不用考，国外高考也不用考。她也能活得像个有尊严的人，比当社畜好多了！\",\"url\":\"https://www.zhihu.com/question/310689818/answer/1959971292448023280\"},{\"slug\":\"2025-10-10-勾引羊群的美好草原-正在向你招手\",\"year\":\"2025\",\"title\":\"资本盛宴开启：以为自己是狼的傻羊跑来了，我是吃剩肉的狐狸\",\"date\":\"2025-10-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"为什么顶级游资著名刺客能做到2年157倍惊人战绩？“快来当狼”，这里肉多羊傻、、、于是，一大群一大群以为自己是狼的傻羊。我会非常感谢这些羊的，因为我是一只小狐狸。剩下的羊，吃狼给的小肉，吃习惯了，天天去吃几嘴。有一天就自己变成肉上桌了[开心]老实承认：有时候，我遇到了超级狡猾的狼。幸亏我只是远远的伸出爪子去陷阱里面捞肉，没有全身跳下去，不然：我也成了狼肚子里面的肉了！\",\"url\":\"https://www.zhihu.com/pins/1959982266970273378\"},{\"slug\":\"2025-10-10-清一战队昨日决赛中-连续KO体制优秀拳手\",\"year\":\"2025\",\"title\":\"全国自由搏击锦标赛：清一战队连续KO体制拳手，拿下6金\",\"date\":\"2025-10-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"2025全国自由搏击锦标赛（青年组）落幕根据规则：公主马上18岁了，只有能够拿到全国冠军的人，就可以继续练武，继续读【清一大学武道专业硕士学位】。然后再给你三年时间的空间，去夺取世界冠军的头衔。如果能够拿到了世界冠军之后，才有资格留下来当【清一大学武道博士】，正式深入的学习内家拳的拳理和奥义。我相信：全世界的体育大学武术专业，就没有比清一大学武道专业对学生的要求更高的了！\",\"url\":\"https://www.zhihu.com/pins/1959911563755516704\"},{\"slug\":\"2025-10-10-白银有色今天又涨停了惊喜惊喜不过\",\"year\":\"2025\",\"title\":\"白银再涨停，但最大利润来自冠农：昨日缩量已显主力控盘\",\"date\":\"2025-10-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"在昨日取得突破的基础上，今天居然差4分钱就涨停了。其实昨天是右侧买入的最佳机会，但我是左侧投资者，就没有去抢，只是拿她来分析了一下。如果一早就急拉涨停的话，过于强势，反而吸引了一堆人跑来跟风，不利于以后的长期上涨。）因此目前冠农这样不涨停的局面，就意味着未来可能有更大的空间和机会！我的冠农的仓位大幅增加，说来话长是个意外。我新买入的大多数冠农仓位，都是我在痛苦地卖出中糖之后，舍不得放弃新疆概念股。\",\"url\":\"https://www.zhihu.com/pins/1959942267721749670\"},{\"slug\":\"2025-10-09-今天有色继续大涨-白银今天又涨停了\",\"year\":\"2025\",\"title\":\"有色继续大涨白银涨停：换入几百万股中国中铁，酒股却在跌\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"国庆前的最后一个交易日，我换入了几百万股中国中铁。就因为她还没有涨，我就用涨了五倍的有色来换她。今天我想继续换中铁，结果涨了10%了？中冶也大涨了，涨了一倍多了。可是，今天重仓的酒股票都在跌？应该是有人抛出酒股，去追热点了。一个今日教师三年的收益超过550%了。因为她在我的港股账户亏损累累的时候买入的。收益，就是在绝望的时候入场才是正确的选择。我的港股持仓，已经涨了四倍多了。\",\"url\":\"https://www.zhihu.com/pins/1959562033885340074\"},{\"slug\":\"2025-10-09-信托其实是智商税如何看待媒体报道的许家印\",\"year\":\"2025\",\"title\":\"信托其实是智商税：许家印77亿海外信托被击穿，百年后利息不值钱\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我看过宗家的信托文件：约定银行每年给2%的分红给后代，本金永远不动，就是全部的条件了。这在目前的条件下，当然算是还过得去如果100年之后，这笔2%的利息，可能就少的可怜了。因为一百年的通货膨胀，会让钱变得完全不值钱！何况：我还怀疑100年之后，甚至30年之后，美国难说还会存在，说不定就解体了宗家的这笔钱。因为免除了利益集团的盘剥，我们把所有的收益都用来帮助我们自己了。\",\"url\":\"https://www.zhihu.com/pins/1959412998197208369\"},{\"slug\":\"2025-10-09-刚刚无意中去看了冠农的周线图-突然发现最\",\"year\":\"2025\",\"title\":\"冠农周线四周缩量：主力控盘跌是假的，我8元补货晋升三大\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"最近几周的下跌其实就是假的（当然我也乘机买了一点8元左右的货色，成功晋升三大了）。今天的拉起基本就是必然的！再往前看了一下走势：发现关键的走势点出在4月11日的周线图上。一周成交量放大到了20多亿，几乎就是流通盘的一半换了一遍！判断下来---散户筹码基本上洗得差不多了。之后较长时间的震荡，把投机买入的资金洗掉了。就是不想燕京这么妖，真想冠农也像燕京一样妖一下，让我看不懂，我就有更多机会了！\",\"url\":\"https://www.zhihu.com/pins/1959679550410696381\"},{\"slug\":\"2025-10-09-将来内卷加剧-女孩没有工作-这种陷阱就会\",\"year\":\"2025\",\"title\":\"内卷加剧女孩陷阱多：公司养你三年再一锅端，天上不掉馅饼\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"之前一个公司，为了把人骗到国外嘎腰子，怎么做的？正常营业三年，给你发三年的工资，最后一个团建，一锅端了。说女儿家给你三万是假的，找机会黑你是真的。不过，如果我有给女儿的鹰粉百年基金，让她一生生活无忧的话，其实根本就不担心被这种骗局骗。从小对她的培养重点，就是少私寡欲，服务他人，而不是去“捞”，这样的价值观，就能让她一生幸福平安。如果她住到磨丁去，这力有很多家人，志同道合的家人。\",\"url\":\"https://www.zhihu.com/pins/1959524693020218131\"},{\"slug\":\"2025-10-09-张清一-送给子孙后代的百亿大礼鹰粉一号从\",\"year\":\"2025\",\"title\":\"鹰粉一号：自第二年起给持有人发永续薪水，还会自动增长\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"工资还会自动的增长，基金将根据上海地区的工资标准，来制定每月”发工资“的水平。还有清粉平台提供的其他教育和医疗保证等等，种种好处，就不多提了。我猜将来蕙兰冠军园的服务，都会严格限制---只有已经是持有人的鹰粉家人才能享受医疗和会员服务的地方。毕竟：清一家族的平台，服务于自己的家人才是重点。我其实不相信有人会主动的退出这个家族基金的。只要违反了清一家规，入门誓言，我们就会把这人踢出去！\",\"url\":\"https://www.zhihu.com/pins/1959530627297703116\"},{\"slug\":\"2025-10-09-张清一-送给子孙后代的百亿大礼鹰粉一号百\",\"year\":\"2025\",\"title\":\"鹰粉一号的好处：年息高于存款、第二年起分红、收益权可转让\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"张清一：送给子孙后代的百亿大礼鹰粉一号百年基金，有如下实实在在的好处：一：持有者每年都能拿到比银行存款利息更高的利息（感谢大A，今年设置的基金还有这个能力来买到这个良好的基础保障条件，以后就未必有机会了）二：从投资的第二年开始，每年都能分红！不像社保要投资到70岁才能领取。五：会员可以获取鹰粉一号基金支持的教育和体育项目的赞助优先申请资格六：投资人死亡之后，自己的基金收益权，可以让子孙后代继承。\",\"url\":\"https://www.zhihu.com/pins/1959408412749206027\"},{\"slug\":\"2025-10-09-西班牙公主要去军校三年训练西班牙国王的长\",\"year\":\"2025\",\"title\":\"西班牙公主入军校三年：与清一公主苦练同理，为一生积累资本\",\"date\":\"2025-10-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清一公主们都要学三门语言，要打冠军，要做文人格斗。这个西班牙公主要去军校训练三年，其实是一样的意义：公主们不是要去上战场，要去打仗，而是要用艰苦的军校生涯，来为一生的成长，积累足够的资粮。我们从擂台战场上训练出来的公主，会比西班牙这种军校的公主更有“斗士精神”。我们注意到：文中提到的公主的可能男朋友，也是金融世家的后代。家长们应该多想想：为啥这些富二代，贵二代们，都要送孩子进入军校历练？\",\"url\":\"https://www.zhihu.com/pins/1959700903318753487\"},{\"slug\":\"2025-10-08-张清一-送给子孙后代的百亿大礼\",\"year\":\"2025\",\"title\":\"张清一：送给子孙后代的百亿大礼\",\"date\":\"2025-10-08\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"张清一：【家族财富百年传承课】思考方案及解答我找到的方法，就是设立一个“家族百年永续传承基金”。在19年之后的今天，已经有大半个亿了，很可能明年后年就有一个亿了。80年后，我说这个账户的资产至少有一百个亿，你们认为会很离谱吗？那么：也许我还会和相信我的公主们，以及有缘的家族伙伴们，共同创造一个【赠送百亿资产给子孙后代的奇迹！这就是本次的鹰粉节，我送给清粉们的大礼包。\",\"url\":\"http://zhuanlan.zhihu.com/p/1959042106506080617\"},{\"slug\":\"2025-10-08-穷人身上有哪些不好的习性\",\"year\":\"2025\",\"title\":\"穷人身上有哪些不好的习性？\",\"date\":\"2025-10-08\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"穷人也会因为心穷而导致生活和事业的困顿。因为索取，穷人会抱怨：责怪这个世界给她的太少，满足不了她的贪欲。对比自己强的人，会升起强烈的怨恨和抱怨。因为跟人攀比，穷人会怨恨，愤怒的情绪包裹着自己，因此穷人活得很纠结！因此如果你认识这些人，最好的方法就是立即躲开。保护自己的能量场|远离烂人：对负能量者生理性排斥，只与积极上进者交往这种习惯，非常有效的保护了我们免受很多底层人的影响。\",\"url\":\"https://www.zhihu.com/question/395756541/answer/1959180566973879290\"},{\"slug\":\"2025-10-08-远离烂人是所有聪明人的行为准则穷人身上有\",\"year\":\"2025\",\"title\":\"远离烂人：对负能量者生理性排斥，只与积极上进者交往\",\"date\":\"2025-10-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我和刘老师，有一个共性：如果和人接触的时候，发现有明显负能量的人，我们都会“生理性不舒服”，会对这种人很排斥，今后就会尽量的远离这种人。这种习惯，非常有效的保护了我们免受很多底层人的影响。我们都只喜欢和积极，上进，开朗的人交往。只要是喜欢攻击，抱怨，诋毁他人，不承担责任，不反省自己的人，就是负能量人。下面这篇文章，清晰地说明了很多负能量人的行为特征。李笑来当年去韩国读书时，恰逢是亚洲金融危机。\",\"url\":\"https://www.zhihu.com/pins/1959175599714186941\"},{\"slug\":\"2025-10-06-一个故事-身边同事-玩钱宝-扔进去了几\",\"year\":\"2025\",\"title\":\"劝人别玩钱宝反被恨：这就是清黑的古怪逻辑\",\"date\":\"2025-10-06\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我知道她玩这个，出于好心还特意的跟她说“:这玩意一定是诈骗，能撤就撤出来。”大姐找了无数个理由来说服我，证明我是错的。后续是钱宝暴雷，暴雷后大姐在公司看见我的眼神是仇恨的……她恨上了我……】这就是清黑的思维方式。很难理解，却十分有趣的古怪逻辑：第一：我是对的。我这么聪明的人，怎么可能错？她们如果离开平台，一定是最聪明的决策，因为他们选择了光明！第二：如果事实证明自己错了---一定是别人错了。\",\"url\":\"https://www.zhihu.com/pins/1958636989218816261\"},{\"slug\":\"2025-10-06-如何评价发售前网上风评很差的小米17系列\",\"year\":\"2025\",\"title\":\"如何评价发售前网上风评很差的小米17系列，继开售5天达成100万销量后，发售8天达成100万激活量?\",\"date\":\"2025-10-06\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"挺好的，又多了一款抢苹果市场的中国手机了。据说：现在小米汽车的顾客，有52%的比率是苹果用户小米汽车的出现，成功地吸引了原来的苹果用户。对于苹果每年4000万的销量来说，小米的市场空间很大。因此：市场形象的提升，对于小米来说极其有价值。另外：我突然发现，我居然是“手机极客”。【真正的手机极客发烧友买红米，随大流的手机消费者买苹果，Mate。特别耐用，我放了七天，居然还有电（我一直没有关机）。\",\"url\":\"https://www.zhihu.com/question/1958274581233133003/answer/1958654013873583171\"},{\"slug\":\"2025-10-06-洪门36誓\",\"year\":\"2025\",\"title\":\"洪门36誓：\",\"date\":\"2025-10-06\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这是在海外现在还存在的帮派，国内的洪门其实也有的，已经成为了“民主党派”--致公党。这些入门的誓言，如果尊照执行，我相信社会风气会好很多的。海外华人抱团的还是有的，没想到洪金宝居然就是洪门，还是总堂主。一，自入洪门之后，尔父母即是我父母，尔兄弟姊妹即是我兄弟姊妹，尔妻即是我嫂，尔子侄即是我子侄。六，凡我洪门兄弟，不得做线捉拿洪门兄弟。十二，今晚入洪门，年庚八字须要报真姓年月日时。\",\"url\":\"http://zhuanlan.zhihu.com/p/1958428859394401772\"},{\"slug\":\"2025-10-05-我一直拒绝捐款-但总有人以为我“要人给我\",\"year\":\"2025\",\"title\":\"我一直拒绝捐款：自己的钱都用不完，分享基金不是要钱\",\"date\":\"2025-10-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"以下是我在鹰粉节，百年财富传承课的回复：【（2）##学校的结余全部无条件捐赠给清一新教育基金。（3）个人财富无条件捐赠给清一新教育基金。我自己的钱都用不完，我不需要你们的钱拿来给我，我认为是个沉重的负担。我希望的是：你们这么多人，都说三个臭皮匠赛过诸葛亮。我认为你们的方案可行，如果你们愿意给我一个一起加入的机会，我会很荣幸。还会把以后的接替人员一代一代的培养好，毕竟我有清一大学这个资源。\",\"url\":\"https://www.zhihu.com/pins/1958170109643301165\"},{\"slug\":\"2025-10-04-今天的结果不重要-重在参与\",\"year\":\"2025\",\"title\":\"结果不重要重在参与：赛场是炼心场与检验地，不是高考场\",\"date\":\"2025-10-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"全国青少年自由搏击锦标赛播报2|赛前一天准备，明日开赛！赛场不是考场，就是一个炼心场。结果在上场前就决定了。上场只是给一个结果罢了。不是一考定终身的高考地。来这里是为了检验自己的水平，发现自己的毛病的。赛场也是学习场，可以向来五湖四海的朋友学习提高！这次赛事总共602人参加。比赛人多挺好的，有机会和外家拳手交手，学习提高。没指望冠军班夺金，夺金是公主班的目标和任务。\",\"url\":\"https://www.zhihu.com/pins/1957728129951987219\"},{\"slug\":\"2025-10-04-怪异心理的支撑点千万别对低层次的人太好\",\"year\":\"2025\",\"title\":\"别对低层次的人太好：交易听着冰冷，却是对人最大的尊重\",\"date\":\"2025-10-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这也是我从清黑事件中得到的教训。别啥好东西都送出去。你拿诚意来交换。。。。“交易”这个词，听起来很冷冰冰，但它却是一种对人最大的尊重。 【 千万别对低层次的人太好，因为他们不识好歹 - 我是朝朝的文章 - 知乎】……\",\"url\":\"https://www.zhihu.com/pins/1957927550987765758\"},{\"slug\":\"2025-10-03-清一新教育-像珍惜眼睛一样-珍惜你的名誉\",\"year\":\"2025\",\"title\":\"像珍惜眼睛一样珍惜名誉：只会重复我话的人已失去思考力\",\"date\":\"2025-10-03\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"英子同学对课程的理解很到位，会思考和反省，会和自己的现实生活和事业结合一起来学习课程。很多学员听完了我上的一样的课程，却根本无法吸收和消化，只会重复一些我讲过的语言出来，无法变成自己的东西。你们作为“体制学渣”其实是一种幸运：你逃过了应试教育的毒害。这些体制的学霸，往往付出了失去思考能力的代价去换取了一些成绩。但公主班一些聪明的小孩，就说：原来考SAT就算只有四年也会成为这样？\",\"url\":\"https://www.zhihu.com/pins/1957356049616074639\"},{\"slug\":\"2025-10-02-庆典的目的-就是把自己的喜悦和祝福送给他\",\"year\":\"2025\",\"title\":\"庆典的意义是把祝福送人：教父看不起财迷老板，仍愿送他祝福\",\"date\":\"2025-10-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"他认为金钱就可以搞定一切，他也很感恩美国给了他发财的机会，教父非常看不起这种人。他对自己的助手称呼这个老板是“那个伺候尸体的笨脑瓜做白日梦”。但他在自己女儿的婚礼日来求他帮忙，他也愿意把祝福和公平送给他。可惜：国人大多数都像这个棺材店的老板，首先就是钱迷心窍。更恶心的就是：这群人会此赤裸裸的把儿女的婚庆，当做一次收割朋友的机会。婚礼对于国人来说，就是一个”可以接受“的负担，浪费金钱和时间生命。\",\"url\":\"https://www.zhihu.com/pins/1956985689670414826\"},{\"slug\":\"2025-09-30-学生真视频记录-清一新教育-新教育学生\",\"year\":\"2025\",\"title\":\"新教育学生卷考试会怎样：SAT1500分比例从50%刷新到75%\",\"date\":\"2025-09-30\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"【今日塾9月SAT成绩更新，这次有视频】从来不敢想象这个记录：2024年，首届示范班创造了50%学生考过SAT1500分的记录仅仅一年后，2025年，首届示范班创造的记录，就被完全刷新了。2026年的学生，又会创造什么样的记录呢？美国母语国家的最顶尖高中名校，需要刚出生就要去申请入学排队，只有美国的特权家庭才能申请的私立高中最优秀的学校，都没有这个成绩。这就是今日学堂最大的价值：尽量不去卷考试。\",\"url\":\"https://www.zhihu.com/pins/1956262970477753775\"},{\"slug\":\"2025-09-30-张清一-今日三校4年学完体制16年项目已\",\"year\":\"2025\",\"title\":\"张清一：今日三校4年学完体制16年项目已启动\",\"date\":\"2025-09-30\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"示范班用3年学完12年体制课程，是5年前，今日学堂提出来的教育口号，当年被说成是大骗子！今年示范班的记录再度刷新后，我们认为应该提出更高的目标了：我们已经启动了【4年学完16年】的新教育试验规划。今年，今日其他学塾，也准备跟进这个试验项目。今日塾最新刷新的逆天SAT成绩榜：75%学生过SAT1500分|学生真视频记录：清一新教育|新教育学生如果去卷考试，会发生什么？\",\"url\":\"http://zhuanlan.zhihu.com/p/1956263090975933629\"},{\"slug\":\"2025-09-30-昨天-今天的股市都涨疯了-账户继续创新高\",\"year\":\"2025\",\"title\":\"账户继续创新高：中冶江铜双涨停，感谢清黑集体反向助力\",\"date\":\"2025-09-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"涨停让我有些不安，江铜就出清了，反正我的持仓也不多。不过就算持仓再多，我看想要进入十大还得加倍才行。至于涨了三四倍的螺母和中色，今天在15元的高位就卖出了一部分，换了某低价没太涨低价矿业股。原来一直让大家买矿买矿，但中国人就是低价不买。我感觉现在的市场，有点快疯狂起来的味道了，到处秀涨停。股数量增加，就算是市值有所减少，我也无所谓。不去计较市值高低，只是算账我买入的股票越来越多就行了。\",\"url\":\"https://www.zhihu.com/pins/1956390115086665202\"},{\"slug\":\"2025-09-29-张清一-国庆清粉节-财富与家族传承课程\",\"year\":\"2025\",\"title\":\"张清一：国庆清粉节-财富与家族传承课程（功名利禄你要啥？）\",\"date\":\"2025-09-29\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"但老清粉总觉得：不做作业就缺点啥，认为学习的消化提高就不够。，因此要求我一定要提供电影课的课前作业，让他们提前预习。很多人，可能已经听过张明慧公开讲的【教父2】了。一：价值观，与方法论，行为学三合一研习主题作业：请找出老教父和他的四个儿子（一个养子汤姆），一个女儿，以及女婿，儿媳妇的核心价值观是什么？也就是说：支配他们一生行为的价值观是什么？警长的这一拳，你认为让迈克学会了什么核心价值观？\",\"url\":\"http://zhuanlan.zhihu.com/p/1955939104484230108\"},{\"slug\":\"2025-09-29-施比受-谁更有福\",\"year\":\"2025\",\"title\":\"施比受谁更有福：慈禧像被关在金笼里，我不如自在行走\",\"date\":\"2025-09-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"古代封建社会，皇后王妃沐浴时被多名奴仆服侍，是否会感到尴尬？看慈禧的生活方式，我其实很不理解的。换了我，我会觉得---我在侍候这么多人！养着这么多人，多累呀？不如我现在这样，悄悄的行走在城市里面。想吃啥就吃，买啥就买。看啥就看。她把自己关在一个大大的金笼子里面，养着一大堆人，陪她玩这种无聊的游戏。\",\"url\":\"https://www.zhihu.com/pins/1956045180391135153\"},{\"slug\":\"2025-09-29-昨天一早5点钟起床-然后从清迈去清孔\",\"year\":\"2025\",\"title\":\"清迈到清孔再到磨丁：陪小公主照相，给清粉节电影课写作业\",\"date\":\"2025-09-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"去金三角陪公主塾的小公主们照相。然后晚上1点钟才到磨丁。昨晚休息很好，酒店非常安静。然后我给清粉节的电影课写了一份作业张清一：国庆清粉节-财富与家族传承课程（功名利禄你要啥？）今天就写这七个题目吧。如果你们真的做得出来，我就会说一句武汉话：“我信了你们的邪!如果你们做不出来这七道题，我会说：你们连这些题目都没有思考过，你们活著干嘛？你们还来上啥家族传承的课程？你们会给我什么样的答案呢？\",\"url\":\"https://www.zhihu.com/pins/1955948490208286168\"},{\"slug\":\"2025-09-29-有这笔钱\",\"year\":\"2025\",\"title\":\"有钱不如买茅台五粮液股票：北京权力寻租直白，老板只是红黑\",\"date\":\"2025-09-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"拿去买茅台酒，五粮液股票。放到今天1000万了吧？你什么时候意识到自己没见过世面？北京的权利寻租，就这么直接。去年我去北京，见过一个老板。应该是为我们同学请客的会所的订餐付账。多少钱，我不知道。但鲍鱼是有的。但这个老板能拿到什么？我看不好说，反正我啥都没付。有时间：只有钱的老板，其实是红黑两道拥有权利人的鱼肉。真可怜！我可不想成为这种人！宁肯买股票死扛。拿利息算了！\",\"url\":\"https://www.zhihu.com/pins/1956034650360218672\"},{\"slug\":\"2025-09-29-现在越来越喜欢磨丁了\",\"year\":\"2025\",\"title\":\"越来越喜欢磨丁：权力寻租空间最小，只守「不侵害他人」底线\",\"date\":\"2025-09-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我们的行动自由度，比在其他任何国家，地方都更大。只要不去影响他人，强迫他人的话，在这里就没人管你的。在国内，其实也一样有大量的女人出售自己。在这里，很可笑的是：女人们涌来这里（据说还有越南女人也过来了），拥有她们的自由。现在最好的消息就是：磨丁的围网区马上就建好了。不再需要护照和签证，这个就是原来我选择磨丁特区的理由---自由度超高，连海关的权利都取消了，这将是中国的第一特区！\",\"url\":\"https://www.zhihu.com/pins/1956062267125764824\"},{\"slug\":\"2025-09-27-George-Dixon-vs-Ches\",\"year\":\"2025\",\"title\":\"研究现代格斗：古泰拳技术远比现代泰拳丰富，是单重拳法\",\"date\":\"2025-09-27\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"GeorgeDixonvsChesterLeon我研究现代格斗的结果，是发现现代泰拳，在技术上远远不如古泰拳的技术丰富，训练的难度上，古泰拳显然更高级。现在留下来的表演中，非常明显的体现了这一点。而现代泰拳是双重拳法，跟西方拳击是一样的。结合泰拳的历史，就是被英国人改造的格斗技术历史。我有点好奇：古代的英国拳击英国是啥样的呢？节奏，结束，发力，距离感，和现代拳击真的差多了。\",\"url\":\"https://www.zhihu.com/pins/1955342854034555672\"},{\"slug\":\"2025-09-27-我的探索还刚刚开始-这是他死前留下的\",\"year\":\"2025\",\"title\":\"他死前说「探索还刚开始」：与我同龄，愿每一天都在创造理想\",\"date\":\"2025-09-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"但我希望，我们活着的每一天，都在追求和创造我们自己的理想。我们的一生，不是要去体验别人创造的最新的产品（刚好昨天再看小米雷军的新品发布会）。我正好手上用的是小米的A5，但我一点也不想去换小米的17。我感谢世界，让我还有机会去创造不凡的未来。他的梦想是要改变世界的气候和自然的生态。我的梦想，是要改变世界的人，不要去破坏生态就好。只要有机会去做，甚至有机会获取成功，是我的幸运！\",\"url\":\"https://www.zhihu.com/pins/1955133557153431728\"},{\"slug\":\"2025-09-27-张清一文-小米2025发布会-雷军演讲的\",\"year\":\"2025\",\"title\":\"张清一文：小米2025发布会，雷军演讲的思考。\",\"date\":\"2025-09-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"只要是知道这件事情的人，即使是不喜欢武汉大学的人，都会认为雷军有情有义。我们只相信雷军的有情有义全球第一，而不会真的相信武大真的就是世界第一名校了！明知他说的不是真话，都没人会说雷军一句不好！2：为什么3000人开发芯片的企业宣布解散会让小米震动这么大？【5年前，在小米创业10周年复盘会上，雷军定下了“技术为本”的铁律，下定决心要在核心技术研发上投入1000亿元，最终大约投入了1020亿元。\",\"url\":\"http://zhuanlan.zhihu.com/p/1954947273063657793\"},{\"slug\":\"2025-09-27-珠海一司机台风天驾车造浪-致周边商铺玻璃\",\"year\":\"2025\",\"title\":\"珠海一司机台风天驾车造浪，致周边商铺玻璃门损坏，被行拘十日，有哪些警示意义？激起水流破坏力有多大？\",\"date\":\"2025-09-27\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"这是一家公司的老板，开的是不怕水的仰望。他只是看到大水，开心地把车当作大玩具来玩。仰望的确是老板们的大玩具。但是：这种玩法，注定让他出名，而且社死！今后他到哪里，都会被人说：就是新闻中报道的台风天，自己开车去反复造浪，损害别人财产的司机。我都担心：他的公司和产品会被客户默默的抵制。不过：能够过水的仰望，因此会让更多人知道的。这是仰望的创造，不是司机的创造，你就是买了个车，得意个啥？\",\"url\":\"https://www.zhihu.com/question/1954560005647853093/answer/1955138199149080600\"},{\"slug\":\"2025-09-27-看懂了国礼计划还敢黑今日\",\"year\":\"2025\",\"title\":\"看懂国礼计划还敢黑今日？保守定2028年，结果提前实现\",\"date\":\"2025-09-27\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"华人世界名校正在快速成形中---今日国礼计划开启！当时我还不知道，今年会有相当于奥运级别的世界运动会。我保守地把正式实现的时间，定在2028年。结果去年年底，就拿到了3个东亚冠军，今年8月，就拿到了世界运动会冠军！现在的新计划是：2028年，公主不仅仅要拿更多的世界冠军，还要实现女打男的超越技术，彻底展现超越现代格斗的中华武术，从此扬名天下。实现了这些结果的女孩，就都是我们的国礼了！\",\"url\":\"https://www.zhihu.com/pins/1955367028740326978\"},{\"slug\":\"2025-09-26-张清一转将军演讲-滑铁卢之战是在伊顿公学\",\"year\":\"2025\",\"title\":\"张清一转将军演讲：滑铁卢之战是在伊顿公学的体育场上打赢的。\",\"date\":\"2025-09-26\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"清一点评：我很早就知道，贵族学校【伊顿公学】的生活条件非常的简单朴素，甚至是简陋。这个皇家军事学院也是一样的，简陋的生活，丰富的精神。本文为金一南几年前在华为内部的演讲《将军是怎样产生的？作者|金一南国防大学教授金一南曾在华为内部分享过主题为“将军是怎样产生的”的演讲，任正非评价“这是华为最好的演讲”。拿破仑的战胜者，英军的惠灵顿讲过一句话：滑铁卢之战是在伊顿公学的体育场上打赢的。\",\"url\":\"http://zhuanlan.zhihu.com/p/1954694809626350704\"},{\"slug\":\"2025-09-26-怎样评价曼德拉的一生\",\"year\":\"2025\",\"title\":\"曼德拉：把南非从富裕核武国变成穷乱国，只因他是个「圣人」\",\"date\":\"2025-09-26\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"曾经是非洲最富裕，最强大的国家南非，还是当年在五常之外，唯一拥有自制核武器的南非。在伟大的圣人曼德拉的\\\"照顾\\\"下，成为一个混乱的，问题丛生的穷国，乱国。他总说看起来正确的话：比如，他说“人生而追求自由，自由的国家不会不欢迎追求自由的人民。一个纵容罪犯和落后人群，给他们自由的国家，就剥夺了中上层和精英们的自由。其实：多数家长，爷爷奶奶，就跟曼德拉一样，他们在扮演圣人。\",\"url\":\"https://www.zhihu.com/pins/1954906612331423344\"},{\"slug\":\"2025-09-25-张清一-股神出现意味着什么\",\"year\":\"2025\",\"title\":\"张清一：股神出现意味着什么？\",\"date\":\"2025-09-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"据说下面的业绩，来自于一位无名前家长的杰作：一个月之内，就让自己从千万富翁晋级到了百万富翁。金融市场上，我看很多人真的是自己把自己作死的！为什么游资陈小群能在短短几年的时间从30万做到10亿？（其实我不相信上面这个故事，我怀疑是故意编造出来的假人）我告诉朋友，这人是股神，他们认为我讽刺人。就算是一个想要故意赔钱的人，专门去买赔钱股票，他也没法弄到这么精准的，一个月就亏掉80%的资产！\",\"url\":\"http://zhuanlan.zhihu.com/p/1954594321719367125\"},{\"slug\":\"2025-09-25-消息的背后-是铜库存长期处于低位导致的\",\"year\":\"2025\",\"title\":\"铜库存低位是明牌：我重仓四只有色股齐涨10%，账户又创新高\",\"date\":\"2025-09-25\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"今天我重仓的四只股（百万以上持仓级）。中冶，洛阳钼业，铜陵股份，中国有色，居然都一起涨了10%甚至更多。我的股票账户，又继续创了历史高位。我几年前，强调用买铜，买有色，来保值增值的投资逻辑得以验证！今年走了大概40万股，均价14元的螺母。绝对价位还很低，我根本就不想动它的仓位。今天我把卖掉的持仓，继续买入一个很有潜力的矿业股，总共买了40万股。这个股居然还在低位，不知道哪里出了问题。\",\"url\":\"https://www.zhihu.com/pins/1954580611315525465\"},{\"slug\":\"2025-09-25-股市真的很疯狂\",\"year\":\"2025\",\"title\":\"股市真疯狂：3元的洛阳钼业与有色矿业，如今印证买实物保值\",\"date\":\"2025-09-25\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"我买了3元多的洛阳钼业，也买了三元多的中国有色矿业。当年我一直呼吁粉丝们买有色，我也买了很多，还借钱去买了！我说全世界的票子都印多了，我们买点实物。钞票不是财富，我们要换成财富我的话，一般总是不被人相信。今天，我最高价是14元多，卖掉一部分矿业股，每股赚了超过10元。我根本没有想到会这么赚的，只是想逃过通货膨胀就行了！啤酒也是矿---每年都在产出净现金流的欲望之矿。\",\"url\":\"https://www.zhihu.com/pins/1954488124823560560\"},{\"slug\":\"2025-09-24-中国为何把大豆订单全交给南美\",\"year\":\"2025\",\"title\":\"中国为何把大豆订单全交给南美？\",\"date\":\"2025-09-24\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"这个我认为大概率不是啥“制约美国”的问题，而是开辟中国产业和实业发展新通道，新伙伴的问题！长期以来，中国是非常依赖“美国大客户”的。当然，也为了平衡账户，中国也尽量从美国买一些我们需要的东西，粮食，大豆每年几百亿，再加上波音飞机，芯片等，尽量平衡一下中美的贸易逆差！但美国对中国，就是不依不饶的，非要全方位卡脖子，想要卡死中国。这个博弈中，大豆采购转向南美，是中国的一步大棋，布局很多年了。\",\"url\":\"https://www.zhihu.com/question/1940072030339839165/answer/1954321024867890033\"},{\"slug\":\"2025-09-24-印度打工人的天塌了-特朗普这次捏中了印度\",\"year\":\"2025\",\"title\":\"印度失去统战价值后被美国抛弃：对别人没用就会被抛弃\",\"date\":\"2025-09-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"印度在与巴基斯坦打仗，意外输惨后，就失去了制衡中国的统战价值。结果现在被美国抛弃，关税猛加，而且出台的工作签证政策，直攻印度的软肋，印度和美国合作的蜜月完了！这种国际政治关系，也是我们的人际关系：如果你对别人没有用处，你就会被抛弃。原来印度人最善于投机取巧，在中国，美国和俄罗斯之间跳来跳去的，别人看他有能力，都只能忍住气哄他。中国人就很聪明，一直很低调的去成长和发展自己，被欺负了也默默的忍受。\",\"url\":\"https://www.zhihu.com/pins/1954225899487597470\"},{\"slug\":\"2025-09-24-特朗普政府宣布欢迎-60-万中国学生赴美\",\"year\":\"2025\",\"title\":\"美国名校在关闭却欢迎60万中国留学生：只为续命\",\"date\":\"2025-09-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"昨天晚上，我刚发美国大学正在关闭中的想法，一些美国百年名校都在关闭中。未来趋势，美国还要关闭50%的大学（各位可以搜索这个信息）。我居然就看到特朗普表达要欢迎60万中国留学生去美国。实际上：2019年是中国留美学生的高峰，总共也只有有37万学生去美国。2025年，中国在美国的留学生已经降到了27万人。要让这些有钱的留学生来帮助美国大学维持下去。中国也快这样了：大学求人上时代快速到来。\",\"url\":\"https://www.zhihu.com/pins/1954116970376045524\"},{\"slug\":\"2025-09-24-静慧问过我-天使班的同学-为啥我不帮他们\",\"year\":\"2025\",\"title\":\"静慧问为何不帮天使班上大学：没目标的人上大学反被毁掉\",\"date\":\"2025-09-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一流大学上不了，海外二流大学随便上呀？也免得家长黑我我回答说：己所不欲勿施于人。一个没有养成积极向上的人，没有明确目标的人，如果去上大学，有可能会快速的毁掉他的。去上大学理工科，是去当工人，我也觉得不忍心。去上文科，是成为废材，我觉得就是花钱买抽的！让我安排这些明明不合格的人，没有目标的去上大学？只是我小女不想去上大学就算了，等她退役了，没事的时候，去大学玩玩也可以。\",\"url\":\"https://www.zhihu.com/pins/1954301952574853359\"},{\"slug\":\"2025-09-23-三语高中-泰语班的文章-知乎泰语班\",\"year\":\"2025\",\"title\":\"泰语班开学第一课：三语技能提前抢占职场，偷懒只会成废物\",\"date\":\"2025-09-23\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"三语高中-泰语班的文章-知乎泰语班WEEK1：开学第一课也许等冠军班将来读完大学，走向职场的时候，三语班的毕业生，已经在企业里面升职，当上中层了。三语「泰语管理班」，用三语技能提前抢占职场。是一个非常良好的赛道。但也需要学生努力精进。偷懒取巧，只会成为废物。这是继冠军班后，三语高中为新教育学生提供有效服务的一个开拓性的机会。比大学生更容易进入职场。\",\"url\":\"https://www.zhihu.com/pins/1953901778220332889\"},{\"slug\":\"2025-09-23-中国不急-要10年再开始大学倒闭\",\"year\":\"2025\",\"title\":\"大学倒闭潮倒计时：2035年轮到大学，一步步蔓延到就业\",\"date\":\"2025-09-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"出生率下滑产生连锁反应，小学倒闭潮已经正式来临2023年小学倒闭潮正式开启来算，6年时间关闭了8万所小学。小学6年时间，等到了2029年的时候，初中开启倒闭潮！然后2032年，高中倒闭潮2035年，大学倒闭潮，一步步蔓延到就业领域。按照目前大学的招生人数规模来看，将比10年后的适龄人口多出50%的数量。这一年开始，最终倒闭一半的大学应该是正常的。美国大学倒闭潮已经开启了，不少百年名校都在倒闭了。\",\"url\":\"https://www.zhihu.com/pins/1953966326470123645\"},{\"slug\":\"2025-09-23-你把游戏弄得太明白了-别人怎么玩\",\"year\":\"2025\",\"title\":\"狼人杀的规律：最秀的人最先被投死，太张扬就有人搞你\",\"date\":\"2025-09-23\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"所以要把你先投死！然后菜鸟们才好玩！理解了！为什么太张扬了就会有人搞你？我和朋友玩狼人杀，发现一个规律：大家总会把最秀的人先投死，即你的发言越清晰合理，你对局势的判断越清晰明朗，你演的越声情并茂，你就死得越快，不分青红皂白，不管对错是非。\",\"url\":\"https://www.zhihu.com/pins/1953808729318356338\"},{\"slug\":\"2025-09-23-假如他乖乖的去上大学了-只能当牛马了吧\",\"year\":\"2025\",\"title\":\"罗永浩：怕苦吃苦一辈子，他剪烂衣服破釜沉舟背单词\",\"date\":\"2025-09-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"李敖写的一句话：不怕苦吃苦半辈子，怕苦吃苦一辈子。这句话让罗永浩感到羞愧，然后冲了个凉水澡，继续背单词，背累了就做题，做累了就继续背。为了防止再次动摇，他把自己的衣服都剪烂，只留下一身秋衣秋裤，出门买菜时穿，破釜沉舟。罗永浩说他和普通人一样，都是懒惰的、没有毅力的。只有能够克服自己人性弱点的人，才能成功！不管罗永浩是否赚到了大钱，他的人生体验，和一般人真的不一样。他是一个特别丰富的人生。\",\"url\":\"https://www.zhihu.com/pins/1953731030033868638\"},{\"slug\":\"2025-09-22-为什么中国会出现内家拳\",\"year\":\"2025\",\"title\":\"为什么中国会出现内家拳？\",\"date\":\"2025-09-22\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"为什么中国会出现内家拳：因为中国人的脑子比西方人聪明得多。【上世纪初的世界重量级拳王杰克·邓普西的书—————其中宣称，训练拳击三个月，练出来的重拳就足以击倒一个同体重对手，训练六个月，就能击倒一个比自己重得多的对手。外家拳练半年，就可以发出很有力量的拳，可以把人击倒了。但练我们的拳，几个木兰的拳，现在都还很难看，发不出力量来。不过，这些人，为啥不多想想：我们的拳手，还没有练出力量来。\",\"url\":\"https://www.zhihu.com/question/25155308/answer/1953547246625886601\"},{\"slug\":\"2025-09-22-你认识的被诈骗的人最惨的有多惨\",\"year\":\"2025\",\"title\":\"你认识的被诈骗的人最惨的有多惨？\",\"date\":\"2025-09-22\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"大多数傻傻的良民，只会辛辛苦苦的去认真工作，一生就像是牛羊勤勤恳恳的吃草一样。牛马认真吃草，认真干活，身上长出来的肉，没有一块是为了自己的，都是要拿出来做奉献的！当然想要不吃草，只吃肉很不容易，需要认真学本事和良好的训练。人类互相猎杀的方式多种多样，要么是哄骗，这是最常用的手段：用各种商品，各种消费品，各种升级换代，劝你每年都要换个手机，几年换个好车等等。有人进来没多久，就把自己一生的积蓄送光了！\",\"url\":\"https://www.zhihu.com/question/457778003/answer/1953435955643004765\"},{\"slug\":\"2025-09-22-张清一-精英和牛马有何不同\",\"year\":\"2025\",\"title\":\"张清一：精英和牛马有何不同？\",\"date\":\"2025-09-22\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"一：精英是一小群人，他们虽然少，但非常懂得团队配合和资源互换。所以：广交朋友，就是精英团队的共同特征。因此，即使对一些人有意见，他们也不轻易翻脸。一旦拥有资源之后，就会出来和其他拥有与自己匹配的，相同档次资源的人进行“利益互换”。【上士不争，下士好争】，其实这就是牛马的生存方式---彼此之间是没有联盟和利益交换关系的。人也一样：喜欢动脑子的人，做猎手，做精英，猎杀不动脑子的其他动物人、牛马人！\",\"url\":\"http://zhuanlan.zhihu.com/p/1953531751252104118\"},{\"slug\":\"2025-09-21-「中国式父母」为什么付出全部却养不出感恩\",\"year\":\"2025\",\"title\":\"「中国式父母」为什么付出全部却养不出感恩的孩子？\",\"date\":\"2025-09-21\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这个问题很不错，父母是孩子的神。孩子的问题，其实全部出在父母身上。我正在想：我们是不是明年推出一个新的招生方案：只考父母，不考孩子的招生方式。只要父母合格，而且认同我们的教学方式，我们就可以招录学生进行教学！如果父母考试不合格，孩子的条件再好，我们也不考虑。这样也避免有一些人，去找一些不良学堂胡乱折腾孩子了。我认为一些人打着新教育的名号，胡乱教孩子，也是惹来新教育黑的一个重要原因！\",\"url\":\"https://www.zhihu.com/question/549592878/answer/1953104658223571790\"},{\"slug\":\"2025-09-21-中国文科的存在是为了防止真正的文科出现吗\",\"year\":\"2025\",\"title\":\"中国文科的存在是为了防止真正的文科出现吗？\",\"date\":\"2025-09-21\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"官府需要的绝对不是这种庄子“真文科”，官府只需要当“附庸”的文科，来为封建阶级统治服务。听说庄子到梁国了，怕庄子这个优等生来抢他的位置，因为梁国的国王知道庄子来了。不过，有时候，这些学了真文科的人，也会为了验证一下自己学到的东西有没用，会出来做一点事的。所以：真文科，其实我们的社会（中国外国都一样），是不需要的。所以--现在的大学要缩减假文科专业了，因为没有人报了。\",\"url\":\"https://www.zhihu.com/question/1950932213198726002/answer/1953018276138448615\"},{\"slug\":\"2025-09-21-对于孩子的逃避行为绝不放纵的决心-才能改\",\"year\":\"2025\",\"title\":\"对孩子逃避绝不放纵：家长「舍不得」的结果是养一辈子废物\",\"date\":\"2025-09-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"家长“舍不得”的结果，自然就是养一辈子废物。商业转载请联系作者获得授权，非商业转载请注明出处。\",\"url\":\"https://www.zhihu.com/pins/1953186145111376942\"},{\"slug\":\"2025-09-21-美国优势是精英教育-中级是断层\",\"year\":\"2025\",\"title\":\"美国优势在精英教育、中层断层：中国基础教育扎实，精英自会涌现\",\"date\":\"2025-09-21\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"一位华裔数学家40年目睹之怪现状：美国学生的数学为什么那么差？【虽然美国普通理工科大学生的数学基础，和中国的同类大学生比起来弱得多，但是在诸如斯坦福大学就读的精英大学生中，许多人的数学本领强于中国名牌大学的数学尖子。中国的设计吗，也许相对不够美国的先进，但由于基础很好，制造能力很强。中美脱钩的结果，就是对美国损害才是最大的。因为他的基础教育，无法去培养出大量的中层的工程师，技术人员。\",\"url\":\"https://www.zhihu.com/pins/1953054418858651801\"},{\"slug\":\"2025-09-20-但理工科30岁就要被辞职-怎么办\",\"year\":\"2025\",\"title\":\"理工科30岁被辞怎么办：学文科靠背景，理工靠年轻冲劲\",\"date\":\"2025-09-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"大家在成都真实的收入是多少？在内卷日趋严重的中国，未来10年，20年，大约都不轻松的。学文科只能靠家里的背景后台。学理工科只能靠自己的技术和年轻的冲劲。被辞职后找不到工作，该咋过日子？你们以为人生就是越来越好，其实人生处处是陷阱。当然机器旧了就会换掉（理工学生）机器都不会当，只会无病呻吟，学些无用的文科专业，自然毕业就是失业。不好好做人，只会像动物一样依照本能生活，真的还是别活了。\",\"url\":\"https://www.zhihu.com/pins/1952659656397808464\"},{\"slug\":\"2025-09-19-张清一-心意拳古拳谱-转载-清一太极按照\",\"year\":\"2025\",\"title\":\"心意拳古拳谱：清一太极按此拳经打比赛，内家三派必求其中\",\"date\":\"2025-09-19\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"心意攻人之坚，而不攻人之塅，八卦纵横矫变，太极浑然无间，随其来体，不离不拒而应之以中，致柔之极，接臂如婴儿，忽然用之，虽贲育无所施其勇，强之力皆化为无力矣。】上面记载的法则，就是我们擂台取胜的秘密ll---l【太极空中---中则自立不败之地，偏者遇之，靡不挫矣】。泰拳和外家拳，就是“偏者”，他们的攻击方向和发力，都是两侧攻击的，我们是从中线攻击的。说起来简单，但格斗思维和训练方式就完全不一样了！\",\"url\":\"https://www.zhihu.com/pins/1952282824783692271\"},{\"slug\":\"2025-09-18-AKC是-亚洲踢拳联盟组织-的简写\",\"year\":\"2025\",\"title\":\"AKC亚洲踢拳联盟香港开赛：两拳手代表大陆出战港澳台\",\"date\":\"2025-09-18\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"明天下午就开赛。我们两个拳手代表中国大陆队去参加这次比赛，赛事在香港举行。我们的对手是香港，澳门，台湾人。希望孩子们在踢拳战场上，打出清一武士的威风来。可惜对手全都是华人，我们更喜欢打外国人。争取ELLA在11月参加东亚泰拳锦标赛！希望ELLA“千年亚军”的记录刷新，今年能够晋升为金牌冠军拳手。\",\"url\":\"https://www.zhihu.com/pins/1951982962603172861\"},{\"slug\":\"2025-09-18-为何传武成了笑话\",\"year\":\"2025\",\"title\":\"为何传武成了笑话？\",\"date\":\"2025-09-18\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"但：有几个是真懂传武，真懂现代格斗的人回答的呢？是因为传武的格斗思维，训练方式，以及格斗要求，都和现代擂台不一样。另外：在擂台规则和裁判的限制下，传武的一些技术，要么是犯规的，要么是无法发挥出来的！如果传武后人，只是拘泥于传武的练法，用法，肯定就没有啥用处了！因此现在，导致人们认为中国传武不行，比不过现代格斗。不过，这种传武实战擂台格斗，无人去尝试的局面，今天已经被我们打破了。\",\"url\":\"https://www.zhihu.com/question/594802568/answer/1952048610150708177\"},{\"slug\":\"2025-09-18-张清一-心意拳古拳谱-转载\",\"year\":\"2025\",\"title\":\"张清一：心意拳古拳谱（转载）\",\"date\":\"2025-09-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"一字一句，这都是古代宗师的心血。郭氏为山西繁峙县人，当年在山西沁县当捕快，最初练通背拳，后又跟着刘晓兰的弟子李伟夫练形意拳，遇戴奎后改练心意拳，是戴奎的大弟子。由于他是秀才出身，故戴奎命之编订《心意拳术学》。​-------------​溯源心意拳之鼻祖为岳夫子，故又名岳家拳。予之心意拳学之戴魁老师，而戴系学于其父良栋。总之斯拳在太谷县名曰形意，在祁县名曰心意，然究其实，一而二，二而一者也。\",\"url\":\"http://zhuanlan.zhihu.com/p/1952146796596958841\"},{\"slug\":\"2025-09-17-为什么孩子小时候家长非常溺爱-长大后却不\",\"year\":\"2025\",\"title\":\"为什么孩子小时候家长非常溺爱，长大后却不孝顺？\",\"date\":\"2025-09-17\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"宇宙是：你展现什么样的真实身份，它就给你什么样的结果这些无条件宠孩子的家长，以为自己的给出无条件的爱，其实他们展现的真实身份，却是：恩怨颠倒。家长自己也展现了真实身份，就是：“不值得孩子尊重的人”。自然：他们都得到的孩子，自然也是“恩怨颠倒”，没有是非，没有原则的人。孩子长大后，对这种父母，自然也是不尊重，不孝顺的！孩子成功了，自然后感激父母，会更加尊重和孝顺父母的、宠溺的孩子。\",\"url\":\"https://www.zhihu.com/question/1923787418659689824/answer/1951584334038405553\"},{\"slug\":\"2025-09-17-咬自己的祖国为荣\",\"year\":\"2025\",\"title\":\"入日籍还否认南京大屠杀：中国制裁北大毕业的石平\",\"date\":\"2025-09-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"干嘛这女的，要玩这套“否认南京大屠杀，还玩“剪身份证，撕户口本，发朋友圈”的事情？最近中国政府制裁了一个北京大学哲学系毕业的，入了日本籍的人石平。你去做点中日文化友好沟通交流的好事不行吗？再不好，供养你读了北大，这个时代读大学，都是拿助学金的，没亏待你呀？你们离开了，去日本享受生活了，不去建设我们的祖国。我们也没有意见，你去好好过自己的日子就行了。吃完了饭，就丢一把沙子，去自己原来吃饭的锅里面？\",\"url\":\"https://www.zhihu.com/pins/1951688908061542239\"},{\"slug\":\"2025-09-17-张清一-不惜代价也要远离的10种毒人\",\"year\":\"2025\",\"title\":\"张清一：不惜代价也要远离的10种毒人！\",\"date\":\"2025-09-17\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"所以交友真的需要特别的慎重！生活中，我们的确必须远离一下看起来是“关心我们”，其实是把我们带到阴沟里面去的坏人。这些西方文章里面，整理出来的这10种人，的确是我们生活，事业中必须去发现，远离的10种人，不然她们自己找死，会把我们也拖下水去的！以下10种有毒之人，你应该不惜一切代价地远离，以便你自己不会成为其中一种。甚至都弄不清他为何发怒，恩怨颠倒之人、的确他是要不惜代价避免的毒人一个。\",\"url\":\"http://zhuanlan.zhihu.com/p/1951614821452722341\"},{\"slug\":\"2025-09-17-是不是大部分女性到了-40-岁-活着特没\",\"year\":\"2025\",\"title\":\"是不是大部分女性到了 40 岁，活着特没意思？\",\"date\":\"2025-09-17\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"如果人，只是活着的话，到了一定年龄，的确会觉得没意思。这个年龄的女人，大约对男人也差不多“绝望”了，不抱希望。如果40岁的女人，离了婚的（似乎40岁的女人离婚的比例超级大）大，家里有个不省心的熊孩子，生活也没有男人帮忙，一切自己打理面对，肯定觉得活得没意思！就算是没有离婚的40岁女人，男人出轨的，肯定会让女人觉得男人靠不住，人生没意思！女人会不会觉得：嫁给男人真没意思，嫁了优质男人，大家抢心累。\",\"url\":\"https://www.zhihu.com/question/61920590/answer/1951721556288971522\"},{\"slug\":\"2025-09-16-张清一-生涯设计的要点-以百姓心为心\",\"year\":\"2025\",\"title\":\"张清一：生涯设计的要点---以百姓心为心\",\"date\":\"2025-09-16\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"不然就算是拥有最高深的本领，没有需要，也可能潦倒一生。比如你觉得杀龙技术厉害，自以为是的去学习这种高深技术，去花了10年练出杀龙功夫，结果没人需要这种功夫，你再大的本事，也是白费。并去设计自己的人生道路，找到自己想服务的客户对象，去尽量按照客户的要求，来完善自己的简历，训练提升自己的技术。这种笨蛋，他用一生来练的武功，再高也无用。因此，人生设计，职业设计的要点，就是想要关注你想要服务的客户的需求。\",\"url\":\"http://zhuanlan.zhihu.com/p/1951221039490106970\"},{\"slug\":\"2025-09-16-昨天买了50万股燕京啤酒\",\"year\":\"2025\",\"title\":\"昨买50万股燕京：11.75接回5月13元多卖出的，一进一出多百万\",\"date\":\"2025-09-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"是补充5月28-29日前后我卖出燕京仓位的。我看到软件上都有交易记录，上一轮我卖掉不少燕京，最高是14.36元卖掉了。大多数是13元多卖掉了。我昨天买入的价格，最低是11.75元。这几个月，我啥事没干，一出一进，键盘上做做功课。总的仓位没有增加，但我的资产账上多了100多万，这全是抢来的钱，真不好意思！我是笨蛋，就傻傻的赚钱好了，然后用来养冠军。昨天卖掉的股票，今天全都跌了。\",\"url\":\"https://www.zhihu.com/pins/1951292659390982030\"},{\"slug\":\"2025-09-16-沙特用中国激光武器取得战果-全球首次在实\",\"year\":\"2025\",\"title\":\"沙特用中国激光武器击落无人机：出自1974年出生的女科学家\",\"date\":\"2025-09-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"“Thelightbelongstomymotherland.”创造的礼物，不想用来给洋人换取名利，而是要送给自己的祖国。中国的激光武器，居然是这个1974年出生的女孩子完成的，从她小时候就有强烈的目标感看出来：这就是一个有天赋责任的理想主义者，不求名，不求利，一心为国争光，锁定自己的目标，知道实现目标为止。这些人，还是去商业世界中自己沉沦，自己去追求好日子吧。\",\"url\":\"https://www.zhihu.com/pins/1951355677080552322\"},{\"slug\":\"2025-09-15-一个灵魂要投生了\",\"year\":\"2025\",\"title\":\"灵魂投生的寓言：想成为战士的灵魂，投生为草原上的狮子\",\"date\":\"2025-09-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"他回答：我想要挑战世界，我想努力奋斗，要一日不做，一日不食。她说：我就是想生活应该简单一点，轻松一点，不费力就能过一生。于是：这个草原上就多了一头牛，它真的过上了自己想要的生活。它也不用像狮子猎豹一样，要努力去学习各种猎食的技巧，不需要去拼命参加赢得生命的比赛，才能勉强吃一餐饱饭！世界上，99%的灵魂，都选择了第二种“平安”的生活。是一个找抽的人，我选择了艰苦和创造的灵魂。\",\"url\":\"https://www.zhihu.com/pins/1950918134748910052\"},{\"slug\":\"2025-09-15-上流社会的生活-顶级富豪或高管-是什么样\",\"year\":\"2025\",\"title\":\"上流社会什么样：云南前省长因几千万落马，当官不如正常买股\",\"date\":\"2025-09-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"其实我真不明白为何这么多人迷恋官场，想让孩子进入官场。云南前省长，前二把手，因为几千万的贪污就落马。在监狱里要度过一生，觉得他们真不值。要想赚钱，就找个懂行的人，会正常买股，赚上个几千万真不难。又想当官，又想发财，还想要女人，生私生子。这种人想要的太多，就只能人生“高危”了。不恋官位，不贪女色，也不贪钱（不要别人送我钱），我公平交易，自己赚钱自己用。这样子，一生平安富足，多好！\",\"url\":\"https://www.zhihu.com/pins/1950975664455909552\"},{\"slug\":\"2025-09-15-学历教育-教不出素质\",\"year\":\"2025\",\"title\":\"学历教育教不出素质：两个清华高材生为一个「情」字自毁毁人\",\"date\":\"2025-09-15\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"男人想在女人那里得到什么？两个清华高材生：自毁毁人的原因，就是一个情字！不爱了。就放下，离开。干嘛要杀人？人类的情感，真的是太可怕了。顶尖智商的人，都承受不了这种自毁的压力……\",\"url\":\"https://www.zhihu.com/pins/1950961956795181006\"},{\"slug\":\"2025-09-15-昨天看了个日本的视频-说实话-我有点震惊\",\"year\":\"2025\",\"title\":\"日本80年代公寓如今变负资产：我十年前卖掉武汉20多套房买股票\",\"date\":\"2025-09-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"日本80年代花800万买的公寓。不要钱都脱不了手我怀疑：未来的中国就要走日本这条路了看你们还买房子。十年前我就卖掉武汉的20多套房子去买了股票。后来，还一直劝大家不要买房子！你们大聪明，都听自己的！等将来，每年的房产税，物业税，都会把你们压垮的。有人让我花大钱买建学校。我说:不超过10年，中国将有大把的学校空置。只要你愿意接手，他们就感恩不尽了。房产----几乎会全废掉的！\",\"url\":\"https://www.zhihu.com/pins/1950936930687652399\"},{\"slug\":\"2025-09-15-高手就是认错-专家\",\"year\":\"2025\",\"title\":\"卖PICC港股7.18：我3元买入曾跌到1.44，港股比A股疯狂\",\"date\":\"2025-09-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"如果我是用融资买入的PICC，我就爆仓了。因此采用了是“我很可能是错的”这种思维方式来执行买入操作。既然我可能是错的，我买了会跌，我就要想：跌了我怎么办？当年的想法就是“跌了就拿着不卖，等分红。其实我就是真的没有信心，不认为我一定是对的，所以我分散投资。（其实U兄就是犯了两个错误，一个是认为自己是对的，另外就是股票过于集中，另外没有考虑下跌的危险。我卖出的时候，也是认错模式：卖了股票，涨了怎么办？\",\"url\":\"https://www.zhihu.com/pins/1950881499252495637\"},{\"slug\":\"2025-09-14-李想的思考方向挺好的\",\"year\":\"2025\",\"title\":\"李想思考《霍元甲》：做人间的牛马也比做真牛马还债好\",\"date\":\"2025-09-14\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"李想文人格斗的文章电影课《霍元甲》我们来到世间，肯定会消耗大量的世界的资源，服务。都是平衡自己的人生账户，为了不亏欠世界，不至于下辈子去做牛马还债，就必须为世界服务，为身边的人服务。做人间的牛马（打工仔），总比去做真实的动物牛马还债要好。因此，即使是去打工，去种田，也要认认真真的做好自己能做的事情。如果来到世界，如果自私自利，自高自大，只想让世界来满足我们自己的物质追求。\",\"url\":\"https://www.zhihu.com/pins/1950488589008893502\"},{\"slug\":\"2025-09-14-链接巴黎奥运会速度攀岩上面的想法谈到服务\",\"year\":\"2025\",\"title\":\"服务世界的两种方式：最好的是成就自己，如拿世界冠军\",\"date\":\"2025-09-14\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"我认为：最好的方式，最幸福的方式，就是用成就自己的方式来服务世界。比如：拿世界冠军，用为国争光的方式，来服务世界。必须去制造和生产物质，我觉得其实跟动物谋食，也差不多。用不喜欢的方式来服务他人满足别人的精神满足，比如去当演员，或者去移民局，看到官员们认认真真的做一些无聊重复的事情，我认为也是浪费人生的表现。但我更希望有更大价值的事情来做---用服务他人的方式来服务自己的最高愿望！\",\"url\":\"https://www.zhihu.com/pins/1950531720551043501\"},{\"slug\":\"2025-09-14-链接巴黎奥运会速度攀岩决赛通过这个比赛\",\"year\":\"2025\",\"title\":\"攀岩决赛中的男女差异：6秒赛程容错率极低，毫厘定胜负\",\"date\":\"2025-09-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"有些时候，总共六秒的赛程，两个运动员之间，只有百分之三秒的差距，最后一场比赛，是中国运动员以8%秒的差距输给对手。可以说，这种比赛的容错率很低，一个小小的不说失误、就是一点点延迟，都会导致输掉比赛。跟格斗类完全没法比，就是比练了千万遍的熟练度。看运动员们像猫一样快速爬上去，我一方面佩服，一方面也绝对不愿意让我的女儿去参加这种运动比赛。因为我看到：男队员普遍可以用4秒多一点，就完成15米的攀爬。\",\"url\":\"https://www.zhihu.com/pins/1950599291883205102\"},{\"slug\":\"2025-09-14-链接曼尼·帕奎奥势不可挡的力量-纪录\",\"year\":\"2025\",\"title\":\"帕奎奥：从2美元一场打到年收入上亿，成为菲律宾的「国礼」\",\"date\":\"2025-09-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"打到了一场比赛最高收入一个亿美金。他横跨了8个量级的世界冠军。他成为菲律宾的骄傲，他把自己打造为菲律宾的国礼。甚至，据说他还要竞选总统了，或者是--有人希望他去竞选总统。我们的木兰们，要走的就是成为：“继成吉思汗后，中国第二个征服西方的人”，我们要在西方人最崇尚的拳击项目上，打掉西方人的人种自信（西方人认为，亚洲人不适合打拳击）。帕奎奥是我们木兰的榜样，也是我们下一个要超越的对象。\",\"url\":\"https://www.zhihu.com/pins/1950503358583534325\"},{\"slug\":\"2025-09-13-生命为了目标而动清一新教育-富爸爸投资指\",\"year\":\"2025\",\"title\":\"富爸爸摘要：想致富就做普通人相反的事，明慧因此不上大学\",\"date\":\"2025-09-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"生命为了目标而动清一新教育|【富爸爸投资指南】读书摘要罗伯特清崎：“如果你想致富，只需要观察普通人正在做什么，然后做完全相反的事。​”我很小教小明慧的是：“如果你想成功，只需要观察普通人正在做什么，然后做完全相反的事。​”小明慧就学到了，我说他是否像原来安排的一样去上大学？结果她跟我说：普通人都上大学，所以她不上。我说普通人都四年才上一个大学，你上四个大学。否则----还是去读个大学。\",\"url\":\"https://www.zhihu.com/pins/1950262238846878355\"},{\"slug\":\"2025-09-13-电影-霍元甲-昨晚我通知ELLA-今天冠\",\"year\":\"2025\",\"title\":\"电影课《霍元甲》：李连杰的赎罪之作，懊悔演打打杀杀\",\"date\":\"2025-09-13\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"其实是李连杰成熟之后，一直对自己当武术明星，演出打打杀杀的角色，感到非常的懊悔。他认为中国社会的乖戾之气，暴力思想，他作为电影明星，是有责任的。一个德行高深的老师，就指导他说：你没有必要放弃武术，否定武术。于是，李连杰用心去制作了【霍元甲】电影，想要纠正改变【少林寺】等崇尚暴力的影片造成的不良后果。可惜----很多人没有看懂【霍元甲】电影要呈现的思想。今天，我就带领冠军班的人，去看了这部影片。\",\"url\":\"https://www.zhihu.com/pins/1950203814784238574\"},{\"slug\":\"2025-09-13-规则决定胜负-2025全国自由搏击锦标赛\",\"year\":\"2025\",\"title\":\"规则决定胜负：2025全国自由搏击锦标赛开赛在即\",\"date\":\"2025-09-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"公主们都报名参加了2025年10月2日到10月10日，在重庆举行的全国自由搏击锦标赛。去年8月，我们在长春第一次参加自由搏击比赛。不过：由于规则不熟悉，成绩也不是太好，夺取金牌的数量，远不如泰拳全国锦标赛。2024全国自由搏击锦标赛今日在长春闭幕！一：泰拳与自由搏击的核心差异首先是不许打内围战，不能使用肘击！他们更喜欢自由搏击，因此，自由搏击锦标赛的参赛人数，比泰拳要多不少。\",\"url\":\"http://zhuanlan.zhihu.com/p/1950276250133337103\"},{\"slug\":\"2025-09-13-钱学森之子钱永刚称刷题会抹杀孩子求知欲、\",\"year\":\"2025\",\"title\":\"钱学森之子钱永刚称刷题会抹杀孩子求知欲、好奇心，怎样看待他的观点？\",\"date\":\"2025-09-13\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我认同钱永刚的观点，刷题，的确越刷越呆的。她观察到的公主班和冠军班的学生，甚至同样是女生，年龄差不多，但她认为差别太大了，几乎就不是一类人。英子更喜欢和公主班的学生在一起玩和工作。冠军班的学生，就明显呆气一些，有点傻乎乎的感觉。问我是不是学习的内容，方式不同，造成她看到的这种区别？做事更多，学习上的压力不大，不刷题，所以会更灵气一些。虽然我们只学四年，最后一年才专门刷题，应试。\",\"url\":\"https://www.zhihu.com/question/1949586491119465158/answer/1949990774063207614\"},{\"slug\":\"2025-09-12-今天送走了英子的团队-小安告诉我-我的持\",\"year\":\"2025\",\"title\":\"白银跌停我没走，华菱涨停我不知：重仓理由与他不同\",\"date\":\"2025-09-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我还告诉小安我重仓华菱的理由，和他的不一样。好消息，是不是应该赶快买股，多买一点白银。因为：公司的信息披露，就是上市以来第一次亏损。估计就是用利空来打压，主力想要抢筹码的。公司被处罚，但以此坏消息来抢筹码的主力，也没有啥处罚的，因为责任人难以判定。这不是意味着---白银未来有强大的利好背景吗？但我看市场对此好消息的反映，居然是跌停。白银的安全度，不如我2元不到三元买入的时候安全了。\",\"url\":\"https://www.zhihu.com/pins/1949832614182643259\"},{\"slug\":\"2025-09-12-清黑的红色人生2025.9.11-英雄\",\"year\":\"2025\",\"title\":\"清黑的红色人生2025.9.11 《英雄》课程总结&近期思考红色故事就是中国人的故事。\",\"date\":\"2025-09-12\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"也就是清黑们的故事！攀比和欲望，打压和轻蔑。攻击和诋毁，至死不放手的敌对。因为我们的生活背景就是这样的，求取之心，证明之心，欲望之心。构成了我们的社会的人群！因此，别指望清黑不存在。只能期待我们自己，不要用生命去出演红色的故事。我们愿意在中国普遍的红色故事背景中，呈现我们青色的人生！\",\"url\":\"https://www.zhihu.com/pins/1949628157016674608\"},{\"slug\":\"2025-09-11-张清一-国礼-就是把自己作为一个礼物送给\",\"year\":\"2025\",\"title\":\"张清一：国礼  就是把自己作为一个礼物送给自己热爱的国家\",\"date\":\"2025-09-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"李连杰作为一个终身献给武术的人，看到我们热爱的中华武术，在下一代眼里居然成了这样，会不会特别的痛心？这就是我要送给中国的“国礼”，一份为往圣继绝学的大礼！每一个中国的领导，都会期待这份宝贵的礼物，这就是我毕生努力的对象！当你满足了这个国家对你期待的时候，你就成为了这个国家最宝贵的礼物！这样以把自己送给中华武术的心态去努力，最终自己就会成为这个国家最尊贵的“国礼”。你为了家庭的需要而读，你就是家礼。\",\"url\":\"http://zhuanlan.zhihu.com/p/1947574406021878734\"},{\"slug\":\"2025-09-11-英子说我姑息养奸-这些没良心的黑子-就是\",\"year\":\"2025\",\"title\":\"英子说我姑息养奸：贪婪自私还愚蠢的黑子是被我惯出来的\",\"date\":\"2025-09-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"她又没拿我的工资，所以她不听我的号令，让我别管她干啥！这些人现在围在我身边，有求于我的时候，就在我面前装乖，要这要哪的。我也傻乎乎的被这些人蒙蔽，人也大方，啥都给他们。一旦这些人认为不需要我了，有一天翅膀硬了，就会翻脸无情，去当黑子了。所以，我本来还想帮一份老粉说点好话，就被英子说了：她不是我的下属，我不能管她。好吧，我的确有点多管闲事，我就不管事好了！这也是英子说我多管闲事的范围，让我不要操心。\",\"url\":\"https://www.zhihu.com/pins/1949431483879121236\"},{\"slug\":\"2025-09-10-张清一-大学和小学-大人和小人-大学\",\"year\":\"2025\",\"title\":\"张清一：大学和小学，大人和小人---大学未必有文化\",\"date\":\"2025-09-10\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"可有些蠢人，觉得自己没文化，居然以为去上个大学，拿个大学文凭出来，就是“大人”，就是文化人了，这完全是笑话。所以我们传统文化概念上的“文化人，大人”，其实核心的区别方式，不是你有无文凭，有无官位。她就会认为是一个不知书（圣人之书），也不达理的人，肯定没有文化！这种人，就算拥有再高的文凭，获得再大的荣誉，得到再多的金钱，本质上依然是“小人一个”，古代是没有资格称为“大人”的！\",\"url\":\"http://zhuanlan.zhihu.com/p/1949238563251140550\"},{\"slug\":\"2025-09-10-陪伴明晓成为世界冠军的那些日日夜夜\",\"year\":\"2025\",\"title\":\"谭琛怡：陪伴明晓成为世界冠军的那些日日夜夜\",\"date\":\"2025-09-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"陪伴明晓成为世界冠军的那些日日夜夜-谭琛怡-文人格斗的文章-知乎清一新教育|为国夺得泰拳女子首金背后的故事——陪伴明晓成为世界冠军的那些日日夜夜谭木兰是公主和木兰的好伙伴。她非常希望谭木兰陪她去，因为她是“冠军”的最好朋友，也许可以帮ELLA拿到她的第一块洲际金牌。因为勤奋，善良和付出，谭木兰成为了冠军们的朋友，她虽然也是冠军，但她拿冠军的路上遇到了太多的障碍。\",\"url\":\"https://www.zhihu.com/pins/1949131543642608889\"},{\"slug\":\"2025-09-08-中国人的吃-真的是一种宗教-我们实在抵抗\",\"year\":\"2025\",\"title\":\"中国人的吃是一种宗教：看小红书不适是心理不健康吗\",\"date\":\"2025-09-08\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1948526576854626767\"},{\"slug\":\"2025-09-08-中国传统武术是否无法验证威力-为什么\",\"year\":\"2025\",\"title\":\"中国传统武术是否无法验证威力？为什么？\",\"date\":\"2025-09-08\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"但他不懂传武，他没见过真正的传武，只见到了假货。我们至今433战打泰拳，我方由于拥有传武优势，以绝对优势碾压泰拳手，甚至公主拳手首次上擂台，就KO职业泰拳手。我们还为中国取得了历史上第一块泰拳女子世界冠军。有人说梅蕙志说了啥啥啥的，代表权威意见。将来我们会去打所有的现代格斗赛事（拳击，自由搏击，泰拳，综合格斗等），我们将用击败全世界现代格斗手，夺取多项世界冠军的成绩，来为国争光，为传武扬名！\",\"url\":\"https://www.zhihu.com/question/283492030/answer/1948446093793818484\"},{\"slug\":\"2025-09-08-张清一-攀比是最有效的自毁利器\",\"year\":\"2025\",\"title\":\"张清一：攀比是最有效的自毁利器\",\"date\":\"2025-09-08\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我就解释给她们说：这两种心理状态，都是人自毁的最佳利器！所谓的自怜，就是对自己身上拥有的东西不满意。很有意思的是：自夸自卖，攻击贬低他人，本质也和自怜是一样的！自夸自卖，是对自己的拥有的一点点优点，表达出过度的自恋。他拥有一身的武功，却不去寻求“价值实现”的途径。孙大S也想成功，采取的方式不是去高级的舞台上展现和证明自己，却是在广场上和大妈比舞，和几个老伙伴吹嘘，去打一些武功不如他的人来自嗨。\",\"url\":\"http://zhuanlan.zhihu.com/p/1948301540659008156\"},{\"slug\":\"2025-09-08-这几天忙坏了-居然最新的公主清黑也冒出来\",\"year\":\"2025\",\"title\":\"最新公主清黑冒头：面对恶人唯诺，面对恩人却想当主人\",\"date\":\"2025-09-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"英子也在现实中，接触了一些有清黑思维的人，觉得有些人的脑子，真不知道什么东西组成的，说他们又蠢又坏，就是良心不好，就是会欺负好人！我也觉得，有些人面对恶人就是唯唯诺诺的，面对我们照顾她们的人，居然还想当主人，想要指指画画的，怎么做都不够，实在是欺负人。刚才刘老师视频找我，说今日的蔡木兰，告诉师母，她知道某人不敬师长的事情时，都气得哭了起来。公主班也有公主，为一些混蛋的行为气哭了。\",\"url\":\"https://www.zhihu.com/pins/1948535381436901178\"},{\"slug\":\"2025-09-08-道姑下山-冠军小公主离开平台去闯江湖10\",\"year\":\"2025\",\"title\":\"道姑下山：离开平台去闯江湖，说好10年后拿成绩相见\",\"date\":\"2025-09-08\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"【家长想证明自己选择的道路是正确的，这文章早就说好了。10年之后，拿成绩出来相见。拿不出来也没关系，留下来的国礼公主们不在介意的。毕竟：做不成国礼，但做国礼的朋友也挺好的！但现在就去网上黑，是啥毛病呢？找抽吗？一年之内就拿黑来见吗？这是你们要的结果吗？子不教父之过。只有家长的教养不良，价值观黑暗，才会教出这种混蛋孩子吧？\",\"url\":\"https://www.zhihu.com/pins/1948300984532068244\"},{\"slug\":\"2025-09-06-北大理工状元沦落为乞丐有什么你不能理解的\",\"year\":\"2025\",\"title\":\"北大状元沦落乞丐：想「证明自己」恰恰说明你不是\",\"date\":\"2025-09-06\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"以为努力就能成功，以为自己是状元，还是理工科状元，就可以在社会上创出自己的天地。辞职去上海闯天下，想要“证明自己价值”的结果，就是【与神对话】里面说的：你想要证明，就说明你的真实身份“不是”。人生是一场极度复杂的体验。如果自以为是，没有明师指导的话，很可能结果是努力一场空。以为一个人闯天下就能成功，就是痴心妄想了。团队合作的最大价值，就是团队能够弥补你的缺点，让你的短板不至于损害你的成长。\",\"url\":\"https://www.zhihu.com/pins/1947718934171202708\"},{\"slug\":\"2025-09-06-张清一-2025班级平均分1510分-刷\",\"year\":\"2025\",\"title\":\"张清一：2025班级平均分1510分，刷新顶尖美高纪录\",\"date\":\"2025-09-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"正好某清黑正在满世界宣传她是今日三校“唯一会教外语课程的教师”。想要忽悠新教育圈的人去她的学堂上学，不知道看到这份成绩单脸疼不疼！比如我一介文人，居然敢说我要弄“一个人的武林”，“办一个人的大学”，我要去超过现代格斗，拿世界冠军。某清黑甚至赌咒发誓：这些超过1500分的学生，考入常春藤名校的概率是零。清一新教育|今日塾八月SAT成绩更新：最高班级平均分高达1510分！\",\"url\":\"http://zhuanlan.zhihu.com/p/1947796003974537970\"},{\"slug\":\"2025-09-05-山长-清一的文章张清一-遗产是诅咒\",\"year\":\"2025\",\"title\":\"遗产是诅咒：我的基金不接受捐赠，财富本不是我创造的\",\"date\":\"2025-09-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"【我愿意将自己这几年投资收益的一半免费赠予清一公益基金。】对不起，没人要你捐赠。我的清一基金，不接受任何人捐赠，是我的个人做好事的基金，我从来没有接受过私人捐款。向来就是拿我自己拥有的钱来做好事，当然我会宣称---我拿的是大家的钱。因为财富并不是我创造的，而是我抢来的（股市）。我算是拿钱出来，帮你们做好事了，我不居功罢了。我拿我自己的钱做好事，清黑都要叽叽歪歪的攻击我“挪用和贪污善款”。\",\"url\":\"https://www.zhihu.com/pins/1947244635450738116\"},{\"slug\":\"2025-09-05-张清一-硅谷思想家KK给孩子成年礼-人\",\"year\":\"2025\",\"title\":\"张清一：硅谷思想家KK给孩子成年礼--人生建议101条\",\"date\":\"2025-09-05\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"这本2023年9月出版的《宝贵的人生建议》，算是凯文·凯利关于个人成长的一些思考随笔记录。书中的建议基本上都是以格言的方式在呈现。在68岁生日的时候，凯文·凯利有了一个想法，要为自己刚刚成年的子女写一些人生建议。他曾在给自己孩子写的书《宝贵的人生建议》中写道：做一个乐观妄想症患者吧，相信整个宇宙都在你背后合谋，助你成功。凯文·凯利曾经在他73岁时，献上了他的101条人生建议，分享给大家。\",\"url\":\"http://zhuanlan.zhihu.com/p/1947225910534177864\"},{\"slug\":\"2025-09-05-我看了券商给我的月度账户分析-是这样的评\",\"year\":\"2025\",\"title\":\"券商说我投资能力急需提升：可我的中糖快赚一倍了\",\"date\":\"2025-09-05\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"主要是仓位控制能力和择股能力稍弱，应加强关注市场风险变化。投资的食品加工行业近一年涨幅跑输24.03%的行业（我的中糖赚了快一倍了呢）。我猜：在券商系统看来，任何人都是投资有问题的人。我看券商只会赚手续费，投资收入很差的，不然也不会给我借款买股才收3%的利息了。我的这个账户上，还有十几万股格力电器，我看显示成本是27.66元一股。可能清黑券商嫌弃我操作不够快，没抓机会，坐了过山车。\",\"url\":\"https://www.zhihu.com/pins/1947309329750430121\"},{\"slug\":\"2025-09-05-英子同学的文章清一新教育-致敬现在和未来\",\"year\":\"2025\",\"title\":\"致敬铁粉：后院着火时站在一起的才是伙伴\",\"date\":\"2025-09-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"【针对于这次清黑大战，你是外围学堂也好，你是了解了多久的新教育也好，你家的孩子离山长多近也好，都和铁粉无关，我们只关心的是，当后院着火和我们站在一起的伙伴。】超级顾客的比喻太好了。有家长就认为：我喜欢和接受你的服务，就是给你脸了。你付费不付费，我们都不会要求你（真的有我们供养的家长和学生照样一声不吭的）但这时候跑出来想要更多的“好处”。鹰粉---是有情有义的伙伴，不是超级消费者！\",\"url\":\"https://www.zhihu.com/pins/1947250597293171930\"},{\"slug\":\"2025-09-04-传统武术界是否有人能够打败现代搏击选手\",\"year\":\"2025\",\"title\":\"传统武术界是否有人能够打败现代搏击选手？都有谁？\",\"date\":\"2025-09-04\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"至少有一个：世界运动会获得泰拳女子世界冠军的刘晓慧，就是练传武的。她是第一个中国的格斗世界冠军，可不是最后一个。目前应该是击败中国拳手击败现代搏击赛事中的最高排名！世界运动会的冠军，比世界锦标赛的冠军含金量更大。因为级别更少，不少锦标赛冠军，都来争夺这个冠军。成都世运会｜泰拳--女子48公斤级：中国选手刘晓慧夺冠-新华网相当于刘晓慧级别的拳手，现在还有五个，三五年后，就会有十个以上。\",\"url\":\"https://www.zhihu.com/question/335961372/answer/1947027460043548118\"},{\"slug\":\"2025-09-04-张清一-遗产是诅咒-父母应该怎样爱护孩子\",\"year\":\"2025\",\"title\":\"张清一: 遗产是诅咒！父母应该怎样爱护孩子？\",\"date\":\"2025-09-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"在海灵格家族系统排列中，有一种说法：就是“遗产是诅咒”，凡是承接祖宗遗产的孩子，总是有各种病痛，灾难和不幸！最终找到海灵格老师处理问题时，总会发现家族的遗产，导致了这种灾难的出现！二：就是其他有关的灵魂，对于某人不公正当地占有遗产有愤怒，这种愤怒就会成为一种诅咒，从而对当事人的生活产生不利的影响！最好的方法，自然是设立公益基金，让自己的子女后代，可以和其他人一样也享受财产带来的各种机会。\",\"url\":\"http://zhuanlan.zhihu.com/p/20244203275\"},{\"slug\":\"2025-09-03-如何正确地把喝醉的妹子送回家\",\"year\":\"2025\",\"title\":\"学生易犯的错：高估自己，拿内家拳皮毛去揉合外家拳\",\"date\":\"2025-09-03\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"因为我们用了某种方法，让孩子表现优良，他就真的以为自己超人一等了。比如他看我们用内家拳击败了外家拳，就认为外家拳手都不如他。有个大聪明，就想把我教的内家拳的皮毛，去和外家拳结合。把内家训练的模式和外家拳训练模式都统合在一起，他认为这样去比赛，绝对牛的一匹，会比我清一更厉害，他可以跟我匹敌了！如果仅仅用新教育的标准，来衡量家长的话，我们的学生会发现：体制培养出来的家长怎么这么笨？\",\"url\":\"https://www.zhihu.com/pins/1946557100735067052\"},{\"slug\":\"2025-09-03-正在油管的CCTV直播上看国庆阅兵\",\"year\":\"2025\",\"title\":\"看国庆阅兵：中国改写战争模式，无人作战部队领先美国\",\"date\":\"2025-09-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"看到中国正在改写传统的战争模式。美国的战争思维已经跟不上了。传统战法，我军已经领先美国，各种先进的武器，超过了美国军工复合体的效率，拿出了很多更现代化的先进武器！更可怕的是我军的信息和无人作战部队，完全改写战争格局。美国人跟不上，还在过去的航母作战模式中沉迷。我军的先进武器，再加上我们国家恐怖的动员力量，美国现在已经打不赢了。我想：这就是93阅兵，我国展示的不战而克人之兵的高度智慧吧？\",\"url\":\"https://www.zhihu.com/pins/1946538899078910589\"},{\"slug\":\"2025-09-03-躲天意、避因果-诸般枷锁困成魔；顺天意、\",\"year\":\"2025\",\"title\":\"顺天意成因果：今日方知我是我\",\"date\":\"2025-09-03\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1946501073192879445\"},{\"slug\":\"2025-09-02-五分饱的甜水面的回答-知乎真正的有钱\",\"year\":\"2025\",\"title\":\"真正的有钱人：被骂是猪，说明骂的人心里有头猪\",\"date\":\"2025-09-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【比如，被攻击的时候，别人骂你是头猪，说你是神经病，疯子，其实你并不是猪，但是你可以知道他们心里有头猪～或者他们一早就怀疑自己是头猪，神经病，疯子！】说的不错----的确：今年的业报来的好快，好事坏事都一样。身边的事情和人，似乎都在非常激烈的发生变化。不敬师长之人，肉眼可见的快速堕落下去。\",\"url\":\"https://www.zhihu.com/pins/1946136684015099909\"},{\"slug\":\"2025-09-02-刚看到燕京的股东人数-8月8日是4523\",\"year\":\"2025\",\"title\":\"燕京股东数一周增万人：跌不到一块就引来这么多接盘\",\"date\":\"2025-09-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"8月20日是56472人，增加了一万多人，股价是12.71元。这一天算是连续下跌后的大涨，应该有不少散户抛出了股票，可以推算8月19日以前的散户人数更多。只跌了不到一块钱，就吸引来这么多的接盘手，可见燕京的人气逐步激活了。虽然赚了钱，但靠的是运气好，不是眼光好。不过我现价也不准备买回来（高点我出了）。手上还有不少股，我想换点别的，更低价位的股票。其实跌到12元过一点的时候，我买回来几十万股了。\",\"url\":\"https://www.zhihu.com/pins/1946302251237873589\"},{\"slug\":\"2025-09-02-我卖出的股票-这段时间都拼命涨\",\"year\":\"2025\",\"title\":\"我卖出的股票都拼命涨：张清一是笨蛋，或主力出货不顺\",\"date\":\"2025-09-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"中粮糖业都涨过18元多了，金钼股份等也在拼命涨，虽然我的账户也创新高。但看起来少赚了不少钱！这个事实说明第一：张清一是个笨蛋。明明可以多赚大几千万却赚不到！第二：主力很可怜，出货不顺利，被散户套住了。只能网上继续拉。用时间换空间，高位站队。第三：你说是啥就是啥！好吧，你们认为：以上三种，是哪一种答案才正确？我选【张清一是傻瓜】这个答案是标准答案……\",\"url\":\"https://www.zhihu.com/pins/1946153363721938381\"},{\"slug\":\"2025-09-02-清一新教育-令人喜欢的老师今日学堂应该是\",\"year\":\"2025\",\"title\":\"今日学堂让孩子选老师：倒逼教师跟学生搞关系而非拍校长马屁\",\"date\":\"2025-09-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"因为我们把尊重家长，尊重学生放在行动上，而不是学别人喊口号，唱爱与自由歌。这也倒逼教师们不是跟我搞关系，而是跟学生搞关系。教师成天想拍校长的马屁，哪有心思管学生呀？但对学校来说，这种方式的最大弊端。因此公私学校的校长，都不敢让学生来选教师。怕崩盘WCY不是就抢了外围学堂的家长和学生和师资团队吗？她因此“很受伤”假如成绩好，家长学生关系也好，她留下来，神气十足的对我，我还要讨好她呢，谁让家长是神呢？\",\"url\":\"https://www.zhihu.com/pins/1946277866154235022\"},{\"slug\":\"2025-09-01-Saechia的回答-知乎为什么泰国\",\"year\":\"2025\",\"title\":\"泰国为何有泰拳：古泰拳被英国人改造成现代泰拳\",\"date\":\"2025-09-01\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"里面的几段视频，是一个城市举办泰拳仪式的。答主还非常清晰的写出了古泰拳是如何被英国人改造成现代泰拳的。如果我们能够把古泰拳的风采，重新送回到泰国。建立提个古泰拳格斗训练中心，帮助泰国人拿到世界冠军。今年我们把泰国的世界冠军击败了，导致泰国在世界运动会零金牌，我估计明年在世界锦标赛上，我们会给泰国人造成更大的困扰，异军突起。古泰拳有很多分支，答主也非常详细的列出来了，的确是研究泰国比较深入的人。\",\"url\":\"https://www.zhihu.com/pins/1945972015719752577\"},{\"slug\":\"2025-09-01-为啥泰国这么娘的国家-会有泰拳这种凶狠的\",\"year\":\"2025\",\"title\":\"为啥泰国这么娘的国家，会有泰拳这种凶狠的拳术？\",\"date\":\"2025-09-01\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"很多穷人，读不进去书，也找不到好的工作，为了生存的需要，从小就狠心的父母送去打拳，获取一个生存的机会，因此格斗世界，是一个很残酷的职业。清一文人格斗，与泰国穷人出身的职业格斗泰拳手，彼此相遇的结果，已经在第12届成都世运会上呈现出来了。因为清一文人格斗拳手的努力我看到下面的这个文章，有点不好意思：凭什么我们16岁才开始练习实战格斗的拳手，就击败了这些从小练拳实战的泰国人？\",\"url\":\"https://www.zhihu.com/question/1934245965101012939/answer/1945647589568525127\"},{\"slug\":\"2025-09-01-张清一-新教育天书-价值3千万的世界大\",\"year\":\"2025\",\"title\":\"张清一【新教育天书】：价值3千万的世界大学排名榜单\",\"date\":\"2025-09-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"金融市场上，每天拿出来报价的几千只股票里，真正值得购入，并长期持有的股票，可能还不到10%。大学也一样：全世界数万所大学，真正值得上的大学，可能只有10%，甚至只有1%。即使是美国8所核心常春藤名校里面，居然有两所大学的排名，已经排到QS榜单的200名以外了，甚至还有一所大学的排名，低于泰国排名第一的朱拉隆功大学。下来我就提供一份价值3000万港币的世界知名大学的文凭榜单给大家参考。\",\"url\":\"http://zhuanlan.zhihu.com/p/1919706744780730766\"},{\"slug\":\"2025-09-01-张清一-10月1日-10月7日鹰粉节-财\",\"year\":\"2025\",\"title\":\"张清一：10月1日-10月7日鹰粉节（财商课课前思考）\",\"date\":\"2025-09-01\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"10月1日我将回国在蕙兰酒店参与首届鹰粉节，这是我送给鹰粉们的一份礼物。我会给大家分享一周的电影课，以及财商课。为了方便，我计划财商课部分，就用罗伯特清畸的最新演讲为内容来进行讲解。并针对每一题，写出自己的思考和提问，审视，以及应对的方案！这个日本美国人，也是30多年前我的财富思维的启蒙人之一。）（以下主题，请自己提问，自己思考和回答）7、要持续的买入白银黄金，因为这是真实的货币。\",\"url\":\"http://zhuanlan.zhihu.com/p/1945636026602222890\"},{\"slug\":\"2025-09-01-清一文人格斗-与泰国的穷人格斗-相遇的结\",\"year\":\"2025\",\"title\":\"文人格斗VS泰国穷人格斗：16岁才实战的拳手KO前世界冠军\",\"date\":\"2025-09-01\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"永乐通宝的回答-知乎为什么泰国会有泰拳这种凶狠的拳术？我方拳手全程毫无伤害的过关取胜，还KO了一个前世界冠军。我看到这文章，有点不好意思：凭什么我们16岁才开始练习实战格斗的拳手，就击败了这些从小练拳实战的泰国人？只能感谢老祖宗的加持！太极哲拳，名不虚传！\",\"url\":\"https://www.zhihu.com/pins/1945646086543882176\"},{\"slug\":\"2025-09-01-清一新教育跟着山长和小明慧出来我学到了什\",\"year\":\"2025\",\"title\":\"带谭木兰见众生：不能老待象牙塔里变成傻公主\",\"date\":\"2025-09-01\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"|昆明游记1：五华广场的趣事谭木兰成都赛事后，我就让她去河南，山西，一起参加国际学术会议。因为原来她作为拳手，我基本不带她”见众生“，只让她“见自己”，明慧和ELLA，我带她们“见众生”更多，现在她的年龄渐渐的大了，需要让她见见世面了。特别是刘晓慧拿到世界冠军，与谭木兰的认真陪护关系很大。因此我也给了谭木兰更多的“奖励”---一起到处去见人，南北的各种官员都见到了！\",\"url\":\"https://www.zhihu.com/pins/1945837445972236116\"},{\"slug\":\"2025-09-01-黄金大亨的回答-知乎身价过亿的有钱人\",\"year\":\"2025\",\"title\":\"亿万富豪的生活我不羡慕：像被裹在金鱼缸里，反成猎杀对象\",\"date\":\"2025-09-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我看我的日常生活，连民工都不如。看了这个照片里面的亿万富豪的生活，我怎么没觉得羡慕？只觉得他们好可怜。被包裹在精致的金鱼缸里面一样。失去了对真实世界的了解这样的人，绝对是金融家，银行家，律师，权利阶层，江湖人士等等，专门针对富豪的高手们的最佳对象。他们能传几代说不清楚。但显然现在就生活在梦幻里面！\",\"url\":\"https://www.zhihu.com/pins/1945955181503185491\"},{\"slug\":\"2025-08-31-欧美富人阶层在培养孩子时-为何喜欢卷体育\",\"year\":\"2025\",\"title\":\"欧美富人卷体育实为筛选器：未来新贵将玩太极文人格斗\",\"date\":\"2025-08-31\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"作者的这个内容不错---上层社会到底玩体育，到底是玩什么？说得对，就是筛选器！希望文人格斗崛起之后，新贵的玩法，就是玩太极拳，玩文人格斗冠军。而权贵们要找世界冠军们进行的私教费，就是一年几十万元。武医合一，绝对是上层社会最追捧的东西。这些东西，就在清一武道馆。在内家拳这里。贵不可言！\",\"url\":\"https://www.zhihu.com/pins/1945422471441391741\"},{\"slug\":\"2025-08-31-没钱的人-都想成为有钱人\",\"year\":\"2025\",\"title\":\"没钱人想有钱：但有钱人被权贵与金融家精准猎杀\",\"date\":\"2025-08-31\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"9年前明一班写的未来故事：世界三种人，多数终为奴隶有钱人是被一些权贵阶层，以及医生律师金融家银行家精准猎杀的对象。很多财富家族，会很快，或者缓慢地失去地位。据说袁世凯的儿子袁克定，前期富贵逼人，但晚年穷困聊倒，连一顿饱饭都吃不上。有钱人都想要做“红顶商人”，是古人唯一的选项。能够穿越2000年的朝代而不倒的文化上层家族，只有孔子世家。我希望未来的第二个文化上层世家，是清一家族。\",\"url\":\"https://www.zhihu.com/pins/1945418567618102574\"},{\"slug\":\"2025-08-31-清一世家是武医合一的文化世家\",\"year\":\"2025\",\"title\":\"清一世家：武医合一，用世界冠军与古医疗技术服务世界\",\"date\":\"2025-08-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"清一世家完全不一样：将用世界冠军来获取名誉，用中华古医疗技术来服务世界，成为武医合一的世家（而不是只会讲【论语】的世家）。目前的冠军之路，就是我们去找到我们需要的清一世家的核心成员----她们专心，踏实，心理稳定，认真负责，尊重师长，敬仰祖宗，而且脑子不笨。因此，世界冠军---就是我们找到武医合一的优等生筛选器。清一大学，就是清一世家批量培养武医合一人才的世界名校。\",\"url\":\"https://www.zhihu.com/pins/1945439739713947219\"},{\"slug\":\"2025-08-31-清一新教育会泽风云2-学堂如何训练思维之\",\"year\":\"2025\",\"title\":\"会泽风云2：侦探课让明慧更不愿上大学，宁可自己读书\",\"date\":\"2025-08-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这样的课程，我现在依然会给小明慧上，她也很爱看侦探小说。但副作用就是：她因此就更不愿意去上大学了。我原来还想让她去读四个大学，她还有华侨生身份呢。我看她的确在外面宾馆的时候，都会特别跑去大堂里面读书学习日语啥的。但现在的家长，显然不需要我们上这样的课程，家长更关心SAT。如果我胆敢坚持给学生上这些课程，让学生\\\"上瘾\\\"后。我也觉得遗憾，一种学生和教师都欢迎，都有提高的课程，最终无法坚持下来。\",\"url\":\"https://www.zhihu.com/pins/1945564021995573982\"},{\"slug\":\"2025-08-29-冯敬东的文章清一新教育-请参考巴菲特早期\",\"year\":\"2025\",\"title\":\"巴菲特0-6-25费率不错，但我不想收费，我又不缺钱\",\"date\":\"2025-08-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"冯敬东的文章清一新教育，请参考巴菲特早期私募基金的收费巴菲特决定将旗下所有的“有限合伙关系”企业合并成巴菲特合伙关系有限公司，并且收费模式统一，构建出“0-6-25”的费率结构。即：0管理费，只在年化收益6%以上部分提取25%的业绩报酬。我觉得这个模式挺好的，不过我不想弄成收费模式的，我又不缺钱。如果一起做投资基金，我想弄成公益模式的一种全新模式。我们争取10月份就弄出来这个【铁粉家族基金】。\",\"url\":\"https://www.zhihu.com/pins/1944745298388850082\"},{\"slug\":\"2025-08-28-英子说得对-不过英子对世界冠军还是太抬举\",\"year\":\"2025\",\"title\":\"不是世界冠军就能当国礼：70岁退休工人练内家拳令她们惊讶\",\"date\":\"2025-08-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清一新教育|成为国礼的朋友，我要具备的10个好习惯不是世界冠军就可以做国礼的。昨天就带谭木兰明慧见了一个70多岁的老头，一个普通的退休工人。她们看了他的动作很惊讶，很多要领，和我教木兰的是一样的。我问相当于世界冠军水平的谭木兰：有无信心能击败这个老头？他高高兴兴的教孩子们，还说孩子们基础好，学得快。因此：你的功夫好，甚至你能够打赢世界冠军，也未必有“美好的前程”。\",\"url\":\"https://www.zhihu.com/pins/1944315303216550275\"},{\"slug\":\"2025-08-28-这两天我都在和平安和招行的高管-谈想要设\",\"year\":\"2025\",\"title\":\"与平安招行高管谈家族传承私募基金：想把资产分给十大公主\",\"date\":\"2025-08-28\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"因为我想把我自己的钱都送出来，成为永续的教育基金，这样就必须用到银行的高端服务。这是我为百年清一家族打造的金融服务，我想了十年才想到的最佳方案。我想要把我现有资产，分给十大公主去分别管理，然后一代一代的传下去。然后我就想：我可以培养十大公主来帮我管理百年家族传承的资产，但很多中小老板是做不到的。我也很担心我的后代把家败光，所以我一直在设计一套方案，来避免出现这种情况。\",\"url\":\"https://www.zhihu.com/pins/1944533381820940293\"},{\"slug\":\"2025-08-27-我们很多时候连出场费都拿不到-为了提升\",\"year\":\"2025\",\"title\":\"中国缺职业格斗土壤：赔钱也要打比赛，只能靠爱发电\",\"date\":\"2025-08-27\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"】为什么中国人钟爱“活肌肉”、“武术家”、“街斗”，而不认可“大块头”、“职业拳手”、“擂台比赛”呢？中国缺乏职业格斗生存发展的土壤，估计未来10年也不乐观，难以改变。现在真玩格斗的，都必须要用爱来发电。劝你一句：除非真心的喜欢，不求名利，自己练了玩。你世界排名160名的话，我看国内你很难有啥希望打出来，也许你可以学张志磊出国发展？因为有吃皇粮的拳跆中心，你们连代表国家去打拳击世界锦标赛都不行。\",\"url\":\"https://www.zhihu.com/pins/1944043352124290697\"},{\"slug\":\"2025-08-26-今天遇到凯琪从家里回来-找谭木兰聊-是很\",\"year\":\"2025\",\"title\":\"遇凯琪聊读大学：那只是看着正确的理由，实为内心本能\",\"date\":\"2025-08-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我告诉她们---读大学只是一个看起来正确的理由，本质上是内心的女性本能。不过，她们基本上认为：这是清黑们大肆宣扬鼓动一定要上大学的结果。睡了一半突然想起来一件事特别可笑：这群明一班的粉和黑子，都没有一个人去上大学。当然不是没资格上，而是她们真心不愿意去上。只有一个雨纯，她自己不上大学，也不愿意去帮助家长和学生上她认为没用的大学。所以她退出今日教职，保持中立，对上大学不粉也不黑。\",\"url\":\"https://www.zhihu.com/pins/1943816253975278748\"},{\"slug\":\"2025-08-26-张清一-国礼计划正在顺利运行中\",\"year\":\"2025\",\"title\":\"张清一：国礼计划正在顺利运行中\",\"date\":\"2025-08-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"如果你在清一新教育里面不成功，你以为你去体制就能成功。但你用清一新教育的方式去进入体制的话，更容易让你在自己还很年轻的时候，就站在很高的平台上起步，远远超过一群笨蛋在慢慢互相跟随爬行的体制大军！邓亚萍，1973年2月6日生于河南省郑州市，祖籍湖南省邵阳市新宁县[1]，原中国女子乒乓球队运动员、世界冠军、奥运冠军，乒乓球大满贯得主。各位认为：在中国人的心中，这些外国球类运动的地位，有没有中华武术高？\",\"url\":\"http://zhuanlan.zhihu.com/p/1943450453837865397\"},{\"slug\":\"2025-08-25-角色设定如此-别呼吁了\",\"year\":\"2025\",\"title\":\"角色设定如此别呼吁：留在清迈的四个女孩都成了世界冠军苗子\",\"date\":\"2025-08-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"雨纯的文章-知乎邪剑仙，请把我的同学还回来！世界冠军的取得，的确是一个标志性的成果，代表新教育真的在创造世界历史。只要努力就能成功，本来只是一个梦幻一样的理想，因为努力的人很多，但成功的人很少。当初留在清迈的四个小女孩，基本上全部成为了世界冠军的苗子。在我们是外行的，首次尝试就取得成功的武术和格斗领域，我们都创造了世界奇迹。我们的确不希望这些卑鄙的小人，角色扮演的人居然来自于过去的同学伙伴。\",\"url\":\"https://www.zhihu.com/pins/1943235186675393625\"},{\"slug\":\"2025-08-24-为什么感觉知乎上好多人都跟华为有血海深仇\",\"year\":\"2025\",\"title\":\"为什么那么多人恨华为：木秀于林风必摧之，国民性之殇\",\"date\":\"2025-08-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1942872643788338800\"},{\"slug\":\"2025-08-24-清一新教育1319岁-在山长家我收获了\",\"year\":\"2025\",\"title\":\"ELLA：13到19岁在山长家收获的礼物，终被珍惜\",\"date\":\"2025-08-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"当年我送给ELLA的礼物，最初我也送给了明珠班，但似乎没人珍惜这份礼物。直到ELLA出现之后，我的礼物才有人收到。这是我送给ELLA的礼物，但ELLA也是送给明慧的礼物，她是第一个成为明慧真正意义上的好朋友，互相关心和惦记的人。今天她商场看到一个东西，觉得有趣，就马上发给她的公主班好朋友。古人说:会读书不如会做事，会做事不如会做人，会做人不如会感恩！希望你们一生都互相珍惜，成为一生的好友！\",\"url\":\"https://www.zhihu.com/pins/1943055224458674669\"},{\"slug\":\"2025-08-22-太极拳入门是怎么样的\",\"year\":\"2025\",\"title\":\"太极拳入门是怎么样的？\",\"date\":\"2025-08-22\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"太极拳入门，就是能够拿到格斗的全国冠军，世界冠军，就算太极拳入门的水平了。因此拿格斗世界锦标赛的世界冠军，差不多算太极入门水平！原因无他：古代拳经记载说的，得其一二足以胜少林。刘晓慧20岁就拿了中国的第一个泰拳世界冠军，她应该是最年轻的格斗世界冠军。这种年龄，绝无可能掌握太极的“精髓”了。她也就是练的太极功夫水平“刚入门”而已。不说了我知道高级的太极是啥样的，但我没练出来，就不说了。\",\"url\":\"https://www.zhihu.com/question/1941445271595771060/answer/1942127859318646549\"},{\"slug\":\"2025-08-21-一万亿人民币-和张三丰的武功-身体素质和\",\"year\":\"2025\",\"title\":\"一万亿人民币，和张三丰的武功，身体素质和境界，二选一你选哪个？\",\"date\":\"2025-08-21\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"我看你们这么多人都要选去当张三丰，我就反过来好了，你们不要我要吧！我拿一万亿来全世界选材，让他们去做张三丰。估计最终不止会出一个张三丰吧？其实我根本不相信有这么多人想做张三丰，我起码还看过张三丰的多篇原著文章，道藏里面的。还有不少人，拿了全国冠军就溜掉去做普通人了。别是一万亿了，一万美金都不用，他们就会放弃在张三丰的选择。没人会送给你这些“好东西”，都是你自己要来的。\",\"url\":\"https://www.zhihu.com/question/662210150/answer/1941783315796439477\"},{\"slug\":\"2025-08-20-离开山西-去了河南\",\"year\":\"2025\",\"title\":\"离开山西到河南：拿孙某比秦桧都抬举他，他只是江湖混混\",\"date\":\"2025-08-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"清一新教育｜从孙师傅的拳头，到秦桧的笔墨回复文章我都不知道宋体是秦桧的书法，谢谢普及知识你把姓孙的拿来跟秦桧比，太抬举他了。我都不知道他现在发啥疯，说啥话，我都懒得去看这个疯子！让孙戴上拳套，去擂台上打正式的泰拳，自由搏击的比赛，他自己真的未必能赢过职业拳手。这位明晓的新师父，是武汉体院的正式编制教师，带传统武术专业的学生和研究生，他感叹学生刚带个样子出来就离开了，没办法深入带下去。\",\"url\":\"https://www.zhihu.com/pins/1941648569758123889\"},{\"slug\":\"2025-08-19-张清一-世界冠军山西参加会议-河南认祖归\",\"year\":\"2025\",\"title\":\"张清一：世界冠军山西参加会议  河南认祖归宗\",\"date\":\"2025-08-19\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"这是一个国际学术交流会第四届“实学·气学·心学”国际学术研讨会在山西高平召开第四届实学，心学讨论会美国人参与了会议分享。各种古代文章等等，一提名字，就可以整篇的朗诵出来。其他的学者们只能拿手机来搜索对比，一字不差。几个木兰冠军们都佩服不己，知道了体制内的学霸是啥风采。山西的会开完之后，河南的朋友就直接派车来山西，接我们一行人去河南“皈依师门”了。如果把实战格斗加进去，一定会有更大的影响力。\",\"url\":\"http://zhuanlan.zhihu.com/p/1941111966186832456\"},{\"slug\":\"2025-08-19-阶层上升的努力如何评价电影-白虎\",\"year\":\"2025\",\"title\":\"评《白虎》：阶层上升难，最难的是身边人把你往下拽\",\"date\":\"2025-08-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这个世界，阶级上升真的很难。往上走，绝对不仅仅是努力就够了！还有很多机缘和贵人的扶持。同时还要面对竞争对手的打击，还有：更令人伤心的，是身边人利用你的爱心，拼命把你往下的拉扯！身边的亲朋好友，往往是最大的考验：他们一生的最大障碍。女人最大的考验，就来自于伴侣，以及孩子！只有死死锁定真正的目标和理想的人，才能走过道道险关。#清黑是人生失败者##清一新教育##今日学堂#……\",\"url\":\"https://www.zhihu.com/pins/1941110810966472346\"},{\"slug\":\"2025-08-18-中国武术真不行还是失传\",\"year\":\"2025\",\"title\":\"中国武术真不行还是失传？\",\"date\":\"2025-08-18\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"同意这个问题原来的一些帖子的说法，我认为是很多还是实事求是的！不过我不是传武黑，我是学太极的，内家三拳也有所涉猎。我的弟子刘晓慧，刚刚在成都，为中国拿到了历史上第一块泰拳的世界冠军金牌（成都世界运动会）。如果不是采用太极技术去克制泰国的凶猛刚烈，我们也不能让一个只练了四五年格斗的，才20岁的年轻人就拿到世界冠军的！很多老拳师，失去了求武术之真，流于江湖卖艺的表演，当然传武就变得不能打了。\",\"url\":\"https://www.zhihu.com/question/1885394979389677695/answer/1940663480194675883\"},{\"slug\":\"2025-08-17-你是怎么发现亲戚开始见不得你好的\",\"year\":\"2025\",\"title\":\"亲戚见不得你好：婶婶竟想下药害学习好的侄女\",\"date\":\"2025-08-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"“你婶前天在家骂说，为啥她就学习好，就聪明？我给她下点药我看她还怎么学习好！我光棍，你最好也光棍，你脱单了，我就想方设法搞黄你。不认识的人很好，没问题。居然过得比自己好，不行，得去放电耗子药。所以不要钱，不要脸，也不要命的人，去黑清一新教育，就因为他们是原来新教育的“亲戚”。而且：他们过得很不好，不然，怎么有空来黑？哪怕再好的关系，到这一步了，都没继续下去的必要了。\",\"url\":\"https://www.zhihu.com/pins/1940546648666276827\"},{\"slug\":\"2025-08-17-在知乎的第一篇文章——未来目标\",\"year\":\"2025\",\"title\":\"重看知乎第一篇文章：念念不忘必有回响，目标已提前实现\",\"date\":\"2025-08-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"重新看到ELLA总结的，这份写在2023年的目标文章，挺有感慨的：首先是念念不忘，必有回响：宇宙已经提前把大礼送给了我们。当时，我们还不知道中国会开设全国泰拳和自由搏击锦标赛，也不知道可以通过全国锦标赛的选拔，进入世界锦标赛。目前我们的新目标，新计划，是面对2029年的目标，已经改变和提高了一大步，而且是很大的一步---想要击败男子世界冠军，刷新全世界的历史记录。大师永远只做相同的选择。\",\"url\":\"https://www.zhihu.com/pins/1940308309572826762\"},{\"slug\":\"2025-08-16-今天见到明晓了-她也来山西-和谭木兰-小\",\"year\":\"2025\",\"title\":\"明晓抵晋参会：会后随我回焦作拜师门、祭师爷\",\"date\":\"2025-08-16\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"过几天开完会后，还要跟我一起去焦作太极故里归山---拜师门，认祖归宗。当地的市长也要来专门的接见我们的第一个世界冠军。不知道市长是否会建议吧世界冠军留在山西。明晓见到我后，就要把她拿到的世界冠军金牌给我，真的很漂亮，特别的大。我说：这块世界冠军的金牌，是中国泰拳击败泰国以及全世界拳手的一个历史突破，改写了历史，将来应该放到中华太极武术博物馆的，我就不拿了，让她自己先留着吧！\",\"url\":\"https://www.zhihu.com/pins/1939842819138258238\"},{\"slug\":\"2025-08-16-郭麒麟开除德云社-郭德纲坐不住了\",\"year\":\"2025\",\"title\":\"郭麒麟「开除」德云社：孩子想干啥都行，没必要接班\",\"date\":\"2025-08-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"2021年的某采访中郭德纲曾表示，郭汾阳长大后可以自由选择职业。无论是“打铁、当木匠、剧场经理，管理服务员”都可以。我也一样，给孩子们充分的自由，想干啥都行，没必要接我的班，孩子们如果能够去外面创社会，干的风生水起，是我作为父母的荣誉，证明我的培养成功了，孩子不需要父母，是父母最大的成功！如果我的孩子，将来就只能在父母身边讨饭吃，不敢去外来闯天下，也没有能力去闯天下，这是遗憾！\",\"url\":\"https://www.zhihu.com/pins/1940069535894986993\"},{\"slug\":\"2025-08-15-“国礼”背后的英雄－谭木兰\",\"year\":\"2025\",\"title\":\"「国礼」背后的英雄谭木兰：厚德载物，随喜冠军而不嫉妒\",\"date\":\"2025-08-15\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一新教育今日学堂I「国礼」背后的英雄谭木兰：厚德载物，随喜冠军而不嫉妒谭木兰做的就是厚德载物，就是欢喜赞叹，随喜冠军而不是羡慕嫉妒恨。谭木兰，小明慧，今天在跟我一起参与跟焦作的文化官员们交流互动，我对她介绍的话，就是：她是2024年的洲际冠军，她也是明年的世界冠军，水平跟明晓是一个级别的！我还公开的说：2029年，去击败男子世界冠军的人，她是一个！#清一新教育##今日学堂##清黑是人生失败者#……\",\"url\":\"https://www.zhihu.com/pins/1939482844037641099\"},{\"slug\":\"2025-08-15-今天我的中粮-涨停价全都出了-清仓式甩卖\",\"year\":\"2025\",\"title\":\"中粮13.88清仓甩卖：焦作交流没看盘，反让我多赚\",\"date\":\"2025-08-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"不然我昨天就全跑掉了，因为我沉不住气，真的非常感谢河南大地的帮助，看样子，焦作是我的吉祥之地。\",\"url\":\"https://www.zhihu.com/pins/1939656999517271348\"},{\"slug\":\"2025-08-15-作为一名传武抵制者-我想问现在哪里还有纯\",\"year\":\"2025\",\"title\":\"作为一名传武抵制者，我想问现在哪里还有纯正的传统武术？\",\"date\":\"2025-08-15\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"显然，是打不赢的原因，是因为你学习的太极就不是真的，现在真太极几乎失传了。据我所知：目前唯一以传武技术击败现代格斗的武馆，是清一武道馆。他们培养的其中一个学习太极实战的拳手，20岁的刘晓慧，为中国取得了第一块世运会泰拳世界世界冠军的金牌，这是相当于奥运金牌的一个记录。而像她一样水平的拳手，清一武道馆还有四五位。她们将在未来的一两年，代表中国去取得世界锦标赛的冠军，泰拳或者自由搏击。\",\"url\":\"https://www.zhihu.com/question/39691462/answer/1939492539490088105\"},{\"slug\":\"2025-08-15-向死而生是啥意思-你愿意写出你的墓志铭来\",\"year\":\"2025\",\"title\":\"向死而生是啥意思？你愿意写出你的墓志铭来吗？\",\"date\":\"2025-08-15\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我的墓志铭：这里躺着一个培养出全中国最多世界格斗冠军的文人，他重新改写了世界武术和格斗的基本观念。实现方式路径：每年招收15岁的SAT1500分学霸，来免费进行太极格斗实战培训。经过三年到四年之后，选出其中最具有格斗天赋的学生，继续培养三年，去夺取世界冠军。墓志铭二：他是清一新教育的创始人，用文人格斗改变了中国和世界！墓志铭四：他是21世纪的庄子，张三丰，陶朱公的混合体。\",\"url\":\"https://www.zhihu.com/question/1939510255189985010/answer/1939511972786843756\"},{\"slug\":\"2025-08-15-张清一转-逝去的武林-中的精华所在\",\"year\":\"2025\",\"title\":\"张清一转：《逝去的武林》中的精华所在\",\"date\":\"2025-08-15\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"我的一位练习二十多年形意拳的武友被感动了，他愿意让更多的形意拳传人走近李老的内心世界，于是他在工作之余，不辞辛苦。经过剪辑后的李老说拳，放弃了原文一些人们熟悉的武林旧事和无益的是是非非。而更趋向于学术本身，比之现在形意拳方面所有的杰作，更高一步。薛颠传的桩功，一个练法是，小肚子像打太极拳一般，很慢很沉着地鼓出，再很慢很沉着地缩回，带动全身，配合上呼吸，不是意守丹田，而是气息在丹田中来去。\",\"url\":\"http://zhuanlan.zhihu.com/p/1939486011961882020\"},{\"slug\":\"2025-08-15-我在山西开一个国际学术交流会\",\"year\":\"2025\",\"title\":\"山西国际交流会：市长将接见首个太极格斗世界冠军\",\"date\":\"2025-08-15\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"明天市长，要来接见我们的第一个太极格斗的世界冠军。山西是我们这一派的太极的宗师发源地，王宗岳，他是武当派的弟子。我的温县太极老师是这一源流的、也许市长想把太极拳留在山西？转发：王芗斋“我练拳的运气好，我赶上了中国功夫的一个尾巴，我年轻的时候还有一些有功夫的人，我见过了。清朝重文轻武，武术家靠表演吃饭，清朝把中国武术给毁了。商业转载请联系作者获得授权，非商业转载请注明出处。\",\"url\":\"https://www.zhihu.com/pins/1939823202604946008\"},{\"slug\":\"2025-08-15-我认为中国必然走向韩日的老路-珍惜现在吧\",\"year\":\"2025\",\"title\":\"中国或走向韩日老路：日本女性婚恋要求从三高降到不家暴就行\",\"date\":\"2025-08-15\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"韩国女权和日本女权为什么失败?最终，日本女性的结婚要求从当年高收入、高学历、高个子的三高，变成了今天大家看到的有工作不家暴就行。\",\"url\":\"https://www.zhihu.com/pins/1939614538921125736\"},{\"slug\":\"2025-08-14-中粮我的操作打脸了-我涨停卖出的行为\",\"year\":\"2025\",\"title\":\"中粮涨停卖出被打脸：送出两百万，证明我的确不是股神\",\"date\":\"2025-08-14\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"让我送出了200多万元，恭喜我的对手盘，恭喜你们赚钱了。我认为是对的，不过我也一样，涨停只是我的第一次卖出操作。昨天我回国，中午在机场，又继续卖掉了一百多万股，还有很多股剩下来。急涨我急卖，反正是融资买的股票，我卖掉还融资仓位，只拿本分的本金仓位就行了，只赚本分的利息钱。我的习惯，是融资买入的话，涨了30%以上就应该卖出了，然后留下本金仓位，中粮已经涨了40%了，我留下40%的本金股就够了。\",\"url\":\"https://www.zhihu.com/pins/1939210167519515476\"},{\"slug\":\"2025-08-14-今天我在焦作市-太极之乡-与当地的领导们\",\"year\":\"2025\",\"title\":\"在焦作太极之乡与领导畅谈：徒孙打出中国首个泰拳世界冠军\",\"date\":\"2025-08-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"参与交流活动的最高官员是厅级，还有文化部的前任部长，太极协会的会长等人。大家都因为木兰明晓夺取了世界冠军，他们都非常的高兴，认为是焦作人的自豪。这是他们焦作的文化符号代表，由焦作的老师父（我师父）的徒孙，打出来的中国第一个泰拳世界冠军。因此，今天的领导们都很开心，一聊就聊到了三点钟。中间有一个领导，问我怎样供养武道馆的，我说是我买股票，拿分红。领导很有心，就去查看行情，说中粮今天涨停。\",\"url\":\"https://www.zhihu.com/pins/1939369216760340952\"},{\"slug\":\"2025-08-13-山长-清一的文章一生命运的转折点-明晓\",\"year\":\"2025\",\"title\":\"打破泰拳500年不败神话：8月10日，中国拳手恐泰症的结束日\",\"date\":\"2025-08-13\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"山长清一的文章一生命运的转折点--明晓顺利度过打破泰拳500年不败神话的中国女孩：清一木兰女孩8月10日，是中国拳手恐泰症的结束日。未来，将有更多的中华儿女，会跟随明晓示范出来的成功道路去打垮全世界的对手。这个以“泰国拳”为名的，世界性的体育运动赛事，未来将成为“中国人最擅长的运动”。今天的木兰明晓，虽然生活在泰国（是不是有点像容国团当年海外训练和成长？全世界都在输入中国拳手来帮他们练球，打球。\",\"url\":\"https://www.zhihu.com/pins/1938865406870815954\"},{\"slug\":\"2025-08-12-好消息是-中粮糖业刚刚涨过11\",\"year\":\"2025\",\"title\":\"中粮糖业涨过11元：我是半年报新十大股东，最近只买不卖\",\"date\":\"2025-08-12\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"山长清一的回答-知乎世界运动会使用中国传武的刘晓慧夺得48公斤级女子泰拳冠军，这有哪些重要意义？坏消息是，我是这家公司半年报新的十大股东。我过生日这天，你们就会看到我的持仓有多少了。但我真实持仓比公布的数量只多不少，因为最近两个月，我只买不卖。之所以是坏消息，因为清黑们们总想看我笑话，你们会失望的！明天，中粮糖业就会送我7位数的红利股息。感谢你们的加持，你们就像火箭系统的燃料一样。\",\"url\":\"https://www.zhihu.com/pins/1938562914601636874\"},{\"slug\":\"2025-08-12-一生命运的转折点-明晓顺利度过\",\"year\":\"2025\",\"title\":\"一生命运的转折点--明晓顺利度过\",\"date\":\"2025-08-12\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"今后清一木兰就是国际赛事的C位，外国人只能做为陪客未来，将有更多的中华儿女，会跟随明晓示范出来的成功道路去打垮全世界的对手。就像是当年英国人发明的乒乓球，现在成为全世界认同的中国“国球”一样。明晓，就像是60年前的容国团（中国第一个乒乓球世界冠军）一样，会永远是中国人的荣耀，是中国人永远的泰拳冠军。今天的木兰明晓，虽然生活和训练在泰国（是不是有点像容国团当年海外训练和成长？\",\"url\":\"http://zhuanlan.zhihu.com/p/1938550121559221250\"},{\"slug\":\"2025-08-12-世界运动会使用中国传武的刘晓慧夺得-48\",\"year\":\"2025\",\"title\":\"世界运动会使用中国传武的刘晓慧夺得 48 公斤级女子泰拳冠军，这有哪些重要意义？\",\"date\":\"2025-08-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"冯敬东网友的传武幻想：【再过四年，下一届世运会，明晓全部KO所有三个选手，以绝对，压倒，都不想再来世运会的气势赢得比赛！】成都世运会泰拳女子48公斤级中国队刘晓慧夺金回答：不是你的幻想，基本上会是这个进程。四年后明晓再来打比赛的话，大概率会是这个结局。能够维持比如这次世界运动会，其实正常说起来，没谁的把我更大，谁都可能拿到冠军。因为来参加的人，不是世界锦标赛的冠军，就是亚军。\",\"url\":\"https://www.zhihu.com/question/1937998085486773797/answer/1938405229218476536\"},{\"slug\":\"2025-08-12-中国第一块世运会泰拳金牌获得者刘晓慧-自\",\"year\":\"2025\",\"title\":\"中国第一块世运会泰拳金牌获得者刘晓慧，自称是靠传武太极功夫才赢的，这是真的吗？\",\"date\":\"2025-08-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"成都世运会泰拳女子48公斤级中国队刘晓慧夺金对比一下刘晓慧和韩鑫的打法区别，可以很明显的看出同样是最高世界级赛事的决赛，这两场的打法，是完全不一样的风格。实际上，半决赛中，泰国这位世界冠军拳手的表现，和决赛中她遇到刘晓慧的打法，也是完全不一样的，她显得完全不适应，她凶狠刚猛的左右扫腿，基本上在决赛中用不出来了。成都世运会泰拳女子48公斤级中国队刘晓慧夺金太极到底怎么实战的？\",\"url\":\"https://www.zhihu.com/question/1938577838287598450/answer/1938610814991962439\"},{\"slug\":\"2025-08-12-今天中糖涨停-根据我“不争不抢-涨停就卖\",\"year\":\"2025\",\"title\":\"中糖涨停我退出十大：最短命持仓，资金全还融资省百万利息\",\"date\":\"2025-08-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这是我最短命的十大，才一个季度就闪退了！资金今天全拿来还融资了，是一大笔钱，一年可以省掉我上百万的利息。今天我的券商，铁定进了中粮的成交龙虎榜。本来中糖是计划长持的，根本没指望它会有涨停的机会，我就是计划拿股息长持10年的。如果退回来，我还会买一点的另外有个笑话：我的券商软件，有个对我综合投资测评能力的测评，我就去看了一下：我发现：我的投资能力非常的不平衡，长处很长，远超一般人。\",\"url\":\"https://www.zhihu.com/pins/1938621310424028362\"},{\"slug\":\"2025-08-12-我的账户有-有北极星诊断账户结论是-过度\",\"year\":\"2025\",\"title\":\"北极星账户诊断：理性五颗星，持股776天，散户却只有9天\",\"date\":\"2025-08-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"超越了投资能力较强的群体（4星）。而普通散户是一个星2：换手率、我是1.02强势群体是10.22，高了10倍。厉害3：平均持股天数，我是776天。强势群体52天，普通散户9天。其他几个指标，我的打分根本就没有出来处置效应---我没有对比组都有止损画像---我没有止盈画像。我也没有所以，我的确是电脑无法定义的投资人。供你们参考吧你的行为，越接近我，可能就越赚钱。越接近散户，恐怕越赔钱。\",\"url\":\"https://www.zhihu.com/pins/1938652873434076304\"},{\"slug\":\"2025-08-12-未来五年-为中国夺取含金量最高的奥运金牌\",\"year\":\"2025\",\"title\":\"提前实现目标：世运会夺冠，为中国夺取含金量最高的金牌\",\"date\":\"2025-08-12\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"世界运动会，就是国际奥委会组办的，非奥项目的“奥运会”。它也是四年一次的国际性赛事，世界最顶级的拳手才能参加的高级赛事活动。当时，我还不知道我们有机会参与这个赛事，参赛的名额比奥运的更少。因此从这些数据可见，获取泰拳的参赛资格，难度很高。我们获取的世界运动会世界冠军的含金量，其实比拳击的奥运金牌含金量高得多。现在，我们已经提前获得了世界冠军的金牌，再提奥运金牌，也是数量有多少的事情了！\",\"url\":\"https://www.zhihu.com/pins/1938596524893406235\"},{\"slug\":\"2025-08-11-张清一-全球第一个文人格斗世界冠军诞生-2\",\"year\":\"2025\",\"title\":\"全球第一个文人格斗世界冠军诞生：从被淘汰的二流武人到明晓\",\"date\":\"2025-08-11\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"2017年：被专业格斗淘汰的二流武人徐某东，打假传武，宣称太极就是骗子。2019年，张清一成立武道馆，个人出钱出力，捍卫传武的最后底线，回应徐某东对于中华武术的挑战。2025年，木兰明晓20岁，站到了世界冠军的领奖台上，一路击败了其他曾经的世界冠军们。让我一个业余文人，来做了全国武术界专业人员该做，而没有做的事情------用击败现代格斗的方式，击败洋人，来弘扬中华传武！\",\"url\":\"https://www.zhihu.com/pins/1938149985830012780\"},{\"slug\":\"2025-08-11-张清一-全球第一个文人格斗世界冠军诞生\",\"year\":\"2025\",\"title\":\"全球第一个文人格斗世界冠军诞生：从被淘汰的二流武人到明晓\",\"date\":\"2025-08-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"同时，她还是全球第一个文人格斗世界冠军，四语学霸！成都世运会泰拳女子48公斤级中国队刘晓慧夺金她是中国历史上第一个用中国实战太极传武技术获得世界冠军的人！她应该也是中国第一个拿到世界冠军后，却根本不想“吃格斗饭”的人！她是全世界第一个完全由业余爱好者教出来的人，却能击败专业世界冠军的业余世界冠军。她是中国第一个出生在双博士家庭的武术格斗世界冠军。她只是第一个幸运地率先拿到世界冠军的清一木兰。\",\"url\":\"http://zhuanlan.zhihu.com/p/1937993109582643381\"},{\"slug\":\"2025-08-11-重新看这张首轮比赛的照片-世界亚军刚上场\",\"year\":\"2025
