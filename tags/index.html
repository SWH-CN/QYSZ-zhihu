ummary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1991514454995772865\"},{\"slug\":\"2026-01-04-为自己而活-就是低配-为别人而活-就是\",\"year\":\"2026\",\"title\":\"为自己而活是低配，为别人而活是高配的虚假人生\",\"date\":\"2026-01-04\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"为自己而活。就是低配。为别人而活，就是高配。高配的人生，就是虚假的人生！\",\"url\":\"https://www.zhihu.com/pins/1991133186718189181\"},{\"slug\":\"2026-01-04-写的很好-颇有深度赞-3年vs13年\",\"year\":\"2026\",\"title\":\"3年vs13年：别人拿全国冠军是终点，你们只是刚开始\",\"date\":\"2026-01-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"写的很好，颇有深度[赞]3年vs13年，别人用了13年才拿到冠军，满心是欢喜。而你们三年就拿到了全国冠军，也仅仅是“刚开始”的感觉，因为你们的目标是世界冠军。甚至连世界冠军也只是一个起点-----因为下面还有击败男子世界冠军的目标！再下来：还有60岁击败25岁世界冠军的目标！每一个目标，都是体制内的拳手不敢想象的梦想，神话！而对你们来说：这些仅仅是你们只要去努力，就能得到的结果！\",\"url\":\"https://www.zhihu.com/pins/1991250792271865386\"},{\"slug\":\"2026-01-03-我们不讨论谁是谁非-我只是想让你们看看\",\"year\":\"2026\",\"title\":\"信用卡有多坑：三年从20万债务变成120万\",\"date\":\"2026-01-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"我们不讨论谁是谁非。我只是想让你们看看---信用卡到底有多坑。三年就可以让你从20万债务变成120万！现在你们知道我为啥从来不开信用卡了？只开储蓄卡？我就怕某天不小心，忘了债务。你就背负一笔巨额的债务！\",\"url\":\"https://www.zhihu.com/pins/1990822589078189140\"},{\"slug\":\"2026-01-02-湖州目前的房贷首付需要15-但是开发\",\"year\":\"2026\",\"title\":\"湖州买房首付5万、利率3.0%：所谓抢银行抢的是只会存钱的牛马\",\"date\":\"2026-01-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"房几乎是“抢银行”，这才是妥妥的国家发钱】抢银行？银行不创造价值，银行抢谁的？不就是傻傻的只会存钱的牛马们吗？未来通胀预期的确比较强。中央明确要提升消费的价格。烟已经禁止销售10元一下的了。也许酒也会禁止销售10元以下的[耶]牛马的任务，当然就是吃好喝好。然后干活。实现牛马的终身价值……\",\"url\":\"https://www.zhihu.com/pins/1990350308707173792\"},{\"slug\":\"2026-01-02-严重超出了我的想象力-不就是房子吗-有\",\"year\":\"2026\",\"title\":\"房价严重超出想象力：我只利用市场，从不预测疯子\",\"date\":\"2026-01-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"严重超出了我的想象力。不就是房子吗？有啥稀奇的？你买去后能给自己带来什么样的现金流？过几年会不会到一百万，我不知道。但我知道国民和市场先生的疯狂，是我的脑子无法想象的，我只能利用市场，但我不去预测市场。因为疯子是不可能预测的！\",\"url\":\"https://www.zhihu.com/pins/1990348922527425662\"},{\"slug\":\"2026-01-02-富人无非是想要用这些凡人没有的东西-来证\",\"year\":\"2026\",\"title\":\"富人无非用凡人没有之物，证明自己的超凡身份\",\"date\":\"2026-01-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1990361784209666747\"},{\"slug\":\"2026-01-02-茅台股票稳了-但中间商被抛弃了-大批\",\"year\":\"2026\",\"title\":\"茅台股票稳了，中间商被抛弃：线上茅台彻底清除炒作空间\",\"date\":\"2026-01-02\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"神话的经销商，彻底被抛弃了！其实多年前，我就奇怪茅台为啥不直接用这一招---除了把泛滥的假货彻底清除掉。还把经销商炒作空间去掉，利润甚至可以继续提升？现在采用这一招，说明生态严峻的情况下，茅台只能抛弃原来的经销商了一句话：看懂这个逻辑的所有白酒的经销商，其他品牌的，赶紧跑路！未来是企业的去中间商时代。大量中产，中间商破产倒闭！对消费者，厂家是好消息，对销售商是坏消息。\",\"url\":\"https://www.zhihu.com/pins/1990368524963710102\"},{\"slug\":\"2026-01-01-体育要面对世界竞争的-丢人丢到国外去吗\",\"year\":\"2026\",\"title\":\"体育要面对世界竞争，丢人丢到国外去吗？\",\"date\":\"2026-01-01\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"体育要面对世界竞争的，丢人丢到国外去吗？不可思议！\",\"url\":\"https://www.zhihu.com/pins/1990122352940443428\"},{\"slug\":\"2026-01-01-去年听说国内男子第一高手-被“停止代表中\",\"year\":\"2026\",\"title\":\"国内男子第一高手被停止世运会资格：何智丽不为日本拿金牌的志气\",\"date\":\"2026-01-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"去年听说国内男子第一高手，被“停止代表中国参赛世界运动会资格”。不担心某个外国抢走人才吗？下面的文章我多年前知道此时，非常感叹。作为运动员，何智丽有志气：就算是不为中国人拿金牌，但也不为日本拿金牌。为自己拿！​[赞]​体育界，球坛，能不能纯净一点：让有本事的运动员去为国争光？这群玩潜规则的教练，真该下课！\",\"url\":\"https://www.zhihu.com/pins/1990184496901936221\"},{\"slug\":\"2026-01-01-富二代教育-责任和荣誉是如何培养的\",\"year\":\"2026\",\"title\":\"富二代教育：责任和荣誉是如何培养的？\",\"date\":\"2026-01-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"类似的情况，在富二代家长这里是很普遍的：这些富二代孩子都很聪明，但聪明基本上不用在正道上。因此很多富二代小孩，长大后各种毛病，也接不了家长事业的班。我说家庭教育，是孩子一生的价值观养成的核心因素。学校的教育再好，如果与家长的教育核心理念是相反的，结果就是不会好的！我们教的东西只在表面上做，还养成了虚伪的人格，甚至也不如普通人进取努力，远不如父母一代愿意付出和努力上进！\",\"url\":\"http://zhuanlan.zhihu.com/p/1989944995562664321\"},{\"slug\":\"2026-01-01-年过八十老两口-3-年在按摩店花-200\",\"year\":\"2026\",\"title\":\"年过八十老两口 3 年在按摩店花 200 万「治病」，为什么类似事情这么多？怎样劝说父母更容易接受？\",\"date\":\"2026-01-01\",\"type\":\"回答\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"富裕时代之后，人们期待的是精神的价值，是情绪价值，情感价值。 拐点已来，还在沉迷商品交易，物质价值的人，是看不到时代变迁的傻子！\",\"url\":\"https://www.zhihu.com/question/1989641023249474983/answer/1989990886990443474\"},{\"slug\":\"2026-01-01-金钱思维是什么\",\"year\":\"2026\",\"title\":\"金钱思维到底是什么\",\"date\":\"2026-01-01\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1989984698684950000\"},{\"slug\":\"2025-12-31-过去-24-年-段永平把-100-万美\",\"year\":\"2025\",\"title\":\"段永平24年把100万美元做到150亿美元：超过巴菲特同期成绩\",\"date\":\"2025-12-31\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"】也是万倍的增值。真了不起。这个业绩是超过巴菲特过去24年的成绩的！过去的中国，20-30年产生万倍资本增值是正常的！我相信未来20年的中国，也有万倍的机会，因为连美国这样的老牌国家都有，中国更会有了！大家加油，好好学巴菲特，就能超过巴菲特！[大笑]……\",\"url\":\"https://www.zhihu.com/pins/1989608998845040275\"},{\"slug\":\"2025-12-31-这次在备赛期间近乎没有看过外家拳的视频\",\"year\":\"2025\",\"title\":\"备赛别看外家拳视频：看多了会被带节奏，场上打不出自己的风采\",\"date\":\"2025-12-31\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"现在比赛结束，看了一些以前外家拳的视频，发现以前觉得快的人，现在觉得好慢。】这一点很重要，你们看外家拳太多，就会被带节奏，跟着走了。去年土耳其的世锦赛，估计你们就是看了太多外家拳对手的比赛，结果场上就没有打出自己的风采，神被带走了，以后要注意打出自己的风采来。外家拳只是你们的参考工具和对象，千万别去模仿对手。而是去研究对手的弱点！\",\"url\":\"https://www.zhihu.com/pins/1989831685064389875\"},{\"slug\":\"2025-12-31-如果我来买基金-这几个今年亏得最惨的基金\",\"year\":\"2025\",\"title\":\"如果我来买基金，就买今年亏得最惨的那几只\",\"date\":\"2025-12-31\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"我可以做一个FOF？基金组合卖掉赚钱的，然后去买亏钱的基金，大概率赚钱！\",\"url\":\"https://www.zhihu.com/pins/1989828167351955519\"},{\"slug\":\"2025-12-31-金融机构发的理财产品-真的不要买-太危险\",\"year\":\"2025\",\"title\":\"理财产品的险坑：不如买靠谱股票拿股息\",\"date\":\"2025-12-31\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1989844936275796083\"},{\"slug\":\"2025-12-30-一些敌对的国家-我们最好还是远离-别去惹\",\"year\":\"2025\",\"title\":\"敌对国家最好远离，别去惹是非\",\"date\":\"2025-12-30\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1989462551520643066\"},{\"slug\":\"2025-12-30-减持的140亿用于投资新新科技和体育产业\",\"year\":\"2025\",\"title\":\"减持140亿投新科技和体育产业：2030年体育产业7万亿\",\"date\":\"2025-12-30\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"这伙计厉害，布局下一个风口！体育产业2030年7万亿。消费重点从物质转向精神消费，健康消费。这也是新教育在布局的方向……\",\"url\":\"https://www.zhihu.com/pins/1989255988247811378\"},{\"slug\":\"2025-12-30-昨天白银股份涨停\",\"year\":\"2025\",\"title\":\"白银股份涨停我在高铁上卖掉换铜业：尾市破板有点可惜\",\"date\":\"2025-12-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我在高铁上看到了，就卖掉一部分，全部换仓持有还在下跌的铜业。没想到尾市破板了。早知道，我全仓卖掉白银股份好了，不贪心就好办。这么好的机会没有卖完，可惜了。持仓成本已经接近零了下跌是买入好股票的机会，也把惠泉冲15元的时候减仓的数百万股啤酒买回来，不过买的实际是燕京。因为燕京比惠泉低一元了。我认为买燕京更划算[感谢]​。珠江也不错。感谢上次惠泉涨停让我有机会调仓，现在继续买套。\",\"url\":\"https://www.zhihu.com/pins/1989257592816554941\"},{\"slug\":\"2025-12-30-花几百万是捐款-不是买一顿饭-尊重缘分\",\"year\":\"2025\",\"title\":\"花几百万是捐款不是买一顿饭：尊重缘分即尊重财富\",\"date\":\"2025-12-30\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1989323029164083014\"},{\"slug\":\"2025-12-29-只是觉得展会附近的餐食溢价空间一定很大\",\"year\":\"2025\",\"title\":\"自带干粮不是怕贵：我只是不接受五星级宾馆的餐饮价格\",\"date\":\"2025-12-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"】----其实不是这样理由的，是你以为的。该花的照样花，我去香港，住1500一晚的酒店照样住，没有是太贵就不住的。普通人都能接受的价格，没理由我不接受，我只是不接受五星级宾馆的餐饮价格罢了，觉得是智商税。带核心原因是我不想麻烦离开展馆出去，到处找吃的，选择也费劲。不如简单吃一些早上带来的保温杯里面装好的芝麻糊，配套河南的大葱花饼，我觉得比乱找啥吃的更好。吃在我的价值观上排列很低，有吃的就够了。\",\"url\":\"https://www.zhihu.com/pins/1988882488991446583\"},{\"slug\":\"2025-12-29-只要你不再证明自己-神性就会自然绽放\",\"year\":\"2025\",\"title\":\"不再证明自己，神性就会自然绽放\",\"date\":\"2025-12-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"这些经常换伴侣的人，其实就是用换伴侣来证明自己。有一天彻底不把自己当回事。不在去试图证明自己了。就走上了正道但是似乎很难，虽然我觉得很容易！\",\"url\":\"https://www.zhihu.com/pins/1988897219844273442\"},{\"slug\":\"2025-12-29-为什么中国有很多家庭父母与子女关系最后都\",\"year\":\"2025\",\"title\":\"为什么中国有很多家庭父母与子女关系最后都成为了彼此的仇人呢？\",\"date\":\"2025-12-29\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"冤亲债主的说法，解释非常好。 大家本来就是冤家，别以为成了一家就是亲人了。其实可能原来就是仇人！ 继续原来的爱恨情仇的故事！这就是人性的荒谬和考验！\",\"url\":\"https://www.zhihu.com/question/621529655/answer/1988907616445958045\"},{\"slug\":\"2025-12-29-男人如果不会挣钱-就和女人失去青春和美貌\",\"year\":\"2025\",\"title\":\"男人不会挣钱就像女人失去青春：没有价值就没有关系\",\"date\":\"2025-12-29\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"有情有义，只是你有钱有貌时候的表演。所以---别自恋，以为自己“值得爱”。你是否有价值，才是真相！没有价值，就没有“关系”！当年的我，就是2005年借钱炒股，结果“被离婚”。对方的父母以为我马上就要破产，防患于未然。金融市场的确是破产的最佳途径。当然，做好了也是发财的机会，比实体强多了。做过金融的人，再去玩实体经济，已经玩不了啦。相反，做实体的人，对金融也是恐惧有加！\",\"url\":\"https://www.zhihu.com/pins/1988891638605578533\"},{\"slug\":\"2025-12-28-正义是需要人维护的-但大多数人都是沉默的\",\"year\":\"2025\",\"title\":\"正义需人维护，沉默者居多：最终是胆大妄为者掌控权力\",\"date\":\"2025-12-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1988678767909044980\"},{\"slug\":\"2025-12-28-消费者就是这样被培养出来的\",\"year\":\"2025\",\"title\":\"消费者就是这样被培养出来的\",\"date\":\"2025-12-28\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1988750493422490212\"},{\"slug\":\"2025-12-28-苏西则遗憾的说-这是特朗普“酗酒者性格”\",\"year\":\"2025\",\"title\":\"特朗普的酗酒者性格：一旦感到羞耻就转化为强烈攻击性\",\"date\":\"2025-12-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"苏西则遗憾的说，这是特朗普“酗酒者性格”的展现特朗普并不酗酒，这里说的是【他的表现有时候像个酗酒者，强烈的自我中心化，情绪极端化，从不自省，责怪外界，一旦感到“羞耻感”，就会转化为强烈攻击性】。我突然发现，这种描绘挺像清黑的。特别这句【一旦感到羞耻感，就会转化为强烈的攻击性】。我们做的越好，这群抛弃新教育人就感到更加的羞耻。因此要去进行强烈的攻击！原来是这种心理特质。\",\"url\":\"https://www.zhihu.com/pins/1988674546681811427\"},{\"slug\":\"2025-12-28-这样的猎人太多了-到处都是-没心眼-你一\",\"year\":\"2025\",\"title\":\"猎人遍地：没心眼一生就被这些人收割\",\"date\":\"2025-12-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1988716394171344379\"},{\"slug\":\"2025-12-27-宁德的机器人已经走上了生产线产生电池\",\"year\":\"2025\",\"title\":\"宁德机器人上生产线：功效提高三倍，不努力连打螺丝都没机会\",\"date\":\"2025-12-27\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"功效提高了三倍，一致性和稳定性超真人。不努力，未来的孩子连打螺丝都没机会了。低端工作被取代很多。结局如何？看看美国就知道了。繁荣的美国，是资本家的天堂，但普通劳动者，只能卷服务业。就业难度巨大。找个工作不容易！当年的美国资本，是依靠中国和亚洲的低成本劳动力获取利润。现在的中国，靠“机器人”取代了人工上涨的困境。人不值钱了，拼不过机器人，只能等死，等救济吗？\",\"url\":\"https://www.zhihu.com/pins/1988120950789665731\"},{\"slug\":\"2025-12-27-生命的传承繁殖-可能真的不需要智慧\",\"year\":\"2025\",\"title\":\"生命的传承繁殖可能真的不需要智慧：越发达越普遍少子化\",\"date\":\"2025-12-27\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"智慧越多，可能生命的繁殖传承越难。起码现在发达国家和中上层普遍少子化，说明了这个道理！\",\"url\":\"https://www.zhihu.com/pins/1988132825111761807\"},{\"slug\":\"2025-12-27-的确-信托就是智商税-只能委托自己人管理\",\"year\":\"2025\",\"title\":\"信托就是智商税：只能托付自己人，互相依靠才能渡难关\",\"date\":\"2025-12-27\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1988379856770188644\"},{\"slug\":\"2025-12-27-穷人就是韭菜-不知道富二代小课中的“消费\",\"year\":\"2025\",\"title\":\"分不清消费品和投资品，结果白打工六年\",\"date\":\"2025-12-27\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"凡是无法给自己带来现金流的东西，就是消费品。凡是无法交易，或者只能大幅折价的交易品，就是价值毁灭者。各种珠宝，包括房子都是！不懂金融常识，处处上当！\",\"url\":\"https://www.zhihu.com/pins/1988164952456988034\"},{\"slug\":\"2025-12-26-年薪300万-也撑不过失业半年-这个世界\",\"year\":\"2025\",\"title\":\"年薪300万也撑不过失业半年：牛马没出路\",\"date\":\"2025-12-26\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1988010439834083777\"},{\"slug\":\"2025-12-26-未来只有两种产业能够赚钱-第一个是服务业\",\"year\":\"2025\",\"title\":\"未来只有两种产业能赚钱：服务业和教育业\",\"date\":\"2025-12-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1987793760319460776\"},{\"slug\":\"2025-12-24-基金赚钱-但基民就是不赚钱\",\"year\":\"2025\",\"title\":\"基金赚钱基民不赚钱：易方达蓝筹盈利100%，76%基民赔钱\",\"date\":\"2025-12-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"易方达蓝筹的盈利达100%，可是买了它的基民，76%赔钱。很好笑的事实！不过股市上，也是上市公司赚钱，但股民赔钱。只要我们有认知差，以及拥有人格缺陷，必然在本来可以获得高收益的金融界，造成高风险的亏损。追涨杀跌是人的本性！\",\"url\":\"https://www.zhihu.com/pins/1987073799439528678\"},{\"slug\":\"2025-12-24-张清一-职场和金融的层级-大鱼吃小鱼的世\",\"year\":\"2025\",\"title\":\"张清一：职场和金融的层级，大鱼吃小鱼的世界\",\"date\":\"2025-12-24\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"昨天，盈米基金的肖总告诉孩子们说：金融业是最好的职业。最有挑战的职业就是证劵投资和基金投资行业。回来又继续查了一些资料，对于中国的金融市场增加了更新的理解。截至2025年6月末，中国银行业总资产近‌470万亿元‌（即‌470,000亿元‌），位居世界第一这是一个惊人的数据。我理解为：后面的金融从业人员，本质上都是通过在认知上超越了只会存银行的广大勤劳善良的牛羊们。\",\"url\":\"http://zhuanlan.zhihu.com/p/1987267483506332958\"},{\"slug\":\"2025-12-24-所谓的大众媒体-就是迎合大众的-精英思维\",\"year\":\"2025\",\"title\":\"大众媒体迎合大众，精英思维注定是小众\",\"date\":\"2025-12-24\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"大众就是弱智群体，怎么可能去思考和提高。做自媒体，做多了，迎合多了，自然越老越平庸！但另外一些人，总是坚持做自己，不求名利。有一天，是这些卷王们比不过的。我突然发现自己居然一个人可以超过一家小型金融机构的时候，其实大为吃惊。她们其实比我卷多了[捂脸]。但迎合市场本身，让他们失去了更大的机会！\",\"url\":\"https://www.zhihu.com/pins/1987262973731968755\"},{\"slug\":\"2025-12-24-高收益的金融工具来了\",\"year\":\"2025\",\"title\":\"投1000元每天利息10元，年化365%：这种工具你敢信？\",\"date\":\"2025-12-24\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"只要投1000元，每天利息10元，年化365.%。如果你投一万元，还可以日结。财富大爆发，你抓住机会没有？[表情]在这个银行连2%的利息都给不起的时代。在我投资能够得到5%就很满意的时代。假如我投一个亿进去，一年后就变成了3.65亿。只是为啥银行和券商都不参加呢？非要把钱借给我，也只敢要3%的利息呢？存款也只给1.6%的利息？百亿资产加入---真有这么多看短视频的人相信这种梦幻故事。\",\"url\":\"https://www.zhihu.com/pins/1987068657625473070\"},{\"slug\":\"2025-12-23-恭喜你们家孩子考上三语高中\",\"year\":\"2025\",\"title\":\"恭喜孩子考上三语高中：将来外界学生再难考上冠军班\",\"date\":\"2025-12-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"未来申请人数增加，不得不提高入学要求后，可能外界的学生就再难考上冠军班了。好好珍惜机会[赞]​……\",\"url\":\"https://www.zhihu.com/pins/1986693818272203292\"},{\"slug\":\"2025-12-23-搞文旅项目-旅游资产-好像是最容易被套牢\",\"year\":\"2025\",\"title\":\"文旅和旅游资产是最容易被套牢的重资产：首富也被拖下水\",\"date\":\"2025-12-23\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"首富被拖下水，这40年发展，赚到的财富，就一下子全丢掉了。资本就是这样残酷无情的。跟错了潮头，一下子就完了！\",\"url\":\"https://www.zhihu.com/pins/1986803749453338196\"},{\"slug\":\"2025-12-23-祸莫大于可欲-肯定和支持欲望的泛滥-就是\",\"year\":\"2025\",\"title\":\"祸莫大于可欲：欲望 着走就被庄家掌控\",\"date\":\"2025-12-21\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"【今天山长的客户经理看到一个东西涨了4个点非常惊讶，但是山长的反应却非常的淡定，说真的确实有点出乎我的预料】这是我做第二大股东的惠泉啤酒涨了，总共涨了7个多点，最多9个多点，快涨停了。不是4个点！有啥好看的？涨了不是我的功劳，跌了也不是我的罪过，没啥好操心的。被股的涨跌抓住走，就被庄家掌控了情绪。这种人到了最后，注定是输家[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/1986082470123299087\"},{\"slug\":\"2025-12-21-我一直说-私人飞机就是用自己的生命危险来\",\"year\":\"2025\",\"title\":\"私人飞机是拿生命危险装B：高调做事，低调做人\",\"date\":\"2025-12-21\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"致命诱惑。我们可以高调做事。做人嘛，还是要低调。接受自己是个普通人。选择公共出行方式，选择普通客机。可靠的航空公司的飞机，在大量专业人员的维护下，其实安全度是最高的！当然--最好的方式---还是没事别到处乱走。庄园里面散散步是最好的！【据最新消息，飞机上当时就坐着Greg、妻子、2个女儿和1个儿子，全机一共7人死亡。\",\"url\":\"https://www.zhihu.com/pins/1986084813896180111\"},{\"slug\":\"2025-12-21-我们需要的很少-但我们想要的很多\",\"year\":\"2025\",\"title\":\"我们需要的很少，想要的很多：欲望超过能力就是痛苦一生\",\"date\":\"2025-12-21\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"人生的痛苦就来自于“心”的欲望太大。超过自己的需要。如果欲望超过了自己的能力，就是苦痛的一生相反：就是幸福的一生！\",\"url\":\"https://www.zhihu.com/pins/1985982700373427598\"},{\"slug\":\"2025-12-20-这个学生是SAT1530分的成绩来入读冠\",\"year\":\"2025\",\"title\":\"SAT1530分入读冠军班的女生：刚拿下全国青少年搏击冠军\",\"date\":\"2025-12-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"她写的这个游学记录。文章很详细，你们可以参考看看！这个文章写的不错，详细有理解，基本到位！\",\"url\":\"https://www.zhihu.com/pins/1985653592737212242\"},{\"slug\":\"2025-12-19-年仅-30-岁的健美冠军王昆疑因心脏病去\",\"year\":\"2025\",\"title\":\"年仅 30 岁的健美冠军王昆疑因心脏病去世，竞技健美运动存在哪些健康隐患？\",\"date\":\"2025-12-19\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"西方人就是会骗人 这种肌肉肿大的鬼子的“运动项目”，又不健康，更不美！偏偏骗人叫啥健美！ 骗死人不商量 现在果然死人了！ 这种练肌肉的人，特别消耗心脏 内家拳练筋骨力量。科学太多了！可惜中国文化没有发言权！\",\"url\":\"https://www.zhihu.com/question/1984580663253424036/answer/1985462404876871458\"},{\"slug\":\"2025-12-19-连客访的文章-知乎深圳“顶级富豪”圈\",\"year\":\"2025\",\"title\":\"深圳顶级富豪圈往事：21亿买1000平别墅有什么真实意义\",\"date\":\"2025-12-19\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"用21亿，买下一栋1000平方的别墅。每平方高达200万元，相当于内地一套大房子。这样的豪华房子，到底给拥有者啥真实的意义呢？这样的富豪，我看并不明白财富的金钱的真正意义。不是善于使用金钱的人！\",\"url\":\"https://www.zhihu.com/pins/1985255444323784413\"},{\"slug\":\"2025-12-15-今天带两女儿-见了一个20年没有见的老朋\",\"year\":\"2025\",\"title\":\"带两女儿见20年未见的老友：他家孩子毫无修养\",\"date\":\"2025-12-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"原来大家的关系还蛮好的，我觉得人还不错。但今天见完，对方带孩子一起见面，请吃西餐。小孩刚上初中的年龄，就一脸的酷酷的样子。加上其他的表现，都看得出---孩子的教育很失败。因为从孩子身上，看到了家长是个没原则，没追求的人（原来我还以为TA有一些理想和追求，曾经的太极冠军。所以我这次来武汉参加锦标赛，是想让20年前一起讨论太极如何击败现代格斗的朋友，看到太极实战的威力。\",\"url\":\"https://www.zhihu.com/pins/1983685989076580122\"},{\"slug\":\"2025-12-15-清一战队跻身全国第一格斗战队木兰们可以\",\"year\":\"2025\",\"title\":\"清一战队跻身全国第一格斗战队&木兰们可以去做中南海保镖。\",\"date\":\"2025-12-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清一战队参加了七个项目，总共有六个级别拿到了决赛权，今天有两人参加决赛，最终结果是都打赢了决赛的对手，拿到了6个金牌，成功成为全国第一格斗战队！长期以来，这个项目就是“一日游”，派出去代表中国队的队员，往往第一轮就被淘汰了！但就是这些人，第一轮就全部被外国人淘汰。懂三国，四国语言之后，老将军居然说：他要推荐这些孩子去做中南海女保镖，做大领导们的翻译，对外出访的助手，还可以胜任保镖人员。\",\"url\":\"http://zhuanlan.zhihu.com/p/1984017748863493722\"},{\"slug\":\"2025-12-13-妹妹在昆明一所大学任教-想在那边定居-亲\",\"year\":\"2025\",\"title\":\"妹妹在昆明一所大学任教，想在那边定居，亲戚都说那边离缅北近太乱了劝她回北方来，你们怎么看？\",\"date\":\"2025-12-13\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"脑子是个好东西。 可惜很多人就是不会用 没办法！ 想象力丰富到这个程度，佩服！\",\"url\":\"https://www.zhihu.com/question/1960298868949364962/answer/1983309061022831585\"},{\"slug\":\"2025-12-13-清一公社-富贵不过三代的真实案例\",\"year\":\"2025\",\"title\":\"清一公社：富贵不过三代的真实案例\",\"date\":\"2025-12-13\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"当年差点成为“总理夫人”，因为追她的一个武大留学生，回国后成为某国的总理了！她父亲是军队的高官，打过解放战争和朝鲜战争。老公是省政府的官员，还做过十几年的省长秘书。不过最近十几年，量化起来了，原来的庄股很多人吃了大亏。但他们的下一代，已经没有创富的能力，甚至：没有维持社交的能力。可能是由于过于肥胖的原因，第三代生不出孩子来！第一代是贵人第二代是富人、利用改革开放的好时机。\",\"url\":\"http://zhuanlan.zhihu.com/p/1983066818588467998\"},{\"slug\":\"2025-12-12-这个内容说明-打工的确没有出路-只有活路\",\"year\":\"2025\",\"title\":\"打工没有出路只有活路：很多人只求活着不再多想\",\"date\":\"2025-12-12\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1982785062920533775\"},{\"slug\":\"2025-12-12-连续几日-惠泉的表演特别精彩-上蹿下跳\",\"year\":\"2025\",\"title\":\"惠泉上蹿下跳：涨停封板再破板，成交量放大到流通盘三分之二\",\"date\":\"2025-12-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"幸亏上次两次涨停都出了货，现在这个跌发，大批的货，还真不好卖？不过我不用操心了，第二天没想到---这票跳空下跌，直接奔跌停去了！第三天，继续大跌接近7%，居然打破了12元的“底”。这一套，不知道多久了，因为惠泉的这种表演，几年前就玩过的，当年最高冲14元多，也是这种冲法。重新买入惠泉，无非是赚了3.5元的差价！因此，还是买珠江，才符合我的价值投资换股公式。惠泉现在的报价，如此下跌，恐慌局面彰显。\",\"url\":\"https://www.zhihu.com/pins/1982935643714786932\"},{\"slug\":\"2025-12-11-今天48公斤级的谭木兰打得不错\",\"year\":\"2025\",\"title\":\"谭木兰48公斤级打得不错：对手神气太差，第一局就该趴下\",\"date\":\"2025-12-11\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"看来历，我觉得对方应该比较专业，比散打转行的要好。我就对身边的小公主说：这个对手应该不行，神气太差了，应该战斗力和意志都不行。应该撑不住谭木兰打的，很可能第一局就被打趴了！我看在上场之前，谭木兰的状态就很积极，结果就轻松拿下对手。上场前，我看她是非常积极的，看起来很有斗志，应该是技术水平不错的拳手，我还有些担心，怕李想公主顶不住。李想公主下一个要打的对手就是谭木兰，真打，她肯定是打不赢师姐的。\",\"url\":\"https://www.zhihu.com/pins/1982490728434250636\"},{\"slug\":\"2025-12-11-传武都出这么多事了-为什么还有人深信不疑\",\"year\":\"2025\",\"title\":\"传武都出这么多事了，为什么还有人深信不疑传武是杀人技？\",\"date\":\"2025-12-11\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"传武是训练方式，和攻击理念，都不同于现代格斗的老祖宗智慧。传武不是只会杀人，会杀人的传武，也可以用于格斗竞技。如果你用传武的方法来训练和比赛，你就是传武！不过：目前似乎除了清一太极，还没有人这样做。这种人，就是传武骗子罢了，不是啥懂真传武的人！2025全国锦标赛：昨天首日开场，下面这个视频，就是传武的打法。练现代格斗的人，显然不是对手---他完全不熟悉，无法适应这种打法。\",\"url\":\"https://www.zhihu.com/question/1969338347274084534/answer/1982383179361959941\"},{\"slug\":\"2025-12-11-如果传统武术办类似UFC这种综合格斗赛事\",\"year\":\"2025\",\"title\":\"如果传统武术办类似UFC这种综合格斗赛事，大量实战，中国武术能不能发扬光大？\",\"date\":\"2025-12-11\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"背后，是你这个国家文化的实力地位的体现！如果我们的武术拳手，在格斗领域打不赢国外，就像自由搏击世界锦标赛一样，第一轮就全部败北。就像中国的武术套路表演，国际上其实参与度很低的，我们花了很大的力气，别人看来就是一种中国体操。国内其实也一样，这么多的比赛，每年发N多的奖牌，根本没有啥观众，都是自己出钱去买个热闹罢了！如果坚持下去，有可能会让一批拳手想要来学习太极传武的攻防技术。\",\"url\":\"https://www.zhihu.com/question/1912459091529434630/answer/1982352929831805748\"},{\"slug\":\"2025-12-11-我最佩服这种人-他知道自己一生要什么\",\"year\":\"2025\",\"title\":\"最佩服知道自己一生要什么的人：金钱常常毁掉真正的人生\",\"date\":\"2025-12-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"顶级数学家有多厉害？我们需要的不是大额的金钱，往往金钱会毁掉我们真正的人生！我们人生需要的是创造！他做到了。做得很纯粹。我真心不如他但我比很多为了金钱，而去出卖自己灵魂的人好得多。我同情这些失去人生的金钱教教徒！\",\"url\":\"https://www.zhihu.com/pins/1982575079629010104\"},{\"slug\":\"2025-12-11-经销商现在的确不行了\",\"year\":\"2025\",\"title\":\"经销商确实不行了：消费萎缩时代渠道必然失去话语权\",\"date\":\"2025-12-11\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"如果还想做点啥事，也许多年挣到的钱。这文章，好像在帮着出主意。其实---根本就没啥主意现在是消费萎缩时代，经销商失去话语权是必然的。当然经销商们占优势，必须分一杯。现在---品牌就只剩这几个了。你们经销商，爱卖不卖的，反正销量就这么多。谁赢得口碑都行，消费者直销，直达。电商的出现，彻底让经销商出局！本文错了---不是董明珠们的靠山到了。而是经销商们的“主子”，现在不需要他们了！\",\"url\":\"https://www.zhihu.com/pins/1982510681333965662\"},{\"slug\":\"2025-12-10-2030年我国计划实现7万亿体育消费目标\",\"year\":\"2025\",\"title\":\"2030年我国计划实现7万亿体育消费目标，如何实现？你最看好哪个方向？\",\"date\":\"2025-12-10\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"说实话：我知道未来体育领域很有前途，但没有想到：会有这么大的市场！七万亿的大市场，够不够多了？你们居然还要去体制内卷死卷生的当打工仔，是不是大路就是不走，偏走崎岖的小路？买股票也是（我看到昨天惠泉涨停，有人涨停板买进还得意洋洋的）。这些人现在来抢14元多的惠泉，干嘛不在去年去买才7元多的惠泉呢？现在的体育行业，估计就是6-7元的惠泉啤酒。就是中国过去最缺乏的方向，就是未来最有前途的方向！\",\"url\":\"https://www.zhihu.com/question/1981742134878032772/answer/1982008057815905348\"},{\"slug\":\"2025-12-10-今天早上-我应邀去我的证劵公司见老总\",\"year\":\"2025\",\"title\":\"去证券公司见老总前挂单：惠泉破板成交9.8亿，换手三分之二\",\"date\":\"2025-12-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"出发前我猜想今天惠泉会有冲高回落的动作，就挂了两个单子，比涨停低了几分钱卖出一部分股票就走了。回来看：惠泉开盘就涨停，然后快中午的时候破板，成交9.8个亿，相当于今天流通盘的三分之二，已经换手了。这样说起来，主力已经成功地把大部分筹码都卖给散户了。不管什么理由吧，事实上：就是惠泉主力已经成功撤退了。未来不一定下跌，但再涨停，似乎没有理由了。如果今天我在现场盯盘的话，会把手上的货多卖一点出去的。\",\"url\":\"https://www.zhihu.com/pins/1982160166314075805\"},{\"slug\":\"2025-12-10-如何评价游戏主播蓝战非自称在南非被绑架劫\",\"year\":\"2025\",\"title\":\"如何评价游戏主播蓝战非自称在南非被绑架劫持？有哪些问题值得深思？\",\"date\":\"2025-12-10\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"真的要当心粉丝团 没有人是为了赞赏你而来的，只是你对他们有价值而已！ 对于一些人来说，也许你存在的价值，就是被勒索。 所以，千万别自恋。\",\"url\":\"https://www.zhihu.com/question/1981525602637992876/answer/1981999540866416877\"},{\"slug\":\"2025-12-10-新教育的人-应该好好看看这个学历和就业的\",\"year\":\"2025\",\"title\":\"从读书无用论看学历与就业：985也难获得阶级升级机会\",\"date\":\"2025-12-10\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"如何看待十几年前是低学历者鼓吹“读书无用论”，而现在是清北985的人在鼓吹“读书无用论”？结论真的好凄惨：上大学，读文科肯定是不行了。大多数人，一辈子没有希望获得阶级升级的机会。只能在底层混日子，即使上了985也很难得到解脱。但现在没有一所大学是教“真文化”的，依然是原来的工业化时代的教学内容和方式，当然就跟社会的需要脱节严重了！一个大学生毕业去找工作，很多人是连这个工资都没有的！\",\"url\":\"https://www.zhihu.com/pins/1981992349774127538\"},{\"slug\":\"2025-12-09-2025全国泰拳锦标赛-明日正式开战\",\"year\":\"2025\",\"title\":\"2025全国泰拳锦标赛：明日正式开战\",\"date\":\"2025-12-09\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这次赛事，虽然人数相对来说不多，但卷的还是很厉害的。可能是因为这次赛事，也是2026年的泰拳世界锦标赛选拔赛的关系吧？比如谭木兰要打的女子48公斤，就有一个知名拳手，是从60公斤减下来参加比赛的。有昆仑决的资深职业拳手应越，还有一个从泰国回国打比赛的老拳手，已经30多岁了，多次上过仑披尼和迦南隆赛场，是水平很高的泰拳手，也很专业。陆韵如首次参加成人锦标赛，却非常的不幸。\",\"url\":\"http://zhuanlan.zhihu.com/p/1981752590841689131\"},{\"slug\":\"2025-12-09-当年的日军普遍很凶残吗\",\"year\":\"2025\",\"title\":\"当年的日军普遍很凶残吗：刺刀逼迫下学渣也能秒变学霸\",\"date\":\"2025-12-09\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"-hao的回答-知乎这个案例其实也揭示了一个真理-----当面对压力的时候，人的潜力无限！据我所知：当年二战的时候，苏联的一些戴眼镜的文人也要上战场。但他们得到的任务是---给个三个月，三个月后如果还是近视眼，就枪毙。在这种压力下，士兵们的体能都没有不合格的，上了战场也如同铁军一样坚强。结果这小女孩，一年后就拿了全国冠军，还是击败了塔沟武校的拳手，获取的冠军！\",\"url\":\"https://www.zhihu.com/pins/1981631628515251341\"},{\"slug\":\"2025-12-09-惠泉啤酒异动\",\"year\":\"2025\",\"title\":\"惠泉啤酒逆势异动：高价继续拿货，主力控盘几乎铁定\",\"date\":\"2025-12-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天逆势上涨，最高还突破了涨停价。成交量：一上午成交已经与前两天正常量差不多了。我猜测是上涨，很多人就跑掉了。但如果换入主力思维的话，现在是趁机把散落的筹码拿走了。理论上，现在的筹码集中度更高了。主力控盘几乎就是铁定的！这个高价还继续拿货，为什么？主力控盘后，股价就是随意定的了！如果这样想，现在就应该买入。但我会这样想，但看多，不做多，可能反而做空！反正已经赚了不少了，够了！\",\"url\":\"https://www.zhihu.com/pins/1981701704035606648\"},{\"slug\":\"2025-12-09-文章写的不错-希望新冠军班的人也能学到一\",\"year\":\"2025\",\"title\":\"一篇文章写给新冠军班：学会思考和面对底层无望的人生\",\"date\":\"2025-12-09\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"学会思考和面对。新教育不是只干半年就可以了吗？干了8个月？底层的生活，的确是无望的人生，这是一条没有尽头的路，很多人还乐此不疲。\",\"url\":\"https://www.zhihu.com/pins/1981725807559857246\"},{\"slug\":\"2025-12-09-突然发现-我的重仓股中国中冶-今天下跌2\",\"year\":\"2025\",\"title\":\"重仓股中国中冶暴跌21%：把最有价值的矿卖给了关联公司\",\"date\":\"2025-12-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"据说，这个货，把自己最有价值的矿，卖给了关联公司。现在她就是一家建筑公司，不值钱了。好吧，就算你说的对，我买中冶其实就是冲她的矿来的。她卖出去的资产，是卖了600亿。一个东西，原价是400亿，你卖了600亿。然后你说别人剩下来的都不值钱？于是----我反手买入N万股中国中冶。然后看到A股的跌停版打开了。也许今天这些范跑跑，都走了，明天会有买入吧？我相信：中国中冶是不会垮的，我长期持有不会亏的！\",\"url\":\"https://www.zhihu.com/pins/1981681970560914212\"},{\"slug\":\"2025-12-08-实力-执行力-不是仅仅会动脑子就行了\",\"year\":\"2025\",\"title\":\"实力与执行力：光动脑子远远不够\",\"date\":\"2025-12-08\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1981312748873871999\"},{\"slug\":\"2025-12-08-张清一-回武汉参加全国锦标赛-开启狂卷节\",\"year\":\"2025\",\"title\":\"张清一：回武汉参加全国锦标赛，开启狂卷节奏\",\"date\":\"2025-12-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这次带队回到武汉参加2025全国泰拳锦标赛，我们女子组报了四个级别的比赛，我们争取这次锦标赛拿到三块金牌，就算及格了。毕竟--刚刚结束的西安自由搏击锦标赛，我们只拿到了一块金牌。因为很早李建平教授就让在锦标赛期间，把她带来武汉，因为李教练去年在珠海集训的时候，就对她有良好的印象。这次来武汉之前，刘晓慧的父亲，还亲自跟我说：刘晓慧要备考，所以不参加比赛，但她肯定会来武汉。\",\"url\":\"http://zhuanlan.zhihu.com/p/1981312834773198833\"},{\"slug\":\"2025-12-08-这个“老钱家训”-真的很重要-远离“倒霉\",\"year\":\"2025\",\"title\":\"老钱家训：远离倒霉蛋，其实就是尊重别人的命运\",\"date\":\"2025-12-08\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"看到这个“一哥”的故事，我就想起S大师了！他特别喜欢抱怨，似乎全世界的人都对不起他我看在他还有一点特长的情况下，一直在帮他。结果----他知道我很有钱，以及很有地位之后，就觉得“我对不起他”了。没事找找茬也许我把我拥有的一些，名和利，都免费送给他，他才会满意?因此倒霉蛋真的需要远离，哭诉的人，命运都是往下走的，你去同情她。我们的世界冠军，不就是跟清黑交朋友，喜欢共情失败者，结果脑子就被灌了水。\",\"url\":\"https://www.zhihu.com/pins/1981358342698995818\"},{\"slug\":\"2025-12-04-今天回国了-要去参加全国泰拳锦标赛\",\"year\":\"2025\",\"title\":\"回国打全国泰拳锦标赛，机场候机时买回几十万股惠泉\",\"date\":\"2025-12-04\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天有空，就在机场做了一点交易，买回了几十万股惠泉。成交价在12.39以下，最低成交价12.34元！我想相当于T做了1元多一点，我应该知足了。就是买的时候，需要一点一点的买，每次挂单，就一万一万的加上去！买回来是讲感情，不买回来是本分，外面一大把的便宜股，我干嘛一定要在惠泉这里吊死自己？真心痛13.42元买我股票的主力，他真的太有钱了。现在有人不想要持股，想要卖掉的话，我拿钱买一点回来也是应该的。\",\"url\":\"https://www.zhihu.com/pins/1979930395370886836\"},{\"slug\":\"2025-12-04-看到一个故事-据说是特朗普的公司干的\",\"year\":\"2025\",\"title\":\"特朗普式抢钱：华裔767万美元别墅因欠缴410元被夺走\",\"date\":\"2025-12-04\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"有权力的富豪们，会用你想象不到的方式来抢钱。而且合法，比意大利的教父们赚钱容易多了。中国的一些先富之人，你认为你们有能力让后代与这些狼斗得赢吗？【美国，加利福尼亚州，尔湾市。一个华裔，767万美元买的别墅，因为外出旅游一趟，没有及时缴纳当月的410美元物业费，被物业公司以1.76万美元的白菜价卖了。他紧急赶回家，找到物业公司，说物业费、利息、罚款全都可以补交，请求赎回房子，被拒。\",\"url\":\"https://www.zhihu.com/pins/1979953450306532065\"},{\"slug\":\"2025-12-03-为什么白银案的嫌疑人在之后的十几年间突然\",\"year\":\"2025\",\"title\":\"白银案嫌疑人为什么停手十几年：家有儿女却背后变态\",\"date\":\"2025-12-03\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"人性的不可思议。这个人有家有口的，正常表现一切正常，但为啥背后这么变态？现在的科技手段越来越强了。各种监控也越来越好，这为侦查提供了最好的条件。中国需要强力的管理，有序的社会才能保住小民的平安！\",\"url\":\"https://www.zhihu.com/pins/1979662867117647520\"},{\"slug\":\"2025-12-03-全球播客第一人Joe-Rogan-一个靠\",\"year\":\"2025\",\"title\":\"靠聊天赚2亿美元的Joe Rogan：人生不逃避是冠军班的功课\",\"date\":\"2025-12-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"全球播客第一人JoeRogan：一个靠聊天赚2亿美元的男人人生不逃避，就是我希望清一武道冠军班学生，练习格斗的时候，能够学会的一种人生功课！至于聊天赚到两亿美金？我相信将来会是“文化产品消费”的时代，清一大学背景的人，更容易实现这个目标！但对中国人来说，实物消费才是主流。文化产品消费？很多人不懂这个概念。以后会懂的！\",\"url\":\"https://www.zhihu.com/pins/1979599666879422869\"},{\"slug\":\"2025-12-03-围棋现在真的变得像柯洁所说的那样很无聊\",\"year\":\"2025\",\"title\":\"围棋变得像对答案一样无聊：人跟AI学棋就像跟汽车赛跑\",\"date\":\"2025-12-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"围棋是一项很好玩的游戏，但AI能做的事情，人再来跟AI学习的话。快速的提高，可以使得一个普通棋手超越过去的顶尖棋手，因为他得到的训练是非常高密度的！我们也会用多媒体来训练语言学习，这和生活中学习语言，浓度提高太多了，因此我们的学生学得很快！柯洁对战阿尔法狗，事先做了很多AI对战训练，号称“半人半狗”。我们更喜欢看到人类的拼搏，自律，自强，以及智慧，在格斗中自然的体现出来。\",\"url\":\"https://www.zhihu.com/pins/1979587516203016402\"},{\"slug\":\"2025-12-03-汇旺金边往事-「柬埔寨支付宝」-死于昨夜\",\"year\":\"2025\",\"title\":\"汇旺金边往事：从「柬埔寨支付宝」到卖金融的黑手党\",\"date\":\"2025-12-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1979649346485129264\"},{\"slug\":\"2025-12-03-燕京快涨了\",\"year\":\"2025\",\"title\":\"燕京快涨了：239万股买单冲12.75，右侧投资者的买入信号\",\"date\":\"2025-12-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"20分钟后，又要一个买单买掉50多万股，扫掉了12.75挂的卖盘！实际上，对于右侧投资者来说，这种信号，就是明显的买入标志，如果我前天看到惠泉的这种情况，我就应该买入，第二天就直接抓到了一个涨停。所以，今天看了燕京的买入信号，试盘信号之后，我没有跟风买入（跌破12元整数关的时候，我已经重新补回了不少燕京），目前是零成本持有燕京。但告诉各位：燕京快涨了！如果燕京和惠泉涨的话，她没有理由不涨吧？\",\"url\":\"https://www.zhihu.com/pins/1979565955274278550\"},{\"slug\":\"2025-12-02-今天偶然看了一下行情-发现我做第二大股东\",\"year\":\"2025\",\"title\":\"第二大股东的惠泉居然涨停：这个价我可出不出的两难\",\"date\":\"2025-12-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这个，虽然知道惠泉是妖股，但没想到这么妖的，现在来玩涨停？虽然惠泉不是用融资买的，但这个价格---融资给我的话，我是不会持有的，因此就开卖了，用来还融资。但发现我的百万抛出成交后，大托单居然就没了。结果我想想，又卖了一单100万-----盘面又重复了第一单的情况。看得我心里发毛，心想600万大买单，都挡不住我的一百万抛出？惠泉我才卖了300万而已，现在还是第二大股东。\",\"url\":\"https://www.zhihu.com/pins/1979150902330929835\"},{\"slug\":\"2025-12-02-多年前-我就说-中美竞争-最终赢的一定是\",\"year\":\"2025\",\"title\":\"多年前我就说中美竞争中国必赢：美国是散沙，集中不了资源\",\"date\":\"2025-12-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"因为中国政府控制系统的资源，可以集中全国的资源力量来办大事。但美国不行，美国是散沙，肯定是打不赢中国的！现在看来，我的预判是对的，美国就是有一些局部的优势，也抵不过中国的资源系统对抗作战！11月3日，美国政府宣布：最新，最先进的芯片禁止提供给中国。比如贵州和内蒙等地（都是数据中心）的政府，就下达了通知：AI企业的算力芯片如果采用国产芯片。现在是美国放开卖芯片，中国企业都不会买了！\",\"url\":\"https://www.zhihu.com/pins/1979221255216455741\"},{\"slug\":\"2025-12-02-惠泉今日涨停-很意外\",\"year\":\"2025\",\"title\":\"惠泉涨停不意外：流动性枯竭，主力已握住五成流通筹码\",\"date\":\"2025-12-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"不过也不意外，因为惠泉日常盘面，低迷的时候只有两千万元的换手，基本上流动性枯竭了。持有流动股的50%头寸，没有这么多筹码的话，拉涨停，就是为别人抬轿子的。上前几年我大做惠泉的时候，手上的筹码只有现在的三分之一，主力也不在意我这点小钱，多次盘中拉涨停，完全无视我的存在。我这次进入之后，惠泉就一直是不死不活的！我猜：今天的涨停，也是惠泉主力看我上次14元都没有大举卖出。\",\"url\":\"https://www.zhihu.com/pins/1979228511156855970\"},{\"slug\":\"2025-12-02-核心就是理性能力差的人-会关注小概率事件\",\"year\":\"2025\",\"title\":\"理性差的人才信幸存者偏差：50元赚25万的故事别往自己身上套\",\"date\":\"2025-12-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"核心就是理性能力差的人，会关注小概率事件，会有“寻存者偏差”：比如理性差的人，会看到这对情侣“赚了5000倍，50元钱赚了25万走！理性的人，就算这个故事是真的，也绝不会认为自己就是这个万分之一的幸运儿。只是从概率来推导---自己去赌博输的可能性更高！不过：现在的父母教育出来的孩子，都拥有过高的自我认为。总认为自己是最特别的这个人，因此：现在的人，大概率是成为赌徒！\",\"url\":\"https://www.zhihu.com/pins/1979165914155991322\"},{\"slug\":\"2025-12-02-苏联领导人斯大林为什么那么清廉呢\",\"year\":\"2025\",\"title\":\"斯大林为什么清廉：政治局成员除列宁外一个不留\",\"date\":\"2025-12-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"大清洗。斯大林原来一起的政治局成员，除了列宁之外一个不留，全部死于非命。政治斗争，太残酷了！\",\"url\":\"https://www.zhihu.com/pins/1979317163971084596\"},{\"slug\":\"2025-12-01-1991年双引工程之管中窥豹人才争夺战\",\"year\":\"2025\",\"title\":\"1991年双引工程管中窥豹：人才争夺战现在打向欧日科学家\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"只是现在的人才引进的对象，是正在衰落的欧洲和日本的顶尖科学家。20年后，中国是理所当然的世界科技霸主。\",\"url\":\"https://www.zhihu.com/pins/1978820680511398750\"},{\"slug\":\"2025-12-01-5-万人血本无归\",\"year\":\"2025\",\"title\":\"5万人血本无归：北大博士林强的千亿骗局与8%固定收益\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"北大博士林强的千亿骗局：从游艇推介会到亡命巴厘岛看不懂的东西就不要投，不要相信【北大博士】这样的头衔8%的固定稳定收益---如果真有这种好事，银行早就做了。抢都抢不赢的，谁轮到你来投？银行自己能有1.5%的稳定收益就喜死了！林强说给你8%的稳定收益，你就以为你了不起，你长得漂亮？真的太自恋了不过---比这自恋的人更多，大多数散户，看中的是“一年翻一倍”的收益！不知道哪里来的自信！\",\"url\":\"https://www.zhihu.com/pins/1978914264765990053\"},{\"slug\":\"2025-12-01-“你要么适应潜规则-要么被潜规则淘汰\",\"year\":\"2025\",\"title\":\"要么适应潜规则，要么被潜规则淘汰：外资离场的真正逻辑\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【真正决定他们“退场”的逻辑从来不是“打不赢本地玩家”。但如果因此去适应、模仿甚至依赖本地潜规则，代价将不是一笔亏损，而是企业的组织结构被永久改变。如果我回国发展的话，就必然会发生【组织结构被永久改变】，要不就被淘汰。而且我的大量精力，要消耗在“行业勾兑”上！我认为国内格斗界的世界水平很差的原因，肯定不是中国人不行，而是这种行业潜规则太强，跟国外格斗界“简单有效，目标清晰”的优选方式不一样。\",\"url\":\"https://www.zhihu.com/pins/1978912262577211304\"},{\"slug\":\"2025-12-01-市面上所有的电视剧-都是为了让女人变傻\",\"year\":\"2025\",\"title\":\"电视剧不是让女人变傻，而是女人不肯变聪明才养出傻剧\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"真正的原因，恐怕与你的结论相反：是因为女人很傻，因此导致电视剧们只有装傻！才能让女人们来看这种傻剧。电视剧傻，就是因为女人们不肯变聪明，不愿意看聪明书。女人都不去看【教父】，只愿意读【傲慢与偏见】，还要读两百遍！所以--这群制作人，只能拍情感剧，才有女人来看了。现在的中国，连拍【傲慢与偏见】都没人看的。只有小短剧，【霸道总裁爱上我】才能走俏。---所以是女人让我们的文学和艺术都全变傻了。\",\"url\":\"https://www.zhihu.com/pins/1978850503346656596\"},{\"slug\":\"2025-12-01-为什么大多中国人到国外大多只是愿意拿绿卡\",\"year\":\"2025\",\"title\":\"为何多数中国人只拿绿卡不入籍：从瑞士175元一盘河粉说起\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【瑞士日内瓦的中餐馆，吃一顿干炒牛肉河粉19.9瑞郎，约合人民币175.4元，这个钱够在国内一线城市吃8-10盘干炒牛肉河粉。】看了欧洲的啤酒和可乐的价格，我持有中国的啤酒股更有信心了！\",\"url\":\"https://www.zhihu.com/pins/1978877882928497944\"},{\"slug\":\"2025-12-01-古玩的水有多深\",\"year\":\"2025\",\"title\":\"古玩的水有多深：穷人、中产、富人各有各的精准收割方式\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"穷人被衣食住行的利益集团收割，中产，富人们，就被这些古玩珠宝玉器收割。顶级富豪被金融手段收割。凡是有贪心的人，都会被人精准，定向收割。只有无欲之人，利集集团才毫无办法！\",\"url\":\"https://www.zhihu.com/pins/1978853374867838906\"},{\"slug\":\"2025-12-01-太可惜-提车90天就离世-北京170超美\",\"year\":\"2025\",\"title\":\"提车90天就离世：你以为想要川崎忍者，其实想要的是自由\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"你能放下对“川崎忍者”的拥有期待，放下对机器速度的激情，你就拥有了相对的“机车自由”。你拥有的是它给你的条件和限制，其实你更不自由了。---因为企业制造的是一套速度机器，不是你自己的速度。他们让你用大价钱，大马力，买到了“他们制造出来的驾驭和控制的感觉”。我们的控制，只能从自己下手，控制自己的身心！我可以在对手无法反应的速度击中对手，这种不假外力的速度，以及自由，才是自己真实的速度和激情。\",\"url\":\"https://www.zhihu.com/pins/1978924658200974576\"},{\"slug\":\"2025-12-01-媒体报道爱马仕继承人手中-150-亿美元\",\"year\":\"2025\",\"title\":\"媒体报道爱马仕继承人手中 150 亿美元股份被骗，究竟发生了什么？这笔股份能追回来吗？\",\"date\":\"2025-12-01\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"千亿资产消失，富不过五代，已经很不错了。【教父】这部书籍，早就说明了这个世界的玩法：一：穷人的掠夺者是工头和黑帮。他们才不会像黑帮一样冒险去掠夺穷人，还要冒被穷人反杀的危险。比如老柯里昂，就是看见了自己一直老老实实的干活的话，他会被一个底层的街头黑帮吃死的。金融家们，比原来的黑帮对手厉害多了，赚钱多多了。这个案例中，抢走这一千亿资产的人，是这个败家子老头。法官既然判断是“自杀”自然追查不下去了！\",\"url\":\"https://www.zhihu.com/question/1978486647059347350/answer/1978847908871815667\"},{\"slug\":\"2025-12-01-马斯克最新7大未来预言我看以后的基本结论\",\"year\":\"2025\",\"title\":\"马斯克七大预言：中产白领消失，大学大洗牌，文化消费兴起\",\"date\":\"2025-12-01\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"马斯克最新7大未来预言:我看以后的基本结论：中产和白领消失，体力劳动者服务者有工作（低端服务工作）原来建立在工业时代的，服务于原来的工业体系的教育系统彻底崩溃。健康和生命科学会被更加重视，有可能服务人类健康（而非疾病）的新医学会出现。马斯克的七大语言：1.手机将消失，个人AI成为新入口，只需一个显示设备即可调度所有服务；3.AI最先取代办公室白领而非体力工，别活成“高配版Excel\\\";……\",\"url\":\"https://www.zhihu.com/pins/1978786058121549033\"},{\"slug\":\"2025-11-30-别管是传武爱好者还是现代武爱好者-请问武\",\"year\":\"2025\",\"title\":\"别管是传武爱好者还是现代武爱好者，请问武术需要套路吗？\",\"date\":\"2025-11-30\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"如果是要做武术表演，一种文化现象，当然需要练套路了！我练了几十年的太极，一套完整的套路都没学过，但需要的时候，表演出来都认为在我是太极，就是不知道那一派的。另外，我要去参加国家的武术套路比赛的话，估计是拿不到奖牌的。其实也需要呀---现在的擂台格斗，本质上就是娱乐业。大家都喜欢中华武术，如果我能够像表演套路一样，在擂台上打出一套传统拳出来，还能够打赢现代格斗，肯定好看，肯定全国人民都喜闻乐见。\",\"url\":\"https://www.zhihu.com/question/287199102/answer/1978396012797257368\"},{\"slug\":\"2025-11-30-这个对手的体重也比你们重很多-外家拳都特\",\"year\":\"2025\",\"title\":\"对手重5到10公斤也没关系：外家拳靠降重压制，我们不靠\",\"date\":\"2025-11-30\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"因为技术差不多，体重优势就会重要，因此赛前各种降重的方法，的确很让人佩服。对身体长期来说是一种伤害。但对我们来说，对手差个5-10公斤的对手，其实差别不大！相同体重我们更加的压制性打击。你们经过这种大大体重拳手的锻炼，也更不会害怕国内的降重狂魔了。\",\"url\":\"https://www.zhihu.com/pins/1978388749088990174\"},{\"slug\":\"2025-11-29-11.27-马上就要比赛啦\",\"year\":\"2025\",\"title\":\"11.27 ELLA今年首战全国锦标赛：再遇耿春蕾，不留遗憾\",\"date\":\"2025-11-29\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天是ELLA在今年第一次参加的全国锦标赛。去年12月全国锦标赛打耿春蕾，判负，还失去了参加世界锦标赛的机会，肯定是不服气的。今年打耿春蕾第二，就不给自己留遗憾了​[赞]​……\",\"url\":\"https://www.zhihu.com/pins/1978022162255332999\"},{\"slug\":\"2025-11-29-今天早上ELLA的比赛又被黑了\",\"year\":\"2025\",\"title\":\"ELLA的比赛又被黑了：多次击中对手却被判负给东道主\",\"date\":\"2025-11-29\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"ELLA对战东道主（今天外家拳唯一一场“赢”了清一武道馆的比赛）场上有明显的优势，多次击中对手，但就是因为没有KO对手（第三局对手也快不行了），最终居然被判负！不过，可以理解，她的对手是本次赛事的协办单位，当然要“照顾拳手”了。因为知道不KO，就会被裁判夺走比赛结果。所以：今天上午，我方拳手参加的五场比赛，我们被裁判判输丢了一场比赛，其余我方武道馆拳手，都闯过了首轮赛事，晋升下一轮。\",\"url\":\"https://www.zhihu.com/pins/1978094600301327745\"},{\"slug\":\"2025-11-28-为什么越到高层女性越少-无论政界还是商界\",\"year\":\"2025\",\"title\":\"越到高层女性越少：女人既不讲理也不讲情，难沟通\",\"date\":\"2025-11-28\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"女人就是不讲理的。其实也不讲情。的确是很难沟通的对象，佛陀都说：不能收女人学佛，坏了500年的基业……\",\"url\":\"https://www.zhihu.com/pins/1977693494920376333\"},{\"slug\":\"2025-11-28-天才新秀张子宇为什么新赛季无球可打-没有\",\"year\":\"2025\",\"title\":\"天才新秀张子宇无球可打：父母做经纪人刚冒头就被联手封杀\",\"date\":\"2025-11-28\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"天才新秀，也要出来打才有价值。藏在家里面，我看只有老妈养起来。舍不得付出的国人，毫无理性的父母做经纪人。刚冒一点头就张扬得被俱乐部联手封杀，实在是搞笑。\",\"url\":\"https://www.zhihu.com/pins/1977875347321160618\"},{\"slug\":\"2025-11-28-如果中国要强行去建设非洲的话-会出现什么\",\"year\":\"2025\",\"title\":\"中国若强行建设非洲会怎样：别在国内卷，去等待发展的地方\",\"date\":\"2025-11-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"国人没必要在国内卷了，去南美洲，去非洲吧。就像40年前来中国赚钱的外资。港商一样。去等待发展的地方，你才有前途三语学校就是防卷的最佳工具。\",\"url\":\"https://www.zhihu.com/pins/1977657043872679418\"},{\"slug\":\"2025-11-27-40岁以上中年人失业都干嘛去了\",\"year\":\"2025\",\"title\":\"40岁以上失业都干啥去了：没有事业的男人就没有生命光彩\",\"date\":\"2025-11-27\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"下面这个案例好典型：没有事业的男人就没有生命，没有光彩！【我老公41，创业失败，负债，被执行，工作几个月又失业了。他试着去跳河自杀，可能是觉得我和女儿太惨了，就没跳。三个月，他失语、体重狂掉，从200斤的乐观胖子，变成了140斤的口吃废柴。】对于女人来说：比男人更惨！没有人爱的女人，就没有生命的光彩，再成功的女人都要到处找爱。因为女人的生命支撑是感情。比事业更靠不住！\",\"url\":\"https://www.zhihu.com/pins/1977372016362407275\"},{\"slug\":\"2025-11-27-泽连斯基是个“英雄”-他拯救了中国-给了\",\"year\":\"2025\",\"title\":\"泽连斯基既是英雄也是卖国贼：小民不过是利益集团的棋子\",\"date\":\"2025-11-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"但泽连斯基也是一个“卖国贼”，他为了迎合美国金融集团打压欧洲的目标，牺牲了乌克兰的未来。装成英雄的样子，牺牲了大批乌克兰人的生命和未来！小屁民真的很惨：无非是这些利益集团大佬的工具和棋子。很大程度，这是泽连斯基一伙给乌克兰人带来的，当然，乌克兰人自己也属于他们的选择。现在，乌克兰人正在抛弃泽连斯基，其民调排名已经排到第四去了。一个针对泽连斯基和他的下属涉及1亿美元的贪污正在调查之中。\",\"url\":\"https://www.zhihu.com/pins/1977332497701418324\"},{\"slug\":\"2025-11-27-清一公社-家族永续的价值保护者\",\"year\":\"2025\",\"title\":\"清一公社：家族永续的价值保护者\",\"date\":\"2025-11-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"如果你现在有一笔钱：你怎样才能保护你的财富不被“时间”这个超级掠夺者抢走？我父母就是只相信银行---而且只相信四大行的老一代人！存银行，本质上就是价值慢性死亡的一段路，从一个四合院的全部价值，死亡退化到只有一个四合院的物管费了。那么：你知道欧洲的一个过去的贵族王公的城堡，现在卖多少钱吗？看清楚财富的未来，你就知道了：清一公社根本就不是一个理财产品，而是一个顶级的家族传承系统方案。\",\"url\":\"http://zhuanlan.zhihu.com/p/1977338782656250180\"},{\"slug\":\"2025-11-27-清一武道-高考50年变迁-学术之路与超凡\",\"year\":\"2025\",\"title\":\"清一武道：高考50年变迁  学术之路与超凡之路\",\"date\":\"2025-11-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"其实：正路就是一路按照“社会标准价值观”超越他人，做到别人做不到的事情。比如你18岁考上一个985，超越99%的人。一旦发现别人的成就，特别是武术上的知名度，影响力，比他高一点，就启动其自卑感。全世界的中国人，都习惯用考大学获取自我认同度，也是过去40年形成的固化思维，其实这条路，错倒是不错的。粗略统计了一下，虽然普通人考上大学从曾经的百里挑一，变成了四个里面挑一个。\",\"url\":\"http://zhuanlan.zhihu.com/p/1977406222798962944\"},{\"slug\":\"2025-11-26-冠军班只练了一年-就敢打全国锦标赛\",\"year\":\"2025\",\"title\":\"冠军班只练了一年，就敢打全国锦标赛\",\"date\":\"2025-11-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"冠军1班，就是原来的今日示范班。这次锦标赛，冠军一班首次上阵，与专业武者对抗，就拿了一个金牌，两块银牌，算是开局不错了，虽然孩子们都认为自己这次打得很难看！清一大学冠军班自由搏击锦标赛混剪第一次本来就没指望拿牌的，就是去练练兵，知道一下差距！换了外家拳，冠军班与公主班，与武士们打，就连交手的资格都没有，对战就都只能单方向狂虐了。去年公主班首次参加全国自由搏击锦标赛，还一金未得呢。\",\"url\":\"http://zhuanlan.zhihu.com/p/1977146175271487369\"},{\"slug\":\"2025-11-26-百日千战-世界锦标赛格斗之王争霸赛预\",\"year\":\"2025\",\"title\":\"百日千战---世界锦标赛格斗之王争霸赛预告\",\"date\":\"2025-11-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我计划在2028年冬季，启动百日千战，拳手马拉松连续格斗大战！让我们的磨丁赛事，成为世界顶尖拳手最想参与的，最有挑战性的格斗赛事，超越UFC的影响力。我们尽量来打造一个世界级的格斗赛事品牌！如果我们这个赛事真的成了，最终我们就开办一个划时代的世界性格斗赛事-----传武大战现代格斗，百日千战【世界格斗之王冠军锦标赛】。其中胜率最高的拳手，获得世界百战拳赛之王奖杯，还可以拿到100万元以上的大奖！\",\"url\":\"http://zhuanlan.zhihu.com/p/1976975067008234399\"},{\"slug\":\"2025-11-24-如何看待-“上海一小区多套93平米住房\",\"year\":\"2025\",\"title\":\"如何看待，“上海一小区多套93平米住房，统一挂出1460万元”？\",\"date\":\"2025-11-24\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"换一个思路，就很轻松地解决问题了如果我有1460万元（我真有）。我是否要用于在上海买个93平方的住房吗？1：其实我不明白，我为啥一定要生活在上海？2：2025元，上海的基本工资标准，是2740元。这套房子的钱，用来买公社永续基金的话，可以够我拿到14个人的基本工资了。每个月都能白白拿到几万元用于消费，我在昆明可以住宾馆，吃自助餐。3：如果只是一个普通人，在上海打工，一辈子也买不起这套房子。\",\"url\":\"https://www.zhihu.com/question/1975629729185944979/answer/1976325182026170404\"},{\"slug\":\"2025-11-24-这是时隔一年之后-清一木兰们再次出战全国\",\"year\":\"2025\",\"title\":\"清一木兰再战全国自由搏击锦标赛，随后直奔武汉打泰拳锦标赛\",\"date\":\"2025-11-24\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"成绩如何，就等着瞧好了。9天后就出最终结果了。然后木兰们将马不停蹄的奔赴武汉，征战全国泰拳锦标赛（成年组）。据调查：太极拳具有练习者有7000多万人，惊人的数量！转发新闻报道：国家体育总局武术运动管理中心、武术研究院，于2025年度在全国范围内开展了武术太极拳习练人口专项调查工作，并形成了《全国武术太极拳习练人口抽样调查基本数据报告》。\",\"url\":\"https://www.zhihu.com/pins/1976398694858384857\"},{\"slug\":\"2025-11-22-1.8亿的天价蓝钻戒指-爪子竟然镶歪了\",\"year\":\"2025\",\"title\":\"1.8亿蓝钻戒指镶歪了：等于180个家庭的永续传承机会\",\"date\":\"2025-11-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"一颗亮晶晶的小石头，居然要花费180个家庭的【家族永续传承自由权】机会，我想问：值吗？如果一个富豪，想让子女【享受富贵生活】，直接传给他每个月拥有【180个人的工资收入总和】，我认为总比拿着一个小石头炫耀给人看要更实惠吧？虽然这样肯定会让她失去人生奋斗的积极性。可能我骨子里面就是穷人，实在理解不了这种“富人的花钱逻辑”。我认为买个石头不是投资，而是消费，是价值毁灭者。\",\"url\":\"https://www.zhihu.com/pins/1975490992120537226\"},{\"slug\":\"2025-11-22-为什么出过国的人回来都不描述真实的西方百\",\"year\":\"2025\",\"title\":\"出过国的人为何不描述真实的西方百姓生活\",\"date\":\"2025-11-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"日本的工作真的更容易找国内只能拿到4000元的工人，溜到日本去认真工作，一个月赚4万……\",\"url\":\"https://www.zhihu.com/pins/1975708281377953152\"},{\"slug\":\"2025-11-22-公主们正在清迈征战世界职业拳手\",\"year\":\"2025\",\"title\":\"公主们正在清迈征战世界职业拳手\",\"date\":\"2025-11-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨晚陆韵如公主和李想公主在清迈参加泰拳职业拳赛。训练方式也改进了，今年一年公主们在泰国打泰拳职业赛，大部分场次都是以KO对手作为结束的。这个结果，也导致一个不好的结果：就是清迈的女拳手大部分都不愿意和木兰拳馆的人交手，因为很容易受伤，老被公主们KO。记得木兰们刚在清迈打比赛的时候，场上的外国人，对中国的拳手是鄙视的，很看不起。周柏青的对手是以色列人正在检录处登记拳手资料钟公主的随手是意大利人。\",\"url\":\"http://zhuanlan.zhihu.com/p/1975670852033987810\"},{\"slug\":\"2025-11-22-美国真的和新闻上说的一样乱吗\",\"year\":\"2025\",\"title\":\"西海岸七子没一个半年不沾毒：真心不支持送孩子去美国\",\"date\":\"2025-11-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"【我的润党同学，我称之为西海岸七子，没有一个到了美国能超过半年不沾毒品的。】转信息真心话，我真的不支持家长送孩子去美国。花重资去美国，本想望子成龙，别不小心，收获一个废人回家。香港认可的价值3000万的199所世界名校中，日本有六所。想闯荡世界的人，可以去南美去闯天下，学西语。都可以逃过“中国世界大卷王”的痛苦生涯。让我的话，我会给女儿选泰国的朱拉隆功（泰国北大）。\",\"url\":\"https://www.zhihu.com/pins/1975502156867077659\"},{\"slug\":\"2025-11-21-22-与神对话-神的欲望天天去争的话\",\"year\":\"2025\",\"title\":\"《与神对话》：能争而放弃争，才谈得上超越\",\"date\":\"2025-11-21\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"放弃的话，真实身份就是无能。能争，有争的能力，但是放弃争的话，可以选择超越。当然，超越也是极难的事情！英子已经有争的能力，可以修放下了。一直争下去，就成为“斗猫”了，以为争才是唯一的处理方式。但我希望公主们还要学习和拥有“争的能力”，现在她们太弱了！面对问题一旦放弃，不是圣人。而是无能之人​[捂脸]​……\",\"url\":\"https://www.zhihu.com/pins/1975118999231678153\"},{\"slug\":\"2025-11-21-要是你突然继承了8000万-明天起床先做\",\"year\":\"2025\",\"title\":\"要是你突然继承了8000万，明天起床先做什么？\",\"date\":\"2025-11-21\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这里有8000多个回答，非常的热闹，都是渴望自己天上掉下一笔大财的人。假如小女18岁，拥有我转给她的8000万，然后问她想干啥？“管钱好烦人，我又用不着这些钱，拿给我管干嘛？算了，一定要过我管，我就用来买20年后肯定还会存在的公司的股票，然后---该干什么继续干什么”继续带班，继续练武，继续学习。这种行为很简单，但她的真实身份，就是可以拥有财富。因此：如何向宇宙展示你的真实身份，非常的重要！\",\"url\":\"https://www.zhihu.com/question/1923394092647298305/answer/1975138817037063195\"},{\"slug\":\"2025-11-20-11.15日成长日记这种与学生良好互动沟\",\"year\":\"2025\",\"title\":\"11.15成长日记：与学生良好互动的沟通模式最难学\",\"date\":\"2025-11-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"因为这和M的成长背景有关系，她从小就成长在这种“自由与自尊，尊人”的环境里面，连被打屁股，都是“理性，选择与沟通”的结果。沟通的权威换服从，来自于理性和超越对手的深度的逻辑，而不是来自于情绪和愤怒。因此的确与从小被宠，被忽略的孩子不一样。宠辱若惊，心态上，分了高下，孩子从小学的就是不平衡的沟通模式。才有现在这么多的乱象！如果孩子不是从小生活在这样的环境里面，很难学到这种沟通方式。\",\"url\":\"https://www.zhihu.com/pins/1974742772620759348\"},{\"slug\":\"2025-11-20-为什么很多知识分子不相信印巴冲突中歼10\",\"year\":\"2025\",\"title\":\"知识分子为何不信歼10C战绩：把产品做成辣椒炒肉专班\",\"date\":\"2025-11-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"这道菜味道好不好不知道，我们普通人没法品尝，但灵导说研发这道菜的成本花了3个亿。并宣称辣椒炒肉这道菜是伟大美食科技创新的结果，是人类文明历史的一大步，吊打西方所有食品5条街。——你要是觉得上面辣椒炒肉的过程滑稽可笑，那你就明白，非市场竞争的垄断企业，体制，大概就是这样玩的了！人永远也不够用！拨款永远要增加！产出就别问了！有个仪式表示一下！\",\"url\":\"https://www.zhihu.com/pins/1974832181709932430\"},{\"slug\":\"2025-11-19-100个张家界“野人”-要断了全国减肥营\",\"year\":\"2025\",\"title\":\"张家界100个野人断了减肥营财路：想办一个格斗马拉松\",\"date\":\"2025-11-19\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我在想：是不是跟电视台合作，搞一个“格斗马拉松”的赛事活动。全国找100个队员参赛，分别代表自己的家乡，每天抽签配对，打一场实战循环比赛，坚持到第五天不退赛的，就发5000元奖金。以后每多坚持一天，就增加1000元奖金。这样坚持打完全部对手，获胜场次最多的人，就成为“全国百人最强拳手”，就可以拿百万奖金！这种有趣的，长期的关注，绝对可以吸引大量的人群参与，特别是家乡的父老乡亲的关注。\",\"url\":\"https://www.zhihu.com/pins/1974524261927515946\"},{\"slug\":\"2025-11-19-卖房亏了几十万-心里不好受-请问该怎么安\",\"year\":\"2025\",\"title\":\"卖房亏几十万怎么安慰自己：没多少钱还想去买千万豪宅是疯了\",\"date\":\"2025-11-19\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1974405582669780911\"},{\"slug\":\"2025-11-19-我想在三年后-举办一项赛事-磨丁格斗城百\",\"year\":\"2025\",\"title\":\"三年后办磨丁格斗城百日大战：木兰迎战100位各国冠军级拳手\",\"date\":\"2025-11-19\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们会邀请全世界各国的格斗手们，水平至少是全国冠军以上级别的拳手，来磨丁开展一次百日擂台战，连续打一百天的比赛！但估计外国人不适应这种连续百日的大战，连续9日就累翻他们了！我们大概需要请11个国家的冠军格斗队伍来参赛（木兰们会在世界锦标赛上认识这些对手，并邀请这些国家的拳手来磨丁参加比赛）。我们的清一拳手们，就连续打十国联军的循坏赛，拳手连续作战打101天，显然对拳手是一个超级的检验。\",\"url\":\"https://www.zhihu.com/pins/1974552834281324610\"},{\"slug\":\"2025-11-18-一贯的“欺师灭祖”-也许就是小鸟的天性\",\"year\":\"2025\",\"title\":\"一贯的“欺师灭祖”，也许就是小鸟的天性\",\"date\":\"2025-11-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"他们有点无奈的说：黄小鸟特别会骗人，编故事的能力也很强，一流的演员。比如：熊某，马某，黄小鸟等人，都是每天在J老师的学生群里早请安，晚问候，每天都一副“忠厚老实，忠心耿耿”的样子。黄小鸟本来，就是借助刘老师的机缘，才接触到J老师的，但因为J老师的神通高，她就巴结的特别厉害。盛老师买“神画观音”的故事|欺师灭祖也许是黄小鸟的天性，这一伙的下限在哪里\",\"url\":\"http://zhuanlan.zhihu.com/p/1974097405097051497\"},{\"slug\":\"2025-11-18-一贯的“欺师灭祖”-也许就是小鸟的天性黄\",\"year\":\"2025\",\"title\":\"欺师灭祖也许是黄小鸟的天性，这一伙的下限在哪里\",\"date\":\"2025-11-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"原来我们一直以为她只是被黄小鸟利用的傻子。说J老师传给黄小鸟一副观音画像，是秘传的，画得多好多好。但如果盛老师要练功需要观音助力的话，她愿意牺牲一下，愿意把黄小鸟给她的这宝贝画，也转让给她。也要表达一下对J老师支持的心意，只要随便给点钱，给这个黄小鸟闺蜜弥补一下，给她转三千块就行了。后来过了几天，可能这个小鸟闺蜜觉得盛老师人傻钱多，又来找她聊，说还有一幅更好的东西，也是J老师送给她的。\",\"url\":\"https://www.zhihu.com/pins/1974143479912358769\"},{\"slug\":\"2025-11-18-人比人气死人-真的要看你怎么比法了\",\"year\":\"2025\",\"title\":\"人比人气死人：付出100个对象，回报也许只有1%\",\"date\":\"2025-11-18\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"不是所有的付出都有回报的，实际上，真实的世界就是付出100个对象，也许不到10%的人才会给你回报甚至只有1%。但你如果只肯对这1%的人付出，你就连这1%都得不到了。从我这里得到好处的人何止上万，但有事出来帮忙的人有多少呢？可是他当初并不知道李小龙才是让他青史留名的人。甚至他教李小龙的时间很少，他对其他人付出更多。​[捂脸]​往上走，就要学会“只问耕耘，不问收获”的人生态度了。\",\"url\":\"https://www.zhihu.com/pins/1974084435243726079\"},{\"slug\":\"2025-11-18-今日操作-上次12.75元卖出的燕京-今\",\"year\":\"2025\",\"title\":\"燕京12.75卖出后便宜7毛买回，珠江9.58卖出做了一次T\",\"date\":\"2025-11-18\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"怎么能够想到几天之后，价格就跌到12.00了？同时今天也卖出了一点珠江，卖出的价格----正好是上次买入的价格，9.58-9.60元。如果珠江第二天涨了三毛就卖掉，今天就拿到一块钱的差价了。只是我嫌弃3毛钱太少了不想要！就是今天成交量不大，不像上次很容易成交，所以只做了一两成单子，没有完全拿回来。怎么觉得---就是有人要送我钱一样？不过，换句话说，今天我的市值损失了上千万，也许我应该躲起来哭一会！\",\"url\":\"https://www.zhihu.com/pins/1974127674373988892\"},{\"slug\":\"2025-11-18-清一武道-从“子弹姐”看国礼和世界冠军是\",\"year\":\"2025\",\"title\":\"清一武道：从“子弹姐”看国礼和世界冠军是怎样练成的？\",\"date\":\"2025-11-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一武道馆，已经拿到了一个含金量极高的泰拳世界冠军---世运会冠军。那么：对于当事人来说，是不是拿到一个世界冠军，就证明她是武林高手了？防止某次战败后，失去“世界冠军”的光环。谷爱凌拿到的奖牌，是中国原来从来没有拿到过的冬奥会冠军。我们拳手拿到的泰拳世界冠军，其实是一匹黑马。不断荣耀自己的国家，可惜是个小国）2010年和2013年，舍甫琴科连续两次获得世界武博运动会泰拳女子60公斤级冠军。\",\"url\":\"http://zhuanlan.zhihu.com/p/1973882738785412869\"},{\"slug\":\"2025-11-17-今天看到中粮糖业连跌三天-五天前连续两天\",\"year\":\"2025\",\"title\":\"中粮糖业连跌三天：怀疑主力被套只能往上做，我17元清仓\",\"date\":\"2025-11-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"说实话，我怀疑主力被套了，只能往上做了。你们会笑话我持有近两千万股，却早早逃走了（最后几十万股是17元走掉的），我可从来不指望我能够在20元逃顶成功！主力肯定不会拉高让我逃走的，我又不是他爹（他爹可能主力不会干这事的！）各位看我就知道了---我做大股东的股票，比如啤酒等等，就是死也不涨。中粮糖业是前面两天涨停，但成交量不是太大。第三天开始放量，但都是跌势，追进去的全套牢了！\",\"url\":\"https://www.zhihu.com/pins/1973842232374215210\"},{\"slug\":\"2025-11-17-有哪些失传的神技-是过去真实存在-现代人\",\"year\":\"2025\",\"title\":\"磨刀53年的华叔：双手无茧用阻力——这就是内家拳的奥秘\",\"date\":\"2025-11-17\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"【华叔磨了53年的刀，双手看上去很光滑，并没有一块茧，磨刀是用阻力，手上根本就不用力，而是背部出力，到了夏天的时候，背部都打湿了。】这个就是内家拳的奥秘：手上是不出力的，而是身上出力。当然，我们也不是背部不出力，核心是脚上移动出力，腰挎发力，抖身发力。所以看我跟人接手对战，似乎毫不用力，但对手跌跌撞撞的站不稳。就是身子发力之功，再让对手失衡之时，一旦想要伤人，轻而易举！\",\"url\":\"https://www.zhihu.com/pins/1973678443074958252\"},{\"slug\":\"2025-11-17-有哪些让人不慎暴露身份的行为\",\"year\":\"2025\",\"title\":\"哪些行为会不慎暴露身份：都是欲望惹的祸\",\"date\":\"2025-11-17\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"都是欲望惹的祸。这些和尚道士，假慈善，把中国的底线都拉没了，把自己的人生也拉没了。为了女人，为了一点钱，没被抓住的话，就是这样虚伪的生活一生吧？抓住了的话，就是这样耻辱的过一生吧？虚伪和耻辱的一生，值得选择吗？\",\"url\":\"https://www.zhihu.com/pins/1973672004298241017\"},{\"slug\":\"2025-11-17-若看懂英伟达-5年前愿意用茅台换\",\"year\":\"2025\",\"title\":\"若看懂英伟达，5年前就该用茅台换：段永平说找不到替代标的\",\"date\":\"2025-11-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"段永平持仓曝光：猛砍英伟达2021年茅台股价达2600-2700元时，曾因“觉得贵”想减持，但最终因“找不到更好的替代标的”选择持有。5年前，他换燕京啤酒的话，现在燕京涨了差不多一倍，茅台跌了一半。我就是白酒换的啤酒不过---五粮液没追上白酒的涨幅。结论：我肯定是错的，别人老段肯定是对的。因为结果他赚钱比我多得多，结果说明他比我厉害！因此他的投资思维方式比我厉害，不能拿他没做好的地方来嘲笑他。\",\"url\":\"https://www.zhihu.com/pins/1973858540151133400\"},{\"slug\":\"2025-11-16-00-后女子花-5000-元买「秒回师」\",\"year\":\"2025\",\"title\":\"00 后女子花 5000 元买「秒回师」服务，秒回真的那么重要吗？反映出年轻人怎样的情感消费需求？\",\"date\":\"2025-11-16\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"月薪9000元，花费5000元来买【秒回师】服务。其实是寻求关注的心理需求，或者是一种恋爱游戏。速度只是表象，而是与事主共振的能力很重要！如果愿意，将来去当秒回师，肯定回赢得很大的生存机会。发财发不了，混个轻松快乐的生活，肯定比去当996牛马容易！假如小明慧去当“秒回师”，我相信她会非常合格的，只是她肯定不愿意去做这种不创造真实价值的事情。当时一些情况，我自己思考我是有点不知道怎么回应的。\",\"url\":\"https://www.zhihu.com/question/1973067347607712810/answer/1973364816925200508\"},{\"slug\":\"2025-11-16-2025.11.15-日记面对这群与清迈\",\"year\":\"2025\",\"title\":\"2025.11.15日记：面对与清迈校区完全不同的外围学生\",\"date\":\"2025-11-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这群学生，都没有上过今日三校，都是外围的学生。的确---在基本信念上完全不同于三校的新教育出来学生。清迈冠军班的主体学生都是三校的学生，外来考上的很少，当然学生就不一样了。各种投机取巧，装乖骗人，当面一套背后一套，不承担责任的情况就很多。学习起来就笨呼呼的，效率差的不是一星半点。明慧把自己原来学习的几分之一的量给她们，都叫苦完不成。所以，你们公主班不适应这些学生，也是正常的，但她们代表社会的常态。\",\"url\":\"https://www.zhihu.com/pins/1973335864391271635\"},{\"slug\":\"2025-11-16-关于在网上遇到杀猪盘的事我曾经说过-新教\",\"year\":\"2025\",\"title\":\"婚恋杀猪盘对局半个月：连499元都没套到的耐心攻防\",\"date\":\"2025-11-16\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这位以婚恋骗人的“女生”，花了半个月来跟贴主套近乎，还有前期的投资套现，最后连499元都没有套到手。两个对手互相的斗了半个月，都超级有耐心。你认为新教育学生，有这情绪喂养的能力吗？别以为你考了1500分了不起，你们当骗子当不会当的！如果跟人聊天，你们学这个骗子，你能聊多久，还能接下去？建议大家看看---一旦你动心了（有了欲望，自恋了。真以为自己是梦中情人了），你就忍不住骗自己了！\",\"url\":\"https://www.zhihu.com/pins/1973432150419337358\"},{\"slug\":\"2025-11-16-广州地标建筑“铜钱大厦”第三次拍卖流拍\",\"year\":\"2025\",\"title\":\"广州铜钱大厦第三次流拍：创造财富不难，守住财富最难\",\"date\":\"2025-11-16\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"资方潮汕富豪已成“老赖”创造财富其实不是很难，想要守住财富，才是最难的！相信这个潮州老板，当年也是创富风云人物。他一直在“进取”，但是，聪明人如道家，会学“急流勇退”。“功成身退”我正在想：34年来的投资，让我成为了几个公司的十大。虽然就是一个小股东，但我也该退了。我希望很快，我就不再是任何公司的十大了！清一公社，会帮我完成这个任务的！\",\"url\":\"https://www.zhihu.com/pins/1973357710440425139\"},{\"slug\":\"2025-11-16-演员张磊吐槽上海一商店文具贵-一款橡皮卖\",\"year\":\"2025\",\"title\":\"一块橡皮卖1999元：消费者价值观会把钱全吐回给资本\",\"date\":\"2025-11-16\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"消费时代，富裕家庭的孩子，被培养了消费价值观的人，都会认账的。其实：只有拥有消费者价值观，你有多少钱，资本都有办法让你彻底吐出来！可是家长们根本不知道这种消费价值观的可怕，还在继续培养孩子做消费者！我有一次培训，一些当老板的家长，居然说：我们还是继续做消费者，这样才能给别人当经营者的机会。非常可笑！\",\"url\":\"https://www.zhihu.com/pins/1973351411656967922\"},{\"slug\":\"2025-11-16-通透了-破案了\",\"year\":\"2025\",\"title\":\"真正的开悟：别做占着马桶不拉屎的折损福报之事\",\"date\":\"2025-11-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"【不要做占着马桶不拉屎的折损福报和机会的行为！】对呀，你们占着女人的位置，就应该为男人生孩子。女人生了孩子，围着孩子转圈圈，生活琐事很多。固然对于提升啥智慧没本质帮助，起码生物基因满足了，女人就不会疯了。活得像动物一样勤奋努力的过一生就是大多数人的选项。比如各种动物，就都神智很正常，开开心心的做自己的动物。就算是猪，也每天开心的吃喝玩乐，不去考虑自己的未来是要献祭卖肉的。\",\"url\":\"https://www.zhihu.com/pins/1973341599485408841\"},{\"slug\":\"2025-11-16-金庸古龙小说中-哪场打斗最为经典\",\"year\":\"2025\",\"title\":\"金庸古龙最经典的打斗：招式绝学不是传武的精粹\",\"date\":\"2025-11-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"这场比武，的确写的很精彩。【旁观者不禁胆战心惊，均想：“我若中了这一招，不免死得惨酷无比。”】不过，这也是武林外行的思维模式。而是“内功”--看不见的功夫，这也不是金庸说的可以像激光弹一样出来的“内功”。就有点像我和弟子们过招，招式平淡无奇，一招云手就让这些冠军们攻不破防线，而我随时可以近身击败他们！力量用得越多，越容易被更快更重的打击到。不过---金庸毕竟没有练武，都是自己想想的武林打法。\",\"url\":\"https://www.zhihu.com/pins/1973407594883351578\"},{\"slug\":\"2025-11-15-人群中-骨子里就坏得人-往往都有这些特征\",\"year\":\"2025\",\"title\":\"识别坏人比识别好人更重要，骨子里坏的人有这些特征\",\"date\":\"2025-11-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"因为好人肯定不会来干坏事。认不认识没关系认不出坏人，就要倒霉了！\",\"url\":\"https://www.zhihu.com/pins/1973124651640185498\"},{\"slug\":\"2025-11-15-你的答谢方式暴露了你的社交段位说几句感谢\",\"year\":\"2025\",\"title\":\"答谢方式暴露社交段位：说谢谢请吃饭只是最普通的一档\",\"date\":\"2025-11-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"不过新教育出来的一些孩子，她们“答谢”的水平更高----因为我优秀，因此值得天下人伺候。我给你一个巴结讨好我的机会！[飙泪笑]​[飙泪笑]​[飙泪笑]​……\",\"url\":\"https://www.zhihu.com/pins/1972925597677270659\"},{\"slug\":\"2025-11-15-清一公社-家长应该留什么财富给孩子\",\"year\":\"2025\",\"title\":\"清一公社：家长应该留什么财富给孩子？\",\"date\":\"2025-11-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"查理芒格曾经被一位富有的朋友问到：把一大笔钱留给孩子，会毁掉他们的干劲和抱负吗？“当然会”芒格说“但是还是得留给他们”“为什么？这个问题，对很多富人，也存在一样的思考，我们这一生创造的财富，该怎样留给后人？如果我向我一直宣称的样子，不把我的财富给我的孩子，他们会怨恨我吗？但不爱我的孩子，我给不给钱，应该都不会“更爱我”。那么，把我的财富，全部都分给他们，一人一份，他们会更爱我吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/1973058203962056996\"},{\"slug\":\"2025-11-14-“任何一个你不喜欢又离不开的地方-任何一\",\"year\":\"2025\",\"title\":\"不喜欢又离不开的地方就是监狱，清一公社提供解法\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"”—弗兰克.德拉邦特《肖申克的救赎》如果用这个标准来看，大多数人都活在监狱中！一个你不喜欢又离不开的职业，工作岗位。一个你无法摆脱的生活和关系！都是你的监狱！清一公社，为此提供了最有可能解决的方案！\",\"url\":\"https://www.zhihu.com/pins/1972457628056687314\"},{\"slug\":\"2025-11-14-三年拿世界冠军-是吹牛\",\"year\":\"2025\",\"title\":\"三年拿世界冠军是吹牛还是科学规划：2025年已经兑现\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"三年前，2022年写的文章，当时刚刚开启泰国的泰拳战事。现在是2025年8月10日，已经拿到泰拳世界冠军。2026年，将会有更多的世界冠军出现。目前团队已经拿到28块全国泰拳，自由搏击锦标赛金牌。2026年，就会成为中国的第一格斗俱乐部了（参赛人数和拿锦标赛金牌的数量）。回过头来看三年前这些评论的话，当年多少人不屑一顾的。说到就做到，看起来很难，其实很简单：对自己诚实就行了！\",\"url\":\"https://www.zhihu.com/pins/1972698519757419794\"},{\"slug\":\"2025-11-14-当下互联网是如何如此乌烟瘴气乱七八糟的\",\"year\":\"2025\",\"title\":\"互联网为何乌烟瘴气：背叛朋友往上爬的人成了打工者榜样\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"中国人的乖戾之气好重。这个背叛朋友，不顾一切往上爬的人，居然现在成了打工者的榜样。可知一旦社会失去控制，会变成怎么样？\",\"url\":\"https://www.zhihu.com/pins/1972587699924893811\"},{\"slug\":\"2025-11-14-空姐的衣服-终于换了终于承认-女人穿高跟\",\"year\":\"2025\",\"title\":\"空姐终于换掉高跟鞋：刘老师放弃职业装后再也回不去\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"刘老师跟我在一起之后，彻底放弃了高跟鞋和职业装。现在再也回不去了！这次在昆明，她穿的是19年前认识我的时候，买的李宁运动服。我们如果连穿衣自由都没有，还说啥现代人！\",\"url\":\"https://www.zhihu.com/pins/1972739121404474137\"},{\"slug\":\"2025-11-14-赵薇当年为什么会嫁给黄有龙\",\"year\":\"2025\",\"title\":\"赵薇为什么嫁给黄有龙：漂亮女人注定是权力金钱的装饰品\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"是真爱吗？这段婚姻算不算毁了她？不知道是诈骗的水平高，还是傻子太多，骗子不够用了。赵薇嫁人---是真爱？漂亮的女人，还是知名的女人，是不可能“拥有真爱”的。她们几乎唯一的命运，就是成为权力和金钱的装饰品。所以，女人越漂亮，越无法拥有自我。男人也一样：越有钱，越有名，越无法拥有自我！更无法拥有自由。女人相貌，看上去不讨嫌就行了。男人的钱，够用了行了。多余的部分，都是惹祸的。\",\"url\":\"https://www.zhihu.com/pins/1972688003840372773\"},{\"slug\":\"2025-11-14-金庸作品中有哪些搞笑的段子\",\"year\":\"2025\",\"title\":\"金庸星宿派三大功夫：其实是体制内生存的必要功夫\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"作家有理想主义和现实主义两大派。我们生活在现实中，但却接受不了现实主义！现在连理想主义就接收不了了，只能接受幻想主义了。其实，金庸写的这个段子，不是搞笑，而是星宿派的三大功夫，应该是中国体制内生存的必要功夫。金庸应该是中国版的普佐，作品出名后，有机会接触电影界各类大神。以及上流社会交往也多，他最后的作品【韦小宝】也充满了人性的刺痛。与他刚刚入门写的第一部作品对人性的积极乐观相比，完全是天上地下。\",\"url\":\"https://www.zhihu.com/pins/1972595966839359416\"},{\"slug\":\"2025-11-14-陕西首富-宣告破产\",\"year\":\"2025\",\"title\":\"陕西首富宣告破产：财富没有消失，只是被重新分配\",\"date\":\"2025-11-14\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"但几年后，改革开放以来耗尽毕生心血，赚到的几百亿资产，全部灰飞烟灭了。其实他创造的财富没有消失，只是被重新分配了。市场，对手，银行，债权人，分食了他创造几十年的财富。不要想多赚钱，守住自己的本来，降低杠杆，他就赢了一生！不要为自己肯定用不着的钱（融资），去牺牲掉自己需要的本金。当市场崩溃的时候，银行不会来照顾你，只会冷酷地在最低谷，平仓你的资产来还债。你就把一切财富全都交给了银行和市场的博弈。\",\"url\":\"https://www.zhihu.com/pins/1972702403947144250\"},{\"slug\":\"2025-11-13-如何评价通背拳大师鸽武缘公开道歉-并谴责\",\"year\":\"2025\",\"title\":\"如何评价通背拳大师鸽武缘公开道歉，并谴责扇耳光比赛暴力？\",\"date\":\"2025-11-13\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"我觉得，鸽武缘挺倒霉的---或者是说----当别人的师父，真的很倒霉。而且---鸽武缘不会打耳光比赛，因此他的传武就是假的！通背拳传人去打耳光没有赢，所以传武就是骗子！根据我的观点，用通背拳去打格斗，有很大的机会赢得比赛的！通背的格斗原则，核心其实是走偏门，不走中路。这样的身法步法手法合一的话，对手再有本事，力量，也使不出来的！国内原来有功力比赛，一拳劈碎一块砖，几块砖。\",\"url\":\"https://www.zhihu.com/question/1971754885167965487/answer/1972345693734679499\"},{\"slug\":\"2025-11-13-如果你做任何工作-都有人给你发一份工资\",\"year\":\"2025\",\"title\":\"做任何工作都有人发工资不考核绩效，你会怎样安排生活\",\"date\":\"2025-11-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"底层人的生活，描写最好的人，应该是诺奖的作者莫言，是【活著】的作者余华。描写上层社会的心思和生活，是教父的作者马里奥普佐。英子当作家，就只能去写城市中产小资了吧？旅游博主，对这些人的心理掌握应该还是可以的！所以，英子当作家，就只能当一个没有多少读者的作家了。教一群孩子去学会生活，会去爱，去恨，去感受世界，总比做一个机器一样的中产小资要好！曾经还有人关注这些苦难题材，现在---都没有人去关注他们了！\",\"url\":\"https://www.zhihu.com/pins/1972390111061739217\"},{\"slug\":\"2025-11-13-当年在西南某省和当地朋友喝酒吹逼喝着喝着\",\"year\":\"2025\",\"title\":\"本地啤酒为何卖得最好：区域老总放话见对手业务员就打\",\"date\":\"2025-11-13\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"我猜：便宜？他不断摇头，最后揭晓谜底：这家的区域老总流弊给下面的业务员放话，出去推销看到其他品牌的业务员就打，被抓了公司捞人，受伤了公司出钱，你只管打就完事儿了。其他品牌实在是干不过，只好滚蛋。作者：维斯特帕列链接：。商业转载请联系作者获得授权，非商业转载请注明出处。\",\"url\":\"https://www.zhihu.com/pins/1972095954300670207\"},{\"slug\":\"2025-11-12-卖出了90万股燕京\",\"year\":\"2025\",\"title\":\"卖出90万股燕京换珠江：3.14元差价值得动心换股\",\"date\":\"2025-11-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"均价9.61元（最低买入价9.58元）两股差价3.14元，足以让我动心换股了。上次珠江冲12元，我也卖出了相当部分珠江的筹码，换了燕京和惠泉。记得珠江当时的卖出很困难，盘面上买卖都很少，现在下跌了，买卖都多了一点。本次燕京跌到11元多，再度加仓买入了一堆。感谢市场先生，现在让我用负成本持有上千万股燕京，燕京的激烈波动，让我的买入卖出行为得到了比持仓不动更好的回报。他至少账面利润已经超过3亿了。\",\"url\":\"https://www.zhihu.com/pins/1971960390175946036\"},{\"slug\":\"2025-11-12-恒大“最大债主”-被许家印坑惨了……大多\",\"year\":\"2025\",\"title\":\"恒大最大债主被坑惨：小狼被大狼吃，商界就是残酷二字\",\"date\":\"2025-11-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我猜想：这几年，肯定大量南通三建这样的企业垮掉。可惜了这些改革开放40年来积累的财富，就在短短的几年之间，由于趋势判断的错误而毁掉了！我很幸运还从恒大身上赚到了一千多万，从融创上也赚了好几百万。中国的地产我拿到了利润，学小狐狸捞到一块肉就跑掉了。假如我赚钱后深情款款的相依相随到今天，我亏死了。当年因为在雪球上提醒40元的融创有风险，拉黑我的小兵009今何在？如果没有及时止损，几十年的积累也荡尽了。\",\"url\":\"https://www.zhihu.com/pins/1971969503253472033\"},{\"slug\":\"2025-11-12-清一公社-让社员都拥有自由-稳定和体面的\",\"year\":\"2025\",\"title\":\"清一公社：让社员都拥有自由，稳定和体面的工作\",\"date\":\"2025-11-12\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"连自己的老同学，都觉得我没有单位，做自由人，被“开除”了很惨。所以：清一公社，不仅仅需要会为所有的社员受益人提供一份稳定的收入，我们按照全国最高标准起步工资的城市---上海，作为起薪的发放标准。但为了社员拥有职业的尊严，我们还会同时为这些社员受益人们，提供一份正式的，体面的白领工作职位。不同的是---清一公社的社员指定的受益人，可以享受在义塾大学自由学习的条件，还可以得到义塾大学的各位教学和职位！\",\"url\":\"http://zhuanlan.zhihu.com/p/1971868966940042018\"},{\"slug\":\"2025-11-11-我不带手机-不带电脑-断网消失了两天\",\"year\":\"2025\",\"title\":\"断网两天世界没崩溃：谭木兰首回合KO，黄武士次回合KO\",\"date\":\"2025-11-11\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"回来发现世界并没有因为我没有关注它而崩溃[魔性笑]​。昨晚谭木兰在清迈赛场上，第一回合就KO了对手，估计她自己都没有反应过来对手就倒下了。黄武士昨晚在第二回合KO了对手，看起来很壮很高的一个对手，场上黄武士的表现很冷静。我看视频上，对手完全无法发挥实力，完全不懂得如何应对我们的奇怪打法，一直在挨打，拼命还击总是打空。不过泰拳手挨打这么多次，最终才倒下，也算是一条好汉了。\",\"url\":\"https://www.zhihu.com/pins/1971598298684036908\"},{\"slug\":\"2025-11-11-英子-的想法没有人就应该对你好\",\"year\":\"2025\",\"title\":\"没有人就应该对你好：猪才把主人的豢养当成理所当然\",\"date\":\"2025-11-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"只有猪，才认为主人对她的豢养，是理所当然的吧？​​​[捂脸]​​​[捂脸]​​​连狗都不会这样自恋的。因为狗至少知道用摇尾巴来表达对主人豢养的谢意。即使摇尾巴对主人来说---没有实质上的意义。不过猪还真的能够为主人提供实质上的价值---一堆猪肉。因此主人也能接受猪的不懂礼貌[大笑]​​​[大笑]​​​[大笑]​​​狗也许知道---自己不想来奉献肉，就奉献自己的忠诚和摇尾巴吧。\",\"url\":\"https://www.zhihu.com/pins/1971606931975168627\"},{\"slug\":\"2025-11-09-人的行为要有目的一个收入很低的人-能装大\",\"year\":\"2025\",\"title\":\"低收入女孩装富家小姐：模仿富人生活方式并无真实目的\",\"date\":\"2025-11-09\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"这个农民工的女孩，装的这个身份，倒是很像富家小姐的样子。其实就是跟富家子弟谈过恋爱？被用过了，就以为自己也是富人小姐了？模仿富人子弟追她时候的生活方式就回到富人身份了？真是笑话！她去职场这样玩，有啥真实的目的吗？吊金龟婿？难道有钱人，就喜欢这样的女孩吗？会过日子的穷人，更是自觉回避！挺像清黑的样子---装一副高高在上的样子，却啥都不能落地。见光死。\",\"url\":\"https://www.zhihu.com/pins/1970814076629284111\"},{\"slug\":\"2025-11-09-张清一股市案例分析-主力操盘的周期有多\",\"year\":\"2025\",\"title\":\"张清一股市案例分析--主力操盘的周期有多长。\",\"date\":\"2025-11-09\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我正好有个朋友8元的时候买入新希望，后一路上升，到了40元。不过古怪的是：新希望的利润跌得一塌糊涂，多年不分配利润了。1.股价从5块多一路涨到33的过程中，压根就没有散户入场，反而是散户不断卖出（股东人数减少）2.从33回调到27的过程中，第一波散户入场。3.从27再一路涨到40的过程中散户都没有入场。我的理解：1：主力操盘的周期，已经拉长到了10年的周期了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1970802561066959514\"},{\"slug\":\"2025-11-09-张清一-金融专业人员的投资水平也就792\",\"year\":\"2025\",\"title\":\"张清一：金融专业人员的投资水平也就7926选4？\",\"date\":\"2025-11-09\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"这些专员人，天天研究市场和金融，每天操心就是怎样买到最有潜力的股票！看起来比大猩猩随意投飞镖的概率，也高不到哪里去！市面上，股票基金+混合基金一共7926只。2020年，一共有2967只基金跑赢了沪深300指数。但连续10年，都跑赢沪深300指数的基金，总共只有4家！博时主题行业，作为其中两个主动性基金（其他两个是被动基金），她连续10年，每年都能跑赢沪深300指数。\",\"url\":\"http://zhuanlan.zhihu.com/p/1970815654249629060\"},{\"slug\":\"2025-11-09-资产1000万算不算中产\",\"year\":\"2025\",\"title\":\"资产1000万算不算中产？\",\"date\":\"2025-11-09\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"这个不好说：中产不中产，富裕不富裕，不看你拥有的资产数字，而是看你的脑子好用不好用！一千万资产，可能会活得像是穷人一样窘迫。如果这一千万资产，就是深圳的一套房子的价值，别的就没有闲钱了。那么，他每个月光支付水电费，物管费，生活费，都是一个负担。每年可以拿到的“年薪”大概就是50万元！而且还是甩手掌柜，不用操心管理，可以成天玩。如果这笔钱拿来在昆明生活，可以说完全可以活成资本家的模样！\",\"url\":\"https://www.zhihu.com/question/1907609057084311436/answer/1970826559020576975\"},{\"slug\":\"2025-11-08-中国证券业协会数据显示-2025-年前八\",\"year\":\"2025\",\"title\":\"2025年前八个月81%散户亏损，10万以下小散亏损率98.7%\",\"date\":\"2025-11-08\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"中国证券业协会数据显示，2025年前八个月81%的散户亏损，人均亏损2.1万元；10万元以下小散亏损比例高达98.7%。与之对比，能实现正收益的散户仅占19%，其中年化收益率超过15%的不足5%，凸显高手稀缺性。在2025年的A股市场，能实现年化30%以上收益的投资者不足0.5%。我看了其中一个账户，今年的收益率是57%。我纳闷：今年这种牛市，这么多人还亏钱。\",\"url\":\"https://www.zhihu.com/pins/1970632579750299266\"},{\"slug\":\"2025-11-07-40岁以上中年人失业都干嘛去了\",\"year\":\"2025\",\"title\":\"40岁以上失业都干啥去了：没有事业的男人就没有生命光彩\",\"date\":\"2025-11-07\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"所以今年以来，看到银行的个人存款大幅上升。我看银行都拉客户存款都没啥积极性了，存款利率都低到一年期低于1%了。先为自己弄一份保证不会焦虑的收入，然后一生就放心了。其实这份要求实现的门槛很低，只需要100万就够了。但是：如果你上了资本家的当，去买买买的，房子车子啥的，你就被绑定了。只能毫无尊严的去消耗生命，去为自己的消费行为买单！真不如拿一份稳定靠得住的收入，去做自己喜欢做的事情更靠谱！\",\"url\":\"https://www.zhihu.com/question/613586729/answer/1970272022505453117\"},{\"slug\":\"2025-11-07-好事情-中国文化力量正在崛起中联合国教科\",\"year\":\"2025\",\"title\":\"联合国教科文组织通过决议：每年3月21日为国际太极拳日\",\"date\":\"2025-11-07\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"好事情：中国文化力量正在崛起中联合国教科文组织第43届大会通过决议，宣布每年3月21日为“国际太极拳日”太极拳作为一种古老的体育运动和非物质文化遗产，对于提升人类健康福祉、促进社会包容和性别平等、推动交流互鉴以及助力和平建设具有积极作用。有意思---居然强调性别平等。我们木兰可以用女子冠军击败男子冠军的比赛，来体现“性别平等”。一定会让全世界大开眼界的！\",\"url\":\"https://www.zhihu.com/pins/1970080550317450785\"},{\"slug\":\"2025-11-07-清一公社-从美国现状看资本主义的根本逻辑\",\"year\":\"2025\",\"title\":\"清一公社：从美国现状看资本主义的根本逻辑\",\"date\":\"2025-11-07\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"我认为资本主义的基本逻辑，就是要用尽办法，去剥夺民众（劳动者）的全部资源，去创造利润！因此：一：资本主导下，没有真正的教育。美国教育崩溃的核心原因，其实就是资本追逐利润导致的结果。在上一轮的制造业的产业转移过程中，资本放弃了去培养美国的知识工人。因此，转移出去的资本，不再培养美国的工人阶级。大肆流行的消费主义，物质主义的基础教育价值观，摧毁了美国的下一代。因为未来的职场上升根本就没有真正的指望。\",\"url\":\"http://zhuanlan.zhihu.com/p/1970062008180278998\"},{\"slug\":\"2025-11-06-清一公社-跟世界权贵利益集团玩你没有胜算\",\"year\":\"2025\",\"title\":\"清一公社：跟世界权贵利益集团玩你没有胜算！\",\"date\":\"2025-11-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"英美权贵们，用教育，食品，医疗，以及金融四大手段，加上消费主义的媒体灌输，思想控制，牢牢地锁定了大群的牛羊们，终身成为他们的炮灰和羔羊！而少数的特权阶级，他们可以直通自己的目的地！特权阶级，比如金融大鳄，完全可以利用规则，来控制世界的一切，控制经济以及一切，甚至利用涨跌，来为自己谋利。医疗利益集团最恐怖的手段，是可以借用一个根本就治不好病的“医院”，其实是抢钱一样的，把老百姓的一生继续抢光！\",\"url\":\"http://zhuanlan.zhihu.com/p/1969428854675318539\"},{\"slug\":\"2025-11-06-真的是笨蛋没活路\",\"year\":\"2025\",\"title\":\"万科恒大接连暴雷：高管掏空企业，笨蛋真的没活路\",\"date\":\"2025-11-06\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"万科是2008年我度过熊市的股票，赚了一些钱的，我还是很有感情的！恒大也是我赚了几百万的，这两只股票，居然全都暴雷了？万科这么好的名声，居然也出事了：核心是高管们掏空企业，掏空合作方，掏空自己的员工。这家公司的员工，以及乙方，合作方，肯定超级难受。例如烟台项目销售额70亿，其中50亿被万科总部划走，并转贷给合作方，也就是“用合作方的钱，贷给合作方”。2024年4月，烟台合作方就曾举报万科高管团队。\",\"url\":\"https://www.zhihu.com/pins/1969813680301510902\"},{\"slug\":\"2025-11-05-今天跟公主班和武道馆的孩子们公主聊完了\",\"year\":\"2025\",\"title\":\"提醒公主班女孩：最漂亮的时刻就是最危险的时刻\",\"date\":\"2025-11-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"今天对她们提醒的是一个女孩子，有可能专心提高颜值，成为了全世界最漂亮的女人她如果以为：作为最漂亮的女人。得到全世界的欢呼，这样的女人就太蠢了！但她却不知道：最漂亮的时刻，就是她最危险的时刻！她成为最漂亮女人的时刻，就是她最危险的时刻。清一系正在成为教育界，武术界的超级大美女。希望我们懂得保护自己，不要成为恶霸们的玩物和工具。否则------我们就是在饿狼的草原上裸奔的羊群！\",\"url\":\"https://www.zhihu.com/pins/1969198550232573568\"},{\"slug\":\"2025-11-05-就缺一场甲午海战\",\"year\":\"2025\",\"title\":\"就缺一场甲午海战：美国16—19岁吸毒比例高达36%\",\"date\":\"2025-11-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"把美国原型打出来了。中国家长干嘛不看看这个数据后再把孩子送去美国上学？美国为什么不大力禁毒？16-17岁群体中吸毒比例达到了28%，18-19岁的群体里，占比更是达到了惊人的36%美国招收士兵要求不吸毒，找到合格兵员的难度都很高。这样的国家，你去干啥？\",\"url\":\"https://www.zhihu.com/pins/1969485545655735044\"},{\"slug\":\"2025-11-05-平台不同-结果不同\",\"year\":\"2025\",\"title\":\"平台决定结果：学外语走出去的女孩被卢森堡大公赐百万美元\",\"date\":\"2025-11-05\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"她如果不学外语，留在国内卷的话，大概就是体制内一个苦巴巴的基层小球教练员吧？自己把自己玩成国礼的女孩。降维打击到底有多恐怖？【卢森堡前国主亨利大公为表彰她的贡献将100万美元和700平米土地永久赐予她】。工资收入和社会地位，都远非中国国内能比的！相对的指标也一样：泰拳世界冠军在国外不稀奇，但在中国相当稀奇。在中国成为格斗女王，就是公主一样的待遇了。可惜---有人认为跟随体制更好。\",\"url\":\"https://www.zhihu.com/pins/1969493512144806099\"},{\"slug\":\"2025-11-05-未来留学-今日三校才是标杆\",\"year\":\"2025\",\"title\":\"留学值不值：公立国际部开始崩盘，今日三校才是标杆\",\"date\":\"2025-11-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"【网上关于留学值不值的吐槽也越来越多：“我花了300万让孩子读国际部+国外本科，最后回国找工作，和国内普通毕业的学生差不多，起薪也就6000出头。如果留在国外无望，这几百万投下去，回报率低得可怜！”】不过这篇文章，揭示了原来浪潮下国际留学的种种泡沫正在退潮。但依然没有把握核心点：未来留学，小语种才是未来。不仅仅留学费用高，而且当地很难留下来找工作---除非你真的是第一流的优等生。\",\"url\":\"https://www.zhihu.com/pins/1969361772797493830\"},{\"slug\":\"2025-11-05-清一公社-一生三-三生万物的“自助社保基\",\"year\":\"2025\",\"title\":\"清一公社：一生三，三生万物的“自助社保基金”\",\"date\":\"2025-11-05\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"如果一个小孩，作为您的清一公社的基金受益人，18岁就开始领取基金的话，理论上，他可以领取60年（中国的平均寿命是78岁）而社保基金，你30年之后才能领取。三：全世界独一无二的【一生三，三生万物】的社保基金！为了让清一公社的“自助社保基金”代代相传，也为了清一公社的社区繁荣发展，将来的清一小社员“生生不息”，我计划基金开启运行20年后，就开始发放”生育奖励“份额了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1969304419251234572\"},{\"slug\":\"2025-11-04-到底是国际大牌子\",\"year\":\"2025\",\"title\":\"耐克公关值得学：男孩晒假耐克包，官方寄来两个大箱子\",\"date\":\"2025-11-04\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这个公关真不错正好我离开昆明前，买了两双耐克鞋街头买的，不是专卖店。自媒体的效果，真牛。我们好好学学别人的长处！男孩晒妈妈缝的假耐克包后续：耐克寄来两个大箱子，打开看哭网友……\",\"url\":\"https://www.zhihu.com/pins/1969191286289469553\"},{\"slug\":\"2025-11-03-中产作死的行为有哪些\",\"year\":\"2025\",\"title\":\"中产作死的行为有哪些？\",\"date\":\"2025-11-03\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一个月的学费就要10万元？这国际学校的高档次，我们怎么才能赶上呀！如果花的钱越多，就越有档次的话，清一大学能拿世界冠军的武道专业，还免费供养的学生，肯定就就没档次了。看到了这个问题的网友回复【房东两口子一见面，张口就是满满的优越感，说自己的娃儿上国际学校、一个孩子一个月十万多学费巴拉巴拉...知友说三亚真的有这样的学校，一个月十万，贵的原因是额外教马术、高尔夫...】……\",\"url\":\"https://www.zhihu.com/question/605245415/answer/1968630928797573231\"},{\"slug\":\"2025-11-03-刚刚回到清迈的家了\",\"year\":\"2025\",\"title\":\"从昆明8度飞回清迈28度：学生等着上课，家长等着咨询\",\"date\":\"2025-11-03\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"离开昆明前，穿的是棉衣、落地后就赶快脱衣服，只剩一个短袖。气温从8度到28度。同一个地球，飞了1.6个小时，气候的区别真大！路上问了来接我们的宋老师，说我不在清迈期间，孩子们的状态很好。都很努力上进。回来了，马上有很多事情，学生等著上课，家长也等著咨询。今天先休息好再说了！\",\"url\":\"https://www.zhihu.com/pins/1968827304680596941\"},{\"slug\":\"2025-11-03-只要你是羊\",\"year\":\"2025\",\"title\":\"只要你是羊，长多大都是被吃的命：一家五口被骗上千万\",\"date\":\"2025-11-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"一家五口自杀后续：4封遗书爆死因，一个月被骗上千万，熟人做局这种故事太多了，一点蝇头小利就上当的小屁民。尽管我最近一年账户收入57%，涨幅可观。我也一直在想：我是肥羊吗？（他惹麻烦，就是他成长太快了，捞的太肥了）。一方面，要小心翼翼的不要惹上狼群一方面，也别长太肥了。每天光顾吃吃吃，不知道最终的命运，就是长肥了就该上路了​[尴尬]​​[尴尬]​​[尴尬]​​猪越努力，就越早死！\",\"url\":\"https://www.zhihu.com/pins/1968624100550378058\"},{\"slug\":\"2025-11-03-怎么看通背拳传人赵鸿刚参加扇耳光大赛\",\"year\":\"2025\",\"title\":\"怎么看通背拳传人赵鸿刚参加扇耳光大赛?\",\"date\":\"2025-11-03\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"传武的精髓，根本就不是互相去拼伤害，拼交换。而是怎样让对手打不上自己的同时，打对方！因此真正的传武，绝不是西方格斗这种互相拼伤害的打法，就是尽量让对方无法发挥！但你用内家原则去贴身近战，制人克人，的确相当的好用。因此内家拳特别强调“后发制人”，在防住对方进攻的同时攻击对方！因此贴身缠斗，才是内家拳的精髓，而不是外家拳你一腿，我一拳的交换伤害。这个传人赵洪刚，只会用传武功夫去参加扇耳光大赛？\",\"url\":\"https://www.zhihu.com/question/1967777140054426085/answer/1968635619535192854\"},{\"slug\":\"2025-11-01-张清一-可以轻松活着-何必去地狱级社招卷\",\"year\":\"2025\",\"title\":\"张清一：可以轻松活着，何必去地狱级社招卷死自己？\",\"date\":\"2025-11-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"家长们，真的不要让孩子去国内体制，读书考试卷工作了，真要卷死自己的。这几天，我们去几家著名的头部银行，谈公社基金设立的法律问题时候，正好遇到校招的学生来应聘面试，据说是已经过了两关（审核和书面考试），这是第三关。比如副行长为了供自己的孩子上学，至少要花两三百万的学费和生活费。所以好单位的校招，根本不理睬文科毕业生。当然，最可怜的是穷人的孩子，真缺这两三千元的工资生活费的话，就真的活在绝望地狱了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1967859669268668632\"},{\"slug\":\"2025-11-01-看了这个信息-我有个创意\",\"year\":\"2025\",\"title\":\"学渣富二代降阶考编：三本表妹花几万培训卷编制的荒诞\",\"date\":\"2025-11-01\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"明明是学渣，也证实了就考不上公务员，为什么还要年年考～次次考、花那么些培训费？小姑说，有正式编制的工作才有更好的男生家来说媒，快三十了，解决工作问题才能嫁的好点，我无言以对。这个的确是很多有钱人家的孩子，也一定要花钱去弄个身份的核心原因。我的创意就是：公社月红，说成是直接发款给本人，有点不劳而获的味道，而且受益人没有身份地位。然后：我们的孩子，就有一个体面的工作，一份稳定的薪水。\",\"url\":\"https://www.zhihu.com/pins/1968020783738647351\"},{\"slug\":\"2025-10-31-lxdong的回答我建议你们-当你有千万\",\"year\":\"2025\",\"title\":\"千万身价先买保底月红保单：资产权益人须变更到孩子名下\",\"date\":\"2025-10-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"lxdong的回答我建议你们，当你有千万身价的时候，先买一份（保底清一公社）的社员月红保单，你再去拼的商海，成功了你是亿万资产，值得追求。失败了，你也是衣食无忧。不过：把资产权益人变更成自己的孩子吧。别放在自己名下，不然-----法院的追责，你本人作为债务人，就会击穿你的最后底线。我相信：有了这个底线，很多人就不用过于担心未来了。你就不至于去过这种悲哀的中年男人的生活了！\",\"url\":\"https://www.zhihu.com/pins/1967640100696487335\"},{\"slug\":\"2025-10-31-今晚泰国清迈举办万圣节泰拳金腰带争夺战\",\"year\":\"2025\",\"title\":\"清迈万圣节金腰带争夺战：木兰陆鸽与清一武道男拳手同场出击\",\"date\":\"2025-10-31\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"木兰陆鸽的对手，看起来比陆鸽更高，更壮呢。现在清迈的比赛，泰国方都只有最强的人，才敢出来比赛了。最近一周，谭木兰和佳慧都在第二局，第三局KO了对手。今晚陆鸽出来，不知道会送给泰国的万圣节洋人了什么样的中华礼物了[憨笑]清一武道的男拳手今晚也是安排了金腰带比赛。我们在泰国的好处，就是有很好的实战比赛机会，这样练出来的人，去世界赛场上，才会更熟悉对手的做派。泰国职业赛场上熬炼出来的中国文人格斗拳手……\",\"url\":\"https://www.zhihu.com/pins/1967542928353235431\"},{\"slug\":\"2025-10-31-如果让你放弃现在的所有回到20年前你愿意\",\"year\":\"2025\",\"title\":\"放弃一切回到20年前？中国已从普涨上行进入分化周期\",\"date\":\"2025-10-31\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"这个文章里面，展现了中国在上行周期的一些场景。昨天去银行办事，大批的应试毕业生（985以上才有机会），去竞争2000-3000元的银行柜员职位。据说：连银行副行长的女儿，上了TOP50大学的人，都没有资格入选。但未来的女人将更加的卑微---因为大量的女性，只有靠婚姻才能维持自己的生存了。不过---这个难题将在20年之后改变---2045，中国年轻人口极度匮乏的时代到来。\",\"url\":\"https://www.zhihu.com/pins/1967522477430244105\"},{\"slug\":\"2025-10-31-水无尘的回答一个真正的极简主义者是怎样的\",\"year\":\"2025\",\"title\":\"极简主义加拿大小伙：给他一份生活保证，让他不必为五斗米折腰\",\"date\":\"2025-10-31\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"这个故事里面的加拿大小伙子，就是我们希望的支持的对象：给他一份生活的保证，让他可以真诚的做人，做事。去真诚的追求和度过自己的人生，去过自己喜欢的生活。如果只是养猪一样过完一生，其实我们会觉得很遗憾，有点浪费了！也许会让父母思考：你希望给孩子从小教育的是什么？去学什么东西，都是她生命最重要的东西？清一公社给你的，其实是一份无价之宝，不是简单的财富的增值保值这么简单的！\",\"url\":\"https://www.zhihu.com/pins/1967737596303082975\"},{\"slug\":\"2025-10-29-昨天铜陵有色跌停-吓死一堆人了\",\"year\":\"2025\",\"title\":\"铜陵有色跌停日我逆势买入130万股，两天赚回30万\",\"date\":\"2025-10-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"但别人恐惧我不恐惧，我大胆买入了130多万股（今天看的成交结果）。可惜昨天我坐车，因此我不看盘。账户上我昨天损失的回来了一半。不过：铜陵有色今天没有跌，而是涨了5%多一点。因此，我昨天的操作，赚了30多万元。昨天的大跌，今天的大涨。铜未来的大涨，已经是必然的趋势，我就坐等好了。更有冲击力的是江西铜业---今天居然快涨停了。只是有点奇怪的是：中国中冶H，以及江铜H，今天居然大跌？\",\"url\":\"https://www.zhihu.com/pins/1966999290745447776\"},{\"slug\":\"2025-10-28-15-岁妹妹说“真爱比考上-985-重要\",\"year\":\"2025\",\"title\":\"15 岁妹妹说“真爱比考上 985 重要”，该支持她还是骂醒她？\",\"date\":\"2025-10-28\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"可是：你见过身边有谁是“真爱”的榜样吗？你总不至于认为你一定将来比周围你认识的所有人的运气都更好吧？我15岁，20岁的时候，身边的夫妻的榜样，没有一个是我想要的婚姻。虽然他们过的日子还不错---也就是过日子罢了。虽然，我现在的婚姻，是下一代很多人的“榜样模范”，但我总是说：这是可遇而不可求的！所以，与其15岁就去幻想“真爱”，要去掌控这种难度比上985，甚至比考清北都难得多的事情，我看玄乎！\",\"url\":\"https://www.zhihu.com/question/1948477600931508536/answer/1966631311977473375\"},{\"slug\":\"2025-10-28-今天我的账户可赔惨了-8位数的亏损\",\"year\":\"2025\",\"title\":\"账户赔惨亏8位数：趁跌买入百万股铜陵有色，同价换股很划算\",\"date\":\"2025-10-28\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"不过我今天在比跌停价多一两分的价格，买入了一百多万股铜陵有色。主要是上次白银有色连续涨停的时候，我抛出了一两百万股。当时我就想：如果同价，能够换到铜陵，我就很划算了。如果同价能换到，我觉得就赚了。今天既然给了这个价格，铜陵莫名其妙的跌停？总喜欢买一点进来，即使我认为明天还会跌。比如我就认为：明天铜陵跌破5元，是大概率的事情！但不排除我今天还是愿意用5.28的价格挂单买入它一百多万股。\",\"url\":\"https://www.zhihu.com/pins/1966633701120152773\"},{\"slug\":\"2025-10-28-昨晚是谭木兰成都赛事后的首战\",\"year\":\"2025\",\"title\":\"谭木兰成都赛后首战泰国职业赛：求胜心太重反误事\",\"date\":\"2025-10-28\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这是她自从当刘晓慧陪练以后，第一次上场，在泰国打职业比赛。对手是清迈一流拳手，谭在赛前备赛很认真，因为想要取得良好的结果！我对谭木兰唯一的担心，就是她有时候会求胜心太重，导致结果不佳！昨天白天，我赛前对谭木兰的辅导，根本就不谈技术（该如何练，她早就知道了）。你在自由搏击锦标赛上也见到了王静恩的打法了。今早，我看到了武医学院昨晚打完后的回报：【今晚比赛谭琛怡第二回合KO胜💪’看样子，是压倒性的取胜。\",\"url\":\"https://www.zhihu.com/pins/1966436806816932456\"},{\"slug\":\"2025-10-27-什么是福-什么是祸-美味大餐给你带来了什\",\"year\":\"2025\",\"title\":\"什么是福，什么是祸？美味大餐给你带来了什么结果？\",\"date\":\"2025-10-27\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"上面是我的一个学生发给我的信息，她的同学的社交账户上的信息。因为她突然发现自己已经意外地成为千万富姐了。她说：老师当初我听了你在网上说了一句话“未来农行会很不错”，然后我就买农行，到现在我的农行成本都只有一块多，现在股价已经超过八块了。因为银行涨了这么多，未来涨幅不会太大了。那么，你认为是不是这个千万富姐姐，赚了大钱，就跑去游轮玩，去吃大餐了？现在，比较了这两种结果，你们还去追邮轮大餐吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/1966198609369335259\"},{\"slug\":\"2025-10-27-查理芒格早就说过一个真相-人这辈子只要做\",\"year\":\"2025\",\"title\":\"芒格：有效的事重复做，无效的事避开——我正是如此\",\"date\":\"2025-10-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"第二，如果你一旦发现什么事情，对于你而言是无效的，避开它！比如：有不错的学生，教她就有，我就继续教。遇到教了没用的学生，总是一副笨样子的学生，我就不教了！尊重我的学生，我就多教不尊重我的学生，我就不理了。怀疑和质疑，挑剔我，反对我的人，我理他们干什么？本来已经拥有了好的结果，走下去她们会成为国礼。真认为自己有本事，干嘛不去自己做一套东西出来？这不就是对自己无效的东西，坚持拿住不放吗？\",\"url\":\"https://www.zhihu.com/pins/1966270234831873296\"},{\"slug\":\"2025-10-27-清一公社-稳定发月红会不会让子孙后代躺平\",\"year\":\"2025\",\"title\":\"清一公社：稳定发月红会不会让子孙后代躺平摆烂？\",\"date\":\"2025-10-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"让我们的子孙后代，有机会把所有的生命和精力，都用于提升自己，去拥抱自己的理想。但我最怕的事情：就是我的孩子，完全可以拿着这笔月红去躺平一生！万一我的孩子不成器，因为这笔月红的关系，就完全的失去了努力生存的动力，而是可以完全的躺平。不管赚多少钱，这种工作我都不想人孩子去做。请家长们拿出一个切实可行的方案，你怎样从小教育你的孩子，才能防止你的孩子，将来得到公社的月红继承人机会，拿到月红之后就躺平。\",\"url\":\"http://zhuanlan.zhihu.com/p/1965872681267209741\"},{\"slug\":\"2025-10-27-英子同学的想法-知乎一个聪明顾家人\",\"year\":\"2025\",\"title\":\"路径依赖的失败：凭勇气赚的钱，会流到真懂财富的人手里\",\"date\":\"2025-10-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"但现代这个时代，以及未来的时代，是社会总财富会继续增长，但财富会渐渐集中到少数真拥有财富思维的人。凡是原来缺乏真正的财商，凭借勇气和聪明赚到的钱，会流到真正懂得财富的人手上。未来是永续的金钱，长久的钱，会击败赚快钱的人。股市上，原来也有一批赚快钱的人，包括我也是（其实还不够快。但我现在的思维都在改，变成要“赚慢钱”，其实我已经已经改了10几年了。这10年，我投资的港股非常的惨淡，常年赔钱。\",\"url\":\"https://www.zhihu.com/pins/1966076862552867195\"},{\"slug\":\"2025-10-26-人类真的在提升和进步吗\",\"year\":\"2025\",\"title\":\"人类真在进步吗：《电子情书》课上，我们连情书都看不懂\",\"date\":\"2025-10-26\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"人像芦苇一样脆弱，但是人比万物更高贵，因为人有思想因而，我们全部的尊严就在于思想。人是理性和思想的动物，而不能只是像动物一样过一生！人类脆弱得像芦苇一样，但人类的思想和理性是人类的尊严所在）。他却些芦苇孤独-----孤独是人类的感情，这种话语---只能来自于娘娘腔，没有真正的思想和才华，只会搬弄文字的文艺腔男人。这种情况，其实只是证明了文学和人类的堕落历史，而不是人类提升的历史。\",\"url\":\"https://www.zhihu.com/pins/1965807179455009965\"},{\"slug\":\"2025-10-26-敬天爱人的文章-知乎清一新教育-今日\",\"year\":\"2025\",\"title\":\"今日新教育之可贵：雅思4-5就能上的大学，黑子成绩不可能更差\",\"date\":\"2025-10-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"敬天爱人的文章-知乎清一新教育|今日新教育之可贵【甚至自己受了一点挫折，或者因为没有拿到一张文凭，就开始攻击新教育】去拿大学文凭很简单的，就像这个文章说的，他上的这个大学，雅思4-5就能去了。他们黑的原因，不是我们没做好，而是我们现在的进步太快了，太好了。让他们这群离开后就躺平，吃喝玩乐，不思进取的“优等生”，显得特别的丑陋和失败。这个文章写的传统的教育，大学里面的状态。\",\"url\":\"https://www.zhihu.com/pins/1965896331030685398\"},{\"slug\":\"2025-10-26-昨天中招了\",\"year\":\"2025\",\"title\":\"昨天中招：表姐请客我吃两碗饭，70岁姐夫吃三碗才是好胃口\",\"date\":\"2025-10-26\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"新教育天书【饮食起居篇】第6问：多吃对身体有何危害？昨天是我表姐请客吃饭，带两个冠军班的女孩一起去吃了晚饭。由于吃的是小时候的经典老传统菜（一份小炒肉。两个小女孩吃的很少，猫食一样、就一点点饭菜。让我表姐姐夫都觉得奇怪，全国泰拳亚军，怎么这么秀气？甚至小女孩会连稀饭都不吃，吃个苹果就完了，我也常常吃个苹果当晚餐。晚上，真的堵住了心窝一样，特别难受，终于晚上四点就爬起来，全吐了出去，才好了。\",\"url\":\"https://www.zhihu.com/pins/1965907278562558585\"},{\"slug\":\"2025-10-24-清一公社-给后代子孙一个免于做禽兽的机会\",\"year\":\"2025\",\"title\":\"清一公社：给后代免于做禽兽的机会，顺便规划义塾明年招生\",\"date\":\"2025-10-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"今天挺惨的：下午去侨联主席的办公室聊天。但我想：天天喝茶的人，这样提来提去的，会对身体有严重消耗的。喝茶的没有数据，但我猜长期喝茶，对身体真没好处！刺激神经的药物，终归都是有害的，不能长期服用！北大终身教授季羡林说：“大多数人来到这个世界上就是凑数的，为了一口吃的，不辞辛劳，夜以继日的劳作，无非就是换一个大点的碗吃饭，其实和飞禽走兽没啥区别。如果说贡献的话，也就是传宗接代，让世界多一些凑数的。\",\"url\":\"https://www.zhihu.com/pins/1964899961280898806\"},{\"slug\":\"2025-10-24-清一公社-给后代子孙一个免于凑数当禽兽的\",\"year\":\"2025\",\"title\":\"清一公社：给后代子孙一个免于凑数当禽兽的机会。\",\"date\":\"2025-10-24\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"如果说贡献的话，也就是传宗接代，让世界多一些凑数的。清一公社的存在，就是给我们自己，以及给我们子孙后代一个“可以不去做禽兽，去凑数”的机会，让我们的后代有机会，不去考虑生活的压力和限制，从小不需要考虑升学和就业压力的问题，有可能去深入思考一下人生。但是：清一社员必须知道，提供月红的举动，只是给了子孙后代一个摆脱资本家控制，不做牛马，不为禽兽的机会，不是说---加入清一公社，就能让子女不做牛马禽兽。\",\"url\":\"http://zhuanlan.zhihu.com/p/1964666493720572725\"},{\"slug\":\"2025-10-24-清一大学文学课-情书写作-学习教材和参考\",\"year\":\"2025\",\"title\":\"清一大学文学课：情书写作（学习教材和参考对象--电子情书）\",\"date\":\"2025-10-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我说：情书的写作，是用语言和文字，向异性表达和展示自己最美好的身份。但真正高级的情书，绝不是肉欲的放肆和低俗的吹捧。同时，回复情书，你要表达对对象的充分的理解和尊重，你连对方的思维，感情。希望我们的公主们，借由文学课程的情书写作和学习，能够学会更加优雅，同时深刻的表达自我。下面是首次【电子情书】写作课程的课前作业。然后我明天回公布我写的对话情书，发挥一下当年大学文学社社长的才情！\",\"url\":\"http://zhuanlan.zhihu.com/p/1965088829523334792\"},{\"slug\":\"2025-10-24-调查一下你的底线-男人为什么活不过女人\",\"year\":\"2025\",\"title\":\"男人活不过女人：六年送走四个中层，全是没退休就死在岗位\",\"date\":\"2025-10-24\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"我在这家公司干了六年，送走了四个中层领导，全是男的。他们的年龄分别是39岁，51岁，55岁和59岁。这还都是没来得及退休就死在岗位上的，如果是退休以后没几年以后就在家里去世的，我都不一定知道了，估计这种肯定也是有的。这种地方，你是无法独善其身的！要么融入，要么滚蛋！你们的决定是什么？\",\"url\":\"https://www.zhihu.com/pins/1965175054267561551\"},{\"slug\":\"2025-10-22-清一公社-一生只做一件事-创建自由人的自\",\"year\":\"2025\",\"title\":\"清一公社：一生只做一件事 创建自由人的自由联合\",\"date\":\"2025-10-22\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"共产党宣言中，说要实现“自由人的自由联合”的共产主义社会。“代替那存在着阶级和阶级对立的资产阶级旧社会的,将是这样一个联合体,在那里,每个人的自由发展是一切人的自由发展的条件。因此，我们一小群拥有上述共同理念的清一公社成员，就会一起来创建这个“共产主义微型试验社区”。当然：既然是崇尚“自由”，我们也不会去干预社员按照其他普通人的生活方式去生活，不一定要求所有人都实行清一社区的生活方式。\",\"url\":\"http://zhuanlan.zhihu.com/p/81538621435\"},{\"slug\":\"2025-10-22-真正的太极拳还有八卦掌什么样子\",\"year\":\"2025\",\"title\":\"真正的太极拳还有八卦掌什么样子？\",\"date\":\"2025-10-22\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"真正的太极和八卦是什么样子？我挺奇怪的，这里这么多人出来回答：你们真的见过真太极实战吗？说什么真太极就是拳击加上摔跤，加上踢腿？真太极，真八卦，实战的时候，看不出来啥招数的。无法实现这个结果的，自然就不是真太极，真八卦了。只要双方功力有差距，就只有几秒钟的事情，就分胜负了。清一武道冠的实战太极，已经拿了中国第一个泰拳世界冠军。等这样的太极拳，出现在世界冠军擂台赛的时候，就是真太极应世了！\",\"url\":\"https://www.zhihu.com/question/287944545/answer/1964434583480148436\"},{\"slug\":\"2025-10-20-5.7空战对印度有什么影响\",\"year\":\"2025\",\"title\":\"5.7空战后的印度：思维如此奇怪，还是远离印度更好\",\"date\":\"2025-10-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"杀人，军阀对抗，这种事情可能是真的。至于强奸老虎获取老虎神力这种事情？就很难理解了。也许这就是印度人要强奸美国女兵的原因？我认为：如果印度的思维如此奇怪，也许我们还是远离印度更好一些。\",\"url\":\"https://www.zhihu.com/pins/1963520524148794427\"},{\"slug\":\"2025-10-20-张清一-金钱的艺术-富二代私享小课\",\"year\":\"2025\",\"title\":\"张清一：【金钱的艺术】  富二代私享小课\",\"date\":\"2025-10-20\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"摩根·豪泽尔这是【金钱的艺术】艺术作者的核心观点，我非常认同这个观点！我的计划12月底，带小女在广州，去现场边游览，观看广州人的财富之道，边读书学习讨论【金钱的艺术】，把书中的观点，和现场看到的一切结合在一起！因此，这是一个超级小众的课程。对于富二代来说，使用金钱的智慧，比赚钱金钱的智慧也许更加重要。也许明年1月份，我可以在磨丁开设一个成人的【金钱的艺术】专项培训课程---看是否有人需要了。\",\"url\":\"http://zhuanlan.zhihu.com/p/1963558332850763481\"},{\"slug\":\"2025-10-20-我从来不相信现金-因此我从银行借现金-把\",\"year\":\"2025\",\"title\":\"我从不相信现金：34年借钱换优质股权，资产与债务同增万倍\",\"date\":\"2025-10-20\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"34年前我就这样做，目前我依然在这样做。34年来，我的资产增加了万倍，我的债务也增加了差不多万倍。都是银行的现金，我认为蛮低利息的资产。我利用了中国储户对于不靠谱的现金的崇拜心理而获取--与金融利益集团一起合作吃羊群！但我也会非常小心的打理这些资产，不用他们去冒险。这个策略是我得到取得万倍收益的核心，但我不准备把这个技术交给孩子们，他们老老实实的守住财产不贬值就行了！\",\"url\":\"https://www.zhihu.com/pins/1963582407207813880\"},{\"slug\":\"2025-10-20-我完全无法理解白银有色上个交易日的涨停\",\"year\":\"2025\",\"title\":\"无法理解白银的涨跌停：逻辑上今天反是买点，但我绝不买\",\"date\":\"2025-10-20\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"都完全超出了我的理性判断的范围！不过，从逻辑上来说，今天似乎是买入点（我绝对不买的，只是说逻辑）逻辑就是：上一交易日的涨停，主力的资金大量“套牢”，如果真想出货，其实是如同中糖糖业一样，拉高然后高位震荡横盘出货的。存心把筹码都死在自己的手上！因为跟风盘会疯狂的卖出如果这样来判断的话，就可以说白银今天的跌停，就是刻意为之的。所以：我会继续认真学习观望，白银到底在玩啥把戏？\",\"url\":\"https://www.zhihu.com/pins/1963578295904862580\"},{\"slug\":\"2025-10-20-清一公社-思考-活著-VS-傲慢与偏见\",\"year\":\"2025\",\"
