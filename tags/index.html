26\",\"title\":\"今天刚去义塾看孩子们走路，都挺认真的，老师说：快一点的12:00就走完了。慢一点的大队人马，基本上再过一个多小时，也都走完了！我说：已经走了两个月，良好的习惯已\",\"date\":\"2026-07-07\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"让老师们明天，给完成走路任务排名前50%的人【放半假】---只需要走一半的路，走完18公里，就算完成当日任务了，就可以回去看【射雕英雄传】。如果不好好学习表演，就让他们继续走36.5公斤。我今天还看到两个大女孩，躺在地上，一脸的慵懒！我走过的时候，一脸的紧张和关注，好像生怕我训她们一样！我问了一下郭指导，说这是义塾来试读的学生。不过在其他认真走路的人看来，她们两人才是废物吧？\",\"url\":\"https://www.zhihu.com/pins/2057814989222719654\"},{\"slug\":\"2026-07-07-估计你们就是最-豪华-的队伍吧-居然提前\",\"year\":\"2026\",\"title\":\"估计你们就是最【豪华】的队伍吧？居然提前两天到达！每个人都多花费两天的食宿费。我相信大多数队伍9号当天才会到的！争取打出好成绩来。拿到更多金牌！你们第一年都能打\",\"date\":\"2026-07-07\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"个一块金牌，超预期！今年可能多拿几块吧！8月还有两场全国锦标赛，大家加油！\",\"url\":\"https://www.zhihu.com/pins/2057962703130473783\"},{\"slug\":\"2026-07-07-古人一句话就说完了-既不能令-又不受命\",\"year\":\"2026\",\"title\":\"古人一句话就说完了：既不能令，又不受命。简单地说。就是这种人，没有思考的能力，也没有眼光看清道路，也没有指挥和领导他人的本事（不能令）这种人很多，大多数人，都是\",\"date\":\"2026-07-07\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"毕竟---大多数人都是没有思考力的，但只要学会乖乖听话。找个一个比自己强的人，有领导力的人，听话照做，其实人生也不会差。但：有人自己笨就笨了，没脑子，却喜欢自己拿主意乱来！比如：本来是可以当贵公主的命，却去学勾栏女子的搔首弄姿。这种【既不能令，又不受命】的人，其实根本没有任何价值，对家庭，对社会都是废物！虽然这种人看起来还不错，有一些能力，自己也肯努力，但结局是不会好的，会自找苦吃。\",\"url\":\"https://www.zhihu.com/pins/2057746289220179504\"},{\"slug\":\"2026-07-07-看了一下年k线-2010年洋河收盘价是4\",\"year\":\"2026\",\"title\":\"看了一下年k线，2010年洋河收盘价是43元！今天跌破了这个价格！洋河是2009年上市的。16年的经营历程，可以说全部泡汤了！洋河8年前的最高价是216元。当年\",\"date\":\"2026-07-07\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"这个价格买入的人，今年在哪里关灯吃面呢？跌掉了80%的价格，如果融资买入，已经爆仓两次了！不知道，我一股洋河都没有，但酒水这种东西，我想总是伴随人类的需求而存在的，也许什么时候就会买入了！消费场景的改变非常明显。我认为216元的价格，应该是未来永远也无法实现的历史记录了！七八年前，手上没有白酒股，都不好意思说自己是炒股的！现在拿了高息股的，被称为老登股，一直跌跌不休的，看上去像个大笑话！\",\"url\":\"https://www.zhihu.com/pins/2057888703733822320\"},{\"slug\":\"2026-07-07-第一味开口之前-心里过三遍-这话该说吗说\",\"year\":\"2026\",\"title\":\"第一味:开口之前，心里过三遍，这话该说吗?说了会得罪人吗?能换个方式说吗?三遍过后，十句话能憋回去九句。  第二味:想做，要什么?先等三天[赞][赞\",\"date\":\"2026-07-07\",\"type\":\"想法\",\"L1\":\"社会与文化 回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"回答：真的很抱歉，生你的时候没有征求你意见！所以我们决定现在给你自由，解放你！既然你不喜欢我们家，不喜欢我们这样的父母，大家就相忘于江湖吧！第一：你现在就滚蛋！有本事自己去找个你喜欢的爹妈去养你！第二：如果你觉得人生不快乐，不想活，你可以自己去死！既然你不喜欢给你的生的机会，你以为你说被强迫出生的。你现在起码可以自己选择去死！我们尊重你，给你自由选择的机会！\",\"url\":\"https://www.zhihu.com/question/2043200046980756422/answer/2057247227727311290\"},{\"slug\":\"2026-07-05-新教育其实是一种简单-有效的教育-特别如\",\"year\":\"2026\",\"title\":\"新教育其实是一种简单，有效的教育。特别如果只是要学知识，考大学的话，难度并不大。但有些人，就是把新教育装成了贵族学校。对家长胡乱收费。一个没啥本事的今日普通教师\",\"date\":\"2026-07-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"离开今日就敢开价12万一年招生，一年收割几百万。有些人模仿今日就是东施效颦，教师和校长根本就不看新教育天书等新教育文章。而不是水平很差只能去野鸡大学，前程无望！一个愿意踏实和努力学习的人，我们都能教出来。成功率远远超过体制学校，而且不卷---只需4年的快乐学习，而不是12年的苦读刷题！至于今日三校的精英教育-----只是服务家长更高的需求，卷的程度肯定更高一些，普通工薪家庭，就不要勉强自己了！\",\"url\":\"https://www.zhihu.com/pins/2057176110987842231\"},{\"slug\":\"2026-07-04-如果你不来-我们就去万象找你-刚好征\",\"year\":\"2026\",\"title\":\"【如果你不来，我们就去万象找你。 刚好征集一下，愿意和我到时候去参加万象3日游的伙伴。】英子太牛了！你们要去万象，继续当旅游博主吗？ 百万博主万象寻\",\"date\":\"2026-07-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"【如果你不来，我们就去万象找你。刚好征集一下，愿意和我到时候去参加万象3日游的伙伴。】英子太牛了！你们要去万象，继续当旅游博主吗？百万博主万象寻找熊杰？[捂脸][捂脸][捂脸][捂脸]前方熊出没，千万小心。别被熊吃了。[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/2056703819258630733\"},{\"slug\":\"2026-07-04-还要求给他三校学生和老师的所有信息和档\",\"year\":\"2026\",\"title\":\"【还要求给他三校学生和老师的所有信息和档案】 最不可思议的就是这个。。。。。居然有这要求。你就算拿到了名单，你能拿走人吗？这些教师和学生会跟你走吗？\u003cbr\",\"date\":\"2026-07-04\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【还要求给他三校学生和老师的所有信息和档案】最不可思议的就是这个。居然有这要求。你就算拿到了名单，你能拿走人吗？这些教师和学生会跟你走吗？他到底是出了多少钱，才能让一些人。愿意为他这样卖力？替他火中取栗的呢？不至于有这么傻的人吧？冒着身名狼藉的危险为熊杰取板栗？\",\"url\":\"https://www.zhihu.com/pins/2056725832509531796\"},{\"slug\":\"2026-07-04-培养一个世界冠军需要多少钱\",\"year\":\"2026\",\"title\":\"培养一个世界冠军需要多少钱？\",\"date\":\"2026-07-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"只有类似ELLA公主这样的人，心地善良，内心有爱，正直热情，服务平台的人，才是我们需要专心去培养，去走向世界冠军，走向国礼之路的人。我从来没有算过：培养一个冠军需要多少钱！培养一个格斗世界冠军，算经济账，永远是划不来的！上一轮，中国好不容易培养出了几个泰拳的世界冠军，是武汉体育学院的李建平老师培养出来的。有意思的是有人拿清一武道馆和张伟丽团队做了对照培养一个格斗世界冠军需要多少钱？\",\"url\":\"http://zhuanlan.zhihu.com/p/2056667655159944471\"},{\"slug\":\"2026-07-04-这就是流氓发财的道路-抢-熊杰学的就\",\"year\":\"2026\",\"title\":\"流氓发财的路就是抢：熊杰学的就是这种流氓手段\",\"date\":\"2026-07-04\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2056884447778231470\"},{\"slug\":\"2026-07-04-长长见识吧-这就是江湖-这就是社会\",\"year\":\"2026\",\"title\":\"长长见识吧。。。这就是江湖，这就是社会！抢生意，就是这样抢的，真的会死人。为了钱，有些人，什么都做得出来的！有些马仔就是拿来牺牲的！我在武汉做生意，就跟黑社会斗\",\"date\":\"2026-07-04\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"过，真的只要是赚钱的生意，就有人来抢的！老实人，只是给别人垫底的料！\",\"url\":\"https://www.zhihu.com/pins/2056890472493324247\"},{\"slug\":\"2026-07-03-如果对光明感到怀疑和拒绝-当然就只能走入\",\"year\":\"2026\",\"title\":\"如果对光明感到怀疑和拒绝，当然就只能走入黑暗之路！你们选择了面对自己的弱点去改进，你们选择了不去逃避，当然你们就是强者！就是赢家！就是人生的光明之路！SAT只是\",\"date\":\"2026-07-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"很小的一步。冠军之路，要比SAT之路更难。挑战更大，不是一般人能走的路！是最想改变自己弱点的强者，才能面对的道路！[赞]……\",\"url\":\"https://www.zhihu.com/pins/2056407898079729241\"},{\"slug\":\"2026-07-03-杨家三十二目中的-八五十三势长拳解-明明\",\"year\":\"2026\",\"title\":\"杨家三十二目中的《八五十三势长拳解》明明说“万不得有一定之架子”，为什么现在都在练套路？\",\"date\":\"2026-07-03\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"真正的古传太极经典，太极拳谱，全是“太极心法”。如果以为某个动作招式就是太极，就是骗人的！太极云手不是某一个具体的动作，而是这个动作背后的一切“太极心法，太极功力”。学会了，可以克制一切进攻！你不会这些太极精髓的话，这个动作其实人畜无害，一点威力也没有！至于古拳经反对的东西，为何成了社会的主流？但你教心法，教你一个云手练三年五年，你怎么赚钱？因此，教真太极的人，就不能想赚钱的事情！\",\"url\":\"https://www.zhihu.com/question/2056249524054667775/answer/2056363201940436780\"},{\"slug\":\"2026-07-02-明莉校长回复执法局-我只是代家长持有今日\",\"year\":\"2026\",\"title\":\"明莉校长回复执法局：我只是代家长持有今日国际学校资产的股东。\",\"date\":\"2026-07-02\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"因为：原来法律文件上，他代表家长们拥有今日国际学校25%的股份，黄小燕代表家长们拥有30%的股份，还让黄某人做了法人代表！钱莉校长也代持了25%的股份，做学校的校长。没想到引狼入室----熊杰就以这一份文件为依据，要求法院强制执行，他和黄小燕拿走去管理今日国际学校的全部资产！---不仅仅是控制房地产等资产，她们两人还要控制今日国际学校的全部资源，要账户，还要我们提供家长和学生的花名册等等。\",\"url\":\"http://zhuanlan.zhihu.com/p/2056021369742176575\"},{\"slug\":\"2026-07-01-郭指导做的很棒-教育其实很简单-就是把孩\",\"year\":\"2026\",\"title\":\"郭指导做的很棒 教育其实很简单：就是把孩子教出来。而不是吹出来！WC却学歪了。把全部的功夫都放在吹上，吹自己牛。吹今日黑！她骗走今日的学生，最有价值的方式\",\"date\":\"2026-07-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"郭指导做的很棒教育其实很简单：就是把孩子教出来。把全部的功夫都放在吹上，吹自己牛。她骗走今日的学生，最有价值的方式，就是把这批学生教好。然后证明自己离开今日也行。而不是把学生骗过去之后放羊、然后把功夫花去骗其他新生！这样短视的结果，只能把她在今日多年来积累的福报全部耗光的！而郭指导用四年时间来磨一剑、今天的成绩亮瞎WC的眼！昔日的今日明星，今天的清黑和失败者！人生不是游戏，不能短期重启的。\",\"url\":\"https://www.zhihu.com/pins/2055802998463395474\"},{\"slug\":\"2026-06-30-被历史记录的人生-才是真正的人生打卡\",\"year\":\"2026\",\"title\":\"被历史记录的人生，才是真正的\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"人生打卡\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"\",\"date\":\"2026-06-30\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"但真正的能够被人记住的唯一方式，也是让自己对一样满意的方式，就是我们去创造一些东西，特别是有价值的东西。这样的打卡就是浪费资源，因为根本没有人会记住你，因为这不是创造，只是跟随模仿他人的行为。只有一些为社会做出创造性付出的人，才是真正的”人生打卡“。Ella清一公主NO.1的文章-知乎人生打卡文案（持续更新中）下面是我查到的IFMA世界锦标赛上，曾经留下个记录的中国人。\",\"url\":\"http://zhuanlan.zhihu.com/p/2055201588051023427\"},{\"slug\":\"2026-06-29-中国不是没有梅西-不是没有舒马赫-中国缺\",\"year\":\"2026\",\"title\":\"\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"中国不是没有梅西，不是没有舒马赫。中国缺的是——让梅西的妈不要把他从足校领回家，让舒马赫的爸不要让他去开卡车。\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"格斗也一样：中国是格斗弱国。并不是14亿人中，\",\"date\":\"2026-06-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"\\\"中国不是没有梅西，不是没有舒马赫。中国缺的是——让梅西的妈不要把他从足校领回家，让舒马赫的爸不要让他去开卡车。\\\"格斗也一样：中国是格斗弱国。并不是14亿人中，没有格斗天赋的人才。而是拳手他爹妈不同意孩子走这条路，理由是：干嘛要去挨打[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/2054839127418332960\"},{\"slug\":\"2026-06-29-当小孩子以得到一块蛋糕-去玩一个景点-来\",\"year\":\"2026\",\"title\":\"当小孩子以得到一块蛋糕，去玩一个景点，来作为自己“人生打卡”的时候，小小的ELLA已经开启了自己独特的打卡方式---以进入今日学堂为标志，开启了自己人生的逆袭！\",\"date\":\"2026-06-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"几乎每一年，ELLA都在创造自己的新纪录！我们期待明年，以后的每一年，去看ELLA创造了什么样的人生打卡记录！[赞]让世界因我而不同。ELLA真的做到了这一点！而不是仅仅停留在嘴巴上！\",\"url\":\"https://www.zhihu.com/pins/2055061626684978879\"},{\"slug\":\"2026-06-29-谭木兰的比赛一直很不顺-很多机会都比别人\",\"year\":\"2026\",\"title\":\"谭木兰的比赛一直很不顺，很多机会都比别人少，泰国比赛刚开始一直在判输，冠军头衔也是最后才在东亚锦标赛拿到的。而这次锦标赛，感冒叠加生理期，导致她体力支撑不住一场\",\"date\":\"2026-06-29\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"但她却是比赛最多的，必须打满三场才能到决赛。但她节省体力，更稳很准的初级，第一局就KO了对手，顺利晋级。最终击败了长期霸榜冠军的香港拳手，拿到了东亚锦标赛冠军。这次的世界锦标赛，选拔的规则突然变化，跟去年完全不一样了。由于谭木兰在去年的全国锦标赛是让赛李想的，自己当了亚军陪席，居然失去了入选机会。过去就算有人因为她全力付出去陪练，才拿到了很好的成绩，但赛事根本就没有感谢她的付出，视为理所当然的。\",\"url\":\"https://www.zhihu.com/pins/2055195752696133330\"},{\"slug\":\"2026-06-28-1590分-相当于SAT满分成绩了\",\"year\":\"2026\",\"title\":\"1590分---相当于SAT满分成绩了。关键是孩子们的心理状态，精神状态。并没有成为一个书呆子！如果这样的学校还不够好。那么，请你们找一个“中国好学校”甚至师姐\",\"date\":\"2026-06-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"好学校来让我们学习？取经？清黑看不起今日，贬低和谩骂今日，那么：请你们去创造一个更好的学校出来？这才是真正的创造。不满意，就去自己行动，自己创造最好的结果，而不是当键盘侠。这才是真正的新教育精神！\",\"url\":\"https://www.zhihu.com/pins/2054670696706479816\"},{\"slug\":\"2026-06-28-ELLA总结赛事非常好-最强的是ELLA\",\"year\":\"2026\",\"title\":\"ELLA总结赛事非常好。最强的是ELLA的心态，最美的是ELLA的感恩，最让人欢喜的是ELLA友善之心！当年为你取外文名的时候，我说你很善良，但乖，但缺点勇气！\",\"date\":\"2026-06-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"希望你像电影里面的主角ELLA一样，不仅仅有温柔和善良。你今天用为中国第一次升起国旗的方式，来展现了你善良和勇敢的身份。这是你来到今日后，努力提升9年带来的初步成果！与泛美锦标赛的冠军--加拿大人比赛，你赢了。因为你还有一些软弱，不够勇敢，没有专心去面对比赛。与印度拳手的比赛，你也没有做到收放自如！但与更强大的，具有冠军实力的俄罗斯对手的决战，你放下了对结果的执着，也放下了对强手的恐惧。\",\"url\":\"https://www.zhihu.com/pins/2054681366592279421\"},{\"slug\":\"2026-06-28-他们跟一个女人见面-半个小时的谈话\",\"year\":\"2026\",\"title\":\"【他们跟一个女人见面，半个小时的谈话，（最厉害的是十分钟左右）可以把这个女孩子看的清清楚楚，】对女人有这么深度了解的人，已经很难得的！做很多事情都能成功。可惜这\",\"date\":\"2026-06-28\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"群人的最终目的，也就是找到和女人交配的机会，然后结束关系。真没啥档次！除了女人的身体，他还能感受到女人还有更美，更有价值，更永恒的优点吗？[捂脸]女人也一样：女人可以欣赏的男人的价值，除了跟他们交配，还有提供经济支撑，男人也许你还可以发现更深刻的优点，人性的，甚至神性的优点，而不是只有“动物价值”……\",\"url\":\"https://www.zhihu.com/pins/2054541142679621804\"},{\"slug\":\"2026-06-28-刚回昆明-今天去逛了一下超市-意外发现有\",\"year\":\"2026\",\"title\":\"刚回昆明。今天去逛了一下超市，意外发现有【漓泉1998】出售，6元一瓶！ 就买了一瓶带回家里准备尝尝。我是第一次见到这个酒，知道她几年前一款酒的利润总额，就超过\",\"date\":\"2026-06-28\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"还看到了青岛啤酒买一提赠送一瓶的优惠，每提32元。还有崂山啤酒，25元一提（六罐500ML装）。在马来西亚，这个价格连两罐啤酒都买不到。看到了中国的啤酒市场，真的是竞争非常的激烈。发现：我看多不做多，可能反而做空的行为，原来真的是很有价值的方法！实际上，燕京冲14，我虽然看多，认为冲到20都有可能，但在行为上，我是一直在卖掉的。至于惠泉，我去年是拥有1200万股的，股东老二。\",\"url\":\"https://www.zhihu.com/pins/2054701038817564108\"},{\"slug\":\"2026-06-28-对于拳手来说-大概就是奖金要扣20转让\",\"year\":\"2026\",\"title\":\"对于拳手来说：大概就是奖金要扣20%转让股票赚钱免税。（暂时免税。也许以后会收）。\",\"date\":\"2026-06-28\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2054538503036441491\"},{\"slug\":\"2026-06-28-这个总结很好-祸莫大于可欲-低欲望-高\",\"year\":\"2026\",\"title\":\"总结得好：低欲望高能力最幸福，最怕欲望高过能力一生苦命\",\"date\":\"2026-06-28\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2054531854817141392\"},{\"slug\":\"2026-06-27-“生了我又不对我负责-凭什么别的同学有\",\"year\":\"2026\",\"title\":\"“生了我又不对我负责，凭什么别的同学有，就我没有？”孩子大吼，你怎么回应？\",\"date\":\"2026-06-27\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"很好回答呀？你有本事就投生去李嘉诚家吗？要不你自己去做李嘉诚？没本事投生，也没本事自己去当。冲我叫什么？爹妈是没本事，你有本事就去自己找爹妈！如果你瞧不起自己的爹妈，你现在就滚。自己找个爹妈养你去！看谁会要你！你滚蛋了。老子起码图个轻松自在，不被你个逆子气死！\",\"url\":\"https://www.zhihu.com/question/2049857852655906822/answer/2054187134697869735\"},{\"slug\":\"2026-06-27-痛风发病率的飙升曲线和含糖饮料消费量的\",\"year\":\"2026\",\"title\":\"【痛风发病率的飙升曲线和含糖饮料消费量的增长曲线，在时间维度上几乎是重叠的。我国含糖碳酸饮料的市场规模从2000年代初期开始急剧膨胀，而同一时期，我国的痛风患病\",\"date\":\"2026-06-27\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"率也从上世纪90年代的不足1%一路攀升。】……\",\"url\":\"https://www.zhihu.com/pins/2054182338360250994\"},{\"slug\":\"2026-06-27-恭喜-这个班毕业了-孩子们创造出了新的记\",\"year\":\"2026\",\"title\":\"恭喜，这个班毕业了。孩子们创造出了新的记录。真棒!喜庆之日，也别忘了这些成功的同学，当年他们还有七个同学，现在还不知道在哪里流浪受苦呢。三年半以前，WC作妖，不\",\"date\":\"2026-06-27\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"仅突然抛弃班级，还把7名不错的学生带走。因为家长们相信她”明星教师“的人设，不相信刚刚入职不久的郭指导！WC还贬低郭指导是1.0教师，根本比不过她的2.0版本。我说：WC要自己办学赚钱，但没有自己的业绩。因此她肯定想把今日的学生骗走，用这些优秀学生去刷成绩，将来为自己脸上贴金的！在商言商，她这样做，也可以理解，虽然手段无耻了一些！WC并没有珍惜这些她骗走的孩子，而是把他们放养，自己也不亲自带班。\",\"url\":\"https://www.zhihu.com/pins/2054190146736632010\"},{\"slug\":\"2026-06-27-走路练功是传武练法中-最高效的方法之一\",\"year\":\"2026\",\"title\":\"走路练功是传武最高效也最难：会内家拳的都超爱走路\",\"date\":\"2026-06-27\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2054186156422706264\"},{\"slug\":\"2026-06-25-今天ELLA的俄罗斯对手-参加决赛应该\",\"year\":\"2026\",\"title\":\"【今天ELLA的俄罗斯对手，参加决赛应该也有同样的问题：她昨天被ELLA多次用重腿击中腹部后，第二天的反应会比昨天的更大。体能会跟不上的！不知道这个战斗民族撑得\",\"date\":\"2026-06-25\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"】下午决赛的结果出来了，ELLA和我特意去51公斤级的台子去看结果，其他公主们去看他们的对手比赛去了！今天俄罗斯人打土耳其人，第一局取胜。场上越来越反应不过来，这一局被土耳其人追平！结论：昨天与ELLA的比赛，俄罗斯人绝对伤了元气。看她打ELLA的时候多有精神，第二天却这么无力的样子！今天领奖的时候，俄罗斯人突然对ELLA说：其实你很强的。她知道自己昨天没有赢，她在场上惶然自失，去回头看教练。\",\"url\":\"https://www.zhihu.com/pins/2053600128016061425\"},{\"slug\":\"2026-06-25-今天回国了-结束了这两个月为了世锦赛备战\",\"year\":\"2026\",\"title\":\"今天回国了，结束了这两个月为了世锦赛备战的奔波。今天很早就起床了，不到5点就醒来。这是青岛备战期间养成的习惯，回去后再慢慢调整吧！\",\"date\":\"2026-06-25\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2053715996762969539\"},{\"slug\":\"2026-06-25-如何看待伊朗队在洛杉矶更衣室留下的感谢信\",\"year\":\"2026\",\"title\":\"如何看待伊朗队在洛杉矶更衣室留下的感谢信？\",\"date\":\"2026-06-25\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"体育运动的解释权，一直掌控在西方白人的手里！因为体育是一个国家的荣誉所在，是国家的对外名片！目的就是想让伊朗队每天参赛疲于奔波，体力消耗，打不出来好结果。伊朗队的表现很好：一封感谢信，看到了伊朗的修养和文明。在格斗领域，也是西方阵营控制游戏规则的赛场。目前在泰国的职业赛事，依然是泰国人掌控主导！但世界锦标赛，IFMA组织的赛事，实际掌控在欧洲人的手上！今年的世界锦标赛，泰国可能已经全军覆没了！\",\"url\":\"https://www.zhihu.com/question/2052442119843701055/answer/2053410099364995491\"},{\"slug\":\"2026-06-25-泰拳世锦赛ELLA取得中国女子历史最好成\",\"year\":\"2026\",\"title\":\"泰拳世锦赛ELLA取得中国女子历史最好成绩\",\"date\":\"2026-06-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"白人的赛场控制，是无法长期一直压制我们崛起的。中国木兰战队四个队员与IFMA亚洲官员合影今天，6月25日，是世锦赛的颁奖日。中国的国旗，将第一次因为中国女子的奋战，而在世锦赛上升起。ELLA就是这个创造中国女子格斗历史的第一人。据说：这也是最近10年来，中国队征战世界泰拳锦标赛的最佳成绩！她的对手土耳其人，在半决赛中击败了刘晓慧在世运会遇到的菲律宾拳手（也是世锦赛的前冠军了），晋级冠亚军决赛！\",\"url\":\"http://zhuanlan.zhihu.com/p/2053372385605296881\"},{\"slug\":\"2026-06-25-清一公主ELLA-家国天下之路的开启\",\"year\":\"2026\",\"title\":\"清一公主ELLA：家国天下之路的开启\",\"date\":\"2026-06-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"ELLA公主在世界锦标赛的赛场上，以女子的身份，第一次为中国升起了国旗！明年，四年一度的世界武搏会，ELLA已经锁定了国家队代表的资格，也许，这就是她提前锁定世界冠军的良好机会。因此，她今天正式成为第一个真正的”清一公主“。因为清一公主是我们清一家园的守护者，是家族的明珠和希望。所有热爱团队，热爱平台，热爱家园的人，为团队和家园做出重大贡献，付出所有的【预备公主】，都有资格和机会成为【清一公主】。\",\"url\":\"http://zhuanlan.zhihu.com/p/2053704955379423210\"},{\"slug\":\"2026-06-25-这种人-就是用自己-得到的东西-来定义自\",\"year\":\"2026\",\"title\":\"这种人，就是用自己【得到的东西】来定义自己的身份。而真正的成功者，是用自己的“创造不凡”来定义自己的身份！你吃海鲜，就得意洋洋的。难道你【创造了海鲜】吗？父亲带\",\"date\":\"2026-06-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"女儿去吃海鲜。是父亲用劳动创造了人让女儿开心的一刻。你吃帝王蟹，是你创造的，还是别人（父母家人恩赐）给你的享受和结果？你拥有纤纤玉手。你去与劳动者的创造之手比得意?只能彰显你消费者的本质吧！这个社会的人，仅仅只会以“得到”来定义身份，是极其浅薄的可惜了家长一直在灌输这样的观念！\",\"url\":\"https://www.zhihu.com/pins/2053718483649746563\"},{\"slug\":\"2026-06-24-ELLA的对手-我唯一佩服的就是敢拼敢打\",\"year\":\"2026\",\"title\":\"ELLA的对手，我唯一佩服的就是敢拼敢打！技术上完全被ELLA克制。拳也打不出来，腿也踢不出来。只能搂抱，假装她在膝击，假装她在出肘攻击，其实根本就是无效动作。\",\"date\":\"2026-06-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"只是会演出罢了，ELLA是傻公主，心眼实在。演不出这些场上戏，以为比武就是老老实实的比武。不知道还要比演技！[捂脸]既然正常打。我们打不赢裁判。我们就只能拼命去练出KO的能力了。明年再来打一次[酷]……\",\"url\":\"https://www.zhihu.com/pins/2053248406647207809\"},{\"slug\":\"2026-06-24-欧洲白人真他妈的不要脸了-昨天陆鸽与乌克\",\"year\":\"2026\",\"title\":\"欧洲白人真他妈的不要脸了。昨天陆鸽与乌克兰人的比赛，与ELLA的比赛是同时。所以我没有看到陆鸽的比赛。只是抽空瞟了一眼。最终听说陆鸽以3:0败北，失去进入半决赛\",\"date\":\"2026-06-24\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"相信陆鸽有时候有点晕，说不定昨天也犯晕了！因为忙于帮助ELLA对付俄罗斯人，因此我都没去看陆鸽的比赛视频，一直到晚上，ELLA打完了比赛。晚上大家就在一起复盘，看每个人的比赛视频，总结经验教训。我才第一次看了陆鸽的比赛，简直气坏了：陆鸽明明是赢的。大家看上面的实战视频，第一局一直是陆鸽在狂抽乌克兰人。但陆鸽并未吃大亏，远远比第一局乌克兰人的局面好得多。我知道IFMA组织是欧洲的白人控制的组织。\",\"url\":\"https://www.zhihu.com/pins/2053236780086849698\"},{\"slug\":\"2026-06-23-ELLA是本次世界锦标赛-中国队第一个开\",\"year\":\"2026\",\"title\":\"ELLA是本次世界锦标赛，中国队第一个开打的拳手！每一天，都有中国的队员被淘汰！今天，甚至连中国的世运会的世界冠军，也在8强战的时候被白俄罗斯拳手淘汰了，无缘4\",\"date\":\"2026-06-23\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"现在ELLA，成为了最后一个依然还站在赛场上为中国队拼杀的拳手!她今天，已经一个人孤独地、实现了为中国在马来西亚世界锦标赛中升起了一面旗子。去年的世界锦标赛，拳手第一轮就都被刷下来了，陆鸽勉强打了两轮，第一轮KO了拳手。说她现在已经是多年来中国拳手在世界锦标赛上取得的最好成绩了，而她还有机会更进一步！俄罗斯人今天用3:0的强悍成绩，击垮了上届世界运动会亚军，前世界冠军。\",\"url\":\"https://www.zhihu.com/pins/2052890967796101438\"},{\"slug\":\"2026-06-23-她说-我花了十年时间-才走到可以开始找\",\"year\":\"2026\",\"title\":\"[她说：我花了十年时间，才走到可以开始找工作的起点。[捂脸] 这种大学都敢读。实在是勇敢和愚蠢。读大学，要么为自己而读。喜欢。有提升自我的功能，就够了。现\",\"date\":\"2026-06-23\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"[她说：我花了十年时间，才走到可以开始找工作的起点。[捂脸]这种大学都敢读。实在是勇敢和愚蠢。读大学，要么为自己而读。有提升自我的功能，就够了。现在不知道还有啥大学是现在这个样子！要么为老板而读。当然是多快好省了！如果你读大学。两头都得不到，还去读个啥？\",\"url\":\"https://www.zhihu.com/pins/2052973441691791472\"},{\"slug\":\"2026-06-23-工业革命来了-你还要练骑马技术吗\",\"year\":\"2026\",\"title\":\"工业革命都来了，你还要练骑马技术吗\",\"date\":\"2026-06-23\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2052685803663388688\"},{\"slug\":\"2026-06-22-一天中最好的时间-要先留给自己-用来提\",\"year\":\"2026\",\"title\":\"【一天中最好的时间，要先留给自己，用来提升头脑；剩下的时间，再交给外部世界。对的，这是一种自我提升的必要方式。沉浸在外部世界的泡沫中，很快就很众人一样了！因此学\",\"date\":\"2026-06-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"投资的人，应该多看历史书。多研究人性，多看看经典的小说等。而不是满世界到处看【新消息】！世界上发生什么战事了。这些都不会实质影响企业的发展。也许会短期内影响股价！\",\"url\":\"https://www.zhihu.com/pins/2052637600977006794\"},{\"slug\":\"2026-06-22-一个人在世界上是卑微的-环境严酷-随时都\",\"year\":\"2026\",\"title\":\"一个人在世界上是卑微的。环境严酷，随时都可能失败和夭折！因为有家族的爱意。有家族的互相支援，才有了更多的生存发展的可能。受援助的家族成员，用心保存一份份侨批，这\",\"date\":\"2026-06-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"份纪念和感恩之心，是潮汕华人在靠过去的政府靠不住的情况下，只能靠自己互助走出来的信仰！[赞]……\",\"url\":\"https://www.zhihu.com/pins/2052306729573126652\"},{\"slug\":\"2026-06-22-我高考成绩特别好但是男朋友只能上大专-他\",\"year\":\"2026\",\"title\":\"我高考成绩特别好但是男朋友只能上大专，他说我不陪他就分手，我不想去但是又非常喜欢他怎么办？\",\"date\":\"2026-06-22\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"一个男人，见不得你好的男人，你还是远离好了！你爱他，就喜欢看到他优秀。另外，身为男人，我认为男人的思维力应该在女人之上。你男友学习长期不如你，不服气你的成绩，不甘心你比他强。但自己还不肯努力，因此肯定是一个不用心的人。真的喜欢他的身体，你不如就【去父留子】，留下他的基因就走吧！别跟这种人在一起生活一辈子，见不得你好的人在一起，你的人生就毁掉了！不如彼此相忘于江湖，舍不得就生个他的孩子陪你。\",\"url\":\"https://www.zhihu.com/question/2050209662205796427/answer/2052651204010831980\"},{\"slug\":\"2026-06-22-昨天忙着给公主们在现场比赛-根本就没空去\",\"year\":\"2026\",\"title\":\"昨天忙着给公主们在现场比赛。根本就没空去看股市，我也不带手机的！昨天我们冲半决赛的关键场次的，佳彦的比赛，被裁判黑了。裁判分歧判定第三局3:2算我们输，但第三局\",\"date\":\"2026-06-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"领导正在交涉和申请仲裁，现在还不知道最终结果会不会改判。不过结果不重要了，继续完成今天的比赛才是我们关注的重点。打赢今天的赛事，就稳拿世锦赛的奖牌了。今天早上才看到---中金昨天居然涨停了。这个股就是我的守了三年的，位列前三的重仓股了，涨停带来的账户回血较多。下午是关键场次的比赛，上午也要研究思考应对方案，因此---虽然是重仓，涨跌都依然由她吧。但---10元这个区间，真有啥必要出货吗？\",\"url\":\"https://www.zhihu.com/pins/2052640557248279134\"},{\"slug\":\"2026-06-22-病都是吃出来的-皇家想吃啥就吃啥-哪时候\",\"year\":\"2026\",\"title\":\"病都是吃出来的。皇家想吃啥就吃啥，哪时候的食材还没有这么多的激素，抗生素。就已经只能活40岁了。现在的人，有点小钱就【吃遍天下美食】。真的是活腻了[捂脸]。\",\"date\":\"2026-06-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2052636347337389291\"},{\"slug\":\"2026-06-22-转-鉴往知来-拳破百年禁忌-从地下表演到\",\"year\":\"2026\",\"title\":\"转：鉴往知来   拳破百年禁忌！从地下表演到奥运赛场女性拳击的百年征程，是一部打破禁忌、以拳为刃，争夺话语权的抗争史，关键年份的每一步突破，都镌刻着女性的坚韧。\",\"date\":\"2026-06-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"1720年，伦敦举办了有记载以来的第一场女子拳击赛，标志着这项运动正式登上历史舞台。1904年，圣路易斯奥运会将女子拳击列为表演项目，虽未成为正式赛事，却为其后续发展埋下伏笔。此后漫长岁月里，女子拳击被贴上“低俗”“野蛮”的标签，遭到全球范围内的普遍禁止，陷入发展低谷。20世纪30-50年代，女子拳击迎来第一个关键转折，核心人物米尔德丽德·伯克（MildredBurke）脱颖而出。\",\"url\":\"https://www.zhihu.com/pins/2052313762091241668\"},{\"slug\":\"2026-06-21-中国的文化-精神消费时代正在到来-布局文\",\"year\":\"2026\",\"title\":\"精神消费时代正在到来：布局文化明星正当其时，体育明星是未来\",\"date\":\"2026-06-21\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2051940294921401321\"},{\"slug\":\"2026-06-21-为啥说普通家庭的最大的骗局就是带孩子见世\",\"year\":\"2026\",\"title\":\"为啥说普通家庭的最大的骗局就是带孩子见世面？\",\"date\":\"2026-06-21\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这些家长所谓的带孩子去见世面，其实不是真正的【见世面】。因此，现在很多中产以上家庭出生的孩子，长大后，都是严重的消费者。我带孩子逛博物馆的时候，不会说“这东西价值多少钱，多稀奇”。也不会说这东西多好看，咋家买一个回家放起来。就像现在的一个普通的包，穷人花上一百元就可以买到。在国家博物馆里面，我们还看到了美轮美奂的现代文物---瓷器居然做得衣服飘风的样子。你就可以去投资人性的弱点，用金钱去猎取金钱。\",\"url\":\"https://www.zhihu.com/question/2038894308640700353/answer/2051984460992853365\"},{\"slug\":\"2026-06-21-今天开始-公主们每天创造并刷新中国人的格\",\"year\":\"2026\",\"title\":\"今天开始：公主们每天创造并刷新中国人的格斗历史记录\",\"date\":\"2026-06-21\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"今天我们创造了一个中国格斗上的历史记录：今年帮助中国队获得了参加泰拳世锦赛历史上晋级8强最多人数的记录。其中清一战队就贡献了四个人，国家队只给了我们四个名额。我看就惨了，这样下去，就要创造ELLA自己的泰拳实战记录了---被KO。赛前最后的提示ELLA但真正的记录，必将记录进入中国格斗界历史的记录，是明天才开始！从今天开始，每一天的赛事，公主们都走在创造历史的道路上。\",\"url\":\"http://zhuanlan.zhihu.com/p/2052162370416403323\"},{\"slug\":\"2026-06-21-小语种就业已经从“语言稀缺”进入“语言\",\"year\":\"2026\",\"title\":\"小语种就业已经从“语言稀缺”进入“语言 + 行业”时代这篇文章写的不错，想要学第三语言的家长和学生们可以多参考。今日三语优选“西语加上日语\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"。正好符合了本文的就\",\"date\":\"2026-06-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"小语种就业已经从“语言稀缺”进入“语言+行业”时代这篇文章写的不错，想要学第三语言的家长和学生们可以多参考。今日三语优选“西语加上日语\\\"。正好符合了本文的就业方向广！不过中国未来必然加强东南亚地区的影响力。因此，加上东南亚语言，泰语等，我认为还是有必要的。不过就别学马来语了。因为马来的华人多，你的三语优势在这里没啥特别作用！也许印尼发展有点用！\",\"url\":\"https://www.zhihu.com/pins/2051962612968060191\"},{\"slug\":\"2026-06-21-文凭是敲门砖-还需要实力-能力-加上关系\",\"year\":\"2026\",\"title\":\"文凭是敲门砖，还需要实力，能力，加上关系。缺一不可，才能成为“体制人”。 新教育有人不要文凭，也不会做关系，你少了很多“必选”也能生存。但你至少需要“本事\",\"date\":\"2026-06-21\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"文凭是敲门砖，还需要实力，能力，加上关系。新教育有人不要文凭，也不会做关系，你少了很多“必选”也能生存。但你至少需要“本事能力”，能够为他人创造价值，你才能正常的生存下去！如果你没有文凭，也没有本事和能力，甚至你还没有圈子和关系：我认为你可以去找你爹爹妈妈养你一辈子了！体制的岗位会养人，但需要你付出尊严和自由！你如果什么都不想付出，什么本事都没有，什么能力都没有学好。\",\"url\":\"https://www.zhihu.com/pins/2051946880251213501\"},{\"slug\":\"2026-06-2 \":\"2026\",\"title\":\"世锦赛部分对手视频，看公主们的对手啥级别？\",\"date\":\"2026-06-07\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"公主们已经看到了本次世锦赛的部分参赛选手名单。她们必须去打一些是世界知名度很高的拳手。ELLA公主，将要迎来的对手，就有一个是我们大家都熟悉的对手：就是上次世运会，冠亚军决赛刘晓慧对打的，经验丰富的。就像去年，陆鸽和刘晓慧都参加了世锦赛，但都止步八强，刘晓慧就是8强赛输给了摩洛哥拳手，失去了进入半决赛的资格，空手而回。我看当年的比赛，她在场上还是有一些优势的，但因为技术差别的原因，被裁判判输了！\",\"url\":\"http://zhuanlan.zhihu.com/p/2046888136186368818\"},{\"slug\":\"2026-06-07-传统武术没落的真正原因是什么呢\",\"year\":\"2026\",\"title\":\"传统武术没落的真正原因是什么呢？\",\"date\":\"2026-06-07\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"是因为传武的格斗思维，训练方式，都和现代体育运动不一样。现代格斗崇尚肌肉力量，传武崇尚协调性和筋骨力量。现代格斗强调直接打击，传武的核心是接手后打击。太极的动作招式，练的全是控手，接手的动作，不是打击动作。一群太极大师假装这是打击的动作，用来表演攻防，就是笑话！现代格斗的发力，是腰挎的转身，用脚蹬地，传递到手臂上出来的发力。谁说会传武，你看他会不会单足站立，打出快速凶猛的发力（不是比动作）。\",\"url\":\"https://www.zhihu.com/question/664057965/answer/2047207064045360469\"},{\"slug\":\"2026-06-07-原来清华大学课堂也念PPT呀-这种老师咋\",\"year\":\"2026\",\"title\":\"原来清华大学课堂也念PPT呀？这种老师咋选的！清华大学每年400亿的经费，就养这种人吗？[大笑][大笑][大笑] 一个不以学生为主，而已论文发表和领导意志\",\"date\":\"2026-06-07\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"原来清华大学课堂也念PPT呀？这种老师咋选的！清华大学每年400亿的经费，就养这种人吗？[大笑][大笑][大笑]一个不以学生为主，而已论文发表和领导意志为主的大学，就是这么任性的！谁去上这种大学，就是与自己的生命过不去！不过--除非你上大学另外有打算！\",\"url\":\"https://www.zhihu.com/pins/2046937201607439875\"},{\"slug\":\"2026-06-07-这个分享内容好-讲的就是体制内的工作\",\"year\":\"2026\",\"title\":\"体制内工作内容与方法的分享很好，但我不忍女儿去这种地方\",\"date\":\"2026-06-07\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2047066904205041912\"},{\"slug\":\"2026-06-04-81年女-本科-未婚未育-还有结婚的可能\",\"year\":\"2026\",\"title\":\"81年女，本科，未婚未育，还有结婚的可能性吗?\",\"date\":\"2026-06-04\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"只要你是个女的，而且在是活的，都有人抢着要！只要你愿意当老婆，你不计条件的话，一定有男人愿意娶你的！也就是说：婚姻这个市场，肯定是有需求的。如果确定是市场有需求的东西，你一直到现在都卖不出去的原因，肯定只有也唯一有一个原因---就是标价高了。至于你用的词汇----结婚-----这个问题就有点麻烦了。2：如果你结婚，只是想找个人陪伴你，服侍你的话---只要肯花钱，肯定有人会应聘的吧？\",\"url\":\"https://www.zhihu.com/question/1918072746283344329/answer/2045856157508563334\"},{\"slug\":\"2026-06-04-单人项目是个等天才的游戏-好像格斗项目\",\"year\":\"2026\",\"title\":\"【单人项目是个等天才的游戏】好像格斗项目的确是这样的，等天才[赞]，作者这个词汇很好。所以，提供了一个格斗的环境，坚持下来，总有一些天才冒出来的。泰国日本越南菲\",\"date\":\"2026-06-04\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"律宾，欧洲国家，都有这样的天才！中国的格斗土壤太差了，就算有天才，我看也很难出来！除非有特别的技术突破！[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/2045895012848759191\"},{\"slug\":\"2026-06-04-新教育天书-非厨饮食-公主们正在尝试的\",\"year\":\"2026\",\"title\":\"新教育天书：非厨饮食--公主们正在尝试的健康生活方式\",\"date\":\"2026-06-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"所谓的现代生活，认为应该饮食丰富，每天要吃很多菜，很多食材。相比早期我们穷困时代的国人，现代人的身体是否更健康？而我母亲现在90岁，身体依然健康，还能独立生活。再加上我们的不良烹调方式，带来二次健康伤害。西方饮食理论拿出来指南---吃叶子菜就是健康，其实就是胡说的！最近我和几个小公主，就正在尝试这种饮食方式！小明慧就准备带她们班正在云南备赛全国锦标赛的10个小公主们，一起来实行“非厨饮食”法。\",\"url\":\"http://zhuanlan.zhihu.com/p/2045823200609805399\"},{\"slug\":\"2026-06-03-作者李德玉已经80了-80年当学生的时候\",\"year\":\"2026\",\"title\":\"作者李德玉已经80了。80年当学生的时候 ，看过他演的电影【武林志】。对何大海一角色很有印象。看这篇文章，他师傅还真是高手。全国摔跤冠军都打趴下了。现在的很多大\",\"date\":\"2026-06-03\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"师，都是嘴巴上的功夫了[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/2045477241799299226\"},{\"slug\":\"2026-06-02-原来惠泉主力真的在出货呀-捂脸-我还\",\"year\":\"2026\",\"title\":\"原来惠泉主力真的在出货呀？[捂脸] 我还以为要拉升呢。 今天早上开盘，我看比昨天收盘的价格还高一些，当然要卖了。今天又卖出了好几万股。最高的价格还卖\",\"date\":\"2026-06-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天早上开盘，我看比昨天收盘的价格还高一些，当然要卖了。刚看今天上午的最低价已经到了12.72元？不好意思：大概率我昨天的主仓抛出的货，是甩给主力了。不过别着急，跌破12元，我再买回来就是了！昨天卖出的资金，还在账上没动，刚才花3.99元，买了150万股华菱钢铁回来，啤酒换钢铁，我认为值！两个月前6.7元，我赚钱不少了，却没有走，导致现在又亏了。大家别说我的操作好，我今天的账户，又是狂亏的。\",\"url\":\"https://www.zhihu.com/pins/2045109481516840758\"},{\"slug\":\"2026-06-02-四点钟占位置去图书馆学习-体制学生这么卷\",\"year\":\"2026\",\"title\":\"四点钟占位置去图书馆学习？体制学生这么卷的？ 【据说江苏的学生生病了，第一时间想的不是治病，而是在想耽误了学习怎么办。】 新教育的学生，在我们这里真\",\"date\":\"2026-06-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"四点钟占位置去图书馆学习？体制学生这么卷的？【据说江苏的学生生病了，第一时间想的不是治病，而是在想耽误了学习怎么办。】新教育的学生，在我们这里真的太舒服了。真想去体制卷？我看谁能赢。我和我孩子认输。我们卷不赢这群人！你们行。你们去吧！就怕去了不适应，又过来骂我们新教育没有给你们插上翅膀！\",\"url\":\"https://www.zhihu.com/pins/2045196714752136252\"},{\"slug\":\"2026-06-02-我一直说-劈挂拳很实用的-用来打泰拳很好\",\"year\":\"2026\",\"title\":\"我一直说：劈挂拳很实用的，用来打泰拳很好用，特别是个子大的，手长腿长很好用，再加上八极肘法，补上近身战，几乎无敌！甚至我跟木兰和公主们玩的时候。会用披挂的一些招\",\"date\":\"2026-06-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"可就是没有看到有人这样来打擂台，我觉得---不应该呀？我也看过国内的武术学校的老师，教学生打劈挂拳，就是一个套路，，打得很漂亮。但学生不知道咋用出来，我看：老师恐怕也不知道咋用！所以--大家一起划水，练套路，比动作！现在看到中国人在国外，教老外披挂，就把招式，打法都一起教出来了。我猜：如果这样下去，再过几十年，恐怕中国人要学功夫，也得去向洋人学习了！因为国内只有马保国，雷雷！\",\"url\":\"https://www.zhihu.com/pins/2045200923597788393\"},{\"slug\":\"2026-06-02-说明-我不是2018年6元多买入惠泉就死\",\"year\":\"2026\",\"title\":\"说明：我不是2018年6元多买入惠泉就死守到今天的。我这几年，来来回回的进出做的大波段至少五次以上了。小波段就不计其数了。好像网上有AI统计我的赢率是100%，\",\"date\":\"2026-06-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"不知这不是真的，我只是买了下跌死不卖。所以看起来惠泉是100%的赢率。最近一年多持有的惠泉十大，都是负成本持有的。所以，用来一比二换华菱的说法是不对的。如果你每次买入的股都是赚了再去买没有涨的股票，在市场轮动的情况下，你几乎就是必然赚钱的，只有有耐心，另外别买了垃圾股。其实惠泉不算是行业龙头的，我是看他的老板燕京是龙头。有个笨蛋说要去买兰州黄河，这个股亏死多少人，没去调查过吗？\",\"url\":\"https://www.zhihu.com/pins/2045141495771050670\"},{\"slug\":\"2026-06-02-转下面的一个家长回复-曾经自己35岁前\",\"year\":\"2026\",\"title\":\"转下面的一个家长回复： 曾经自己35岁前在商战，就是这样的可怜人。把自己身心健康搞丢失了，🏥检查各种指数超标，已经不能消化食物了。遇到德高望重92岁民间中\",\"date\":\"2026-06-02\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"转下面的一个家长回复：曾经自己35岁前在商战，就是这样的可怜人。把自己身心健康搞丢失了，🏥检查各种指数超标，已经不能消化食物了。遇到德高望重92岁民间中医爷爷：直接问我，想死还是想活？我想活，爷爷开的方子很简单：100天时间，每天每餐只能吃一小碗白水煮面。35岁按下暂停键，不想分裂，不想可怜的玩儿了。我有个升级基本的健康饮食方案：【100天时间，每天每餐只能吃一小碗白水煮面。\",\"url\":\"https://www.zhihu.com/pins/2045151139562272469\"},{\"slug\":\"2026-06-01-曾经重仓的惠泉-上回过了14元-我就不\",\"year\":\"2026\",\"title\":\"曾经重仓的惠泉， 上回过了14元，我就不断的卖掉。今天又快到14了，于是我又在卖卖卖了。我看这架势，已经退出10大了。除非再跌，我买回来！我用这个卖出来的钱，去\",\"date\":\"2026-06-01\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"准确地说，不是没有涨，而是中间涨了几次。而且惠泉还没有融资资格，可见市场对他很不感冒。我也只是赌一把，这几年赌赢了，我就用赢来的钱。就像惠泉当年我介入的时候，是因为它跌破6元了，这个价格，差不多也是上市以来20年的最低位置区间了。我判断再跌的空间不大了，可以用时间换空间。不过：现在的惠泉，快14元的价格，我就不想赌了！这个价格，属于历史高位区间，我见好就收算了，不要得利不让人。\",\"url\":\"https://www.zhihu.com/pins/2044890717860935230\"},{\"slug\":\"2026-06-01-英子做校长-才发现一点也不难吧-会哄着孩\",\"year\":\"2026\",\"title\":\"英子做校长才发现不难：哄着孩子开心走路就行，苦巴巴的学堂学啥新教育\",\"date\":\"2026-06-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"[开心]……\",\"url\":\"https://www.zhihu.com/pins/2044887903151575540\"},{\"slug\":\"2026-05-31-赞用最简单的方式-坚持每天走路-就把\",\"year\":\"2026\",\"title\":\"[赞]用最简单的方式，坚持每天走路，就把几年都没有变化的孩子改正过来？就能教会了孩子专注，静心，耐力，毅力。还有良好的体能。请问世界上还有什么课程，能够达到这么\",\"date\":\"2026-05-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"好的效果呢？清一义塾，大道至简。教育没有么么复杂的，复杂的是家长！就像是吃也没有那么复杂的，复杂的是吃的欲望！\",\"url\":\"https://www.zhihu.com/pins/2044517156679938118\"},{\"slug\":\"2026-05-31-啥民间高手-就是个骗子狗屁的墙上挂画-隔\",\"year\":\"2026\",\"title\":\"啥民间高手，就是个骗子狗屁的墙上挂画，隔山打牛！黑衣人就是个托。专门配合师父演出的。特别是隔山打牛---身形就是自己往后跳出去的。黄衣人是被忽悠的傻羊。师父真厉\",\"date\":\"2026-05-31\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"害，就让黑衣人去当山，黄衣人自己当牛。你去打飞黄衣人看？肯定没用。因为没学过配合。叹息；这种骗术就能骗过去很多国人，真是人傻钱多的国家！\",\"url\":\"https://www.zhihu.com/pins/2044345322130998326\"},{\"slug\":\"2026-05-31-期货-就不是人玩的东西-是神才能玩的\",\"year\":\"2026\",\"title\":\"期货，就不是人玩的东西，是神才能玩的！[捂脸]我做金融30多年了。虽然也开了一个期货的账户，但从未开单。不敢下手！承认自己不懂，无法掌控！我认为是股票靠谱一些。\",\"date\":\"2026-05-31\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我看错了也不会亏太多！期货一旦犯错，真的亏死你！几十年的身价，可以一晚上就亏光！爱护人生，远离期货或者只把期货用来作为实业的对冲工具，千万不要赌涨跌！\",\"url\":\"https://www.zhihu.com/pins/2044540795194183720\"},{\"slug\":\"2026-05-30-张清一-在中国会吃才能进步和成功\",\"year\":\"2026\",\"title\":\"张清一：在中国会吃才能进步和成功！\",\"date\":\"2026-05-30\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"这一切，都指向了---不会吃，你就不会在中国取得成功。而且---吃在中国的思想和意识上，将直接和你的一切人生重要时刻挂钩。方法很简单---好好去吃一顿就解决问题了！估计全世界都没有中国这样的吃文化---吃是一切生活和事业的灵魂和核心！也是一个可以用吃，来帮助自己提升高考成绩的好办法！也是“包你上岸”我看了这些特餐的名字。我已经悟出来了：在中国，你要获得事业的成功，有能力，有本事，只是基本操作。\",\"url\":\"http://zhuanlan.zhihu.com/p/2044308342340851415\"},{\"slug\":\"2026-05-29-可汗与其他权威机构合作做大学了-一个好消\",\"year\":\"2026\",\"title\":\"可汗与其他权威机构合作做大学了。一个好消息！对大学来说，是一个很坏的消息：它铁定会颠覆传统的大学。高收费却没有相应的实力！借助AI的帮助，可汗大学可以做到比这些\",\"date\":\"2026-05-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"大学更好的结果！“KhanTEDInstitute的毕业生成绩单上不会只有通识教育成绩，还将有沟通能力、说服力、创造力、韧性的评估结果。”KhanTEDInstitute不再用传统的四年制，而是只要能力通过评估达到要求后，就能进入下一个阶段的学习。要是学生很优秀，只需要三年甚至更短的时间就可以毕业。\",\"url\":\"https://www.zhihu.com/pins/2043813204791386200\"},{\"slug\":\"2026-05-29-清一义塾-每天走36.5公里的孩子有多凄\",\"year\":\"2026\",\"title\":\"清一义塾：每天走36.5公里的孩子有多凄惨？\",\"date\":\"2026-05-29\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我们来个最笨的方案：凡是愿意每天走36.5公里的学生，完成100天的任务后，我们就无条件录取入学！我说：现在的学生，特别是有资格申请今日三校的家庭的孩子，没几个是真笨的。她的孩子在这里其实表现不错，每天都按时完成任务，也很喜欢这里。这种眼里有光，积极上进，阳光积极的孩子，全中国的学校，你去哪里找？比如义塾的学生，每天都要“强迫”走36.5公里，还要连续走100天。\",\"url\":\"http://zhuanlan.zhihu.com/p/2043663690768045038\"},{\"slug\":\"2026-05-28-喜欢这样的正餐方式-简单有效-中国人-吃\",\"year\":\"2026\",\"title\":\"喜欢这样简单的正餐：中国人吃得太累，做的人累吃的人也累\",\"date\":\"2026-05-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2043398532007298248\"},{\"slug\":\"2026-05-28-如何教育十四五岁满身死气沉沉的学生\",\"year\":\"2026\",\"title\":\"如何教育十四五岁满身死气沉沉的学生？\",\"date\":\"2026-05-28\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我女儿，据别人说，是非常阳光和大气的小孩！但我要送她去体制学校上学几年，大概率她也是抑郁的，死气沉沉的小孩！因为上课学的内容，并不是自己需要的，也不是自己感兴趣的。很简单的，正常智力只需一个月就能学完的东西，非要你慢慢的磨，要学几年，而且学习的方式，还特别变态和辛苦。当一个人迷茫，失去目标的时候，当然就是死气沉沉的。换了任何人，去这样的学校坚持上学，我看都会是这样死气沉沉的吧？\",\"url\":\"https://www.zhihu.com/question/14323683509/answer/2043268837823484512\"},{\"slug\":\"2026-05-28-官场如战场捂脸\",\"year\":\"2026\",\"title\":\"官场如战场[捂脸]\",\"date\":\"2026-05-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2043301249936790482\"},{\"slug\":\"2026-05-28-微信正在悄悄杀死我们的深度思考能力-真是\",\"year\":\"2026\",\"title\":\"微信正在悄悄杀死我们的深度思考能力 真是个聪明人[赞]原来我不用微信不是孤例。大家也学习一下，在信息世界中保护好自己。\",\"date\":\"2026-05-28\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"微信正在悄悄杀死我们的深度思考能力真是个聪明人[赞]原来我不用微信不是孤例。大家也学习一下，在信息世界中保护好自己。\",\"url\":\"https://www.zhihu.com/pins/2043304908632364261\"},{\"slug\":\"2026-05-28-教育是把一个材料-变成有价值的“才”-是\",\"year\":\"2026\",\"title\":\"教育是把一个材料，变成有价值的“才”，是一项几乎无限可能的增值服务。 但家长只把学校当成一台机器，负责灌输知识。 的确体制学校就是这样的机器，但新教\",\"date\":\"2026-05-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"教育是把一个材料，变成有价值的“才”，是一项几乎无限可能的增值服务。但家长只把学校当成一台机器，负责灌输知识。的确体制学校就是这样的机器，但新教育，是让孩子成为一个有价值的人！如果家长坚持当机器，不当人，我们其实是没办法的！我们培养除了人，家长还认为培养错了！小明慧不肯去“找一个工作”，不愿意去拿打工证，不肯去跟别人一样过日子，有自己的独立思考，在很多家长看来就是失败的教育结果！\",\"url\":\"https://www.zhihu.com/pins/2043303025868018066\"},{\"slug\":\"2026-05-27-人性的劣根性-就见不得别人-特别是自己的\",\"year\":\"2026\",\"title\":\"人性劣根性：见不得亲人好；人民教师或最自我中心\",\"date\":\"2026-05-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2043033081070735930\"},{\"slug\":\"2026-05-27-体育就是美国人的社交暗号-赞因为体育\",\"year\":\"2026\",\"title\":\"体育就是美国人的社交暗号。[赞]因为体育在美国的社会里是硬通货。 我相信未来中国也是这样的，体育文化正在兴起。国家经济发达之后的必然现象！\",\"date\":\"2026-05-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"体育就是美国人的社交暗号。[赞]因为体育在美国的社会里是硬通货。我相信未来中国也是这样的，体育文化正在兴起。国家经济发达之后的必然现象！\",\"url\":\"https://www.zhihu.com/pins/2042978340244653682\"},{\"slug\":\"2026-05-27-如何看待沈阳外卖单王买奥迪\",\"year\":\"2026\",\"title\":\"如何看待沈阳外卖单王买奥迪？\",\"date\":\"2026-05-27\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"这个人，就是中毒很深的“物权思维人”。注定一辈子只能在底层打滚的，因为他会把宝贵的，把自己从底层拯救出去的机会。拿去给自己套上一层更厚实的狗链子。 只有懂得用时间和金钱去买“股权”的人，才会摆脱人生被资本控制的命运……\",\"url\":\"https://www.zhihu.com/question/2036185311252845010/answer/2043075759124767217\"},{\"slug\":\"2026-05-27-当年同学-似乎大家都一样-但几十年后-天\",\"year\":\"2026\",\"title\":\"当年同学似乎一样，几十年后天上地下\",\"date\":\"2026-05-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2043081868455720129\"},{\"slug\":\"2026-05-26-中粮糖业快跌破13元了-目测主力已经放\",\ 12年课程，四年达到优等生程度！\",\"url\":\"http://zhuanlan.zhihu.com/p/2038454377602621949\"},{\"slug\":\"2026-05-13-作者写出来的这篇心得很不错-对各种拳派的\",\"year\":\"2026\",\"title\":\"作者写出来的这篇心得很不错，对各种拳派的介绍也很实在，的确是练家子的体会，推荐给我们的朋友看看！能够让大家更了解世界各国格斗的区别和联系。不过我个人对作者认为：\",\"date\":\"2026-05-13\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"传武就是打预案，打偷袭的说法，有点不同意见！我认为传武是一套格斗思路和哲学与现代格斗都不一样的格斗体系。但练出来之后，传武是可以适应擂台的规则去打的，而且场上会拥有明显的优势，会让现代格斗手完全摸不着头脑，不知道怎么应对，然后就败了！我们用传武去打比赛，去年一个人进入国家队，就一路过关，拿到了泰拳世界冠军。其中我们的一个队员，来国内集训的前一天，在泰国职业赛场，刚把一个美国人KO了。\",\"url\":\"https://www.zhihu.com/pins/2037954261292693037\"},{\"slug\":\"2026-05-13-如何评价网络统计男方失业超过一年-女方提\",\"year\":\"2026\",\"title\":\"如何评价网络统计男方失业超过一年，女方提出离婚概率超80%？\",\"date\":\"2026-05-13\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"现在的人，可能都没啥感情可言，双方结合，就是一个生意。男人失去了经济来源，就被判为负资产，当然会被放弃了。家长如果明白了这个道理，只能让男孩从小就努力上进，先立业，才能成家。女人如果不想完成繁殖任务，也会被男人判为负资产，也会被放弃的！当然，女人如果能够帮助男人事业成功，这种女人就是极品女人。不过话又说回来：能够帮助男人事业成功的女人，自己要成功肯定更没问题，她为啥需要个男人为男人服务呢？\",\"url\":\"https://www.zhihu.com/question/10293981041/answer/2037820708991014522\"},{\"slug\":\"2026-05-13-这个太极不错-比全运会超级惊艳的太极比赛\",\"year\":\"2026\",\"title\":\"这个太极不错，比全运会超级惊艳的太极比赛，看着要舒坦多了。流水不争先。但这人去全运会比赛，肯定拿不到奖[捂脸]。我也一样，看上去就是老头摸鱼。还摸得不好看。原来\",\"date\":\"2026-05-13\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"还从来没见过有发力的吴式太极，这个人应该懂发力。比大多数玩太极的大师要高明多了。陈氏的几个金刚大师，应该没人比得上他的太极功夫深。不过别人比他会收徒弟[大笑]。\",\"url\":\"https://www.zhihu.com/pins/2037868814575068514\"},{\"slug\":\"2026-05-12-在长沙-像这样提供男公关服务的场所-保\",\"year\":\"2026\",\"title\":\"【在长沙，像这样提供男公关服务的场所，保守估计有三十家以上。】 原来男色消费在国内已经这么发达了[捂脸]。  过分宠爱女儿的父母们，把女儿培养\",\"date\":\"2026-05-12\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【在长沙，像这样提供男公关服务的场所，保守估计有三十家以上。】原来男色消费在国内已经这么发达了[捂脸]。过分宠爱女儿的父母们，把女儿培养成消费者的家长们，将来你们不过是培养了一个“男色消费者”罢了，没有情感能力的女人，却有强烈的情感需求的女人，就只能去酒吧里面用钱来泡男色了。不过，越泡男色，越无法得到正常的男女情感关系。就像男人不可能通过泡妓院就能学会建立良好的两性关系一样。\",\"url\":\"https://www.zhihu.com/pins/2037570417754387553\"},{\"slug\":\"2026-05-12-为什么现在的有的女生不愿意结婚了\",\"year\":\"2026\",\"title\":\"为什么现在的有的女生不愿意结婚了？\",\"date\":\"2026-05-12\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"大多数没啥本事，无法自立，或者不愿意自立的女性。相反：能够经济独立的女性，也比较自强的女生，对男人的这一条可能不是太在意，她们更重视男人是否拥有后面更高级的条件。在一个男人们愿意为性服务买单的社会上，女性的性服务，无疑是有一定价值的。不过，这个价值也不是太高，除了一些脑子不开化的男人，愿意为女人的性服务支付巨大的代价外，大多数男人都知道：女人的性服务价值，不会高于妓女的价格。\",\"url\":\"https://www.zhihu.com/question/527899854/answer/2037470986442946486\"},{\"slug\":\"2026-05-11-2016年一季度-全国有345万对婚姻登\",\"year\":\"2026\",\"title\":\"2016年一季度，全国有345万对婚姻登记，700万人走入婚姻。一年下来，有2285万人走入婚姻。这一年，有1883万人出生。这批人明年就有要考今日三校的学生了\",\"date\":\"2026-05-11\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"2026年一季度，全国结婚登记169.7万对只剩下一半了。生育数字，也许更低吧？今年肯定出生人口，赶不上2016年的一半了！一半就是900多万人，肯定不行了。还有就是离婚率的统计：据说结婚的人中，有一半以上，将以离婚结束关系。其中70%的都是女方提出的离婚！婚姻关系，已经不再是一个人必须的选项了。家庭也变成了“独身家庭”模式。未来是我们看不懂的未来、社会发展方向，肯定和传统不一样了……\",\"url\":\"https://www.zhihu.com/pins/2037079696404374871\"},{\"slug\":\"2026-05-11-三个月突破N1-几乎就是不可思议的成绩\",\"year\":\"2026\",\"title\":\"三个月突破N1，几乎就是不可思议的成绩，证明人的潜力真的很大！古人教的定和静的功夫，真的很有价值[赞]\",\"date\":\"2026-05-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2037084750658154904\"},{\"slug\":\"2026-05-10-这个角度谈传武有点道理-学过的肯定能击败\",\"year\":\"2026\",\"title\":\"这个角度谈传武有点道理。学过的肯定能击败没学过的。不过也不能说传武就是打没练过的弱者的技术。过去真的专业一点的传武人，不仅仅是练招式的。也要练功力的。现在传武打\",\"date\":\"2026-05-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"不赢现代格斗，不是因为技术不行，而是练得太差了，强度不够。因此遇到练过的人用不出来。一旦练好了，一招云手，就可以封住几乎所有的攻击。但要练好难度很大，很多人坚持不下来的。拳击直勾摆，专业运动员每天都要对着沙袋挥拳数千次。如果你只是每个周末去公园随便挥几下拳，打打空击，你练啥功夫都不行的！都不能打的！因此不是传武有问题，是练传武的人有问题！\",\"url\":\"https://www.zhihu.com/pins/2037069139521566536\"},{\"slug\":\"2026-05-10-高考不能取消“各省为战”-全国同一标准\",\"year\":\"2026\",\"title\":\"高考不能取消“各省为战”，全国同一标准，择优选拔的原因何在？阻力何在？\",\"date\":\"2026-05-10\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我很奇怪的是：你们关心这种你们根本没有发言权的内容有啥意义？你想要个性，可以去考海外的高考，天高任你飞。成天在这里幻想----为啥国家高考就不照顾你的个性，有意思吗？就算每个省自己考，你难道就有本事赢过你的本省人吗？其实很多海外国家就是这样的：不需要啥国考，省考的。中国的三流大学也一样---高考多少分都能上，只要你家长愿意给钱就能上大学。好大学---考什么你都必须赢过你的竞争对手才能上。\",\"url\":\"https://www.zhihu.com/question/14831060290/answer/2036722050090398894\"},{\"slug\":\"2026-05-09-张清一-成功与失败不是路径选择的结果\",\"year\":\"2026\",\"title\":\"张清一：成功与失败不是路径选择的结果\",\"date\":\"2026-05-09\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"路径与成败无本质关系，更核心的是与个人的价值体系关联度更大！体制内的确很难成功，但也很难说人生会失败---只是更容易平庸罢了。不可能上了新教育，但本质上是偷懒，躺平的心态，这种人，在哪里都是失败者，只是在新教育期间，容易让人误以为是“成功者”了！我对比这次国家队和我们队员的训练内容，方式，结果，就能看到：为什么我们的队员一旦放弃之后，比体制拳手更容易失败了？李想和ELLA的冠军机会，是师姐让赛的。\",\"url\":\"http://zhuanlan.zhihu.com/p/2036362092870119446\"},{\"slug\":\"2026-05-07-2月27日-是今年来燕京啤酒股东人数最低\",\"year\":\"2026\",\"title\":\"2月27日，是今年来燕京啤酒股东人数最低的一天。只有4万2千多人，股价是12.92元！ 4月30日，收盘价是13.30元。但股东人数涨了50%。居然有6万\",\"date\":\"2026-05-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"2月27日，是今年来燕京啤酒股东人数最低的一天。4月30日，收盘价是13.30元。也就是说：主力把高价买来的筹码（期间冲高14元多），低价12元多，卖给了散户（最低12.49元）。这次在12元上方，我又买回了两百多万股。不过我不会买超量的，超过我14元上方卖出的量就是贪婪了。14元上方的燕京，惠泉，我认为还是卖掉好。12元以及下方的燕京惠泉，我认为捡回来好。如果市场不给我捡回来的机会，我就放弃了。\",\"url\":\"https://www.zhihu.com/pins/2035668315054547433\"},{\"slug\":\"2026-05-07-意外看到-海川智能-70元一股-市盈\",\"year\":\"2026\",\"title\":\"意外看到---海川智能  70元一股，市盈率500多倍。我以为是啥高科技呢。原来是卖秤的。 高科技秤，能有多少需求呀？ 股民买这个冷僻的公司，花了这\",\"date\":\"2026-05-07\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"意外看到---海川智能 70元一股，市盈率500多倍。我以为是啥高科技呢。原来是卖秤的。高科技秤，能有多少需求呀？股民买这个冷僻的公司，花了这个价，500年回本。您真以为自己是孙猴子呀？喜欢在山下困500年？\",\"url\":\"https://www.zhihu.com/pins/2035842760624838270\"},{\"slug\":\"2026-05-07-铜陵有色控股72的一家子公司-铜冠铜\",\"year\":\"2026\",\"title\":\"铜陵有色控股72%的一家子公司--铜冠铜箔。市值有750亿了。股价是每股88元---不可思议。 而庞大得多的母公司，市值只有800多亿。股价才6元多。\u003cb\",\"date\":\"2026-05-07\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"铜陵有色控股72%的一家子公司--铜冠铜箔。股价是每股88元---不可思议。而庞大得多的母公司，市值只有800多亿。偏有这么多人冲进去，最近五个交易日的涨幅，居然有79%了。如果铜陵有色有一天也像铜冠铜箔一样疯起来，会不会也会涨到我目瞪口呆？甚至连一半我都拿不到，我缺乏这种心想象力！而且：一旦我重仓后，我发现股票往往就不涨了，等我卖掉就会狂涨。它可好---直接涨到20元了，我只能看了！\",\"url\":\"https://www.zhihu.com/pins/2035649024280229611\"},{\"slug\":\"2026-05-06-“普通人-尽量不要去接触不属于你的那个阶\",\"year\":\"2026\",\"title\":\"“普通人，尽量不要去接触不属于你的那个阶层的有钱人”你怎么看？\",\"date\":\"2026-05-06\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"如果你想做普通人，当然就不要去接触高于自己的能量！如果你想改变命运，那么你死也要站在比你更高层次的人堆里面！不然你就会成为他们的耗材。普通人提高自己最好的方式，就是读高人的书籍。这些高人不会见你的。但你可以通过书籍与他们对话，比如世界首富！如果普通人，有机会认识比自己父母级别要高得多的人，最好的办法就是谦虚的去学习和接近。而不是傲慢的远离！当然---不想改变命运。就被命运改变吧！\",\"url\":\"https://www.zhihu.com/question/527636810/answer/2035379268964889955\"},{\"slug\":\"2026-05-06-今天中金岭南涨停-我没有卖出-一股都没\",\"year\":\"2026\",\"title\":\"今天中金岭南涨停。 我没有卖出，一股都没卖。 不过我卖掉了另外一个涨停股---潍柴动力。现在只剩100股了。涨了一倍了。 最近有色下跌期间，我\",\"date\":\"2026-05-06\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我没有卖出，一股都没卖。不过我卖掉了另外一个涨停股---潍柴动力。最近有色下跌期间，我认为是一次难得的调整，因此补仓了很多有色的仓位。我认为：美元霸权的消失过程中，有色是长期可靠的后盾。我很奇怪：当初股票9元多出来抢的大把的人。当然，我也特别感谢上一轮疯狂冲击高峰的白银有色，我高位全部卖掉了。才两块多的成本，十几元卖掉，当然划算了！后来全买了铜，锌等矿业，仅仅铜业，就增持了上千万。\",\"url\":\"https://www.zhihu.com/pins/2035379405372008005\"},{\"slug\":\"2026-05-06-印度的一个实验国家动用顶级资源-将贫民窟\",\"year\":\"2026\",\"title\":\"印度的一个实验:国家动用顶级资源，将贫民窟的孩子送进最好的私立学校，配备一流的师资。结果如何?在不到一年的时间里，将近一半的孩子选择主动退学。原因不是学业跟不上\",\"date\":\"2026-05-06\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"而是他们无法承受那种环境带来的剧烈认知撕裂。精英教育看样子天生是不适合穷人的。我们这里就有个学生，因为成绩优异，个性乖巧。从小就有家长接力付费支持她上学，我也是接力的人一个。估计是长大以后（18岁了），在思维价值观背景上，和其他中产阶级的孩子相比，总是格格不入的吧？中产的孩子勤奋努力，这孩子一脸的慵懒相。她表示：还是要去社会上历练---其实是她想追求过普通人的生活，蛮好的！\",\"url\":\"https://www.zhihu.com/pins/2035376668483829922\"},{\"slug\":\"2026-05-06-我原来预期五粮液今天跌停的-今天一看\",\"year\":\"2026\",\"title\":\"我原来预期五粮液今天跌停的！ 今天一看，跌了5-7%。说明“超预期”，好事。 我看有些雪球大V就抢进去了--抄底五粮。 我猜：散户也不少冲进去\",\"date\":\"2026-05-06\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我原来预期五粮液今天跌停的！我看有些雪球大V就抢进去了--抄底五粮。年报和一季报，从ICU到KTV，实在是惊人的反转！不过，聪明人一定“躲远点”所谓的物怪则妖！如果五粮液真的基本面很好，犯不着年报来个大雷清洗账目。如果主力真的“想抄底五粮”，犯不着来个超预期的一季报。如果去年的年报，可以人为的作假，业绩做高，或者做低的。那么：你怎么相信，一季报的好消息就一定是真的？\",\"url\":\"https://www.zhihu.com/pins/2035336472526578557\"},{\"slug\":\"2026-05-05-2025-年高考-为啥大家反应冷淡得出奇\",\"year\":\"2026\",\"title\":\"2025 年高考，为啥大家反应冷淡得出奇？\",\"date\":\"2026-05-05\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"5000万人阅读了这个主题高考，大学，难道一定要在真的完全找不到工作的时候才开始着急吗？这种情况的出现，其实早就可以预期了。只是现在大家才普遍发现不过：再过几年，大家就会看到---大学关闭的速度会越来越快了。中国关闭一半的大学都不奇怪。因为本来就是混日子的，现在没法混日子了而已，没啥原因的！现在，大家都现实了很多！如果连喝酒都只喝普通的酒类了。难道高考的智商税就收得到了？\",\"url\":\"https://www.zhihu.com/question/1914745444505977568/answer/2034933518158054714\"},{\"slug\":\"2026-05-05-现在免费的钢琴都不一定好卖-哈哈\",\"year\":\"2026\",\"title\":\"【现在免费的钢琴都不一定好卖。】 哈哈，25年前，儿子的幼儿园教师让我买钢琴的时候，我拒绝了。认为这学钢琴很无聊，不如用发烧设备，听钢琴大师的演奏。\u003cbr\",\"date\":\"2026-05-05\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【现在免费的钢琴都不一定好卖。】哈哈，25年前，儿子的幼儿园教师让我买钢琴的时候，我拒绝了。认为这学钢琴很无聊，不如用发烧设备，听钢琴大师的演奏。虽然后来买了一台雅马哈三角钢琴，丢在国内的别墅里面。是用来给女塾学生玩的，根本不开设啥钢琴课程！以为钢琴可以换来某种有价值素质，就是你想多了。这是智商税！可笑的是：现在的人，20多年后，才终于反应过来了[大笑][大笑][大笑]……\",\"url\":\"https://www.zhihu.com/pins/2035028067249299883\"},{\"slug\":\"2026-05-05-让火锅和萨莉亚利润下滑的-并非其他-而\",\"year\":\"2026\",\"title\":\"【让火锅和萨莉亚利润下滑的，并非其他，而是中国人的社交活动开始萎缩】 当社交不带来收益的时候，这种社交当然就会被放弃 现在其实谁都没有多少发展的机会\",\"date\":\"2026-05-05\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【让火锅和萨莉亚利润下滑的，并非其他，而是中国人的社交活动开始萎缩】当社交不带来收益的时候，这种社交当然就会被放弃现在其实谁都没有多少发展的机会了。机会锁死的情况下，聚会餐饮模式就必然消亡。泰国就是这样的国家。很少有聚会的模式。都是单人，双人消费模式。偶尔的聚会，常常在家里。餐馆---其实没有多少需要……\",\"url\":\"https://www.zhihu.com/pins/2034937186064320045\"},{\"slug\":\"2026-05-05-我和男朋友说生孩子是他亏欠我的-之后他给\",\"year\":\"2026\",\"title\":\"我和男朋友说生孩子是他亏欠我的，之后他给我回了这么一大段，是我的问题吗？\",\"date\":\"2026-05-05\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"既然这个世界上，谁来照顾你，谁愿意关爱你，谁就是亏欠了你。那么：最好的办法，就是谁都不欠谁的，您一个人过好了！这样双方相望于江湖，不需要相濡与沫。这样双方都更自由了，你也不需要“牺牲”了？这样不更好吗？我总算明白清黑是怎么来的了？因为这种品种的人种，似乎还真不少。特别是女人：认为她来到这个世界，谁都是亏欠她的！\",\"url\":\"https://www.zhihu.com/question/610789734/answer/2034984985636160372\"},{\"slug\":\"2026-05-05-积累财富需要半生时间-但是败光财富只需一\",\"year\":\"2026\",\"title\":\"积累财富需半生，败光只需一次错误选择\",\"date\":\"2026-05-05\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2034957833809213136\"},{\"slug\":\"2026-05-04-如何看待太极拳专业新增入本科专业\",\"year\":\"2026\",\"title\":\"如何看待太极拳专业新增入本科专业？\",\"date\":\"2026-05-04\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"太极拳，作为大学本科专业，被国家正式列为【科班专业体系】。这样的话，清一大学自办的【太极专业】，也有了国家认可的【专业学术地位】。就是不知道这些国家认定并大量拨款的大学，培养出来的太极拳专业本科学生，甚至硕士，博士们，他们掌握的太极水平，到底是个啥本质？但我知道：清一大学的太极专业第一：在武力值上，可以批量培养出具有格斗实战能力的全国冠军，甚至世界冠军！第二：太极是哲拳，是拥有文化底蕴的非遗。\",\"url\":\"https://www.zhihu.com/question/2033836654117569346/answer/2034587934133835763\"},{\"slug\":\"2026-05-03-和我妈这样的女性打交道我就非常摸不着头\",\"year\":\"2026\",\"title\":\"【和我妈这样的女性打交道我就非常摸不着头脑，】 这是女人的控制欲表现，用驾驭爱自己的人，或者比自己弱小的人，来彰显自己的存在和价值感！ 无能的女人，\",\"date\":\"2026-05-03\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"【和我妈这样的女性打交道我就非常摸不着头脑，】这是女人的控制欲表现，用驾驭爱自己的人，或者比自己弱小的人，来彰显自己的存在和价值感！无能的女人，就喜欢用生育价值----我为你【生儿育女】了来控制男人。没有生儿育女，就喜欢用“性”来控制男人---我把身体交给你了！所以：我建议聪明的富二代们，要不娶真正优雅的公主，要不娶老挝，泰国的女人。千万不要娶这种女人，可怕！我是见识过的，真拿她们没办法。\",\"url\":\"https://www.zhihu.com/pins/2034301274817029230\"},{\"slug\":\"2026-05-03-如何看待“嫌彩礼高的-有本事你自己生孩子\",\"year\":\"2026\",\"title\":\"如何看待“嫌彩礼高的，有本事你自己生孩子”这句话？\",\"date\":\"2026-05-03\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"男人回怼的话，也很容易：是母鸡就会下蛋。另外：告诉各位男人一句话孩子跟你姓，不意味着孩子就是你的！一次她妈妈突然生气，对我“拳打脚踢”一顿。然后等她妈妈不打了，她就走过来，非常严肃的对我说：你以后再也不许打妈妈了！结果小家伙不相信，转头去看妈妈要答案（显然不相信我的诡辩）。结果小家伙回头看我一眼，差不多是“活该”的眼神。所以----孩子真的是女人的，不是父亲的！\",\"url\":\"https://www.zhihu.com/question/2028132113812137472/answer/2034304421958525423\"},{\"slug\":\"2026-05-03-闭关不限饮食减肥-三个月掉18公斤-算\",\"year\":\"2026\",\"title\":\"闭关不限饮食减肥：三个月掉18公斤？ 算是你们收到的意外礼物吧，减肥不在闭关营的目标范围内 恭喜同学们取得良好的进步，我相信未来的闭关营会成为更多\",\"date\":\"2026-05-03\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"闭关不限饮食减肥：三个月掉18公斤？算是你们收到的意外礼物吧，减肥不在闭关营的目标范围内恭喜同学们取得良好的进步，我相信未来的闭关营会成为更多新人的选项的。习惯与自己相处，是很多人一辈子都没有做到的事情。\",\"url\":\"https://www.zhihu.com/pins/2034298000269386637\"},{\"slug\":\"2026-05-02-从大数据统计来看-标准化信托从设立到灭\",\"year\":\"2026\",\"title\":\"【从大数据统计来看，标准化信托从设立到灭失的时间，大多不超过二十年。】  香港投资移民，7年。大多数人是委托“证劵公司专业人士”来打理的，因为自己不\",\"date\":\"2026-05-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"【从大数据统计来看，标准化信托从设立到灭失的时间，大多不超过二十年。】香港投资移民，7年。大多数人是委托“证劵公司专业人士”来打理的，因为自己不懂。但结果：往往是几年内亏损50%以上。家族信托：其实只是金融大鳄手里的另外一种收割富人的工具罢了！所以：我也只能自己培养人来接管家族资金，不可能交给这些金融专业人士。\",\"url\":\"https://www.zhihu.com/pins/2033936391864840949\"},{\"slug\":\"2026-05-02-最近宇树科技的创始人王兴兴可真是一语惊\",\"year\":\"2026\",\"title\":\"【最近宇树科技的创始人王兴兴可真是一语惊人!他毫不客气地吐槽：\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"指望着机器人干家务，那纯粹是想多!\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"就这一句话，瞬间把家用机器人身上的泡沫给戳破了。身为90后的\",\"date\":\"2026-05-02\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"【最近宇树科技的创始人王兴兴可真是一语惊人!他毫不客气地吐槽：\\\"指望着机器人干家务，那纯粹是想多!\\\"就这一句话，瞬间把家用机器人身上的泡沫给戳破了。】可惜的是：中国的家长，从小培养孩子去做机器人很容易被取代的工作（背百科全书），可是对基本的，最能训练孩子能力的家长和日常生活做事，却非常的轻视，认为没有价值！所以：我认为家长们需要的是一个机器人一样的孩子！跟我家的需要不一样……\",\"url\":\"https://www.zhihu.com/pins/2034034408282440569\"},{\"slug\":\"2026-05-02-的确-穷人的问题-就是不自知-因此沦为\",\"year\":\"2026\",\"title\":\"的确：穷人的问题，就是不自知。 因此沦为单向被收割的对象。\",\"date\":\"2026-05-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"的确：穷人的问题，就是不自知。因此沦为单向被收割的对象。\",\"url\":\"https://www.zhihu.com/pins/2033905408998365106\"},{\"slug\":\"2026-05-01-在青岛的国家集训队-李建平老师亲自带队伍\",\"year\":\"2026\",\"title\":\"在青岛的国家集训队，李建平老师亲自带队伍，他的弟子执教严格，请了三个泰国的教练。这里每天早上5点起床。晚上9：30结束训练。每天训练时间长达8小时，我必须每天跟\",\"date\":\"2026-05-01\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"训，全程陪同队员一起训练。根本没有多少自由时间，今天五一，放了半天的假，我可以放松一下，看看股票玩儿！看到五粮液的最新报表，我觉得：这才是真正的暴雷呢。很多只会看报表的投资人，纷纷表示五粮液值得投资。果然：昨天的一季报，压低底最后一天，最终消息出来了。所以---真是的股息率，只有两个点，而且未来可能更多，这样架势，你说100元稳得住吗？意味着这五年，主力其实一直都在跑路，散户接盘成功了。\",\"url\":\"https://www.zhihu.com/pins/2033531702396576954\"},{\"slug\":\"2026-05-01-女人就是不理性的生物-给了浪漫-她要实\",\"year\":\"2026\",\"title\":\"女人就是不理性的生物。 给了浪漫，她要实在。给了实在---她要浪漫 所以：我认为女人其实应该嫁四个男人。才能满足要求。 一个强悍硬派的大男人-\",\"date\":\"2026-05-01\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"给了实在---她要 分红2元，还要回购50-100亿。明白说管理层认为格力股票太低估。因此市\",\"date\":\"2026-04-29\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"场反应过来了，股票也从36元多，直接涨过了40元！我虽然格力的货已经吃饱了，毕竟给了这么长的时间吃或。我在跌破37元的时候，一直有机会就买买买，但还是觉得遗憾---本来觉得我的啤酒涨了，冠农也涨了不少，正想拿来换格力呢。但从今天的走势看，格力应该回不到36-37元了。有人说：【格力大反轉主要還是因為子品牌晶弘搶了很多華凌和小米線上的市場份額，以及奧克斯等雜牌的線下市場份額。\",\"url\":\"https://www.zhihu.com/pins/2032799258185872480\"},{\"slug\":\"2026-04-29-庄子的话真好-不龟手之药-有人拥有药方的\",\"year\":\"2026\",\"title\":\"庄子的话真好：不龟手之药，有人拥有药方的好处。但一辈子只会用来洗衣服。 有人用来献给君王。用于建功立业，裂土封侯。 不是能力问题，而是思维问题：\u003cb\",\"date\":\"2026-04-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"庄子的话真好：不龟手之药，有人拥有药方的好处。但一辈子只会用来洗衣服。不是能力问题，而是思维问题：同样拿了世界冠军，有人只有唯一的出路，就是当教练，打工一辈子。同样的能力，用于服务和满足不同人群的需要，就能成为不同的命运。不龟手之药，用来服务洗衣服的人，只能获取基本的生活费。最终你的命运，是你服务的“顾客”的档次，决定了你拥有的技能的价值！就像某些武者，拥有一身武功，但只能用于公园健身。\",\"url\":\"https://www.zhihu.com/pins/2032885853857501665\"},{\"slug\":\"2026-04-29-昨天刚说了金针探底-这股要涨-是右侧高手\",\"year\":\"2026\",\"title\":\"昨天刚说了金针探底，这股要涨。是右侧高手入货的时机。 今天冠农果然大涨了6%。真的太给我面子了。 毕竟咋家原来真做过右侧人的，看盘这点眼光，还是有的\",\"date\":\"2026-04-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"昨天刚说了金针探底，这股要涨。是右侧高手入货的时机。今天冠农果然大涨了6%。真的太给我面子了。毕竟咋家原来真做过右侧人的，看盘这点眼光，还是有的。只是现在我改了，改做吃力不讨好，守股如守寡，苦巴巴熬日子的左侧投资人了。看懂对我也没啥收益，就是一股不卖，守住了收益。这就够了。这一天下来，也多了很多浮盈呢。今天啤酒也在涨。账面很好看。也许，我会择机卖掉一点货，守住利润的。\",\"url\":\"https://www.zhihu.com/pins/2032879299150213470\"},{\"slug\":\"2026-04-29-正在想-大名鼎鼎的牛散洪泽君-去年四季度\",\"year\":\"2026\",\"title\":\"正在想：大名鼎鼎的牛散洪泽君，去年四季度进入冠农的十大。虽然身价20亿以上的他，持仓仅仅几百万股，几千万市值。但他的动向，一向是谋定而后作。难道是他得到了什么消\",\"date\":\"2026-04-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"息吗？结果却是一场空，一季度他居然就消失了。好奇怪。二季度就快速上涨的他，在涨升前精准逃底，这样的牛散也就不过如此而已。我主仓几乎没动，依然大仓持有冠农，目前浮盈已经超过中糖糖业了。果然---涨得慢，我才会赚钱。涨太快了，我就拿不住了！\",\"url\":\"https://www.zhihu.com/pins/2032889741188789169\"},{\"slug\":\"2026-04-29-生命应该还有半年-晚期胃癌-不想治了-手\",\"year\":\"2026\",\"title\":\"生命应该还有半年，晚期胃癌，不想治了，手里还有七万块钱，应该去哪里旅游才能不让生命浪费？\",\"date\":\"2026-04-29\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\", L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我身边是六名全国泰拳冠军，我们正在去全国集训的路上。重庆其实算是我的“娘家”，这里是我外婆的老家，上次来重庆，是我7岁的时候生活过一个月的样子。还有就是重庆这里的人似乎每天都吃面，街上到处是面馆。我外公当年长江边的街道上还有房子，被日本人的飞机烧掉了。我还有一个没见过面的舅舅，在长江游泳的健将。就是还没有赚钱[耶]在旅馆住下来之后，就带李想小冠军去当保镖，去逛了一下重庆的街。\",\"url\":\"https://www.zhihu.com/pins/2031836159261792057\"},{\"slug\":\"2026-04-26-现在女性的生存如此艰难是什么原因促成的\",\"year\":\"2026\",\"title\":\"现在女性的生存如此艰难是什么原因促成的?\",\"date\":\"2026-04-26\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"这个回答里面的女子，拥有的思维方式和正常人不一样，基本上就是消费者。仔仔的回答-知乎现在女性的生存如此艰难是什么原因促成的?她们对自己生活的抱怨，不满，就如同消费者对服务的挑剔一样正常。比如会抱怨“现在厨师东西怎么做的，怎么都不好吃”一样。是她们对周围应该给她们更好的消费要求和愿望！如果我们成为了某人的消费对象，就是她眼中的【鸡鸭鱼】，怎么可能对我们有情有义？\",\"url\":\"https://www.zhihu.com/question/1917306245192329182/answer/2031652038883397954\"},{\"slug\":\"2026-04-25-今日公主风采-下擂台能打-上工地能干\",\"year\":\"2026\",\"title\":\"今日公主风采：下擂台能打，上工地能干！\",\"date\":\"2026-04-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"第一件事是清迈两层的公主楼，要浇筑第二层的水泥柱子。需要人工帮忙，公主们知道后，就极力要求参加，因为几年前疫情期间，这是明慧，ELLA等几个小公主才做过的事情。于是，冠军班的男生都没有得到机会，这次的活全让公主们抢了。在泰国工人的带领下，浇筑完了全部的柱子。不然公主们就必须在40度的高温中工作了。第二件事，就是ELLA公主今晚去清迈拳场打职业赛事，对手是一个美国白人拳手，实力不俗。\",\"url\":\"http://zhuanlan.zhihu.com/p/2031509406177870020\"},{\"slug\":\"2026-04-25-华谊兄弟从影视巨头沦为被申请重整-一家曾\",\"year\":\"2026\",\"title\":\"华谊兄弟从影视巨头沦为被申请重整，一家曾坐拥半个娱乐圈的公司，为何会在短短几年内走到破产边缘？\",\"date\":\"2026-04-25\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"到今天的40多亿的市值，800多亿金融资产灰飞烟灭。对于将要进入文化领域投资的清一家族来说，明白这一点至关重要。一旦企业造不出人民需要的精神产品，亏损就会出现。这不是靠资本大量投入，就能扭转局面的，而要靠源源不断的“精神产品\\\"来满足人们的需要！但电影，其实很难制造真正的持久的精神产品，因为一代一代消费者的口味，都在不断的变化。因为他的角色都是不要出场费的动画，就算是真人出演，也不需要明星加持。\",\"url\":\"https://www.zhihu.com/question/2029857526171338534/answer/2031377796270961737\"},{\"slug\":\"2026-04-25-哈耶克认为让人自由选择-人类就会奔向文明\",\"year\":\"2026\",\"title\":\"哈耶克认为让人自由选择，人类就会奔向文明！这个西方语境，就是西方民主自由的基础。也是西方投票选领导人的基础。这个设定其实害了西方，他们会认为人，就一定是理性的，\",\"date\":\"2026-04-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我持这个观念：人类自由选择的话，奔赴的并不是文明，而是欲望！如果在没有压力的情况下，让人自由选择生活。如果让人自由选择，自主决定付出和回报的规则。他投票选出的就是---承诺给他拿到最多好处的领导，而不是“最符合国家利益”的领导！就像小孩子一样----给他自由选择，他难道会选择艰苦训练自己，刻苦学习，然后成为人才吗？因此，所谓的西方民主和自由的前提，是有理性的人，才能做出真正良好的决定。\",\"url\":\"https://www.zhihu.com/pins/2031289281273123898\"},{\"slug\":\"2026-04-25-感谢作者-身为女性-解读了女性的怪异行为\",\"year\":\"2026\",\"title\":\"感谢作者，身为女性，解读了女性的怪异行为。原来这种人，连女性都困惑！ 这些人都是典型的消费者价值观念，跟你不是一路人。 支撑她们人生的价值感，来自于\",\"date\":\"2026-04-25\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"感谢作者，身为女性，解读了女性的怪异行为。这些人都是典型的消费者价值观念，跟你不是一路人。支撑她们人生的价值感，来自于---自己拥有，占有了什么东西！你是另一种人：你以自己的自立自强作为自己的人生基础！你文中所谓的“女性高端消费”，她都完全没有。因为她的价值观，也是自己创造了什么东西，而非自己享受到什么东西！你不要再借钱给这种人了，她们是你远离的对象！生活困难，要帮忙，多给10倍都没问题的。\",\"url\":\"https://www.zhihu.com/pins/2031614673573912968\"},{\"slug\":\"2026-04-25-男人有事业心-这是男人的本分-女方爱家\",\"year\":\"2026\",\"title\":\"男人有事业心，这是男人的本分。 女方爱家顾家，是女人的本分！ 现在，有几个是守本分的？ 【凭心而论，我觉得自己和以前交往过的任何一个女人结婚，\",\"date\":\"2026-04-25\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"男人有事业心，这是男人的本分。女方爱家顾家，是女人的本分！现在，有几个是守本分的？【凭心而论，我觉得自己和以前交往过的任何一个女人结婚，都不会过得开心的，她们的存在只是为了满足内心的虚妄罢了】现在的社会和家庭。培养的都是消费者，有几个是真正有情有义的人?有多少女人是有爱的？我找到的解决方案：就是我家再有儿子要娶老婆的，娶个东南亚的本分女人，比找个中国的小仙女，更像一个“家人”。\",\"url\":\"https://www.zhihu.com/pins/2031294650665915443\"},{\"slug\":\"2026-04-25-说得对赞-消费者是心腐败了-心穷\",\"year\":\"2026\",\"title\":\"说得对[赞] 消费者是心腐败了---心穷。不是简单的吃喝玩乐。 我们也遇到了一个“生活简单朴素”的消费者，心穷。穷的让人气死。  你有此\",\"date\":\"2026-04-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"说得对[赞]消费者是心腐败了---心穷。不是简单的吃喝玩乐。我们也遇到了一个“生活简单朴素”的消费者，心穷。穷的让人气死。你有此感受，估计也是遇到了心穷之人吧？切肤之痛。经营者遇到消费者，的确就是人遇到蚂蟥。不被吸空就不会罢手的。至于蚂蟥，吸空了。换个宿主继续吸取。因此愿意付出的人，最大的危险就是遇到蚂蟥。不会摆脱蚂蟥的话，会被消耗死的！凡认为【我优秀所以我值得天下供养】的人。\",\"url\":\"https://www.zhihu.com/pins/2031605304153075876\"},{\"slug\":\"2026-04-25-这个年代的企业家-成在胆子大-败也败在胆\",\"year\":\"2026\",\"title\":\"这个年代的企业家，成在胆子大，败也败在胆子大。[捂脸]\",\"date\":\"2026-04-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2031301071826633997\"},{\"slug\":\"2026-04-24-为什么现在感觉富二代比穷二代更努力\",\"year\":\"2026\",\"title\":\"为什么现在感觉富二代比穷二代更努力？\",\"date\":\"2026-04-24\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"因为聪明的富一代都知道：孩子教育失败，家族的损失会很大，很大，当然不敢掉以轻心了。因此，除了一些愚蠢的富人，本身是穷人出身，穷人思维，靠运气富起来的土财主，根本没有思考判断能力的暴发户，以及富一代。其他有点头脑的富裕家庭孩子，普遍更加重视孩子的教育和训练！因为穷二代都没被骗的资格，只有被忽视，无视的资格。3：不用担心被人欺负，因为穷二代每天都在被人欺负，哄骗，忽略，看不起，都已经习惯这种环境了！\",\"url\":\"https://www.zhihu.com/question/25431302/answer/2030934184169092629\"},{\"slug\":\"2026-04-24-小孩武术练的好真的没有出路吗\",\"year\":\"2026\",\"title\":\"小孩武术练的好真的没有出路吗？\",\"date\":\"2026-04-24\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"想要靠此技能，得到别人给你一个一辈子的饭碗，肯定就没出路的！文化和娱乐行业，就是你必须能用武术的内涵，来为对象提供满满的情感价值，让别人喜欢和尊重，这才是有用的，甚至会超级有用。你如果能满足中国人武术梦，满足武侠的情感需求，你就很有用。你孩子去“省里面”比赛的时候，真有观众去看吗？如果你的孩子，在这种国人对武术的极度负面情绪之下，你继续去走李连杰，马保国，甚至雷雷的老路，您觉得练武术还有啥前途呢？\",\"url\":\"https://www.zhihu.com/question/1988563680766473259/answer/2030993561114690764\"},{\"slug\":\"2026-04-24-西方的家族信托可信度几何\",\"year\":\"2026\",\"title\":\"西方的家族信托可信度几何？\",\"date\":\"2026-04-24\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"西方的家族信托，真的有用吗？【猫王一亿多的信托，十年就被经理努力的托到了1.4万美元】。知道为啥我不敢用金融机构了？只好自己来做金融团队，自助管理我们的教育基金资产。另外，我多年前，在香港的永居投资移民，一般人是委托香港的金融机构投资，还要付管理费，往往没多久就净值腰斩了。7年后，我的账户是赚钱完成了投资移民走掉的。所以---绝对不要相信金融人士就是为你服务的，他们只为自己服务！\",\"url\":\"https://www.zhihu.com/question/652167758/answer/2031069581465351350\"},{\"slug\":\"2026-04-24-雪球管我财-一个拥有70多万粉丝的财主\",\"year\":\"2026\",\"title\":\"雪球管我财：一个拥有70多万粉丝的财主。他发言说： 可能你們不知道，我父母兩邊都是黑五類，我從小就住寮屋區，可以算是香港最窮的0.001%人群吧？\",\"date\":\"2026-04-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"雪球管我财：一个拥有70多万粉丝的财主。他发言说：可能你們不知道，我父母兩邊都是黑五類，我從小就住寮屋區，可以算是香港最窮的0.001%人群吧？即便是這樣，我從小就知道做人要誠信，不欺騙別人，不作傷害別人的事情，不貪便宜不佔別人便宜……所以這和窮其實沒有什麼關係/我们认识一个高学历人士。恰好和管我财说的相反：1：我從小就知道做人要誠信，不欺騙別人。她的话说起来一脸的真诚，但时候验证毫无信用。\",\"url\":\"https://www.zhihu.com/pins/2031034399362433390\"},{\"slug\":\"2026-04-23-985-毕业生反向升学读技校-这反映了什\",\"year\":\"2026\",\"title\":\"985 毕业生反向升学读技校，这反映了什么趋势或现象？\",\"date\":\"2026-04-23\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"今年突然有很多大学生反过来读技校的报道。这反馈了现在社会的现实：大学根本就没有教啥技能。为啥会有福耀大学这样的收欢迎？未来：高中生直接去企业培训，就业，是必然的趋势。别再迷信大学了，现在大学连个文凭工厂都不是了。我作为当年的985大学生，我不认为老师教了我什么有价值的东西，更多是我去图书馆自己学的！就算我这样教室里面学生挤的满满的教师，我的“正宗学生”，真应该来上课的学生，不到三分之一。\",\"url\":\"https://www.zhihu.com/question/658900399/answer/2030557809243317206\"},{\"slug\":\"2026-04-23-内家拳的战斗力上限比外家拳更高么\",\"year\":\"2026\",\"title\":\"内家拳的战斗力上限比外家拳更高么？\",\"date\":\"2026-04-23\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"如果用实战能力来检验的话，不仅实战的上限高，实战的下限也高得惊人。如果把下限，理解为能够上全国格斗赛的擂台比赛并完成比赛（不是中途被ko）的话，我相信大多数自吹练了多年内家拳的人，都是不敢走上擂台的。上限更高的具体意思，就是一辈子到老，功夫都在不断的进步，50岁的他，往往还不如60岁的他更快，更有力量，格斗的水平更高！第二：真的内家拳比外家拳上限更高是真的。一旦内家拳会发力了，基本上擂台无对手了！\",\"url\":\"https://www.zhihu.com/question/2029546059702047912/answer/2030566817446503205\"},{\"slug\":\"2026-04-23-因拒交数据-苹果或在印度面临-380-亿\",\"year\":\"2026\",\"title\":\"因拒交数据，苹果或在印度面临 380 亿美元反垄断处罚，印度为何要索要这些信息？苹果又为何拒绝提交？\",\"date\":\"2026-04-23\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"现在全世界装都不装了你美国可以抢委内瑞拉和伊朗。我印度怎么不能抢个苹果吃？美国霸权被捅穿，特朗普乱作为，失去世界警察的威信和地位后，没人来管这些无赖国家的闲事了，这样全世界就乱套了。缺钱的政府，都可以利用强权来强行掠夺有钱的企业，以及个人。其实美国应该求中国，两国一起来联合收拾世界。现在印度不就是瞧美国自顾不暇，才作妖作怪吗？中美联手，把印度彻底废了，绝对符合中美的利益！\",\"url\":\"https://www.zhihu.com/question/2030231825646187454/answer/2030569540980036028\"},{\"slug\":\"2026-04-23-如何评价福建三明一女子脚踹保安后被对方反\",\"year\":\"2026\",\"title\":\"如何评价福建三明一女子脚踹保安后被对方反扇耳光？\",\"date\":\"2026-04-23\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"我始终不明白，中国一些女人，为啥就是喜欢无底线的去挑战别人的底线，关键是自己又没啥实力和能力，就是想去欺负人。就像男人，在面对泰森的时候，我相信都会非常的理智。不会认为“我打你怎么了，你是名人，敢还手吗。怎样想男人，恐怕是疯子吧？明明屁本事都没有，却想指点江山，随便欺负人，其敲诈勒索。该给这些疯女人一个示范----不是男女平等吗？女人打男人，除非身怀绝技想要秀一秀，否则就是女疯子，是找死。\",\"url\":\"https://www.zhihu.com/question/2030333131283226860/answer/2030596009152227269\"},{\"slug\":\"2026-04-23-张清一-进城进京-阶层上升的艰难之路\",\"year\":\"2026\",\"title\":\"张清一：进城进京，阶层上升的艰难之路\",\"date\":\"2026-04-23\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"我了解背景：就知道为啥两夫妻非常希望自己的孩子，要走文化上层之路了。因为理想的阶层上升路径，他们夫妻只完成了一半，才勉强让自己的家族，从农门和底层打工仔的阶层，通过读书改变了命运。不过，这对家长显然不知道：上升之路，就是人学之路。他大学毕业后，一直抓住一些机会，努力上进，已经进入北京的上层政治阶级了。大概---这条大家都想要的【家族阶层上升之路】，我还没有认识谁，真的下一带就提升上去。\",\"url\":\"http://zhuanlan.zhihu.com/p/2030412716586820281\"},{\"slug\":\"2026-04-23-昨天正在说自己买的-中谷物流-每天都在涨\",\"year\":\"2026\",\"title\":\"昨天正在说:自己买的【中谷物流】每天都在涨，不知道为啥涨！一个多月让我赚了20%多了。 结果今天就打脸了---领到一个跌停。  原因：就是昨天\",\"date\":\"2026-04-23\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天正在说:自己买的【中谷物流】每天都在涨，不知道为啥涨！一个多月让我赚了20%多了。结果今天就打脸了---领到一个跌停。原因：就是昨天晚上出年报了。中谷物流总收入下降，但总利润大幅上升。难道是因为分红减少了吗？内河航运和东南亚航运的稳定性，还是可靠的！不过我还是不能理解：运费大幅上升造成利润增加。大概会有每年6%的分红收入，勉强算是过得去的。这样算的话，应该是买入中国建筑更便宜吧？\",\"url\":\"https://www.zhihu.com/pins/2030631523494441497\"},{\"slug\":\"2026-04-23-重新看到这篇文章-当年这两个“道姑下山还\",\"year\":\"2026\",\"title\":\"重新看到这篇文章：当年这两个“道姑下山还俗”。引动了公主班的下山潮，后续有10来个公主，都离开了班级！毕竟---这个年龄，春心已动。心智正向父母的价值观回归。\u003c\",\"date\":\"2026-04-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"重新看到这篇文章：当年这两个“道姑下山还俗”。引动了公主班的下山潮，后续有10来个公主，都离开了班级！现在公主班的状态更好了，成绩也更耀眼了。今年6月份，就有两个公主班的人，要去代表中国打世界锦标赛了。去年，某个把已经拿了青少年冠军的孩子带走的家长，还私下抱怨说：外家拳练了一两年，都会发力，能Ko人了。看木兰们练了四五年，居然都不会发力，出拳软绵绵的。意思是：我教的这种怪拳，恐怕就是骗人的。\",\"url\":\"https://www.zhihu.com/pins/2030784292985517616\"},{\"slug\":\"2026-04-22-8就嫌弃多了-我还买了一个分红12\",\"year\":\"2026\",\"title\":\"8%就嫌弃多了？ 我还买了一个分红12%多的股票呢 我当时看到，就大吃一惊？怎么A股还有这种奇葩股票？分红这么多？我以为港股才有的。 比如我买\",\"date\":\"2026-04-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"我还买了一个分红12%多的股票呢我当时看到，就大吃一惊？比如我买的招商局中国基金，还有一个梳子股。我就一直高股息稳涨慢涨，我拿了10年了。这个股怎么看都是好股，就是担心题主说的这些“不靠谱”，所以没敢多买。其实---应该买上1000万股就比较合适了！然后----很奇怪的，我就眼睁睁的看他几乎每天涨。我想多买一点，总想等调整再进入，结果今天一看，已经涨了超过20%了！\",\"url\":\"https://www.zhihu.com/pins/2030276601540257284\"},{\"slug\":\"2026-04-22-叶家豪家族拿着10.94亿现金-心满意\",\"year\":\"2026\",\"title\":\"【叶家豪家族拿着10.94亿现金，心满意足地离开了牌桌。新余投控成为控股股东】 这就是“套现离场”。肯定背后有交易的。 我不太买民营企业，就是很多老\",\"date\":\"2026-04-22\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"【叶家豪家族拿着10.94亿现金，心满意足地离开了牌桌。新余投控成为控股股东】这就是“套现离场”。我不太买民营企业，就是很多老板，其实目标不是认真的做好经营。国有企业虽有“官僚”的毛病，但基本上坑蒙拐骗的事情还好。不过叶家用尽心机，但最终结果，还是双输！叶家父子现在都在监狱里面，我很奇怪，连黄小鸟这样的菜鸟，都知道敲诈我一旦得手之后，她就要和熊杰一起跑去澳洲，改名换姓藏起来了。\",\"url\":\"https://www.zhihu.com/pins/2030261172017033990\"},{\"slug\":\"2026-04-22-福建男性平均初婚年龄30-女性平均初婚\",\"year\":\"2026\",\"title\":\"【福建男性平均初婚年龄30，女性平均初婚年龄28，婚后2-7年（尤其是3-4年）是离婚的高发阶段。 现在的女生，15岁就赶急赶忙的想要进入两性世界。真的操\",\"date\":\"2026-04-22\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"【福建男性平均初婚年龄30，女性平均初婚年龄28，婚后2-7年（尤其是3-4年）是离婚的高发阶段。现在的女生，15岁就赶急赶忙的想要进入两性世界。真的操之过急；e！男人没有事业。就是废物！女人没有德行。也是害虫！都不能碰的！\",\"url\":\"https://www.zhihu.com/pins/2030256277318841803\"},{\"slug\":\"2026-04-22-今天的啤酒股很有趣-燕京啤酒最新公布的\",\"year\":\"2026\",\"title\":\"今天的啤酒股很有趣： 燕京啤酒最新公布的股东人数，4月20日爆涨20%以上。上期4月10日冲高14元以上就涨了9%，现在直接从原来的低位4万3千人，涨到了\",\"date\":\"2026-04-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天的啤酒股很有趣：燕京啤酒最新公布的股东人数，4月20日爆涨20%以上。上期4月10日冲高14元以上就涨了9%，现在直接从原来的低位4万3千人，涨到了5万7千多人。如果你认为目前的燕京是高位（好像基本上是历史高峰区间），那么---现在的动作，就是主力派货了。今年的惠泉一季报已经出来了，各位看到我依然是二大。不过现在涨到接近13元了，我又开始卖卖卖模式了，我见利就走，来来回回的做T。\",\"url\":\"https://www.zhihu.com/pins/2030247161070363376\"},{\"slug\":\"2026-04-22-体育本质上是文化旅游产品-就不是普通的穷\",\"year\":\"2026\",\"title\":\"体育本质上是文化旅游产品，就不是普通的穷人，特别是个体能玩出圈的。 穷拳手，如果不能得到好的经纪人合作，根本就没机会上有价值的赛场。 如果不能符合资\",\"date\":\"2026-04-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"体育本质上是文化旅游产品，就不是普通的穷人，特别是个体能玩出圈的。穷拳手，如果不能得到好的经纪人合作，根本就没机会上有价值的赛场。如果不能符合资本的利益。没人为你举办赛事活动的！所以---资本才是发言权，不是你的天赋和努力！当然---天赋和努力是必不可少的。\",\"url\":\"https://www.zhihu.com/pins/2030343297001060222\"},{\"slug\":\"2026-04-21-19-岁女生挪用-1700-万元打赏、买\",\"year\":\"2026\",\"title\":\"19 岁女生挪用 1700 万元打赏、买盲盒，家长还能追回这笔钱吗？主播和平台是否有义务退钱？\",\"date\":\"2026-04-21\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"追回钱，还是追不回来钱，这不是最重要的。【朱先生说，小梦至今还是整天抱着手机，家人曾试图没收手机，她以自杀威胁。余生就毁在没有教育好的子女身上，一辈子的积蓄，只需一两年，就打回原形，甚至负债累累！做生意的人，敢把这么大的流动资产，随便交给子女打理，还不监督。15年前，小女在云南农村的生活--爬山休息中小女10岁，就来清迈长居了，居住在郊外的乡村，旁边就是穷得啥都没有的泰国人家。\",\"url\":\"https://www.zhihu.com/question/2029687631366078518/answer/2029967203370526124\"},{\"slug\":\"2026-04-21-孩子不想读书-想躺平-所以让张雪峰帮助去\",\"year\":\"2026\",\"title\":\"孩子不想读书，想躺平，所以让张雪峰帮助去烟草公司。 嘿嘿。人都是一样的。 我这里的家长，孩子不想读书，偷懒耍滑。家长说：想让孩子进新教育平台，当文化\",\"date\":\"2026-04-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"孩子不想读书，想躺平，所以让张雪峰帮助去烟草公司。我这里的家长，孩子不想读书，偷懒耍滑。家长说：想让孩子进新教育平台，当文化上层。大概家长的想法，文化上层就是皇帝太后。如果真有这么好，我的小女儿也犯不着3岁多，就要走30公里苦苦训练了。把一个文化上层是无能混出来的家长这么支持孩子平躺。但据我所知：西班牙公主就是从小严格训练的。中国家长的皇帝梦，大概都是从清宫剧里面学的……\",\"url\":\"https://www.zhihu.com/pins/2029841556190820035\"},{\"slug\":\"2026-04-21-昨天李想的比赛打满五局-判赢了-在泰国一\",\"year\":\"2026\",\"title\":\"昨天李想的比赛打满五局，判赢了。在泰国一般不KO就算输了的。所以---场面上是压住对方打的。拍回来的照片，对方都是在挨打。虽然对方是职业老拳手，很耐打。但小公主\",\"date\":\"2026-04-21\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"也不惧强手，照样打。最近清迈比赛四连胜。\",\"url\":\"https://www.zhihu.com/pins/2029844586650944583\"},{\"slug\":\"2026-04-21-现在男女双方的不信任都到了极点-婚姻解体\",\"year\":\"2026\",\"title\":\"现在男女双方的不信任都到了极点 婚姻解体、大概就是必然趋势了！ 只是顶层和下层需要婚姻了。中层---拥有不起婚姻\",\"date\":\"2026-04-21\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"现在男女双方的不信任都到了极点婚姻解体、大概就是必然趋势了！只是顶层和下层需要婚姻了。中层---拥有不起婚姻……\",\"url\":\"https://www.zhihu.com/pins/2029969862580249726\"},{\"slug\":\"2026-04-20-这些成都-大城市的开放女生-年轻时候疯玩\",\"year\":\"2026\",\"title\":\"这些成都，大城市的开放女生。年轻时候疯玩的女生，被优化真的很正常。 男生是傻傻的。但他们的聪明就是也只想找傻傻的女生。 【我思考了许久，到底该选谁做\",\"date\":\"2026-04-20\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"这些成都，大城市的开放女生。年轻时候疯玩的女生，被优化真的很正常。男生是傻傻的。但他们的聪明就是也只想找傻傻的女生。【我思考了许久，到底该选谁做女朋友？谈过几个男朋友？开过房吗？打过胎没？和人同居过吗？】……\",\"url\":\"https://www.zhihu.com/pins/2029595381428692552\"},{\"slug\":\"2026-04-20-郭冬旺-2011年-中国首位泰拳世锦\",\"year\":\"2026\",\"title\":\"郭冬旺 (2011年)：中国首位泰拳世锦赛冠军，在塔什干世锦赛男子 71kg 级夺冠，实现了中国泰拳零的突破。 袁兵 (2015年)：在泰国曼谷举行的皇\",\"date\":\"2026-04-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"郭冬旺(2011年)：中国首位泰拳世锦赛冠军，在塔什干世锦赛男子71kg级夺冠，实现了中国泰拳零的突破。袁兵(2015年)：在泰国曼谷举行的皇家世界杯（IFMA最高规格世锦赛）上夺得71kg级金牌。罗成好(2017年)：在白俄罗斯明斯克世锦赛51kg级决赛夺冠2025年世界运动会泰拳项目比赛，中国女子首次夺冠。跟我们国家的国力相比，实在太不成样子了。\",\"url\":\"https://www.zhihu.com/pins/2029555268720104024\"},{\"slug\":\"2026-04-19-一个班上-只要有几个这样喜欢出风头-自我\",\"year\":\"2026\",\"title\":\"一个班上，只要有几个这样喜欢出风头，自我中心的女子。喜欢出来当“凤头”。有点聪明，还能说会道的，搬弄口舌，玩弄是非，还喜欢影响他人。其他无脑的女生，就会跟随一起\",\"date\":\"2026-04-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"带班教师最重要的事情，就是找出来这种“意见领袖”的女魔头，分化瓦解，打掉她的气焰。不过如果这种女生的成绩还不错，就很难了。一个班必须要一个品学兼优的女生作为全班女生的榜样，有正气。公主班最终能够出来，就是公主班有几个各方面都很优秀。积极付出，努力无私，不娇气的女生，在主导班级的风气。其他有问题的女生无法出头，影响不了班级，这些三观不同的女生，最终选择了离开班级去外面发展，上大学。\",\"url\":\"https://www.zhihu.com/pins/2029125823072872244\"},{\"slug\":\"2026-04-19-为什么云南泼水节变味了\",\"year\":\"2026\",\"title\":\"为什么云南泼水节变味了？\",\"date\":\"2026-04-19\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"我们刚在泰国过完泼水节（宋干节），泼水的意义，其实是旱季的祝福。男孩女孩也喜欢互相泼水，不过都很友好，不会疯狂。中国的泼水节，其实是国内内心深处的攻击意识的体现，作为一个用水来进行的战争。因此，其实在泰国呆惯了，回国很不适应的。真的能够感到“戾气”，多年前，还年幼的小女，回国后看周边的人就很奇怪，跟我们说：为什么这里的人都很生气？即使只是快乐放松的节日，国人也可以把节日变成战场。\",\"url\":\"https://www.zhihu.com/question/652795560/answer/2029143699754424089\"},{\"slug\":\"2026-04-19-姚安娜的家族意识很强赞-与刘亦菲的对\",\"year\":\"2026\",\"title\":\"姚安娜的家族意识很强[赞]，与刘亦菲的对话非常得体。说明家庭教育非常良好的结果。[赞]\",\"date\":\"2026-04-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2029131645928613770\"},{\"slug\":\"2026-04-19-我们刚在泰国过完泼水节-宋干节-泼水的\",\"year\":\"2026\",\"title\":\"我们刚在泰国过完泼水节（宋干节），泼水的意义，其实是旱季的祝福。泰人，傣族人特别爱水。水是生命之源。 因此，这里的泼水节，就是祝福的意思。非常有爱和温和。\",\"date\":\"2026-04-19\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"我们刚在泰国过完泼水节（宋干节），泼水的意义，其实是旱季的祝福。男孩女孩也喜欢互相泼水，不过都很友好，不会疯狂。中国的泼水节，其实是国内内心深处的攻击意识的体现，作为一个用水来进行的战争。因此，其实在泰国呆惯了，回国很不适应的。真的能够感到“戾气”，多年前，还年幼的小女，回国后看周边的人就很奇怪，跟我们说：为什么这里的人都很生气？在中国，如果只是自己过过小日子，当当消费者，就还好。\",\"url\":\"https://www.zhihu.com/pins/2029140789347762499\"},{\"slug\":\"2026-04-18-99元排队四小时买门票-去吃超贵的面包\",\"year\":\"2026\",\"title\":\"99元排队四小时买门票。去吃超贵的面包？ 证明国人的状态： 第一：不差钱！差得是心眼。 第二：国人都是吃货，以吃稀奇物，来作为自己的价值锚。（\",\"date\":\"2026-04-18\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"99元排队四小时买门票。去吃超贵的面包？证明国人的状态：第一：不差钱！差得是心眼。第二：国人都是吃货，以吃稀奇物，来作为自己的价值锚。（虽然面包不稀奇）】第三：一个摊位1300元？摊主的面包不卖贵点怎么回收成本。长见识了：原来我们的社会，培养出来的人，都是无法理喻的群氓。正常人是无法理解的。\",\"url\":\"https://www.zhihu.com/pins/2028763282694050430\"},{\"slug\":\"2026-04-18-努力学习真的拼不过富二代吗\",\"year\":\"2026\",\"title\":\"努力学习真的拼不过富二代吗？\",\"date\":\"2026-04-18\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"真要来拼，的确不容易你只有拿自己一个人来死拼，富二代是拿钱，拿团队来拼，拿资源来拼，拿人脉来拼。你只有自己一个人能上，你的对手可以去请雇佣军。还可以请法官律师团队，雇佣一堆人来跟你打。因为富二代，n代们，可能根本没有这个“爱拼才会赢”的意识！他们的父母也蠢，没头脑的人很多，会从小把富二代培养成傻白甜。就像西班牙公主一样，从小就过着“非人折磨”的富二代，富三代们。\",\"url\":\"https://www.zhihu.com/question/1965029397380706449/answer/2028766529139810630\"},{\"slug\":\"2026-04-18-故事太惨烈了-父子相残-清一公社\",\"year\":\"2026\",\"title\":\"故事太惨烈了。父子相残。。。。。清一公社有集体帮助，可以避免这种极端的处境、只要孩子吸毒，通告全社，开除家门即可。谁敢来闹事，我们的公社的保安可不是吃素的。何必\",\"date\":\"2026-04-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"弄到这样要以一命换一命。依靠集体和平台。老弱妇幼才能得到保护！我们家的家规，是吸毒零容忍，一旦发现就丢出去，开除家籍。永不见面。懒人也是---懒鬼，对家庭无用之人，18岁就只能赶走。去社会上自生自灭。\",\"url\":\"https://www.zhihu.com/pins/2028898077306569823\"},{\"slug\":\"2026-04-17-中产死于理财-有钱人总是有很多聪明凶狠\",\"year\":\"2026\",\"title\":\"中产死于理财。 有钱人总是有很多聪明凶狠的狼盯著的。这种巨大的风险，穷人是不会理解的。因为他们根本没有机会成为别人“服务”的对象。 每次我带明慧去见\",\"date\":\"2026-04-17\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"中产死于理财。有钱人总是有很多聪明凶狠的狼盯著的。这种巨大的风险，穷人是不会理解的。因为他们根本没有机会成为别人“服务”的对象。每次我带明慧去见高端金融从业人员的时候，我都会提醒她：他们是狼。我们要学会【与狼共舞】，自己也必须是狼。千万不要以为他们是圣诞老人。自己是羊的话，就躲远一点！\",\"url\":\"https://www.zhihu.com/pins/2028403075224716662\"},{\"slug\":\"2026-04-17-如何看待当代男性正在集体退出婚恋市场\",\"year\":\"2026\",\"title\":\"如何看待当代男性正在集体退出婚恋市场？\",\"date\":\"2026-04-17\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"如果用消费主义的思想来看待婚姻的话，无论对男人或者是女人。我干嘛要去伺候一个根本就不理解我的，傻乎乎的男人？如果我自己能养自己，何必去受婚姻这个罪？对于有点小成就的男人来说：女人也不是啥稀有动物。如果我没有女人，自己过可以过的更好，更舒服。女人当然更不想嫁需要自己养的男人（除了少数有点“贱”的女人）。中端的男人，能力不够强，会因为害怕女人吸血，承担家庭的压力，而不敢进入正常的婚姻。\",\"url\":\"https://www.zhihu.com/question/1975149877626443584/answer/2028454999139660574\"},{\"slug\":\"2026-04-17-如果用消费主义的思想来看待婚姻的话-无论\",\"year\":\"2026\",\"title\":\"如果用消费主义的思想来看待婚姻的话，无论对男人或者是女人。这的确是一桩“划不来的生意”。 对于女人来说。我干嘛要去时伺候一个根本就不理解我的傻乎乎的男人？\",\"date\":\"2026-04-17\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"如果用消费主义的思想来看待婚姻的话，无论对男人或者是女人。这的确是一桩“划不来的生意”。我干嘛要去时伺候一个根本就不理解我的傻乎乎的男人？对于有点小成就的男人来说：女人也不是啥稀有动物。要和一个长期吸血，且情绪不定的女人长期相处，是一件艰难的决定。中端的男人，会害怕女人而不肯进入婚姻低端的男人，拼命想找个女人来帮忙扛住生活的压力。因为：未来的不婚族，就是中高端的女人，以及打工一族的中端男人了！\",\"url\":\"https://www.zhihu.com/pins/2028446121135972770\"},{\"slug\":\"2026-04-17-我不懂酒-也不喝酒-我只是买酒股票-也赚\",\"year\":\"2026\",\"title\":\"我不懂酒，也不喝酒。我只是买酒股票，也赚了钱。会喜欢看别人评讲酒。 我很佩服作者能够品鉴出这么多的风味和口感。对我来说是望尘莫及。 我特别想知道一件\",\"date\":\"2026-04-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"我只是买酒股票，也赚了钱。我很佩服作者能够品鉴出这么多的风味和口感。我特别想知道一件事情，分为两个问题：1：您这种品酒的能力，是投资了多少钱去喝各种酒，才喝出来这种品酒水平的？2：您拥有的这种能力，能够给你带来什么实际的收益和回报？我是想：如果喝酒真有啥有价值的回报，我不妨努力学学。如果没有价值的话，我就仅仅止步买卖酒股票就行了。看酒民恢复酒消费的程度，再决定是否投资抄底。\",\"url\":\"https://www.zhihu.com/pins/2028459345554227993\"},{\"slug\":\"2026-04-16-教育系统的目标设计-从来不是”培养独立\",\"year\":\"2026\",\"title\":\"【教育系统的目标设计，从来不是”培养独立思考”；】 这话没错。这个教育体系，就是培养工业社会的打工人的 如果你会独立思考了，你会问：我为什么要打工？\",\"date\":\"2026-04-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【教育系统的目标设计，从来不是”培养独立思考”；这个教育体系，就是培养工业社会的打工人的如果你会独立思考了，你会问：我为什么要打工？我培养了女儿会独立思考。结果：她根本就不肯去打工，只愿意做自己喜欢的事情、一个月2000块就满足得不得了，还会攒股票，用股息生活。这样的人你咋让她去大厂做牛马？甚至，我让她生个小外孙来陪我，都不干！所以---独立思考，其实不是啥好东西[捂脸]、不教也好！\",\"url\":\"https://www.zhihu.com/pins/2028352984308881273\"},{\"slug\":\"2026-04-16-女人心中嫁给的男人-基本上就是“提取现金\",\"year\":\"2026\",\"title\":\"女人心中嫁给的男人，基本上就是“提取现金”的工具吧？ 不过：男人心中的女方，基本上也是工具。是男人生孩子，做好家庭服务的工具。 双方各取所需，也不错\",\"date\":\"2026-04-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"女人心中嫁给的男人，基本上就是“提取现金”的工具吧？不过：男人心中的女方，基本上也是工具。是男人生孩子，做好家庭服务的工具。双方各取所需，也不错！真爱---有几个是真爱。基本上，都是骗子才给你说真爱。\",\"url\":\"https://www.zhihu.com/pins/2028151260969203644\"},{\"slug\":\"2026-04-16-清黑最喜欢装好人-装纯洁-跳出来劝退家长\",\"year\":\"2026\",\"title\":\"清黑最喜欢装好人，装纯洁，跳出来劝退家长的套路，就是告诉他人---国外有各种鸡好危险。磨丁有好多鸡，影响你们小孩的纯洁发展！ 不知道有多蠢的家长，会相信这\",\"date\":\"2026-04-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"清黑最喜欢装好人，装纯洁，跳出来劝退家长的套路，就是告诉他人---国外有各种鸡好危险。不知道有多蠢的家长，会相信这种不着调的调调！这些相信清黑的家长，估计一直被保护得太好，生活在真空中，根本不知道：在中国国内，各种国外有的东西。好的，不好的，我们全都有，甚至可能有些方面更糟糕，更变态。我一直告诉学生们：鸡生意，是自古至今一直存在的生意。中国改开之前，打击最严的时候，依然有各种暗鸡子。\",\"url\":\"https://www.zhihu.com/pins/2028359883376928285\"},{\"slug\":\"2026-04-16-燕京跌到12元多了-我查看了一下我买入燕\",\"year\":\"2026\",\"title\":\"燕京跌到12元多了。我查看了一下我买入燕京的记录，最新的记录是去年12月30日买入的，价格才11.20元。当天买入25万股，之前在12元下方一直在买入。最新的卖\",\"date\":\"2026-04-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"出，就是14元上方的不断卖出。不明白为啥燕京总是要回调，倒车接人？怎么这么好心？真跌破12元，我肯定就要再度买入了。\",\"url\":\"https://www.zhihu.com/pins/2028067167946417151\"},{\"slug\":\"2026-04-16-腾讯等大厂开始抢高中生-这是个什么信号\",\"year\":\"2026\",\"title\":\"腾讯等大厂开始抢高中生，这是个什么信号？\",\"date\":\"2026-04-16\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"还有很多大厂，都在抢高中生！明年还会更加剧烈的变化，我相信大厂开启这条通道之后，将不再愿意去大学招员工了。从中国务实的大企业，开始掀起的这场对传统大学的颠覆之风。我相信很快会波及到国外、美国大学可能是冲击最大的，因为美国的大学智商税是最高的！我认为，我们三语高中的毕业生，都应该去腾讯求职去。反正将来考上什么名校，大学毕业出来，都是去打工的。大学，无论中外，其实真学不了啥东西，都是交智商税的。\",\"url\":\"http://zhuanlan.zhihu.com/p/2028239886491170521\"},{\"slug\":\"2026-04-16-这种情况-不是例外-而是正常-这就是国\",\"year\":\"2026\",\"title\":\"这种情况，不是例外。而是正常。 这就是国内的职业环境----对女生极度的不友好。 去当啥业务代表，想要拒绝潜规则，意味着丢饭碗。谁敢得罪控制你订单的\",\"date\":\"2026-04-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"这就是国内的职业环境----对女生极度的不友好。去当啥业务代表，想要拒绝潜规则，意味着丢饭碗。谁敢得罪控制你订单的权贵？实际上，将来只会越来越严重。因为职场太卷了，人太多了。未来的女性在未来职场的地位只会越来越低。服务男人，会成为更多女人未来不得不面对的选择。也许女人能选就是服务一个男人还是服务更多男人的问题。因此，我可不愿意我的女儿去卷职场。她做个自由人就行了，不需要去这种职场谋生！\",\"url\":\"https://www.zhihu.com/pins/2028362819968484006\"},{\"slug\":\"2026-04-15-2012-电影课-冠军班-如何辨别上\",\"year\":\"2026\",\"title\":\"【2012】电影课（冠军班）。如何辨别上等人？下等人？\",\"date\":\"2026-04-15\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"在15年前，给明一班上课上过【2012】。当时是以危机处理和小民思维来引导大家看电影的！上等人的定义：社会资源的创造者，分配者和管理者。上等人心智模式：付出而不求回报（只问耕耘，不问收获）。下等人的定义：没脑子，没原则，没思考力。课前作业：一：请分别2012电影中，列出三个有代表性的上等人，中等人和下等人。三：请找出电影中不合逻辑，违反正常思维的情节（比如下等人居然去做了上等人的事情。\",\"url\":\"http://zhuanlan.zhihu.com/p/2027673569249740409\"},{\"slug\":\"2026-04-15-2024年为例-孙伟杰与刘贞峰是零薪酬\",\"year\":\"2026\",\"title\":\"【2024年为例，孙伟杰与刘贞峰是零薪酬，王坤晓全年仅领取2.9万元。】 领导者是绝对不为了工资而去工作的，他们只是用工作来实现自己的理想。 最终：\",\"date\":\"2026-04-15\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"【2024年为例，孙伟杰与刘贞峰是零薪酬，王坤晓全年仅领取2.9万元。】领导者是绝对不为了工资而去工作的，他们只是用工作来实现自己的理想。最终：比工资高得多的收入，会自动落到他们身上。因为天道不亏！[大笑]……\",\"url\":\"https://www.zhihu.com/pins/2027706082114422510\"},{\"slug\":\"2026-04-15-想试着写小说-但是没什么思路-该怎么开始\",\"year\":\"2026\",\"title\":\"想试着写小说，但是没什么思路。该怎么开始？\",\"date\":\"2026-04-15\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"如果你需要问别人，写作这碗饭，就不是给你吃的！\",\"url\":\"https://www.zhihu.com/question/1950688477529247899/answer/2027708032952313174\"},{\"slug\":\"2026-04-15-燕京冲涨停这天开始-我在14元上方就开启\",\"year\":\"2026\",\"title\":\"燕京冲涨停这天开始，我在14元上方就开启了卖卖卖模式。倒不是不看好燕京了。相反，我越来越看好燕京了。她的业绩，已经从我开始买燕京相比涨了十倍，而且看样子还在继续\",\"date\":\"2026-04-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这个时代，能够买到以50%成长的成长股，我认为很幸运。但股票本身就只涨了一倍，算上最低点5元起步当我，也不到两倍。现在跌破13元了，真的是跳空必补，一点也不嫌手法老套。现在跌了一块多，不就相当于我抢了几百万回来吗？最高的卖价，我记得是超过14.30元以上的。一起一落，其实我收益超过持股不动多多，更比14元上方冲进去的人幸运多了！现在跌破13元了，理论上我应该重新买回来，可以锁定几百万的利润。\",\"url\":\"https://www.zhihu.com/pins/2027699295294334006\"},{\"slug\":\"2026-04-15-真正的公主是从小严厉的培养-中国的家长\",\"year\":\"2026\",\"title\":\"真正的公主是从小严厉的培养。 中国的家长，以为公主就是像清宫剧里面演的一样，飞洋跋扈就是公主了。 没文化的代价和笑话！\",\"date\":\"2026-04-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"真正的公主是从小严厉的培养。中国的家长，以为公主就是像清宫剧里面演的一样，飞洋跋扈就是公主了。没文化的代价和笑话！\",\"url\":\"https://www.zhihu.com/pins/2027792675466650457\"},{\"slug\":\"2026-04-15-闭关三个月-通过了研究生级的语言考试\",\"year\":\"2026\",\"title\":\"闭关三个月--通过了研究生级的语言考试？\",\"date\":\"2026-04-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"老师汇报给我的消息，是震惊的信息---这个班级现在已经有三个人能通过N1考试了（相当于欧洲标准语言考试的最高级C1）。据说， 的话，即使我强调多次：你说废话的话，是你付钱的！因此最好说对你有用的话！\",\"url\":\"https://www.zhihu.com/pins/2021756223813371060\"},{\"slug\":\"2026-03-29-女人拼命工作赚钱-把儿子和老公当做支点\",\"year\":\"2026\",\"title\":\"女人拼命工作赚钱，把儿子和老公当做支点。结局自然是老公酗酒，儿子赌博，你挣多少钱都没有用。原因也简单---这些灵魂再用自己的牺牲，来换回女人的觉醒----为自己\",\"date\":\"2026-03-29\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"活，支点支在自己身上，才是正途！但不是文章说的。早点吃喝玩乐。不就跟她的儿子和老公一样了吗？\",\"url\":\"https://www.zhihu.com/pins/2021610370993791618\"},{\"slug\":\"2026-03-29-官场不好混-自古以来就是这样的-方方面面\",\"year\":\"2026\",\"title\":\"官场不好混：自古方方面面都要照顾周到，难\",\"date\":\"2026-03-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2021503534709965510\"},{\"slug\":\"2026-03-29-我的同学群-中学和大学-基本上全都退休\",\"year\":\"2026\",\"title\":\"我的同学群（中学和大学），基本上全都退休了。看他们的交流互动，我觉得很搞笑！ 上班的时候，他们是为了主人而活的（领导和单位的要求和安排），本质上是机器人！\",\"date\":\"2026-03-29\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"我的同学群（中学和大学），基本上全都退休了。上班的时候，他们是为了主人而活的（领导和单位的要求和安排），本质上是机器人！总在回忆过去，总在唠叨一些莫名其妙的事情---过去的事情。我跟他们不一样，我现在在想的事情就是：我还能活多久？如果我还要活20-30年的话，我应该做什么？起码我想：如果我要健康的活20-30年，我现在每天都要锻炼身体！我觉得：我这样挺充实的，我这一辈子，都安排得很忙！\",\"url\":\"https://www.zhihu.com/pins/2021757540464084983\"},{\"slug\":\"2026-03-29-我觉得-这是今日新教育的优势-冠军班的同\",\"year\":\"2026\",\"title\":\"我觉得：这是今日新教育的优势，冠军班的同学们，可以18岁就去应聘打工好了，绝对受企业欢迎。没必要去混日子的大学浪费金钱。这个趋势出来之后，未来的大学很快就要大规\",\"date\":\"2026-03-29\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"模倒闭了！因为现在大学连筛选人才的功能都没有达到。我们可以给这些人去名校上学一样的待遇---工作四年后，可以申请来上清一大学研究生。算他们上了社会大学！我认为。上了四年社会大学的人，肯定比这些人去上了体制大学的书呆子更能学会我们的东西。当然---必须是今日三校的学生，其他人这样模仿的，我们不要！\",\"url\":\"https://www.zhihu.com/pins/2021589315092791399\"},{\"slug\":\"2026-03-29-消息-美国与以色列空袭了伊朗胡齐斯坦钢铁\",\"year\":\"2026\",\"title\":\"消息【美国与以色列空袭了伊朗胡齐斯坦钢铁厂及伊斯法罕穆巴拉克钢铁厂，穆巴拉克钢铁厂配套的发电厂也遭到了袭击。 位于阿布扎比的阿联酋环球铝业工厂在伊朗导弹和\",\"date\":\"2026-03-29\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"消息【美国与以色列空袭了伊朗胡齐斯坦钢铁厂及伊斯法罕穆巴拉克钢铁厂，穆巴拉克钢铁厂配套的发电厂也遭到了袭击。位于阿布扎比的阿联酋环球铝业工厂在伊朗导弹和 ,\"L2\":\"太极征泰战报\",\"summary\":\"刚刚认认真真的看了几场中国最顶尖的散打比赛。拿到全运会冠军，差不多就是散打的世界冠军了！为此在全世界都有散打的推广中心，国家出钱支持的，比如泰国就有散打比赛。今天我看完散打比赛后，我可能发现了散打在推广世界的问题何在了！我今天，认真看了几场比赛后，我认为不是别人不给面子，应该是散打规则设定上有问题，导致自己把自己走入了死局！我看了比赛，由于我懂格斗，知道双方在规则内，基本上只能这样打了！\",\"url\":\"http://zhuanlan.zhihu.com/p/2018455302379435936\"},{\"slug\":\"2026-03-20-真没想到韩寒的车手业绩这么好-年度总冠军\",\"year\":\"2026\",\"title\":\"真没想到韩寒的车手业绩这么好。年度总冠军。 很多人都以为他该是作家玩票友的！  不过我还是去拿格斗的世界冠军。我觉得更精彩[大笑]。起码可以击\",\"date\":\"2026-03-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"真没想到韩寒的车手业绩这么好。年度总冠军。很多人都以为他该是作家玩票友的！不过我还是去拿格斗的世界冠军。我觉得更精彩[大笑]。起码可以击败外国人。而且---不用太花钱玩赛车。实在太花钱了。而且好像中国打不赢外国人……\",\"url\":\"https://www.zhihu.com/pins/2017755059476242570\"},{\"slug\":\"2026-03-20-体制内工作的要点，真厉害\",\"year\":\"2026\",\"title\":\"体制内工作的要点，真厉害\",\"date\":\"2026-03-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2018427724214063296\"},{\"slug\":\"2026-03-20-链接-第十五届全运会-武术-女子太极拳\",\"year\":\"2026\",\"title\":\"链接    （第十五届全运会 武术 女子太极拳 决赛）我看了这个中国的国家专业级太极拳比赛、被震翻了，真心佩服。\",\"date\":\"2026-03-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"链接()（第十五届全运会武术女子太极拳决赛）我看了这个中国的国家专业级太极拳比赛、被震翻了，真心佩服。真的很难，我根本别指望能做出这些动作来。要学会这个太极拳的难度，比我们去打泰拳世界冠军难多了，对身体的控制力要求一流。特别看到一个单腿支撑平衡的动作，太太太惊人了。而且卷的太厉害了，分数到了小数点后三位。一个小女孩就是没站稳一点，比分就拉开了。她们要去打泰拳，拿世界冠军，简单不要太容易。\",\"url\":\"https://www.zhihu.com/pins/2018444165755745587\"},{\"slug\":\"2026-03-19-丁克的男人-在40岁之后-99都会背\",\"year\":\"2026\",\"title\":\"【丁克的男人，在40岁之后，99%都会背叛婚姻和伴侣 女人如果真的想跟男人谈公平，必须有孩子。】  大概率就是这样的。男人是靠不住的，如果没有\",\"date\":\"2026-03-19\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"【丁克的男人，在40岁之后，99%都会背叛婚姻和伴侣女人如果真的想跟男人谈公平，必须有孩子。】大概率就是这样的。男人是靠不住的，如果没有孩子，就没有啥东西能够留住男人了。因此，女人最大的依赖和武器就是孩子。我认为：女人可以没有婚姻，但不能没有儿女。女孩们好好想想吧----人生的支点，放在男人身上，真心靠不住。放在孩子身上，起码死前。如果不婚不育，你靠什么来支撑自己的人生呢？\",\"url\":\"https://www.zhihu.com/pins/2017879215056372579\"},{\"slug\":\"2026-03-19-的确-东南亚华人和欧美华人的不同-就是因\",\"year\":\"2026\",\"title\":\"的确：东南亚
