劲的招式，这才是接化发！云手是太极的母拳，学会同时含有接化发的云手，差不多就学会太极了，可以自动变化为千招万招！而且---真正的云手，看去上像是一个抬手接手的小动作，幅度很小！这些我说出来，一般人不会相信的，因为实际上我基本上没有看见有人会这样打拳的。都是动作幅度很大的接化发的表演。\",\"url\":\"https://www.zhihu.com/question/1972396158698656981/answer/2015834583975867460\"},{\"slug\":\"2026-03-13-真现场见过-儿子去美国留学回来的-常春藤\",\"year\":\"2026\",\"title\":\"真现场见过：儿子去美国留学回来的，常春藤名校毕业。一起吃饭。妈妈忍不住说孩子别的都好，就是有点胖，要注意减肥。 结果儿子说老妈：你们说话也太不文明了。太中\",\"date\":\"2026-03-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"真现场见过：儿子去美国留学回来的，常春藤名校毕业。妈妈忍不住说孩子别的都好，就是有点胖，要注意减肥。结果儿子说老妈：你们说话也太不文明了。不过他会原谅老妈，一辈子在中国，没有接受文明的洗礼！我反正不愿意送女儿去美国这种鬼地方留学。我更享受说小女是“可爱的小胖猫”的时候，她很认真的，不优雅的跳起来，要我用事实证明---她哪里胖了。而不是“优雅，一脸无奈\\\"的告诉我：老爸呀，你怎么连基本的文明都不讲究。\",\"url\":\"https://www.zhihu.com/pins/2015786587682776172\"},{\"slug\":\"2026-03-13-考虑到货币会贬值-多少钱才够为一生兜底\",\"year\":\"2026\",\"title\":\"考虑到货币会贬值。多少钱才够为一生兜底？ 如果连630万，也不够为孩子兜底的，那么你该咋办呢？\",\"date\":\"2026-03-13\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"考虑到货币会贬值。多少钱才够为一生兜底？如果连630万，也不够为孩子兜底的，那么你该咋办呢？\",\"url\":\"https://www.zhihu.com/pins/2015778405476487683\"},{\"slug\":\"2026-03-13-这个真实的高尔夫的故事真好-资质平凡的\",\"year\":\"2026\",\"title\":\"这个真实的高尔夫的故事真好！ 资质平凡的女儿，最终成为了高尔夫球队的队长。在强制期间，训练了领导力。 而家长精心打造，精于算计。甚至不惜背刺母校的天\",\"date\":\"2026-03-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"资质平凡的女儿，最终成为了高尔夫球队的队长。甚至不惜背刺母校的天才球手，校队的原第一名华裔，却成为废材！英子问我一句话：山长一直说WC很聪明，黄小燕很聪明。我说：他们聪明是小聪明，精于算计的聪明，就像这个故事里面的对照版一样。精致利己主义：最终其实伤害最大的是自己！这种人其实付出了比别人更多的努力，但收获很小。因为这种人身上的算计，刻薄，寡恩的习惯。她会活得比一般人强，毕竟聪明，而且很努力。\",\"url\":\"https://www.zhihu.com/pins/2015813446181094446\"},{\"slug\":\"2026-03-13-这种“老讲师”-是高校的一股清流-人很少\",\"year\":\"2026\",\"title\":\"这种“老讲师”。是高校的一股清流。人很少，一个大学最多有一个两个的。真不多！他们讨厌行政，也不追求名利，不愿意为了一个职称去写一些狗屁不通的论文，认为是浪费自己\",\"date\":\"2026-03-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"他们其实很有才华，但不愿意浪费才华去做无用功。这些人就是醉心读书，喜欢研究学术和文化，也喜欢跟学生在一起。过去我当大学教师的时代，还有一点点基本的土壤，可以让这种人特立独行的生存。我过去在武大，也是这样的一个“老讲师”，学生很欢迎，但领导看不惯。教师可以孤独地守住自己的底线，不去做不想做的事情！因此教师就必须去写一堆狗屁不通的论文，还要花钱是买版面发表出来，还必须去做行政人员要求的考评内容。\",\"url\":\"https://www.zhihu.com/pins/2015782364618442279\"},{\"slug\":\"2026-03-12-今天冠农三年来新高-要冲12元了-账面盈\",\"year\":\"2026\",\"title\":\"今天冠农三年来新高，要冲12元了！账面盈利也新高了！ 过去5年，数月线的话，冠农有12次最高价格超过了11元。有4次超过11.97元！ 正因为这个历\",\"date\":\"2026-03-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"今天冠农三年来新高，要冲12元了！过去5年，数月线的话，冠农有12次最高价格超过了11元。正因为这个历史k线图，让我决定在冠农上敢于重仓，我在7元左右，大量买进仓位，甚至动用了融资，成为了冠农的第三大股东。因为我认为：未来五年，她应该有10次以上机会，让我赚50%以上的离场（每年10%的复合收益，我已经很满意了）。因为：与过去5年超过11元的时候的月线图相比，最近三个月的成交量，实在是太惨淡了！\",\"url\":\"https://www.zhihu.com/pins/2015397357777347148\"},{\"slug\":\"2026-03-12-这个内容说明-人脑也有类似的结构-那么\",\"year\":\"2026\",\"title\":\"这个内容说明：人脑也有类似的结构。 那么---会不会人也是一种制造品？ 一种相比AI更高效，更节能的制造品？ 如果人能够制造果蝇的大脑，那么神\",\"date\":\"2026-03-12\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"这个内容说明：人脑也有类似的结构。那么---会不会人也是一种制造品？一种相比AI更高效，更节能的制造品？如果人能够制造果蝇的大脑，那么神（天人）会不会也会制造人和人脑呢？这种思维很大胆。也很有趣！\",\"url\":\"https://www.zhihu.com/pins/2015470292215033871\"},{\"slug\":\"2026-03-11-中东美军自行宣布-将从其在卡塔尔、巴林、\",\"year\":\"2026\",\"title\":\"中东美军自行宣布：将从其在卡塔尔、巴林、科威特、伊拉克、约旦、阿联酋和叙利亚的军事基地全部撤离。 美国太傲慢了，他如果不开战，也许美国神话还可以延续几年。\",\"date\":\"2026-03-11\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"中东美军自行宣布：将从其在卡塔尔、巴林、科威特、伊拉克、约旦、阿联酋和叙利亚的军事基地全部撤离。美国太傲慢了，他如果不开战，也许美国神话还可以延续几年。现在伊朗拼死打的这一战，打出了美国的原型。自己的军事基地被袭击，却一点办法都没有。原来它是想跟中国打一架的，但看中国一个一个的新武器拿出来，私下斗几次，美国都输了，所以不敢打中国，只敢去欺负一下伊朗，没想被咬出原型来了！\",\"url\":\"https://www.zhihu.com/pins/2015083803987690883\"},{\"slug\":\"2026-03-11-四川音乐学院院长柴永柏沉迷多人运动-88\",\"year\":\"2026\",\"title\":\"四川音乐学院院长柴永柏沉迷多人运动：88位女教师只剩1人 昨天的讨论课。\",\"date\":\"2026-03-11\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"四川音乐学院院长柴永柏沉迷多人运动：88位女教师只剩1人()昨天的讨论课。结论是：拥有权力的一方，会用各种手段来侵害求职者的利益！比如下面这个案例----四川音乐学院的院长，全院88个女老师，他睡了87个。这个院长，大概比我大10岁。坚持考了9年的大学才考上医学院当了一个兽医。因此，当年我们大概率做过同一套考题，但他落选了！2：你怎样才能“自由自尊”地行走在这个星球上？\",\"url\":\"https://www.zhihu.com/pins/2015090618897023330\"},{\"slug\":\"2026-03-11-美以击杀哈梅内伊算不算一步“臭棋”\",\"year\":\"2026\",\"title\":\"美以击杀哈梅内伊算不算一步“臭棋”？\",\"date\":\"2026-03-11\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"能打的伊朗像当年的伊拉克一样没脾气，宗教领袖不领袖的，也就这么回事。问题就是伊朗把他的27个军事基地都给打了。美国和以色列只能从1-2000公里以外的基地出发去轰炸伊朗！正常的人会不会想:如果是跟中国打起来，美国怎么办？中国周边的美国军事基地，肯定一天之内就没了！中国的航母和055，防空系统，可以让美国的飞机进不来。伊朗这一战，让全世界看到了中国和美国交战回事什么样的结果。\",\"url\":\"https://www.zhihu.com/question/2012597340175892945/answer/2015209351418258075\"},{\"slug\":\"2026-03-10-AI时代-最重要的能力-不是学习知识-而\",\"year\":\"2026\",\"title\":\"AI时代。最重要的能力，不是学习知识，而是学会提问！ 比如看了后面的案例，就要提出下面这些问题出来！ 然后---你能提出这些问题，你就有可能解决这些\",\"date\":\"2026-03-10\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"最重要的能力，不是学习知识，而是学会提问！比如看了后面的案例，就要提出下面这些问题出来！然后---你能提出这些问题，你就有可能解决这些问题！如果你不会提问，会回答问题也可以勉强过下去，但你显然需要找一个会提问的导师来帮助你，你就是做跟随者的料了！如果你不但不会提问，甚至你连问题都不会回答，你就太惨了。（本题目，也是公主班的集训内容）思考1：你认为现在的中国普通人，会怎样应对中年失业的问题？\",\"url\":\"https://www.zhihu.com/pins/2014718711056065039\"},{\"slug\":\"2026-03-10-「考上二本已经很厉害了」-你认同这个说法\",\"year\":\"2026\",\"title\":\"「考上二本已经很厉害了」，你认同这个说法吗？\",\"date\":\"2026-03-10\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"你来问网友，网友说啥都可以：安慰你的，说你够厉害了。比农村没上学的人强多了。想损你的网友，说你考个二本，智商着急。如果让你爹妈来说，你当然考上二本就很厉害了。就算考不上二本，你依然是最棒的儿子！别人家孩子比不上的孩子，因为就你是亲生的！对于一流的顶尖企业来说：考上985也没啥了不起。因为他们只要C5和C9的毕业生，你个普通985算啥？他们就从来看不见二本的人。你认为你厉害，我就承认你厉害。\",\"url\":\"https://www.zhihu.com/question/3314603291/answer/2014673761341842027\"},{\"slug\":\"2026-03-10-二本学校明明水平就不行-为什么很多二本任\",\"year\":\"2026\",\"title\":\"二本学校明明水平就不行，为什么很多二本任教的老师都不承认？\",\"date\":\"2026-03-10\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"二本的教师不承认【二本水平明明就不行】。因为只要把他们调去清华北大当教师，清华北大也一样人才辈出，因为学生行。就算把清华北大的老师原封原样的搬过来二本教学，培养出来的学生。因为现在的大学，其实根本老师就没啥实质性的作用和价值，就是装样子的，教不教效果都差不多。高校的水平就是有学生的水平和档次决定的！那么：作为学生，你承认不承认自己也无能呢?花费同样的时间去上学，为啥你就是要比别人差？\",\"url\":\"https://www.zhihu.com/question/2011085433669432187/answer/2014684542489862628\"},{\"slug\":\"2026-03-10-人在资本的眼里-就是一个利润工具-如果你\",\"year\":\"2026\",\"title\":\"人在资本的眼里，就是一个利润工具！如果你不能创造价值，你就没有存在的必要！ 你也没有任何社会地位！ 普通人如果失去了消费能力，不再有能力产生税收，就\",\"dat 甚至动了手——结果呢？亲子关系降到冰点，孩子连“爸”都不叫了。\",\"url\":\"https://www.zhihu.com/pins/2011936772830025093\"},{\"slug\":\"2026-03-02-我一直坚持融资炒股-但内心一直觉得-老巴\",\"year\":\"2026\",\"title\":\"我一直坚持融资炒股。但内心一直觉得：老巴反对融资炒股，所以我是错的！ 但：明明看到这么好的，让我白捞钱的机会，我却不要？我实在是不忍心！ 比如：平安\",\"date\":\"2026-03-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"但内心一直觉得：老巴反对融资炒股，所以我是错的！但：明明看到这么好的，让我白捞钱的机会，我却不要？比如：平安银行愿意贷款给我，收取3%的利息！同时：我如果用这笔钱，去买入平安银行，做平安的老板，我每年可以收到5.5%的利息。覆盖掉融资成本之后，我白白赚取2.5%的差价。其实我一分钱的本钱都没有出，我只要买入后睡觉就行了！直到现在，我看到一份最新的持仓报道，才知道：谁说巴菲特不借钱，他借的钱可多了。\",\"url\":\"https://www.zhihu.com/pins/2011785023058092574\"},{\"slug\":\"2026-03-02-特别申明-大多数人-差不多99的人\",\"year\":\"2026\",\"title\":\"特别申明：大多数人---差不多99%的人，是不适合炒股为生的。特别是借钱炒股！更不适合这些人！只会让这些人赔光光。连银行专业人员都不敢做的事情。普通人怎么能做！\",\"date\":\"2026-03-02\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"我说的这种“白捞钱”的情况，只适合1%的，有着正常思维和判断力和情绪控制力的人。超级自律的人才能做！因此：请勿模仿我的这种投资模式。你刚开始会赚钱，但赚钱之后，心态变化，最终一定会吃大亏的！因为大多数人都没有自我掌控的能力！\",\"url\":\"https://www.zhihu.com/pins/2011891455854129191\"},{\"slug\":\"2026-03-01-长见识了国家级欺骗-战略误导-以色列有\",\"year\":\"2026\",\"title\":\"长见识了:国家级欺骗。战略误导！ 以色列有关联的一些媒体屡次声称，哈梅内伊因“恐惧暗杀”，一直居住在秘密安全地点。 【一名以色列高级官员称，哈梅内伊\",\"date\":\"2026-03-01\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"以色列有关联的一些媒体屡次声称，哈梅内伊因“恐惧暗杀”，一直居住在秘密安全地点。【一名以色列高级官员称，哈梅内伊在当天以色列对伊朗的一次空袭中身亡。该官员还称，哈梅内伊遗体已在其官邸废墟中被找到。包括女儿女婿在内四个人一起死亡】我认为：以色列的战略欺骗手段一流。公开宣告哈梅内伊躲起来了，藏在秘密的地方。第一就是贬低对手是胆小鬼。第二是欺骗伊朗的官方，以为他的情报还没有暴露，没有人出卖他。\",\"url\":\"https://www.zhihu.com/pins/2011450262213112110\"},{\"slug\":\"2026-02-28-“我饱受批评是因为我赢了-如果我表现不好\",\"year\":\"2026\",\"title\":\"“我饱受批评是因为我赢了，如果我表现不好，他们根本不会在意。” 的确：有谁喜欢你，就有谁反感你。一动分阴阳\",\"date\":\"2026-02-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"“我饱受批评是因为我赢了，如果我表现不好，他们根本不会在意。”的确：有谁喜欢你，就有谁反感你。一动分阴阳……\",\"url\":\"https://www.zhihu.com/pins/2011226851880756915\"},{\"slug\":\"2026-02-28-最终在崩溃中-选择了去瑞士接受安乐死\",\"year\":\"2026\",\"title\":\"【最终在崩溃中，选择了去瑞士接受安乐死。】 为啥清黑要追着我们死咬？要编造很多莫须有的鬼故事出来？ 因为他们原来“抛弃今日”或者“被今日除名”的人 ummary\":\"当你弱小的时候，喝粥就是落后文化的标志。当你强大的时候，喝粥都觉得好有文化，吃面包就太逊了。当初我们喝像药物一样的咖啡，也觉得自己就是高等人了。现在---外国人得学着喝凉茶了。[开心]原来的上流社会的有文化，重视健康的有钱人，喝红酒而不是黄酒。当中国弱小，挨打的时候，当然拳击，现代格斗，才是全世界最伟大的格斗技术！当中国强势崛起的时候，传武和太极，才是全世界顶尖的先进格斗文化代表！\",\"url\":\"https://www.zhihu.com/pins/2010295023070115659\"},{\"slug\":\"2026-02-26-查了一下资料-2019年12月3日-格\",\"year\":\"2026\",\"title\":\"查了一下资料：　2019年12月3日，格力电器公告称，珠海明骏以46.17元/股的价格接受格力集团转让的9.02亿股格力电器股份，合计转让价款为416.62亿元\",\"date\":\"2026-02-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"今天的开盘价，是37.58元。算起来：这六年，珠海明骏拿到了15元的股息，股票的跌幅也只有8元多。不过：银行的利息，应该2019年还很高的，不会低于5%。所以：400亿的资金成本（自有资产也要算成本的），六年下来，应该是120亿-130亿。赚了不到70亿的差价，赔了120亿的利息。总体算起来，这笔400亿的投资，收益是负几十亿。董明珠也没赚钱，她的入股全是借的钱，都拿来还利息了。\",\"url\":\"https://www.zhihu.com/pins/2010312483135575856\"},{\"slug\":\"2026-02-26-记得当年是卖掉50多元的格力-去买了30\",\"year\":\"2026\",\"title\":\"记得当年是卖掉50多元的格力，去买了30多元的万华化学。不是不看好格力了。而是觉得当初30多元买格力的时候，万华也差不多价格。怎么格力大涨了，万华还趴在地上。不\",\"date\":\"2026-02-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"忍心看万华被抛弃，就去拯救一下落难王子算了。后来万华很意外，居然就冲到了100多元，我就全逃掉了。去年跌到50多元，不忍心，我又买回来了。今天，我以90.96元卖掉一部分万华，在37.61元买入了格力。张磊投资400亿格力，似乎现在也没有讨好。不如我借点低利息的钱去买张磊抛掉的股，沾点大户的光？我看老人的养老账户上，持有一百多万股的啤酒股票。是不久前刚卖掉冲15元的惠泉，换进来9元多的珠江。\",\"url\":\"https://www.zhihu.com/pins/2010302883988538470\"},{\"slug\":\"2026-02-25-“拿道德的金牌、拿风格的金牌、拿干净的\",\"year\":\"2026\",\"title\":\"【“拿道德的金牌、拿风格的金牌、拿干净的金牌”，这句话，和国乒越来越没有关系了】 我们会尽力去拿实力碾压的金牌。不指望裁判的公平。 现在公平这种东西\",\"date\":\"2026-02-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"【“拿道德的金牌、拿风格的金牌、拿干净的金牌”，这句话，和国乒越来越没有关系了】我们会尽力去拿实力碾压的金牌。不指望裁判的公平。现在公平这种东西，面对巨大荣誉的时候，是稀有的宝物，不是自然获得的。\",\"url\":\"https://www.zhihu.com/pins/2010136295620498484\"},{\"slug\":\"2026-02-25-几乎九成九的男生爆改-都会选择公主网红\",\"year\":\"2026\",\"title\":\"【几乎九成九的男生爆改，都会选择公主网红妆。】 我们生活在一个男不男，女不女的时代。悲哀！ 我们小时候，会以穿女装为耻辱。 诸葛亮羞辱司马懿，\",\"date\":\"2026-02-25\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"【几乎九成九的男生爆改，都会选择公主网红妆。】我们生活在一个男不男，女不女的时代。我们小时候，会以穿女装为耻辱。诸葛亮羞辱司马懿，就是送一套女装给他穿，嘲笑他不敢出战！现 的。装一大堆无用的东西。[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/2009671552145302299\"},{\"slug\":\"2026-02-24-原来西方上层社会真的会吃人-还以为是汉\",\"year\":\"2026\",\"title\":\"原来西方上层社会真的会吃人？ 还以为是汉尼拔之类的怪物才会吃人，原来：西方人骨子里面就有吃人的意识！ 小李子，奥斯卡奖获得者。文化上层的形象代表！\u003c\",\"date\":\"2026-02-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"原来西方上层社会真的会吃人？还以为是汉尼拔之类的怪物才会吃人，原来：西方人骨子里面就有吃人的意识！小李子，奥斯卡奖获得者。文化上层的形象代表！居然吃人，而且还炫耀自己吃人的能耐。可怕至极！我很喜欢小李子出演的【泰坦尼克号】。也喜欢他拿奥斯卡奖的【荒野猎人】。但我非常不喜欢他演的【大空头】金融片，我觉得这个人物非常变态！没想到：真正的小李子更变态！\",\"url\":\"https://www.zhihu.com/pins/2009672167399372781\"},{\"slug\":\"2026-02-24-张清一-闭关营的一对一思维和沟通训练\",\"year\":\"2026\",\"title\":\"张清一：闭关营的一对一思维和沟通训练\",\"date\":\"2026-02-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"清迈的孩子们闭关了，因此，我有机会对他们进行真正的思维训练了！为了培养学生的沟通，交流的能力，我在清迈第一次跟孩子们玩了一个沟通游戏一：角色扮演根据下面的这个事件。因为两人的思维就不在一个层次上，你要用对方的思维层次，来让他自己看到自己的可笑之处！我让孩子们继续思考和训练去，直到自己能够良好的完成沟通任务为止我相信：如果这个题目，用来考家长们，大多数家长都会被考翻掉的！\",\"url\":\"http://zhuanlan.zhihu.com/p/2009676847470883569\"},{\"slug\":\"2026-02-24-知乎AI给我颁了个卡\",\"year\":\"2026\",\"title\":\"知乎AI给我颁了个卡\",\"date\":\"2026-02-24\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"对我的春节行为做了一个总结：实话说，这个AI总结还是比较认真和到位的，找理由表扬，也重视理解和提供证据，比普通的领导好多了。电脑系统，似乎比人更能共情。以后估计都不需要朋友了。因为AI比你的知心朋友“更懂你”，更会变着花样的夸你。你的春节精神状态是「庙堂与江湖无缝衔接的六边形战士」：前一秒还在「中产消失时代真的开启了」里预判经济趋势，下一秒就带着小白酒和云南烟给泰国工人发春节福利；……\",\"url\":\"http://zhuanlan.zhihu.com/p/2009615554877621124\"},{\"slug\":\"2026-02-24-自驾车去过西藏-也认识西藏的活佛-我还\",\"year\":\"2026\",\"title\":\"自驾车去过西藏，也认识西藏的活佛。 我还和色达佛学院的僧人辩过经，被我说的满头大汗的。逃走了！ 我都西藏没啥好感，又冷，又无聊。人也没啥敬仰的。再也\",\"date\":\"2026-02-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"自驾车去过西藏，也认识西藏的活佛。我还和色达佛学院的僧人辩过经，被我说的满头大汗的。逃走了！我都西藏没啥好感，又冷，又无聊。人也没啥敬仰的。再也不想去了！这文章，骂死西藏了。揭示了西藏的历史和虚伪。我觉得该骂！不明白有些汉人，为啥把西藏人抬得高高的。脑子有病！\",\"url\":\"https://www.zhihu.com/pins/2009552414496276528\"},{\"slug\":\"2026-02-23-凯琪没有上过今日三校-没有接受过系统的今\",\"year\":\"2026\",\"title\":\"凯琪没有上过今日三校，没有接受过系统的今日文科的训练。按道理---她不会带班的。因此，作为第一批清一木兰，在泰国打过几场职业赛事，也拿过锦标赛铜牌的凯琪，当初我\",\"date\":\"2026-02-23\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"告诉她：我认为她可以选择去带班，比她坚持练武会更符合她的天性！当时凯琪是不相信的：怎么可能她没上过今日三校，却能去带班？我说：知识是很容易补充的（比如赵刚指导让她补充学习的小红书，小黄书）。而且她的专注力很好，有毅力去克服困难，做到自己的最好！这种素质，会帮助凯琪成为一个优秀的老师的。果然---凯琪甚至在带班选择中，击败了一些老今日出生的学生、成为了今日的学生们最喜欢的老师之一。\",\"url\":\"https://www.zhihu.com/pins/2009267888440244073\"},{\"slug\":\"2026-02-23-张清一国学精讲-上智与下愚-忧患与安乐\",\"year\":\"2026\",\"title\":\"张清一国学精讲：上智与下愚，忧患与安乐！\",\"date\":\"2026-02-23\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"比如孔子源自《论语·阳货》中的“唯上智与下愚不移”，常常会被人用来骂别人愚蠢。本来没有机会来清迈跟新教育圈内最优秀的学生在一起的泰语班，也一起过来闭关了。家长感叹：来了才知道，泰语班的孩子与公主班，冠军班的学生，差的真不是一星半点。而其他被选拔出来的，精英班级的学生，看起来更有热情，眼神都更坚定和清澈，做运动都很认真的样子。因此，骨子里面的价值观，与新教育提倡的积极进取，精英至上的价值观差距很大。\",\"url\":\"http://zhuanlan.zhihu.com/p/2009208351003805151\"},{\"slug\":\"2026-02-23-我看知乎上-谷爱凌金牌-搜索是378万\",\"year\":\"2026\",\"title\":\"我看知乎上，【谷爱凌金牌】搜索是378万人！ 【镖人风起大漠】搜索是375万人！ 因此，你可以正常的推导出来：谷爱凌的代言价值为何很高了？几个亿？远\",\"date\":\"2026-02-23\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我看知乎上，【谷爱凌金牌】搜索是378万人！【镖人风起大漠】搜索是375万人！因此，你可以正常的推导出来：谷爱凌的代言价值为何很高了？几个亿？远远超过一般的运动员？因为镖人这部电影，也就只能赚几个亿了。（票房预期15亿。利润一两个亿）谷爱凌一个人，就顶一个热门电影，超过一个企业的正常收入。这就是文化体育消费行业的价值！据说未来有7万亿。伙计们，加油！\",\"url\":\"https://www.zhihu.com/pins/2009276358883304608\"},{\"slug\":\"2026-02-23-看样子-中国的农民都要失业了-马上就要被\",\"year\":\"2026\",\"title\":\"看样子，中国的农民都要失业了。马上就要被无人农业淘汰了。土地集体所有已经成为必然走向了. 除了去城市给人打工（被机器替代），将来，你们还能怎样生活下去？我\",\"date\":\"2026-02-23\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"看样子，中国的农民都要失业了。马上就要被无人农业淘汰了。土地集体所有已经成为必然走向了.除了去城市给人打工（被机器替代），将来，你们还能怎样生活下去？我都挺担忧的。除非资本家发好心，愿意来养着你一辈子！否则，普通人真的没法有出路了！\",\"url\":\"https://www.zhihu.com/pins/2009385529406402974\"},{\"slug\":\"2026-02-23-过年和父母大吵一架怎么办\",\"year\":\"2026\",\"title\":\"过年和父母大吵一架怎么办？\",\"date\":\"2026-02-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"父母要做到理性优雅公平，难度是很高的，比考大学难多了！有些人，上了顶尖大学，对子女说话，也是跟疯子一样！第二：既然你选了这个父母，就要接受她们是疯子！不要被他们道德捆绑真正有爱的父母，不会去限制自己孩子的自由！你不需要去谴责他们，需要原谅他们，忘记他们的恶劣之处，然后，你离开，去过你认为正常的生活，你当你认为正确的父母。反正---就是不要要求父母改变、来符合你的要求。\",\"url\":\"https://www.zhihu.com/question/2005239534070298096/answer/2009271622339688101\"},{\"slug\":\"2026-02-23-这文章写的不错-养儿不再防老-因为儿媳\",\"year\":\"2026\",\"title\":\"这文章写的不错：养儿不再防老。 因为儿媳妇不养老！世界运行的逻辑已经变了！ 这一点都不奇怪，因为我没有养儿媳。她不想养我也正常！ 关键是儿子，\",\"date\":\"2026-02-23\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"这文章写的不错：养儿不再防老。世界运行的逻辑已经变了！这一点都不奇怪，因为我没有养儿媳。关键是儿子，我认为也靠不住。娶了媳妇忘了娘的男生多的是。特别是现在怕老婆的男人，怎么可能指望将领养你的老？不气死你就算好的了因此，人，还是要对自己的老伴好一点，别指望儿女！多锻炼身体，多注意健康，会自己跟自己玩（比如阅读，听音乐！有自己的圈子）等实在动不了的时候，早点安乐死算了。\",\"url\":\"https://www.zhihu.com/pins/2009273203990754388\"},{\"slug\":\"2026-02-22-一个非常有上进心的人-善良的人-努力工作\",\"year\":\"2026\",\"title\":\"一个非常有上进心的人，善良的人。努力工作，赚钱。不去吃毒品。还让自己染上毒瘾的弟弟摆脱毒品。这样的好哥哥，却被干掉了。 因此教训就是：不要去帮助下堕的灵魂\",\"date\":\"2026-02-22\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"一个非常有上进心的人，善良的人。努力工作，赚钱。不去吃毒品。还让自己染上毒瘾的弟弟摆脱毒品。这样的好哥哥，却被干掉了。因此教训就是：不要去帮助下堕的灵魂、不要去承接这种下堕的因果。对于下层人，我们只有远离！\",\"url\":\"https://www.zhihu.com/pins/2008994878231704635\"},{\"slug\":\"2026-02-22-体重-这里差-100-克-都绝对不让你过\",\"year\":\"2026\",\"title\":\"体重：这里差 100 克，都绝对不让你过。 其实，也未必是这样的，泰国有时候，会把体重超过我们10-15公斤的对手安排给我们打，不打还不行！ 最离谱\",\"date\":\"2026-02-22\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"体重：这里差100克，都绝对不让你过。其实，也未必是这样的，泰国有时候，会把体重超过我们10-15公斤的对手安排给我们打，不打还不行！最离谱的一次，就是安排我们东亚锦标赛打45公斤级的拳手，拿了冠军。但在泰国，让我们这人，去跟东亚锦标赛60公斤级的拳手打！双方都很吃惊，对方上场前才知道是跟45公斤的拳手打。当然，结果还不错，是我们的45公斤拳手，KO了60公斤的冠军对手！\",\"url\":\"https://www.zhihu.com/pins/2009037643304935683\"},{\"slug\":\"2026-02-22-宇树王兴兴-随着AI和机器人技术的大流行\",\"year\":\"2026\",\"title\":\"宇树王兴兴：随着AI和机器人技术的大流行，快则2-3年，慢则3-5年，最多不超过10年，机器人就能和人一样的干活。 目前也许国内最了解机器人的就是他了！\u003c\",\"date\":\"2026-02-22\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"宇树王兴兴：随着AI和机器人技术的大流行，快则2-3年，慢则3-5年，最多不超过10年，机器人就能和人一样的干活。目前也许国内最了解机器人的就是他了！毕竟这套教育制度，是工业化时代为了培养人成为打工仔设计的教育路线。基本就是马斯克说的---机器人负责干活，人负责娱乐。当人变成废物的时候，当人不再有他人需要你的时候，你还能干啥？我认为：未来需要的是阅读和思考能力的培养，也许需要思考更有价值的问题。\",\"url\":\"https://www.zhihu.com/pins/2009013106563629780\"},{\"slug\":\"2026-02-22-张清一-居然有奖励从顶尖大学退学的奖金学\",\"year\":\"2026\",\"title\":\"张清一：居然有奖励从顶尖大学退学的奖金学？\",\"date\":\"2026-02-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"因此他想找出这些最有天赋，最有愿望的大学生，支持他们去自由创业！如果在中国，谁敢鼓励清北最优秀的学生退学去创业，还给钱。首先就是清一大学会按照最顶尖的大学标准来培养学生！清一大学同时，也给经济条件不够好的家庭的学生，提供全额奖学金，帮助优秀的、有理想的学生入读！因此显然清一大学，是按照全世界最顶尖大学的标准来录取学生的！清一大学本科学科教育的成绩，是完胜这些全国最顶尖的外国一大学的！\",\"url\":\"http://zhuanlan.zhihu.com/p/2008925742495445994\"},{\"slug\":\"2026-02-22-教人真的太难了-想把大人的思想-放进小\",\"year\":\"2026\",\"title\":\"教人真的太难了。 想把大人的思想，放进小人的心里。难度真的很大 如果家长继续用小人的思维来影响孩子，孩子当然心安理得的当小人。 除非家长和学校\",\"date\":\"2026-02-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"教人真的太难了。想把大人的思想，放进小人的心里。难度真的很大如果家长继续用小人的思维来影响孩子，孩子当然心安理得的当小人。除非家长和学校都是大人，只接受大人，才有可能成为大人！\",\"url\":\"https://www.zhihu.com/pins/2009008190768039930\"},{\"slug\":\"2026-02-22-百度的萝卜快跑-已经布局20个城市-其目\",\"year\":\"2026\",\"title\":\"百度的萝卜快跑，已经布局20个城市。其目标是在2026年实现单车盈利转正。目前在手订单巨大！的确---不用支付驾驶员工资的出租车，显然拥有巨大的成本优势。任何普\",\"date\":\"2026-02-22\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"加上车价便宜，如果我有自动驾驶的话，如果在泰国，自己买几辆车备用。维护下来都比要人去开车的费用低廉多了！马斯克的无方向盘汽车已经上市。我还在叹息5年后自动驾驶成熟，现在去跑滴滴的人就失业了没想到：来的这么快，而且居然是2026年就能实现赢利？这不就意味着成本的大量降低吗（据我所知，萝卜快跑的车价明显低于有人驾驶车。因为他笨—，开得慢），我以为是靠补贴维持的。如果低价就已经实现盈利。\",\"url\":\"https://www.zhihu.com/pins/2008992119562461438\"},{\"slug\":\"2026-02-22-米兰冬奥自由式滑雪女子-U-型场地技巧决\",\"year\":\"2026\",\"title\":\"米兰冬奥自由式滑雪女子 U 型场地技巧决赛，谷爱凌卫冕，李方慧摘银，如何评价他们的发挥？\",\"date\":\"2026-02-22\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"也恭喜中国队取得境外冬奥会历史最佳成绩。这块金牌谷爱凌不容易没有夺金之前，大批的人出来黑谷爱凌。对她的失误指指点点的，对夺金的美国队员去捧臭脚。竞技体育，很难有啥门槛和护城河，都是高度激烈的竞争，稍稍有点发挥不正常，就被别人超过了！也许就是格斗我们目前还有一点护城河，我们可以凭借老祖宗的智慧，暂时拥有垄断性的优势。但谷爱凌的知名度，应该会给她的职场生涯带来很多方便。\",\"url\":\"https://www.zhihu.com/question/2008677675422672634/answer/2008987936620816256\"},{\"slug\":\"2026-02-22-高考会不会被取代呢\",\"year\":\"2026\",\"title\":\"高考会不会被取代呢？\",\"date\":\"2026-02-22\",\"type\":\"回答 的是野蛮和凶恶的底线。 中高层社会，就是斗智斗勇的地方。比的是全方位的素质和智慧，技\",\"date\":\"2026-02-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"底层社会，就是满满的恶意堆积起来的地方。比的是道德底线，文明的底线，比的是野蛮和凶恶的底线。中高层社会，就是斗智斗勇的地方。比的是全方位的素质和智慧，技巧！相比起来，我愿意脱离底层，尽量去中高层玩！虽然也很不容易，但总比当恶人的奴才跟班好多了。\",\"url\":\"https://www.zhihu.com/pins/2008150513271711442\"},{\"slug\":\"2026-02-20-泰拳世界锦标赛奖牌榜-IFMA2025\",\"year\":\"2026\",\"title\":\"泰拳世界锦标赛奖牌榜 &IFMA2025年回顾与展望\",\"date\":\"2026-02-20\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我没有找到成人赛事的奖牌榜，但我找到了2025年10月举办的世界青年泰拳锦标赛的榜单！我们木兰在2024年东亚锦标赛和蒙古交过手，TKO了蒙古队员。现在的泰国，我记得几年前的一个榜单，泰国是高高在上的第一名！（题图就是几年前的世锦赛奖牌榜，当年泰国还是第一名）怎么到了现在，2025年，泰国居然连金牌榜单都排不上来。2025年世界锦标赛，菲律宾就拿了7枚金牌，总共15枚奖牌！\",\"url\":\"http://zhuanlan.zhihu.com/p/2008290573057038312\"},{\"slug\":\"2026-02-20-清一拳手正在清迈备战2026泰拳世锦赛\",\"year\":\"2026\",\"title\":\"清一拳手正在清迈备战2026泰拳世锦赛！\",\"date\":\"2026-02-20\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一团队，正在清迈积极备战2026年世界泰拳锦标赛。中国队连小小的越南都赶不上：越南队在2025年土耳其世界锦标赛。清一拳手首次得到了国家体育总局的重视，给了我们多个参赛名额！就因为我们清一拳手组队参加了2024年的东亚泰拳锦标赛，直接抢走了香港队的四块金牌！清一大学武医学院的文章-知乎2025全国泰拳锦标赛简报7|最终篇-决赛日()为了备战今年的世界锦标赛，为国争光。\",\"url\":\"http://zhuanlan.zhihu.com/p/1993755270699057500\"},{\"slug\":\"2026-02-20-真有这样的金腰带挑战赛-却临阵逃脱的拳手\",\"year\":\"2026\",\"title\":\"金腰带挑战赛临阵逃脱的拳手，真的没出息\",\"date\":\"2026-02-20\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2008267921114280908\"},{\"slug\":\"2026-02-20-美国高校里-吸毒现象非常普遍-有30到\",\"year\":\"2026\",\"title\":\"美国高校里，吸毒现象非常普遍，有30%到70%的学生涉及毒品行为。  这些数据，如果是真的，我不明白中国的父母为啥还要送孩子去美国。特别是一些没有教\",\"date\":\"2026-02-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"美国高校里，吸毒现象非常普遍，有30%到70%的学生涉及毒品行为。这些数据，如果是真的，我不明白中国的父母为啥还要送孩子去美国。特别是一些没有教育好的，喜欢吃喝玩乐的，消费者类型的孩子！\",\"url\":\"https://www.zhihu.com/pins/2008194125208508278\"},{\"slug\":\"2026-02-19-一个40岁的职场人士的挣扎-看了觉得-新\",\"year\":\"2026\",\"title\":\"一个40岁的职场人士的挣扎 看了觉得：新教育的人简直太幸福了。 39岁不到，就可以终身养老退休了！ 如果打了世界冠军，20多岁 summary\":\"@Jack孔庆杰()我猜测：你现在愿意回澳洲去上大学，原来应该是为了满足你生物爹的愿望---去接轨体制的！因为他一直希望你们能够回到体制，回到“美丽的澳洲\\\"！所以--你爹此时发难，应该不是他自己说的，都怪新教育让你们离他越来越远。因此他才抱怨，才要出来公开的诬陷我们，诬陷你们两个孩子教育失败了，想要借此毁掉新教育的母体。因此你生物爹，现在提出来攻击我们的理由，指控，应该是不存在的！\",\"url\":\"https://www.zhihu.com/pins/2007544898811885501\"},{\"slug\":\"2026-02-18-多年前-明一班上资治通鉴-就是用的张居正\",\"year\":\"2026\",\"title\":\"多年前，明一班上资治通鉴。就是用的张居正专门给小皇帝编写的教材 严格要求学生，是师德！ 但人性。不喜欢被严格要求。 所以：权力很恐怖！\",\"date\":\"2026-02-18\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"多年前，明一班上资治通鉴。就是用的张居正专门给小皇帝编写的教材严格要求学生，是师德！就算我教出来的学生很优秀，家长只要不满意，依然可以拿我去砍头的！比如孔家长：他当皇帝的话，肯定想砍了我的头。尽管他儿子SAT考了1570分！但他偏要说：他儿子我没教好。就因为他找情人，被儿子鄙视了。因此他要出来诋毁今日，想要毁掉今日！他认为儿子就会回归他身边了！所以：我们还是远离各种权力吧，真心惹不起！\",\"url\":\"https://www.zhihu.com/pins/2007533848397906170\"},{\"slug\":\"2026-02-18-常春藤真不难的-1500分以上-基本素质\",\"year\":\"2026\",\"title\":\"常春藤真不难的。1500分以上，基本素质到位，想上就上了。 真不明白国内的家长，居然把常春藤看这么高。 会者不难，难者不会 我现在苦恼的是：学\",\"date\":\"2026-02-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"常春藤真不难的。1500分以上，基本素质到位，想上就上了。真不明白国内的家长，居然把常春藤看这么高。会者不难，难者不会我现在苦恼的是：学生不想去常春藤怎么办？还有：家长的经济条件跟不上怎么办?我依然认为常春藤，美国名校、就是收智商税的！除非你是真天才！\",\"url\":\"https://www.zhihu.com/pins/2007531103985088503\"},{\"slug\":\"2026-02-18-张清一-君臣父子的奥义-人类父亲和动物\",\"year\":\"2026\",\"title\":\"张清一：君臣父子的奥义--人类父亲和动物父亲及动物不如的父亲\",\"date\":\"2026-02-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这里讲个故事，古代朱温的故事，充分体现了【君臣父子】的含义！更加简单的解释，就是说：如果人，真实身份活得只是一个动物，我们就只能按动物的标准来对待他了！如果一个人，真实身份，连动物的标准都配不上，我们也只能按“禽兽不如”的标准来对待他，别把他当人看！这种大年初一就公开出来，点名羞辱孩子和家人，全网指名道姓去攻击自己孩子和妻子的人，绝不是啥正常人，不是啥良善之辈，也不是真正的人类父亲该有的所为。\",\"url\":\"http://zhuanlan.zhihu.com/p/2007430027000705646\"},{\"slug\":\"2026-02-18-我说偷吃啥了呢-原来偷吃人了-作业是\",\"year\":\"2026\",\"title\":\"我说偷吃啥了呢？ 原来偷吃人了！ 作业是可以试错的。游戏是可以重启的！ 可是，人生不能试了玩的！ 有些机会，就是一生只有一次的！\",\"date\":\"2026-02-18\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"我说偷吃啥了呢？原来偷吃人了！作业是可以试错的。游戏是可以重启的！可是，人生不能试了玩的！有些机会，就是一生只有一次的！开弓没有回头箭。所以：如果是对你很重要的事情。就别拿来开玩笑！\",\"url\":\"https://www.zhihu.com/pins/2007590665589116972\"},{\"slug\":\"2026-02-18-挺可笑的-孩子培养得很优秀-都已经长大了\",\"year\":\"2026\",\"title\":\"挺可笑的，孩子培养得很优秀，都已经长大了。马上就出成果了，马上就要人生起飞了。居然这蠢蛋父亲，现在来拿孩子威胁母亲：你们所有人，都必须到我身边来伺候我。看我的脸\",\"date\":\"2026-02-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"其实现在孩子长大了的家庭，对父亲已经没有啥真正的依赖了。子女本来不想掺和父母的感情变故，只想中立。但这愚蠢的父亲，居然跳出来逼迫儿女站队。用脚指头都能想到---孩子注定会站妈妈这边的。这父亲用威胁，耍无赖来解决问题，注定老来孤独，无人理睬，注定是必然的了！啥都不说，就风风光光的把母亲辛苦多年的成果捞到手里了！儿女成功了，他以“父亲”的身份出来亮相，捞名。我家的孩子，全都是跟母亲走的，无一例外。\",\"url\":\"https://www.zhihu.com/pins/2007577184357872204\"},{\"slug\":\"2026-02-18-有人还劝山长三思-“疏不间亲”-你们真\",\"year\":\"2026\",\"title\":\"有人还劝山长三思 “疏不间亲”。 你们真的是不明事理呀！  如果这生物爹，是私下跟他儿子乱说话的，我会教这儿子理解，同情这个爹。 毕竟：\",\"date\":\"2026-02-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"有人还劝山长三思“疏不间亲”。如果这生物爹，是私下跟他儿子乱说话的，我会教这儿子理解，同情这个爹。但这生物爹，是公开的跑到我的场子里面砸场子的。这就已经不是他们家的私事，是涉及大家的公事了！我当然，也必须，要公开的答复这生物爹了！你们自己想想就知道了：这儿子和她女儿，就算是本人很优秀，但你的儿女，将来喜欢她们家两人，想要嫁--娶去他们家。你会不会会劝你们家女儿，虽然这男生人不错，挺优秀的。\",\"url\":\"https://www.zhihu.com/pins/2007494088405062500\"},{\"slug\":\"2026-02-18-能上游轮的人-经济都不差了-这些行为\",\"year\":\"2026\",\"title\":\"能上游轮的人，经济都不差了！ 这些行为。真的可笑，可怜！ 中国人在外国的形象很差，这些大妈们的贡献非常关键。 也许再过500年，中国人能够文明\",\"date\":\"2026-02-18\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"能上游轮的人，经济都不差了！这些行为。真的可笑，可怜！中国人在外国的形象很差，这些大妈们的贡献非常关键。也许再过500年，中国人能够文明一点！优雅一点！\",\"url\":\"https://www.zhihu.com/pins/2007605104266723798\"},{\"slug\":\"2026-02-17-这个场景让我想到我们这些上班族每月领取\",\"year\":\"2026\",\"title\":\"【这个场景让我想到我们这些上班族每月领取的工资，其实就是海豚每表演完一个动作后得到的饲料吧。我们每月的时间也是用来取悦他人，满足他人的人生目标，并不是真正的为自\",\"date\":\"2026-02-17\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"】安娜很不错的，一眼看到本质。我们都是受训的海豚，只是他们上的海豚学校，去学他们在大海中根本不需要的知识、本质上是为了替主人赚钱，不是自己的本性。你对海洋馆的看法也挺好的---这些东西对我有啥价值和意义？到处看一样的东西，就是被控制去主动打卡的海豚了！可笑的是：我作为亿万富一代，我女儿18岁了，却从来没带她去过迪斯尼，也没去过海洋世界。不如这些从小“长见识”出来的高端女，我们一家都好土！\",\"url\":\"https://www.zhihu.com/pins/2007185292046669543\"},{\"slug\":\"2026-02-17-你为什么讨厌衡水中学\",\"year\":\"2026\",\"title\":\"你为什么讨厌衡水中学？\",\"date\":\"2026-02-17\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"你们不是讨厌衡水中学，你们只是讨厌要用艰苦的方法，去赢得你们想要的胜利罢了！我们当然都喜欢用轻松的方式去赢。如果你懂得比衡水更好的方法去学习考试上大学的话，当然就不用去衡水了。不然衡水还是有他的价值的。我不会送孩子去衡水，如果送去了，我会让她咬牙坚持下来。因为只要是人能做的，你也能做！这就是我们家的家教！\",\"url\":\"https://www.zhihu.com/question/463459404/answer/2007217697558110535\"},{\"slug\":\"2026-02-17-你把字母表都用完了-清华毕业都找不到工作\",\"year\":\"2026\",\"title\":\"你把字母表都用完了？清华毕业都找不到工作？ 天啦。。。。清一公社提供的条件是不是太优越，都不像真的了，居然有终身养老。 冠军班的学生加油，拿到世界冠\",\"date\":\"2026-02-17\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"你把字母表都用完了？清华毕业都找不到工作？清一公社提供的条件是不是太优越，都不像真的了，居然有终身养老。冠军班的学生加油，拿到世界冠军，就比清华毕业都更靠谱，我发终身冠军养老津贴名额肯定是有限。最多四位数吧？我想三位数就行了，现在就开始限制。非今日三校的冠军班就不要了！这样靠谱一些。\",\"url\":\"https://www.zhihu.com/pins/2007209557852709175\"},{\"slug\":\"2026-02-17-回复某澳大利亚高华-今天大年初一-来我新\",\"year\":\"2026\",\"title\":\"回复某澳大利亚高华，今天大年初一，来我新年第一文这里，骂我让他家庭破碎的信息！ 孔先生您好： 大过年的，您公开来我这里拜年留言，还是实名。我要不回复\",\"date\":\"2026-02-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"回复某澳大利亚高华，今天大年初一，来我新年第一文这里，骂我让他家庭破碎的信息！孔先生您好：大过年的，您公开来我这里拜年留言，还是实名。毕竟:今天大年30，我怎样都要给面子的。我一直都不知道这情况，你夫人够给你面子了！在成绩上，他去年的SAT考了1580分，是今日学堂的最高分之一。比如您公开拿妻子，儿子的实名来这里公开嗮出来攻击？至于您很优秀，你是【堂堂正正的优等澳大利亚公民】，是高等华人。\",\"url\":\"https://www.zhihu.com/pins/2007173314716669037\"},{\"slug\":\"2026-02-17-张清一新年第一文-君子和小人可以用一样的\",\"year\":\"2026\",\"title\":\"张清一新年第一文：君子和小人可以用一样的方法对待吗？\",\"date\":\"2026-02-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"今天让孩子们强化用腿开路，接拳攻击的模式，三拳一腿实战版。我们聘用了一群泰国的工人，在给孩子们盖新房子！那么，对待身边的人，对待孩子的教育，也应该根据人不同，应该有所区分的！君子和小人，肯定要用不一样的方式来对待和培养！你去跟小人谈理想，谈追求，就是对牛弹琴了。比如对于有志君子，你说应该刻苦训练，去打世界冠军，去为国争光，你还可以通过武术格斗的训练，让自己克服心理和意志上的缺陷，成为更完善的人。\",\"url\":\"http://zhuanlan.zhihu.com/p/2007040242742486405\"},{\"slug\":\"2026-02-17-懂得感恩的人最有福气赞-天晴很儒雅\",\"year\":\"2026\",\"title\":\"懂得感恩的人最有福气[赞] 天晴很儒雅，可能是从小读经的关系。这也是大家喜欢天晴的地方。工作很认真负责，是孩子们的好老师。\",\"date\":\"2026-02-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"懂得感恩的人最有福气[赞]天晴很儒雅，可能是从小读经的关系。这也是大家喜欢天晴的地方。工作很认真负责，是孩子们的好老师。\",\"url\":\"https://www.zhihu.com/pins/2007205684689790146\"},{\"slug\":\"2026-02-16-现在想要找个正常人都已经很难了-”-“\",\"year\":\"2026\",\"title\":\"【现在想要找个正常人都已经很难了。” “什么是不正常的人？”我们几乎一起发问。 “就这么说吧，假如我一天约了10个面试，会有5个人找不到路打道回府，\",\"date\":\"2026-02-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"【现在想要找个正常人都已经很难了。“就这么说吧，假如我一天约了10个面试，会有5个人找不到路打道回府，3个人临时放鸽子，剩下2个人像我要迫害他们一样充满敌意。所以很多公司一直在招人，但很多人又一直找不到工作。”】这情况，的确看着都难，我也有一样的观感。也许今日是唯一想要培养正常人的地方，但家长还不买账。我想的是：现在看到似乎一切都好，但没有正常人的社会，难道会是正常的社会吗？\",\"url\":\"https://www.zhihu.com/pins/2006700647962132688\"},{\"slug\":\"2026-02-16-回答很有道理-不仅仅是经济上的问题-是中\",\"year\":\"2026\",\"title\":\"回答很有道理：不仅仅是经济上的问题，是中国没有尊重格斗的文化环境[赞]。 国人的确对出头的名人喜欢贬低，找茬。太习惯于窝里斗。 同时：我们也没有出现\",\"date\":\"2026-02-16\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"回答很有道理：不仅仅是经济上的问题，是中国没有尊重格斗的文化环境[赞]。同时：我们也没有出现真正技术独特，令人眼前一亮的国际格斗明星。张伟丽虽然不错了，也很难支撑像当年的泰森一样的世界级别的明星人气。因为国内对打泰拳不重视，参与的人不多，水浅一点，我们才有机会选拔代表中国去参赛！国内的拳手不太喜欢去玩职业泰拳的原因，就是打泰拳太难，太狠，而且没编制。等打完了泰拳，再去打其他拳，都可以轻松干了！\",\"url\":\"https://www.zhihu.com/pins/2006991196023699158\"},{\"slug\":\"2026-02-16-张清一-小女也许是唯一18岁都没看过春晚\",\"year\":\"2026\",\"title\":\"张清一：小女也许是唯一18岁都没看过春晚的中国人！\",\"date\":\"2026-02-16\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"今晚好像就是“春晚之夜”了，我突然想：小女应该从来没有看过春晚。也许小女创造了一个“中国之最”：作为正常的中国人，长到18岁，居然都没有看过一次春晚。记得上一次我们家与春晚发生关系，是她的姐姐才13岁的时候。大概是2010年的样子，我们一家在会泽过春节，她申请想看春晚，自己一个人自己看的。我说不是---是除夕晚上，全体中国人全家在一起一起要看的一个东东！于是：我让助教们下载了2024年的春晚。\",\"url\":\"http://zhuanlan.zhihu.com/p/2006735839342908442\"},{\"slug\":\"2026-02-16-我的武大本专业-电气-校友-985硕士\",\"year\":\"2026\",\"title\":\"我的武大本专业（电气）校友，985硕士！ 2019年上岗，现在干的就是最简单的工作：“我读了这么多年书，现在干的活，我高中没毕业的表弟培训俩月也能干。”\u003c\",\"date\":\"2026-02-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我的武大本专业（电气）校友，985硕士！2019年上岗，现在干的就是最简单的工作：“我读了这么多年书，现在干的活，我高中没毕业的表弟培训俩月也能干。”原来我们大学毕业，就是天之骄子。家长们还在努力让孩子死死的走文凭之路，不知道是死路一条吗？教育和文凭的未来，已经彻底改变了。清迈大学的研究生摆摊为生，中国的985毕业生，开网约车。何必为了一个没有前途的文凭去牺牲自己的生命来喂养呢？\",\"url\":\"https://www.zhihu.com/pins/2006697611546088670\"},{\"slug\":\"2026-02-16-挺浪漫的-遇见未来的自己-人生是规\",\"year\":\"2026\",\"title\":\"挺浪漫的---遇见未来的自己！ 人生是规划出来的，自己给自己规划，才是有效的！ 如果自己不规划自己的人生，媒体和广告，身边的人，就会“帮你规划”。让\",\"date\":\"2026-02-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"挺浪漫的---遇见未来的自己！人生是规划出来的，自己给自己规划，才是有效的！如果自己不规划自己的人生，媒体和广告，身边的人，就会“帮你规划”。让你成为一个庸人！祝福英子走在成长的道路上！\",\"url\":\"https://www.zhihu.com/pins/2006695409918170020\"},{\"slug\":\"2026-02-16-搏击产业为什么在中国发展不起来\",\"year\":\"2026\",\"title\":\"搏击产业为什么在中国发展不起来？\",\"date\":\"2026-02-16\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"不仅仅有经济上的问题，也有中国骨子里，还没有发展出尊重格斗运动的文化环境。国人的确对出头的名人都喜欢找茬，贬低，当黑粉。同时：我们也没有出现真正技术独特，令人眼前一亮的国际格斗明星。张伟丽虽然不错了，也很难支撑像当年的泰森一样的世界级别的明星人气。因为国内对打泰拳不重视，参与的人不多，水浅一点，我们才有机会选拔代表中国去参赛！虽然在国际上，泰拳的参与者比拳击更多，世界锦标赛的运动员也更多。\",\"url\":\"https://www.zhihu.com/question/22276413/answer/2006999391387549838\"},{\"slug\":\"2026-02-16-餐饮的逻辑变了-酒水的逻辑也变了\",\"year\":\"2026\",\"title\":\"餐饮的逻辑变了，酒水的逻辑也变了\",\"date\":\"2026-02-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/2006769526474293900\"},{\"slug\":\"2026-02-15-通过国际协调让欧元对人民币贬值30\",\"year\":\"2026\",\"title\":\"【通过国际协调让欧元对人民币贬值30%。】 我觉得---这不是啥广场协议。这就是未来的必然趋势。 日元，欧元，美元都不值现在的价格。都要贬值的\u003cbr\",\"date\":\"2026-02-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"【通过国际协调让欧元对人民币贬值30%。】我觉得---这不是啥广场协议。这就是未来的必然趋势。日元，欧元，美元都不值现在的价格。都要贬值的没理由顺差一万亿的人民币贬值。唯一的可能就是逆差国贬值……\",\"url\":\"https://www.zhihu.com/pins/2006317068878894526\"},{\"slug\":\"2026-02-15-一个家庭最大的悲哀-是不是「不会好好说话\",\"year\":\"2026\",\"title\":\"一个家庭最大的悲哀，是不是「不会好好说话」？\",\"date\":\"2026-02-15\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"其实：好好说话，是需要非常良好的教育和训练的，并不是一种天生就拥有的能力！我们天生会拥有说话的能力，但学会“好好说话”，真的很考水平和修养。另外，我们中国人，基本上没有好好说话的能力！因为我们缺乏一个理性，平等，对话的社会环境和社会文化！1：对外，对上，我们不需要真实的表达，不需要好好说话。因为层级关系，往往是乱套的，不知道谁拥有的地位如何，往往都是抢话语权，就是抢地位，因此谁都不会好好说话！\",\"url\":\"https://www.zhihu.com/question/1991153604409718336/answer/2006404037772349604\"},{\"slug\":\"2026-02-15-中产退场-消费降级的蝴蝶效应-餐饮市场\",\"year\":\"2026\",\"title\":\"中产退场，消费降级的蝴蝶效应 餐饮市场：客单价500元以上的订单大幅降低 200-300元的订单增加22% 几年前，我就一直在提醒我身边的朋友\",\"date\":\"2026-02-15\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"中产退场，消费降级的蝴蝶效应餐饮市场：客单价500元以上的订单大幅降低200-300元的订单增加22%几年前，我就一直在提醒我身边的朋友:未来是阶级下降的时代。不再是升级时代了，未来大量中产将消失。不要买房，不要创业，不要辞职！守住自己的钱，去买高息的股票。现在：我预言的一切都在实现！不听我话的一些人，还在激进进取的一些人，据说有人已经破产了！眼光不够，就老实一点，NOZUO。\",\"url\":\"https://www.zhihu.com/pins/2006445546282451118\"},{\"slug\":\"2026-02-15-你的职业5年后还在吗-起码开滴滴的人都\",\"year\":\"2026\",\"title\":\"你的职业5年后还在吗？ 起码开滴滴的人都下岗了！\",\"date\":\"2026-02-15\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"你的职业5年后还在吗？起码开滴滴的人都下岗了！\",\"url\":\"https://www.zhihu.com/pins/2006522470010726153\"},{\"slug\":\"2026-02-15-幸亏我早就辞职了-不然呆在这样的大学里\",\"year\":\"2026\",\"title\":\"幸亏我早就辞职了。 不然呆在这样的大学里面。我也要郁闷死的！ 很奇怪：还有人要上这样的大学。特别是文科。就算拿了文凭也找不到工作，还上啥？\",\"date\":\"2026-02-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"幸亏我早就辞职了。不然呆在这样的大学里面。我也要郁闷死的！很奇怪：还有人要上这样的大学。特别是文科。就算拿了文凭也找不到工作，还上啥？\",\"url\":\"https://www.zhihu.com/pins/2006530442711562062\"},{\"slug\":\"2026-02-15-张清一-为何太极与八卦形意同根同源\",\"year\":\"2026\",\"title\":\"张清一：为何太极与八卦形意同根同源？\",\"date\":\"2026-02-15\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"春节期间，我都在清迈指导一批不回家过春节，坚持训练的学生练“八卦和形意”。为了更加实战，还让ELLA和陆鸽练实战训练版本，一个走形意的路---直线钻翻。无论用八卦掌手法还是形意手法，对方都讨不到半点便宜！云手一招出去，就含了形意的钻翻之劲，也含了八卦的走转！如果不明白云手里面有形意八卦的劲，只会每天转手玩的话，其实是假太极。而且练形意八卦的人，大多数最后都变成了练太极拳了！\",\"url\":\"http://zhuanlan.zhihu.com/p/2006411376889980811\"},{\"slug\":\"2026-02-15-据我所知全世界都没有一个学校-能够平均分\",\"year\":\"2026\",\"title\":\"据我所知:全世界都没有一个学校，能够平均分超过1500分的。美国学费极其昂贵的私立高中顶尖名校，均分也就是1470左右。 因此，今日学堂，已经创造了世界记\",\"date\":\"2026-02-15\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"据我所知:全世界都没有一个学校，能够平均分超过1500分的。美国学费极其昂贵的私立高中顶尖名校，均分也就是1470左右。因此，今日学堂，已经创造了世界记录！我相信这个机会还可以维持下去的。不过，据说很多学生和家长，不是太想去美国读书了。因此我们现在打算转移方向，去攻读三语了，用一年时间去完成外国语大学需要学习四年的专业小语种。可以在16岁完成小语种加上 是这么与奥运会的精神毫不相关的事情。这真的与奥运\",\"date\":\"2026-02-10\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"会的宗旨背道而驰。”她还说：“体育运动的意义就在于将人们团结在一起。它是为数不多的共通语言之一，它连接着人类的身体、精神、竞争精神，以及打破纪录的能力，尤其是在我们这项运动中，它更是挑战人类的极限。”谷爱凌还说：“我为这些运动员感到难过，我希望他们能发挥出最佳水平。”希望我们的冠军木兰们，将来也可以这么有风度，有深度的说话，不带攻击，但有表达了立场，即使是特朗普也没法说她啥的！\",\"url\":\"https://www.zhihu.com/pins/2004578592558948507\"},{\"slug\":\"2026-02-10-这个文章好-就算是百亿资产-交给后代\",\"year\":\"2026\",\"title\":\"这个文章好： 就算是百亿资产。交给后代，也守不住的！关键点是---钱越多，越危险。因为惦记的人越多！ 因此我们才要去做【清一公社】。细水长流，守住我\",\"date\":\"2026-02-10\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"这个文章好：就算是百亿资产。交给后代，也守不住的！关键点是---钱越多，越危险。因为惦记的人越多！因此我们才要去做【清一公社】。细水长流，守住我们做自由人的底线---永远能够维持最基本的收入。家长们以为多留点钱给孩子，就稳当了，就是照顾孩子的。就是个一厢情愿的鬼话！反而是害死孩子了！\",\"url\":\"https://www.zhihu.com/pins/2004573036725175005\"},{\"slug\":\"2026-02-09-“人不能学习经验-人要学习原理”-上面这\",\"year\":\"2026\",\"title\":\"“人不能学习经验，人要学习原理” 上面这话挺好的，治大国如烹小鲜。就是说。烹饪的道理，和治大国的原理，本质上是一样的。但肯定不是“经验知识”。 肯定\",\"date\":\"2026-02-09\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"“人不能学习经验，人要学习原理”上面这话挺好的，治大国如烹小鲜。就是说。烹饪的道理，和治大国的原理，本质上是一样的。但肯定不是“经验知识”。肯定不能指望一个厨师能做菜就可以去当总理了。但明白了核心道理的人，他做什么都可以做好！多才多艺。多的不是经验，而是把道理转换成经验了！\",\"url\":\"https://www.zhihu.com/pins/2004266437871695820\"},{\"slug\":\"2026-02-09-他们知道这个人家肯定有存粮-于是都去他\",\"year\":\"2026\",\"title\":\"【他们知道这个人家肯定有存粮。于是都去他家抢粮，而且活埋了这家人。 】 大家认为抢粮可以理解，但活埋过分了。 我认为活埋也可以理解的。因为：如果不干\",\"date\":\"2026-02-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"因为：如果不干掉这个提醒自己的家庭，自己所干的流氓行为，以及自己的愚蠢和混蛋作为，就会永远被“看见”。因此这群人一定要“消灭原罪”，要毁灭这家照见自己丑陋的对手，让自己的良心和道德“更清白”！清黑攻击我们，不是我们做了啥不好的事情。更不是我们伤害了谁，而是我们过于优秀，照见了他们的愚蠢，自私和无能！但为了掩盖自己的缺点，他们就要去攻击我们，来证明自己的“正确判断”。\",\"url\":\"https://www.zhihu.com/pins/2004126080643138279\"},{\"slug\":\"2026-02-09-山长给了她一个改变自己命运的机会-来清\",\"year\":\"2026\",\"title\":\"【山长给了她一个改变自己命运的机会：来清迈，包吃包住，不用钱，训练3年，打中国冠军。】是说她三年内拿到中国的全国锦标赛冠军肯定没有问题，我们的女孩都是三年就拿到\",\"date\":\"2026-02-09\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"后面还有---然后她去代表中国 元，与沪银齐创新高，大宗商品是否面临巨大流动性危机或逼仓风险？\",\"date\":\"2026-01-30\",\"type\":\"回答\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"所以昨天我看对了，铜陵昨天的天量天价，超过百亿的巨大成交量，不像是正常的利好出货，真的是聪明钱在抢单。因为这种极度不正常的大宗价格，以及大幅的涨幅，代表对美元的不信任。逼空的背后，是伦铜的实物交割受到了质疑。原来裸空的单子，受到了多单用实体交割来逼迫空单反多。如果交易所交不出来货物，交割违约，交易所的信誉到底。以后的美元就别玩大宗了，所以现在的资本，都在恐慌性的买实物资产。\",\"url\":\"https://www.zhihu.com/question/2000330938584933849/answer/2000489602935460130\"},{\"slug\":\"2026-01-30-儿子考上985-却越来越冷漠自私了怎么办\",\"year\":\"2026\",\"title\":\"儿子考上985，却越来越冷漠自私了怎么办?\",\"date\":\"2026-01-30\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"其实，问题都出在父母身上！一个不理解孩子，不会跟孩子正常交流。只知道单向输出的父母，就会培养出这种孩子！温暖，可爱的孩子。需要一个温暖，可爱的父母才能培养出来！自私，冷漠的父母，满心的爱去表达给孩子，也无法培养出一个懂得沟通理解，良好互动的孩子！\",\"url\":\"https://www.zhihu.com/question/572973665/answer/2000719502195839048\"},{\"slug\":\"2026-01-30-刚刚早锻炼回来-看到有色全跌停了-有趣\",\"year\":\"2026\",\"title\":\"刚刚早锻炼回来。看到有色全跌停了。有趣！  看样子  ，我昨天看多不做多，反而做空成功了。抢了一百万股的好处。要不今天补回来？ 或者明天再补？\u003cb\",\"date\":\"2026-01-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"刚刚早锻炼回来。看到有色全跌停了。看样子，我昨天看多不做多，反而做空成功了。抢了一百万股的好处。要不今天补回来？我肯定要补会这一百万股的。不然对不起我昨天卖出的单子。我认为有色还没有走完，这只是震荡罢了，如果补回来，我大概率会补回中金岭南，而不是铜陵！因为她涨的时候拖后，跌的时候不含糊。因此：谁跌的多，就补回谁算了！用9元多卖掉的铜陵，去换7元多的中金，大概率是不吃亏的吧？\",\"url\":\"https://www.zhihu.com/pins/2000518521642321030\"},{\"slug\":\"2026-01-30-刚去看了上海有色金属网-期货铜-在29日\",\"year\":\"2026\",\"title\":\"刚去看了上海有色金属网 期货铜，在29日放量大涨之后，今天放量大跌。 但现货铜的价格，就完全不一样： 已经突破10万元一吨了。今天一天，长江现\",\"date\":\"2026-01-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"刚去看了上海有色金属网期货铜，在29日放量大涨之后，今天放量大跌。但现货铜的价格，就完全不一样：已经突破10万元一吨了。今天一天，长江现货铜的价格，就涨了1420元！一旦空方被迫空翻多，期货铜又会继续大涨的！这一波，我看有人要跳楼，有公司要破产，主要是美国想要控盘的公司。按道理应该跟随现货铜价走反着走，我认为是故意配合期货的，未来还是要反过来的，因此：我下午就准备把昨天涨停卖掉的一百万股买回来！\",\"url\":\"https://www.zhihu.com/pins/2000545332845617342\"},{\"slug\":\"2026-01-30-女人的确惹不起-疯的可以-躲起来的男人\",\"year\":\"2026\",\"title\":\"女人的确惹不起。疯的可以！ 躲起来的男人，聪明，不会余生被这些女人消耗了！\",\"date\":\"2026-01-30\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"女人的确 西\",\"year\":\"2026\",\"title\":\"白银涨到300和600的话，将直接导致西方金银定价权的消失。西方货币信用倒塌。 中国多年前就开始储备黄金，建立黄金交易权。当然价格以人民币为锚。如果西方美\",\"date\":\"2026-01-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"白银涨到300和600的话，将直接导致西方金银定价权的消失。西方货币信用倒塌。中国多年前就开始储备黄金，建立黄金交易权。当然价格以人民币为锚。如果西方美元定价失败。美元狂泻，人民币崛起。推导1----港元将暴跌。推导2：港元资产暴涨，未来的香港市场的股票，会比A股的溢价更高！如果真的我的逻辑实现了，AH倒挂现象，将出现在香港！目前，明显低估的AH票，值得提前介入！\",\"url\":\"https://www.zhihu.com/pins/2000323503992378422\"},{\"slug\":\"2026-01-28-“我宁愿孩子快乐地倒数-也不愿他抑郁地第\",\"year\":\"2026\",\"title\":\"“我宁愿孩子快乐地倒数，也不愿他抑郁地第一”这样的教育选择你敢吗？\",\"date\":\"2026-01-28\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"的确当上了第一名未必就快乐。不过倒数的学生，我还真没见过内心真正快乐的人！因为：人性都不喜欢落后，不喜欢LOW，不喜欢被鄙视。但倒数，就必定是被鄙视的人。就算别人不鄙视，自己也要鄙视自己的！因此---大量倒数的人，都活在自己的地狱里面家长的脑子好简单呀？这种家长，肯定没有当过第一。就意想别人第一的一定很不快乐！家长很可能就是原来的倒数的人，只是---你真的快乐吗？\",\"url\":\"https://www.zhihu.com/question/1984737234470060615/answer/1999877143627310182\"},{\"slug\":\"2026-01-28-今天其实我还买了一点没涨的小票-200亿\",\"year\":\"2026\",\"title\":\"今天其实我还买了一点没涨的小票（200亿以下盘子的），长期拿着的，我愿意拿10年！怕被清黑说操纵股市。就没有公布，只公布了为国接盘的大股[大笑]。还卖掉了中金黄\",\"date\":\"2026-01-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"金。涨了几倍了。够了。另外，为了表示对铜陵有色的支持和鼓励，卖了10万股铜陵。虽然我认为明天肯定还要涨停的，就当散财了！让大家都跟着发财[耶]有几只小票， 居然股价在10年的底部位置，我好喜欢！就是不太好买，我慢慢的买吧！\",\"url\":\"https://www.zhihu.com/pins/1999941656498169320\"},{\"slug\":\"2026-01-28-今天我持仓的有色-居然至少有六只涨停了\",\"year\":\"2026\",\"title\":\"今天我持仓的有色，居然至少有六只涨停了（我都没好好数）。 白银涨停，铜陵涨停。中金黄金涨停。天山铝业涨停。螺母涨停，连一贯羞答答的中金岭南，尾市居然也拉了\",\"date\":\"2026-01-28\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天我持仓的有色，居然至少有六只涨停了（我都没好好数）。螺母涨停，连一贯羞答答的中金岭南，尾市居然也拉了涨停。不过中国建筑不可思议的狂跌---居然跌破了5元。我挂单4.99元买了一百万股，算是为国接盘了。我看有人在吐槽----今年被国家队打蒙了！我看这些人的确好惨，别人在大把吃肉，他们在赔钱！所以:我于心不忍，就出手了，为国接盘---接国家队的盘。好歹我赚了钱，就拿点出来拯救一下急于出手的国家队！\",\"url\":\"https://www.zhihu.com/pins/1999877819589736201\"},{\"slug\":\"2026-01-28-今天股市大涨-茅台等绩优股却在跌-昨天有\",\"year\":\"2026\",\"title\":\"今天股市大涨，茅台等绩优股却在跌，昨天有色的跌，原来是假跌，今天报复性上涨。 我很奇怪现在很多人去抢茅台酒 如果你真的喜欢茅台，愿意花1499元去买\",\"date\":\"2026-01-28\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天股市大涨，茅台等绩优股却在跌，昨天有色的跌，原来是假跌，今天报复性上涨。我很奇怪现在很多人去抢茅台酒如果你真的喜欢茅台，愿意花1499元去买茅台酒。你干嘛不少花一点钱。只用1360元去买茅台股票？然后存股票？这样的话，每一股茅台股票，每年都会分52元以上的红利给你！可是你买的茅台酒？不会每年多涨几克给你吧？还要让你操心怎么存放。这种划不来的事情怎么能做呢！\",\"url\":\"https://www.zhihu.com/pins/1999851343557436446\"},{\"slug\":\"2026-01-28-我就没有这种待遇-银行不给我-虽然我的存\",\"year\":\"2026\",\"title\":\"我就没有这种待遇。银行不给我，虽然我的存款更多。 知道为啥吗？ 因为我不买银行的产品！ 所有的待遇，都来自于你的贡献！ 贡献不够，是没有\",\"date\":\"2026-01-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"我就没有这种待遇。银行不给我，虽然我的存款更多。知道为啥吗？因为我不买银行的产品！所有的待遇，都来自于你的贡献！贡献不够，是没有待遇的！\",\"url\":\"https://www.zhihu.com/pins/1999977585539556636\"},{\"slug\":\"2026-01-28-美国的中介和留学都崩了吗-活该\",\"year\":\"2026\",\"title\":\"美国的中介和留学都崩了吗？ 活该！\",\"date\":\"2026-01-28\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"美国的中介和留学都崩了吗？活该！\",\"url\":\"https://www.zhihu.com/pins/1999980485506511447\"},{\"slug\":\"2026-01-28-这篇文章提到的高端养老项目-清一高端\",\"year\":\"2026\",\"title\":\"这篇文章提到的高端养老项目， 【清一高端养老项目】，现在已经正式启动了。 现在我来亲自示范，指导，进入“培训时段”。 我将用一年的时间，带出一\",\"date\":\"2026-01-28\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这篇文章提到的高端养老项目，【清一高端养老项目】，现在已经正式启动了。现在我来亲自示范，指导，进入“培训时段”。我将用一年的时间，带出一批懂得高端养老陪伴的探路人。让新教育人，来为老人提供有尊严的，有价值的晚年生活！像是老人的孙女孙子一样，给老人亲情的安慰。老人最缺乏的，不是吃的，喝的，而是----陪伴和亲情！这种寂寞的老人，会被一些利益集团盯上，去买各种保健品，其实买回来不吃的。\",\"url\":\"https://www.zhihu.com/pins/1999958080151126313\"},{\"slug\":\"2026-01-27-“我们与它们的关系-就像三岁小孩与爱因斯\",\"year\":\"2026\",\"title\":\"“我们与它们的关系，就像三岁小孩与爱因斯坦，或者更糟糕——像蚂蚁与人类。” 的确，一个缺陷如此慎重的种群，毫无理性的种群。理论上不符合延续下去的资格！[捂\",\"date\":\"2026-01-27\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"“我们与它们的关系，就像三岁小孩与爱因斯坦，或者更糟糕——像蚂蚁与人类。”的确，一个缺陷如此慎重的种群，毫无理性的种群。试图让东方文明的简朴，简单健康的生活方式，重注精神发展的方式，来代替西方的物质文明发展。因为逻辑上，西方的物质文明，是不需要人类这种缺陷很严重的生物的。否则-----大家都一起成为机器的奴隶吧----甚至更可怜，我们连做奴隶都不够格，只能成为废物料。\",\"url\":\"https://www.zhihu.com/pins/1999408137946562819\"},{\"slug\":\"2026-01-27-我的根在宗祠-在妈祖-在同乡会-这\",\"year\":\" 43624997205938\"},{\"slug\":\"2026-01-24-很多人冲着洋河股份拿分红-目前股价按去年\",\"year\":\"2026\",\"title\":\"冲着洋河7%分红买入：真这么稳银行为什么不自己全买\",\"date\":\"2026-01-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"很多人冲着洋河股份拿分红，目前股价按去年的分功率是7%以上买入，认为是一笔绝佳的投资！我心想：真相信洋河的保证，银行自己有钱，就首先都全买洋河股份，长期去拿7%的分红，真没必要3%借给我用。但---似乎真有这个承诺、两年前洋河股份的承诺！仔细一看，就有点好笑了：洋河承诺每年利润70%分红，而且不低于70亿的时候，她这年实际上的利润，也才66亿元！这一政策，让当时已经跌到底部的洋河（73元多）。\",\"url\":\"https://www.zhihu.com/pins/1998510092539172719\"},{\"slug\":\"2026-01-24-我有-垫棺做枕-的作品不-是啥呢-新\",\"year\":\"2026\",\"title\":\"我有垫棺做枕的作品吗：《新教育天书》还是《太极实战格斗术》\",\"date\":\"2026-01-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我有【垫棺做枕】的作品不？是啥呢？【新教育天书】吗？还是【太极实战格斗术】？[笑哭][笑哭][笑哭]……\",\"url\":\"https://www.zhihu.com/pins/1998545565202543017\"},{\"slug\":\"2026-01-24-武松杀人-就是死罪-但-公平正义-也\",\"year\":\"2026\",\"title\":\"武松杀人是死罪，但公平正义也是要拿钱买的\",\"date\":\"2026-01-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"武松杀人，就是死罪。但【公平正义】，也是要拿钱来买的，有钱人，更有化大钱来买。这才是“江湖规则”以为别人会把公平正义白白的送给你，你优秀，因此你值得。你们真就是想多了！[捂脸][捂脸][捂脸]……\",\"url\":\"https://www.zhihu.com/pins/1998503859090388178\"},{\"slug\":\"2026-01-24-生育是本能-养育才是恩情赞\",\"year\":\"2026\",\"title\":\"生育是本能，养育才是恩情\",\"date\":\"2026-01-24\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1998549715285980805\"},{\"slug\":\"2026-01-24-这个消息发布后-第二天的行情-是白银继续\",\"year\":\"2026\",\"title\":\"白银卖出后继续涨停，成交量减半：浮动筹码被抢光了\",\"date\":\"2026-01-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"这个消息发布后，第二天的行情，是白银继续涨停。而且，好消息是：白银的成交量大幅减少。远远低于前一天的成交量，大概是一半左右！我正好买了200多万股，比卖出的股份更多。所以---我这样换也没亏[大笑]，还赚更多的！到20块也跟着你快速上涨，我10块卖掉也不遗憾，再去买别的没涨的股票去！贵的东西都放掉，不指望自己能够卖到最高，这是主力的权利，不是我的机会我甚至怀疑：我要不走，股票肯定不会涨！\",\"url\":\"https://www.zhihu.com/pins/1998395225555619980\"},{\"slug\":\"2026-01-24-这几个核心问题-都是很有逻辑的-本质上是\",\"year\":\"2026\",\"title\":\"马斯克是天才：机器人加AI取代人类工作后，人该干什么\",\"date\":\"2026-01-24\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\" :\"https://www.zhihu.com/pins/1998078533298317021\"},{\"slug\":\"2026-01-23-范仲淹-退休后回到苏州老家-创办了“范氏\",\"year\":\"2026\",\"title\":\"范仲淹创办范氏义庄：传到清朝还在运转，后代人才辈出\",\"date\":\"2026-01-23\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"人才辈出。这种“一人得道，鸡犬升天”的家族传承，才是古代官员最看重的东西。[赞][赞][赞]……\",\"url\":\"https://www.zhihu.com/pins/1998187602206033187\"},{\"slug\":\"2026-01-23-这个文章讲的人生道理-真的是有效的-的确\",\"year\":\"2026\",\"title\":\"只有自己强大时才有真正的人脉：人们对更优秀的人普遍抱有敌意\",\"date\":\"2026-01-23\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这个文章讲的人生道理，真的是有效的。的确是对社会和人性的真正认识。所谓的人脉，只有当自己强大的时候，才有真正的人脉。【人们对比自己优秀的人都普遍抱有敌意，除非你亮瞎他们的眼！】……\",\"url\":\"https://www.zhihu.com/pins/1997951843448419451\"},{\"slug\":\"2026-01-23-针对牢A-斯奎奇大王-锐评部分女留学生引\",\"year\":\"2026\",\"title\":\"针对牢A（斯奎奇大王）锐评部分女留学生引发的争议，如何看待海外女留学生的形象塑造与污名化？\",\"date\":\"2026-01-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"欧美的女留学生的名声，据我所知早就烂了。去英美国家学文科的女生，本质上就是去混日子的学渣，国内读不进去，国外也没有希望。如果是老老实实去读名校，读理工科的女生，可能还像样一点点，但这种人很少！今日三语一直对家长们说：不要去欧美留学了，智商税，家长不相信。要去只能去顶尖的TOP50大学，最好读理工科！国家拨款支持的这种本国顶尖大学，会相对正经一点。但---家长就是以为欧美是天堂，这就没办法了！\",\"url\":\"https://www.zhihu.com/question/1997285363912287274/answer/1997954977885344321\"},{\"slug\":\"2026-01-22-最终-自己的房子也住不起-家长们留给孩\",\"year\":\"2026\",\"title\":\"自己的房子最终也住不起：孩子努力工作只为保住你留下的房子\",\"date\":\"2026-01-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"最终，自己的房子也住不起。家长们留给孩子的房子，未来有房产税之后，会不会也是这样的情况呢？孩子努力工作，就是为了保住你留给她的房子！\",\"url\":\"https://www.zhihu.com/pins/1997593478914393567\"},{\"slug\":\"2026-01-22-燕京前天冲过12.52元-我卖了20万股\",\"year\":\"2026\",\"title\":\"燕京冲12.52卖了20万股想换珠江：洗牌洗得漂亮\",\"date\":\"2026-01-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"燕京前天冲过12.52元，我卖了20万股。没多想，就是想换入9.6的珠江也不亏。昨天跌了，还跌破12元。本来想买回来的，不过我在上课，错过了！我的猜想：燕京洗牌洗的漂亮。认为往年燕京出业绩利好，就要跌一波。然后---今天就拉回来了。燕京去年年底增加了1万多股东。照昨天今天这架势，这两天恐怕又洗掉了上千人！也许股东人数会跌破4万，走到3字头的。燕京此时的股价也一定是新高了！\",\"url\":\"https://www.zhihu.com/pins/1997676327944344598\"},{\"slug\":\"2026-01-22-父母对女儿的宠爱-真的会障碍孩子走向婚姻\",\"year\":\"2026\",\"title\":\"父母对女儿的宠爱会障碍她走向婚姻：我担心小女的参照物偏差\",\"date\":\"2026-01-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"然比不过久经社会考验的父亲，父母！我都有点担心小女了。我的存在，也许让她的异性参照物的对标出现偏差！\",\"url\":\"https://www.zhihu.com/pins/1997588261900678344\"},{\"slug\":\"2026-01-22-白银今天连续第三个涨停-我都晕了-前两天\",\"year\":\"2026\",\"title\":\"白银连续第三个涨停：9.43元清掉一个账户，有点忍不住了\",\"date\":\"2026-01-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"要，现在涨到快十块了你们来抢。早知道把啤酒都换成白银好了！（现在啤酒也不能空仓，因为去年一年没涨，也许今年也该涨了，哈哈——）。反正涨了我会卖掉，不涨我不卖！我的其他账户上，还有M级的白银持仓，守了两年了。管他的，跌停也没事，反正我早就是负成本了。我认为有色的行情，也就是刚刚开始，所以我也不敢空仓。也许等黄金白银都涨完了，下一个就该涨铜了。我现在提前一点，先坐在铜山上好好的等著！\",\"url\":\"https://www.zhihu.com/pins/1997669597302773486\"},{\"slug\":\"2026-01-22-美国吃相难看-欧洲自保-电力投资需求大增\",\"year\":\"2026\",\"title\":\"坚持有色不减仓只换仓：军备竞赛与电力投资推高钢铁有色需求\",\"date\":\"2026-01-22\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"筹，中建这些东西，今年都没希望。[表情]。但有色大涨不敢跟之后，这些大蓝筹，分红股，就属于“保险。避险”的品种！\",\"url\":\"https://www.zhihu.com/pins/1997584973738295930\"},{\"slug\":\"2026-01-22-银发经济来了-实话实说-家长们让孩\",\"year\":\"2026\",\"title\":\"银发经济来了：与其卷高考找工作，不如卷如何让老人开心\",\"date\":\"2026-01-22\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1997597288919500032\"},{\"slug\":\"2026-01-21-GMO传奇大佬格兰桑继续“唱空美股”-A\",\"year\":\"2026\",\"title\":\"GMO格兰桑继续唱空美股：AI泡沫不破的概率几乎为零\",\"date\":\"2026-01-21\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"GMO传奇大佬格兰桑继续“唱空美股”：AI泡沫不破的概率几乎为零()在泡沫里当熊，从商业角度几乎活不下去，因为你扛不起职业风险。牛市只要比你预期多撑一两年，市场和客户会一起惩罚你，你很难长期坚持防御或者做空。所以大多数人会选择“跟大家一起跳”。凯恩斯讲得很直白：跟着大部队一起错，你反而安全，工作也丢不了。\",\"url\":\"https://www.zhihu.com/pins/1997350136427324484\"},{\"slug\":\"2026-01-21-你的判断是对的-首富二富家庭的优秀男生\",\"year\":\"2026\",\"title\":\"首富家的优秀男生不会娶这家的女儿：作者终身未嫁的真实故事\",\"date\":\"2026-01-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"你的判断是对的，首富二富家庭的优秀男生，不太可能娶这家人的女儿。虽然她有才华，也有富人求亲，但求亲的是一个富裕的傻子。有点像剧情中柯林斯的女富豪的女儿（男版）向她求亲。而她自己，却跟一个有魅力的士兵私奔了，被欺骗后也没有结婚。然后她自己因为私奔，不肯嫁给能够改变家庭破产命运的富裕人家，被她的家庭宣布“开除家籍”，她就只能去一个贵族去当家庭教师。事实上，真正的富贵人家的家教很好，无论男女。\",\"url\":\"https://www.zhihu.com/pins/1997460831781281880\"},{\"slug\":\"2026-01-21-天下的父母可能都希望全世界都会想自己一样\",\"year\":\"2026\",\"title\":\"父母都希望全世界像自己一样养女儿：典型的消费者思维\",\"date\":\"2026-01-21\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"天下的父母可能都希望全世界都会想自己一样养自己的女儿吧？消费者思维模式的典型代表……\",\"url\":\"https://www.zhihu.com/pins/1997247085695758489\"},{\"slug\":\"2026-01-21-春节-教育斩杀线到来\",\"year\":\"2026\",\"title\":\"春节----教育斩杀线到来！\",\"date\":\"2026-01-21\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"多年来，我是不带孩子过春节的，因为我发现春节的斩杀线，分外的分明（我的孩子也有每年春节回家，以及不回家的对照版。分别成为了经营者和消费者思维模式）每年都有新教育的学生，春节后就被“斩杀”，失去了继续上学的机会，快速的走上了堕落的路线。其实父母也会不停的把负面意识，利用节日的机会来灌输给孩子。因此----每年春节过后，我们学校都必须去面对学生的学习行为大滑坡现象，要花很长时间才能恢复过来！\",\"url\":\"http://zhuanlan.zhihu.com/p/1997220485004546811\"},{\"slug\":\"2026-01-21-牢A提醒留学生家长-千万不要把你们的妻子\",\"year\":\"2026\",\"title\":\"牢A提醒留学生家长：千万不要把你们的妻子送到欧美社会去陪读，大家是怎么看待这个问题的？\",\"date\":\"2026-01-21\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"其他很多小语种国家的顶尖大学，才是不把外国留学生当猪仔卖的。别人真的是认真想好办好大学的，国家给大学拨款支持他们的教学。而英美国家对于国民可以是支持的，但对外国留学生，是要借用几百年的声誉进行收割的！第二个原因，就是英语国家是衰落的国家，学完后也未必好找工作。回国也找不到，不如去小语种国家更有职业发展空间！自己没啥本事，就是去美国留了学，对自己能力很强，地位很高的父母，都是一脸的挑剔看不起。\",\"url\":\"https://www.zhihu.com/question/1996939001437906264/answer/1997413772025943894\"},{\"slug\":\"2026-01-21-真的假的-这么变态的人类-献祭文化-不\",\"year\":\"2026\",\"title\":\"圣经旧约的献祭文化：疯狂地把孩子献给耶和华\",\"date\":\"2026-01-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"真的假的？这么变态的人类？献祭文化？不过圣经旧约读起来的确让人无法理解，疯狂的献祭孩子给耶和华……\",\"url\":\"https://www.zhihu.com/pins/1997447815182431593\"},{\"slug\":\"2026-01-21-千万远离货车\",\"year\":\"2026\",\"title\":\"千万远离货车\",\"date\":\"2026-01-21\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1997464335988061260\"},{\"slug\":\"2026-01-21-首富的堕落-今天去看了一下融创-还有碧桂\",\"year\":\"2026\",\"title\":\"首富的堕落：融创与碧桂园凄凉地躺在地上，净资产已为负\",\"date\":\"2026-01-21\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"首富的堕落今天去看了一下融创，还有碧桂园。这些原来赫赫有名的企业，今天凄凉地躺在地上。碧桂园的年K线，2020年前都是往上走的，记得多次媒体报道她们家接班的女儿是中国首富。我相信过去40年，他们一家是勤奋努力，打拼了两代人的。净资产已经是负数、当年多辉煌，今天就有多凄凉。其实政府根本就不怕你致富。我认为：每个人都要设定【止赚线】，钱够了就算了，别去拼命赚，不然没赚到还把原来的钱都赔回去了！\",\"url\":\"https://www.zhihu.com/pins/1997342690208147288\"},{\"slug\":\"2026-01-20-中国人真的生存能力超强\",\"year\":\"2026\",\"title\":\"中国人真的生存能力极强\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1997041676749922517\"},{\"slug\":\"2026-01-20-北大是个梦-有时候这个梦需要自己的目标去\",\"year\":\"2026\",\"title\":\"北大是个梦：梦需要用目标去匹配，否则只是浪费20年生命\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"北大是个梦，有时候这个梦需要自己的目标去匹配。能够匹配上，价值无穷。不能匹配，就毫无价值！如果仅仅是追求实现这个梦，却不知道用这个梦来实现什么真正的目标，就是生命的浪费！回过来想：付出的太多（20年的生命）。得到的太少---忘记了这20年可以去做更多，更精彩的事情！\",\"url\":\"https://www.zhihu.com/pins/1997045725306058071\"},{\"slug\":\"2026-01-20-我发现-创富一代的要求-和守富的二代要求\",\"year\":\"2026\",\"title\":\"创富一代与守富二代是完全不同的人：不疯魔不成活，但守不住财\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"我发现：创富一代的要求，和守富的二代要求，是完全不一样的人！不冒险，不敢闯荡，创新，就不可能成为创一代。这种敢冲敢闯的人，融创的孙宏斌应该是典型的表现。都认为他做融创的时候，由于已经破产了两次（被开除坐牢。许家印也一样，成功之后，依然闯荡，结果身败名裂。守富的人格，就是极度的自律和保守，有点像修道一样。对金钱完全没有欲望，但对研究财富的规律很感兴趣，像是一个学究一样，这种人才能守住财富！\",\"url\":\"https://www.zhihu.com/pins/1997008305403475356\"},{\"slug\":\"2026-01-20-机会不等人-世界上-有些事情是不可逆的\",\"year\":\"2026\",\"title\":\"机会不等人，有些事不可逆：从高到低容易，从低到高难\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"她想要去，可以马上成为妓女，根本就没有难度！比如一个妓女，突然想通了，想要从良，想要获取名誉，去当清一公主。大概只能去重新投生，换下辈子才有机会申请了。她这一生，就算思维完全转过来了，也根本不可能有机会！就算是她原来本就是公主，偶尔失足去当了妓女。一个世界冠军要去读大学，这个难度很小，虽然不是零难度，想读就读。但一个大学生，想要大学毕业后，再来重新训练，开始打世界冠军，基本上就不可能有啥希望了。\",\"url\":\"https://www.zhihu.com/pins/1997084295886566470\"},{\"slug\":\"2026-01-20-果然-北大毕业-理工科-也找不到工作了\",\"year\":\"2026\",\"title\":\"北大理工科毕业也找不到工作：不是文凭不好，是职场要求更多了\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"果然：北大毕业，理工科，也找不到工作了。显然不是文凭不好，而是----职场的要求更多了！\",\"url\":\"https://www.zhihu.com/pins/1997062195855516120\"},{\"slug\":\"2026-01-20-父母是孩子的神-父母的天花板-决定了孩子\",\"year\":\"2026\",\"title\":\"父母是孩子的神：锅儿是铁打的，我不能等靠要\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"父母是孩子的神。父母的天花板，决定了孩子的天花板！父母给我最大的教育，就是“锅儿是铁打的”。意思就是我不能等靠要，我只靠自己去成功！别指望一块泥巴能打成铁锅。也别指望一块顽石（铁矿）能够自动成为铁锅。不经过烈火的考验和捶打，就不可能有铁锅！这种教育，不惯孩子。和现在的家长真的差别好大！[捂脸]……\",\"url\":\"https://www.zhihu.com/pins/1996990605759386587\"},{\"slug\":\"2026-01-20-理解的思路还是很清晰的赞-基本上是这\",\"year\":\"2026\",\"title\":\"理解的思路很清晰，基本上就是这个方向和解法\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"理解的思路还是很清晰的[赞]基本上是这样的思维方向，解决思路！[赞]……\",\"url\":\"https://www.zhihu.com/pins/1997044092287328934\"},{\"slug\":\"2026-01-20-背后都是算计-利益相关方-利用自己掌控的\",\"year\":\"2026\",\"title\":\"背后都是算计：对缺乏思考的民营老板的精准猎杀\",\"date\":\"2026-01-20\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"背后都是算计：利益相关方，利用自己掌控的资源，进行的一场对缺乏思考的民营老板的精准猎杀。金融市场上，也到处是这样的杀猪盘！可笑的是：很多人居然以为自己会赢。我知道自己不会赢，只能去这些利益集团顾及不到的冷门去守住。不敢去热点抢肉吃。我知道哪里不是我能吃的肉，我担心自己成为肉！\",\"url\":\"https://www.zhihu.com/pins/1996992784217965123\"},{\"slug\":\"2026-01-19-叹息-你们一个家长大人-还不如小孩子\",\"year\":\"2026\",\"title\":\"家长还不如孩子懂根本：竟问能不能带孩子去妓院长见识\",\"date\":\"2026-01-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"怪不得一堆黑子黑我！学员日记：有学长问了个问题：如果孩子已经养废，还可以带去妓院长见识吗？小明慧的回答很抓根本：你做这件事情的目的是什么，是否可能达成？因此，我们要理解山长行为背后的思维才是最重要的，而不是山长这样做我们也这样做。“学我者生，似我者死”。\",\"url\":\"https://www.zhihu.com/pins/1996737125941528263\"},{\"slug\":\"2026-01-19-孩子的未来-同样是十几岁-你们的孩子-现\",\"year\":\"2026\",\"title\":\"同样十几岁：小明慧已在替你操心，你的孩子还让你担忧\",\"date\":\"2026-01-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"丢到社会上你依然无法保证他们可以自由的活下去？而差不多年龄的小明慧，已经在替你操心和安排你的这么大的孩子的前途和未来了。这种差异的背后，就是你们家长理念缺失带来的差异！笨蛋没活路，不好好学习提升，你们赚多少钱，都是空的。到老一场空，气死老糊涂！难道你们像像福贵的爹一样，活生生的气死吗？\",\"url\":\"https://www.zhihu.com/pins/1996573191557095975\"},{\"slug\":\"2026-01-19-林公主其实很有侠义之气赞-这是很多即\",\"year\":\"2026\",\"title\":\"林公主的侠义之气：练武拿冠军也练不出的品质\",\"date\":\"2026-01-19\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1996697134955771216\"},{\"slug\":\"2026-01-19-死亡的人中-6000多人有3000人是8\",\"year\":\"2026\",\"title\":\"6000名死者中3000人是80、90后：生活方式正夺走生命\",\"date\":\"2026-01-19\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"死亡的人中，6000多人有3000人是80-90后。如果这个数据是真的（很有可能）。说明生活方式正在快速夺走一群人的生命。因为这群人就是在富裕时代长大的，生活非常的富足。吃喝玩乐很厉害。而老一代，基本保持了朴素的生活方式！因此反而长寿一些！\",\"url\":\"https://www.zhihu.com/pins/1996706938239620908\"},{\"slug\":\"2026-01-19-看你们还敢在外面乱吃-凡是追求美味-就一\",\"year\":\"2026\",\"title\":\"追求美味就有化学品帮你调味：学会吃清粥淡饭才是聪明人\",\"date\":\"2026-01-19\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"看你们还敢在外面乱吃。凡是追求美味，就一定有一批化学品来帮你调味。你就要拿身体健康来换！因此，学会吃清粥淡饭，才是聪明之人！\",\"url\":\"https://www.zhihu.com/pins/1996697938366321712\"},{\"slug\":\"2026-01-19-真有这样的-子控-变态父母呀-一生的生\",\"year\":\"2026\",\"title\":\"真有子控变态父母：一生全寄托在孩子身上，孩子怎能不废\",\"date\":\"2026-01-19\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"真有这样的【子控】变态父母呀？一生的生命，都全部寄托在孩子身上，这样的孩子，怎么能不废掉呢？\",\"url\":\"https://www.zhihu.com/pins/1996615994647525168\"},{\"slug\":\"2026-01-18-2026今日三校备考班-清一公社义塾招\",\"year\":\"2026\",\"title\":\"【2026今日三校备考班】清一公社义塾招生在即\",\"date\":\"2026-01-18\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"很多家长说：今日三校的考选比考大学还难！也因此，各外围学堂也普遍开设了今日三语学校的“备考班”。那么：清一公社义塾在帮助完全没有准备，也不知道如何准备的学生，在备考今日三校上，有何特别的优势呢？清一山长给了清一公社义塾备考班一个特别优越的考选条件，目前只对义塾学生开放。一旦在备考期间，学生完成了这个相对“平庸”的指标，今日三校就同意：不附加其他考选条件，该生就可直接入学今日三校！\",\"url\":\"http://zhuanlan.zhihu.com/p/1996136705787441659\"},{\"slug\":\"2026-01-18-同意-英文是最愚蠢的语言-所以-公社义塾\",\"year\":\"2026\",\"title\":\"英文是最愚蠢的语言：公社义塾只学最美丽的中文\",\"date\":\"2026-01-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"同意：英文是最愚蠢的语言所以：公社义塾是不学英文的。只学最美丽的中文！\",\"url\":\"https://www.zhihu.com/pins/1996134750436496340\"},{\"slug\":\"2026-01-18-哈哈-英子校长写的挺完善的-赞爱\",\"year\":\"2026\",\"title\":\"英子校长的方案挺完善：先开备考营，三校改办体验夏令营\",\"date\":\"2026-01-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"[赞][爱]现在，你们就先开一个备考营。他们肯定要帮助大家，三校就放弃自己的试读夏令营了。让外面的学生，去真正的体验清一新教育的魅力。9月份之后，你们送走了试读营，公社义塾就要开始真正的教学了！你们将要开两个班：一个班，是只提供给公社社员的【素质教育班】，纯中文。另外一个班，是提供给外围的所有家庭的礼物，大家都可以申请的【三语教育班】，就是现在明慧带班的【泰语班】一样的模式。\",\"url\":\"https://www.zhihu.com/pins/1996271437242189670\"},{\"slug\":\"2026-01-17-你的理解能力还是很好的-思维和书面表达都\",\"year\":\"2026\",\"title\":\"把文字表达优势变成语言表达和沟通优势：这是最值的自我投资\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"你的理解能力还是很好的。思维和书面表达都不错，你可以发挥自己的优势，把文字表达的优势变成语言表达的优势，以及沟通的优势。这些都是公主班的优势，你在她们身边，就好好的学习复制这些优点到你的身上。这就是你最有价值的自我投资，符合未来趋势的投资。别人还没这机会呢！[感谢]……\",\"url\":\"https://www.zhihu.com/pins/1995926827546460622\"},{\"slug\":\"2026-01-17-四大家族领导人-最终只想做过普通人-不是\",\"year\":\"2026\",\"title\":\"四大家族领导人只想做普通人：权力的得失都太惨烈\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"四大家族领导人，最终只想做过普通人。不是普通人多好，而是作为权力的得到和失去，都是惨烈的！因果不虚！我很幸运。可以做个文化人。\",\"url\":\"https://www.zhihu.com/pins/1995857610017092084\"},{\"slug\":\"2026-01-17-姚振华500亿买来的破产命运-其实做实\",\"year\":\"2026\",\"title\":\"姚振华500亿买来破产：做实业难，不如做个小股东只投赢家\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"姚振华500亿买来的破产命运。其实做实业很难的，成功者的背后都是累累的白骨。不如做个小股东。只投资赢家！\",\"url\":\"https://www.zhihu.com/pins/1995995155023566505\"},{\"slug\":\"2026-01-17-是个广东人的价值观-揭示了广东人的优点\",\"year\":\"2026\",\"title\":\"广东人的价值观：只为生活，不讲情怀和主义\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"是个广东人的价值观，揭示了广东人的优点。当然也有缺点，就是都是为了生活，但没有啥情怀和主义也跟他们不相信政治有关……\",\"url\":\"https://www.zhihu.com/pins/1996125932562425752\"},{\"slug\":\"2026-01-17-章泽天完全不给-8-岁女儿看手机-禁止使\",\"year\":\"2026\",\"title\":\"章泽天完全不给 8 岁女儿看手机，禁止使用社交媒体，如何看待她的这种育儿理念？\",\"date\":\"2026-01-17\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这当妈妈的好聪明：未来最珍贵的资源，就是专注力和阅读力！可是，现在的网络和社交媒体，把孩子都给毁掉了。因为这些东西都在吸引孩子的关注，用于商业利益和广告，实际上是用电子信息把孩子喂养成“电子宠物”。因此，如果家长小时候，能够帮助孩子屏蔽掉网络和算法，养成阅读的习惯，就可以轻松超越同龄人，成为优秀者。如果她的生活方式和其他孩子格格不入，就会被排斥。如果家长不给她一样的工具，她就会与家长敌对起来。\",\"url\":\"https://www.zhihu.com/question/1994452797798770167/answer/1995907338255745806\"},{\"slug\":\"2026-01-17-罪犯也分等级-他提供服务-要的不是钱\",\"year\":\"2026\",\"title\":\"罪犯也分等级：他要的不是钱是尊重，自律和阅读是通道\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"罪犯也分等级。他提供服务，要的不是钱，而是尊重。自律和阅读，就是通向高层次人的通道。闭关营，就是培养这种人。当然。。。。不是为了去抢银行……\",\"url\":\"https://www.zhihu.com/pins/1995928694582162796\"},{\"slug\":\"2026-01-17-英语这门语言确实很弱智\",\"year\":\"2026\",\"title\":\"英语这门语言确实很弱智\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1995997734340166099\"},{\"slug\":\"2026-01-17-这些大学有啥竞争力-怎么在未来活下去-奇\",\"year\":\"2026\",\"title\":\"这些大学有啥竞争力？未来怎么活下去\",\"date\":\"2026-01-17\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1995999646175224748\"},{\"slug\":\"2026-01-16-41岁副教授有啥-我60多岁了-到现在\",\"year\":\"2026\",\"title\":\"41岁副教授有啥：我60多岁还是老讲师，10年前裸辞\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"41岁副教授有啥？我60多岁了，到现在都还是讲师一个，老讲师！[捂脸][捂脸][捂脸]所以我也辞职了。[开心]10年前辞职的，裸辞。\",\"url\":\"https://www.zhihu.com/pins/1995535808858433457\"},{\"slug\":\"2026-01-16-人性就是见不得别人好-只能自己比别人好\",\"year\":\"2026\",\"title\":\"人性就是见不得别人好：穷人穷是有道理的\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"人性就是见不得别人好，只能自己比别人好！穷人穷是有道理的……\",\"url\":\"https://www.zhihu.com/pins/1995628752311431697\"},{\"slug\":\"2026-01-16-今天意外看到兴业银锡-价格居然是51元\",\"year\":\"2026\",\"title\":\"兴业银锡从5元涨到51元：好好研究主力的手法\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"今天意外看到兴业银锡，价格居然是51元，我有点疑惑的看它的走势，发现两年多以前，也就5元。现在涨了10倍。真的了不起！好好研究一下主力的手法，怎么可能有这么大的差异！想看2006年我错过的财富机遇。2元多买的武钢。5-6元就卖掉了。结果涨到22元！也许现在20年后，还要再玩一遍这样的游戏，所以：我需要牢牢守住手中的有色筹码！\",\"url\":\"https://www.zhihu.com/pins/1995532252273213870\"},{\"slug\":\"2026-01-16-冠农股份今天冲高回落-说明冠农还在洗盘\",\"year\":\"2026\",\"title\":\"冠农股份今天冲高回落，说明冠农还在洗盘。应该会在10元期间继续徘徊一段时间，真的是步步为营。6元，7元，8元，9元整数区间，它都在震荡整理，证明主力志在长远。\u003c\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"冠农股份今天冲高回落，说明冠农还在洗盘。应该会在10元期间继续徘徊一段时间，真的是步步为营。6元，7元，8元，9元整数区间，它都在震荡整理，证明主力志在长远。我们也没啥好操心的。安心持股就行了。等整理结束。因为这架势，也不是出货的架势。有啥害怕的。当然，如果只是会看K线图，今天就是冲高回落。只是我不相信现在谁会出货，只会吞吞吐吐的，做一点差价！我没本事，也没时间陪玩。\",\"url\":\"https://www.zhihu.com/pins/1995492018080720105\"},{\"slug\":\"2026-01-16-我不是任何行业都能做到顶尖的-马云我不如\",\"year\":\"2026\",\"title\":\"我不是任何行业都能顶尖：但在我做的行业里他们不如我\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"我不是任何行业都能做到顶尖的马云我不如，雷军我不如。段永平我也不如。马斯克我也比不上。还有好多这样的人。。。。。。在他们的行业里面去做，我无法超过他们的。当然，在我现在做的行业里面，他们也不如我！[大笑]……\",\"url\":\"https://www.zhihu.com/pins/1995640841566435065\"},{\"slug\":\"2026-01-16-有哪些历史上的冷知识\",\"year\":\"2026\",\"title\":\"前清八旗子弟的穷讲究：今天的家长也在这样培养孩子\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"()这篇文章，收集整理了前清八旗子弟的“穷讲究\\\"。就是写照！今天的中国家长们，都在培养孩子吃喝玩乐的水平。将来一旦父母照顾不上了，可能就是这德行。别人帮忙都帮不上。就算弄到一点钱，就是马上用来吃掉。贪图享受，喜欢吃喝玩乐。这种消费者思维模式已经到了骨子里面这种人，将来怎么可能出息？所以，中国富人还是有传统的，都在培养败家子！懂吃懂喝，职场上有屁用！都是消费者的毛病！\",\"url\":\"https://www.zhihu.com/pins/1995566318150259684\"},{\"slug\":\"2026-01-16-这思路不错-好消息就是-你的起点比刘老\",\"year\":\"2026\",\"title\":\"你的起点比刘老师当年高：现在会写《小故事大智慧》了\",\"date\":\"2026-01-16\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"好消息就是：你的起点比刘老师当初高，当年她只会读【小故事大智慧】。因此，你20年后达到刘老师现在的水准，完全是没有问题的。当然---这20年刘老师每天都在努力用功，比我刻苦多了！我觉得一般人做不到，至少我没有见到第二个像她一样这么刻苦努力的人。还有--【这世上，没有这么有文化的村姑！另外，作为山长，才没时间不会跟这世界上的任何村姑都聊天的，毕竟我的时间一万元一小时。\",\"url\":\"https://www.zhihu.com/pins/1995633065104528710\"},{\"slug\":\"2026-01-15-「棋圣」聂卫平去世-你对他有哪些记忆-他\",\"year\":\"2026\",\"title\":\"「棋圣」聂卫平去世，你对他有哪些记忆？他对我国围棋界做出过哪些贡献？\",\"date\":\"2026-01-15\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"聂老是80年代我这一代人，在上大学时最崇拜的流量明星。围棋聂卫平和中国女排，是当时我们民族精神的寄托和荣耀！作为开创了中日围棋赛新纪录，三次力挽狂澜，神话般存在的擂主聂老，此生已经无憾！成名后作为长辈，与年轻的战鹰平辈相称，活得真实，通透！聂老把源于中国，却长期落后于日本围棋水平的中华围棋，重现荣光，捍卫了中华棋士的尊严。我愿把聂老的围棋精神，用于中华武术，带领中华武士击垮东洋人，西洋人。\",\"url\":\"https://www.zhihu.com/question/1995043465105469446/answer/1995197816339981192\"},{\"slug\":\"2026-01-15-冠农果然启动了-最高破到10.27了\",\"year\":\"2026\",\"title\":\"冠农启动破10.27：右侧敏感度还在，但现在只想一年20%\",\"date\":\"2026-01-15\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"冠农果然启动了，最高破到10.27了。这几天看盘面，感觉就是拉升试盘的。右侧投资的话，就应该大量买入了。证明我右侧的敏感度还在。可惜我已经不再年轻，不玩玩这种刺激的游戏了。上次中粮糖业意外大涨，我退出后，我增持了不少冠农来补仓。大家三季度看仓位情况，应该也看出来我再大幅增仓的！我怕持仓太多，惹主力不高兴，我就不加仓了，看着就行了。但我现在也不想减仓，就看它发疯吧，静静的等结果就好。\",\"url\":\"https://www.zhihu.com/pins/1995128719900165587\"},{\"slug\":\"2026-01-14-从78公斤级-可以降重到61.5公斤级来\",\"year\":\"2026\",\"title\":\"从78公斤降到61.5公斤：欧美拳手变态降重，我们不跟\",\"date\":\"2026-01-14\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"从78公斤级。可以降重到61.5公斤级来打比赛？我算是见识了欧美拳手的变态降重。我认为降重对身体影响很不好，所以不支持木兰们大幅降重。维持在正常水平即可。往往木兰们以接近真实体重的级别来打比赛。所以--她们都得面对大幅降重的对手。我们唯一的法宝就是提升技术对抗的水准。以45公斤的重量击败60公斤的对手！\",\"url\":\"https://www.zhihu.com/pins/1994826041668178820\"},{\"slug\":\"2026-01-14-当一个年轻人-还没有建立文化自信的时候\",\"year\":\"2026\",\"title\":\"没有文化自信就去欧美留学等于自残\",\"date\":\"2026-01-14\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"当一个年轻人，还没有建立文化自信的时候，去欧美国家留学，就等于自残。我已经看过太多把孩子送去美国后，培养出一个鄙视自己国家和文化的“人才”的事情了。我认为家长都是疯子----不过这些家长自己也是没有文化自信的人。不是因为我们穷，而是因为我们谄媚。中文很好的泰国人，面对我们问是否是华裔的时候，不少人会坚决地说：不不，我是泰国人。当然，面对欧美人的时候，泰国人往往也没有自信了，恨不得自己也成为白人！\",\"url\":\"https://www.zhihu.com/pins/1994692611504615572\"},{\"slug\":\"2026-01-14-有一个倒在女人石榴裙下面的知名男人-的\",\"year\":\"2026\",\"title\":\"有一个倒在女人石榴裙下面的知名男人！ 的确：王石讲话，就没啥实质性的内容，我猜：是他把精力都用在女人身上了，没有去好好的读几本书！没有去真正的思考人生。\u003c\",\"date\":\"2026-01-14\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"有一个倒在女人石榴裙下面的知名男人！的确：王石讲话，就没啥实质性的内容，我猜：是他把精力都用在女人身上了，没有去好好的读几本书！没有去真正的思考人生。也不懂生意模型。不然不会离开万科后创业三次均以失败告终。70岁了还去做直播？就是个笑话！\",\"url\":\"https://www.zhihu.com/pins/1995035713394213859\"},{\"slug\":\"2026-01-14-西方格斗人格-就是暴力-为了吸引人流-让\",\"year\":\"2026\",\"title\":\"西方格斗人格就是暴力：清一用优雅的太极克制西方暴力\",\"date\":\"2026-01-14\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"西方格斗人格，就是暴力。为了吸引人流，让人喜欢来观看，就必须黑化，负面人格。可以说：西方就是强盗哲学，暴力崇尚。清一格斗为了与西方这些暴力集团进行对比，我们就必须成为另外一面：用优雅的东方神秘技术（太极），克制西方的暴力。用柔和优美对照西方的暴力。只有这样，我们才能战胜ufc，为世树立东方美学！其实【杀死比尔】这部影片，呈现了东方武术的神秘魅力，我们的任务是在世界赛场上把它呈现出来！\",\"url\":\"https://www.zhihu.com/pins/1994847541821469119\"},{\"slug\":\"2026-01-14-赌场又不创造价值-怎么可能有赢家-逍遥\",\"year\":\"2026\",\"title\":\"赌场不创造价值，怎么可能有赢家：逍遥刘强死在期货上\",\"date\":\"2026-01-14\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"赌场又不创造价值，怎么可能有赢家？逍遥刘强不就是死在期货上吗？\",\"url\":\"https://www.zhihu.com/pins/1994766052610045514\"},{\"slug\":\"2026-01-13-广东人也讲感情-但更强调平等和尊重-不会\",\"year\":\"2026\",\"title\":\"广东人更讲平等尊重：不逼你喝酒来表示大家是一伙的\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"广东人也讲感情。但更强调平等和尊重。不会去强迫别人做自己不喜欢的事情来“表示大家是一伙的”。比如喝酒！你喝不喝，喝多少，想喝什么酒，都可以！他陪不陪都随意。但外省人就不一样，主奴意识很重。你不跟他一起，你就是看不起人！所以：新教育的学生，往往更像广东人。我都担心她们出去后能够适应这些“外省人”。我不知道这是教育的成功还是失败！\",\"url\":\"https://www.zhihu.com/pins/1994454296729777686\"},{\"slug\":\"2026-01-13-把交易做得如此苦巴巴的-何必呢-别人巴\",\"year\":\"2026\",\"title\":\"巴菲特跳着踢踏舞上班：我账户无论涨跌都开开心心\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"把交易做得如此苦巴巴的。何必呢？别人巴菲特都是跳着踢踏舞去上班！我每天账户无论涨跌，都是开开心心的只要每天我（投资的）的企业还在赚钱，你操心啥呢？不过--真心对现在做实体的人感到不容易，我们尊重他们吧。我们做交易的人，还能天天分股息收益的人。真心要感恩现在的生活。太美好了！\",\"url\":\"https://www.zhihu.com/pins/1994470393164083322\"},{\"slug\":\"2026-01-13-教育的崩塌-学校将只剩下社交的功能-我\",\"year\":\"2026\",\"title\":\"教育的崩塌：学校将只剩下社交的功能！ 我是真同意马斯克这一条的---我一直认为体制学校，就只有这一条价值，现在就是这样子的！不用等2000人才知道。\u003cb\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"教育的崩塌：学校将只剩下社交的功能！我是真同意马斯克这一条的---我一直认为体制学校，就只有这一条价值，现在就是这样子的！现在，你要学什么知识，任何知识，现在就可以找到各种网络途径学习！因此你们去上大学，上任何中小学，唯一的价值，就是利用其社交功能！今日三校也一样---如果你要的是SAT成绩，我们早就公布在网上了，也有人通过网上的示范。其他任何体制学校没有这一功能，因此注定是不被需要的学校！\",\"url\":\"https://www.zhihu.com/pins/1994456496851927090\"},{\"slug\":\"2026-01-13-明莉写得挺好的-她是最早的“清粉”-一份\",\"year\":\"2026\",\"title\":\"最早的清粉明莉：20多年跟随，从理工女做到三校校长\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"明莉写得挺好的。她是最早的“清粉”，一份用自己的20多年跟随和见证，一路走出来的道路！当初很多聪明的大学生，慢慢就市场经济中走失了。而当年的小学妹明莉，今天却成了三校校长和督学。成为了多种清粉们仰望的对象。当初逃离诗词歌赋的理工女，现在成为了人文女。富有文化和感性的力量。一切都来自当初明莉自己的选择和相信。[感谢]……\",\"url\":\"https://www.zhihu.com/pins/1994417914011481520\"},{\"slug\":\"2026-01-13-给你们看看-这就是能够看透生意模式的\",\"year\":\"2026\",\"title\":\"看懂生意模式并会修改完善，你就是顶尖PE争抢的资产\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"服务了！赚钱当然就是必然的了！\",\"url\":\"https://www.zhihu.com/pins/1994452775678014327\"},{\"slug\":\"2026-01-13-英子还是别去攻击生娃变笨的女人-就算是笨\",\"year\":\"2026\",\"title\":\"英子别攻击生娃变笨的女人，要学贾宝玉含蓄优雅地批评\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"英子还是别去攻击生娃变笨的女人。就算是笨了，她们也是为了民族的繁荣昌盛而做出的牺牲。你也不要因为自己没有生娃就自大，以为没生娃就不笨了。你实在想批评女人，也要学红楼梦的贾宝玉这样的富二代，贵二代。含蓄优雅的批评人，用批评自己的方式来批评女人。贾宝玉就说：女儿在没嫁人之前，都像水一样清澈，优雅，可人。可是嫁人之后居然就失去了本性，变得一团浊气，俗不可耐。这原因不是女人不好，肯定是因为男人太脏了。\",\"url\":\"https://www.zhihu.com/pins/1994346501913207959\"},{\"slug\":\"2026-01-13-这个对手来自于应越的拳馆捂脸-傲气十\",\"year\":\"2026\",\"title\":\"李想公主打得很冷静：对手碰拳都不碰，傲气十足\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"这个对手来自于应越的拳馆[捂脸]。傲气十足的样子，碰拳都不碰。李想公主打得很冷静[赞]。身子再软一点，打出弹劲来就更好了。相信现在的太极舞会很有帮助，下次再战锦标赛就很牛了！李想遇到的这个对手其实很强的，好像是昆仑决签约了？李想打得很好，攻击很猛烈的，对手被多次击中却若无其事。当然，也可能李想公主攻击力还不够强，继续强化吧！从她较少能够打出的几次攻击来看，对手的拳法不错，速度快。\",\"url\":\"https://www.zhihu.com/pins/1994574572842918258\"},{\"slug\":\"2026-01-13-这个对手虽然三局全输-但意志非常顽强-身\",\"year\":\"2026\",\"title\":\"三局全输却顽强不退的老拳手：比弃权的应越值得敬佩\",\"date\":\"2026-01-13\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这是一个39岁的老拳手了，长期在泰国迦南隆打比赛。心态真的超级好，出拳其实准确度很高，抓时机抓的特别好，陆鸽有几次就刚要出手就被击中了。她大概认为这次比赛输掉，核心原因是拳技术不够好，的确被陆鸽的连拳打得站都站不住，完全没反应。不过---正常拳击训练的人，也没法这样跟木兰们打拳击攻击的，只是我们暂时不去打拳击，专心拿下泰拳世界锦标赛的王者位置再说。有了公主接班人之后，我们木兰就不互相内耗了！\",\"url\":\"https://www.zhihu.com/pins/1994495993689944574\"},{\"slug\":\"2026-01-12-现金流就是生意模式-燕京利润比惠泉啤酒\",\"year\":\"2026\",\"title\":\"燕京利润比惠泉少？茅台14元买入？教英子投资难如教男人生孩子\",\"date\":\"2026-01-12\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"【现金流就是生意模式，燕京利润比惠泉啤酒少】就是瞎说的，燕京啥时候比惠泉差？​[捂脸]​还有茅台14元买入。茅台啥时候给我14元买入的机会？明明我说我没买茅台、但是买了茅台的竞争对手14元。所以，教英子学会投资，大概与教男人学会生孩子是一个级别的难度。我认为英子还是去生孩子比较靠谱一些。千万不能学投资！这会累死自己，气死老师[开心]​……\",\"url\":\"https://www.zhihu.com/pins/1993983305771665363\"},{\"slug\":\"2026-01-12-为什么都是古代的武术-泰拳不被嘲笑-而中\",\"year\":\"2026\",\"title\":\"为什么都是古代的武术，泰拳不被嘲笑，而中国传统武术被称为笑话？\",\"date\":\"2026-01-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"本质上，古泰拳和古中国传武，在技术上有很多相似的地方。如果说，泰国是在英国殖民者的有意栽培下，成长起来的现代格斗技术，那么自由搏击（踢拳）就是日本主动融入西洋体育竞技运动的结果。队员为了得分，会拼命去练一些华而不实的技术和腿法，相反泰国拳裁判方式是看到明显的重击才给对方扣分，因此拳手都特别重视重击，而不是“仅仅击中”。但结果都是惨败而归，造成了中国人传说“泰拳500年不败”的历史。\",\"url\":\"https://www.zhihu.com/question/1973882697454753202/answer/1994106277165561488\"},{\"slug\":\"2026-01-12-亚运冠军王莉举报领导索要奖金-云南体育局\",\"year\":\"2026\",\"title\":\"亚运冠军王莉举报领导索要奖金，云南体育局通报对范某某作出免职处理，如何评价？怎么才能真正杜绝此类事件？\",\"date\":\"2026-01-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"据我所知：国家奖励运动员的同时，也会给教练员同样的一笔奖金。体育总局要给刘晓慧世运会冠军的奖金时候（几万元），也要了我的账号。说要给她的教练，也就是我，一笔一样多的奖金。如果真的是这个队员的教练的话，干嘛还要去把队员的奖金弄走呢？国家奖金，是一笔重大的荣誉，不是一笔简单的钱。想象一下我去找刘晓慧去要她拿到的几万块奖金，就算她给我了，我大概率也被人喷死了！去捞钱荣誉的象征，就必然遭到荣誉的反噬。\",\"url\":\"https://www.zhihu.com/question/1993480783697040671/answer/1994082844423779110\"},{\"slug\":\"2026-01-12-号称天才少女的应越-在与陆鸽打完这场比赛\",\"year\":\"2026\",\"title\":\"天才少女应越输给陆鸽后在休息室一直哭\",\"date\":\"2026-01-12\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我相信这次比赛，对她来说是一场记忆深刻的比赛！泰国职业拳手很精明，往往采用防守型打法来应对。面对太极格斗的降维打击，现在连天才少女也对付不了。去代表中国参加世界锦标赛，要面对降重很严重的世界锦标赛的欧美大个子拳手，要做好打硬仗的准备！我猜她本次参赛全国锦标赛，是志在夺取金牌的。她其实原来是57公斤级的，这次是降重来打54公斤，陆鸽本来正常体重就是不超过54公斤的，她在这个级别是因为队友配对的关系。\",\"url\":\"https://www.zhihu.com/pins/1994206669828286194\"},{\"slug\":\"2026-01-12-老子说-圣人为腹不为目-意思就是-一个\",\"year\":\"2026\",\"title\":\"老子说圣人为腹不为目：选老婆看会不会生孩子，不看漂不漂亮\",\"date\":\"2026-01-12\",\"type\":\"想法\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"老子说：圣人为腹不为目。意思就是：一个聪明的男人，选择老婆的时候，不要去看她长得漂亮还是不漂亮（为目）。而是要去看她的肚子争气不争气，会不会生孩子（为腹）！如果女人会生孩子，会养孩子，就是好老婆。不是长相好看的才是好老婆！不给你生孩子，娶来干什么？你们说：这种解释对不对呀？[笑哭]​[笑哭]​[笑哭]​……\",\"url\":\"https://www.zhihu.com/pins/1994094867693983501\"},{\"slug\":\"2026-01-12-这里有清一拳手几乎全部的比赛信息-值得收\",\"year\":\"2026\",\"title\":\"清一拳手几乎全部比赛信息，值得收藏\",\"date\":\"2026-01-12\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1994197849840312657\"},{\"slug\":\"2026-01-10-这个地方我很熟悉-我还住过一段时间-居然\",\"year\":\"2026\",\"title\":\"熟悉之地竟如此恐怖：权力的影响力实在太大\",\"date\":\"2026-01-10\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1993337682550600013\"},{\"slug\":\"2026-01-09-我要长成一棵大树-站在陡峭边-长成一\",\"year\":\"2026\",\"title\":\"我要长成一棵大树，干嘛非要去悬崖边站\",\"date\":\"2026-01-09\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"【我要长成一棵大树，站在陡峭边】长成一个大树挺好的，干嘛非要去悬崖边去长？选个好点的地方不好吗？[开心]……\",\"url\":\"https://www.zhihu.com/pins/1993098014995268227\"},{\"slug\":\"2026-01-09-去一个普遍缺乏信用的国家放贷-不就是找死\",\"year\":\"2026\",\"title\":\"去普遍缺乏信用的国家放贷，不就是找死吗\",\"date\":\"2026-01-09\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1992986078207054999\"},{\"slug\":\"2026-01-09-大学教授忽悠人也有一套感谢​\",\"year\":\"2026\",\"title\":\"大学教授忽悠人也有一套\",\"date\":\"2026-01-09\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"（无正文内容，仅含标题与来源链接）\",\"url\":\"https://www.zhihu.com/pins/1993020922349769424\"},{\"slug\":\"2026-01-08-这文章的意思-就是雷军因为优秀-所以值得\",\"year\":\"2026\",\"title\":\"雷军因为优秀就该被喷？喜欢这样玩的国家多灾多难难免\",\"date\":\"2026-01-08\",\"type\":\"想法\
