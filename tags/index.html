,\"summary\":\"下面是我几年前在雪球主页发布转载的段永平批注的芒格语录。今年转发在这里来纪念这位了不起的投资大师！段永平批注解读的芒格思想：与巨人同行清一山长推荐语：@大道无形我有型感谢您的这些批注，以及您对中英文的比较，思考。我转载了您的这篇批注芒格思想的文章，给我的学生好好学习和消化。也感谢您进入投资界之后，展示的理性投资的理念，以及长期对巴菲特，芒格的推荐和解读，引导大家理性投资，共同富裕。\",\"url\":\"http://zhuanlan.zhihu.com/p/669542803\"},{\"slug\":\"2023-11-27-水灯节中国素食拳赛昨晚打完-圆满成功\",\"year\":\"2023\",\"title\":\"水灯节中国素食拳赛昨晚打完：圆满成功！\",\"date\":\"2023-11-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨晚是泰国水灯节，到处都是节日庆典活动，我们村口上清一武道馆现场直播了近期的第二次中国日比赛---太极征泰第203-208战。泰国的主办方对我们高效的推广活动非常有兴趣，现在都在竭力拉拢我们一起办这种节日庆典活动，因为我们的比赛，吸引来的人气很高，对泰国的主办方很有好处。昨晚让木兰武士们放松去打，不求结果。昨天打完比赛后，泰拳对手们要么开了口，要么吐了。昨天是一家外府的拳场的拳手来清迈打的比赛。\",\"url\":\"http://zhuanlan.zhihu.com/p/668952002\"},{\"slug\":\"2023-11-22-商界老板为啥要求自家孩子不考大学-想专业\",\"year\":\"2023\",\"title\":\"商界老板为啥要求自家孩子不考大学，想专业练武？\",\"date\":\"2023-11-22\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"最近，一个老板来清迈找我面谈，要求让正在今日国际学校正常上学的孩子，改变原来的教学规划。还有家长申请12岁就来练武，当然我们让孩子15岁考上三语高中再来。我们的内部教学规划，并不支持家长让孩子去走专业练武的道路。如果因为我们有技术，家长送孩子来就想将来拿个冠军啥的，去吃武术饭，就惨了。老板为了落实选修武道的事情，居然专程来泰国商量孩子的发展问题。经过交流，我也理解了老板为啥坚决不让孩子考大学了。\",\"url\":\"http://zhuanlan.zhihu.com/p/668209496\"},{\"slug\":\"2023-11-22-太极奥运技术之-刺拳技术训练要点\",\"year\":\"2023\",\"title\":\"太极奥运技术之：刺拳技术训练要点\",\"date\":\"2023-11-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"比如：井上尚弥的刺拳技术就非常好！【训练集锦】井上尚弥是如何练就一手完美刺拳的_哔哩哔哩_bilibili下面这个奥运冠军教的刺拳技术很不错。这些训练要领，值得我们的拳手去学习了解对手是怎样训练的！”——奥运奖牌拳击手教你如何完善「刺拳」_哔哩哔哩_bilibili这个视频讲解的刺拳技术更全面。俄罗斯国家拳击队刺拳防反专项训练_哔哩哔哩_bilibili但太极格斗，对付刺拳的方式却不一样。\",\"url\":\"http://zhuanlan.zhihu.com/p/668242798\"},{\"slug\":\"2023-11-20-如何鉴别善缘与恶缘的孩子\",\"year\":\"2023\",\"title\":\"如何鉴别善缘与恶缘的孩子？\",\"date\":\"2023-11-20\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"有些孩子是善缘，她来到你家，是来帮助你完成心愿的。会让我们看不到这些孩子的好处，还容易去欺负这些好心的善缘孩子。理论上，我们应该对恶缘的孩子提高警惕，不要被他们坑了。但---实际上家长们对恶缘的孩子往往更愿意把心肝都奉献出来。善缘的孩子从小就很贴心，在你痛苦的时候（比如你生病了），她会很难过，甚至比你更难过。总之---特别关心父母，最怕让父母不开心，最想帮助父母的孩子，就是善缘的孩子。\",\"url\":\"http://zhuanlan.zhihu.com/p/658842161\"},{\"slug\":\"2023-11-17-卖掉2万股惠泉啤酒-可以换入26300股\",\"year\":\"2023\",\"title\":\"惠泉换珠江：股数增超30%，负成本轮动三大啤酒\",\"date\":\"2023-11-17\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"增值的股数超过30%。这种生意似乎是划算的。虽然目前这种交换，总资产减少了一点点（起码少了相应的交易费和税金）。这几年，我在三大啤酒公司之间不断的转换，惠泉现在以负成本安稳当十大，就是换股的功劳。随著这种交换的时间次数的增加，将来争取其他两家公司，也做到这个成绩---低成本甚至负成本持有大量公司股票。\",\"url\":\"https://www.zhihu.com/pins/1708803589579841536\"},{\"slug\":\"2023-11-14-清一书院-首期目标体验营结束记录\",\"year\":\"2023\",\"title\":\"清一书院：首期目标体验营结束记录\",\"date\":\"2023-11-14\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"现在一些是作为学生的身份，来到清迈的书院学习体验。当这些都处在青春期，不同教育背景的人，相互碰撞会发生什么故事呢？目标聚焦夏令营第四周周报一个月的时间过的很快，不知不觉中，我们的目标营也迎来了告别的一天。在过去的四周中，这批青春少年们踏上了一次独特的旅程，探寻自己的目标，理解生命的本质，找到自己人生的意义。这四周的时间里，少年们从迷茫到清晰，从困惑到坚定，从纠结到喜悦，从互相陌生到逐渐熟悉。\",\"url\":\"http://zhuanlan.zhihu.com/p/666836052\"},{\"slug\":\"2023-11-14-燕京前三大股东研究\",\"year\":\"2023\",\"title\":\"燕京前三大股东研究\",\"date\":\"2023-11-14\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"目前的第三大股东，居然是个自然人：唐建华。当年唐总进入的时候，平均成本大约是6.5元，这伙计一下子就买了4000多万股，一露面就是第三大股东。此时的第二大股东是国家队---证金公司。但他依然被挤开了第三股东位置，只当上了第四大股东！可以说--燕京好不容易从6元多涨到7元多，就是重阳系大举进入的原因。2020年三季报，股价从5元多涨到了8元多，十大股东都没有动静，唯一是香港的外资冲到了第二大股东。\",\"url\":\"http://zhuanlan.zhihu.com/p/666749406\"},{\"slug\":\"2023-11-12-投资养老新模式-比退休金更可靠的金融账户\",\"year\":\"2023\",\"title\":\"投资养老新模式？比退休金更可靠的金融账户养老收益\",\"date\":\"2023-11-12\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"我今天第一次秀我的账户---我管理的我家老人的投资账户。我在雪球时代，很多人对我的投资业绩非常怀疑，总让我秀账户。下面图片，是我负责管理的老人家的账户，大概是2006-2007年之间开的，具体的时间我说不准了。这个平庸一点的养老账户，走势相对正常一点！融资更是尝尝闲置，没有把可用资金都利用好。各位留心看这个养老账户总资产和总盈利的时候，会意外的发现：总盈利，非常接近总资产。\",\"url\":\"http://zhuanlan.zhihu.com/p/666459958\"},{\"slug\":\"2023-11-10-今天买入了中国建筑100万股-价格是5\",\"year\":\"2023\",\"title\":\"5.06元买入中国建筑百万股：当存款拿分红，输时间不输钱\",\"date\":\"2023-11-10\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"我很奇怪雪球上居然有一堆人在中建这里叫苦。说跌了现在受不了，买大蓝筹非常后悔之类的言论。我认为---买中建这种股票，就当存款一样。现在每年分红5%，而且每年都在增加分红。这些订单的利润差不多就可以赚一个新的中建了。所以，在我看来，现在价格买入，就是输时间不输钱的买卖。因此，目前这个价格，我当然安心买入，长期持有。反正你买入股票，天天查，肯定一股也不少（不要查涨跌，这都是假的，天天都在变化。\",\"url\":\"https://www.zhihu.com/pins/1706341991640621056\"},{\"slug\":\"2023-11-08-全凭心意用工夫-古传手抄本心意拳谱\",\"year\":\"2023\",\"title\":\"全凭心意用工夫：古传手抄本心意拳谱！\",\"date\":\"2023-11-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"我看到的【戴氏心意拳】，尤其重视身腰胯的训练。太极云手，本质上就是心意拳的钻拳和翻拳的合一！古人练这些手上的功夫，也需要天天练功力的。心一动意必随，周身束抱三合，一动全身发挥内劲，雷声抢上，哈令呼咦之气，迅雷急电之精，气合连身之手，合用才见精神。”心意六合拳譜古手抄本2心意六合拳拳譜是練好心意六合拳的總綱，是武術前輩經過幾代人的實戰交流得出的經驗總結，其中凝聚著他們的智慧和結晶。\",\"url\":\"http://zhuanlan.zhihu.com/p/665771773\"},{\"slug\":\"2023-11-06-中医、中国传统武术、气功、风水、算命等中\",\"year\":\"2023\",\"title\":\"中医、中国传统武术、气功、风水、算命等中国古代的东西，是因为骗人而没落，还是被国家行政干预导致没落呢?\",\"date\":\"2023-11-06\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"国家行政干预，在50年代--70年代之间，的确有很大的作用，把传武的格斗精髓改成了舞蹈套路。80年代以后，眼见日本，泰国这样的小国，都是“格斗大国”。我们国家的行政干预，也想恢复格斗大国的荣誉。但过去几十年的内耗，包括民国时间战争的经历，也不利于武术这种低效的技术使用。因此---可以说民国以来，传武就已经失去了实用的土壤。除非有人恢复了传武的使用哲学和发力方式的训练，否则传武看起来就像骗子一样。\",\"url\":\"https://www.zhihu.com/question/335794210/answer/3278274043\"},{\"slug\":\"2023-11-06-太极征泰二阶段圆满结束-第三阶段-游于艺\",\"year\":\"2023\",\"title\":\"太极征泰二阶段圆满结束。第三阶段【游于艺】开启！\",\"date\":\"2023-11-06\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"太极征泰从2022年5月份开始实战以来，第一个是【百战不败】的开场记录。此时泰方对我们不了解，没有派出最强的拳手，而且泰拳手比较藐视中国拳手，场上敢拼敢打，积极求战。泰方往往用身高体重以及经验远远胜过我方的拳手才敢出战，甚至谭木兰的第一战，就派出了相当于清迈冠军实力，打过仑披尼的拳手来对付新手。因此，第二个百场比赛的KO率明显下降了。在10月份的中国日比赛后，我认为太极征泰的阶段型目标已经完成了。\",\"url\":\"http://zhuanlan.zhihu.com/p/665387729\"},{\"slug\":\"2023-11-02-奥运拳击太极技术-野马分鬃起钻落翻的实\",\"year\":\"2023\",\"title\":\"奥运拳击太极技术：野马分鬃=起钻落翻的实战用法\",\"date\":\"2023-11-02\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"对于绝大多数人来说，这是一个基本上无法实现的梦想。野马分鬃的实战要领，我看国内的太极大师们教授的打法，我是看不懂的，摸不着头脑。我来讲讲“野马分鬃”_哔哩哔哩_bilibili勉强看看其他的介绍，发现只有心意六合的野马分鬃技法，相对更接近我们门派的实战打法一些。由于太极拳谱中，很难找到对“野马分鬃”实战用法的真正解读说明。我看这种太极的打法，非常接近形意拳拳谱中“起钻落翻”打法。\",\"url\":\"http://zhuanlan.zhihu.com/p/664681764\"},{\"slug\":\"2023-10-31-作为公主班的小班长-ELLA开启奥运目标\",\"year\":\"2023\",\"title\":\"公主班ELLA立下奥运五年目标，首次泰拳实战在即\",\"date\":\"2023-10-31\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"未来一个月内，艾拉还会开启她人生的首次泰拳实战比赛。正在一步一步走向自己的目标。拥有这样的理想和追求，无论将来是否实现冠军梦，但同样活出了自己的精彩。很多人会说：想当奥运冠军，是不是太自不量力了？其实----很多人都活在害怕别人评价的阴影中，只敢悄悄的向往某些美好的目标，却不敢去认真追求，更不敢告诉别人。我鼓励学生把目标告诉全世界，然后全力去追求实现目标。这样，才有可能真的实现理想。\",\"url\":\"https://www.zhihu.com/pins/1702720822530121728\"},{\"slug\":\"2023-10-26-今天燕京啤酒公布了三季报\",\"year\":\"2023\",\"title\":\"燕京三季报现隐蔽利好，持续以珠江换燕京\",\"date\":\"2023-10-26\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"更重要是的：我看到了一个非常隐蔽的信息。我一直担心的，我认为会压制燕京上涨的一个重要因素，目前已经解除了。珠江的账面上少了几百万，你可以理解为我持仓的燕京，就增加了几百万。而这些燕京，就是我在13-14元期间卖掉大批，用来换珠江等的。珠江和惠泉都进了十大，所以，目前为止，我的啤酒仓位一点也没有减少。直到今天，我看到三季报透出的这个重大的信息变化，我就非常确定了：我的节奏，应该又再次踏对了。\",\"url\":\"https://www.zhihu.com/pins/1700920529542815744\"},{\"slug\":\"2023-10-26-奥运会不公平咋办\",\"year\":\"2023\",\"title\":\"奥运会不公平咋办？\",\"date\":\"2023-10-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"我们的一批学生，正在为2028年奥运会备战，包括小女在内。不过，也有人提出了：奥运会也不公平，咋办？这种例子很多的，比如：1988年的奥运会，韩国的表现就非常的扯！在全世界面前演出了一场丑陋的违反公平的判例！转文：韩国在这届奥运会上所展现出的“奥运精神”让人不齿。这一事件让琼斯对奥林匹克运动会彻底失去了信心。从此，他再也没有参加奥运会这类赛事，将自己的运动生涯带向了另一个方向。\",\"url\":\"http://zhuanlan.zhihu.com/p/663529010\"},{\"slug\":\"2023-10-25-10月中国日泰拳赛事记录照片上\",\"year\":\"2023\",\"title\":\"10月中国日泰拳赛事记录照片上！\",\"date\":\"2023-10-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"中国日赛事记录：（以下照片来自宋晓莉老师的现场记录拍摄）这个加拿大人，赛前拳场方通知我们他是61公斤级的人。这次比赛有不少摔倒对手的状况，甚至几次差点把对方摔下擂台。赛后对手说：中国拳手跟他原来打的泰国对手太不一样了。第二场是张明慧对战男拳手赛前，对方坚持称明慧的对手就是44公斤的。所以，8月份刚满15岁的张明慧，首战对象居然是已经成年的男子泰拳手，年龄比他更大。\",\"url\":\"http://zhuanlan.zhihu.com/p/662774485\"},{\"slug\":\"2023-10-22-中国日比赛-赢得了荣誉和尊重的一天\",\"year\":\"2023\",\"title\":\"中国日比赛：赢得了荣誉和尊重的一天\",\"date\":\"2023-10-22\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"第一次的中国日，上一个春节的这次首界中国日比赛。甚至一批去看比赛的中国人，都在鄙视和嘲笑我们，想看我们的笑话。昨天第二次的中国日，清一木兰拳馆，气氛完全的翻转，我们赢得了现场所有人的尊重。后来，连他自己都不相信---泰国方居然判了他赢比赛，奖杯拿到手里很别扭尴尬的表情。在场的一些外国人，都觉得这个比赛结果太扯了。这个赢家---也对明祺很尊重---中国人不好对付！2：我们赢得了现场中外观众的尊重。\",\"url\":\"http://zhuanlan.zhihu.com/p/662679325\"},{\"slug\":\"2023-10-20-社畜-宠物-废物-理想与现实差距多大\",\"year\":\"2023\",\"title\":\"社畜？宠物？废物？理想与现实差距多大？\",\"date\":\"2023-10-20\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"今天给学生上课，讲解上次的作业----他们到底想做社畜？如果不想做社畜，但你也没有啥理想和追求，难道你是只想做宠物吗？虽然实际上，世界上97%的人，都在为别人的理想而工作！你们认为女孩比男生小很正常（其实在场的体验营女生大多数都比明慧更胖，更大）。而与他同龄的静慧，15岁的时候就长成了现在的样子，差不多比钟瑞当时高一个头。说她现在比很多学生都强，起码不是废物，虽然也不是社畜。\",\"url\":\"http://zhuanlan.zhihu.com/p/662456705\"},{\"slug\":\"2023-10-19-太极拳法功力练习的利器——大枪杆子\",\"year\":\"2023\",\"title\":\"太极拳法功力练习的利器——大枪杆子\",\"date\":\"2023-10-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"经典的拳击格斗，强化自己功力的方式，主要是练习俯卧撑，哑铃，战绳，各种器械等等。副作用是啥呢---用太极的说法，就是练的是僵力。太极拳法的训练，几年来，几个小木兰的体重并未明显增加，基本上维持在原地。太极，传武的功力训练方式，我看现在，是基本失传了，没看到有人练。内家拳练习发力的工具，其实核心就是”大枪“---大杆子。现在，各派太极，也自称有大杆子的练法，枪法练习。\",\"url\":\"http://zhuanlan.zhihu.com/p/662178075\"},{\"slug\":\"2023-10-16-所见即所得-我的人生拥抱什么-社畜or理\",\"year\":\"2023\",\"title\":\"所见即所得：我的人生拥抱什么？社畜or理想？\",\"date\":\"2023-10-16\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"所有人的人生，都是由每个人自己的“见地”来创造的！在下面公主班作业示范的基础上，大家来做一个新作业：社畜和理想？社畜的定义，就是为别人的理想而工作和生活的人。林说保：失联潜水员韩颋在水下百余米被找到，仍未能打捞出水面另外一些人，拒绝了每天8小时的社畜生活，但他们为了理想一天工作12个小时！如果你是争夺奥运冠军，去实现理想的团队里面最差的一名，你的一生能够得到什么？\",\"url\":\"http://zhuanlan.zhihu.com/p/661498265\"},{\"slug\":\"2023-10-15-奥运太极拳击格斗技术解析——太极旋身拳\",\"year\":\"2023\",\"title\":\"奥运太极拳击格斗技术解析——太极旋身拳\",\"date\":\"2023-10-15\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"前言：以下格斗技术的使用，将导致欧美数百年积累的传统拳击技术不再发挥作用。因此男拳手的力量，反应速度等格斗素质优于女生的性别优势，将无法平衡太极技术带来的技术优势。太极男拳手，还是可以把太极女拳手抱回家的】技术解析正文当代太极实战拳经（这是专业文章，明牌技术泄露。虽价值连城，但不懂格斗的人就不用看了，相当烧脑：正统拳击技术，为了方便双手轮流出拳，身体几乎就是正面对敌的。\",\"url\":\"http://zhuanlan.zhihu.com/p/661387594\"},{\"slug\":\"2023-10-13-不同的赛道-不同的结果\",\"year\":\"2023\",\"title\":\"不同的赛道， 不同的结果！\",\"date\":\"2023-10-13\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"2023届SAT考生已经回升到1913742人，比去年增加10%，超过了2017年人数，但仍低于疫情前的高峰人数。近年SAT平均分一直呈现波动下降的趋势，其中阅读和文法平均分是520分，数学的平均分是508分。靠国外国内大学，都是最顶尖的学生，他们才不用考虑选择赛道。排名倒数30%的考生，也不需要考虑选择什么赛道。什么赛道都是学渣，这种人，家长也不需要浪费钱来培养。\",\"url\":\"http://zhuanlan.zhihu.com/p/661186867\"},{\"slug\":\"2023-10-11-未来五年-为中国夺取含金量最高的奥运金牌\",\"year\":\"2023\",\"title\":\"未来五年：为中国夺取含金量最高的奥运金牌\",\"date\":\"2023-10-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"基本上都兑现了，包括击败五百年不败的泰拳。目前得到了清迈最有名，培养了很多冠军的拳馆的支持，作为我们的对手盘作战，其中有两场是冠军赛。最近，我给学生们规划了一个相对长期一点的目标：五年后，我们目前在清迈的这批学生，将要去夺取奥运拳击冠军。同时---顺便去拿几个奥运冠军为国争光。也许你想问我：奥运拳击冠军的难度有多高知道吗？中国这么多年，只有两个男子拳手，拿到了三个奥运金牌，女子是零记录。\",\"url\":\"http://zhuanlan.zhihu.com/p/660774560\"},{\"slug\":\"2023-10-04-富人返贫-是吸引力法则吗\",\"year\":\"2023\",\"title\":\"富人返贫：是吸引力法则吗？\",\"date\":\"2023-10-04\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"有点小钱，就忘了自己是谁了，往往都穷侈极欲，生怕别人不知道自己有钱，这种骨子里面的穷人，最终返贫几乎就是必然。未来几十年，我认为就是大批富人返贫的时代开启了。我已经听过，见过太多的富人返贫的故事了。中国资本现在大量在国外买大学，就是满足这些愚蠢，智力低下的富人阶层的“大学文凭需求”而产生的投资。用来给中国的富人家庭的孩子“上大学”，其实是混日子。富人返贫的第一大核心原因，就是“败家子”。\",\"url\":\"http://zhuanlan.zhihu.com/p/659392879\"},{\"slug\":\"2023-09-28-亿万身家-并不是生命追求的目标\",\"year\":\"2023\",\"title\":\"亿万身家，并不是生命追求的目标\",\"date\":\"2023-09-28\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"最近，传出了一个年纪轻轻，就赚取了亿万财富的朋友的死讯。看来拥有普通人一生都不敢想象的亿万身家，也不能给自己和家人带来幸福和快乐。不希望大家继续用自己的死亡来获取人生经验。当然，我是从1991年的1.2万元开启的投资生涯，20多年不到30年，获得增长万倍的结果（算到2018年）。他的投资生涯，大约比我还少5年甚至10年吧？我个人认为：很多人买他的基金，应该是被“万亿U兄\\\"承诺的万亿家族的结果吸引。\",\"url\":\"http://zhuanlan.zhihu.com/p/658996468\"},{\"slug\":\"2023-09-26-富人杀手-财富再平衡的力量-富二代\",\"year\":\"2023\",\"title\":\"富人杀手：财富再平衡的力量---富二代！\",\"date\":\"2023-09-26\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"我对一个来拜访我的富人老板，问了他两个问题：1：您一直忙于赚钱。您下一世投生到你的后代的家庭，您还有机会白手起家吗？我只是提醒这些以金钱为人生第一追求的老板们思考一些可能比金钱更重要的问题。如果人有足够的理性，就应该经常问自己这个问题。我就算堆再多的钱让他上学，也教育不好他的。人际交往中不懂得尊重别人，以为只要用呲牙，用威胁和暴力，用不择手段，去尽力去抢夺周围的一切资源就够了！\",\"url\":\"http://zhuanlan.zhihu.com/p/658530879\"},{\"slug\":\"2023-09-18-回清迈-指导木兰拳手练新招对付泰拳手\",\"year\":\"2023\",\"title\":\"回清迈，指导木兰拳手练新招对付泰拳手！\",\"date\":\"2023-09-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"木兰们最近正在备战曼谷拳赛，明晓和谭木兰都要参赛。这是一个重要的节日庆典拳赛，对象是泰国人，不是外国游客。这次安排我们的人参与这种节日庆典赛事，一方面，应该是泰国人对自己拳手的自信。木兰们的技术，一直以来都是压制泰拳手的，比赛中吃亏的就是心理素质，比赛经验不足。去年在赛前泰国拳馆训练的时候，泰国拳手看到木兰拳手们，每天都会拿一个木棒子来敲自己全身，感到不可思议（中国传武的传统练法，内外家都有的）。\",\"url\":\"http://zhuanlan.zhihu.com/p/656836756\"},{\"slug\":\"2023-09-06-未来经济发展和就业的方向选择\",\"year\":\"2023\",\"title\":\"未来经济发展和就业的方向选择：\",\"date\":\"2023-09-06\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"创造了过去40年的经济发展奇迹，以及全民创富的奇迹！让大家都欢欢喜喜的认为---未来日子都会越来越好的。这个转变的过程，就是中国就业不断减少，经济停滞的过程。未来年轻人将很难得到工作就业的机会，而且工资也不会高。未来，年轻人为了获取更好的工作机会，未来的老板们为了获取创业的机会，就必须国际化发展。前往【未来的中国】去开创事业，这些都不是发达国家。未来就业很难，当家长的要知道为孩子谋取发展的空间。\",\"url\":\"http://zhuanlan.zhihu.com/p/654544135\"},{\"slug\":\"2023-08-17-这样的太极宗师-不学也罢\",\"year\":\"2023\",\"title\":\"这样的太极宗师，不学也罢！\",\"date\":\"2023-08-17\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"社区纷争与论辩\",\"summary\":\"来源：豫记：联合国认定的太极拳发源地再遭哄抢，谁是祖师？清一点评----张三丰流传的真太极，留下的话是【详推用意终何在，延年益寿不老春】，这意思，绝对不是太极不能打，只能健身。原则二：只能打的太极，也不是真太极。对武当派的太极人来说，你们不认祖宗，就是欺师灭祖，这个罪名可少不了！对于上面文章中，不去研究真正的武学，反而到处找自己的祖宗出处，一堆人胡乱这种争【正宗的太极】门派之争，我特别的看不起！\",\"url\":\"http://zhuanlan.zhihu.com/p/650505534\"},{\"slug\":\"2023-08-10-今日国际磨丁校区-下周将有300个学员共\",\"year\":\"2023\",\"title\":\"今日国际磨丁校区：下周将有300个学员共同上课\",\"date\":\"2023-08-10\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"本周是21天【江湖心理行为学】的课程现场，201人在现场。下周刘老师的慧心课程，还有190个学员要来，总共就有300多个学员一起上课了。教室也有更多，我们有足够的容量来供学生们上学！很多老清粉现场学习，还有一些参加过6年前的上一期江湖课。3.改进方案：1）在心上觉知自己对孩子的执著，逐步放下这个执著，尽心尽力地去培养孩子，但是同时要接受孩子未来可能会成为一个普通人的结果，接受孩子有自己的命运。\",\"url\":\"http://zhuanlan.zhihu.com/p/649089329\"},{\"slug\":\"2023-08-05-清一武士首战法国拳手取胜\",\"year\":\"2023\",\"title\":\"清一武士首战法国拳手取胜！\",\"date\":\"2023-08-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"清一木兰KO了对手，清一武士也击败了法国白人拳手。将来，我们的木兰和武士争取多打八国联军，多KO这些傲慢的白种人，一定要为国争光！以下是公主们赛前采访与武士对战的法国白人拳手，是法国拳击手的。法国方面也非常重视这场比赛，看得到他的队友在我们角的对面摄像（相比起来，泰拳手根本不关心自己的比赛录像，似乎认为不需要回看比赛一样，无论胜负）。没有想到一向很菜的中国拳手，他们打起来这么吃力！\",\"url\":\"http://zhuanlan.zhihu.com/p/648122391\"},{\"slug\":\"2023-08-04-我做不大不小股东的中金岭南-最近意外上涨\",\"year\":\"2023\",\"title\":\"中金岭南意外上涨：缩量非出货，新主力或已进场\",\"date\":\"2023-08-04\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"两天前，有朋友私信找我，说已经赚了不少了（4元入手的，这一天破了6元了——问我是否要卖出了）。第三天还跳空下跌，图形上看上去特别像出货。今天居然就反弹，证明了主力不愿意继续打压，怕失去手上的筹码。图形显示似乎是有新主力进场，但手上筹码不够，所以拉升后被打下来，然后再继续墨迹。注意特点：从4元左右的底部平台上升以来，中金岭南是没有大幅回调的。只是---你是4元买入的股票，跌到5.7元你就愿意买进吗？\",\"url\":\"https://www.zhihu.com/pins/1670837426049171456\"},{\"slug\":\"2023-08-04-江湖心理行为学-课程作业-望子成龙-还是\",\"year\":\"2023\",\"title\":\"江湖心理行为学 课程作业：望子成龙，还是贵子成虫？\",\"date\":\"2023-08-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"中国的一些富人，虽然人是富裕了，但骨子里面，并没有贵气！为啥龙子龙孙，却偏偏成虫？正好，江湖课我选的电影课，是【道士下山】，这部影片，里面正好是当时32岁的成龙儿子作为配角，与30岁的王宝强当主角配戏的内容。下面转发我给学员发的一份“江湖心理行为学”的作业，让各位了解我们是怎样让学员【通过江湖人生，了解世界，见众生，见自己，见未来】。六：真实的江湖案例策论解析望子成龙，还是贵子成虫？\",\"url\":\"http://zhuanlan.zhihu.com/p/647998106\"},{\"slug\":\"2023-08-03-太极征泰之-中法拳手对决-木兰佳\",\"year\":\"2023\",\"title\":\"太极征泰之---中法拳手对决 & 木兰佳慧宣布退役\",\"date\":\"2023-08-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"今天发布两个可能大家关心的太极征泰的消息：第一个消息是：明天晚上，清一武士将要和法国白人拳手作战。之前木兰们已经打过英国人，爱尔兰人，菲律宾人了。上次木兰首战英国拳手的地区冠军决赛，英国拳手刚开始趾高气扬的，满脸的看不起中国人的骄狂劲。(二维码自动识别)第二个消息就是：木兰佳慧决定暂时退役！实战中，如果她们的太极功夫真的练出来了，也许连迎门三脚都不用了，就可以直接用手和肘膝轻松KO泰拳对手。\",\"url\":\"http://zhuanlan.zhihu.com/p/647864127\"},{\"slug\":\"2023-07-31-公主夏令营-拳打木兰-脚踢武士-刀砍\",\"year\":\"2023\",\"title\":\"公主夏令营---拳打木兰，脚踢武士，刀砍山羊！更佩服泰拳手！\",\"date\":\"2023-07-31\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"本周，夏令营的孩子们体验了【拳打木兰】的活动----她们可以任意出腿出拳攻击木兰，而木兰们只能防守，控制她们，不能反攻击她们，尽量保证她们的安全。毕竟---业余选手与职业拳手对战，可以说就像是不设防的城市一样，完全没有杀伤力，怎么用力也打不到人。这一次拳打木兰的结果，让孩子们知道上阵实战的体验，最终结果居然是【更佩服泰国拳手】了：“以前看拳手们征泰很佩服木兰和武士们，但现在，她们更佩服泰拳手。\",\"url\":\"http://zhuanlan.zhihu.com/p/647157367\"},{\"slug\":\"2023-07-30-李小龙居然打不赢现在格斗训练的武校学生\",\"year\":\"2023\",\"title\":\"李小龙居然打不赢现在格斗训练的武校学生？\",\"date\":\"2023-07-30\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"否定我们自己的武术传统和文化，盲目去追捧跟随西方文化所代表的“现代格斗”，甚至否定为我们真实地赢得了全世界敬佩的人---我们的武术文化界代表李小龙。有人非要说：现代武校一些学格斗的学生，都能超过李小龙这些“老牌高手”，我就只能笑了。可是，这些【现代格斗的狂热拥护者】，却信口开河，胡乱指点江山，居然敢于说出了---中国随便一所“现代武校”的学生，都可以超过李小龙等武林前辈的狂话。\",\"url\":\"http://zhuanlan.zhihu.com/p/646603151\"},{\"slug\":\"2023-07-19-关于恒大的2.4万亿债务-第一-银行-公\",\"year\":\"2023\",\"title\":\"拆解恒大2.4万亿债务：买房人与建筑商成最大输家\",\"date\":\"2023-07-19\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"第二，7500多亿合同负债，这个就是欠了可怜买房人，还欠着他们这么多货值的房子。第三，最大的输家是建材公司，9000多亿。甚至还欠销售部现场鲜花篮，横幅.---其实，恒大这样的地产公司，自己是不从事生产的，他们就是玩【组织管理】。把银行的钱骗进来，再让建筑企业垫资产生，其实自己几乎一点钱都不出就“做生意”了。但银行的利息，建筑商的工钱不得不支付的时候，地产公司很可能破产。\",\"url\":\"https://www.zhihu.com/pins/1665031799448256512\"},{\"slug\":\"2023-07-18-今天磨丁的几个小公主们抗议说-一周没有请\",\"year\":\"2023\",\"title\":\"小公主抗议没饭吃，30余元请九人吃老挝芒果饭\",\"date\":\"2023-07-18\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"所以中午花了5万基普买了老挝糯米饭，再花五万买了芒果，总共大约人民币30多元不到40元，就请了9个人，一起吃老挝芒果饭中餐。我们的用餐环境还特别好，四星级宾馆的大堂。大家中饭都吃得很开心，营养价值高，还不贵，最终还没吃完。这种朴素的用餐风格，将来会成为我们小圈子的特殊饭局模式吗？小公主们边吃饭，边斗嘴，她们抓要点的能力已经很强了。非常良好的团队协作，希望她们都能成为彼此一生的好朋友。\",\"url\":\"https://www.zhihu.com/pins/1664725978185347072\"},{\"slug\":\"2023-07-15-老挝磨丁特区的傍晚\",\"year\":\"2023\",\"title\":\"老挝磨丁特区的傍晚！\",\"date\":\"2023-07-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"下面照片，是小公主们与南塔省教育局副厅长交流。主要讨论怎样帮助老挝的学生来今日国际学校学习的问题。老挝官员很友好，小公主们反馈与跟国内的官员不一样。他对我们学校和小公主们的表现非常的欣赏，说他会推荐最优秀的学生来今日国际学校上学。小助教与学员一起在学校的教室内，一起讨论当日的课程内容。有点不够放松蔡助理拍的傍晚的磨丁城区风景，像是P过的照片一样磨丁城的灯光初现公主自助餐：芒果配稀饭。\",\"url\":\"http://zhuanlan.zhihu.com/p/643696114\"},{\"slug\":\"2023-07-13-今天中午上完课后-小女来找我-就一起去吃\",\"year\":\"2023\",\"title\":\"与小女午餐老挝餐：富一代富二代吃得比穷人还省\",\"date\":\"2023-07-13\",\"type\":\"想法\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"我们的选项是可以回家喝稀饭，另外一个选项是去老挝饭店吃中餐，小女选择我们一起去吃老挝餐。我们两人要了两碗米饭，一份老挝竹笋菜，总共两万老币就解决问题了，折合人民币才7元多。我让小女再点一个菜的，小女说够了，点多了浪费。所以，最终我们吃的比老挝的穷人标准还低，他们会至少点上两个菜，甚至加上一瓶啤酒。我跟小女笑话说：原来富一代和富二代在一起吃饭，点餐比穷人还穷！_哔哩哔哩_bilibili……\",\"url\":\"https://www.zhihu.com/pins/1662924741324382208\"},{\"slug\":\"2023-07-11-三年学完12年的真相-国际考试检验教学成\",\"year\":\"2023\",\"title\":\"三年学完12年的真相？国际考试检验教学成色！\",\"date\":\"2023-07-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"从理论上，我一直认为：任何国家的12年体制教育的课程，都可以在三年之内完成。今日国际学校，决定成建制地专门举办针对性的班级，把三年学完十二年，作为教学目标来完成。因此---我们的学生，学习三年后，对于是否达到了K12的毕业要求，要去拿国际权威机构的考试，用成绩来检验我们的教育成色！只要通过国际通用的高中毕业资格考试，就能够完全证明这些学了三年的学生们，是否真的达到了国际高中毕业的水平。\",\"url\":\"http://zhuanlan.zhihu.com/p/642822772\"},{\"slug\":\"2023-07-11-示范班三年学完12年的检验成绩已经出来了\",\"year\":\"2023\",\"title\":\"示范班三年学完12年：GED全班均分667创纪录\",\"date\":\"2023-07-11\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"从2020年9月开启的本届示范班，经过三年，总共六个学期的学习，前两年打语言学习基础，最后一年才正式学习K12原版教材，今年6月底，我们用美国高中毕业证书考试的成绩，GED考试，检验了我们的教学成色。结论是超过预期，完美实现了K12年的成绩覆盖，多快好省地完成了学习任务。满分800分的试卷，年龄仅仅14岁的学生，最高就取得了746分的好成绩。山长清一：三年学完12年的真相？\",\"url\":\"https://www.zhihu.com/pins/1662126656524484608\"},{\"slug\":\"2023-06-26-教出什么样的孩子-才是你期待的结果\",\"year\":\"2023\",\"title\":\"教出什么样的孩子，才是你期待的结果？\",\"date\":\"2023-06-26\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"想了解当代大学的家长们，多看看这些内部消息吧！作为大学老师，越来越看不起现在的学生，怎么办？我是大学教师，20年前的985名校的学生，我看了都说---我绝对都不希望我的孩子也和他们一样。一个个的小老头，小老太。我是真的不敢把孩子送到这种地方去“接受教育”的。两眼无光的孩子，你能指望他有美好的未来吗？家庭和社会，你要培养出怎样的孩子，才是靠得住的后代？我认为的正常的学生，应该是这个样子的！\",\"url\":\"http://zhuanlan.zhihu.com/p/639756628\"},{\"slug\":\"2023-06-15-医学博士对医学专业学习的良心建议\",\"year\":\"2023\",\"title\":\"医学博士对医学专业学习的良心建议\",\"date\":\"2023-06-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"这个医学博士，对想考医学专业的学生做的一些建议，我认为绝对是理性和客观的建议，没有带立场。对于选择未来职业方向的家长和学生应该有很大的帮助。但：万一我是对的，我相信学【新医学】会是未来最有前途的职业！可惜---新医学的专业，要在10年后才会出现！【医学不需要数学和严谨的逻辑，只需要记忆】。因此---医学专业学生，是一大群按照程序化来处理病人的现代化医学流水线工人，其实不需要啥智商。\",\"url\":\"http://zhuanlan.zhihu.com/p/637262658\"},{\"slug\":\"2023-06-13-亚裔考生美国高考几乎拿下满分-却被六大名\",\"year\":\"2023\",\"title\":\"亚裔考生美国高考几乎拿下满分，却被六大名校拒之门外，这究竟是怎么回事？\",\"date\":\"2023-06-13\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"1590分，基本算是满分了，美国大学把SAT成绩超过1550分的学生，基本上都当做SAT满分学生看待。美国本土，也只有不到百分之一的考生，才能够达到这个成绩水准。中国人，对别人歧视，最有志气的做法，就是创造自己的世界级名校。美国名校，就是白人创建的，特别是这些私立名校，别人歧视我们很正常。但这些学生的目的，不是为了上美国的名校，只是为了考上三语高中而已---或者说是【清一大学预科班。\",\"url\":\"https://www.zhihu.com/question/605680526/answer/3071447284\"},{\"slug\":\"2023-06-10-今天-你拿到入场券没有-价值百万-千万的\",\"year\":\"2023\",\"title\":\"今天：你拿到入场券没有？价值百万，千万的秘密今日揭晓！\",\"date\":\"2023-06-10\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这样我就可以不用旅行奔波，就轻松和舒服地面对数千热情的听众，并拿到一笔不薄的报酬。不过---为了表示敬业精神，给我的学生们做好示范。昨天，一些在现场意外见到我的老熟人，都非常的惊奇-----不是说，你不来现场，只在线上露面吗？我将用两天的时间，每一天都讲一个原来没有讲过的世界级秘密。我要说明天我讲的这个教育秘密，对每个人只是价值百万，我都太谦虚了。对每一个来参加现场的听众来说，这一天最少价值千万！\",\"url\":\"http://zhuanlan.zhihu.com/p/636032022\"},{\"slug\":\"2023-06-05-小公主对战大男人-会是怎样情景\",\"year\":\"2023\",\"title\":\"小公主对战大男人，会是怎样情景？\",\"date\":\"2023-06-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"光吃稀饭的小公主安弈璇，不惧高大力壮的肉食男学员，正面对抗不落下风，最后还把男学员累垮了。小公主大战壮男，累瘫对手小公主大战60岁老头，让一只手输小公主逸凡对阵清一上面对阵安公主的男学员，后来问我是不是小公主公主逸凡的力量更大？他说是跟小公主逸凡对手的时候，被她打过一拳，觉得她的力量很大，挡不住。我说两个小公主的功力都差不多，因为内家拳是整身发力，感觉比一般人力量大很正常。\",\"url\":\"http://zhuanlan.zhihu.com/p/633231361\"},{\"slug\":\"2023-06-02-今天喝了第一瓶燕京U8-江湖水深\",\"year\":\"2023\",\"title\":\"今天喝了第一瓶燕京U8  江湖水深！\",\"date\":\"2023-06-02\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"国学与传统文化\",\"summary\":\"我计划在这里逗留几天，指导一下小公主的社会实践再回内地！我这十大老板，却一瓶都没尝过，于是买了一瓶想喝喝看。我奇怪我专门去找过，只看了燕京鲜啤，没发现U8。我就拿了里面箱子里面的一瓶没冰的啤酒出来。就把没冰的这瓶燕京放在里面了---可以看见的右边第一排最前面！中午，我就喝了一瓶U8，让我很吃惊：这啤酒真的很好喝。现在这个位置，却被一瓶【燕京鲜啤】挡住了。我通过瓶盖，看得出后面的酒水其实是燕京U8。\",\"url\":\"http://zhuanlan.zhihu.com/p/634274074\"},{\"slug\":\"2023-05-31-自讨苦吃的女人\",\"year\":\"2023\",\"title\":\"自讨苦吃的女人！\",\"date\":\"2023-05-31\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"男人的烦恼，基本来自于事业的成败，感情需求少。而事业的成功，基本上也自然带来情感和关系的成功。男人不会事业失败，就去家庭里面，关系里面寻找感情安慰的。假装是自己的事业---不挣钱的事业罢了！而女人最可怜了，所有的烦恼，基本上来自感情，来自于关系。所以，女人就是一定要自找烦恼的物种，到死方休。做女人简直就是来体验苦难的！除非她有自己的追求和理想，否则女人永远也无法从这种关系定义中解脱的。\",\"url\":\"http://zhuanlan.zhihu.com/p/633544948\"},{\"slug\":\"2023-05-27-小公主的社会融入能力如何-徐逸凡在\",\"year\":\"2023\",\"title\":\"小公主的社会融入能力如何？---徐逸凡在磨丁当小助教！\",\"date\":\"2023-05-27\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"因为新教育认为会读书不如会做事，会做事不如会做人。比如：今天晚上，公主班的学生要去清迈古城，帮助拳场推销今晚的比赛拳票。推销拳票活动是公主们主动要求的社会活动项目。帮拳场就是帮自己、这种对外国人进行现场的推销和锻炼，非常考验公主们的沟通能力。下面是15岁的小公主徐逸凡，在磨丁当小助教的时候，学员对她的评价！你认为国内大学泰语系的毕业生，沟通交流和社会融入能力会超过小公主们吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/632714736\"},{\"slug\":\"2023-05-23-清一木兰首战男拳手\",\"year\":\"2023\",\"title\":\"清一木兰首战男拳手：\",\"date\":\"2023-05-23\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"经过某泰国资深律师的特别安排，昨晚清一木兰终于首战男拳手。这是木兰们期待已久的赛事。但依然有点怀疑----难道泰国人像我们一样，不敢轻易上场（别忘了谭木兰首战对象，居然是清迈的女子冠军拳手）。可是---泰方为啥有必要，不仅仅用实战经验更丰富的男拳手，还要超重来打木兰？我们木兰是30年后，首批敢于挑战职业男拳手的女拳手！我相信你们会看到新一代的花木兰出世的---新一代太极女侠战胜男拳手。\",\"url\":\"http://zhuanlan.zhihu.com/p/631585567\"},{\"slug\":\"2023-05-21-如何用穿透百年的眼光来过好今天\",\"year\":\"2023\",\"title\":\"如何用穿透百年的眼光来过好今天？\",\"date\":\"2023-05-21\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"但现代人，都已经养成了鼠目寸光的习惯，每天都超短见识地活著！幸亏---世界上还有一群人，懂得追求自己的理想，会用“长期主义”的思想，去思考自己每天该怎样活著！明德女塾少年班：公主故事：你希望下一世拥有一个什么样的人生？俞敏洪的下一世，想做自由自在的流浪者，他的理想实在谈不上有多远大。只能让人感叹：俞敏洪这一生，都是为了责任而活。这才是人生----每天都为一个自己想要的“更好的世界”而活。\",\"url\":\"http://zhuanlan.zhihu.com/p/631098190\"},{\"slug\":\"2023-05-10-为什么体制内那么多剩女\",\"year\":\"2023\",\"title\":\"为什么体制内那么多剩女？\",\"date\":\"2023-05-10\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"婚姻与两性\",\"summary\":\"中国男人的需求并没有减少，甚至还在增加。所谓的剩女，无非就是一些觉得自己条件高的人。认为一些男人配不上她，挑来挑去挑剩下的。因此---越是条件好的女人，越容易剩下。一个职场女人，肯定比依赖丈夫的普通妇女更有骨气。所以，大城市或者体制内这种明显职业有优势的女人往往会剩下。但农村妇女就没听过有啥剩下的。即使是脾气个性极差的女人，似乎也有人要！生育率也一样：越有文化的女子，往往生育愿望越低。\",\"url\":\"https://www.zhihu.com/question/548818176/answer/3021976683\"},{\"slug\":\"2023-05-04-今天中国建筑创新高了-复权价\",\"year\":\"2023\",\"title\":\"中国建筑复权新高，逢高换股天山铝锁定利润\",\"date\":\"2023-05-04\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"但为了表示庆祝，和基于友好分享的精神，我今天以7元的价格，出售了100万股中建。由于不想浪费资金，今天正好看到前期冲高我已经卖光了天山铝业，今天居然跌到7元了。就用中建换了几十万股天山铝进来，买入价7.09元。理由就是：现在的中建，已经创了15年来的新高，而天山铝现价只有2015年的一半。这几天----天山铝的价格一直是高于中建的，今天才有机会两股的价格接近一比一。\",\"url\":\"https://www.zhihu.com/pins/1637474750023913472\"},{\"slug\":\"2023-05-04-能移动发力的太极才堪称无敌\",\"year\":\"2023\",\"title\":\"能移动发力的太极才堪称无敌！\",\"date\":\"2023-05-04\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"由于太极发力技术的优越，完全地超越了拳击技术，完全有可能让女拳手取得与体重同级别的男拳手相比的优势。我们的太极无敌木兰，将来与西洋拳的男拳手比赛，基本上无悬念。只求“别打我”，但由于太极勾手，云手技术，很善于拨开对手的防守进行攻击，结果泰拳手只能在不可思议的近距离发拳的距离内被击中。本场比赛，可以看到：练出了发力技术的太极，实战真的很吓人，完全不给对手任何还手的机会，泰拳手整场都完全无力抵抗。\",\"url\":\"http://zhuanlan.zhihu.com/p/626657976\"},{\"slug\":\"2023-05-01-天底下最荒谬的事情-就是一大群奴隶-拼命\",\"year\":\"2023\",\"title\":\"最荒谬：父母拼命培养下一代当奴隶，却骂自由人为骗子\",\"date\":\"2023-05-01\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"天底下最荒谬的事情，就是一大群奴隶，拼命培养自己的下一代当奴隶的本事技能，还把自己的棺材本都拿出来，培养孩子去当高级奴隶--最累的这种奴隶。如果没有被选上，还气得要跳楼。如果你教一个人去当自由人，学会为自己而活，别去当奴隶了。这些人，还统统骂你是骗子！你示范自己的孩子就是这样活的，当自由人，不去当奴隶。结果这群人骂你--傻瓜！不过，我说的疯话，应该没几个人看得懂。今天上课，刚把一群奴隶说哭了！\",\"url\":\"https://www.zhihu.com/pins/1636433300125347840\"},{\"slug\":\"2023-04-30-2020年12月-惠泉啤酒的股东人数是3\",\"year\":\"2023\",\"title\":\"惠泉股东人数腰斩：筹码锁定主力，上涨空间未止\",\"date\":\"2023-04-30\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"随后大幅回落，2021年3月份最低探7.11元。但股东人数并未明显降低，还有32657人。随后再一次6月份冲高超过13元，6月底收盘10.59元，股东人数新高---达到39489人。2022年12月30日，收盘价10.97元。2023年3月30日，收盘13.51元，股东人数进一步减少了5.58%。说明筹码已经锁定在主力手中，这一轮啤酒的上涨空间，绝对不是2020年底的位置（13-14元）。\",\"url\":\"https://www.zhihu.com/pins/1635998815160320000\"},{\"slug\":\"2023-04-26-太极如何对付西洋拳-中国人正开创拳击全新\",\"year\":\"2023\",\"title\":\"太极如何对付西洋拳？中国人正开创拳击全新时代！\",\"date\":\"2023-04-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"墨西哥拳击-桑塔·克鲁兹火爆对攻_哔哩哔哩_bilibili而太极与拳击的首战对抗，是下面这样的视频，你们看看两者的区别有多大？-----这也许是历史上第一次记录下来的，古传太极技术对抗西洋拳击的实战视频！太极拳手按照拳击规则来打的这场比赛，真太极，练的是格斗，正常的格斗技术，是可以与任何流派的格斗手对垒的，因此，可以采用任何对方规定的格斗规则来比赛。了解太极技术，到底为啥让拳击技术无法发挥！\",\"url\":\"http://zhuanlan.zhihu.com/p/625040920\"},{\"slug\":\"2023-04-25-幸福秘诀就是不贪吃-并远离贪吃的人\",\"year\":\"2023\",\"title\":\"幸福秘诀就是不贪吃，并远离贪吃的人！\",\"date\":\"2023-04-25\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"你吃多了，吃急了，贪吃了，就会有种种“意外”来缩短你的生命。另外，你也别跟贪吃的人建立亲密关系，这等于找抽呢！街边不少人正在吃饭，都是说中文的，跟回到中国的感觉一样，菜饭都是典型的中国菜。晚上，不想在酒店正式吃饭，就只是去磨丁外面的食街，吃了一份6元钱的晚餐-------白稀饭加上馒头，小包子，还是地道河南人开的餐馆。中国人的大餐，就是不吃饭，大量的吃菜，吃硬菜，吃贵的，稀奇的菜。\",\"url\":\"http://zhuanlan.zhihu.com/p/624754517\"},{\"slug\":\"2023-04-23-美国加利福尼亚州-通过了一项法律-规定\",\"year\":\"2023\",\"title\":\"加州通过950美元以下盗窃免责法，社会秩序将加速崩坏\",\"date\":\"2023-04-23\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"可能是这种小额（其实不小了）的犯罪越来越多，造成了司法界的负担。因此出台新的法律，表示不用处理这些案件，减轻司法部门的负担。但是这个时候，出台这种“法律”，不就是保护越来越多的“零元购行为”吗？这样宽松的条件，社会次序只会越来越乱的。只有社会安定，基本上不会出现盗窃行为的时候，才能出这种宽松的法律。我认为10年之内，美国是一个超级危险的时期。10年之后，中美局势确定了，可能再看美国好一点没有？\",\"url\":\"https://www.zhihu.com/pins/1633401547848663040\"},{\"slug\":\"2023-04-22-清一太极首战西洋拳-BOXING-赛事\",\"year\":\"2023\",\"title\":\"清一太极首战西洋拳（BOXING）赛事，轻松获胜！\",\"date\":\"2023-04-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"因为我也从来没打过拳击赛事，甚至----不好意思，我昨天才第一次现场观看拳击比赛，原来只在视频上看过。民国时期首次的全国传武大会，比武的结果，就是学西洋拳击的拳手，彻底打败各路学传武的中国功夫。如果清一太极能够轻松克制拳击技术，取得胜利，意味着中华武术未来将取得历史性的突破！谭木兰首战拳击的成功，从小公主们看前面几场职业赛事的时候，就有预兆了。最终，清一太极战拳击，获得了压倒性的优势和胜利。\",\"url\":\"http://zhuanlan.zhihu.com/p/623899607\"},{\"slug\":\"2023-04-19-中考录取比例下降为73-阶层下降时代提前\",\"year\":\"2023\",\"title\":\"中考录取比例下降为7:3：阶层下降时代提前开启了\",\"date\":\"2023-04-19\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"中考录取比例调整为3:7我原来一个大学同学，自己是985名校毕业的强人，与省级干部的二代联姻，妥妥的中国高阶家庭，上流社会。三代人，从高阶降到中产干部，第三代居然降到了打工阶级。如果这种省部级的国家高级干部的红二代，红三代，都保不住自己后代的阶级地位，普通人就更难说了，这还是过去几十年中国高速发展的情况下。现在国家的办法，就是彻底打掉这些小民们自以为是个人物的幻想，开启“降级”时代。\",\"url\":\"http://zhuanlan.zhihu.com/p/622992778\"},{\"slug\":\"2023-04-17-啤酒行业探秘-散户是永远的输家\",\"year\":\"2023\",\"title\":\"啤酒行业探秘：散户是永远的输家\",\"date\":\"2023-04-17\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"重新回顾了一下我在惠泉上的投资：我做到了与散户大众相反而行。每次我进场当十大，重仓持有的时候，几乎都是散户最少的时候。我离开的时机，正好是散户人数爆棚的时候。身边都是一群机构，也让我很不自在-------但我必须用超强机构的思维方式去思考，做一个特立独行的散户。啤酒行业探秘：刚刚公布的惠泉年报，透露了很多啤酒行业的奥秘------我是2019年四季度进入惠泉十大的，这时候的股价6元才多一点。\",\"url\":\"http://zhuanlan.zhihu.com/p/622482247\"},{\"slug\":\"2023-04-17-记者实探淄博烧烤-单店日均售-1-万串\",\"year\":\"2023\",\"title\":\"记者实探淄博烧烤，单店日均售 1 万串， 4 点就要排晚餐、专列车和酒店全满，对当地哪些产业带来影响？\",\"date\":\"2023-04-17\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"居然有这种事情，只能看出国人心灵世界的匮乏，精神追求之空虚。成千上万的人，还坐专列去吃外府，外省吃烤串-----【从早上10点左右出门，到最终晚上10点左右吃上了烧烤，整个过程差不多是12个小时】。这烤串难道是独一味的风景？如果愿意花这点时间，如果花这些钱，不如自己买肉回来烤，请朋友一起玩，不仅仅满足了食欲。一起来体验这样的杀羊，野餐，篝火晚会的活动，不是比坐动车去淄博吃烤串，有趣得多吗？\",\"url\":\"https://www.zhihu.com/question/595939876/answer/2987686071\"},{\"slug\":\"2023-04-16-想安全殴打泰拳冠军吗-现在有机会了\",\"year\":\"2023\",\"title\":\"想安全殴打泰拳冠军吗？现在有机会了\",\"date\":\"2023-04-16\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"【2023公主夏令营，预计在清迈举行，为期一月。开营时间为：7月8日报道，7月9日正式开营。限13岁以上，15岁以下女生参加。全面复制木兰征泰的生活方式，以及训练方式，特别采用电影课模式，塑造学员的勇武之心，培养有志气超越男生，自信“谁说女子不如男”的优秀中华木兰们。武道馆的现任木兰们，将作为武道训练的教练，全面介入夏令营的工作，世界上唯一由世界冠军直接参与和指导下的中学生武道夏令营。\",\"url\":\"http://zhuanlan.zhihu.com/p/622266853\"},{\"slug\":\"2023-04-15-什么是内家拳-什么是外家拳-内家拳慢吞吞\",\"year\":\"2023\",\"title\":\"什么是内家拳，什么是外家拳？内家拳慢吞吞的也能打吗？\",\"date\":\"2023-04-15\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"拿到了泰拳金腰带的弟子们，有时跟我过招玩。而且她们进攻的时候就会犹豫不决的，似乎也跟着我减慢了速度。逼急了发动攻击的时候，看上去我的拳头都没怎么动，她们的脑袋，胸部，直接撞到我的拳头上来的。只需要很短的距离就能打上，甚至几乎就是对方出拳的时候自然撞上来的空隙之处。而且对于职业拳手，都不是傻瓜，她们会有真真假假的攻击。因此，就实现了：后发先至，以及“慢出而快到”的内家攻击方式。\",\"url\":\"https://www.zhihu.com/question/595489034/answer/2985511633\"},{\"slug\":\"2023-04-15-政史地文科生能干什么-中国文科生过量-那\",\"year\":\"2023\",\"title\":\"政史地文科生能干什么? 中国文科生过量，那文科生应该怎么办?\",\"date\":\"2023-04-15\",\"type\":\"回答\",\"L1\":\"人生哲理\",\"L2\":\"思维与认知\",\"summary\":\"据说：读文科就是：上学一时爽，毕业火葬场！其实----这不是文科的问题，而是中国的大学，根本就没有真正的文科！真正的文科，是提高人精神品质的教育，塑造良好的思维和人格，最终成为有思想，有个人魅力的人。有时候：这种真正的文科培养，不仅仅不能培养打工仔，反而培养拒绝打工的人。就是他所受的“文科教育”，智慧教育，教养，人格，不允许他用自己的生命，为了一点点个人享受，来为达官贵人谋国，谋兵，谋利。\",\"url\":\"https://www.zhihu.com/question/455156955/answer/2984910252\"},{\"slug\":\"2023-04-15-文科和理工科的分野-产业界和金融界的差别\",\"year\":\"2023\",\"title\":\"文科和理工科的分野？产业界和金融界的差别？\",\"date\":\"2023-04-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"真正的文科，是提高人精神品质的教育，塑造良好的思维和人格，最终成为有思想，有个人魅力的人。理工科勉强符合工业社会的要求。有时候：这种真正的文科培养，不仅仅不能培养打工仔，反而培养拒绝打工的人。还拒绝了楚国辛苦寻来的使者，请他去当大国总理的职位，拒绝楚王送给他的千金财富和一人之下万人之上的地位。将来：想要上清一大学的学生，必须上完世界top100理工科专业之后，毕业拿到世界五百强的企业聘书。\",\"url\":\"http://zhuanlan.zhihu.com/p/622145919\"},{\"slug\":\"2023-04-14-“清华学生一生最大的成就就是考上清华”怎\",\"year\":\"2023\",\"title\":\"“清华学生一生最大的成就就是考上清华”怎么看待这句话？\",\"date\":\"2023-04-14\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"她们进入清华，其实没有啥个人的目标和追求，不是利用清华的平台来让自己走得更高。而是借用清华的牌子来混事，以为自己就不用努力了，考上清华人生就成功了。清华只是给你一张证明你18岁击败了大多数同龄人的优秀证书。如果你无法做到这一点，只能证明你考上清华就是一生最大成就了，因为你已经没有更高的追求和理想了！也许：将来也会有很多学生，会成为【考上清一大学就成为人生的顶峰】的笑话。\",\"url\":\"https://www.zhihu.com/question/585742918/answer/2983529546\"},{\"slug\":\"2023-04-14-财经大-V-帮粉丝炒股-9-个月账户从\",\"year\":\"2023\",\"title\":\"财经大 V 帮粉丝炒股，9 个月账户从 336 万炒到只剩 18 万爆亏 95%，哪些信息值得关注？\",\"date\":\"2023-04-14\",\"type\":\"回答\",\"L1\":\"投资理财\",\"L2\":\"宏观金融与市场\",\"summary\":\"这种就是拿客户的钱，喂养自己的账户。股市上，真赚钱不容易，亏钱很容易。骗子哄傻瓜的游戏，多多小心！\",\"url\":\"https://www.zhihu.com/question/595305140/answer/2983450611\"},{\"slug\":\"2023-04-12-但凡是中国传统武术的视频-无论是太极也好\",\"year\":\"2023\",\"title\":\"但凡是中国传统武术的视频，无论是太极也好，八极拳也好，咏春也好，为什么评论都是一堆喷子，一堆键盘侠?\",\"date\":\"2023-04-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"辨别真传武的方式很简单：用传武的技术，去参加各种世界职业格斗比赛。不是只去打有意表演赛，或者是安排结果的赛事，如一龙的比赛（其实他的技术根本就不是传武，就是现代格斗手）。不是只有一两个明星能赢比赛，像是张伟丽，李景亮（这两个学现代格斗的人赢了，只能说中国人也能学会现代格斗，但不是传武赢了）。真正传武的发扬，需要中国也有一批日本泽村忠一样的人，去踏实研究，发展中国的传武，将来的传武就会真正的光大。\",\"url\":\"https://www.zhihu.com/question/406984921/answer/2979808842\"},{\"slug\":\"2023-04-12-哪种格斗技最适合或者最容易借鉴中国传统武\",\"year\":\"2023\",\"title\":\"哪种格斗技最适合或者最容易借鉴中国传统武术（如太极拳八卦掌形意拳）？\",\"date\":\"2023-04-12\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"现代格斗与太极八卦的格斗哲学不一样，因此采用的招数，技术都太一样。外家内家，没有哪一种技术天生更优越，只有谁掌握了自己的技术原则，掌握更好，谁就能赢！当然---太极八卦的技术，不是普通人能学的。转发我的另外一个回答：辨别真传武的方式很简单：用传武的技术，去参加各种世界职业格斗比赛。不是只去打有意表演赛，或者是安排结果的赛事，如一龙的比赛（其实他的技术根本就不是传武，就是现代格斗手）。\",\"url\":\"https://www.zhihu.com/question/52549777/answer/2979955503\"},{\"slug\":\"2023-04-09-富二代的流浪教育-家长对孩子最大的爱-就\",\"year\":\"2023\",\"title\":\"富二代的流浪教育！家长对孩子最大的爱，就是让孩子不需要自己！\",\"date\":\"2023-04-09\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"公主班的“流浪教育”正在展开中：公主班的规定，是作业如果排名最后三名，就要被放逐，24小时流浪。一大早小女流浪结束回来，跟她妈妈说的第一句话就是：我很饱。因此：下一代最重要的就是为家族获取“贵”的资源。而富二代考985大学，是为了获得一个顶尖级别的校友圈和身份资格，为将来的家族事业推展，提供更广阔的人脉。只是---中国大多数富人，就算鼓励孩子考985，也不知道与其他穷人上985大学的目的有啥不同。\",\"url\":\"http://zhuanlan.zhihu.com/p/620485482\"},{\"slug\":\"2023-04-05-美国又现骚操作-神助攻-帮中华强大\",\"year\":\"2023\",\"title\":\"美国又现骚操作：神助攻--帮中华强大\",\"date\":\"2023-04-05\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"今天看到更惊人的消息：美国人开始琢磨强行抢中国人的钱了。作为美国财长，这种流氓语言，你都能说出来？美国的国家信用一旦完蛋，美国人一百年来靠发美元，发债卷，全世界抢东西的优雅文明大强盗，就做不成了。没想到：美国还有更骚的操作---搞政府的钱不容易，我们先搞容易的----抢中国民间弱势群体的钱，抢在美国的中国“贪官家属”的钱！现在还只是中美冷战，以后两国万一发生战争，还不知道美国人会对华人怎样。\",\"url\":\"http://zhuanlan.zhihu.com/p/619567388\"},{\"slug\":\"2023-04-03-AI-是不是已经毁了围棋这一古老的游戏\",\"year\":\"2023\",\"title\":\"AI 是不是已经毁了围棋这一古老的游戏？\",\"date\":\"2023-04-03\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"科技与互联网\",\"summary\":\"如果人类把围棋，不求功利不计较胜负的话，或者只是用来作为一种训练头脑的手段的话，其实围棋是一种相当有趣的智力游戏。这样的思路，来回答这个问题，就很容易想通了：其实AI电脑技术，跟围棋这个游戏，其实没啥本质关系----AI毁不了围棋，但可以毁掉你的妄想！现在：据说特别是北京，上海的围棋技能培训，已经提高了档次，家长们热衷于请棋院的专业棋手来指导孩子下围棋，“提高智力水准”。\",\"url\":\"https://www.zhihu.com/question/266132270/answer/2966802835\"},{\"slug\":\"2023-04-03-巴西宣布中巴双边贸易或将用本币而非美元结\",\"year\":\"2023\",\"title\":\"巴西宣布中巴双边贸易或将用本币而非美元结算，这意味着什么？将产生哪些影响？\",\"date\":\"2023-04-03\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"跟他无关的双方，只要不用他家的钱来做生意，就是侵犯了他家的利益。就是我借一笔钱给你，然后你可以用我借的钱给我付款买我的东西。这样双方不用兑换货币，互相就可以做生意了。最有趣的就是：俄罗斯其实，一直想要当美国的跟班，想要融入美国，愿意用美元来做生意，被美国人剥削的。俄罗斯跟中国也两国互换货币，这样双方都不怕信用贬值的问题了。】【巴西中国同意采用本币结算两国贸易】-----名单多了。\",\"url\":\"https://www.zhihu.com/question/592753399/answer/2967070078\"},{\"slug\":\"2023-03-31-转发-嘉纳治五郎的武道创业之路\",\"year\":\"2023\",\"title\":\"转发：嘉纳治五郎的武道创业之路\",\"date\":\"2023-03-31\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"1882年，学了四年日本传统武术的一个人--嘉纳治五郎。”——嘉纳治五郎的武道创业之路全文近9000字，信息量不小，适合抽空细品。在那些为数不多的实践者当中，柔道之父嘉纳治五郎，无疑是最著名的武术家之一。离经叛道，习武强身嘉纳治五郎于1860年出生于日本神户，他的家族在当地非常有名望。嘉纳治五郎かのうじごろう但由于小时候被欺负的不愉快的回忆，嘉纳实在很想变强。\",\"url\":\"http://zhuanlan.zhihu.com/p/618391170\"},{\"slug\":\"2023-03-30-今日啤酒股普涨-盘后总结和思考\",\"year\":\"2023\",\"title\":\"今日啤酒股普涨，盘后总结和思考！\",\"date\":\"2023-03-30\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"昨天比涨停价低一分钱，13.17卖出了13万股惠泉，以9.19元换入13万股珠江，一比一换股玩。只是我有点纳闷：昨天如果多涨一分钱拉涨停，我至少愿意放出200-300万股。这些股，看今天这架势，肯定就是补不回来了。为啥主力今天要大大方方的涨过涨停价，每股多了0.21元？其实：如果不拉涨停，盘面的价格都是虚的。涨停收盘的盘面语言就是“秀身材”---看看---老子不差钱，就差股。\",\"url\":\"http://zhuanlan.zhihu.com/p/618243040\"},{\"slug\":\"2023-03-29-今天睡完午睡起来-居然发现惠泉正在冲击涨\",\"year\":\"2023\",\"title\":\"惠泉冲涨停：主力迟迟不扫货，疑似诱多准备离场\",\"date\":\"2023-03-29\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"主力肯定知道我一向有涨停出货的习惯，难道主力非要在一季度末，把我的两个十大都用涨停手段来清退吗？我认为：虽然13元多的惠泉也不算啥高价，前次高都不算呢。但如果今天冲涨停，我肯定要走掉，不当十大了。虽然原来的确有过这种记录，但我也只吃到了第一个涨停。管他的，我看珠江今天几乎没有咋涨，就考虑用惠泉换一点珠江，锁定今天上涨的收益。反正我今天卖了惠泉，账上的啤酒依然一股不少，将来珠江跌破9元我也不卖。\",\"url\":\"https://www.zhihu.com/pins/1624445364265484289\"},{\"slug\":\"2023-03-29-实战太极的发力训练方式-劲架太极\",\"year\":\"2023\",\"title\":\"实战太极的发力训练方式：劲架太极\",\"date\":\"2023-03-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"太极形架是练柔顺身体，这和各位看到的普通太极是差不多的。但如果太极没有发力，是不能称为一种“功夫”的。要想成为一种能够打人的拳，还必须练发力技术---就是劲架！它是在形架练好之后，一个简单的招式，就可以连续发出三至五次，快速的全身发力太极拳，练起来难度很高。陈沟的炮锤发力，是大家唯一能够看到有发力演练的太极。这是我刚教孩子们不久的“劲架”太极---意思就是“发劲演练的太极”。\",\"url\":\"http://zhuanlan.zhihu.com/p/618078340\"},{\"slug\":\"2023-03-26-太极拳套路可以拆开一个动作一个动作炼吗\",\"year\":\"2023\",\"title\":\"太极拳套路可以拆开一个动作一个动作炼吗？\",\"date\":\"2023-03-26\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"练真太极，就是简单几个基本的招式，甚至一个招式，连续的练很多年。数年之后，你想练全部套路了，最多只需10来天，就可以练完全部的太极套路。所以：如果用五年来学一套太极拳，正确的时间分配是：4年零11个月的时间，你都在学云手，野马分鬃。第五年的第1个月，你就一下子练成了全套72式某派太极。至于错误的太极拳的学习方式：就是一天就学一两个招式，连续一个月就学完全部的套路。\",\"url\":\"https://www.zhihu.com/question/591537580/answer/2954832124\"},{\"slug\":\"2023-03-24-目测珠江啤酒今日异动-主力居然不再辛苦压\",\"year\":\"2023\",\"title\":\"珠江啤酒异动：主力吸筹完毕，再入十大股东\",\"date\":\"2023-03-24\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"如此异动，今日涨幅啤酒股第一名，吸引注意。YJ高位换珠江几百万股的策略，证明很完美，运气超好。其实我是观察到珠江的盘面有主力压盘吸筹，正好YJ涨幅良好。如果没有意外，估计我是唯一的自然人十大。倒不是啥原因，而是珠江的盘子太小了，随便一买就到十大了。-----YJ此轮冲高14元多跌到12元多，回调的幅度已经不小，居然股东人数不增反减。而且新主力的耐心应该比不上老主力，会拿三五年时间来慢慢压盘。\",\"url\":\"https://www.zhihu.com/pins/1622618111609380864\"},{\"slug\":\"2023-03-23-你相信有天性很坏的孩子吗\",\"year\":\"2023\",\"title\":\"你相信有天性很坏的孩子吗？\",\"date\":\"2023-03-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"中国出现大量这种熊孩子事件，其实是说明我们的社会出了非常严重的问题：这个社会的道德底线已经太低了，很多人心目中，是没有基本的道德原则的。对家人和孩子无底线放纵，自大，内心毫无耻感，连基本的礼貌和面子都没有，毫无基本的自尊与尊人，才会导致这种情况。的确，有些孩子生来就喜欢搞事。这也是我很担心的：中国的社会，如果系统崩溃后，不知道会出现多么恶劣的事情。你们拿一点不垃圾的高级东西出来教孩子好不好？\",\"url\":\"https://www.zhihu.com/question/340347942/answer/2949637975\"},{\"slug\":\"2023-03-23-泰国到底有多不安全\",\"year\":\"2023\",\"title\":\"泰国到底有多不安全？\",\"date\":\"2023-03-23\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"虽然作为黄种人的备件库，零件的价格低廉，导致这些特种生意的老板，看你的眼光可能没有看到白人这么痴迷（白人每年在泰国很多失踪的）。小小年纪也会自己搭各种车回家，我们看到一张泰国皮卡会有十几个学生坐车，我们看到有学生站在踏板上，挂在车外“坐车”，似乎家长也没觉得有啥不安全的。泰国很多完全一样的东西，价格差十倍一点不奇怪。最近三四年，因为疫情根本就没有回国，我感觉我在泰国比国内安全得多，生活也放心很多。\",\"url\":\"https://www.zhihu.com/question/314351005/answer/2950532873\"},{\"slug\":\"2023-03-21-能实战的传统太极套路-忽雷架\",\"year\":\"2023\",\"title\":\"能实战的传统太极套路：忽雷架\",\"date\":\"2023-03-21\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"太极忽雷架，就是要练出实战格斗中的“闪电战”打法。正好她们现在也没啥比赛任务，所以：我就让她们现在抽空开始练一些【传统太极套路】。这次打算让她们练“古传忽雷架”---现在还可以见到的一些没有被污染改编的古传太极套路中，还保留有真太极实战价值，有内涵的传统太极套路。其实，这就是传统太极的“闪战腾挪”的技术，用于破坏对方的防守，错开对方的攻击，都特别有效。这个【忽雷基础架】，很像现代到处传的太极套路。\",\"url\":\"http://zhuanlan.zhihu.com/p/615864535\"},{\"slug\":\"2023-03-20-太极旋身肘首度奏功-男武士连续两次KO勇\",\"year\":\"2023\",\"title\":\"太极旋身肘首度奏功，男武士连续两次KO勇悍泰拳手！\",\"date\":\"2023-03-20\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"最近男生的两场比赛，都是用太极旋身肘，分别在第一和第二回合，KO了凶猛的泰拳对手。而且----打得连泰国裁判都莫名其妙，认为泰拳手没有中招，是'装睡\\\"的，来骗出场费！与武士们打比赛的泰国男拳手一直很猛，我估计是因为泰女拳手不断被木兰们KO，却无力反击。应该是同一拳馆的男拳手，来为泰女报仇的比赛！刘轩宁这场比赛，是首次太极旋身肘KO对手的记录。说明武士们的太极旋身肘技术开始用出来了。\",\"url\":\"http://zhuanlan.zhihu.com/p/615322415\"},{\"slug\":\"2023-03-16-泰国拳师节-木兰获授金腰带和泰拳段位\",\"year\":\"2023\",\"title\":\"泰国拳师节：木兰获授金腰带和泰拳段位\",\"date\":\"2023-03-16\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"同时，也把这个协会的冠军金腰带，颁发给了谭木兰。上次谭木兰已经击败英国拳手，获得清迈拳馆的金腰带。（两个金牌和银牌未出示）不同的拳手，带的蒙空颜色不一样，代表不一样的级别背后几位是给木兰们授予资格证书的泰拳宗师，他们带的蒙空颜色是金色的！授予泰拳协会的金腰带授予木兰泰拳的“白拳手段位”，拥有戴白色蒙空的资格全体的观礼拳手拳手的“授衔仪式”菲律宾拳手没有得到金腰带和段位证书！\",\"url\":\"http://zhuanlan.zhihu.com/p/614568752\"},{\"slug\":\"2023-03-15-古泰拳和现代泰拳的区别\",\"year\":\"2023\",\"title\":\"古泰拳和现代泰拳的区别\",\"date\":\"2023-03-15\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"古泰拳和现代泰拳，其实是两个格斗体系，拥有非常不同的格斗思路。现代泰拳，跟西方的格斗技术很相似---都是双重拳法，肌肉发力！现代泰拳，技术发力，跟中国的外家拳完全一样。第一：核心攻击手段不同（泰拳喜用扫腿，古泰拳喜欢用正蹬）现代泰拳，最核心的技术是泰扫，用强硬的小腿胫骨打击对手。古泰格言区别二：古泰拳更重视防守技术，现代泰拳更重视攻击技术！区别三：现代泰拳强调步法移动稳定和强调力量支撑。\",\"url\":\"http://zhuanlan.zhihu.com/p/613870205\"},{\"slug\":\"2023-03-12-帝王想要却无力实现的梦想-清一百年世家\",\"year\":\"2023\",\"title\":\"帝王想要却无力实现的梦想：【清一百年世家永续】\",\"date\":\"2023-03-12\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"左师公曰：“父母之爱子，则为之计深远”我们这一生的努力和奋斗，是否能够给子孙后代，留下一个更好的世界和未来呢？你能否在百年前，就奠定了后代子孙注定不平凡的一生？去搭建一个前人没有见过的永续传承的世界奇迹？作业2：要实现“百年永续家族传承”，你需要多少启动资金才能实现这个“家族成员不在为利益集团打工”的财富自由需要？3：如果【清一百年世家永续】真的是拥有几乎无限资源的帝王，最想要却无力实现的梦想。\",\"url\":\"http://zhuanlan.zhihu.com/p/609854591\"},{\"slug\":\"2023-03-10-今年预计-1158-万为高校毕业生-再创\",\"year\":\"2023\",\"title\":\"今年预计 1158 万为高校毕业生，再创历史新高，这将带来哪些影响？目前毕业生就业形势如何？\",\"date\":\"2023-03-10\",\"type\":\"回答\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"未来50年，是前所未有的大变局。挺有意思的数据对比：今年1158万大学生毕业。对应的年龄，大致上是2000年出生的1760万人口。中国的国家统计局周二（1月17日）说，中国2022年出生人口为956万人，死亡人口为1041万人，人口比上一年年末減少85万人。未来，死亡人数年年递增，十年内，就可以达到每年死亡2000万人以上，最高峰有可能接近2900万人，而出生人口低于1000万可能成为常态。\",\"url\":\"https://www.zhihu.com/question/588310588/answer/2929706655\"},{\"slug\":\"2023-03-10-工地食堂因饭菜实惠成大学生打卡点-如何看\",\"year\":\"2023\",\"title\":\"工地食堂因饭菜实惠成大学生打卡点，如何看待此事？为什么出现这种现象?\",\"date\":\"2023-03-10\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"很多大学周边，都有不少为学生服务的小餐馆。比享受补贴，免除税收，免除房租，还不许盈利的大学食堂价格更便宜，菜品更丰富，味道更好。尽管这些商家是“利益驱动”型的该死的资本主义自由经济，但居然比“责任型，公益型”的大学食堂办得更好，菜品服务等对学生更亲民，更善良，你说是啥原因？泰国大学生似乎不按点吃饭，任何时候都有人来吃饭。这些泰国的大学食堂，怎样维持了低廉的价格和服务水准的？\",\"url\":\"https://www.zhihu.com/question/588090824/answer/2929757240\"},{\"slug\":\"2023-03-10-木兰参加AM泰拳世界冠军锦标赛\",\"year\":\"2023\",\"title\":\"木兰参加AM泰拳世界冠军锦标赛\",\"date\":\"2023-03-10\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"陆鸽是泰方认为她的打法就是使劲冲，让泰拳手不知道咋对付。有点奇怪这种对待拳手的方式---难道优势较大反而没有拿腰带的机会？谭木兰打51公斤级，与泰国对手配对合影。佳慧打53公斤级，对手是菲律宾人，擅长踢拳。是以老拳师的拳馆名义参赛的（清迈其他拳场，以我们的木兰拳馆名字比赛）。原来记得：我们自己拳馆的名义参赛，全场五局，都是我方追着泰国对手打，对方被击倒多次。另外主办方邀请我参加16日的拜师礼活动。\",\"url\":\"http://zhuanlan.zhihu.com/p/612303143\"},{\"slug\":\"2023-03-09-网友发帖称「资助-8-年的女生毕业后选择\",\"year\":\"2023\",\"title\":\"网友发帖称「资助 8 年的女生毕业后选择做家庭主妇」，并表达失望与沮丧，如何看待发帖人的想法？\",\"date\":\"2023-03-09\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"我非常理解陈果的心情，因为我也在做跟陈果一样的事情。大学毕业之后，就做一个她初中毕业就可以做的事情（生子），的确很受打击！唯一不同的就是：她如果只是初中毕业，应该是嫁给一个大她13岁的农民生子。现在她大学毕业，她嫁给一个大她13岁的有钱人生子。认真培养学生10年，表现很优秀，但她长大后的“理想和行为”，就是“早点嫁人生孩子”。其实我一直在考虑这个问题：该怎样资助穷人?……\",\"url\":\"https://www.zhihu.com/question/587886963/answer/2928505486\"},{\"slug\":\"2023-03-06-坐庄幻想-20亿家产荡尽换来的教训\",\"year\":\"2023\",\"title\":\"坐庄幻想：20亿家产荡尽换来的教训\",\"date\":\"2023-03-06\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"财富与阶层\",\"summary\":\"我炒股32年，从来没有做过庄，第一没实力，第二也是没本事，第三是没有庄家朋友，虽然认识过一些我怀疑是庄的人，但别人从来不承认自己坐庄。【有一家我怀疑会坐庄的，搞金融的朋友，接待我定的房子是杭州的总统套房，去过特别的只有省部级才有资格去的会所。继承了父母创业40年，留下来的20多亿资产。自己坐庄更划得来，来钱更快。但少庄家的家族，用了几十年积累下来的几十亿资产，就这样完全被金融大鳄们洗光了。\",\"url\":\"http://zhuanlan.zhihu.com/p/611673429\"},{\"slug\":\"2023-03-02-下一个挑战世界纪录的清一创造-百年世家\",\"year\":\"2023\",\"title\":\"下一个挑战世界纪录的清一创造：【百年世家计划】\",\"date\":\"2023-03-02\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"可是，我却一直在努力建设【清一家族百年传承】计划。我认为：我会成为比历代帝王更高明的家族传承计划的开创者！上前，正在考虑成立一个【清一百年世家俱乐部】。今年的博文，打算“有建设性”一点，就把我的“百年家族计划“挂上来了（本来是个人私密的，似乎内容已经被家长们传到网上了。张清一给100年后的子孙的一封信（家族传承礼单）亲爱的孩子：我是你的曾老祖张清一，在你出生前一百年，就已经离开了这个世界。\",\"url\":\"http://zhuanlan.zhihu.com/p/610008244\"},{\"slug\":\"2023-03-02-文科生找不到工作的原因到底是啥\",\"year\":\"2023\",\"title\":\"文科生找不到工作的原因到底是啥？\",\"date\":\"2023-03-02\",\"type\":\"文章\",\"L1\":\"商业与科技\",\"L2\":\"职场与就业\",\"summary\":\"2022年大学毕业生的就业率，文科生据说只有12%，工科生也好不到哪去，只有17%。理科生好一些，超过20%了，只是逻辑上----理科生的就业，不应该比工科生更好呀？大学生尤其是文科生就业难，实际上是高校系统性错配的结果。文科的岗位，主要是管理部门，行政需要等等。但跟社会的实际需要有很大关系（比如新教育毕业的学生，就算是水平较差，也更容易在外围学堂找到工作，因为这个市场目前的需求是在增加的）。\",\"url\":\"http://zhuanlan.zhihu.com/p/610808056\"},{\"slug\":\"2023-03-02-最近看到一个人-写他的朋友的事情-说在0\",\"year\":\"2023\",\"title\":\"亲历2008雪灾：弃车脱队求生，亲见冻饿之惨\",\"date\":\"2023-03-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"我一直怀疑当年这个事情，比我们看到的媒体报道情况严重得多。因为我是亲历人，知道当时的情况非常的严重！当时这个朋友是开货车的，看情况不对，就抛弃车辆，艰难走回家了。一些当时不愿意抛弃车辆的人，或者在堵在更远的荒野的人，或者体弱者，病人，小孩等，最后结果会很绝望的。而是中途找到一个机会，脱落队伍，带一家人跑去附近一个小镇休息。我设法找到一个背大路的当地加油站，为车子加满了油预备好。\",\"url\":\"https://www.zhihu.com/pins/1614624622338523136\"},{\"slug\":\"2023-03-01-全中国唯一让学生选教师的学校\",\"year\":\"2023\",\"title\":\"全中国唯一让学生选教师的学校\",\"date\":\"2023-03-01\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"学生意见----给我选的教师差一点就好了！学生本应该是学校的主人，但在中国，大多数学校的学生，就是被教师们各种虐的奴才，被逼着听课，写作业，刷试卷。甚至一些教师上课就是骂人，根本没教学生啥有价值的东西。因此，为了保证学生的教育权利，【今日国际学校】的要求，是学生可以选老师。经过今日塾校长和教师团队从申请人中进行初选之后，选出了五个候选人，提供给家长和学生共同决定他们要谁当新的带班教师。\",\"url\":\"http://zhuanlan.zhihu.com/p/610276280\"},{\"slug\":\"2023-02-27-比尔盖茨花费62亿元买啤酒\",\"year\":\"2023\",\"title\":\"比尔盖茨花费62亿元买啤酒\",\"date\":\"2023-02-27\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"投资理念与方法\",\"summary\":\"我这次比盖茨有眼光，已经提前这位世界首富，早早低位下手，把啤酒买成为我的第一大仓。2014年，原来我是跟比尔盖茨的风赚钱的，当时我看他的基金买了中国中铁持仓两三年了没赚钱，我也就跟随买了不少，虽然不懂为啥他买这些建筑股。后来基建狂魔大建，成为帮我赚到最多钱的股票。看样子未来还有更大的机会---毕竟比尔盖兹现在才看好啤酒买进来。看到比尔盖茨花这么多钱收购喜力啤酒股份，我就更放心地持有中国啤酒了。\",\"url\":\"http://zhuanlan.zhihu.com/p/609793615\"},{\"slug\":\"2023-02-25-刻画国民性最深刻的电影-满城尽带黄金甲\",\"year\":\"2023\",\"title\":\"刻画国民性最深刻的电影【满城尽带黄金甲】\",\"date\":\"2023-02-25\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"一些人物拥有饱满的人格，器宇轩昂的英雄情怀。这种古怪的国民性，本质上，是担心强者会成为自己的主人来压制自己。【海底捞】充分体察到这种国民性，刻意让员工【扮演奴才】，大大地满足了国人的“主子欲望”，这就是他成功的核心要素！包括后来的【十面埋伏】，刻画的都是国民性。电影课作业：1：公主视角：【满城尽带黄金甲】故事里，悲剧的制造者到底是谁？2：公主故事请写一个与情节相反的【满城尽带黄金甲】故事大纲！\",\"url\":\"http://zhuanlan.zhihu.com/p/608893482\"},{\"slug\":\"2023-02-24-躺赢-的富二代有一种残害孩子的方式-叫\",\"year\":\"2023\",\"title\":\"【躺赢】的富二代?有一种残害孩子的方式，叫“用钱砸死她”\",\"date\":\"2023-02-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"中国富二代最悲哀的就是：父母长辈从小教给他“不劳而获”的思想，从此种下穷根。父母只会拿钱砸她，去买各种物质来“满足自己”，以为这就是世界上的一切。当年赚到普通人十辈子也花不完的钱的泰森，别说富不过三代了，他居然玩了一个中年破产。但他们有一个共同的身份：两人都是富二代！前一张富二代女孩，躺在房产证上的照片，你看到的是女孩父辈的骄狂和洋洋得意。现在的富二代孩子，有多少人有这样的担当？\",\"url\":\"http://zhuanlan.zhihu.com/p/609139088\"},{\"slug\":\"2023-02-23-公主课程-看透人性-看透国民性-系列课\",\"year\":\"2023\",\"title\":\"公主课程：【看透人性，看透国民性】系列课程之一\",\"date\":\"2023-02-23\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这是我给14岁的小女和她的伙伴同学开设的【私人定制专享课程】：外人来上这种课程，收费不菲的。你们看了，就知道为啥小女不上体制学校了？本课程就是教孩子们辨别：有人在胡说八道！很多人，就是习惯了让自己宝贵的大脑被一些混蛋灌狗屎进去---只要让这些人相信灌的是“鸡汤”就行！课前作业：今日开讲“主子与奴仆”：国人千年延续的奴性根源探寻！如果找不到固定的主人收留自己当奴隶，就去做金钱的奴隶。\",\"url\":\"http://zhuanlan.zhihu.com/p/608700683\"},{\"slug\":\"2023-02-21-富二代-到底需要什么样的教育\",\"year\":\"2023\",\"title\":\"富二代，到底需要什么样的教育？\",\"date\":\"2023-02-21\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"穷二代和富二代，需要的是完全不一样的教育。根本就不懂到底该怎样教育富二代，富三代。普通家庭的教育目标非常的简单，就是要通过读书去谋求一个好工作，好职位！不能指望我们这个刚从全世界难以想象的“均贫”中走出来的国家，有能力为我提供符合家庭需要的教育。更不能指望我能去西方国家，找到符合我家族需要的教育。富人其实也知道应试教育的种种弊端，国内吵了很多年的素质教育，但谁也不知道素质教育是什么。\",\"url\":\"http://zhuanlan.zhihu.com/p/607764949\"},{\"slug\":\"2023-02-18-这一晚的比赛-明骐后脑被肘开了个口子-这\",\"year\":\"2023\",\"title\":\"拳场实录：泰拳残酷，拳手受伤无保障，硬碰硬不科学\",\"date\":\"2023-02-18\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"但当天，另外一个泰拳手的小臂骨，被凶猛的泰扫给打骨折了。拳场额外给了这个拳手5000B的养伤钱。这个拳手，大约半年以上是不能上场比赛了！只有少数格斗天才，幸运儿，才能打到几十万，几百万的比赛。但泰拳手们居然没有这个训练，我们问泰拳馆的拳手们：他们的手臂和小腿的硬度，是怎样出来的？一般泰拳手，一年要打上好几十场比赛，到20岁打上300场比赛的拳手很多。但互磕练习，是双方都控制力度的，不太会受伤。\",\"url\":\"https://www.zhihu.com/pins/1610383734326317056\"},{\"slug\":\"2023-02-13-素食者对战肉食动物-真人版-美女与野兽\",\"year\":\"2023\",\"title\":\"素食者对战肉食动物：真人版【美女与野兽】！\",\"date\":\"2023-02-13\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"真人版【美女与野兽】下面是公主们去古城与洋人沟通互动的话题内容。2：你认为人类的素食者和肉食者进行最残酷的泰拳格斗比赛。A：素食者力量，速度，耐力都占优势，体重相同更有优势！A：素食者力气更大B：肉食者力气更大C：跟个人身体条件有关，与肉食与否没关系！你认为是肉食者更灵活，还是素食者更灵活？A：素食者会更灵活B：肉食者会更灵活C：看个人情况，与肉食和素食无关！\",\"url\":\"http://zhuanlan.zhihu.com/p/606011233\"},{\"slug\":\"2023-02-12-周日课外活动记-公主班对西洋人的反向价值\",\"year\":\"2023\",\"title\":\"周日课外活动记：公主班对西洋人的反向价值传播\",\"date\":\"2023-02-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"本学期开始：为了强化外语的交流和学习，公主班的学生，本学期的周末活动大大强化。计划是每周五晚上和每周日一整天，利用清迈国际旅游城市的优势，对全世界的游客，进行中国人全新形象展示的“公主国际交流日”活动，直接拿洋人来练口语，练文化交流能力。就算是去古城，直接拿洋人来练口语交流，但课程设计依然不是外语为中心，反而是“中西文化交流沟通课”。下面是一路护航的校外家长们拍的公主们周日课外活动的照片！\",\"url\":\"http://zhuanlan.zhihu.com/p/605754545\"},{\"slug\":\"2023-02-11-公主班新学期第一课-清一教育要培养什么样\",\"year\":\"2023\",\"title\":\"公主班新学期第一课：清一教育要培养什么样的人才？\",\"date\":\"2023-02-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"这种课程和作业，就相当于今日国际学校的高中部作业。您认为：持续三年里面，我们这样不断的训练和培养公主们的思维和眼光，她们和其他每天学A-LEVLE。或者---这群小公主，和现在衡水高中备战高考的学生，未来会有啥区别？15-18岁，你学什么东西，将来大概率成为什么样的人！学期开学第一课:给你一双发现未来的眼光！4：根据中国国情，未来20-30年，清一新教育的发展会受到什么样的影响和困难？\",\"url\":\"http://zhuanlan.zhihu.com/p/605350054\"},{\"slug\":\"2023-02-10-有买股票包赚不赔的奥秘吗-写在燕京创历史\",\"year\":\"2023\",\"title\":\"有买股票包赚不赔的奥秘吗？写在燕京创历史新高之际\",\"date\":\"2023-02-10\",\"type\":\"文章\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"第一个指标，是只在股票长期走势的底部买入，绝对不追高。第三种可以考虑买入的情况，就是股价处在历史中位线，但股东人数处在历史高位数。表面上，与华夏一样，股东人数是历史新高，说明主力不在场。第二种有危险，但也有利润和机会的股票，可能属于最惊险，最刺激的股，就是股价创历史新高，但股东人数创历史新低的股！这几天，我手上股价创上市以来历史新高，股东人数创新低的股票，是燕京啤酒！\",\"url\":\"http://zhuanlan.zhihu.com/p/604260212\"},{\"slug\":\"2023-02-08-传武里这种出拳踢腿同时进行的动作是否有实\",\"year\":\"2023\",\"title\":\"传武里这种出拳踢腿同时进行的动作是否有实战意义？还是说单纯是个表演动作？\",\"date\":\"2023-02-08\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"上下连击，其实不符合现代格斗的发力方式，可以比这个招式和动作，但发不出力量。因为刺拳没有摆身动作，就发不出重击的力量，要靠后手拳转动才能发重击力！对于外家拳来说，如果你踢脚的时候同时出拳，你的支撑力没有了，摆动力也没有了，怎么发出力量来？因此：这种出拳方式，就是虚晃一枪，骗骗人玩的。就是在普通人，外家拳的人发不出力量来的动作上，能够打出有力量的攻击，因为传武的发力系统，与外家拳是不一样的。\",\"url\":\"https://www.zhihu.com/question/581386308/answer/2882185202\"},{\"slug\":\"2023-02-08-徐浩峰缅怀于承惠-心有剑器改乾坤-世无度\",\"year\":\"2023\",\"title\":\"徐浩峰缅怀于承惠：心有剑器改乾坤 世无度量容英才\",\"date\":\"2023-02-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"导演《箭士柳白猿》时，训练出了赵峥，他是话剧演员，无武术基础，两个月后可和真正高手于承惠对搏长枪。于承惠成名于1982年的《少林寺》，李连杰正一号，他反一号。老派武人都敬长枪，长枪最练功夫、最显功夫，于老有根用了三十年的枪杆，已泛红色。在《少林寺》中扮演王仁则“心有剑器改乾坤，世无度量容英才”——原是去年路学长导演辞世，我写的挽联，一朋友觉得文有怨气，别刺激了大家，因而弃用。\",\"url\":\"http://zhuanlan.zhihu.com/p/604506962\"},{\"slug\":\"2023-02-08-泰拳避战今年300场比赛有点悬\",\"year\":\"2023\",\"title\":\"泰拳避战:今年300场比赛有点悬\",\"date\":\"2023-02-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"甚至不是“打比赛”，而是通过泰拳来练兵，打全世界的现代格斗！另外，我们也要备战4-5月份的泰国拳击赛事，在技术上练好拳击技术。最近两周，清迈拳场都没有给我们安排正常比赛（年后刚打完的外府几场比赛，是很早安排的）。18日外府的节日庆典比赛，原来老拳师安排了让三个木兰都去打的（总共10场比赛）。现在看样子，对方避战，我们的比赛任务完不成了。泰拳这边有比赛安排我们就参加，没比赛就练功，专心对付拳击。\",\"url\":\"http://zhuanlan.zhihu.com/p/604646166\"},{\"slug\":\"2023-02-07-春季开学第一课-流浪公主项目启动\",\"year\":\"2023\",\"title\":\"春季开学第一课：\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"流浪公主\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"项目启动!\",\"date\":\"2023-02-07\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"春节假期，经历了野生公主和工地公主，探险公主，节日公主等尝试的公主班学生，昨天重新回到清迈的校园，今天开始了新学期的学习。今天我刚给孩子们讲了开学第一课：告诉孩子们---人和人之间的差距，小时候都是差不多的。我们新教育学堂，也只有公主班我才会敢给学生安排这种我小时候经常参与的“校外，课外活动”。今天开学，公主们要从中选出5个人来，跟随木兰佳慧和谭木兰两人一起练武，准备今年下半年走上擂台。\",\"url\":\"http://zhuanlan.zhihu.com/p/604167235\"},{\"slug\":\"2023-02-06-2月5日-谭木兰对战原世界冠军甜水-技战\",\"year\":\"2023\",\"title\":\"2月5日 谭木兰对战原世界冠军甜水  技战术解析！\",\"date\":\"2023-02-06\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"甜水赛后对老拳师说：谭木兰很厉害，很强壮。这个世界冠军的技术和人品都很不错，不装摸做样，不摆明星的谱。只是作为她的对手也跟著沾光，主办方也给谭木兰相同的礼遇，表示认同下面是一场双方是势均力敌的高手之战！在技术上，后两局谭用了较多的飞身和连续攻击，甜水就真的毫无办法，谭木兰打的比我的第一战好多了，这一点我要向谭木兰学习。对付甜水这样的世界冠军，顶尖高手，你想用在清迈拳场的普通攻击技术去打。\",\"url\":\"http://zhuanlan.zhihu.com/p/603919094\"},{\"slug\":\"2023-02-06-妻子沉迷吃喝玩乐欠债27万-想吃火锅被拒\",\"year\":\"2023\",\"title\":\"妻子沉迷吃喝玩乐欠债27万，想吃火锅被拒跳车身亡，丈夫因过失致人死亡被判有期徒刑2年，如何看待此事？\",\"date\":\"2023-02-06\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"一个鼓励疯狂的制度，不会造就理性的社会！一个不干活，成天借钱吃喝玩乐的疯女人，对自己老公坚持要先去看孩子，之后再带她吃火锅的意见，表示绝对不能接受。一个成年人，不能对自己的行为负责，不能自我控制吃的欲望，不能预见自己行为的后果，导致自己跳车死亡，这种事情？于是：这个事件中，老实工作，负责赚钱养家还债，也更关心孩子，把看孩子的重要性放在吃火锅之上的父亲和丈夫，却被视为造成死亡的“责任人”。\",\"url\":\"https://www.zhihu.com/question/582294603/answer/2878827119\"},{\"slug\":\"2023-02-06-清一小公主的假期生活2-建筑公主和节日公\",\"year\":\"2023\",\"title\":\"清一小公主的假期生活2：建筑公主和节日公主篇\",\"date\":\"2023-02-06\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"今天记录另外一波公主们的假期生活部分：“工地公主”们的假期生活。这群小公主分为两部分任务，一部分公主，在泰国人的指挥下，用一个月时间，建设一个泰国传统建筑：同竹子做支撑，敷上泥土做墙壁的传统土房。另外一批工地工作，未来的公主楼正在进行装修阶段的工作。这个假期，已经把小公主们从一开始啥都不懂的傻丫头，培养成了基本合格的工人！发展空间巨大工地公主们的假期活动，不仅仅限于盖房子！\",\"url\":\"http://zhuanlan.zhihu.com/p/603667311\"},{\"slug\":\"2023-02-05-清一小公主的假期生活1-野生公主篇\",\"year\":\"2023\",\"title\":\"清一小公主的假期生活1：野生公主篇\",\"date\":\"2023-02-05\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"公主们发现：自己一个月，就可以盖出一栋大几十个平方，有三个房间，足够一家人舒服生活的房子了。我们安排小公主们，去合适的泰国人的家里面住上一个月。小公主们在国内学的泰语，在与泰国人生活的过程中，提高非常的快。第四种假期体验，是几个小丫头，居然要体验“荒野生活”，看贝尔的纪录片看多了吗？为了保险，就让这群”野生公主“，去我买的一个500多亩的森林庄园里面假装“野外生存”。\",\"url\":\"http://zhuanlan.zhihu.com/p/603610742\"},{\"slug\":\"2023-02-04-如何看待传武VS现代搏击散打-点穴大师一\",\"year\":\"2023\",\"title\":\"如何看待传武VS现代搏击散打，点穴大师一招KO对手？\",\"date\":\"2023-02-04\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"霍師父轻松用点穴技术击败散打王，是真是假？轻松KO一众高手，高额奖金就滚滚而来，为啥舍弃这种轻松，合法，高额的利润，而去这种显然没啥权威性的擂台上，大展雄威呢？难道霍師父义薄云天，视金钱如粪土？如果点穴霍师傅的功夫是真的，早就走上我说的，为中华传武扬名吐气的“康庄大道”了吧？霍师傅面对一个智商显然比小鸟高得多，双方很容易沟通交流的散打王。职业搏击手上门踢馆，结果被狠狠打脸最后说说：我是练传武的。\",\"url\":\"https://www.zhihu.com/question/582041043/answer/2876076589\"},{\"slug\":\"2023-02-04-打实战被一个人ko两次-这真的是天赋吗\",\"year\":\"2023\",\"title\":\"打实战被一个人ko两次，这真的是天赋吗?\",\"date\":\"2023-02-04\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"身高臂展不如别人，拳击水平也不如别人，当然只有被KO的命了。三个方式可以避免被KO：避免跟对方拳击距离作战就安全了。一：保持远距离----练散打的，总知道用腿来维持距离和攻击吧？只要用好正蹬，让对方无法靠近你也行。估计你这个技术也不行。二：近距离缠绕对方，不给对方发力机会，内围缠绕，会用自己也没事，找机会压制和KO他。三：上面两招，如果你都学不会，就只能学第三招：不跟他打！\",\"url\":\"https://www.zhihu.com/question/582058858/answer/2875643807\"},{\"slug\":\"2023-02-03-YJ走势果然神鬼难料表情\",\"year\":\"2023\",\"title\":\"YJ神鬼难料，跨品种作T换珠江每股便宜4.25元\",\"date\":\"2023-02-03\",\"type\":\"想法\",\"L1\":\"投资理财\",\"L2\":\"个股实战交易\",\"summary\":\"神都想不到-----昨天只有两三百万封单，就轻松封死涨停，居然今天上午就大跌5个点？主力白白的一天，就送我上百万的心态奖---友好分享奖？联想到当年YJ连续三个涨停，高调突破，然后不久，居然又跌回原地的操作。无一不是超越常理，让人目瞪口呆的操盘手法！高位卖出势头良好的“好股”，重新买回市场先生抛弃的“不良品种”。如果今天这种走势放巨量，大家就应该小心了。如果想要出货的手法，是高开，然后慢慢的低走。\",\"url\":\"https://www.zhihu.com/pins/1604810289215668226\"},{\"slug\":\"2023-02-03-继“脚踢泰拳”后-木兰把拳打英伦列入规划\",\"year\":\"2023\",\"title\":\"继“脚踢泰拳”后，木兰把\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"拳打英伦\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"列入规划！\",\"date\":\"2023-02-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这就是清一武道馆一开始就决定了的目标：一旦拿到泰拳冠军，我们的拳手就转向打别的比赛。现在发现---同时打不同规则的比赛，也不是啥问题！因此，今年开始就双向征泰(泰拳），打英（拳击）了！后来转战拳击，与梅威瑟打过一场拳击比赛。不知道踢拳全胜转战拳击界的日本格斗天才，是不是技术不熟练，被打的束手束脚的，很快就败下阵来。而且随著拳击走向世界，风格也有英国式，荷兰式，美国式，俄罗斯式甚至日本式的各种变化。\",\"url\":\"http://zhuanlan.zhihu.com/p/602264321\"},{\"slug\":\"2023-02-02-发表今天的想法-就是非常的感谢-感谢这个\",\"year\":\"2023\",\"title\":\"投资感言：感谢时代与机缘，理性扛住主力诱空洗盘\",\"date\":\"2023-02-02\",\"type\":\"想法\",\"L1\":\"社会与文化\",\"L2\":\"杂感随笔\",\"summary\":\"发表今天的想法，就是非常的感谢，感谢这个伟大的时代，感谢我所拥有的各种机会和工具，感谢主力，感谢散户，感谢我的电脑，一直不离不弃地陪我。让我动动手指头，就把将来为公主班准备的世界格斗大奖赛资金赚出来了！今天某J的走势，盘面上明显就是勾引人，让你赶快卖货。这种诱惑和恐惧的力量，实在太强大了。明明我判断这只是中级行情开启的标记，就是忍不住要卖。而且----我就算想耍小聪明，今天想要逃走，也是逃不掉的。\",\"url\":\"https://www.zhihu.com/pins/1604504352521158656\"},{\"slug\":\"2023-02-02-清一新教育的培养目标和方向-专业设置\",\"year\":\"2023\",\"title\":\"清一新教育的培养目标和方向，专业设置！\",\"date\":\"2023-02-02\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"一些家长，对新教育对学生的培养方向是什么，一直搞不清楚，这非常影响家长的未来教育方向判断。下面我再次澄清一下：清一新教育的培养目标和专业设置。今日三校，都是培养这个方向的学生。今日国际学校的个人空间-今日国际学校个人主页-哔哩哔哩视频二：定向专业培养模式公主班：这是清一新教育的专业师资培训班，0学费。三：定向专业培养模式武医班：这是清一新教育定向专业培养传统武术和医学人才的班级，0学费。\",\"url\":\"http://zhuanlan.zhihu.com/p/602738261\"},{\"slug\":\"2023-01-31-这一次-泰方的确被打惨了\",\"year\":\"2023\",\"title\":\"木兰气势打出，征泰难关已过，提前开启“征英”拳击\",\"date\":\"2023-01-31\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"木兰们的气势也打出来了，不仅仅是谭木兰，其他木兰，武士们也受到很大的鼓励，谭木兰率先用出来的太极技术，随后会被其他木兰们快速跟上的。就算放弃正面对抗，才去跑跑战术，降低一点KO率，也会满场被追打，会跑得很难看，再也不能向原来的甜水跑跑一样跑出优雅来了。基于这种基本认识，征泰难关已经完全克服的情况下：我们原定的征泰计划有一点点改变---征泰的同步开启“征英”---今年我们就提前开打拳击赛了。\",\"url\":\"https://www.zhihu.com/pins/1603686573895282689\"},{\"slug\":\"2023-01-29-两木兰外府与地区冠军比赛-获最优秀拳手奖\",\"year\":\"2023\",\"title\":\"两木兰外府与地区冠军比赛，获最优秀拳手奖！\",\"date\":\"2023-01-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"28日晚上是一个泰国的节日，泰国老拳师安排了谭木兰和明晓去外府比赛，对手是地区冠军，据说实力很强，在曼谷打过比赛。所以，有意重点培养的优秀拳手，会被所在拳馆的馆长，安排去打外府的跨府比赛，就让她们有了更广阔的发展空间。拳馆也只会支持有培养前途的优秀拳手去打外府荣誉比赛。安排比赛的老拳师非常自豪获最优秀拳手奖杯父女两人很开心谭木兰感谢泰国教练让对手用扫腿来对付她！\",\"url\":\"http://zhuanlan.zhihu.com/p/601542992\"},{\"slug\":\"2023-01-29-击败世界冠军的泰拳双料全国冠军被木兰KO\",\"year\":\"2023\",\"title\":\"击败世界冠军的泰拳双料全国冠军被木兰KO\",\"date\":\"2023-01-29\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"而且她还拿了泰国电视台拳赛的两个金腰带头衔，相当于全国冠军。更突出的是---前不久，她还刚刚击败了泰拳世界冠军，不过是打满五局点数胜的。但：这个刚刚击败世界冠军的泰国全国冠军，居然就来到泰北的拳场，不用我们花一分钱，就愿意出来对阵谭木兰？等打完了比赛，再查各种资料，再听老拳师提供的信息，才知道原来对手是大神，谭木兰刚KO的看起来弱不禁风的对手，居然是刚刚击败了泰拳世界冠军的泰国全国冠军！\",\"url\":\"http://zhuanlan.zhihu.com/p/601740087\"},{\"slug\":\"2023-01-29-形意为什么需要轻出重收\",\"year\":\"2023\",\"title\":\"形意为什么需要轻出重收？\",\"date\":\"2023-01-29\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"太极征泰第75战，木兰佳慧对阵体重超自己10公斤的对手，就是无意中用了轻出重收，她自己当时不知道。因为这个比赛，是泰方故意用大体重拳手来折腾她的，看她的能耐和底线。佳慧因为心态放松，打了玩，招式一轻出，就快收了。将来她如果比赛中，能够有意维持在这种状态，什么人都可以打，什么人都打不过她，同体重男生也打不过！典型的，佳慧打的相反的比赛，重出，轻收的，就是仑披尼一场比赛。\",\"url\":\"https://www.zhihu.com/question/311619576/answer/2865521421\"},{\"slug\":\"2023-01-27-与泰拳手格斗的战术原则\",\"year\":\"2023\",\"title\":\"与泰拳手格斗的战术原则：\",\"date\":\"2023-01-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"将来也许需要---比如给钱让泰拳的全国冠军愿意跟我们没名气的拳手出战，不用我们的拳手一级一级的打上去，浪费很多时间。其实我并不担心这一点：泰拳的技术，无法搭配我教的战术。一：距离感控制战术原则如果把假设正常泰拳双方，对峙的距离设定是1X。认为我们木兰的格斗方式，就是无技术，也无（泰拳实力），就是力气大的“乱打派”。所以，为了不受泰拳的格斗思维固化，她们只愿意跟泰拳手玩轻接触实战，不玩靶师游戏。\",\"url\":\"http://zhuanlan.zhihu.com/p/601211922\"},{\"slug\":\"2023-01-27-奥运冠军街头卖菜-竞技体育到底是什么\",\"year\":\"2023\",\"title\":\"奥运冠军街头卖菜！竞技体育到底是什么？\",\"date\":\"2023-01-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"普通体育人一生很残忍凄凉，成功者除了像是帕奎奥这种情商好的人，峰值的时候，就退役转行去公务员。其实这些人，不玩体育，不拿冠军，人生也一样凄凉。退役冠军被克扣20万奖金，双脚畸形街头带娃卖菜，贱卖19块奖牌这篇文章，赢得了大把读者的同情和眼泪！「竞技体育其实很残忍」---当然很残忍。因为：推动竞技体育发展背后的力量是金钱！因此，竞技体育，职业体育项目，就是靠取悦本质残忍的人类来获取金钱的。\",\"url\":\"http://zhuanlan.zhihu.com/p/601089717\"},{\"slug\":\"2023-01-27-如何理解张伟丽回忆比赛时说「竞技体育其实\",\"year\":\"2023\",\"title\":\"如何理解张伟丽回忆比赛时说「竞技体育其实很残忍」？究竟什么是体育精神？\",\"date\":\"2023-01-27\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"但体育就是青春饭，你想吃一生，身体条件肯定不允许，因此---你觉得很残忍---因为违背了天道！普通体育人一生很残忍凄凉，成功者除了像是帕奎奥这种情商好的人，峰值的时候，就退役转行去公务员。其他想靠打一些比赛，就靠身体吃一生的运动员，结局肯定会很残忍。这样，再残酷的职业竞技，包括张伟丽的UFC，也不在残酷，一路上走来，总是有鲜花！「竞技体育其实很残忍」---当然很残忍。\",\"url\":\"https://www.zhihu.com/question/579543734/answer/2861621379\"},{\"slug\":\"2023-01-26-今天的三场比赛-有两场打得都很艰苦\",\"year\":\"2023\",\"title\":\"征泰比赛：泰方暗设陷阱换老拳手，两场打得艰苦\",\"date\":\"2023-01-26\",\"type\":\"想法\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"加上前天才打完比赛，体能也跟不上，所以打满五局判输掉。这场比赛明显就是泰方布置的陷阱，有意坑我们的！第二场是陆鸽的对手，也比她至少重5公斤以上。所以我们都认为她会拿下来的，不太担心明晓，我也没去她比赛的拳场看她。大型的正规比赛就这要求，但清迈几个拳场都没有设置体重计，都是让拳手良心自报，但我不相信泰方的自报，必须量体重。今天两场比赛的最后一局，我看到孩子们体能下降后，局面真的很危险，令人很着急。\",\"url\":\"https://www.zhihu.com/pins/1601765848385011712\"},{\"slug\":\"2023-01-25-清一拳手连续作战-今晚开打太极征泰858\",\"year\":\"2023\",\"title\":\"清一拳手连续作战，今晚开打太极征泰85/86/87战\",\"date\":\"2023-01-25\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"刚刚打完一场跨年大战的清一太极拳手们，发挥我军连续作战的精神，今晚继续征战泰拳场！今晚比赛上场的拳手是三位：刘轩宁，陆鸽，明晓，连续作战，开打太极征泰85-87场。但她显然没有放弃复仇的愿望，现在还继续挑战木兰比赛。由于明晓28日，要去外府打泰国北部地区的冠军比赛，今晚并不想打比赛，想要恢复和休息。另外还有一个消息：输给谭木兰的英国拳手玲娜，对比赛结果不服气，找到赛事方要求和谭木兰打二番战。\",\"url\":\"http://zhuanlan.zhihu.com/p/600869098\"},{\"slug\":\"2023-01-25-除了精日和哈韩-还有一个稀有品种叫巴泰\",\"year\":\"2023\",\"title\":\"除了精日和哈韩，还有一个稀有品种叫\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"巴泰\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"！\",\"date\":\"2023-01-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"我们的家长，还把几个泰巴的照片发给我看了，肥墩墩的，估计是肉食动物。不过----我还是给泰巴一点面子，就不放照片出来了。特别是木兰和武士们的粉丝越来越多，将来这些人到处去泰国就地寻找这种珍稀的泰巴收养的话，会严重影响他们的生存和繁殖的。同时竟然还有人问到：你们不是叫今日学堂吗？现在，居然还有一些中国人，要去投靠泰国人，去巴结泰国人，还妄图靠泰国人的手来打压我们捍卫中华荣誉的中国人。\",\"url\":\"http://zhuanlan.zhihu.com/p/600875691\"},{\"slug\":\"2023-01-24-两点过快三点了\",\"year\":\"2023\",\"title\":\"观赛随笔：西方观众盼中国输，国际形象之差令人寒心\",\"date\":\"2023-01-24\",\"type\":\"想法\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"今天总共七场比赛（佳慧因为受伤弃权一场），裁判判的是两负四胜一平。虽然我不认为我们比赛真输了，只是认为打得还不够好。但孩子们都很努力了，我们将来还有很大的改进空间。输赢其实不重要，但是---有点寒心的是：公主班带班教师瑶瑶，一直坐在我身边看比赛。这场判平局的比赛，实在是恶心：对手就差被KO了，一直被打的很惨，毫无还手之力。只是泰拳手真的很耐打，全身被打惨了，居然还能顶得住。\",\"url\":\"https://www.zhihu.com/pins/1601053380130066432\"},{\"slug\":\"2023-01-24-新年三大誓言-十年后-清一派中华武医决胜\",\"year\":\"2023\",\"title\":\"新年三大誓言：十年后，清一派中华武医决胜美国西医！\",\"date\":\"2023-01-24\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"但我看到昨天的拳场上，现场的大群的西洋人充满恶意，就是喜欢看中国人输：看我们打的很漂亮，却一脸的不满意，甚至喝倒彩。另外：誓言一：今年开始，我们发动在格斗赛场上“打脸西洋人”的运动，清一武士决心不要钱，也要去打西洋人！我们中华武士，愿意免费来打西洋拳手。誓言二：今年用三百场战斗和胜利来捍卫中华武术！誓言三：我今天，再发一个新的誓言：继打脸现代格斗后，武士木兰们将继续征战，打脸美国代表的现代医学。\",\"url\":\"http://zhuanlan.zhihu.com/p/600699988\"},{\"slug\":\"2023-01-23-大年初一-从英国人手中夺走金腰带-为国争\",\"year\":\"2023\",\"title\":\"大年初一：从英国人手中夺走金腰带，为国争光\",\"date\":\"2023-01-23\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"这个冠军争夺战，原来是提供给佳慧的机会，将在大年初一和英国拳手NINNA比赛争夺冠军。这个拳手，属于泰国HONGTHONG拳场的签约拳手，是一个英国人。这个英国女拳手，据说实力很强。这个英国拳手表现，赛前也是一副轻松自在，似乎笃定金腰带就是她的了，比赛只是走过过场而已。因为我让佳慧这一次金腰带争夺战，上场就不要给英国人面子，第一局开始就放手死打，第一局KO对手都没问题，不让她拳，不给面子。\",\"url\":\"http://zhuanlan.zhihu.com/p/600582847\"},{\"slug\":\"2023-01-22-2023春节寄语-你不是你的身体\",\"year\":\"2023\",\"title\":\"2023春节寄语----你不是你的身体，创造是你的本性\",\"date\":\"2023-01-22\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"文明与体制\",\"summary\":\"泰国的华人们，会摆出数万元的春节晚宴（却舍不得给中文学校添加一张像样的书桌）。而西方的价值观，普遍认为吃喝很不重要，吃是成本，吃是为了活着，所以越简单越好。可是，身体需要的东西其实很简单，不饿，不冷，就行了，再多就无聊了。甚至万元大餐可能对身体反而是沉重的负担，不符合身体的真正需要。你需要更多的关注你的心：你的心，需要的不是“活下去”（这是身体的需要），你的心需要的是“快乐和自由”。\",\"url\":\"http://zhuanlan.zhihu.com/p/600453126\"},{\"slug\":\"2023-01-19-大年初一-木兰佳慧将与英国拳手争夺清迈地\",\"year\":\"2023\",\"title\":\"大年初一：木兰佳慧将与英国拳手争夺清迈地区51公斤级金腰带\",\"date\":\"2023-01-19\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"（文后附昨天第75战木兰佳慧的实战讲评）今天刚确认的消息：不断击败清迈地区强手，同级别女生已经不敢跟佳慧打，参与60公斤地区冠军金腰带决战的拳手，居然被小10公斤的佳慧打到怀疑人生，赛后很久都没回过神来。正在说，今天就接受到主办方的邀请----一场正好安排在大年初一的【清迈地区金腰带争夺战】这个金腰带的级别，当然比曼谷两大拳场的金腰带含金量要差得多。昨天佳慧的比赛，是一个里程碑，跃升了一级。\",\"url\":\"http://zhuanlan.zhihu.com/p/600124671\"},{\"slug\":\"2023-01-19-如何看待美国56岁老太太刀刺18岁亚裔女\",\"year\":\"2023\",\"title\":\"如何看待美国56岁老太太刀刺18岁亚裔女孩，动机竟然是「以为她是中国人」？\",\"date\":\"2023-01-19\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"陕甘回乱的时候，2000万人汉人死亡-----理由-----仅仅因为是汉人，不是回人，就被杀！你的勤奋，聪明，努力，都是别人眼中的恶行！但也千万不要以为:有些华人不好，只要我是好华人，我就安全了。因为一些素质极其低下的民众，啥都不懂的蠢货（比如这案例里面的56岁白大妈），都会以为，仅仅因为她有一身的白皮，就值得你要象神一样供着她。她如果遭遇任何不如意，都是我们这个低等人类，黄种人，抢了她的机会。\",\"url\":\"https://www.zhihu.com/question/578728925/answer/2852255804\"},{\"slug\":\"2023-01-18-现场全网直播中泰大战-春节9场中国功夫决\",\"year\":\"2023\",\"title\":\"现场全网直播中泰大战：春节9场中国功夫决战泰国职业拳赛\",\"date\":\"2023-01-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"20年前，中泰大战聚焦了全体国人的目光。大量的国内明星拳手被泰国人KO。中泰职业拳手对抗赛，是一群训练1年半到三年多的【今日国际学校】学生，直接面对从小就练泰拳的职业拳手，打职业拳赛。在马上到来的中国春节，我们特别与泰国赛事主办方合作，举办一场重大的中泰格斗项目-----迎春节中华太极决战泰拳职业拳手。这一天，将开打8场正式的比赛，中方拳手将在泰国以客场身份，决战一群久战江湖的泰拳职业拳手。\",\"url\":\"http://zhuanlan.zhihu.com/p/599854388\"},{\"slug\":\"2023-01-16-曹德旺表示-已经捐-100-亿元建世界一\",\"year\":\"2023\",\"title\":\"曹德旺表示，已经捐 100 亿元建世界一流名校，找名师当校长教学生，如何评价这种模式？\",\"date\":\"2023-01-16\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"可惜---投错了地方，我认为未来大概率是一地鸡毛。因为中国教育缺的不是钱，而是办学的理念。前面其实已经有前车之鉴了：清华大神来主办的不差钱，也不缺人脉的西湖大学，还有深圳的南方科大。教育部不放权，你没有自主办学权，无法自主管理，甚至连自主招生的权利都没有，你还办啥一流大学？当今全世界的教育，不都是跟随模仿普鲁士公国的教育模式来的吗？我们国内办的私立高中，以小语种专业教学为重点。\",\"url\":\"https://www.zhihu.com/question/578862450/answer/2847435389\"},{\"slug\":\"2023-01-15-教育是用来分层的-香港开放入籍新规TOP\",\"year\":\"2023\",\"title\":\"教育是用来分层的：香港开放入籍新规TOP100证书\",\"date\":\"2023-01-15\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"千万别相信教育是用来提高“全民素质的工具”。最关键的“人生等级证书”，是18岁的时候，你考上什么等级的大学。社会并不是以你“是否考上大学”来区分你的人生等级的。但：只要你拿到世界前100名大学的毕业证去敲门，作为“高端人才”资格，你一分钱都不用，几天时间就给你批下来入籍资格。所以---教育当然能够改变命运了----只是你，必须要用顶尖名校的入学资格证明，来证明了自己就是“世界顶尖人才”。\",\"url\":\"http://zhuanlan.zhihu.com/p/588534552\"},{\"slug\":\"2023-01-12-高考走捷径-需要付出怎样的代价\",\"year\":\"2023\",\"title\":\"高考走捷径，需要付出怎样的代价？\",\"date\":\"2023-01-12\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"因此----聪明的人，年轻的时候，都在努力要获取这个分层的胜利！以下两个视频，说明了你选择不同的高考路径，想要证明自己是3%的优等人员，会有5倍甚至20倍的难度差距。-哔哩哔哩】【你，真的需要高考吗-哔哩哔哩】国内其实很多家长已经知道这个秘诀了。你甚至只需要付出比国内的公办教育更低的支付，甚至从小学到高中，海外大学，都可以获得免费的方式（没错---免费上欧洲国际名校。\",\"url\":\"http://zhuanlan.zhihu.com/p/598659373\"},{\"slug\":\"2023-01-11-今日国际学校-公主班孩子们的寒假活动\",\"year\":\"2023\",\"title\":\"今日国际学校---公主班孩子们的寒假活动记录\",\"date\":\"2023-01-11\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"学堂运营与课程\",\"summary\":\"今天油漆组只用一天时间，基本完成了天花板的油漆工作；在我们当地团队的协助下，孩子们参与了不同的项目：1：一些学泰语的小公主，居住在我们特别选择的泰国人家里面，全天候跟随泰国人一起生活。我做这种安排的目的，是让泰国小公主融入泰国家庭生活，能够更快学会地道的泰语，比去大学上课强多了。所有学习泰语的小公主，都要去泰国家庭居住一两个月，快速提高泰语水平。让孩子们知道---泰国人自己建房其实很容易！\",\"url\":\"http://zhuanlan.zhihu.com/p/598377402\"},{\"slug\":\"2023-01-07-开打性别大战-创新世界纪录-还是悲剧的诞\",\"year\":\"2023\",\"title\":\"开打性别大战：创新世界纪录？还是悲剧的诞生？\",\"date\":\"2023-01-07\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"在格斗上，女生能够打赢相同级别的男生吗？泰国电影：美丽拳王（依据真实故事改编）真正的性别大战，发生在29年前----1994年，荷兰踢拳女子冠军瑞克尔，号称30亿最强女。现在新消息来了：两位木兰，决定就在这个月底下旬，春节期间，就走上擂台，迎战男职业泰拳手，创造一项由中国人开创的全新世界纪录！愿意用自己的生命和青春来冒险，创造全新的世界纪录。再一次创造的记录-----创新的世界纪录。\",\"url\":\"http://zhuanlan.zhihu.com/p/597125393\"},{\"slug\":\"2022-12-28-前三名大学毕业生占据高层职位的80\",\"year\":\"2022\",\"title\":\"前三名大学毕业生占据高层职位的80%！\",\"date\":\"2022-12-28\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"但这些毕业生却拿走了这个国家80%的高管职位。但我相信985大学的毕业生，拿走了我们国家至少90%以上的高管职位。相反----前三大学的毕业生，无论到哪里似乎都“自带名校光环”，只要做的不是太差，都更容易获得各种晋升的机会！就像韩国前三名的大学，韩国出自三所大学的毕业生占据了韩国高层职位的80%。我猜测：在泰国，可能企业界高层职位的80%，都是泰国北大---朱拉隆功大学的毕业生。\",\"url\":\"http://zhuanlan.zhihu.com/p/594837832\"},{\"slug\":\"2022-12-27-如何18岁成为1的优胜者-获取人生竞争\",\"year\":\"2022\",\"title\":\"如何18岁成为1%的优胜者？获取人生竞争优势？\",\"date\":\"2022-12-27\",\"type\":\"文章\",\"L1\":\"人生哲理\",\"L2\":\"人生意义与幸福\",\"summary\":\"问题一：你愿意去与1000万人竞争获取一个国家的有限职位？还是愿意去跟200万人去竞争，只有20%的竞争者，却能获取全世界提供的上层阶级的入门证？还是去跟一群喜欢躺平的对手PK，不用太费力就轻松获取超越普通人的成功？、问题一：你愿意去与1000万人竞争获取一个国家的有限职位？还是愿意去跟200万人去竞争，只有20%的竞争者，却能获取全世界提供的上层阶级的入门证？竞争的人为什么会这么少？\",\"url\":\"http://zhuanlan.zhihu.com/p/591908398\"},{\"slug\":\"2022-12-27-高考真的能决定你的未来吗\",\"year\":\"2022\",\"title\":\"高考真的能决定你的未来吗？\",\"date\":\"2022-12-27\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"还有另外一种思路----选择参加何种高考，也能决定你的一生！中国的每一个孩子，18岁以前，都必须通过两场重要的考试，来决定将来他一生中在社会上的档次和地位，层级，收入状况等等。这两次考试，决定了将来他可以拥有什么样的工作，社会地位，阶层，以及关系到他要组建什么层次的婚姻和家庭。第二场人生最重要的考试，是18岁的高考。但如果你的孩子，就只是中等资质，你对赛道的不同选择，就很可能决定你孩子的一生成败。\",\"url\":\"https://www.zhihu.com/question/310160711/answer/2818760521\"},{\"slug\":\"2022-12-24-普通生怎样考上清华北大-普通生就是连地\",\"year\":\"2022\",\"title\":\"普通生怎样考上清华北大？（普通生就是连地区重点高中都考不上的学生）\",\"date\":\"2022-12-24\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清华北大，优中选优，只有尖子中的尖子才有可能实现这种目标。清一新教育正在做的事情，也是找到了世界考试的奥秘，正在把普通学生变成“天才学霸”。下面先看考清华北大的案例：转网文：有一个老师叫孙维刚，他是改变了整个中国高中教学法的伟大老师。最后这些学生99%都考上了清华北大，剩下的也都考上了名牌大学。40中考普通学生，38人过重点线，22人考上清华北大，的确是一大奇迹！\",\"url\":\"http://zhuanlan.zhihu.com/p/593696751\"},{\"slug\":\"2022-12-24-普通高中的普通高中生怎么考上清华北大\",\"year\":\"2022\",\"title\":\"普通高中的普通高中生怎么考上清华北大？\",\"date\":\"2022-12-24\",\"type\":\"回答\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"清华北大，优中选优，只有尖子中的尖子才有可能实现这种目标。清一新教育正在做的事情，也是找到了世界考试的奥秘，正在把普通学生变成“天才学霸”。下面先看考清华北大的案例：转网文：有一个老师叫孙维刚，他是改变了整个中国高中教学法的伟大老师。最后这些学生99%都考上了清华北大，剩下的也都考上了名牌大学。40中考普通学生，38人过重点线，22人考上清华北大，的确是一大奇迹！\",\"url\":\"https://www.zhihu.com/question/414663022/answer/2814423326\"},{\"slug\":\"2022-12-18-在泰国参加泰拳比赛是怎样一个体验\",\"year\":\"2022\",\"title\":\"在泰国参加泰拳比赛是怎样一个体验？\",\"date\":\"2022-12-18\",\"type\":\"回答\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"也看了一些疫情前的中国人，在泰国打的一些实战比赛，还有少数的视频，有点意思！看到有中国拳手在林实奈的指导下来打比赛，这个当年比播求更牛的牛人，却被泰拳赛界排斥不能打比赛，只能当教练。基本上算是完胜----甚至没有KO对手，打满五局，被泰国裁判输掉我们的比赛，也是我们的拳手在追着泰国人打。这个马上要参加地区冠军争夺赛的泰国职业拳手，是不是看上去就像不会拳的业余选手一样，上来就当沙包？\",\"url\":\"https://www.zhihu.com/question/23778496/answer/2806105905\"},{\"slug\":\"2022-12-06-张伟丽-碳水化合物是永远的敌人\",\"year\":\"2022\",\"title\":\"张伟丽：碳水化合物是永远的敌人？\",\"date\":\"2022-12-06\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"传武论道与体制\",\"summary\":\"代表中国第一个取得UFC冠军的张伟丽，两者吃的东西，居然完全相反。清迈的公主班，武道馆成员的饮食，是【全碳水化合物】----谷物和一些蔬菜，生菜。碳水化合物据说是重视肌肉力量的格斗手“永远的敌人”。而我们居然完全吃碳水（谷物），按道理，应该不是吃肉的泰拳格斗手的对手。转发张伟丽的媒体报道：综合格斗需要高度自律，肉体和精神都强悍的人才能走得更远。几乎每顿都是牛羊肉，碳水化合物是永远的敌人。\",\"url\":\"http://zhuanlan.zhihu.com/p/586465443\"},{\"slug\":\"2022-12-05-仑披尼赛场木兰佳慧首战攻略-滚动更新至比\",\"year\":\"2022\",\"title\":\"仑披尼赛场木兰佳慧首战攻略（滚动更新至比赛结束）\",\"date\":\"2022-12-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"最重要的比赛，当然就是12月10日周六的佳慧仑披尼首战了。这么短时间（8个多月）就从零起点打到了仑披尼战场，中国拳手没有实现过的目标我们正在实现。中国人至今，尚未有人在泰国取得泰国仑披尼冠军的记录。连比赛机会也没有，他儿子有实力，可以拿清迈冠军，但也没有机会走入仑披尼。​上面视频，是佳慧本场比赛的对手在仑披尼赛场打实战的记录。如果状况调整良好，这一次的仑披尼首战，她给赛场留下一些精彩的记录。\",\"url\":\"http://zhuanlan.zhihu.com/p/589269064\"},{\"slug\":\"2022-12-05-野马分鬃的战术原则-四种变式\",\"year\":\"2022\",\"title\":\"野马分鬃的战术原则，四种变式\",\"date\":\"2022-12-05\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"但不知道是技术差异导致的结果。为了在主动进攻中，有效攻击对手，就必须根据赛场需要，改进训练野马分鬃的各种变式：垫步野马分鬃，换步野马分鬃，飞身野马分鬃，双击野马分鬃！换步野马分鬃：其实就是右势野马分鬃攻击做完后，右脚一落地，就换用左式的野马分鬃继续攻击。此时对付这种人，就只能采取对方退无可退的“飞身野马分鬃”发动攻击了。这四种野马分鬃，目前的泰拳技术，都很难针对性的打反击，也不能随便接招。\",\"url\":\"http://zhuanlan.zhihu.com/p/589328117\"},{\"slug\":\"2022-11-29-为什么近期那么多青少年和青壮年失踪失联\",\"year\":\"2022\",\"title\":\"为什么近期那么多青少年和青壮年失踪失联？\",\"date\":\"2022-11-29\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"早期的人口失踪（几十年前），是国内搞计划生育，一些没有儿子的家庭有【买儿子】的需求。因此，现在的人口失踪，不再是上面说的原因。现在国际暗网的交易对象，往往这些失踪人口是成为国际器官交易的牺牲品。因此—现在基本长成人的女生失踪居多（女生14岁就基本发育完成了）。拐卖儿童的事件反而少了（也有耐心拿过去养几年的吧）。由于中国人也不敢对当地人作什么过头的事情，因为强龙也斗不过地头蛇。\",\"url\":\"https://www.zhihu.com/question/567641754/answer/2779929684\"},{\"slug\":\"2022-11-28-清北怎样考才最容易-人生职业规划如何配套\",\"year\":\"2022\",\"title\":\"清北怎样考才最容易？人生职业规划如何配套教育规划？\",\"date\":\"2022-11-28\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"1：怎样帮孩子规划一份最靠谱，最光明的人生和职业未来？4：如果我家孩子就是想上清北，怎样的考读姿势更容易？作为家里最重要的资产----孩子，当然也要先做好“人生职业规划”，再做好相应配套的“教育规划”！其实，这个教育目标，就是为了实现我为她规划的“人生职业目标”而安排的“配套教育”。最好去做教师，如果没机会，就做“自由职业”，多好的自我教育规划！您说，这种人生和教育规划，不就是找抽吗？\",\"url\":\"http://zhuanlan.zhihu.com/p/587290766\"},{\"slug\":\"2022-11-26-下周开始给泰国拳手发奖金\",\"year\":\"2022\",\"title\":\"下周开始给泰国拳手发奖金：\",\"date\":\"2022-11-26\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"因此，我们下周起，每次参赛，将主动给参赛的泰拳手发奖金，金额相当于他们参加清迈拳赛出场费标准的一倍到五倍（由于泰拳手的女生出场费更低。我们给的奖金，大致相当于普通女拳手的2倍-10倍）。这样的奖励，可以让泰拳手们有一点安慰：虽然被中国人击倒了，但起码拿到了中国人的钱。就怕是现在这种局面，中国人不断击倒泰国拳手，还拿走了泰国人的钱！以下为装在信封里面，与奖金一起发给泰拳手的信件原文。\",\"url\":\"http://zhuanlan.zhihu.com/p/586788239\"},{\"slug\":\"2022-11-25-太极木兰身份缘何尊贵-古语厚德载物的含义\",\"year\":\"2022\",\"title\":\"太极木兰身份缘何尊贵？古语厚德载物的含义？\",\"date\":\"2022-11-25\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"英语突破与升学\",\"summary\":\"昨晚陆鸽成为新木兰，开始走入和一起创造新时代的太极历史。她原来在三语高中学了一半之后，通过西语考试，家庭就决定放弃考海外大学名校的目标，离开高中，申请进入武道馆训练，以用太极打世界冠军作为自己的目标。从此，“太极新木兰”的身份，将伴随她的一生。这就是太极木兰的“无形价值”，极其的尊贵。这就是太极木兰的尊贵：你把耶鲁哈佛都考上了，你苦苦地读完了博士，拿到了头衔，也得不到我说的这种殊荣和尊贵。\",\"url\":\"http://zhuanlan.zhihu.com/p/586571893\"},{\"slug\":\"2022-11-24-佳慧代表中国女拳手首次进入迦南隆拳场比赛\",\"year\":\"2022\",\"title\":\"佳慧代表中国女拳手首次进入迦南隆拳场比赛\",\"date\":\"2022-11-24\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"泰国两大拳场：迦南隆和仑披尼，是泰拳圣地。木兰佳慧应该是第一个进入拳馆比赛的中国女拳手。24日抵达拳馆，进行赛前称重仪式的木兰佳慧佳慧将要25日晚上比赛的拳台。她开始打拳的时候，佳慧还没有出生，她已经打了20年的拳。在曼谷拳场打过几十场比赛，而且还打过拳击赛。我看实战视频是习惯全力出击，后手拳力量超强，一拳就能把对手打倒。这一天的女子重点赛事，是一个泰国女子冠军，也就是佳慧她们常说的冠军姐姐。\",\"url\":\"http://zhuanlan.zhihu.com/p/586372255\"},{\"slug\":\"2022-11-22-征泰37战-泰国金腰带的复仇-木兰痛失大\",\"year\":\"2022\",\"title\":\"征泰37战：泰国金腰带的复仇！木兰痛失大赛奖杯！\",\"date\":\"2022-11-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"11月19日，老拳师带两个木兰去外府参加跨区比赛。木兰的泰国导师，也利用自己在泰拳界的关系，帮木兰们争取到了一些这样的比赛。我认为：两个木兰可以去积极争取参加泰国的高端比赛，但其他大批量的拳手，就只在清迈拳馆练练手，不要出去混了。导致大会的主播说：两个中国木兰拳手都好恐怖！木兰恍然大悟，才明白上次回来后，我说她上次缠拳战就是没有打出水平来，降低了自己的实力，打得难解难分的，才得到了奖杯。\",\"url\":\"http://zhuanlan.zhihu.com/p/585283883\"},{\"slug\":\"2022-11-17-清一武士首秀-太极劈挂掌双双KO泰拳手\",\"year\":\"2022\",\"title\":\"清一武士首秀，太极劈挂掌双双KO泰拳手！\",\"date\":\"2022-11-17\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"昨晚三场比赛，吃素的清一武士压倒性击垮肉食泰拳手！第35战是郭琪第三局，用劈挂掌四掌组合攻击KO了泰拳手。_哔哩哔哩_bilibili各位可以与我们的武士和木兰比赛对比一下，现在我们男女拳手的实战视频都有了，尽管男拳手刚刚首秀。习惯了这种保护下的格斗手们，一旦脱下护具来泰国打。看了视频，郭琪KO对手的技术，是木兰们没有用的技术—太极劈挂掌。不过---由于清一武士的速度力量转换，完全压制泰拳手。\",\"url\":\"http://zhuanlan.zhihu.com/p/584157243\"},{\"slug\":\"2022-11-16-中国老人一天当中大部分时间都在做饭-这是\",\"year\":\"2022\",\"title\":\"中国老人一天当中大部分时间都在做饭，这是中国特有的吗？\",\"date\":\"2022-11-16\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"如果一个人的一生，基本上大多数精力，都用来弄吃的。您认为:这种生活方式，与成天找食吃的动物有啥本质区别？所谓的“人生难得”，就是为了耗费在为自己弄吃的，为子孙后代弄吃的，你认为划算吗？这种所谓的“人生”，每天都在与各种动物的尸块打交道，还把它们弄来吃掉，这种人类，是不是可以称呼他们为食尸族？吃素的中国人，是不是能打赢吃肉的美国人呢？我认为:这和美国人不良生活习惯，高肉食的饮食方式，有很大的关系。\",\"url\":\"https://www.zhihu.com/question/543306881/answer/2761085877\"},{\"slug\":\"2022-11-16-吃素的清一武士今晚首秀VS-美国可不是吃\",\"year\":\"2022\",\"title\":\"吃素的清一武士今晚首秀VS  美国可不是吃素的！\",\"date\":\"2022-11-16\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"第二：更不可思议的是：我们的身体，真的需要“美食”吗？这种所谓的“人生”，每天都在与各种动物的尸块打交道，还把它们弄来吃掉，这种人类，是不是可以称呼他们为食尸族？吃素的中国人，是不是能打赢吃肉的美国人呢？如果美国吃肉这么多，美国人，就是我们清一武士们必打的对象：我们将用事实来证明----吃肉的打不赢吃素的。今晚有三场清一新武士的首秀，其中两位是大家盼望已经很久的男子比赛。\",\"url\":\"http://zhuanlan.zhihu.com/p/583925499\"},{\"slug\":\"2022-11-15-拳经解析-真太极实战有多霸道\",\"year\":\"2022\",\"title\":\"拳经解析：真太极实战有多霸道？\",\"date\":\"2022-11-15\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"但是---太极拳，却是“不防守”的格斗技术。因为:太极拳认为---不需要去关注防守，最好的防守是攻击。因此太极拳讲求“后发制人”，听起来很温柔，其实这就是超级霸道的功夫。也就是根本不管对方怎么打，拳经云：古有闪进打顾之法：何为闪？翻译一下啥意思：古传太极有“闪进打顾之法”，什么是身体的躲闪？看到没：秉承这种作战原则的太极拳，不霸道才怪。各位看到的实践，就是泰拳手的每次扫腿攻击，都被佳慧有效打退。\",\"url\":\"http://zhuanlan.zhihu.com/p/583477000\"},{\"slug\":\"2022-11-14-用武要言-陈长兴武学生涯的实践总结\",\"year\":\"2022\",\"title\":\"用武要言：陈长兴武学生涯的实践总结\",\"date\":\"2022-11-14\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"实战技术解析\",\"summary\":\"同样是陈家人，陈长兴自己认的太极祖师是张三丰祖师，不是他们陈家的。他写的这篇“用武要言”，我认为的确是太极拳的格斗要领，是真懂太极拳的人才能写出来的，字字千金。陈家沟的人，也看陈长兴写的“十要论”，也学“用武要言“，但怎么练出来，是完全不知道的。【陈长兴用武要言】的第一句话，锤自心出，就说出了古传真太极实战的核心。勉强要说，就是陈长兴不想传真家伙，就故意编了一个假的太极拳。\",\"url\":\"http://zhuanlan.zhihu.com/p/583145616\"},{\"slug\":\"2022-11-12-杭州一小学开设爬树课程引发热议-如何看待\",\"year\":\"2022\",\"title\":\"杭州一小学开设爬树课程引发热议，如何看待此事件？\",\"date\":\"2022-11-12\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"当爬树这种最简单的人类行为，一个具有正常的身体协调能力的人，不需要针对性的训练，就可以自然的爬树的动物，都需要通过学校来开设爬树课程，“教”孩子们爬树，把爬树仪式化的时候，这就是这个社会和学校的悲哀：我们已经离自然多远了，可怜的孩子。其实，这种课程“教”出来的孩子。但泰国的大学，却不会把泰语教给外国人，来上学的中国学生，居然大学泰语专业毕业，甚至研究生毕业，都说不好泰语。\",\"url\":\"https://www.zhihu.com/question/565783612/answer/2754910857\"},{\"slug\":\"2022-11-07-缠拳战-泰式微笑背后精心构筑的陷阱\",\"year\":\"2022\",\"title\":\"缠拳战：泰式微笑背后精心构筑的陷阱！\",\"date\":\"2022-11-07\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"当时木兰由于考虑到马上要打缠拳战，因此采取了很保守的打法。但这一次的缠拳战，对方居然请来了是曼谷拳场的签约高手，不会在地区拳赛中打比赛的现役高手，目标就是KO木兰，所以本次比赛，双方场上拼得很猛。观众的反应就是要比后面的男拳手比赛要好看很多，精彩激烈得多。奖励泰国北部在三年来，第一次举办的缠拳比赛中，表现最优秀的最佳拳手。而是泰拳的背后资深人员，老牌泰拳的馆长教练们，对木兰战力的一次摸底测试。\",\"url\":\"http://zhuanlan.zhihu.com/p/581020012\"},{\"slug\":\"2022-11-03-如何评价中国一男子在塞尔维亚殴打女儿被捕\",\"year\":\"2022\",\"title\":\"如何评价中国一男子在塞尔维亚殴打女儿被捕，辩解称「行为在中国可接受」？如何看待「棍棒」教育？\",\"date\":\"2022-11-03\",\"type\":\"回答\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"这种事情，不能简单第下结论，这是中西方文化的冲突。我们不能拿西方的一套，认为中方的家长不文明。也不能拿中方的家长的方式，来说西方的家长对孩子不负责。因为他从小就知道，必须为了自己努力，就算是没出息，也不会赖在家里当啃老族，就算是出去当流浪者，也不会赖在父母身上一辈子。也正因为东方文化有这种互相照顾的文化习俗，中国人才能在一些个体遭到各种灾难的时候，比如失业或者受伤等等，度过艰难的时光。\",\"url\":\"https://www.zhihu.com/question/564160268/answer/2743304682\"},{\"slug\":\"2022-11-03-缠拳战木兰脸会被打成花猫脸吗-赛前视频采\",\"year\":\"2022\",\"title\":\"缠拳战木兰脸会被打成花猫脸吗？赛前视频采访辑录\",\"date\":\"2022-11-03\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"缠拳比赛两天后（2022年11月5日晚）就开打了。4日一早老拳师，就来带佳慧和助手们去外府参与比赛。这种大型的比赛，由于泰国的第8电视台要来现场转播，因此相对正规一些。居然有拳手宁肯去打MMA也不愿意去打缠拳赛。还普遍认为是很优秀的拳手，才去打缠拳比赛的。还有一个男拳手，面对女生的采访，也不怕丢人，公开说不肯去。缠拳比赛采访录像11月4日13:30的后续播报：佳慧以及随行人员已经到达现场了。\",\"url\":\"http://zhuanlan.zhihu.com/p/580215553\"},{\"slug\":\"2022-10-28-史上最强女职业拳手也打不过业余男泰拳手吗\",\"year\":\"2022\",\"title\":\"史上最强女职业拳手也打不过业余男泰拳手吗？\",\"date\":\"2022-10-28\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"更惊人的是：她的KO率居然达到了不可思议的84%，她的出拳力量，甚至超过男格斗手。第一次主办方非常小心地安排了一个普通的业余拳手，让她与一个体型与自己差不多的男业余泰拳手对战，居然被KO了。最终这个世界最强女格斗手，从此放弃了与男拳手比赛的想法：不得不承认女子与男拳手有天然的差距。就算是顶尖的天才级女子职业拳手，都难以和一个普通的业余男拳手抗衡。木兰们打女拳手，也没有打到80%以上的KO率。\",\"url\":\"http://zhuanlan.zhihu.com/p/578154965\"},{\"slug\":\"2022-10-27-泰扫的威力示范-视频扫踢KO集\",\"year\":\"2022\",\"title\":\"泰扫的威力示范（视频扫踢KO集）\",\"date\":\"2022-10-27\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"在油管上，看到这个日本格斗界记录的扫踢视频集，搬运回来给大家看：这个视频，非常典型的表现出了泰扫的威力。虽然这些视频未必是泰拳比赛，覆盖了踢拳，UFC等多种比赛。可见扫踢的威风，对付不懂应对扫踢的其他武术家来说，威胁的确很大。都是专业人士，泰扫要打懂得泰扫威力的人，也不容易了。现代格斗场上，泰扫的威力，主要发挥就是低扫的价值----用快速而难以防御的低扫，去攻击对方的小腿，或者膝盖，大腿等部位。\",\"url\":\"http://zhuanlan.zhihu.com/p/577870915\"},{\"slug\":\"2022-10-20-太极劈挂掌传人-一月后将首战泰拳\",\"year\":\"2022\",\"title\":\"太极劈挂掌传人：一月后将首战泰拳\",\"date\":\"2022-10-20\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"答案是：一个月后，清一武士就将首战泰拳，出征泰国战场，我相信武士们出山之后，也会很快打到泰国的冠军级水平，说不定升级打怪的速度，比木兰们更快。而且---更特别的是：清一武士，不仅仅代表太极门一门一派的代表，他们也将代表其他中华传统武术门派，用这些门派的招牌动作，来完成征战泰拳和现代格斗的任务。首批的清一武士，核心的攻击技术，将使用劈挂掌（拳）的技术，来征战泰拳。厥后，更研发出个人色彩浓厚之劈挂掌。\",\"url\":\"http://zhuanlan.zhihu.com/p/575559083\"},{\"slug\":\"2022-10-11-木兰应战古泰拳缠麻战-泰拳超强杀伤\",\"year\":\"2022\",\"title\":\"木兰应战古泰拳缠麻战----泰拳超强杀伤力比赛\",\"date\":\"2022-10-11\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"只是这一次泰国拳手挑战赛，有点特别---对方挑战她要打的比赛，是女子一般不愿意去打的----古泰拳缠麻战。【泰拳比赛】泰国缠麻战泰拳超强杀伤力比赛KittiSor.Tor.MannakornrayongVsLautaroPereyra|辣椒泰拳馆_哔哩哔哩_bilibili也许泰国对手认为中国人肯定怕这种更残酷的古泰拳比赛，心理上就不适应。木兰表示不愿意打的话，他们就不战而胜了。\",\"url\":\"http://zhuanlan.zhihu.com/p/571290738\"},{\"slug\":\"2022-10-08-太极木兰与泰拳世界冠军之战今晚开打\",\"year\":\"2022\",\"title\":\"太极木兰与泰拳世界冠军之战今晚开打\",\"date\":\"2022-10-08\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"就是预算好时间，开车直接来拳场就开打了。今天陪同前去做拳场助理的是艾拉和小明慧。她们两还有一个任务，就是要陪说话：为木兰安排比赛的泰国70岁老裁判，今天也随同前往。佳慧上场后，应该这样想：对手是泰拳的世界冠军，成名已久。世界冠军比赛观战亲友团到达清莱清莱赛场有一批家长赶去现场观战。今晚是一场非常激烈的比赛，现场的泰国观众，一直是提心吊胆的看到他们的拳手，在本场战斗中打得极其狼狈。\",\"url\":\"http://zhuanlan.zhihu.com/p/571552114\"},{\"slug\":\"2022-10-06-可怕的未来-就在孩子们今天的理想中\",\"year\":\"2022\",\"title\":\"可怕的未来，就在孩子们今天的理想中！\",\"date\":\"2022-10-06\",\"type\":\"文章\",\"L1\":\"社会与文化\",\"L2\":\"社会现象评论\",\"summary\":\"现在孩子们的理想，愿景，以及追求，可能几十年后，就成为主导我们社会的核心力量和现实！这时候，刻苦，钻研，当兵，当科学家，都不再是孩子们的“理想”。由于贫富分化开始产生，物质的丰富和吸引力，开始让孩子们放弃传统的理想，现在，务实的一代人，对于追求物质欲望，生活的档次，追求金钱和富裕的生活，成为孩子们的梦想。网红正成为孩子们的“国民理想”。八成小学生想当网红我一看这结果，就知道中国的未来完了。\",\"url\":\"http://zhuanlan.zhihu.com/p/570986021\"},{\"slug\":\"2022-10-04-富二代-的教育核心和目标是啥\",\"year\":\"2022\",\"title\":\"【富二代】的教育核心和目标是啥？\",\"date\":\"2022-10-04\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"下面是几个包括从澳洲顶尖女子学校退学来新教育的富二代小孩们，正在泰国清迈的英式别墅庄园里面，关起来接受“生活教育”。她们住的蛮好，周边环境很好，安全条件一流。这几个孩子的家长，都是“成功人士”，已经看透了中外体制教育的目标，就是培养工业社会的工具人。一点也不客气这叫做富二代的“劳动教育”。附录：我的弟子明燕来泰国带训这些“富二代”，下面是她的部分汇报内容师好，向您汇报一下近期我们在麦当的情况。\",\"url\":\"http://zhuanlan.zhihu.com/p/570531685\"},{\"slug\":\"2022-10-02-木兰佳慧正式备战世界冠军NAMWAN\",\"year\":\"2022\",\"title\":\"木兰佳慧正式备战世界冠军NAMWAN\",\"date\":\"2022-10-02\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"10月8日的世界冠军一战，对手的实力超强，泰国老拳师虽然替木兰安排了这场比赛，但认为佳慧的实力还不行，技术太差，很担心会被对手KO。泰国拳太成熟了，各种用来对付外国拳手的小手段太多了，连从来没有输过的一个西方的世界格斗冠军，来泰国比赛都吃了大亏，被耍了手段，最终在擂台上被泰拳手轻松击败。也想再打一次，将来两人应该还有二番战的。由于昨天佳慧有主动进入内围战的环节，所以今天我奖励了佳慧两罐鱼罐头吃。\",\"url\":\"http://zhuanlan.zhihu.com/p/570107050\"},{\"slug\":\"2022-09-23-太极征泰第20战-佳慧VS金腰带二番战\",\"year\":\"2022\",\"title\":\"太极征泰第20战  佳慧VS金腰带二番战  KO胜\",\"date\":\"2022-09-23\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"也是木兰佳慧今晚的擂台，与上次被裁判抢走胜利战果的金腰带进行二番战。碧差汶潜佛节庆典拳赛下图是今天，刚刚到达清迈机场的太极征泰第二波队伍。佳慧的赛前照在称重仪式上下图是本场比赛的海报太极征泰第20场比赛海报碧差汶府泰国时间21:06，马上要上擂台了。我唯一想不到的就是：为啥金腰带要主动安排二番战。虽然我认为这是必然的局面，佳慧第二战的时候，金腰带就已经不是对手了。\",\"url\":\"http://zhuanlan.zhihu.com/p/567581085\"},{\"slug\":\"2022-09-23-每月发100万补贴学生上国际今日-可行吗\",\"year\":\"2022\",\"title\":\"每月发100万补贴学生上国际今日，可行吗？\",\"date\":\"2022-09-23\",\"type\":\"文章\",\"L1\":\"新教育\",\"L2\":\"家庭与品格教育\",\"summary\":\"在海外新城建设的【今日国际学校】的首栋教学楼，马上就要交付使用了。今日塾是精英教育，对标的是英国的伊顿公学，名气，历史赶不上别人，教学水平要超过人家。我们学校，在这里进行全日制的寄宿生活和学习，学费是参照正宗国际学校的标准收取的。校园的容量，明年就到1500人了，但我们的编制，只想做500-600人，所以，我们只接受原来预定了学位的家长，才能入读国际今日，或者是优等生才能通过考试入读。\",\"url\":\"http://zhuanlan.zhihu.com/p/567320474\"},{\"slug\":\"2022-09-22-正在批量生产世界冠军“的群体\",\"year\":\"2022\",\"title\":\"正在批量生产\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"世界冠军“的群体\",\"date\":\"2022-09-22\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"一些人去了职场，一些人上了海外的大学，还有其中一部分学生，在三年的武道学习之后，目前正在泰拳赛场上拼搏，打世界冠军，成为新一代文武合一的全才。10月8日，她将奔赴另外一个泰国北部城市清莱，与泰拳女子世界冠军打一场中泰顶尖女拳手的决战。与此同时，她原来母校的学弟学妹们----13-14岁的示范班同学，目前正在进行【文学霸的世界冠军决战】。因此，现在这批孩子们，都正在批量地创造世界记录。\",\"url\":\"http://zhuanlan.zhihu.com/p/566986409\"},{\"slug\":\"2022-09-18-太极征泰第19战-佳慧VS伪娘-裁判又赢\",\"year\":\"2022\",\"title\":\"太极征泰第19战：佳慧VS伪娘，裁判又赢了！\",\"date\":\"2022-09-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"两个木兰的援军---太极征泰第二批队员已经到达清迈。泰国人将迎来更加强大的中国太极军团集体进攻。首批到达清迈的征泰第二梯队女生助战团本月底，大致上国内的第二，第三梯队都要来泰国，总共60多人。佳慧拒绝了，还让一个有权威的泰国老师父来劝说她继续参赛。这一次，木兰佳慧在毫无准备的情况下参赛，如果赛场处理不好，受伤或者被KO，都会非常的影响下一次比赛---9月23日佳慧等了很久机会的复仇二番战！\",\"url\":\"http://zhuanlan.zhihu.com/p/565577054\"},{\"slug\":\"2022-09-18-泰拳世界冠军NamWan约战木兰佳慧\",\"year\":\"2022\",\"title\":\"泰拳世界冠军NamWan约战木兰佳慧\",\"date\":\"2022-09-18\",\"type\":\"文章\",\"L1\":\"武术格斗\",\"L2\":\"太极征泰战报\",\"summary\":\"没想到：原来第二战中“击败”了佳慧的金腰带拳手，居然主动前来约战。没想过，前两天，又有
